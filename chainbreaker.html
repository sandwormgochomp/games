<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CHAINBREAKER</title>
<style>
:root{
  --bg:#0b0e13; --panel:#151a22; --panel2:#1d242f; --line:#2b3441;
  --ink:#dfe6ef; --dim:#8592a3; --gold:#e0b355;
  --edge:#e2564a; --flow:#46b6d9; --ward:#58c07a; --spark:#b06fe0; --void:#97a2b1;
  --hp:#d1493f; --blk:#6fa8dc;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink);
  font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  overflow:hidden; user-select:none;
}
#bg{position:fixed;inset:0;z-index:0}
#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}

/* ---------- top bar ---------- */
#top{
  display:flex;align-items:center;gap:14px;padding:8px 14px;
  background:linear-gradient(#151a22,#10151c);border-bottom:1px solid var(--line);
  flex:0 0 auto;min-height:52px;
}
.brand{font:700 17px/1 Georgia,serif;letter-spacing:3px;color:var(--gold);text-shadow:0 0 12px rgba(224,179,85,.35)}
.brand small{display:block;font:400 9px/1 system-ui;letter-spacing:2px;color:var(--dim);margin-top:3px}
.hpbar{width:190px;height:18px;border:1px solid var(--line);border-radius:9px;background:#0c1016;overflow:hidden;position:relative}
.hpbar i{display:block;height:100%;background:linear-gradient(90deg,#8e2b23,#d1493f);transition:width .3s}
.hpbar span{position:absolute;inset:0;text-align:center;font:600 11px/18px system-ui;text-shadow:0 1px 2px #000}
.chip{padding:3px 9px;border:1px solid var(--line);border-radius:12px;background:#0f141b;font-size:12px;white-space:nowrap}
.chip.g{color:var(--gold);border-color:#4a3d20}
.relics{display:flex;gap:5px;flex-wrap:wrap;margin-left:auto;max-width:46%;justify-content:flex-end}
.relic{
  width:30px;height:30px;border-radius:50%;border:1px solid #4a3d20;
  background:radial-gradient(circle at 32% 28%,#4a3f24,#221b0f);
  display:grid;place-items:center;font-size:15px;cursor:help;
}
.relic:hover{border-color:var(--gold);box-shadow:0 0 10px rgba(224,179,85,.4)}

#stage{flex:1 1 auto;position:relative;overflow:hidden}

/* ---------- generic ---------- */
.btn{
  padding:8px 16px;border:1px solid var(--line);border-radius:6px;background:#1c232d;
  color:var(--ink);font:600 13px system-ui;cursor:pointer;transition:.15s
}
.btn:hover{background:#27303d;border-color:#3d4a5c;transform:translateY(-1px)}
.btn.p{background:linear-gradient(#7a3a2c,#5c2a20);border-color:#8c4534;color:#ffdccf}
.btn.p:hover{background:linear-gradient(#8c4534,#6b3226)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
h2.title{font:700 22px Georgia,serif;letter-spacing:2px;color:var(--gold);margin-bottom:4px}
.sub{color:var(--dim);font-size:12px;margin-bottom:16px}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center}

/* ---------- cards ---------- */
.card{
  width:132px;height:186px;border-radius:9px;position:relative;flex:0 0 auto;
  background:linear-gradient(160deg,#232b36,#161b23);
  border:1px solid var(--line);cursor:pointer;padding:8px;
  transition:transform .13s, box-shadow .13s, border-color .13s;
  display:flex;flex-direction:column;
}
.card .cn{font:600 12px/1.2 Georgia,serif;text-align:center;margin:14px 0 3px;letter-spacing:.3px}
.card .cd{font-size:10.5px;line-height:1.35;color:#c3ccd8;text-align:center;flex:1;overflow:hidden;padding:0 1px}
.card .cd b{color:#fff;font-weight:700}
.card .ct{font-size:8.5px;letter-spacing:1.4px;color:var(--dim);text-align:center;text-transform:uppercase}
.card .cost{
  position:absolute;top:-7px;left:-7px;width:25px;height:25px;border-radius:50%;
  background:#0e1219;border:2px solid var(--line);display:grid;place-items:center;
  font:700 13px system-ui;color:#fff
}
.card .suit{position:absolute;top:0;left:0;right:0;height:4px;border-radius:8px 8px 0 0}
.card.edge{border-color:#5e2b26}.card.edge .suit{background:var(--edge)}.card.edge .cn{color:#f3968d}
.card.flow{border-color:#1f4d60}.card.flow .suit{background:var(--flow)}.card.flow .cn{color:#8fd8f0}
.card.ward{border-color:#245036}.card.ward .suit{background:var(--ward)}.card.ward .cn{color:#94dcae}
.card.spark{border-color:#4a2b63}.card.spark .suit{background:var(--spark)}.card.spark .cn{color:#d5a9f0}
.card.void{border-color:#3a4351}.card.void .suit{background:var(--void)}.card.void .cn{color:#c8d1dc}
.card.up .cn{color:#ffd98a !important}
.card:hover{transform:translateY(-12px) scale(1.05);box-shadow:0 12px 28px #000a;z-index:20}
.card.sel{transform:translateY(-20px) scale(1.07);box-shadow:0 0 0 2px var(--gold),0 14px 30px #000c;z-index:21}
.card.no{opacity:.45;filter:grayscale(.5)}
.card.no:hover{transform:none;box-shadow:none}
.card .sk{position:absolute;bottom:5px;left:0;right:0;text-align:center;font-size:8px;letter-spacing:1px;color:#7a8698}

/* ---------- combat ---------- */
.combat{position:absolute;inset:0;display:flex;flex-direction:column}
.enemies{flex:0 0 auto;display:flex;gap:26px;justify-content:center;align-items:flex-end;padding:14px 12px 0;min-height:190px}
.enemy{width:180px;text-align:center;cursor:default;position:relative;transition:transform .12s}
.enemy.dead{opacity:0;pointer-events:none;transform:scale(.7)}
.enemy.tgt{cursor:crosshair}
.enemy.tgt:hover{transform:translateY(-4px)}
.enemy.tgt:hover .art{box-shadow:0 0 0 2px var(--edge),0 0 22px rgba(226,86,74,.5)}
.enemy.hit .art{animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.enemy .art{
  width:96px;height:96px;margin:0 auto 6px;border-radius:14px;font-size:46px;
  display:grid;place-items:center;background:radial-gradient(circle at 40% 30%,#2a323e,#141920);
  border:1px solid var(--line);transition:box-shadow .15s
}
.enemy .nm{font:600 12px Georgia,serif;margin-bottom:3px}
.ehp{width:150px;height:13px;margin:0 auto;border:1px solid var(--line);border-radius:7px;background:#0c1016;position:relative;overflow:hidden}
.ehp i{display:block;height:100%;background:linear-gradient(90deg,#7d2a24,#c74338);transition:width .25s}
.ehp span{position:absolute;inset:0;text-align:center;font:600 10px/13px system-ui;text-shadow:0 1px 2px #000}
.intent{font-size:12px;color:#ffce7a;margin-bottom:5px;min-height:17px;font-weight:600}
.blkpill{
  display:inline-flex;align-items:center;gap:3px;padding:1px 7px;border-radius:10px;
  background:#1b2d42;border:1px solid #2f5074;color:#a9cff2;font:600 10px system-ui
}
.sts{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin-top:4px;min-height:18px}
.st{padding:1px 6px;border-radius:9px;font:600 10px system-ui;border:1px solid;cursor:help}
.st.bad{background:#3a1f22;border-color:#6b3238;color:#f0a7a7}
.st.good{background:#1f3324;border-color:#356b41;color:#a7f0b8}

.mid{flex:1 1 auto;display:flex;align-items:center;justify-content:space-between;padding:0 18px;min-height:0}
.chainbox{
  text-align:center;padding:10px 20px;border:1px solid var(--line);border-radius:10px;
  background:#11161ecc;min-width:150px
}
.chainbox .cv{font:700 34px Georgia,serif;line-height:1;transition:color .2s,text-shadow .2s}
.chainbox .cl{font-size:9.5px;letter-spacing:2.5px;color:var(--dim);text-transform:uppercase;margin-top:3px}
.chainbox .sl{font-size:11px;margin-top:5px;color:var(--dim)}
.log{
  width:250px;height:150px;overflow:hidden;font-size:11px;color:#93a1b2;
  display:flex;flex-direction:column-reverse;gap:2px;padding:8px;
  background:#0e131acc;border:1px solid var(--line);border-radius:8px
}
.log div{opacity:.85}
.log div:last-child{color:#cfd8e4;opacity:1}

.bottom{flex:0 0 auto;display:flex;align-items:flex-end;gap:10px;padding:0 14px 8px}
.hand{flex:1;display:flex;justify-content:center;gap:8px;min-height:196px;align-items:flex-end;padding-top:14px}
.pile{
  width:66px;height:80px;border:1px dashed #333e4c;border-radius:8px;background:#10151d;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:10px;color:var(--dim);cursor:pointer;flex:0 0 auto
}
.pile b{font-size:19px;color:var(--ink);font-weight:700}
.pile:hover{border-color:var(--gold);color:var(--gold)}
.pbar{
  flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:6px 16px;
  background:#10151cdd;border-top:1px solid var(--line)
}
.energy{
  width:52px;height:52px;border-radius:50%;flex:0 0 auto;
  background:radial-gradient(circle at 35% 30%,#2b4a63,#0f2130);
  border:2px solid #3f6b8c;display:grid;place-items:center;
  font:700 17px system-ui;color:#bfe4ff;box-shadow:0 0 16px rgba(70,182,217,.28)
}
.pblock{
  width:44px;height:44px;flex:0 0 auto;display:grid;place-items:center;
  font:700 15px system-ui;color:#cfe6ff;
  background:#1b2d42;border:1px solid #35597f;
  clip-path:polygon(50% 0,100% 22%,100% 66%,50% 100%,0 66%,0 22%)
}

/* ---------- map ---------- */
.map{position:absolute;inset:0;overflow-y:auto;padding:20px 0 30px}
.maphead{text-align:center;margin-bottom:14px}
.maprows{position:relative;width:520px;margin:0 auto;display:flex;flex-direction:column-reverse;gap:34px}
.maprow{display:flex;justify-content:space-around;position:relative;z-index:2}
.node{
  width:52px;height:52px;border-radius:50%;border:2px solid var(--line);background:#141a22;
  display:grid;place-items:center;font-size:22px;cursor:default;transition:.15s;position:relative
}
.node.able{border-color:var(--gold);cursor:pointer;box-shadow:0 0 14px rgba(224,179,85,.35);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 12px rgba(224,179,85,.3)}50%{box-shadow:0 0 22px rgba(224,179,85,.6)}}
.node.able:hover{transform:scale(1.14);background:#222b36}
.node.done{opacity:.4}
.node.here{border-color:#fff;background:#2a3440}
.node .lb{position:absolute;bottom:-15px;font-size:8.5px;letter-spacing:1px;color:var(--dim);white-space:nowrap}
#mapsvg{position:absolute;inset:0;z-index:1;pointer-events:none}

/* ---------- panels / grids ---------- */
.cardgrid{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;max-width:900px;margin:0 auto}
.scroll{position:absolute;inset:0;overflow-y:auto;padding:26px 20px 30px}
.shoprow{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;align-items:flex-start;margin-bottom:22px}
.buy{display:flex;flex-direction:column;align-items:center;gap:6px}
.price{font:600 12px system-ui;color:var(--gold)}
.price.no{color:#6b7480}
.relicbig{
  width:86px;height:86px;border-radius:50%;font-size:38px;display:grid;place-items:center;
  background:radial-gradient(circle at 32% 28%,#4a3f24,#1e1810);border:2px solid #6b5a2e;cursor:pointer
}
.relicbig:hover{box-shadow:0 0 20px rgba(224,179,85,.5)}
.evtxt{max-width:560px;color:#c5cedb;font-size:13.5px;line-height:1.6;margin-bottom:18px;font-family:Georgia,serif}
.choices{display:flex;flex-direction:column;gap:9px;width:440px;max-width:90vw}
.choice{
  padding:11px 14px;border:1px solid var(--line);border-radius:7px;background:#161d26;
  cursor:pointer;text-align:left;font-size:13px;transition:.13s
}
.choice:hover{background:#1f2833;border-color:var(--gold);transform:translateX(4px)}
.choice small{display:block;color:var(--dim);font-size:11px;margin-top:2px}

#modal{position:fixed;inset:0;background:#000b;z-index:60;display:none;flex-direction:column;align-items:center;padding:24px;overflow-y:auto}
#modal.on{display:flex}
#tip{
  position:fixed;z-index:80;max-width:250px;padding:7px 10px;background:#0b0f15;border:1px solid var(--line);
  border-radius:6px;font-size:11.5px;color:#cfd8e4;pointer-events:none;display:none;box-shadow:0 6px 18px #000a
}
.toast{
  position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:70;
  padding:9px 20px;background:#1b2230;border:1px solid var(--gold);border-radius:20px;
  color:var(--gold);font:600 13px system-ui;pointer-events:none;animation:fade 1.9s forwards
}
@keyframes fade{0%{opacity:0;transform:translate(-50%,-12px)}12%,70%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-14px)}}
.dmgpop{position:absolute;font:700 24px Georgia,serif;pointer-events:none;z-index:40;animation:pop .8s forwards;text-shadow:0 2px 6px #000}
@keyframes pop{0%{opacity:0;transform:translateY(0) scale(.6)}20%{opacity:1;transform:translateY(-14px) scale(1.15)}100%{opacity:0;transform:translateY(-46px) scale(1)}}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#2b3441;border-radius:5px}
::-webkit-scrollbar-track{background:#0d1117}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="app">
  <header id="top"></header>
  <main id="stage"></main>
</div>
<div id="modal"></div>
<div id="tip"></div>
<script>
"use strict";
const HEADLESS = (typeof document === 'undefined');

/* ============================== UTIL ============================== */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let RNG = mulberry32(1);
const ri=(a,b)=>a+Math.floor(RNG()*(b-a+1));
const pick=a=>a[Math.floor(RNG()*a.length)];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(RNG()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pickN(a,n){const c=a.slice();shuffle(c);return c.slice(0,n)}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ============================== CARDS ============================== */
/* s = suit: edge | flow | ward | spark | void   (void never breaks a chain)
   t = atk | skl | pwr        r = start | com | unc | rare
   tg = enemy | none          fx(u,target) where u = upgraded flag        */
const CARDLIST = [
/* ---- EDGE ---- */
{id:'strike',n:'Strike',s:'edge',c:1,t:'atk',r:'start',tg:'enemy',
 d:u=>`Deal <b>${u?9:6}</b> damage.`, fx:(u,t)=>A(t,u?9:6)},
{id:'cleave',n:'Cleave',s:'edge',c:1,t:'atk',r:'com',tg:'none',
 d:u=>`Deal <b>${u?8:5}</b> damage to <b>all</b> enemies.`, fx:u=>AA(u?8:5)},
{id:'riposte',n:'Riposte',s:'edge',c:1,t:'atk',r:'com',tg:'enemy',
 d:u=>`Deal <b>${u?6:4}</b> damage. Gain <b>${u?6:4}</b> Block.`, fx:(u,t)=>{A(t,u?6:4);B(u?6:4)}},
{id:'chainstrike',n:'Chainstrike',s:'edge',c:1,t:'atk',r:'com',tg:'enemy',
 d:u=>`Deal <b>4</b> damage, plus <b>${u?3:2}</b> per Chain.`, fx:(u,t)=>A(t,4+(u?3:2)*C.chain)},
{id:'flurry',n:'Flurry',s:'edge',c:1,t:'atk',r:'com',tg:'enemy',
 d:u=>`Deal <b>2</b> damage <b>${u?4:3}</b> times.`, fx:(u,t)=>{for(let i=0;i<(u?4:3);i++)A(t,2)}},
{id:'pommel',n:'Pommel Blow',s:'edge',c:1,t:'atk',r:'com',tg:'enemy',
 d:u=>`Deal <b>${u?7:5}</b> damage. Draw <b>1</b> card.`, fx:(u,t)=>{A(t,u?7:5);DR(1)}},
{id:'rend',n:'Rend',s:'edge',c:2,t:'atk',r:'unc',tg:'enemy',
 d:u=>`Deal <b>${u?12:9}</b> damage. Apply <b>2</b> Vulnerable.`, fx:(u,t)=>{A(t,u?12:9);ES(t,'vuln',2)}},
{id:'guardbreak',n:'Guardbreak',s:'edge',c:1,t:'atk',r:'unc',tg:'enemy',
 d:u=>`Deal <b>6</b> damage. If the target has Block, deal <b>${u?9:6}</b> more.`,
 fx:(u,t)=>{const b=t&&t.block>0;A(t,6);if(b)A(t,u?9:6)}},
{id:'twinfang',n:'Twin Fang',s:'edge',c:1,t:'atk',r:'unc',tg:'enemy',
 d:u=>`Deal <b>${u?4:3}</b> damage twice. If Chain is 2+, a third time.`,
 fx:(u,t)=>{const n=u?4:3;A(t,n);A(t,n);if(C.chain>=2)A(t,n)}},
{id:'bloodletter',n:'Bloodletter',s:'edge',c:0,t:'atk',r:'unc',tg:'enemy',
 d:u=>`Lose <b>3</b> HP. Deal <b>${u?13:10}</b> damage.`, fx:(u,t)=>{HURT(3);A(t,u?13:10)}},
{id:'executioner',n:'Executioner',s:'edge',c:2,t:'atk',r:'rare',tg:'enemy',
 d:u=>`Deal <b>${u?13:10}</b> damage. Double it if the target is below <b>${u?40:30}%</b> HP.`,
 fx:(u,t)=>{let n=u?13:10;if(t&&t.hp<=t.maxHp*(u?.4:.3))n*=2;A(t,n)}},
{id:'sever',n:'Sever',s:'edge',c:2,t:'atk',r:'rare',tg:'enemy',
 d:u=>`<b>Break:</b> Deal <b>8</b> damage, plus <b>${u?7:5}</b> per Chain.`,
 fx:(u,t)=>{const k=BRK();A(t,8+(u?7:5)*k)}},
{id:'reave',n:'Reave',s:'edge',c:3,t:'atk',r:'unc',tg:'enemy',
 d:u=>`Deal <b>${u?26:20}</b> damage.`, fx:(u,t)=>A(t,u?26:20)},

/* ---- FLOW ---- */
{id:'quickstep',n:'Quickstep',s:'flow',c:0,t:'skl',r:'start',tg:'none',
 d:u=>`Draw <b>${u?2:1}</b> card${u?'s':''}.`, fx:u=>DR(u?2:1)},
{id:'tidaldraw',n:'Tidal Draw',s:'flow',c:1,t:'skl',r:'com',tg:'none',
 d:u=>`Draw <b>${u?3:2}</b> cards.`, fx:u=>DR(u?3:2)},
{id:'slipstream',n:'Slipstream',s:'flow',c:1,t:'skl',r:'unc',tg:'none',
 d:u=>`Gain <b>1</b> Energy. Draw <b>${u?2:1}</b> card${u?'s':''}.`, fx:u=>{C.energy++;DR(u?2:1)}},
{id:'eddy',n:'Eddy',s:'flow',c:1,t:'atk',r:'com',tg:'enemy',
 d:u=>`Deal <b>${u?5:3}</b> damage. Draw <b>2</b> cards.`, fx:(u,t)=>{A(t,u?5:3);DR(2)}},
{id:'momentum',n:'Momentum',s:'flow',c:0,t:'skl',r:'unc',tg:'none',
 d:u=>`Gain <b>${u?2:1}</b> Chain.`, fx:u=>{CHAIN(u?2:1)}},
{id:'secondwind',n:'Second Wind',s:'flow',c:1,t:'skl',r:'com',tg:'none',
 d:u=>`Gain <b>${u?11:8}</b> Block. Draw <b>1</b> card.`, fx:u=>{B(u?11:8);DR(1)}},
{id:'foresight',n:'Foresight',s:'flow',c:1,t:'skl',r:'com',tg:'none',
 d:u=>`Draw <b>2</b> cards. If Chain is 2+, draw <b>${u?2:1}</b> more.`,
 fx:u=>{DR(2);if(C.chain>=2)DR(u?2:1)}},
{id:'rush',n:'Rush',s:'flow',c:1,t:'skl',r:'unc',tg:'none',x:1,
 d:u=>`Gain <b>${u?3:2}</b> Energy. Exhaust.`, fx:u=>{C.energy+=u?3:2}},
{id:'watermirror',n:'Dance of Water',s:'flow',c:2,t:'atk',r:'unc',tg:'none',
 d:u=>`Deal <b>${u?6:4}</b> damage to all enemies. Draw <b>${u?2:1}</b>.`,
 fx:u=>{AA(u?6:4);DR(u?2:1)}},
{id:'overflow',n:'Overflow',s:'flow',c:2,t:'skl',r:'rare',tg:'none',
 d:u=>`<b>Break:</b> Draw <b>1</b> card per Chain${u?' +1':''}. Gain <b>1</b> Energy if Chain was 3+.`,
 fx:u=>{const k=BRK();DR(k+(u?1:0));if(k>=3)C.energy++}},

/* ---- WARD ---- */
{id:'guard',n:'Guard',s:'ward',c:1,t:'skl',r:'start',tg:'none',
 d:u=>`Gain <b>${u?8:5}</b> Block.`, fx:u=>B(u?8:5)},
{id:'brace',n:'Brace',s:'ward',c:0,t:'skl',r:'com',tg:'none',
 d:u=>`Gain <b>${u?5:3}</b> Block.`, fx:u=>B(u?5:3)},
{id:'bulwark',n:'Bulwark',s:'ward',c:2,t:'skl',r:'com',tg:'none',
 d:u=>`Gain <b>${u?16:12}</b> Block.`, fx:u=>B(u?16:12)},
{id:'aegis',n:'Aegis',s:'ward',c:1,t:'skl',r:'com',tg:'none',

/* ============================== COMBAT PRIMITIVES ============================== */
function LIVE(){return C.enemies.filter(e=>e.hp>0)}
function LOG(s){C.log.push(s);if(C.log.length>30)C.log.shift()}
function newSt(){return{str:0,dex:0,weak:0,frail:0,vuln:0,poison:0,thorns:0,ironskin:0,regen:0,conduit:0}}

function A(t,base,o){                       // player attack -> enemy
  o=o||{};
  if(!t||t.hp<=0)t=LIVE()[0];
  if(!t)return;
  let d=base+C.st.str;
  if(C.st.weak>0)d=Math.floor(d*.75);
  if(t.st.vuln>0)d=Math.floor(d*1.5);
  d=Math.max(0,d);
  HITE(t,d,o.pierce);
}
function AA(n){LIVE().slice().forEach(e=>A(e,n))}
function HITE(t,d,pierce){
  if(!pierce){const ab=Math.min(t.block,d);t.block-=ab;d-=ab}
  if(d>0){t.hp-=d;t.flash=1;POP(t,'-'+d,'#ff8a7a')}
  if(t.hp<=0){t.hp=0;LOG(t.n+' is destroyed.')}
}
function B(n){                              // player gains block
  let v=n+C.st.dex;
  if(C.st.frail>0)v=Math.floor(v*.75);
  C.block+=Math.max(0,v);
}
function ES(t,k,v){                         // status onto enemy
  if(!t||t.hp<=0)t=LIVE()[0];
  if(!t)return;
  t.st[k]=(t.st[k]||0)+v;
}
function PS(k,v){                           // status onto player
  C.st[k]=(C.st[k]||0)+v;
  if(k==='ironskin'||k==='dex')RENDER();
}
function DR(n){
  for(let i=0;i<n;i++){
    if(C.hand.length>=10){LOG('Hand is full.');break}
    if(!C.draw.length){
      if(!C.disc.length)break;
      C.draw=shuffle(C.disc.slice());C.disc=[];
    }
    C.hand.push(C.draw.pop());
  }
}
function HEAL(n){RUN.hp=Math.min(RUN.maxHp,RUN.hp+n)}
function HURT(n){RUN.hp-=n;if(RUN.hp<0)RUN.hp=0}
const CHAINCAP=6;
function CHAIN(n){for(let i=0;i<n;i++){if(C.chain<CHAINCAP){C.chain++;chainTrig()}}}
function chainTrig(){
  if(HAS('tuningfork')&&C.chain===4)DR(1);
}
function BRK(){
  const k=C.chain;C.chain=0;C.lastSuit=null;
  if(k>0&&HAS('bloodstone'))HEAL(4);
  if(k>0)LOG('Chain broken at '+k+'.');
  return k;
}
const HAS=r=>RUN&&RUN.relics.indexOf(r)>=0;
function ECOST(inst){
  const def=CARDS[inst.id];
  let c=def.c;
  if(HAS('voidshard')&&def.s==='void')c=Math.max(0,c-1);
  return c;
}

/* ============================== COMBAT FLOW ============================== */
function startCombat(ids,kind){
  C={hand:[],draw:[],disc:[],exh:[],energy:3,maxEnergy:3,block:0,chain:0,lastSuit:null,
     st:newSt(),enemies:[],turn:0,over:0,log:[],played:0,echoUsed:0,kind:kind||'fight'};
  ids.forEach(id=>{
    const E=ENEMIES[id];
    const hp=ri(E.hp[0],E.hp[1]);
    C.enemies.push({id,n:E.n,i:E.i,hp,maxHp:hp,block:0,st:newSt(),intent:null,turn:0,flash:0});
  });
  C.draw=shuffle(RUN.deck.map(c=>c));
  if(HAS('whetstone'))C.st.str+=1;
  if(HAS('thorned'))C.st.thorns+=4;
  if(HAS('ironring'))C.block+=7;
  if(HAS('embervial')){const e=pick(C.enemies);e.st.poison+=4}
  C.enemies.forEach(e=>{e.intent=ENEMIES[e.id].plan(e,0)});
  UI.screen='combat';UI.sel=-1;
  LOG('Combat begins.');
  startTurn();
}
function startTurn(){
  C.turn++;
  C.energy=C.maxEnergy;
  if(C.turn===1&&HAS('prism'))C.energy+=2;
  C.played=0;                 // NB: chain and lastSuit deliberately persist between turns
  C.block=HAS('anvil')?Math.min(C.block,6):0;
  if(C.st.ironskin)B(C.st.ironskin);
  DR(5+(HAS('hourglass')?1:0));
  RENDER();
}
function playCard(i,target){
  if(C.over)return false;
  const inst=C.hand[i];if(!inst)return false;
  const def=CARDS[inst.id];
  const cost=ECOST(inst);
  if(cost>C.energy)return false;
  if(def.tg==='enemy'&&!target)target=LIVE()[0];
  if(def.tg==='enemy'&&!target)return false;

  C.energy-=cost;
  C.hand.splice(i,1);
  UI.sel=-1;

  if(def.s!=='void'){
    if(C.lastSuit===def.s){if(C.chain<CHAINCAP){C.chain++;chainTrig()}}
    else C.chain=HAS('chainlink')?1:0;
    C.lastSuit=def.s;
  }
  if(C.st.conduit&&C.chain>=3)AA(C.st.conduit);
  LOG('You play '+def.n+(inst.up?'+':'')+'.');
  def.fx(inst.up,target);

  if(def.s==='void'&&HAS('echostone')&&!C.echoUsed){
    C.echoUsed=1;LOG('Echo Stone repeats '+def.n+'.');
    def.fx(inst.up,(target&&target.hp>0)?target:LIVE()[0]);
  }

  C.played++;
  if(HAS('lodestone')&&C.played%3===0){
    const t=pick(LIVE()||[]);
    if(t){LOG('Lodestone lashes out.');A(t,5)}
  }

  if(def.x||def.t==='pwr')C.exh.push(inst);else C.disc.push(inst);
  checkEnd();RENDER();
  return true;
}
function endTurn(){
  if(C.over)return;
  UI.sel=-1;
  while(C.hand.length)C.disc.push(C.hand.pop());
  // player end-of-turn ticks
  if(C.st.poison>0){HURT(C.st.poison);LOG('Poison deals '+C.st.poison+' to you.');C.st.poison--}
  if(C.st.regen>0){HEAL(C.st.regen);C.st.regen--}
  ['weak','frail','vuln'].forEach(k=>{if(C.st[k]>0)C.st[k]--});
  if(checkEnd())return;

  // enemy turn
  C.enemies.forEach(e=>{
    if(e.hp<=0||C.over||RUN.hp<=0)return;
    e.block=0;
    enemyAct(e);
    if(e.hp>0&&e.st.poison>0){
      HITE(e,e.st.poison,1);LOG(e.n+' suffers '+e.st.poison+' poison.');e.st.poison--;
    }
    ['weak','frail','vuln'].forEach(k=>{if(e.st[k]>0)e.st[k]--});
    e.turn++;
    if(e.hp>0)e.intent=ENEMIES[e.id].plan(e,e.turn);
  });
  if(checkEnd())return;
  startTurn();
}
function eDmg(e,base){
  let d=base+e.st.str;
  if(e.st.weak>0)d=Math.floor(d*.75);
  if(C.st.vuln>0)d=Math.floor(d*1.5);
  return Math.max(0,d);
}
function eHit(e,base){
  let d=eDmg(e,base);
  const ab=Math.min(C.block,d);C.block-=ab;d-=ab;
  if(d>0){HURT(d);POPP('-'+d,'#ff7a6a')}
  if(C.st.thorns>0&&e.hp>0)HITE(e,C.st.thorns,1);
}
function enemyAct(e){
  const it=e.intent||{k:'atk',d:5,n:1};
  const n=it.n||1;
  switch(it.k){
    case 'atk':for(let i=0;i<n;i++){eHit(e,it.d);if(RUN.hp<=0)break}LOG(e.n+' strikes.');break;
    case 'atkdeb':for(let i=0;i<n;i++)eHit(e,it.d);C.st[it.st]+=it.v;LOG(e.n+' strikes and curses you.');break;
    case 'deb':for(let i=0;i<n;i++)if(it.d)eHit(e,it.d);C.st[it.st]+=it.v;LOG(e.n+' curses you.');break;
    case 'deball':C.st[it.st]+=it.v;LOG(e.n+' fills the air with malice.');break;
    case 'def':e.block+=it.b;LOG(e.n+' braces.');break;
    case 'defatk':e.block+=it.b;eHit(e,it.d);LOG(e.n+' braces and strikes.');break;
    case 'buf':e.st[it.st]+=it.v;LOG(e.n+' grows stronger.');break;
    case 'heal':e.hp=Math.min(e.maxHp,e.hp+it.v);LOG(e.n+' mends itself.');break;
  }
}
function checkEnd(){
  if(RUN.hp<=0){C.over=-1;UI.screen='dead';RENDER();return true}
  if(!LIVE().length){C.over=1;winCombat();return true}
  return false;
}

/* ============================== RUN / MAP ============================== */
function newRun(seed){
  RUN={seed:seed||Math.floor(Math.random()*1e9),hp:75,maxHp:75,gold:99,deck:[],relics:[],
       act:0,map:null,pos:null,row:-1,shopUsed:0,slain:0,turns:0};
  RNG=mulberry32(RUN.seed);
  for(let i=0;i<4;i++)ADDCARD('strike');
  for(let i=0;i<4;i++)ADDCARD('guard');
  ADDCARD('quickstep');ADDCARD('static');
  genMap();
  UI.screen='map';
  RENDER();
}
let UIDN=1;
function ADDCARD(id,up){RUN.deck.push({id,up:up||0,uid:UIDN++})}
function GIVE_RELIC(id){
  if(!id){
    const avail=RELIC_IDS.filter(r=>RUN.relics.indexOf(r)<0);
    if(!avail.length)return null;
    id=pick(avail);
  }
  if(RUN.relics.indexOf(id)>=0)return null;
  RUN.relics.push(id);
  if(id==='mender'){RUN.maxHp+=10;RUN.hp+=10}
  TOAST('Relic acquired: '+RELICS[id].n);
  return id;
}
function HEALRUN(n){RUN.hp=Math.min(RUN.maxHp,RUN.hp+n)}
function HURT_RUN(n){RUN.hp=Math.max(0,RUN.hp-n);if(RUN.hp<=0){UI.screen='dead';RENDER()}}

const ROWPLAN=[
  ['fight'],['fight','fight','event'],['fight','event','shop'],
  ['elite','fight','fight'],['rest','event','rest'],['fight','treasure','elite'],
  ['fight','event','shop'],['rest'],['boss']
];
function genMap(){
  const rows=[];
  for(let r=0;r<ROWPLAN.length;r++){
    const wide=(r===ROWPLAN.length-1)?1:3;
    const row=[];
    for(let c=0;c<wide;c++)row.push({r,c,type:r===ROWPLAN.length-1?'boss':pick(ROWPLAN[r]),links:[],done:0});
    rows.push(row);
  }
  for(let r=0;r<rows.length-1;r++){
    const nxt=rows[r+1];
    rows[r].forEach(nd=>{
      const opts=[];
      for(let d=-1;d<=1;d++){const c=nd.c+d;if(c>=0&&c<nxt.length)opts.push(c)}
      if(!opts.length)opts.push(clamp(nd.c,0,nxt.length-1));   // narrowing row (e.g. the boss)
      shuffle(opts);
      const k=nxt.length===1?1:(RNG()<.45?2:1);
      nd.links=opts.slice(0,Math.min(k,opts.length)).sort();
    });
    // guarantee every next-row node is reachable
    nxt.forEach(nn=>{
      const inb=rows[r].some(nd=>nd.links.indexOf(nn.c)>=0);
      if(!inb){
        let best=rows[r][0];
        rows[r].forEach(nd=>{if(Math.abs(nd.c-nn.c)<Math.abs(best.c-nn.c))best=nd});
        if(Math.abs(best.c-nn.c)<=1)best.links.push(nn.c);
        else nn.type='fight',rows[r][clamp(nn.c,0,rows[r].length-1)].links.push(nn.c);
      }
    });
  }
  RUN.map=rows;RUN.row=-1;RUN.pos=null;
}
function canEnter(nd){
  if(RUN.row<0)return nd.r===0;
  if(nd.r!==RUN.row+1)return false;
  const cur=RUN.map[RUN.row][RUN.pos];
  return cur.links.indexOf(nd.c)>=0;
}
function enterNode(nd){
  if(!canEnter(nd))return;
  RUN.row=nd.r;RUN.pos=nd.c;nd.done=1;
  const A_=ACTS[RUN.act];
  switch(nd.type){
    case 'fight':startCombat(pick(A_.fights),'fight');break;
    case 'elite':startCombat(pick(A_.elites),'elite');break;
    case 'boss':startCombat(A_.boss,'boss');break;
    case 'rest':UI.screen='rest';RENDER();break;
    case 'shop':UI.rerolled=0;UI.shop=makeShop();UI.screen='shop';RENDER();break;
    case 'event':UI.ev=pick(EVENTS);UI.evres=null;UI.screen='event';RENDER();break;
    case 'treasure':UI.screen='treasure';UI.tk=0;RENDER();break;
  }
}
function makeShop(){
  const cards=pickN(POOL.filter(c=>c.r!=='rare'),3).concat(pickN(POOL.filter(c=>c.r==='rare'),1));
  const price=c=>c.r==='com'?ri(45,60):c.r==='unc'?ri(80,100):ri(135,165);
  const avail=RELIC_IDS.filter(r=>RUN.relics.indexOf(r)<0);
  return{
    cards:cards.map(c=>({id:c.id,p:price(c),sold:0})),
    relic:avail.length?{id:pick(avail),p:ri(150,200),sold:0}:null,
    removeP:75,removed:0
  };
}
function winCombat(){
  RUN.slain++;
  if(HAS('compass'))HEALRUN(6);
  let gold=C.kind==='elite'?ri(30,45):C.kind==='boss'?ri(85,110):ri(14,24);
  if(HAS('purse'))gold=Math.round(gold*1.3);
  UI.reward={gold,cards:rewardCards(),relic:(C.kind==='elite'||C.kind==='boss')?1:0,
             taken:0,kind:C.kind,relicTaken:0};
  RUN.gold+=gold;
  UI.screen='reward';RENDER();
}
function rewardCards(){
  const n=3+(HAS('die')?1:0);
  const out=[];
  const roll=()=>{const x=RNG();return x<.06?'rare':x<.34?'unc':'com'};
  const tries=200;
  for(let i=0;i<tries&&out.length<n;i++){
    const r=roll();
    const c=pick(POOL.filter(p=>p.r===r));
    if(c&&!out.some(o=>o.id===c.id))out.push({id:c.id});
  }
  return out;
}
function afterReward(){
  const here=(RUN.row>=0&&RUN.map[RUN.row])?RUN.map[RUN.row][RUN.pos]:null;
  if(here&&here.type==='boss'){
    if(RUN.act>=ACTS.length-1){UI.screen='win';RENDER();return}
    RUN.act++;genMap();
    RUN.maxHp+=10;                                             // breaking a boss hardens you
    RUN.hp=Math.min(RUN.maxHp,RUN.hp+Math.ceil(RUN.maxHp*.55));
    TOAST('You descend into '+ACTS[RUN.act].name);
  }
  UI.screen='map';RENDER();
}
function canUpgrade(inst){return !inst.up}
function upgradeCard(inst){inst.up=1}

/* ============================== UI ============================== */
const $=s=>document.querySelector(s);
const TYPEN={atk:'Attack',skl:'Skill',pwr:'Power'};
const SUITN={edge:'Edge',flow:'Flow',ward:'Ward',spark:'Spark',void:'Void'};
let FLOAT=[];
function POP(t,txt,col){if(HEADLESS)return;FLOAT.push({t:C.enemies.indexOf(t),txt,col})}
function POPP(txt,col){if(HEADLESS)return;FLOAT.push({t:-1,txt,col})}
function TOAST(msg){
  if(HEADLESS)return;
  const d=document.createElement('div');d.className='toast';d.innerHTML=msg;
  document.body.appendChild(d);setTimeout(()=>d.remove(),2000);
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}

function cardHTML(inst,i,st){
  st=st||{};
  const d=CARDS[inst.id],cost=ECOST(inst);
  return `<div class="card ${d.s}${inst.up?' up':''}${st.no?' no':''}${st.sel?' sel':''}" data-ci="${i}"${st.extra||''}>
    <div class="suit"></div><div class="cost">${cost}</div>
    <div class="cn">${d.n}${inst.up?'+':''}</div>
    <div class="ct">${SUITN[d.s]} &middot; ${TYPEN[d.t]}</div>
    <div class="cd">${d.d(inst.up)}</div>
    ${d.x?'<div class="sk">EXHAUST</div>':''}</div>`;
}
function stHTML(st,isP){
  let h='';
  for(const k in ST_INFO){
    const v=st[k]||0;if(!v)continue;
    if(!isP&&(k==='ironskin'||k==='conduit'))continue;
    const inf=ST_INFO[k];
    h+=`<span class="st ${inf[2]}" data-tip="<b>${inf[0]} ${v}</b><br>${inf[1]}">${inf[0].slice(0,4)} ${v}</span>`;
  }
  return h;
}
function intentHTML(e){
  const it=e.intent;if(!it)return '';
  const dm=b=>eDmg(e,b);
  switch(it.k){
    case 'atk':return `<span data-tip="Attacking for ${dm(it.d)}${it.n>1?' , '+it.n+' times':''}.">&#9876; ${dm(it.d)}${it.n>1?' &times;'+it.n:''}</span>`;
    case 'atkdeb':return `<span data-tip="Attack plus ${ST_INFO[it.st][0]}.">&#9876; ${dm(it.d)}${it.n>1?' &times;'+it.n:''} <span style="color:#e28ae2">&#9760;</span></span>`;
    case 'deb':return `<span data-tip="Applies ${ST_INFO[it.st][0]}.">${it.d?'&#9876; '+dm(it.d)+' ':''}<span style="color:#e28ae2">&#9760;</span></span>`;
    case 'deball':return `<span data-tip="Curses you with ${ST_INFO[it.st][0]}."><span style="color:#e28ae2">&#9760; ${ST_INFO[it.st][0]}</span></span>`;
    case 'def':return `<span data-tip="Gaining ${it.b} Block." style="color:#8fc4f5">&#128737; ${it.b}</span>`;
    case 'defatk':return `<span data-tip="Blocking and attacking."><span style="color:#8fc4f5">&#128737;${it.b}</span> &#9876;${dm(it.d)}</span>`;
    case 'buf':return `<span data-tip="Gaining ${it.v} ${ST_INFO[it.st][0]}." style="color:#f5c98f">&#9650; ${ST_INFO[it.st][0]}</span>`;
    case 'heal':return `<span data-tip="Healing ${it.v}." style="color:#8ff0a8">&#10010; ${it.v}</span>`;
  }
  return '';
}

/* ---------- combat ---------- */
function renderCombat(){
  const sel=UI.sel>=0?C.hand[UI.sel]:null;
  const needTgt=sel&&CARDS[sel.id].tg==='enemy';
  const chainCol=C.chain>=4?'#ffd36e':C.chain>=2?'#8fd8f0':'#c3ccd8';
  const enemies=C.enemies.map((e,i)=>`
    <div class="enemy ${e.hp<=0?'dead':''} ${needTgt?'tgt':''} ${e.flash?'hit':''}" data-ei="${i}">
      <div class="intent">${intentHTML(e)}</div>
      <div class="art">${e.i}</div>
      <div class="nm">${e.n}</div>
      <div class="ehp"><i style="width:${Math.max(0,e.hp/e.maxHp*100)}%"></i><span>${e.hp} / ${e.maxHp}</span></div>
      <div class="sts">${e.block>0?`<span class="blkpill" data-tip="Blocks ${e.block} damage.">&#128737; ${e.block}</span>`:''}${stHTML(e.st)}</div>
    </div>`).join('');
  const hand=C.hand.map((c,i)=>cardHTML(c,i,{no:ECOST(c)>C.energy,sel:UI.sel===i})).join('');
  const tight=C.hand.length>7?`style="gap:${Math.max(-34,8-(C.hand.length-7)*13)}px"`:'';
  $('#stage').innerHTML=`
  <div class="combat">
    <div class="enemies">${enemies}</div>
    <div class="mid">
      <div class="chainbox" data-tip="<b>Chain</b><br>Playing a card of the same suit as the last one raises your Chain, to a maximum of ${CHAINCAP}. A different suit resets it to 0. <b>Void</b> cards never change it. The Chain carries across turns &mdash; only ending the combat clears it.">
        <div class="cv" style="color:${chainCol};text-shadow:0 0 ${C.chain*4}px ${chainCol}">${C.chain}<span style="font-size:15px;opacity:.45">/${CHAINCAP}</span></div>
        <div class="cl">Chain</div>
        <div class="sl">${C.lastSuit?'Last: <b style="color:var(--'+C.lastSuit+')">'+SUITN[C.lastSuit]+'</b>':'<i>no link yet</i>'}</div>
      </div>
      <div style="text-align:center">
        <div style="font-size:11px;letter-spacing:2px;color:var(--dim)">TURN ${C.turn}</div>
        ${needTgt?'<div style="color:var(--gold);font-size:12px;margin-top:6px">Choose a target</div>':''}
      </div>
      <div class="log">${C.log.slice(-9).map(l=>'<div>'+l+'</div>').reverse().join('')}</div>
    </div>
    <div class="bottom">
      <div class="pile" id="pdraw" data-tip="Cards left to draw. Reshuffles from the discard when empty."><b>${C.draw.length}</b>Draw</div>
      <div class="hand" ${tight}>${hand}</div>
      <div class="pile" id="pdisc" data-tip="Your discard pile."><b>${C.disc.length}</b>Discard</div>
    </div>
    <div class="pbar">
      <div class="energy" data-tip="Energy. Refills to ${C.maxEnergy} each turn.">${C.energy}<span style="font-size:11px;opacity:.6">/${C.maxEnergy}</span></div>
      ${C.block>0?`<div class="pblock" data-tip="Blocks ${C.block} damage this turn.">${C.block}</div>`:''}
      <div class="sts" style="justify-content:flex-start;flex:1">${stHTML(C.st,1)}</div>
      ${C.exh.length?`<div class="chip" data-tip="Exhausted cards are gone for this combat.">Exhausted ${C.exh.length}</div>`:''}
      <button class="btn p" id="endturn">End Turn &nbsp;<span style="opacity:.6">[E]</span></button>
    </div>
  </div>`;
  C.enemies.forEach(e=>e.flash=0);
}

/* ---------- map ---------- */
const NODEICON={fight:'&#9876;',elite:'&#128293;',boss:'&#128128;',rest:'&#127755;',shop:'&#128176;',event:'&#10067;',treasure:'&#128142;'};
const NODELBL={fight:'FIGHT',elite:'ELITE',boss:'BOSS',rest:'REST',shop:'SHOP',event:'UNKNOWN',treasure:'CACHE'};
function renderMap(){
  const rows=RUN.map.map((row,r)=>`<div class="maprow">${row.map(nd=>{
    const able=canEnter(nd),here=RUN.row===nd.r&&RUN.pos===nd.c;
    return `<div class="node ${able?'able':''} ${here?'here':''} ${nd.r<RUN.row?'done':''}" data-nr="${nd.r}" data-nc="${nd.c}">
      ${NODEICON[nd.type]}<div class="lb">${NODELBL[nd.type]}</div></div>`;
  }).join('')}</div>`).join('');
  $('#stage').innerHTML=`<div class="map">
    <div class="maphead"><h2 class="title">${ACTS[RUN.act].name}</h2>
    <div class="sub">Act ${RUN.act+1} of 3 &nbsp;&middot;&nbsp; choose your path upward</div></div>
    <div class="maprows"><svg id="mapsvg"></svg>${rows}</div></div>`;
  drawMapLines();
}
function drawMapLines(){
  const wrap=$('.maprows'),svg=$('#mapsvg');if(!wrap||!svg)return;
  const wr=wrap.getBoundingClientRect();
  svg.setAttribute('width',wr.width);svg.setAttribute('height',wr.height);
  svg.setAttribute('viewBox',`0 0 ${wr.width} ${wr.height}`);
  const pos={};
  wrap.querySelectorAll('.node').forEach(n=>{
    const b=n.getBoundingClientRect();
    pos[n.dataset.nr+','+n.dataset.nc]={x:b.left-wr.left+b.width/2,y:b.top-wr.top+b.height/2};
  });
  let h='';
  RUN.map.forEach((row,r)=>row.forEach(nd=>nd.links.forEach(c=>{
    const a=pos[r+','+nd.c],b=pos[(r+1)+','+c];if(!a||!b)return;
    const live=RUN.row===r&&RUN.pos===nd.c;
    h+=`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${live?'#e0b355':'#2b3441'}" stroke-width="${live?2.5:1.5}" stroke-dasharray="${live?'':'4 5'}"/>`;
  })));
  svg.innerHTML=h;
}

/* ---------- modals ---------- */
function closeModal(){const m=$('#modal');m.className='';m.innerHTML=''}
function MODALCARDS(title,sub,list,onPick,cancel){
  if(HEADLESS)return;
  const m=$('#modal');m.className='on';
  m.innerHTML=`<h2 class="title" style="margin-top:8px">${title}</h2><div class="sub">${sub}</div>
    <div class="cardgrid">${list.map((c,i)=>cardHTML(c,i,{extra:' data-mk="'+i+'"',no:c.__no})).join('')}</div>
    ${cancel?'<button class="btn" id="mcancel" style="margin-top:18px">Cancel</button>':''}`;
  m.onclick=ev=>{
    const t=ev.target.closest('[data-mk]');
    if(t){const i=+t.dataset.mk;if(list[i].__no)return;closeModal();onPick(list[i],i);return}
    if(ev.target.id==='mcancel'){closeModal();if(cancel)cancel()}
  };
}
function VIEWDECK(){
  const d=RUN.deck.slice().sort((a,b)=>{const A=CARDS[a.id],B=CARDS[b.id];
    return A.s===B.s?A.c-B.c:A.s.localeCompare(B.s)});
  MODALCARDS('YOUR DECK',d.length+' cards',d,()=>closeModal(),()=>{});
}
function VIEWPILE(list,name){
  if(!list.length){TOAST(name+' is empty.');return}
  const d=list.slice().sort((a,b)=>CARDS[a.id].n.localeCompare(CARDS[b.id].n));
  MODALCARDS(name.toUpperCase(),d.length+' cards',d,()=>closeModal(),()=>{});
}
function UPGRADE_PROMPT(done){
  done=done||(()=>{UI.screen='map';RENDER()});
  const list=RUN.deck.filter(canUpgrade);
  if(!list.length){TOAST('Every card is already tempered.');done();return}
  MODALCARDS('TEMPER A CARD','Choose one to upgrade permanently.',list,inst=>{
    upgradeCard(inst);TOAST(CARDS[inst.id].n+' is tempered.');done();
  });
}
function REMOVE_PROMPT(done){
  done=done||(()=>{UI.screen='map';RENDER()});
  if(RUN.deck.length<=1){TOAST('Your deck is too thin.');done();return}
  MODALCARDS('REMOVE A CARD','Choose one to burn out of your deck forever.',RUN.deck.slice(),inst=>{
    const i=RUN.deck.indexOf(inst);if(i>=0)RUN.deck.splice(i,1);
    TOAST(CARDS[inst.id].n+' is burned away.');done();
  });
}
function HOWTO(){
  const m=$('#modal');m.className='on';
  m.innerHTML=`<h2 class="title" style="margin-top:6px">HOW TO PLAY</h2>
  <div style="max-width:660px;font-size:13px;line-height:1.7;color:#c5cedb">
    <p style="margin-bottom:12px">Each turn you draw 5 cards and spend <b style="color:#8fd8f0">3 Energy</b>. Enemies show their intent above their heads &mdash; that is exactly what they will do when you end your turn.</p>
    <p style="margin-bottom:12px"><b style="color:var(--gold)">THE CHAIN.</b> Every card has a suit. Play a card of the <i>same suit</i> as your previous card and your Chain rises by 1, up to <b>6</b>. Play a different suit and it drops straight to 0. The Chain <i>carries across turns</i> &mdash; only the end of combat clears it, so a committed deck can sit at a high Chain for a whole fight.</p>
    <p style="margin-bottom:12px"><b style="color:var(--gold)">BREAK.</b> Cards marked <b>Break</b> spend the whole Chain at once for an effect that scales with it &mdash; then set it to 0. <i>Sever</i> at Chain 6 hits for 38. The question is always whether you can afford to start again.</p>
    <p style="margin-bottom:12px"><b style="color:var(--void)">VOID</b> cards are colourless: they never raise your Chain, but they never break it either. Slip one in to keep a chain alive across an awkward hand.</p>
    <p style="margin-bottom:12px"><b>Suits:</b>
      <span style="color:var(--edge)">Edge</span> cuts,
      <span style="color:var(--flow)">Flow</span> draws and accelerates,
      <span style="color:var(--ward)">Ward</span> defends,
      <span style="color:var(--spark)">Spark</span> curses.</p>
    <p style="margin-bottom:12px"><b>Keys:</b> <b>1&ndash;9</b> play a card &middot; <b>E</b> end turn &middot; <b>Esc</b> deselect / close.</p>
  </div>
  <button class="btn" id="mcancel" style="margin-top:20px">Back</button>`;
  m.onclick=ev=>{if(ev.target.id==='mcancel'||ev.target.id==='modal')closeModal()};
}

/* ---------- master render ---------- */
function RENDER(){
  if(HEADLESS)return;
  renderTop();
  switch(UI.screen){
    case 'title':renderTitle();break;
    case 'map':renderMap();break;
    case 'combat':renderCombat();break;
    case 'reward':renderReward();break;
    case 'rest':renderRest();break;
    case 'shop':renderShop();break;
    case 'event':renderEvent();break;
    case 'treasure':renderTreasure();break;
    case 'dead':renderDead();break;
    case 'win':renderWin();break;
  }
  flushFloats();
}
function flushFloats(){
  if(!FLOAT.length)return;
  const stage=$('#stage'),sr=stage.getBoundingClientRect();
  FLOAT.forEach((f,k)=>{
    let el=f.t<0?$('.pbar'):stage.querySelector('.enemy[data-ei="'+f.t+'"] .art');
    if(!el)return;
    const b=el.getBoundingClientRect();
    const d=document.createElement('div');
    d.className='dmgpop';d.textContent=f.txt;d.style.color=f.col;
    d.style.left=(b.left-sr.left+b.width/2-14+(k%3-1)*16)+'px';
    d.style.top=(b.top-sr.top+10)+'px';
    stage.appendChild(d);setTimeout(()=>d.remove(),820);
  });
  FLOAT=[];
}

/* ============================== INPUT ============================== */
function onStageClick(ev){
  const T=ev.target;
  if(T.closest('#deckbtn')){VIEWDECK();return}
  switch(UI.screen){
    case 'title':{
      if(T.closest('#begin'))newRun();
      if(T.closest('#howto'))HOWTO();
      return}
    case 'combat':{
      if(T.closest('#endturn')){endTurn();return}
      if(T.closest('#pdraw')){VIEWPILE(C.draw,'Draw pile');return}
      if(T.closest('#pdisc')){VIEWPILE(C.disc,'Discard pile');return}
      const cd=T.closest('[data-ci]');
      if(cd){
        const i=+cd.dataset.ci,inst=C.hand[i];
        if(!inst||ECOST(inst)>C.energy)return;
        const def=CARDS[inst.id];
        if(def.tg==='enemy'&&LIVE().length>1){UI.sel=UI.sel===i?-1:i;RENDER()}
        else playCard(i,def.tg==='enemy'?LIVE()[0]:null);
        return;
      }
      const en=T.closest('[data-ei]');
      if(en&&UI.sel>=0){
        const e=C.enemies[+en.dataset.ei];
        if(e&&e.hp>0)playCard(UI.sel,e);
        return;
      }
      if(UI.sel>=0){UI.sel=-1;RENDER()}
      return}
    case 'map':{
      const nd=T.closest('[data-nr]');
      if(nd){const n=RUN.map[+nd.dataset.nr][+nd.dataset.nc];if(canEnter(n))enterNode(n)}
      return}
    case 'reward':{
      const R=UI.reward;
      if(T.closest('#takerelic')){GIVE_RELIC();R.relicTaken=1;RENDER();return}
      const rw=T.closest('[data-rw]');
      if(rw&&!R.taken){ADDCARD(R.cards[+rw.dataset.rw].id);R.taken=1;
        TOAST(CARDS[R.cards[+rw.dataset.rw].id].n+' joins your deck.');RENDER();return}
      if(T.closest('#rwdone')){
        if(R.relic&&!R.relicTaken){GIVE_RELIC();R.relicTaken=1}
        afterReward();
      }
      return}
    case 'rest':{
      if(T.closest('#rheal')){HEALRUN(Math.ceil(RUN.maxHp*.45)+(HAS('sigil')?12:0));UI.screen='map';RENDER()}
      if(T.closest('#rup'))UPGRADE_PROMPT();
      return}
    case 'shop':{
      const S=UI.shop;
      const b=T.closest('[data-buy]');
      if(b){const x=S.cards[+b.dataset.buy];
        if(!x.sold&&RUN.gold>=x.p){RUN.gold-=x.p;x.sold=1;ADDCARD(x.id);TOAST('Bought '+CARDS[x.id].n+'.')}
        RENDER();return}
      if(T.closest('[data-buyrelic]')&&S.relic&&!S.relic.sold&&RUN.gold>=S.relic.p){
        RUN.gold-=S.relic.p;S.relic.sold=1;GIVE_RELIC(S.relic.id);RENDER();return}
      if(T.closest('[data-remove]')&&!S.removed&&RUN.gold>=S.removeP){
        RUN.gold-=S.removeP;S.removed=1;REMOVE_PROMPT(()=>{UI.screen='shop';RENDER()});return}
      if(T.closest('#leaveshop')){UI.screen='map';RENDER()}
      return}
    case 'event':{
      if(T.closest('#evdone')){UI.screen='map';RENDER();return}
      const c=T.closest('[data-ev]');
      if(c&&!UI.evres){
        const res=UI.ev.o[+c.dataset.ev].f();
        if(res===null)return;            // the choice took over the screen
        UI.evres=res;RENDER();
      }
      return}
    case 'treasure':{
      if(T.closest('#opencache')&&!UI.tk){UI.tk=1;GIVE_RELIC();RUN.gold+=ri(20,40);UI.screen='map';RENDER()}
      return}
    case 'dead':case 'win':{if(T.closest('#again')){UI.screen='title';RENDER()}return}
  }
}
function onKey(ev){
  if($('#modal').className==='on'){if(ev.key==='Escape')closeModal();return}
  if(UI.screen!=='combat')return;
  if(ev.key==='e'||ev.key==='E'){endTurn();return}
  if(ev.key==='Escape'&&UI.sel>=0){UI.sel=-1;RENDER();return}
  const n=parseInt(ev.key,10);
  if(n>=1&&n<=9){
    const i=n-1,inst=C.hand[i];if(!inst)return;
    if(ECOST(inst)>C.energy)return;
    const def=CARDS[inst.id];
    if(def.tg==='enemy'&&LIVE().length>1){UI.sel=UI.sel===i?-1:i;RENDER()}
    else playCard(i,def.tg==='enemy'?LIVE()[0]:null);
  }
}

/* ============================== BACKDROP ============================== */
function backdrop(){
  const cv=$('#bg'),ctx=cv.getContext('2d');
  let W,H,parts=[];
  function size(){W=cv.width=innerWidth;H=cv.height=innerHeight}
  size();addEventListener('resize',()=>{size();if(UI.screen==='map')drawMapLines()});
  for(let i=0;i<70;i++)parts.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.9+.4,
    v:Math.random()*.32+.06,d:Math.random()*.3-.15,a:Math.random()*.5+.12});
  (function loop(){
    ctx.clearRect(0,0,W,H);
    const g=ctx.createRadialGradient(W/2,H*1.05,60,W/2,H*.8,Math.max(W,H));
    g.addColorStop(0,'rgba(90,42,26,.30)');g.addColorStop(1,'rgba(11,14,19,0)');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    parts.forEach(p=>{
      p.y-=p.v;p.x+=p.d;
      if(p.y<-6){p.y=H+6;p.x=Math.random()*W}
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);
      ctx.fillStyle='rgba(226,140,74,'+p.a+')';ctx.fill();
    });
    requestAnimationFrame(loop);
  })();
}

/* ============================== BOOT ============================== */
if(!HEADLESS){
  addEventListener('DOMContentLoaded',()=>{
    backdrop();
    $('#stage').addEventListener('click',onStageClick);
    $('#top').addEventListener('click',onStageClick);
    addEventListener('keydown',onKey);
    document.addEventListener('mousemove',e=>{
      const t=e.target.closest('[data-tip]'),tip=$('#tip');
      if(!t){tip.style.display='none';return}
      tip.innerHTML=t.dataset.tip;tip.style.display='block';
      const b=tip.getBoundingClientRect();
      tip.style.left=Math.min(innerWidth-b.width-8,e.clientX+14)+'px';
      tip.style.top=Math.max(6,e.clientY-b.height-12)+'px';
    });
    UI.screen='title';RENDER();
  });
}
{
  /* test surface: harmless in the browser, lets the logic and the render layer be driven headlessly */
  globalThis.__CB={CARDS,CARDLIST,POOL,ENEMIES,ACTS,EVENTS,RELICS,RELIC_IDS,CHAINCAP,
    RENDER,onStageClick,onKey,cardHTML,VIEWDECK,HOWTO,
    get RUN(){return RUN},get C(){return C},get UI(){return UI},
    newRun,startCombat,playCard,endTurn,enterNode,canEnter,genMap,makeShop,
    rewardCards,afterReward,ADDCARD,GIVE_RELIC,HEALRUN,upgradeCard,canUpgrade,
    UPGRADE_PROMPT,REMOVE_PROMPT,ECOST,LIVE,ROWPLAN,
    setRng:s=>{RNG=mulberry32(s)},
    setRun:r=>{RUN=r},setUI:u=>{UI=u}};
}
