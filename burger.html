<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MARKET DAY — a burger you have to earn</title>
<style>
  html,body{margin:0;padding:0;background:#151016;color:#f3e6d8;font-family:'Trebuchet MS',system-ui,sans-serif;overflow:hidden;height:100%}
  #wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{background:#20161f;box-shadow:0 0 60px #000a;max-width:100%;max-height:100%}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv" width="960" height="600"></canvas></div>
<script>
(function(){
'use strict';

/* ─────────────────────────────  CORE  ───────────────────────────── */

var W = 960, H = 600;
var cv = document.getElementById('cv');
var ctx = cv.getContext('2d');

var keys = {}, pressed = {};
var mouse = { x: 0, y: 0, down: false, clicked: false };

function keyName(e){ return (e.key || '').length === 1 ? e.key.toLowerCase() : (e.key || ''); }
document.addEventListener('keydown', function(e){
  var k = keyName(e);
  if (!keys[k]) pressed[k] = true;
  keys[k] = true;
  if (k === ' ' || k.indexOf('Arrow') === 0) e.preventDefault();
});
document.addEventListener('keyup', function(e){ keys[keyName(e)] = false; });
function mpos(e){
  var r = cv.getBoundingClientRect();
  mouse.x = (e.clientX - r.left) * (W / r.width);
  mouse.y = (e.clientY - r.top) * (H / r.height);
}
cv.addEventListener('mousemove', mpos);
cv.addEventListener('mousedown', function(e){ mpos(e); mouse.down = true; mouse.clicked = true; });
cv.addEventListener('mouseup', function(e){ mpos(e); mouse.down = false; });

function kp(k){ return !!pressed[k]; }
function anyPress(){ for (var k in pressed) if (pressed[k]) return true; return false; }
function clearInput(){ pressed = {}; mouse.clicked = false; }

var seed = 1;
function srand(s){ seed = (s >>> 0) || 1; }
function rnd(){
  seed ^= seed << 13; seed >>>= 0;
  seed ^= seed >> 17;
  seed ^= seed << 5;  seed >>>= 0;
  return (seed >>> 0) / 4294967296;
}
function pick(arr){ return arr[Math.floor(rnd() * arr.length)]; }
function clamp(v, a, b){ return v < a ? a : v > b ? b : v; }

/* ─────────────────────────────  DRAW HELPERS  ───────────────────────────── */

function rr(x, y, w, h, r){
  r = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}
function fillRR(x, y, w, h, r, col){ ctx.fillStyle = col; rr(x, y, w, h, r); ctx.fill(); }
function strokeRR(x, y, w, h, r, col, lw){ ctx.strokeStyle = col; ctx.lineWidth = lw || 2; rr(x, y, w, h, r); ctx.stroke(); }
function txt(s, x, y, size, col, align, weight){
  ctx.fillStyle = col || '#f3e6d8';
  ctx.font = (weight || 'bold') + ' ' + (size || 16) + 'px "Trebuchet MS",system-ui,sans-serif';
  ctx.textAlign = align || 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText(s, x, y);
}
function panel(x, y, w, h, r, fill, edge){
  fillRR(x, y, w, h, r, fill || '#2c1f2b');
  strokeRR(x, y, w, h, r, edge || '#4a3446', 2);
}
function shade(col, amt){
  var m = /^#([0-9a-f]{6})$/i.exec(col);
  if (!m) return col;
  var n = parseInt(m[1], 16);
  return 'rgb(' + clamp(((n >> 16) & 255) + amt, 0, 255) + ',' + clamp(((n >> 8) & 255) + amt, 0, 255) + ',' + clamp((n & 255) + amt, 0, 255) + ')';
}

/* ─────────────────────────────  INGREDIENTS  ───────────────────────────── */

var ING = {
  bunB:    { label: 'Bottom Bun', c: '#d9a05b', h: 16, w: 108 },
  patty:   { label: 'Patty',      c: '#7a4a2b', h: 18, w: 116 },
  cheese:  { label: 'Cheese',     c: '#f7c53f', h: 9,  w: 122 },
  sauce:   { label: 'Sauce',      c: '#e8734a', h: 7,  w: 104 },
  onion:   { label: 'Onion',      c: '#f0e2ef', h: 8,  w: 112 },
  pickle:  { label: 'Pickles',    c: '#4e8f3a', h: 9,  w: 100 },
  tomato:  { label: 'Tomato',     c: '#e04a3a', h: 11, w: 114 },
  lettuce: { label: 'Lettuce',    c: '#6cbf4a', h: 12, w: 124 },
  bunT:    { label: 'Top Bun',    c: '#e2b06a', h: 30, w: 112 }
};
var STACK_ORDER = ['bunB', 'patty', 'cheese', 'sauce', 'onion', 'pickle', 'tomato', 'lettuce', 'bunT'];
var VEG = ['lettuce', 'tomato', 'onion'];      /* the farm stand's produce */

function drawLayer(id, cx, y){
  var d = ING[id], w = d.w, h = d.h, x = cx - w / 2;
  if (id === 'bunT') {
    ctx.fillStyle = d.c;
    ctx.beginPath();
    ctx.moveTo(x, y + h);
    ctx.bezierCurveTo(x, y - h * 0.55, x + w, y - h * 0.55, x + w, y + h);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.45)';
    for (var i = 0; i < 7; i++) {
      var sx = x + 12 + (i * (w - 24)) / 6, sy = y + 4 - Math.sin((i / 6) * Math.PI) * h * 0.42;
      ctx.beginPath(); ctx.ellipse(sx, sy, 3.2, 1.9, 0.3, 0, 6.3); ctx.fill();
    }
  } else if (id === 'lettuce') {
    ctx.fillStyle = d.c;
    ctx.beginPath(); ctx.moveTo(x, y + h);
    for (var j = 0; j <= 10; j++) ctx.lineTo(x + (j / 10) * w, y + (j % 2 ? 0 : h * 0.55));
    ctx.lineTo(x + w, y + h); ctx.closePath(); ctx.fill();
  } else if (id === 'cheese') {
    fillRR(x, y, w, h, 2, d.c);
    ctx.fillStyle = d.c;
    ctx.beginPath(); ctx.moveTo(x + 14, y + h); ctx.lineTo(x + 24, y + h + 9); ctx.lineTo(x + 34, y + h); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x + w - 40, y + h); ctx.lineTo(x + w - 30, y + h + 11); ctx.lineTo(x + w - 20, y + h); ctx.fill();
  } else {
    fillRR(x, y, w, h, Math.min(6, h / 2), d.c);
    ctx.fillStyle = 'rgba(0,0,0,.18)';
    rr(x, y + h - 3, w, 3, 1.5); ctx.fill();
  }
}
function drawBurger(list, cx, baseY, scale){
  scale = scale || 1;
  var y = baseY;
  for (var i = 0; i < list.length; i++) {
    var d = ING[list[i]];
    y -= d.h * scale;
    ctx.save();
    ctx.translate(cx, y); ctx.scale(scale, scale); ctx.translate(-cx, -y);
    drawLayer(list[i], cx, y);
    ctx.restore();
  }
}
function drawChip(id, x, y, w, h, got){
  fillRR(x, y, w, h, 4, got ? ING[id].c : 'rgba(255,255,255,.10)');
  if (!got) strokeRR(x, y, w, h, 4, 'rgba(255,255,255,.22)', 1);
}

/* ─────────────────────────────  GAME STATE  ───────────────────────────── */

var G = {
  scene: 'title',
  day: 1, coins: 0, score: 0, best: 0, tokens: 0,
  clock: 0, rush: false,
  orders: [], demand: {}, have: {},
  stalls: [], perks: {},
  player: { x: 480, y: 300, vx: 0, vy: 0, face: 1, step: 0 },
  rival: null,
  activeStall: null, mg: null,
  toast: '', toastT: 0,
  lastResult: null, shop: [], asm: null
};

function toast(s){ G.toast = s; G.toastT = 2.4; }

/* ── tickets ── */
function orderForDay(day){
  var list = ['bunB', 'patty'];
  var extras = ['cheese', 'sauce', 'pickle'].concat(VEG);
  var n = clamp(1 + Math.floor(day / 1.4), 1, extras.length);
  var pool = extras.slice();
  for (var i = 0; i < n; i++) list.push(pool.splice(Math.floor(rnd() * pool.length), 1)[0]);
  list.push('bunT');
  list.sort(function(a, b){ return STACK_ORDER.indexOf(a) - STACK_ORDER.indexOf(b); });
  return list;
}
function isRushDay(day){ return day >= 4 && day % 4 === 0; }
function computeDemand(){
  var d = {};
  for (var i = 0; i < G.orders.length; i++)
    for (var j = 0; j < G.orders[i].length; j++) {
      var id = G.orders[i][j];
      d[id] = (d[id] || 0) + 1;
    }
  return d;
}
function has(id){ return G.have[id] || 0; }
function wants(id){ return G.demand[id] || 0; }
function grant(id, n){ G.have[id] = has(id) + (n || 1); }
function haveAll(){
  for (var id in G.demand) if (has(id) < G.demand[id]) return false;
  return true;
}
function needed(stall){
  var out = [];
  for (var i = 0; i < stall.gives.length; i++) {
    var id = stall.gives[i];
    if (has(id) < wants(id)) out.push(id);
  }
  return out;
}
function stallDone(stall){ return !stall.token && needed(stall).length === 0; }

/* ── stalls, moods, locks ── */
function makeStalls(){
  return [
    { id: 'bake',   name: 'BAKER',       sub: 'buns',         mg: 'stack',  gives: ['bunB', 'bunT'], c: '#c98b4b', x: 40,  y: 96,  w: 150, h: 96 },
    { id: 'meat',   name: 'BUTCHER',     sub: 'patty',        mg: 'grill',  gives: ['patty'],        c: '#a9414a', x: 405, y: 96,  w: 150, h: 96 },
    { id: 'dairy',  name: 'DAIRY',       sub: 'cheese',       mg: 'melt',   gives: ['cheese'],       c: '#d8b93f', x: 770, y: 96,  w: 150, h: 96 },
    { id: 'brine',  name: 'BRINERY',     sub: 'pickles',      mg: 'brine',  gives: ['pickle'],       c: '#4e8f3a', x: 40,  y: 262, w: 150, h: 92 },
    { id: 'cond',   name: 'SAUCERY',     sub: 'sauce',        mg: 'sauce',  gives: ['sauce'],        c: '#d9663f', x: 770, y: 262, w: 150, h: 92 },
    { id: 'farm',   name: 'FARM STAND',  sub: 'the greens',   mg: 'dodge',  gives: VEG.slice(),      c: '#4e8f4a', x: 240, y: 400, w: 150, h: 78 },
    { id: 'haggle', name: 'THE HAGGLER', sub: 'skip tokens',  mg: 'haggle', gives: [],               c: '#7a5aa8', x: 570, y: 400, w: 150, h: 78, token: true }
  ];
}

var MOODS = {
  normal:    { label: '',            col: '#9d8296' },
  generous:  { label: 'GENEROUS',    col: '#8fd07a' },
  fussy:     { label: 'FUSSY',       col: '#ff9b4a' },
  closing:   { label: 'CLOSING SOON', col: '#ff6b5e' }
};

function assignMoods(day){
  var pool = G.stalls.filter(function(s){ return !s.token; });
  for (var i = 0; i < G.stalls.length; i++) G.stalls[i].mood = 'normal';
  if (day < 2) return;
  var nMood = day < 5 ? 1 : 2;
  for (var m = 0; m < nMood; m++) {
    var s = pool[Math.floor(rnd() * pool.length)];
    if (!s || s.mood !== 'normal') continue;
    s.mood = (rnd() < 0.45 || G.perks.regular) ? 'generous' : 'fussy';
  }
  /* at most one stall shuts early, and never before day 3 */
  if (day >= 3 && rnd() < 0.7) {
    var cands = pool.filter(function(s){ return s.mood !== 'closing'; });
    var c = cands[Math.floor(rnd() * cands.length)];
    if (c) { c.mood = 'closing'; c.closesAt = G.clock * (0.42 + rnd() * 0.18); }
  }
}
function stallLocked(s){
  if (s.mood === 'closing' && G.clock <= (s.closesAt || 0)) return 'CLOSED';
  if (s.lockUntil != null && G.clock > s.lockUntil) return 'BOUGHT OUT';
  return null;
}
function difficultyMul(s){ return s && s.mood === 'fussy' ? 1.3 : 1; }
function zoneMul(s){ return s && s.mood === 'fussy' ? 0.75 : 1; }

/* ── the rival shopper ── */
function makeRival(day){
  if (day < 3) return null;
  return { x: 900, y: 540, tx: 900, ty: 540, target: null, wait: 10 - Math.min(4, day * 0.4), holding: 0 };
}
function updateRival(dt){
  var r = G.rival;
  if (!r) return;
  if (r.target) {
    var s = r.target;
    var gx = s.x + s.w / 2, gy = s.y + s.h + 26;
    var dx = gx - r.x, dy = gy - r.y, d = Math.hypot(dx, dy);
    if (d > 4) {
      var sp = 120 * dt;
      r.x += (dx / d) * Math.min(sp, d);
      r.y += (dy / d) * Math.min(sp, d);
    } else {
      if (!stallDone(s) && !stallLocked(s)) {
        s.lockUntil = G.clock - (13 + Math.min(6, G.day)) * (G.perks.elbows ? 0.5 : 1);
        toast('The rival bought out the ' + s.name + '!');
      }
      r.target = null;
      r.wait = Math.max(9, 20 - G.day);
    }
    return;
  }
  r.wait -= dt;
  if (r.wait <= 0) {
    var open = G.stalls.filter(function(s){ return !s.token && !stallDone(s) && !stallLocked(s); });
    if (!open.length) { r.wait = 6; return; }
    r.target = open[Math.floor(rnd() * open.length)];
  }
}

/* ── day setup ── */
function startDay(day){
  G.day = day;
  G.rush = isRushDay(day);
  G.orders = [orderForDay(day)];
  if (G.rush) G.orders.push(orderForDay(day));
  G.demand = computeDemand();
  G.have = {};
  G.stalls = makeStalls();
  G.clock = Math.max(150, 250 - (day - 1) * 12) * (G.perks.slowClock ? 1.25 : 1) * (G.rush ? 1.35 : 1);
  assignMoods(day);
  G.rival = makeRival(day);
  G.player.x = 480; G.player.y = 300; G.player.vx = 0; G.player.vy = 0;
  G.activeStall = null; G.mg = null; G.asm = null;
  if (G.perks.freeVeg) for (var i = 0; i < VEG.length; i++) if (wants(VEG[i])) grant(VEG[i], wants(VEG[i]));
  setScene('hub');
}

var scenes = {};
function setScene(name){
  G.scene = name;
  if (scenes[name] && scenes[name].enter) scenes[name].enter();
}

/* ─────────────────────────────  TITLE  ───────────────────────────── */

scenes.title = {
  update: function(){
    if (anyPress() || mouse.clicked) { G.coins = 0; G.score = 0; G.tokens = 0; G.perks = {}; srand(12345); startDay(1); }
  },
  draw: function(){
    ctx.fillStyle = '#20161f'; ctx.fillRect(0, 0, W, H);
    for (var i = 0; i < 40; i++) {
      ctx.fillStyle = 'rgba(255,200,120,.05)';
      ctx.fillRect((i * 137) % W, (i * 89) % H, 3, 3);
    }
    drawBurger(['bunB', 'patty', 'cheese', 'pickle', 'tomato', 'lettuce', 'bunT'], 480, 322, 1.4);
    txt('MARKET DAY', 480, 96, 54, '#ffd18a', 'center');
    txt('a burger you have to earn', 480, 136, 20, '#c8a7bd', 'center', 'normal');
    txt('Seven stalls. Seven games. None of them will just sell to you.', 480, 400, 17, '#f3e6d8', 'center', 'normal');
    txt('WASD walk  ·  E play a stall  ·  T spend a skip token  ·  R retry', 480, 430, 15, '#9d8296', 'center', 'normal');
    if (G.best) txt('best score  ' + G.best, 480, 466, 16, '#8fd07a', 'center');
    txt('press any key', 480, 530, 20, ((Date.now() / 400) | 0) % 2 ? '#ffd18a' : '#7b5f74', 'center');
  }
};

/* ─────────────────────────────  HUB  ───────────────────────────── */

var CART = { x: 415, y: 505, w: 130, h: 58 };
function cartCentre(){ return { x: CART.x + CART.w / 2, y: CART.y + CART.h / 2 }; }

function nearStall(){
  var p = G.player, best = null, bd = 1e9;
  for (var i = 0; i < G.stalls.length; i++) {
    var s = G.stalls[i];
    var d = Math.hypot(p.x - (s.x + s.w / 2), p.y - (s.y + s.h + 26));
    if (d < 72 && d < bd) { bd = d; best = s; }
  }
  return best;
}
function nearCart(){
  var c = cartCentre();
  return Math.hypot(G.player.x - c.x, G.player.y - c.y) < 78;
}

scenes.hub = {
  update: function(dt){
    var p = G.player, sp = 255;
    var dx = (keys['d'] || keys['ArrowRight'] ? 1 : 0) - (keys['a'] || keys['ArrowLeft'] ? 1 : 0);
    var dy = (keys['s'] || keys['ArrowDown'] ? 1 : 0) - (keys['w'] || keys['ArrowUp'] ? 1 : 0);
    var m = Math.hypot(dx, dy) || 1;
    p.vx = (dx / m) * sp; p.vy = (dy / m) * sp;
    if (dx) p.face = dx > 0 ? 1 : -1;
    p.x = clamp(p.x + p.vx * dt, 24, W - 24);
    p.y = clamp(p.y + p.vy * dt, 100, H - 26);
    p.step += (Math.abs(p.vx) + Math.abs(p.vy)) * dt * 0.05;

    for (var i = 0; i < G.stalls.length; i++) {
      var s = G.stalls[i];
      if (p.x > s.x - 14 && p.x < s.x + s.w + 14 && p.y > s.y - 10 && p.y < s.y + s.h + 8) p.y = s.y + s.h + 8;
    }

    var near = nearStall();
    if (near) {
      var lock = stallLocked(near);
      if (kp('e')) {
        if (lock) toast(near.name + ' — ' + lock);
        else { G.activeStall = near; startMinigame(near.mg); return; }
      }
      if (kp('t') && !lock && !near.token && !stallDone(near) && G.tokens > 0) {
        G.tokens--;
        G.activeStall = near;
        var need = needed(near);
        for (var k = 0; k < need.length; k++) grant(need[k]);
        toast('Token spent — ' + need.map(function(n){ return ING[n].label; }).join(' + '));
      }
    } else if (nearCart() && kp('e')) {
      if (haveAll()) { setScene('assemble'); return; }
      toast("You're still missing something.");
    }

    updateRival(dt);
    G.clock -= dt;
    if (G.clock <= 0) { G.clock = 0; setScene('assemble'); }
  },
  draw: function(){
    ctx.fillStyle = '#33242f'; ctx.fillRect(0, 0, W, H);
    for (var gy = 90; gy < H; gy += 34)
      for (var gx = -20; gx < W; gx += 46) {
        ctx.fillStyle = ((gx + gy) / 2 | 0) % 2 ? '#3a2a35' : '#372733';
        ctx.fillRect(gx + (gy % 68 ? 22 : 0), gy, 44, 32);
      }

    var ready = haveAll();
    fillRR(CART.x, CART.y, CART.w, CART.h, 8, '#5a3a2f');
    fillRR(CART.x, CART.y, CART.w, 14, 6, ready ? '#8fd07a' : '#7a5040');
    txt('YOUR CART', CART.x + CART.w / 2, CART.y + 30, 14, '#f3e6d8', 'center');
    txt(ready ? 'E to build' : 'gather first', CART.x + CART.w / 2, CART.y + 48, 12, ready ? '#8fd07a' : '#9d8296', 'center', 'normal');

    for (var i = 0; i < G.stalls.length; i++) drawStall(G.stalls[i]);
    if (G.rival) drawRival(G.rival);
    drawPlayer(G.player);

    var near = nearStall();
    if (near) {
      var lock = stallLocked(near), need = needed(near), lbl;
      if (lock) lbl = near.name + ' — ' + lock;
      else if (near.token) lbl = 'E — haggle for a skip token';
      else if (!need.length) lbl = 'E — play again for coins';
      else lbl = 'E — play for ' + need.map(function(n){ return ING[n].label; }).join(' + ') + (G.tokens ? '   ·   T — spend a token' : '');
      var bx = clamp(near.x + near.w / 2, 190, W - 190);
      panel(bx - 185, near.y + near.h + 40, 370, 30, 8, 'rgba(20,12,18,.92)', lock ? '#ff6b5e' : '#ffd18a');
      txt(lbl, bx, near.y + near.h + 55, 14, lock ? '#ff6b5e' : '#ffd18a', 'center');
    } else if (nearCart()) {
      panel(CART.x + CART.w / 2 - 150, CART.y - 40, 300, 28, 8, 'rgba(20,12,18,.92)', ready ? '#8fd07a' : '#ff6b5e');
      txt(ready ? 'E — build the order' : 'still missing ingredients', CART.x + CART.w / 2, CART.y - 26, 14, ready ? '#8fd07a' : '#ff6b5e', 'center');
    }
    drawHUD();
  }
};

function drawStall(s){
  var lock = stallLocked(s), done = stallDone(s);
  ctx.globalAlpha = lock ? 0.45 : 1;
  fillRR(s.x, s.y + 34, s.w, s.h - 6, 6, '#6b4630');
  fillRR(s.x - 8, s.y + s.h + 16, s.w + 16, 11, 5, '#523424');
  var stripes = 6;
  for (var i = 0; i < stripes; i++) {
    ctx.fillStyle = i % 2 ? s.c : shade(s.c, 45);
    var x0 = s.x - 10 + i * (s.w + 20) / stripes, x1 = s.x - 10 + (i + 1) * (s.w + 20) / stripes;
    ctx.beginPath(); ctx.moveTo(x0, s.y); ctx.lineTo(x1, s.y); ctx.lineTo(x1, s.y + 26); ctx.lineTo(x0, s.y + 26);
    ctx.closePath(); ctx.fill();
  }
  txt(s.name, s.x + s.w / 2, s.y + 46, 14, '#ffe9c9', 'center');
  txt(s.sub, s.x + s.w / 2, s.y + 62, 11, '#e0c3a8', 'center', 'normal');

  var need = needed(s), cw = 18, tot = need.length * (cw + 4);
  for (var j = 0; j < need.length; j++) drawChip(need[j], s.x + s.w / 2 - tot / 2 + j * (cw + 4), s.y + 74, cw, 11, true);
  if (s.token) txt('★ tokens', s.x + s.w / 2, s.y + 80, 12, '#d9c2ff', 'center', 'normal');
  else if (done) txt('✓', s.x + s.w / 2, s.y + 80, 17, '#8fd07a', 'center');
  ctx.globalAlpha = 1;

  var mood = MOODS[s.mood] || MOODS.normal;
  if (s.mood === 'closing' && !lock) {
    var left = Math.max(0, G.clock - (s.closesAt || 0));

  if (lock) {

    txt(lock, s.x + s.w / 2, s.y + 53, 12, '#ff6b5e', 'center');
  }
}

/* ─────────────────────────────  MINIGAME FRAME  ───────────────────────────── */

var MG = {};

function startMinigame(kind){
  G.mg = { kind: kind, t: 0, over: false, won: false, endT: 0, bonus: 0 };
  MG[kind].init(G.mg);
  setScene('mg');
}
function finishMinigame(won){
  var m = G.mg;
  if (!m || m.over) return;
  m.over = true; m.won = won; m.endT = 0;
  var s = G.activeStall;
  var mult = (s && s.mood === 'generous') ? 2 : 1;
  if (won) {
    if (s && s.token) {
      var got = 1 + (m.bonus > 0 ? 1 : 0);
      G.tokens += got;
      m.tokensWon = got;
    } else if (s) {
      var need = needed(s);
      for (var i = 0; i < need.length; i++) grant(need[i]);
      m.granted = need;
    }
    G.coins += (8 + (m.bonus || 0)) * mult;
    G.score += 30 + (m.bonus || 0) * 3;
  } else {
    G.coins += 1;
  }
}

scenes.mg = {
  update: function(dt){
    var m = G.mg;
    G.clock -= dt;
    if (G.clock <= 0) { G.clock = 0; setScene('assemble'); return; }
    m.t += dt;
    if (!m.over) MG[m.kind].update(m, dt);
    else {
      m.endT += dt;
      if (m.endT > 0.5 && (anyPress() || mouse.clicked)) {
        if (kp('r')) { startMinigame(m.kind); return; }
        setScene('hub');
      }
    }
  },
  draw: function(){
    ctx.fillStyle = '#20161f'; ctx.fillRect(0, 0, W, H);
    MG[G.mg.kind].draw(G.mg);
    drawHUD();
    if (G.mg.over) {
      ctx.fillStyle = 'rgba(12,8,12,.84)'; ctx.fillRect(0, 0, W, H);
      var won = G.mg.won;
      txt(won ? 'GOT IT' : 'RUINED', 480, 250, 54, won ? '#8fd07a' : '#ff6b5e', 'center');
      if (won) {
        if (G.mg.tokensWon) txt('★ ' + G.mg.tokensWon + ' skip token' + (G.mg.tokensWon > 1 ? 's' : ''), 480, 300, 22, '#d9c2ff', 'center');
        else txt((G.mg.granted || []).map(function(n){ return ING[n].label; }).join('  +  ') || 'coins', 480, 300, 22, '#ffd18a', 'center');
      } else txt('press R to try again', 480, 300, 20, '#ffd18a', 'center');
      txt('any other key — back to the market', 480, 348, 16, '#9d8296', 'center', 'normal');
    }
  }
};
function mgHeader(title, hint){
  var s = G.activeStall, mood = s && MOODS[s.mood];

/* ── MG 1 — GRILL (butcher) ── */
MG.grill = {
  init: function(m){
    var s = G.activeStall;
    m.total = 5; m.idx = 0; m.good = 0;
    m.stage = 0; m.pos = 0; m.dir = 1;
    m.baseSpeed = (0.95 + G.day * 0.07) * difficultyMul(s);
    m.speed = m.baseSpeed;
    m.zone = (G.perks.wideZone ? 0.20 : 0.15) * zoneMul(s);
    m.zc = 0.35 + rnd() * 0.3;
    m.flash = 0; m.flashCol = '#fff'; m.results = [];
  },
  sweep: function(m){ m.pos = 0; m.dir = 1; m.zc = 0.25 + rnd() * 0.5; m.speed = m.baseSpeed * (m.stage === 1 ? 1.25 : 1); },
  update: function(m, dt){
    m.flash = Math.max(0, m.flash - dt * 3);
    m.pos += m.dir * m.speed * dt;
    if (m.pos > 1) { m.pos = 1; m.dir = -1; }
    if (m.pos < 0) { m.pos = 0; m.dir = 1; }
    if (kp(' ') || mouse.clicked) {
      if (Math.abs(m.pos - m.zc) < m.zone / 2) {
        m.flash = 1; m.flashCol = '#8fd07a';
        if (m.stage === 0) { m.stage = 1; MG.grill.sweep(m); }
        else { m.good++; m.results.push(1); m.idx++; m.stage = 0; MG.grill.sweep(m); }
      } else {
        m.flash = 1; m.flashCol = '#ff6b5e';
        m.results.push(0); m.idx++; m.stage = 0; MG.grill.sweep(m);
      }
      if (m.idx >= m.total) { m.bonus = m.good; finishMinigame(m.good >= 3); }
    }
  },
  draw: function(m){
    mgHeader("BUTCHER'S GRILL", 'SPACE to FLIP, SPACE again to PLATE — land in the green both times. 3 of 5 wins.');
    panel(180, 210, 600, 190, 14, '#2a1d26', '#5a3f54');
    for (var i = 0; i < 6; i++) { ctx.fillStyle = '#3b2a36'; ctx.fillRect(200, 232 + i * 26, 560, 6); }
    var cx = 480, cy = 305;
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    ctx.beginPath(); ctx.ellipse(cx, cy + 26, 62, 14, 0, 0, 6.3); ctx.fill();
    ctx.fillStyle = m.stage === 1 ? '#5d3620' : '#8b5a38';
    ctx.beginPath(); ctx.ellipse(cx, cy, 60, 26, 0, 0, 6.3); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.08)';
    ctx.beginPath(); ctx.ellipse(cx - 14, cy - 8, 22, 8, -0.4, 0, 6.3); ctx.fill();
    txt(m.stage === 0 ? 'FLIP IT' : 'PLATE IT', cx, cy - 58, 20, m.stage === 0 ? '#ffd18a' : '#8fd07a', 'center');
    var bx = 220, bw = 520, by = 430;
    fillRR(bx, by, bw, 26, 8, '#1b1219');
    fillRR(bx + (m.zc - m.zone / 2) * bw, by, m.zone * bw, 26, 8, 'rgba(143,208,122,.55)');
    ctx.fillStyle = m.flash > 0 ? m.flashCol : '#ffd18a';
    ctx.fillRect(bx + m.pos * bw - 2, by - 8, 4, 42);
    strokeRR(bx, by, bw, 26, 8, '#5a3f54', 2);
    for (var j = 0; j < m.total; j++)
      fillRR(400 + j * 34, 490, 26, 14, 4, j < m.results.length ? (m.results[j] ? '#8fd07a' : '#ff6b5e') : 'rgba(255,255,255,.15)');
    txt('cooked well: ' + m.good + ' / need 3', 480, 528, 14, '#c8a7bd', 'center', 'normal');
  }
};

/* ── MG 2 — STACK (baker) ── */
MG.stack = {
  init: function(m){
    m.need = 5; m.placed = []; m.baseW = 150; m.curW = 150;
    m.x = 480; m.dir = 1;
    m.speed = (230 + G.day * 14) * difficultyMul(G.activeStall);
    m.dropping = null; m.baseY = 470;
  },
  update: function(m, dt){
    if (m.dropping) {
      m.dropping.y += 900 * dt;
      var targetY = m.baseY - (m.placed.length + 1) * 26;
      if (m.dropping.y >= targetY) {
        var prevX = m.placed.length ? m.placed[m.placed.length - 1].x : 480;
        var prevW = m.placed.length ? m.placed[m.placed.length - 1].w : m.baseW;
        var off = Math.abs(m.dropping.x - prevX);
        var overlap = prevW / 2 + m.curW / 2 - off;
        if (overlap <= 14) { m.dropping = null; finishMinigame(false); return; }
        var lo = Math.max(m.dropping.x - m.curW / 2, prevX - prevW / 2);
        var hi = Math.min(m.dropping.x + m.curW / 2, prevX + prevW / 2);
        m.placed.push({ x: (lo + hi) / 2, w: hi - lo, perfect: off < 8 });
        m.curW = hi - lo;
        m.dropping = null;
        if (m.placed.length >= m.need) {
          m.bonus = m.placed.filter(function(p){ return p.perfect; }).length * 2;
          finishMinigame(true); return;
        }
        m.x = 100; m.dir = 1; m.speed += 12;
      }
      return;
    }
    m.x += m.dir * m.speed * dt;
    if (m.x > W - 90) { m.x = W - 90; m.dir = -1; }
    if (m.x < 90) { m.x = 90; m.dir = 1; }
    if (kp(' ') || mouse.clicked) m.dropping = { x: m.x, y: 200, w: m.curW };
  },
  draw: function(m){
    mgHeader('THE BAKER', 'SPACE drops the bun. Overhang is trimmed off — miss the tower entirely and it all goes.');
    fillRR(220, m.baseY + 4, 520, 14, 6, '#4a3446');
    for (var i = 0; i < m.placed.length; i++) {
      var p = m.placed[i], y = m.baseY - (i + 1) * 26;
      fillRR(p.x - p.w / 2, y, p.w, 24, 8, i % 2 ? '#d9a05b' : '#e2b06a');
      if (p.perfect) strokeRR(p.x - p.w / 2, y, p.w, 24, 8, '#8fd07a', 2);
    }
    if (m.dropping) fillRR(m.dropping.x - m.curW / 2, m.dropping.y, m.curW, 24, 8, '#f0c27a');
    else {
      fillRR(m.x - m.curW / 2, 200, m.curW, 24, 8, '#f0c27a');
      ctx.strokeStyle = 'rgba(255,209,138,.3)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(m.x, 224); ctx.lineTo(m.x, m.baseY); ctx.stroke();
    }
    txt(m.placed.length + ' / ' + m.need, 480, 528, 18, '#c8a7bd', 'center');
  }
};

/* ── MG 3 — DODGE (farm) ── */
MG.dodge = {
  init: function(m){
    m.want = needed(G.activeStall);
    if (!m.want.length) m.want = [pick(VEG)];
    m.have = {}; m.px = 160; m.py = 340; m.items = []; m.spawn = 0; m.hits = 0;
    m.maxHits = G.perks.extraLife ? 4 : 3;
    m.left = 26;
    m.hard = difficultyMul(G.activeStall);
  },
  update: function(m, dt){
    m.left -= dt;
    var sp = 300;
    var dy = (keys['s'] || keys['ArrowDown'] ? 1 : 0) - (keys['w'] || keys['ArrowUp'] ? 1 : 0);
    var dx = (keys['d'] || keys['ArrowRight'] ? 1 : 0) - (keys['a'] || keys['ArrowLeft'] ? 1 : 0);
    m.py = clamp(m.py + dy * sp * dt, 210, 500);
    m.px = clamp(m.px + dx * sp * dt, 60, 420);

    m.spawn -= dt;
    if (m.spawn <= 0) {
      m.spawn = Math.max(0.26, (0.72 - G.day * 0.03) / m.hard);
      var missing = m.want.filter(function(id){ return !m.have[id]; });
      var wantOne = missing.length && rnd() < 0.45;
      var id = wantOne ? pick(missing) : pick(VEG);
      var rot = !wantOne && rnd() < 0.45;
      /* good produce launches AWAY from you — you must go and get it.
         rotten stuff aims at you. Standing still must never win this. */
      var y, lo = 210, hi = 500;
      if (rot) y = clamp(m.py + (rnd() - 0.5) * 60, lo, hi);
      else {
        var off = 130 + rnd() * 15;
        y = m.py + (m.py - lo > hi - m.py ? -off : off);
        y = clamp(y, lo, hi);
      }
      m.items.push({ x: 1000, y: y, id: id, rot: rot, vy: (rnd() - 0.5) * 40, sp: (250 + rnd() * 90 + G.day * 8) * m.hard });
    }
    for (var i = m.items.length - 1; i >= 0; i--) {
      var it = m.items[i];
      it.x -= it.sp * dt;
      it.y = clamp(it.y + it.vy * dt, 200, 510);
      if (it.x < -40) { m.items.splice(i, 1); continue; }
      if (Math.hypot(it.x - m.px, it.y - m.py) < 30) {
        m.items.splice(i, 1);
        if (it.rot) { m.hits++; if (m.hits >= m.maxHits) { finishMinigame(false); return; } }
        else m.have[it.id] = true;
      }
    }
    if (m.want.every(function(id){ return m.have[id]; })) { m.bonus = Math.max(0, Math.round(m.left / 2)); finishMinigame(true); return; }
    if (m.left <= 0) finishMinigame(false);
  },
  draw: function(m){
    mgHeader('FARM STAND', 'WASD to move. Grab what the ticket wants. The brown mushy ones cost you a life.');
    ctx.fillStyle = '#2b3a26'; ctx.fillRect(0, 195, W, 330);
    for (var g = 0; g < 12; g++) { ctx.fillStyle = 'rgba(255,255,255,.03)'; ctx.fillRect(0, 202 + g * 28, W, 12); }
    for (var i = 0; i < m.items.length; i++) {
      var it = m.items[i];
      ctx.fillStyle = it.rot ? '#6b5138' : ING[it.id].c;
      ctx.beginPath(); ctx.arc(it.x, it.y, 15, 0, 6.3); ctx.fill();
      ctx.fillStyle = it.rot ? '#3d2f22' : 'rgba(255,255,255,.25)';
      ctx.beginPath(); ctx.arc(it.x - 5, it.y - 5, 4, 0, 6.3); ctx.fill();
    }
    ctx.fillStyle = '#e8734a'; ctx.beginPath(); ctx.arc(m.px, m.py, 18, 0, 6.3); ctx.fill();
    ctx.fillStyle = '#f6d7b0'; ctx.beginPath(); ctx.arc(m.px, m.py - 6, 9, 0, 6.3); ctx.fill();
    var wx = 480 - (m.want.length * 46) / 2;
    for (var j = 0; j < m.want.length; j++) {
      drawChip(m.want[j], wx + j * 46, 542, 40, 16, !!m.have[m.want[j]]);
      txt(ING[m.want[j]].label, wx + j * 46 + 20, 568, 10, m.have[m.want[j]] ? '#8fd07a' : '#7b5f74', 'center', 'normal');
    }
    for (var k = 0; k < m.maxHits; k++) {
      ctx.fillStyle = k < m.maxHits - m.hits ? '#ff6b5e' : 'rgba(255,255,255,.14)';
      ctx.beginPath(); ctx.arc(60 + k * 22, 552, 8, 0, 6.3); ctx.fill();
    }
    txt(Math.ceil(m.left) + 's', W - 60, 552, 18, '#c8a7bd', 'center');
  }
};

/* ── MG 4 — MELT (dairy) ── */
MG.melt = {
  init: function(m){
    m.beats = 8; m.need = 5; m.done = 0; m.hit = 0; m.ang = -Math.PI / 2;
    /* the dairy is a rhythm game, not a reflex test — it stays slow enough to read */
    m.speed = (1.55 + G.day * 0.07) * (G.activeStall && G.activeStall.mood === 'fussy' ? 1.12 : 1);
    m.zoneW = (G.perks.wideZone ? 1.25 : 0.98) * (G.activeStall && G.activeStall.mood === 'fussy' ? 0.88 : 1);
    m.cool = 0; m.flash = 0; m.flashCol = '#fff'; m.marks = [];
    MG.melt.newZone(m);
  },
  /* never drop the arc on top of the marker or just behind it — you always
     get at least ~1.1 rad of run-up to react to a new one. */
  newZone: function(m){
    m.zoneA = (m.ang + 1.1 + rnd() * 3.4) % (Math.PI * 2);
  },
  update: function(m, dt){
    m.flash = Math.max(0, m.flash - dt * 3);
    m.ang += m.speed * dt;
    if (m.ang > Math.PI * 2) m.ang -= Math.PI * 2;
    m.cool = Math.max(0, m.cool - dt);
    if ((kp(' ') || mouse.clicked) && m.cool <= 0) {
      m.cool = 0.16;
      /* d is the angular distance from the marker to the CENTRE of the yellow arc:
         0 = dead on it, PI = diametrically opposite. Hit when it is small. This read
         "d > PI - zoneW/2" for a long time, which scored the exact opposite side of
         the dial and made the dairy feel impossible. */
      var d = Math.abs(((m.ang - m.zoneA + Math.PI * 3) % (Math.PI * 2)) - Math.PI);
      if (d < m.zoneW / 2) { m.hit++; m.marks.push(1); m.flash = 1; m.flashCol = '#8fd07a'; }
      else { m.marks.push(0); m.flash = 1; m.flashCol = '#ff6b5e'; }
      m.done++;
      MG.melt.newZone(m);
      m.speed += 0.07;
      if (m.done >= m.beats) { m.bonus = m.hit; finishMinigame(m.hit >= m.need); }
    }
  },
  draw: function(m){
    mgHeader('THE DAIRY', 'SPACE when the marker crosses the melted arc. 5 of 8 gets you the slice.');
    var cx = 480, cy = 345, r = 116;
    ctx.strokeStyle = '#3b2a36'; ctx.lineWidth = 26;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, 6.3); ctx.stroke();
    /* run-up: a dim lead-in so a new arc never appears without warning */
    ctx.strokeStyle = 'rgba(247,197,63,.22)'; ctx.lineWidth = 26;
    ctx.beginPath(); ctx.arc(cx, cy, r, m.zoneA - m.zoneW / 2 - 0.9, m.zoneA - m.zoneW / 2); ctx.stroke();
    ctx.strokeStyle = '#f7c53f'; ctx.lineWidth = 26;
    ctx.beginPath(); ctx.arc(cx, cy, r, m.zoneA - m.zoneW / 2, m.zoneA + m.zoneW / 2); ctx.stroke();
    ctx.strokeStyle = m.flash > 0 ? m.flashCol : '#ffd18a'; ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(m.ang) * (r - 20), cy + Math.sin(m.ang) * (r - 20));
    ctx.lineTo(cx + Math.cos(m.ang) * (r + 20), cy + Math.sin(m.ang) * (r + 20));
    ctx.stroke();
    fillRR(cx - 40, cy - 30, 80, 60, 6, '#f7c53f');
    txt(m.hit + '/' + m.need, cx, cy, 26, '#6b4a10', 'center');
    for (var i = 0; i < m.beats; i++)
      fillRR(360 + i * 32, 508, 24, 12, 4, i < m.marks.length ? (m.marks[i] ? '#8fd07a' : '#ff6b5e') : 'rgba(255,255,255,.15)');
    txt(m.hit + ' of ' + m.need + ' needed  ·  ' + (m.beats - m.done) + ' presses left', 480, 542, 14, '#c8a7bd', 'center', 'normal');
  }
};

/* ── MG 5 — SAUCE (saucery) ── */
MG.sauce = {
  init: function(m){
    m.targets = [];
    for (var i = 0; i < 5; i++) m.targets.push({ x: 560 + rnd() * 300, y: 250 + rnd() * 220, r: 22 * zoneMul(G.activeStall), hit: false });
    m.blobs = []; m.ammo = 8; m.power = 0; m.charging = false;
    m.ox = 150; m.oy = 430; m.aim = -0.6; m.left = 24;
  },
  update: function(m, dt){
    m.left -= dt;
    if (m.left <= 0) { finishMinigame(false); return; }
    var tx = mouse.x - m.ox;
    if (tx > 10) m.aim = Math.atan2(mouse.y - m.oy, tx);
    if (keys['w'] || keys['ArrowUp']) m.aim -= 1.4 * dt;
    if (keys['s'] || keys['ArrowDown']) m.aim += 1.4 * dt;
    m.aim = clamp(m.aim, -1.35, 0.5);

    if (keys[' '] || mouse.down) { m.charging = true; m.power = Math.min(1, m.power + dt * 1.25); }
    else if (m.charging) {
      m.charging = false;
      var sp = 320 + m.power * 520;
      m.blobs.push({ x: m.ox, y: m.oy, vx: Math.cos(m.aim) * sp, vy: Math.sin(m.aim) * sp, life: 3 });
      m.ammo--; m.power = 0;
    }
    for (var i = m.blobs.length - 1; i >= 0; i--) {
      var b = m.blobs[i];
      b.vy += 620 * dt; b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
      for (var j = 0; j < m.targets.length; j++) {
        var t = m.targets[j];
        if (!t.hit && Math.hypot(b.x - t.x, b.y - t.y) < t.r + 6) { t.hit = true; b.life = 0; }
      }
      if (b.life <= 0 || b.y > 560 || b.x > 990) m.blobs.splice(i, 1);
    }
    if (!m.targets.some(function(t){ return !t.hit; })) { m.bonus = m.ammo * 2; finishMinigame(true); return; }
    if (m.ammo <= 0 && m.blobs.length === 0) finishMinigame(false);
  },
  draw: function(m){
    mgHeader('THE SAUCERY', 'Aim with the mouse (or W/S). HOLD to squeeze, release to squirt. Hit all 5.');
    ctx.fillStyle = '#2a1d26'; ctx.fillRect(0, 500, W, 100);
    ctx.save(); ctx.translate(m.ox, m.oy); ctx.rotate(m.aim);
    fillRR(-30, -16, 56, 32, 10, '#d9663f');
    fillRR(24, -6, 20, 12, 4, '#8f3f26');
    ctx.restore();
    ctx.strokeStyle = 'rgba(255,209,138,.35)'; ctx.lineWidth = 2; ctx.setLineDash([5, 8]);
    ctx.beginPath(); ctx.moveTo(m.ox, m.oy);
    ctx.lineTo(m.ox + Math.cos(m.aim) * 120, m.oy + Math.sin(m.aim) * 120);
    ctx.stroke(); ctx.setLineDash([]);
    fillRR(60, 540, 200, 16, 6, '#1b1219');
    fillRR(60, 540, 200 * m.power, 16, 6, '#e8734a');
    txt('squeeze', 160, 526, 12, '#c8a7bd', 'center', 'normal');
    fillRR(520, 230, 400, 270, 30, 'rgba(217,160,91,.18)');
    for (var i = 0; i < m.targets.length; i++) {
      var t = m.targets[i];
      if (t.hit) { ctx.fillStyle = '#e8734a'; ctx.beginPath(); ctx.arc(t.x, t.y, t.r, 0, 6.3); ctx.fill(); }
      else { ctx.strokeStyle = '#ffd18a'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(t.x, t.y, t.r, 0, 6.3); ctx.stroke(); }
    }
    ctx.fillStyle = '#e8734a';
    for (var j = 0; j < m.blobs.length; j++) { ctx.beginPath(); ctx.arc(m.blobs[j].x, m.blobs[j].y, 7, 0, 6.3); ctx.fill(); }
    txt('squirts left: ' + m.ammo, W - 40, 540, 16, '#c8a7bd', 'right');
    txt(Math.ceil(m.left) + 's', W - 40, 566, 14, '#7b5f74', 'right', 'normal');
  }
};

/* ── MG 6 — BRINE (brinery) ── NEW
   Hold to lower the jar into the brine. The level keeps rising AFTER you
   let go — the faster you filled, the further it overshoots. Restraint game. */
MG.brine = {
  init: function(m){
    var s = G.activeStall;
    m.jars = 3; m.idx = 0; m.good = 0; m.results = [];
    m.fill = 0; m.holding = false; m.settling = 0; m.final = -1;
    m.rate = (0.42 + G.day * 0.02) * difficultyMul(s);
    m.band = (G.perks.wideZone ? 0.16 : 0.12) * zoneMul(s);
    MG.brine.newJar(m);
  },
  newJar: function(m){
    m.fill = 0; m.holding = false; m.settling = 0; m.final = -1;
    m.bandC = 0.45 + rnd() * 0.4;
    m.drift = 0.05 + rnd() * 0.05;
  },
  update: function(m, dt){
    if (m.settling > 0) {
      m.settling -= dt;
      m.fill = Math.min(1.2, m.fill + m.drift * dt / 0.45);
      if (m.settling <= 0) {
        m.final = m.fill;
        var ok = Math.abs(m.final - m.bandC) < m.band / 2;
        if (ok) m.good++;
        m.results.push(ok ? 1 : 0);
        m.idx++;
        if (m.idx >= m.jars) { m.bonus = m.good * 2; finishMinigame(m.good >= 2); return; }
        MG.brine.newJar(m);
      }
      return;
    }
    var down = keys[' '] || mouse.down;
    if (down) { m.holding = true; m.fill = Math.min(1.2, m.fill + m.rate * dt); }
    else if (m.holding) { m.holding = false; m.settling = 0.45; }
    if (m.fill >= 1.2 && !m.settling) { m.holding = false; m.settling = 0.45; }
  },
  draw: function(m){
    mgHeader('THE BRINERY', 'HOLD to lower the jar. The brine keeps rising after you let go — stop short of the band.');
    var jx = 400, jy = 220, jw = 160, jh = 250;
    fillRR(jx - 10, jy - 16, jw + 20, 16, 6, '#5a3f54');
    panel(jx, jy, jw, jh, 10, '#1b1219', '#5a3f54');
    /* target band */
    var by = jy + jh - (m.bandC + m.band / 2) * jh;
    ctx.fillStyle = 'rgba(143,208,122,.35)';
    ctx.fillRect(jx + 2, by, jw - 4, m.band * jh);
    ctx.strokeStyle = '#8fd07a'; ctx.lineWidth = 2;
    ctx.strokeRect(jx + 2, by, jw - 4, m.band * jh);
    /* brine */
    var fh = Math.min(1, m.fill) * jh;
    ctx.fillStyle = m.settling > 0 ? '#8fbf5a' : '#6fa34a';
    ctx.fillRect(jx + 3, jy + jh - fh, jw - 6, fh);
    if (m.fill > 1) { ctx.fillStyle = '#ff6b5e'; ctx.fillRect(jx + 3, jy, jw - 6, 8); }
    /* floating pickles */
    for (var p = 0; p < 4; p++) {
      var py = jy + jh - fh + 12 + p * 16;
      if (py < jy + jh - 6 && fh > 20) {
        ctx.fillStyle = '#4e8f3a';
        ctx.beginPath(); ctx.ellipse(jx + 40 + (p % 2) * 60, py, 22, 8, 0.2, 0, 6.3); ctx.fill();
      }
    }
    txt(m.settling > 0 ? 'SETTLING…' : (m.holding ? 'LOWERING' : 'HOLD SPACE'), 480, 500, 18,
        m.settling > 0 ? '#8fbf5a' : '#ffd18a', 'center');
    for (var j = 0; j < m.jars; j++)
      fillRR(430 + j * 40, 528, 30, 14, 4, j < m.results.length ? (m.results[j] ? '#8fd07a' : '#ff6b5e') : 'rgba(255,255,255,.15)');
    txt('jar ' + Math.min(m.idx + 1, m.jars) + ' of ' + m.jars + '  ·  need 2', 480, 560, 14, '#c8a7bd', 'center', 'normal');
  }
};

/* ── MG 7 — HAGGLE (the haggler) ── NEW
   A nerve game. Wait and the deal gets better. Wait too long and he walks.  */
MG.haggle = {
  init: function(m){
    m.deal = 0;
    m.walkAt = 3.2 + rnd() * 4.6;
    m.elapsed = 0;
    m.shook = false;
    m.tell = 0;
    m.walked = false;
  },
  update: function(m, dt){
    m.elapsed += dt;
    m.deal = Math.min(1, m.elapsed / 7.5);
    /* he gets visibly twitchy as his patience runs out, but never gives the exact moment */
    m.tell = clamp((m.elapsed / m.walkAt) + (rnd() - 0.5) * 0.16, 0, 1);
    if (kp(' ') || mouse.clicked) {
      m.shook = true;
      m.bonus = m.deal > 0.7 ? 6 : 0;
      finishMinigame(true);
      return;
    }
    if (m.elapsed >= m.walkAt) { m.walked = true; finishMinigame(false); }
  },
  draw: function(m){
    mgHeader('THE HAGGLER', 'Wait and the deal improves. Wait too long and he walks. SPACE to shake on it.');
    var cx = 480, cy = 320;
    /* the man */
    ctx.fillStyle = 'rgba(0,0,0,.3)';
    ctx.beginPath(); ctx.ellipse(cx, cy + 78, 40, 10, 0, 0, 6.3); ctx.fill();
    fillRR(cx - 34, cy - 6, 68, 84, 12, '#7a5aa8');
    ctx.fillStyle = '#e2c39c';
    ctx.beginPath(); ctx.arc(cx, cy - 26, 28, 0, 6.3); ctx.fill();
    fillRR(cx - 34, cy - 56, 68, 14, 5, '#43305e');
    /* eyes narrow as patience drains */
    var sq = 1 - m.tell * 0.7;
    ctx.fillStyle = '#2a1c28';
    ctx.beginPath(); ctx.ellipse(cx - 10, cy - 28, 4, 5 * sq, 0, 0, 6.3); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx + 10, cy - 28, 4, 5 * sq, 0, 0, 6.3); ctx.fill();
    /* a foot-tap when he's nearly gone */
    if (m.tell > 0.72) txt('…', cx + 54, cy - 50, 26, '#ff6b5e', 'center');

    /* deal meter */
    fillRR(260, 452, 440, 24, 8, '#1b1219');
    fillRR(260, 452, 440 * m.deal, 24, 8, m.deal > 0.7 ? '#8fd07a' : '#ffd18a');
    strokeRR(260 + 440 * 0.7, 446, 3, 36, 1, '#8fd07a', 2);
    txt('DEAL', 260, 438, 12, '#9d8296', 'left');
    txt(m.deal > 0.7 ? '★★  two tokens' : '★  one token', 700, 438, 12, m.deal > 0.7 ? '#8fd07a' : '#c8a7bd', 'right');
    /* patience meter — deliberately noisy */
    fillRR(260, 496, 440, 14, 6, '#1b1219');
    fillRR(260, 496, 440 * (1 - m.tell), 14, 6, m.tell > 0.7 ? '#ff6b5e' : '#7a5aa8');
    txt('his patience (he hides it well)', 480, 528, 13, '#9d8296', 'center', 'normal');
  }
};

/* ─────────────────────────────  ASSEMBLE  ───────────────────────────── */

scenes.assemble = {
  enter: function(){
    G.asm = { ti: 0, built: G.orders.map(function(){ return []; }), mistakes: 0, done: false, t: 0 };
  },
  update: function(dt){
    var a = G.asm;
    a.t += dt;
    if (a.done) { if (a.t > 0.7 && (anyPress() || mouse.clicked)) endDay(); return; }

    var avail = availableParts();
    for (var i = 0; i < avail.length; i++) if (kp(String(i + 1))) { place(avail[i]); return; }
    if (mouse.clicked) {
      for (var j = 0; j < avail.length; j++) {
        var b = partBtn(j);
        if (mouse.x > b.x && mouse.x < b.x + b.w && mouse.y > b.y && mouse.y < b.y + b.h) { place(avail[j]); return; }
      }
    }
    var cur = G.orders[a.ti];
    if (kp('Enter') || a.built[a.ti].length >= cur.length || availableParts().length === 0) {
      a.ti++;
      if (a.ti >= G.orders.length) { a.ti = G.orders.length - 1; a.done = true; a.t = 0; }
    }
  },
  draw: function(){
    var a = G.asm;
    ctx.fillStyle = '#20161f'; ctx.fillRect(0, 0, W, H);
    txt('BUILD IT' + (G.orders.length > 1 ? '  —  TICKET ' + (a.ti + 1) + ' OF ' + G.orders.length : ''), 480, 44, 28, '#ffd18a', 'center');
    txt('Stack bottom-up in the order on the ticket. Number keys or click. ENTER moves on.', 480, 74, 14, '#c8a7bd', 'center', 'normal');

    panel(300, 108, 360, 412, 12, '#2a1d26', '#4a3446');
    drawBurger(a.built[a.ti], 480, 500, 1);

    panel(30, 108, 244, 412, 12, '#241923', '#4a3446');
    txt('THE ORDER', 152, 130, 15, '#9d8296', 'center');
    var cur = G.orders[a.ti];
    for (var i = 0; i < cur.length; i++) {
      var id = cur[i], correct = a.built[a.ti][i] === id;
      drawChip(id, 46, 152 + i * 34, 92, 20, true);
      txt(ING[id].label, 148, 162 + i * 34, 13, '#f3e6d8', 'left', 'normal');
      if (a.built[a.ti].length > i) txt(correct ? '✓' : '✗', 250, 162 + i * 34, 16, correct ? '#8fd07a' : '#ff6b5e', 'center');
    }

    panel(686, 108, 244, 412, 12, '#241923', '#4a3446');
    txt('WHAT YOU EARNED', 808, 130, 14, '#9d8296', 'center');
    var avail = availableParts();
    if (!avail.length) txt('— nothing left —', 808, 190, 14, '#6b5566', 'center', 'normal');
    for (var j = 0; j < avail.length; j++) {
      var b = partBtn(j);
      fillRR(b.x, b.y, b.w, b.h, 8, '#31222f');
      strokeRR(b.x, b.y, b.w, b.h, 8, '#5a3f54', 1);
      drawChip(avail[j], b.x + 8, b.y + 8, 38, 16, true);
      txt((j + 1) + '. ' + ING[avail[j]].label, b.x + 54, b.y + 16, 13, '#f3e6d8', 'left', 'normal');
    }
    txt('ENTER — serve it', 808, 500, 14, '#ffd18a', 'center');

    if (a.done) {
      ctx.fillStyle = 'rgba(12,8,12,.86)'; ctx.fillRect(0, 0, W, H);
      var sc = scoreBuild();
      txt(sc.title, 480, 150, 44, sc.col, 'center');
      txt(sc.line, 480, 200, 17, '#f3e6d8', 'center', 'normal');
      txt('+' + sc.pts + ' score      +' + sc.coins + ' coins', 480, 244, 22, '#ffd18a', 'center');
      for (var t = 0; t < a.built.length; t++)
        drawBurger(a.built[t], 480 + (t - (a.built.length - 1) / 2) * 200, 480, 0.85);
      txt('press any key', 480, 540, 16, '#9d8296', 'center', 'normal');
    }
  }
};

/* what is still in your basket, in the order the CURRENT ticket wants it */
function availableParts(){
  var a = G.asm, pool = {};
  for (var id in G.have) pool[id] = G.have[id];
  for (var t = 0; t < a.built.length; t++)
    for (var k = 0; k < a.built[t].length; k++) pool[a.built[t][k]] = (pool[a.built[t][k]] || 0) - 1;
  var out = [], cur = G.orders[a.ti], mine = a.built[a.ti];
  for (var i = 0; i < cur.length; i++) {
    var w = cur[i];
    if (mine.indexOf(w) >= 0) continue;
    if ((pool[w] || 0) > 0 && out.indexOf(w) < 0) out.push(w);
  }
  return out;
}
function partBtn(i){ return { x: 700, y: 152 + i * 40, w: 216, h: 32 }; }
function place(id){
  var a = G.asm;
  if (a.built[a.ti].indexOf(id) >= 0) return;
  if (availableParts().indexOf(id) < 0) return;
  if (G.orders[a.ti][a.built[a.ti].length] !== id) a.mistakes++;
  a.built[a.ti].push(id);
}

function scoreBuild(){
  var a = G.asm, right = 0, total = 0, allFull = true, allPerfect = true;
  for (var t = 0; t < G.orders.length; t++) {
    var o = G.orders[t], b = a.built[t];
    total += o.length;
    var r = 0;
    for (var i = 0; i < o.length; i++) if (b[i] === o[i]) r++;
    right += r;
    var full = o.every(function(id){ return b.indexOf(id) >= 0; });
    if (!full) allFull = false;
    if (r !== o.length) allPerfect = false;
  }
  var pts = right * 20 + (allFull ? 60 * G.orders.length : 0) + (allPerfect ? 100 * G.orders.length : 0) + Math.floor(G.clock / 4);
  var coins = right * 2 + (allPerfect ? 15 : 0);
  return {
    title: allPerfect ? 'PERFECT' + (G.orders.length > 1 ? ' — BOTH TICKETS' : ' BURGER') : allFull ? 'CLOSE ENOUGH' : 'MISSING PIECES',
    col: allPerfect ? '#8fd07a' : allFull ? '#ffd18a' : '#ff6b5e',
    line: allPerfect ? 'Every layer earned and every layer in place.'
      : allFull ? 'You got it all — the stacking let you down (' + right + '/' + total + ' in order).'
      : 'You served ' + right + ' of ' + total + ' right. The market closed on you.',
    pts: pts, coins: coins, perfect: allPerfect, full: allFull, right: right, total: total
  };
}

function endDay(){
  var sc = scoreBuild();
  G.score += sc.pts;
  G.coins += sc.coins;
  G.lastResult = sc;
  if (G.score > G.best) G.best = G.score;
  if (!sc.full) { setScene('gameover'); return; }
  rollShop();
  setScene('shop');
}

/* ─────────────────────────────  SHOP  ───────────────────────────── */

var PERKS = [
  { id: 'slowClock', name: 'Late Licence',   desc: 'The market stays open 25% longer.',          cost: 26 },
  { id: 'wideZone',  name: 'Steady Hands',   desc: 'Wider timing windows at grill, dairy, brinery and saucery.', cost: 24 },
  { id: 'extraLife', name: 'Thick Apron',    desc: 'One extra life at the farm stand.',          cost: 18 },
  { id: 'freeVeg',   name: 'Standing Order', desc: 'Greens are delivered — skip the farm run.',  cost: 40 },
  { id: 'regular',   name: 'Regular Face',   desc: 'Vendors are never FUSSY with you again.',    cost: 34 },
  { id: 'elbows',    name: 'Sharp Elbows',   desc: 'The rival gives up a buy-out twice as fast.', cost: 30 }
];
function rollShop(){
  var pool = PERKS.filter(function(p){ return !G.perks[p.id]; });
  G.shop = [];
  var tries = 0;
  while (G.shop.length < Math.min(3, pool.length) && tries++ < 60) {
    var p = pool[Math.floor(rnd() * pool.length)];
    if (G.shop.indexOf(p) < 0) G.shop.push(p);
  }
}
scenes.shop = {
  update: function(){
    for (var i = 0; i < G.shop.length; i++) {
      var p = G.shop[i], b = shopBtn(i);
      var click = mouse.clicked && mouse.x > b.x && mouse.x < b.x + b.w && mouse.y > b.y && mouse.y < b.y + b.h;
      if ((kp(String(i + 1)) || click) && G.coins >= p.cost && !G.perks[p.id]) { G.coins -= p.cost; G.perks[p.id] = true; }
    }
    if (kp('Enter') || kp(' ')) startDay(G.day + 1);
  },
  draw: function(){
    ctx.fillStyle = '#20161f'; ctx.fillRect(0, 0, W, H);
    txt('MARKET CLOSED — DAY ' + G.day, 480, 80, 32, '#ffd18a', 'center');
    var r = G.lastResult;
    if (r) txt(r.title + '   ·   score ' + G.score + '   ·   ' + G.coins + ' coins   ·   ★ ' + G.tokens, 480, 122, 17, r.col, 'center', 'normal');
    if (isRushDay(G.day + 1)) txt('TOMORROW IS A RUSH DAY — two tickets at once.', 480, 158, 18, '#ff9b4a', 'center');
    else txt('Spend coins before tomorrow', 480, 158, 17, '#c8a7bd', 'center', 'normal');
    for (var i = 0; i < G.shop.length; i++) {
      var p = G.shop[i], b = shopBtn(i);
      var afford = G.coins >= p.cost, owned = !!G.perks[p.id];
      panel(b.x, b.y, b.w, b.h, 12, owned ? '#22301f' : '#2a1d26', owned ? '#8fd07a' : afford ? '#ffd18a' : '#4a3446');
      txt((i + 1) + '. ' + p.name, b.x + b.w / 2, b.y + 38, 21, owned ? '#8fd07a' : afford ? '#ffd18a' : '#6b5566', 'center');
      wrapTxt(p.desc, b.x + b.w / 2, b.y + 82, b.w - 30, 14, owned ? '#8fd07a' : '#c8a7bd');
      txt(owned ? 'BOUGHT' : p.cost + ' coins', b.x + b.w / 2, b.y + 152, 18, owned ? '#8fd07a' : afford ? '#f3e6d8' : '#6b5566', 'center');
    }
    txt('ENTER — open day ' + (G.day + 1), 480, 520, 22, '#ffd18a', 'center');
  }
};
function shopBtn(i){ return { x: 90 + i * 270, y: 210, w: 240, h: 184 }; }
function wrapTxt(s, cx, y, maxW, size, col){
  ctx.font = 'normal ' + size + 'px "Trebuchet MS",system-ui,sans-serif';
  var words = s.split(' '), line = '', lines = [];
  for (var i = 0; i < words.length; i++) {
    var t = line ? line + ' ' + words[i] : words[i];
    if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = words[i]; } else line = t;
  }
  if (line) lines.push(line);
  for (var j = 0; j < lines.length; j++) txt(lines[j], cx, y + j * (size + 5), size, col, 'center', 'normal');
}

/* ─────────────────────────────  GAME OVER  ───────────────────────────── */

scenes.gameover = {
  update: function(){ if (anyPress() || mouse.clicked) setScene('title'); },
  draw: function(){
    ctx.fillStyle = '#20161f'; ctx.fillRect(0, 0, W, H);
    txt('THE MARKET CLOSED', 480, 160, 44, '#ff6b5e', 'center');
    txt('You went home with an incomplete burger.', 480, 208, 19, '#c8a7bd', 'center', 'normal');
    var built = (G.asm && G.asm.built) || [[]];
    for (var t = 0; t < built.length; t++) drawBurger(built[t], 480 + (t - (built.length - 1) / 2) * 200, 430, 1);
    txt('day ' + G.day + '   ·   final score ' + G.score, 480, 480, 22, '#ffd18a', 'center');
    if (G.best) txt('best ' + G.best, 480, 510, 16, '#8fd07a', 'center', 'normal');
    txt('press any key', 480, 550, 16, '#9d8296', 'center', 'normal');
  }
};

/* ─────────────────────────────  LOOP  ───────────────────────────── */

var last = 0;
function frame(ts){
  var dt = Math.min(0.05, (ts - last) / 1000 || 0);
  last = ts;
  step(dt); render(); clearInput();
  requestAnimationFrame(frame);
}
function step(dt){
  if (G.toastT > 0) G.toastT -= dt;
  var s = scenes[G.scene];
  if (s && s.update) s.update(dt);
}
function render(){
  var s = scenes[G.scene];
  ctx.save();
  if (s && s.draw) s.draw();
  ctx.restore();
}

window.BURGER = {
  G: G, MG: MG, ING: ING, STACK_ORDER: STACK_ORDER, VEG: VEG, MOODS: MOODS, PERKS: PERKS,
  scenes: scenes, setScene: setScene, startDay: startDay, startMinigame: startMinigame,
  finishMinigame: finishMinigame, orderForDay: orderForDay, isRushDay: isRushDay,
  scoreBuild: scoreBuild, availableParts: availableParts, place: place, endDay: endDay,
  needed: needed, stallDone: stallDone, stallLocked: stallLocked, haveAll: haveAll,
  makeStalls: makeStalls, rollShop: rollShop, assignMoods: assignMoods, updateRival: updateRival,
  has: has, wants: wants, grant: grant, computeDemand: computeDemand,
  srand: srand, step: step, render: render, CART: CART,
  keys: function(){ return keys; },
  press: function(k){ pressed[k] = true; },
  clearInput: clearInput, mouse: mouse
};

srand(12345);
requestAnimationFrame(frame);

})();
