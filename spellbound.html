<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spellbound</title>
<style>
  :root{
    --ink:#0b0d18; --ink2:#121629; --line:#2a3050;
    --text:#e9e7f3; --dim:#9aa0c0; --gold:#f2c45a; --gold-d:#c99a2e;
    --good:#5ad39a; --bad:#f2708a; --cool:#7aa7ff;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    background:radial-gradient(1200px 800px at 50% -10%,#1b2140 0%,var(--ink) 60%) fixed;
    color:var(--text); display:flex; align-items:flex-start; justify-content:center;
    padding:22px 16px; -webkit-font-smoothing:antialiased;
  }
  #app{width:100%; max-width:780px}
  .card{
    background:linear-gradient(180deg,rgba(24,29,53,.92),rgba(14,17,32,.92));
    border:1px solid var(--line); border-radius:18px; padding:26px 24px;
    box-shadow:0 24px 60px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.05);
  }
  h1{
    margin:0 0 4px; font-size:44px; letter-spacing:.06em; text-align:center;
    background:linear-gradient(180deg,#fff3d0,var(--gold) 55%,var(--gold-d));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .tag{text-align:center; color:var(--dim); font-size:13px; letter-spacing:.22em; text-transform:uppercase; margin-bottom:20px}
  p.lede{color:var(--dim); line-height:1.6; text-align:center; margin:0 auto 20px; max-width:54ch}
  button{font:inherit; cursor:pointer; border-radius:11px; transition:.14s}
  button:disabled{opacity:.4; cursor:default}
  .btn{
    background:linear-gradient(180deg,#242b4d,#1a2039); color:var(--text);
    border:1px solid var(--line); padding:11px 16px; font-size:15px;
  }
  .btn:hover:not(:disabled){border-color:var(--gold); color:#fff5dd; transform:translateY(-1px)}
  .btn.primary{background:linear-gradient(180deg,var(--gold),var(--gold-d)); color:#241c05; border-color:#e6b954; font-weight:700}
  .btn.primary:hover{color:#120e02}
  .btn.sm{padding:7px 12px; font-size:13px; font-family:system-ui,sans-serif}
  .row{display:flex; gap:10px; justify-content:center; flex-wrap:wrap}

  /* map */
  .chapters{display:flex; gap:6px; flex-wrap:wrap; justify-content:center; margin-bottom:16px}
  .chip{
    background:rgba(255,255,255,.04); border:1px solid var(--line); color:var(--dim);
    border-radius:999px; padding:7px 13px; font-size:13px; font-family:system-ui,sans-serif; letter-spacing:.03em;
  }
  .chip.on{color:#241c05; font-weight:700}
  .chip.lock{opacity:.35}
  .chhead{text-align:center; margin-bottom:14px}
  .chhead .nm{font-size:26px; letter-spacing:.05em}
  .chhead .ds{color:var(--dim); font-size:13px; font-family:system-ui,sans-serif; margin-top:3px}
  .grid{display:grid; grid-template-columns:repeat(10,1fr); gap:6px}
  @media(max-width:640px){ .grid{grid-template-columns:repeat(5,1fr)} }
  .cell{
    aspect-ratio:1; border-radius:9px; border:1px solid var(--line); background:rgba(255,255,255,.03);
    color:var(--text); font-family:system-ui,sans-serif; font-size:12px; display:flex;
    flex-direction:column; align-items:center; justify-content:center; gap:2px; padding:0;
  }
  .cell:hover:not(:disabled){border-color:var(--gold); background:rgba(242,196,90,.1)}
  .cell.done{background:rgba(90,211,154,.08); border-color:#2f6b52}
  .cell.boss{border-color:#7a3550; background:rgba(242,112,138,.09)}
  .cell.next{border-color:var(--gold); box-shadow:0 0 0 2px rgba(242,196,90,.22)}
  .cell.locked{opacity:.28}
  .cell .st{font-size:8px; letter-spacing:1px; color:var(--gold); height:9px}
  .cell .mk{position:absolute}
  .legend{display:flex; gap:14px; justify-content:center; flex-wrap:wrap; margin-top:14px; color:var(--dim); font-size:12px; font-family:system-ui,sans-serif}

  /* hud */
  .hud{display:flex; align-items:center; gap:9px; margin-bottom:14px; font-family:system-ui,sans-serif; font-size:13px; flex-wrap:wrap}
  .pill{background:rgba(255,255,255,.045); border:1px solid var(--line); border-radius:999px; padding:6px 13px; letter-spacing:.04em}
  .pill b{color:var(--gold); font-weight:700}
  .pill.mod{border-color:#5a4a86; background:rgba(140,110,220,.14); color:#d6c9ff}
  .hearts{margin-left:auto; letter-spacing:2px; font-size:16px}
  .bar{height:5px; background:rgba(255,255,255,.07); border-radius:4px; overflow:hidden; margin-bottom:8px}
  .bar>i{display:block; height:100%; background:linear-gradient(90deg,var(--gold-d),var(--gold)); width:0; transition:width .35s}
  .bar.time{margin-bottom:20px}
  .bar.time>i{background:linear-gradient(90deg,#f2708a,#f2c45a); transition:width .12s linear}

  .speaker{text-align:center; margin:4px 0 14px}
  .orb{
    width:96px; height:96px; border-radius:50%; margin:0 auto; display:grid; place-items:center;
    font-size:40px; border:1px solid #3a4370; cursor:pointer; user-select:none;
    background:radial-gradient(circle at 35% 30%,#2f3866,#161a30);
    box-shadow:0 0 0 0 rgba(242,196,90,.35); transition:.2s;
  }
  .orb:hover{border-color:var(--gold)}
  .orb.on{animation:pulse 1.1s ease-out infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(242,196,90,.4)}100%{box-shadow:0 0 0 26px rgba(242,196,90,0)}}
  .flashword{font-size:38px; letter-spacing:.14em; min-height:50px; color:#fff6de; transition:opacity .35s}
  .scram{font-size:26px; letter-spacing:.4em; color:#c58bff; min-height:34px; font-family:ui-monospace,Menlo,Consolas,monospace}

  .clue{min-height:56px; text-align:center; color:var(--dim); font-size:16px; line-height:1.6; margin:0 auto 12px; max-width:56ch}
  .clue .lbl{color:var(--gold); font-size:11px; letter-spacing:.2em; text-transform:uppercase; font-family:system-ui,sans-serif; display:block; margin-bottom:4px}
  .clue .blank{color:var(--gold); letter-spacing:.1em}
  .reveal{text-align:center; font-size:24px; letter-spacing:.35em; min-height:32px; margin-bottom:8px; color:var(--gold); font-family:ui-monospace,Menlo,Consolas,monospace}

  input[type=text]{
    width:100%; font:inherit; font-size:30px; letter-spacing:.14em; text-align:center;
    background:rgba(255,255,255,.05); border:1px solid var(--line); border-bottom:2px solid var(--gold-d);
    border-radius:12px; color:var(--text); padding:13px 12px; outline:none;
  }
  input[type=text]:focus{border-color:var(--gold); background:rgba(242,196,90,.06)}
  input.good{border-color:var(--good); background:rgba(90,211,154,.1)}
  input.bad{border-color:var(--bad); background:rgba(242,112,138,.1); animation:shake .32s}
  @keyframes shake{25%{transform:translateX(-9px)}50%{transform:translateX(9px)}75%{transform:translateX(-5px)}}

  .tools{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin:14px 0 4px}
  .go{display:flex; justify-content:center; margin-top:14px}
  .go .btn{padding:12px 34px; font-size:17px}
  .verdict{text-align:center; min-height:92px; margin-top:12px}
  .verdict .head{font-size:22px; letter-spacing:.05em}
  .verdict .word{font-size:32px; letter-spacing:.2em; margin:8px 0 4px; font-family:ui-monospace,Menlo,Consolas,monospace}
  .verdict .word .c{color:var(--good)} .verdict .word .x{color:var(--bad); text-decoration:underline wavy}
  .verdict .yours{color:var(--dim); font-size:14px; font-family:system-ui,sans-serif}
  .verdict .pts{color:var(--gold); font-size:15px; font-family:system-ui,sans-serif; margin-top:6px}

  .misses{margin:16px 0; max-height:220px; overflow:auto; border:1px solid var(--line); border-radius:12px}
  .miss{display:flex; gap:12px; align-items:baseline; padding:9px 14px; border-bottom:1px solid rgba(255,255,255,.05); font-size:15px}
  .miss:last-child{border-bottom:0}
  .miss .w{color:var(--gold); letter-spacing:.08em; min-width:190px; font-family:ui-monospace,Menlo,Consolas,monospace}
  .miss .y{color:var(--bad); font-size:13px; font-family:system-ui,sans-serif; text-decoration:line-through}
  .miss .d{color:var(--dim); font-size:13px; font-family:system-ui,sans-serif; margin-left:auto; text-align:right}
  .stats{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin:16px 0}
  .stat{background:rgba(255,255,255,.04); border:1px solid var(--line); border-radius:12px; padding:11px 18px; text-align:center; min-width:100px}
  .stat b{display:block; font-size:26px; color:var(--gold)}
  .stat span{font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--dim); font-family:system-ui,sans-serif}
  .starline{text-align:center; font-size:34px; letter-spacing:.18em; color:var(--gold); margin:6px 0 2px}
  .starline .off{color:#3a4060}
  /* saves */
  .slot{border:1px solid var(--line); border-radius:13px; padding:14px 16px; margin-bottom:10px; background:rgba(255,255,255,.03)}
  .slot.on{border-color:var(--gold); background:rgba(242,196,90,.07)}
  .slothead{display:flex; align-items:center; gap:10px; font-size:19px; letter-spacing:.06em; margin-bottom:5px}
  .slothead b{font-weight:400; color:var(--gold)}
  .inuse{font-family:system-ui,sans-serif; font-size:10px; letter-spacing:.18em; text-transform:uppercase;
    color:#241c05; background:var(--gold); border-radius:999px; padding:3px 9px}
  .slotstats{font-family:system-ui,sans-serif; font-size:13px; color:var(--text); line-height:1.7}
  .dimline{color:var(--dim)}
  .foot{text-align:center; color:var(--dim); font-size:12px; font-family:system-ui,sans-serif; margin-top:16px; opacity:.75}
  .hide{display:none !important}
</style>
</head>

/* ══════════════════════════════════════════════════════════════════
   LEVEL GENERATION — 1000 deterministic levels, 10 chapters of 100.
   ══════════════════════════════════════════════════════════════════ */
const LEVELS = 1000, PER_CHAPTER = 100;

const MODS = {
  flash:    {icon:"👁", name:"Flash",       desc:"The word appears for a moment instead of being spoken."},
  blind:    {icon:"🚫", name:"Blind",       desc:"No definition. The sentence is all you get."},
  rapid:    {icon:"⏱", name:"Rapid",       desc:"Fifteen seconds per word."},
  ironman:  {icon:"💀", name:"Sudden Death",desc:"One life. One mistake ends the level."},
  marathon: {icon:"🏃", name:"Marathon",    desc:"Twelve words instead of the usual set."},
  scramble: {icon:"🔀", name:"Scramble",    desc:"The word is never spoken — you get its letters, jumbled, and nothing else. No hints."},
  gauntlet: {icon:"🌪", name:"Gauntlet",   desc:"Words drawn from every band you've faced."},
  echo:     {icon:"🔇", name:"Echo",        desc:"You may hear each word only twice."}
};
const MOD_UNLOCK = [ /*ch0*/[], /*1*/["flash"], /*2*/["flash","blind"], /*3*/["flash","blind","rapid"],
  /*4*/["flash","blind","rapid","ironman"], /*5*/["flash","blind","rapid","ironman","marathon"],
  /*6*/["flash","blind","rapid","ironman","marathon","scramble"],
  /*7*/["flash","blind","rapid","ironman","marathon","scramble","gauntlet"],
  /*8*/["flash","blind","rapid","ironman","marathon","scramble","gauntlet","echo"],
  /*9*/["flash","blind","rapid","ironman","marathon","scramble","gauntlet","echo"] ];

function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function specFor(n){
  const rnd = mulberry32(Math.imul(n, 2654435761) >>> 0);
  const ch  = Math.floor((n-1)/PER_CHAPTER);
  const pos = (n-1) % PER_CHAPTER;
  const boss = pos % 10 === 9;
  const mods = [];

  if((boss && ch >= 3) || (!boss && pos % 5 === 4 && MOD_UNLOCK[ch].length)){
    const allowed = MOD_UNLOCK[ch];
    /* Lean toward the newest unlock — otherwise "flash", available since chapter 2,
       swamps late arrivals like "gauntlet" and they'd show up once in a thousand levels. */
    mods.push(allowed[Math.floor(Math.max(rnd(), rnd()) * allowed.length)]);
  }

  let count = 6 + Math.floor(ch/3);            // 6 → 9
  if(boss) count = 10;
  if(mods.includes("marathon")) count = 12;
  let lives = boss ? 3 : 3;
  if(mods.includes("ironman")) lives = 1;

  // ── word pool ──────────────────────────────────────────────
  const bandIdx = boss ? Math.min(BANDS.length-1, ch+1) : ch;
  let pool;
  if(mods.includes("gauntlet")){
    pool = [];
    for(let b=0; b<=Math.min(BANDS.length-1, ch); b++) pool = pool.concat(BANDS[b].words);
  }else{
    pool = BANDS[Math.min(bandIdx, BANDS.length-1)].words.slice();
    if(ch > 0 && !boss){                       // season with one easier + one harder word
      const lo = BANDS[Math.max(0, ch-1)].words;
      pool = pool.concat(lo.slice(0, Math.floor(lo.length/2)));
    }
  }
  const picked = [], seen = new Set(), guard = pool.length * 4;
  for(let i=0; picked.length < count && i < guard; i++){
    const c = pool[Math.floor(rnd()*pool.length)];
    if(!c || seen.has(c.w)) continue;
    seen.add(c.w); picked.push(c);
  }
  while(picked.length < count) picked.push(pool[picked.length % pool.length]);

  return {n, ch, pos, boss, mods, count, lives, words:picked,
          bandName: BANDS[Math.min(bandIdx, BANDS.length-1)].name};
}

/* ══════════════════════════════════════════════════════════════════
   SAVE
   ══════════════════════════════════════════════════════════════════ */
const SAVE_KEY = "spellbound.save.v2";     // the original single save; kept in step as a mirror
const SLOT_KEY = "spellbound.slots.v1";
const SLOTS = 3;
const blankSave = () => ({max:1, stars:{}, score:0, spelled:0, missed:0, stamp:0});
let SAVE = blankSave();
let BOOK = {active:0, slots:[null, null, null]};

function loadBook(){
  try{
    const raw = localStorage.getItem(SLOT_KEY);
    if(raw){
      const b = JSON.parse(raw);
      if(b && Array.isArray(b.slots)){
        BOOK = b;
        while(BOOK.slots.length < SLOTS) BOOK.slots.push(null);
        if(!(BOOK.active >= 0 && BOOK.active < SLOTS)) BOOK.active = 0;
      }
    }else{
      const old = localStorage.getItem(SAVE_KEY);   // carry over a save made before slots existed
      if(old){ BOOK.slots[0] = Object.assign(blankSave(), JSON.parse(old)); BOOK.active = 0; }
    }
  }catch(e){}
  if(!BOOK.slots[BOOK.active]) BOOK.slots[BOOK.active] = blankSave();
  SAVE = BOOK.slots[BOOK.active];
}
function persist(){
  SAVE.stamp = Date.now();
  BOOK.slots[BOOK.active] = SAVE;
  try{
    localStorage.setItem(SLOT_KEY, JSON.stringify(BOOK));
    localStorage.setItem(SAVE_KEY, JSON.stringify(SAVE));
  }catch(e){}
}
function useSlot(i){
  if(i < 0 || i >= SLOTS) return;
  BOOK.active = i;
  if(!BOOK.slots[i]) BOOK.slots[i] = blankSave();
  SAVE = BOOK.slots[i];
  persist();
}
function eraseSlot(i){
  BOOK.slots[i] = null;
  if(BOOK.active === i){ BOOK.slots[i] = blankSave(); SAVE = BOOK.slots[i]; }
  persist();
}
function totalStars(save){ const s = save || SAVE; let t = 0; for(const k in s.stars) t += s.stars[k]; return t; }

/* ── export / import ─────────────────────────────────────────
   localStorage is easily wiped, and a save is a few hundred levels of work.
   A slot can be written out as a file and read back on any machine. */
function slotPayload(i){
  return JSON.stringify({game:"spellbound", format:1, slot:i+1, save:BOOK.slots[i] || blankSave()}, null, 1);
}
function exportSlot(i){
  const text = slotPayload(i), name = "spellbound-book" + (i+1) + ".json";
  let url = "data:application/json;charset=utf-8," + encodeURIComponent(text), revoke = null;
  try{                                    // a Blob is the reliable route from a file:// page
    const b = new Blob([text], {type:"application/json"});
    url = URL.createObjectURL(b);
    revoke = () => URL.revokeObjectURL(url);
  }catch(e){}
  const a = document.createElement("a");
  a.href = url; a.download = name;
  if(document.body) document.body.appendChild(a);
  a.click();
  if(a.remove) a.remove();
  if(revoke) setTimeout(revoke, 4000);
  return name;
}
/* Never trust the file: a hand-edited or truncated save must not corrupt the game. */
function applyImport(text, slot){
  let o;
  try{ o = JSON.parse(text); }catch(e){ return false; }
  const s = o && (o.save || o);
  if(!s || typeof s !== "object" || typeof s.max !== "number" || !s.stars || typeof s.stars !== "object") return false;
  const clean = blankSave();
  clean.max     = Math.max(1, Math.min(LEVELS, Math.floor(s.max) || 1));
  clean.score   = Math.max(0, Math.floor(+s.score)   || 0);
  clean.spelled = Math.max(0, Math.floor(+s.spelled) || 0);
  clean.missed  = Math.max(0, Math.floor(+s.missed)  || 0);
  for(const k in s.stars){
    const n = Math.floor(+k), v = Math.floor(+s.stars[k]);
    if(n >= 1 && n <= LEVELS && v >= 1 && v <= 3) clean.stars[n] = v;
  }
  BOOK.slots[slot] = clean;
  BOOK.active = slot;
  SAVE = clean;
  persist();
  return true;
}
loadBook();

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ── speech ───────────────────────────────────────────────────── */
const synth = window.speechSynthesis || null;
let voice = null;
function pickVoice(){
  if(!synth) return;
  const vs = synth.getVoices(); if(!vs.length) return;
  voice = vs.find(v => /en[-_]US/i.test(v.lang) && /natural|premium|enhanced/i.test(v.name))
       || vs.find(v => /en[-_](US|GB)/i.test(v.lang))
       || vs.find(v => /^en/i.test(v.lang)) || vs[0];
}
if(synth){ pickVoice(); synth.onvoiceschanged = pickVoice; }
function say(text, rate){
  if(!synth || S.silent) return false;
  synth.cancel();
  const u = new SpeechSynthesisUtterance(text);
  if(voice) u.voice = voice;
  u.rate = rate || .92;
  u.onstart = () => { const o = document.getElementById("orb"); if(o) o.classList.add("on"); };
  u.onend = u.onerror = () => { const o = document.getElementById("orb"); if(o) o.classList.remove("on"); };
  synth.speak(u);
  return true;
}
let actx = null;
function beep(freqs, dur, type){
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    freqs.forEach((f,i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type || "sine"; o.frequency.value = f;
      const t = actx.currentTime + i*0.075;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.16, t+0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+dur+0.02);
    });
  }catch(e){}
}

/* ══════════════════════════════════════════════════════════════════
   SAVES — three books, plus export/import
   ══════════════════════════════════════════════════════════════════ */
function stamp(t){
  if(!t) return "never played";
  try{
    const d = new Date(t);
    return d.toLocaleDateString() + " · " + d.toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"});
  }catch(e){ return "saved"; }
}

function saves(msg){
  if(synth) synth.cancel(); stopTimer();
  app.innerHTML = "";
  const roman = ["I","II","III"];
  const cards = BOOK.slots.map((raw,i) => {
    const s = raw || blankSave(), on = i === BOOK.active, fresh = s.max <= 1 && !totalStars(s);
    return `<div class="slot ${on ? "on" : ""}">
      <div class="slothead"><b>Book ${roman[i]}</b>${on ? '<span class="inuse">in use</span>' : ""}</div>
      <div class="slotstats">${fresh
        ? '<span class="dimline">empty — a fresh start</span>'
        : `Level ${Math.min(s.max, LEVELS)} · ${totalStars(s)}★ · ${s.score.toLocaleString()} pts · ${s.spelled.toLocaleString()} words
           <br><span class="dimline">${stamp(s.stamp)}</span>`}</div>
      <div class="row" style="justify-content:flex-start; margin-top:10px">
        <button class="btn sm ${on ? "primary" : ""}" id="use${i}">${on ? "Continue" : (fresh ? "Start here" : "Open this book")}</button>
        <button class="btn sm" id="exp${i}" ${fresh ? "disabled" : ""}>Export</button>
        <button class="btn sm" id="imp${i}">Import</button>
        <button class="btn sm" id="del${i}" ${fresh ? "disabled" : ""}>Erase</button>
      </div></div>`;
  }).join("");

  const c = el(`<div class="card">
    <div class="row" style="justify-content:space-between; margin-bottom:14px">
      <button class="btn sm" id="home">← Menu</button>
      <span class="chip">progress saves itself after every level</span>
    </div>
    <h1 style="font-size:32px">Saves</h1>
    <p class="lede">Three separate books of progress. Export one to a file before clearing your browser —
    that file is the only copy that survives it.</p>
    ${msg ? `<p class="lede" style="color:var(--gold)">${esc(msg)}</p>` : ""}
    ${cards}
    <div class="row" style="margin-top:16px">
      <button class="btn sm" id="paste">Paste a save code</button>
    </div>
    <div class="foot">Export writes spellbound-book&lt;n&gt;.json to your downloads. Import replaces that book.</div>
  </div>`);
  app.appendChild(c);
  c.querySelector("#home").onclick = title;

  BOOK.slots.forEach((raw,i) => {
    c.querySelector("#use" + i).onclick = () => { useSlot(i); title(); };
    const ex = c.querySelector("#exp" + i);
    if(ex) ex.onclick = () => { exportSlot(i); saves("Book " + roman[i] + " exported."); };
    c.querySelector("#imp" + i).onclick = () => pickFile(i);
    const del = c.querySelector("#del" + i);
    if(del) del.onclick = () => {
      if(confirm("Erase Book " + roman[i] + " — every level, star and point in it?")){ eraseSlot(i); saves("Book " + roman[i] + " erased."); }
    };
  });
  c.querySelector("#paste").onclick = () => {
    const text = prompt("Paste the contents of an exported save file:");
    if(text == null) return;
    saves(applyImport(text, BOOK.active) ? "Imported into Book " + roman[BOOK.active] + "." : "That doesn't look like a Spellbound save.");
  };
}

function pickFile(i){
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "application/json,.json";
  inp.onchange = () => {
    const f = inp.files && inp.files[0];
    if(!f) return;
    const r = new FileReader();
    r.onload = () => saves(applyImport(String(r.result), i)
      ? "Imported into Book " + ["I","II","III"][i] + "."
      : "That file isn't a Spellbound save.");
    r.onerror = () => saves("Could not read that file.");
    r.readAsText(f);
  };
  inp.click();
}

function startLevel(n, drillWords){
  S.spec = drillWords
    ? {n:0, ch:S.spec ? S.spec.ch : 0, pos:0, boss:false, mods:[], count:drillWords.length,
       lives:3, words:drillWords, bandName:"Drill"}
    : specFor(n);
  S.drill = drillWords ? true : null;
  S.idx = 0; S.lives = S.spec.lives; S.score = 0; S.streak = 0;
  S.misses = []; S.correct = 0; S.hintsTotal = 0;
  nextWord();
}

function hasMod(m){ return S.spec.mods.indexOf(m) >= 0; }

/* Words you cannot tell apart by ear alone. These always arrive with their
   definition already showing — even on Blind levels — or the level is a coin flip. */
const HOMOPHONES = new Set(("weather whether principal principle stationery stationary " +
 "complement compliment desert dessert altar alter aloud allowed capital capitol council counsel " +
 "discreet discrete elicit illicit peddle pedal morning mourning cereal serial vain vein " +
 "waist waste medal meddle cite site bare bear borne brake break threw through forth fourth " +
 "emigrate immigrate affect effect accept except palate palette pallet rain reign rein " +
 "canvas canvass currant current discus discuss ordinance ordnance " +
 "censor sensor censure hoard horde troop troupe carat caret " +
 "cannon canon miner minor mantel mantle metal mettle " +
 "gilt guilt idle idol wreak reek yoke yolk").split(" "));

/* The bank is American throughout, so a British speller shouldn't lose a heart over
   "neighbour" or "realise". The leniency is generated from the TARGET word only and
   compared exactly. An earlier version folded BOTH sides through the same rewrite
   rules, which quietly accepted "promize" for "promise", "for" for "four" and
   "filed" for "filled" — two unrelated words can fold to the same string, but a
   variant generated from one word cannot silently swallow another. */
const ALT_SPELLINGS = {
  anesthesia:["anaesthesia"], hemorrhage:["haemorrhage"], hemorrhagic:["haemorrhagic"],
  aesthetic:["esthetic"], paleontology:["palaeontology"], maneuver:["manoeuvre"],
  jewelry:["jewellery"], license:["licence"], skulduggery:["skullduggery"],
  vermilion:["vermillion"], neighborhood:["neighbourhood"], gray:["grey"],
  /* -re and a few one-offs are a closed class — safer listed than derived */
  center:["centre"], theater:["theatre"], meter:["metre"], liter:["litre"],
  fiber:["fibre"], somber:["sombre"], specter:["spectre"], luster:["lustre"],
  defense:["defence"], offense:["offence"], catalog:["catalogue"], dialog:["dialogue"],
  mold:["mould"], plow:["plough"], mustache:["moustache"], pajamas:["pyjamas"]
};
function variantsOf(word){
  const v = new Set(ALT_SPELLINGS[word] || []);
  if(/ization$/.test(word))                      v.add(word.replace(/ization$/, "isation"));
  else if(/ize$/.test(word)  && word.length > 4) v.add(word.replace(/ize$/,  "ise"));
  if(/yze$/.test(word)       && word.length > 4) v.add(word.replace(/yze$/,  "yse"));
  /* -or → -our, but not on "for"/"nor"; note "four" and "hour" already end in -our
     and so are never touched, which is exactly what the old fold() got wrong. */
  if(/[^u]or$/.test(word)    && word.length >= 5) v.add(word.replace(/or$/, "our"));
  /* British doubles the l: traveled → travelled. Only fires on a SINGLE l after a
     vowel, so "filled" generates nothing and "filed" can never pass for it. */
  if(/[aeiou]l(ed|ing|er)$/.test(word)) v.add(word.replace(/l(ed|ing|er)$/, "ll$1"));
  v.delete(word);
  return v;
}

function nextWord(){
  stopTimer();
  if(S.idx >= S.spec.words.length) return levelDone(true);
  S.cur = S.spec.words[S.idx];
  S.hints = 0; S.revealed = 0; S.answered = false; S.plays = 0; S.t0 = Date.now();
  render();
  if(HOMOPHONES.has(S.cur.w)){
    const box = document.getElementById("clue");
    box.innerHTML = `<span class="lbl">Sound-alike — definition given</span>${esc(S.cur.d)}.`;
  }
  setTimeout(() => { promptWord(true); if(hasMod("rapid")) startTimer(); }, 340);
}

function promptWord(auto){
  if(hasMod("scramble")) return;          // the jumbled letters ARE the clue; no voice
  if(hasMod("echo") && S.plays >= 2) return;
  S.plays++;
  if(S.silent || hasMod("flash")){
    const f = document.getElementById("flash");
    if(f){
      f.textContent = S.cur.w.toUpperCase(); f.style.opacity = "1";
      clearTimeout(promptWord._t);
      promptWord._t = setTimeout(() => { f.style.opacity = "0"; }, 1300);
    }
    if(!S.silent && hasMod("flash")) return;
    return;
  }
  say(S.cur.w + (HOMOPHONES.has(S.cur.w) ? ". " + S.cur.d + "." : ""), auto ? .88 : .8);
}

function startTimer(){
  S.deadline = Date.now() + 15000;
  const bar = document.getElementById("tbar");
  S.timer = setInterval(() => {
    const left = S.deadline - Date.now();
    if(bar) bar.style.width = Math.max(0, left/15000*100) + "%";
    if(left <= 0){ stopTimer(); if(!S.answered) submit(true); }
  }, 80);
}
function stopTimer(){ if(S.timer){ clearInterval(S.timer); S.timer = null; } }

function render(){
  const sp = S.spec, prog = Math.round(S.idx/sp.words.length*100);
  const flashy = S.silent || hasMod("flash");
  const modPills = sp.mods.map(m => `<span class="pill mod" title="${MODS[m].desc}">${MODS[m].icon} ${MODS[m].name}</span>`).join("");
  app.innerHTML = "";
  const c = el(`<div class="card">
    <div class="hud">
      <span class="pill">${S.drill ? "Drill" : (sp.boss ? "◆ Level " : "Level ") + sp.n}</span>
      <span class="pill">${sp.bandName}</span>
      ${modPills}
      <span class="pill">Word <b>${S.idx+1}</b>/${sp.words.length}</span>
      <span class="pill" title="Words spelled correctly — this level, and across every level you've played">Spelled <b id="spelled">${S.correct}</b> · <b id="spelledAll">${SAVE.spelled.toLocaleString()}</b> all time</span>
      <span class="pill">Score <b id="score">${S.score.toLocaleString()}</b></span>
      <span class="hearts">${"❤".repeat(S.lives)}<span style="opacity:.2">${"❤".repeat(Math.max(0, sp.lives - S.lives))}</span></span>
    </div>
    <div class="bar"><i style="width:${prog}%"></i></div>
    ${hasMod("rapid") ? `<div class="bar time"><i id="tbar" style="width:100%"></i></div>` : ""}

    <div class="speaker">
      ${hasMod("scramble") ? `<div class="scram">${scrambled(S.cur.w)}</div>`
        : flashy ? `<div class="flashword" id="flash" style="opacity:0"></div>`
                 : `<div class="orb" id="orb" title="Hear it again">🔊</div>`}
    </div>

    <div class="reveal" id="reveal"></div>
    <div class="clue" id="clue"></div>

    <input type="text" id="answer" autocomplete="off" autocorrect="off" autocapitalize="off"
           spellcheck="false" placeholder="spell it" aria-label="Your spelling">

    <div class="tools">
      <button class="btn sm" id="b-rep" ${hasMod("scramble") ? "disabled title='Scramble level — the word is never spoken'" : ""}>${
        hasMod("scramble") ? "🔀 Letters only" : flashy ? "👁 Flash again" : "🔊 Hear again"}</button>
      ${flashy || hasMod("scramble") ? "" : `<button class="btn sm" id="b-slow">🐢 Letter by letter</button>`}
      <button class="btn sm" id="b-def" ${hasMod("blind") ? "disabled title='Blind level — no definition'" : ""}>📖 Definition</button>
      <button class="btn sm" id="b-sen">💬 Sentence</button>
      <button class="btn sm" id="b-hint" ${hasMod("scramble") ? "disabled title='Scramble level — no hints'" : ""}>💡 Hint</button>
    </div>
    <div class="go"><button class="btn primary" id="b-go">Spell it</button></div>
    <div class="verdict" id="verdict"></div>
    <div class="foot">Esc to leave the level</div>
  </div>`);
  app.appendChild(c);

  const inp = c.querySelector("#answer");
  inp.focus();
  const orb = c.querySelector("#orb");
  if(orb) orb.onclick = () => promptWord(false);
  c.querySelector("#b-rep").onclick = () => { promptWord(false); inp.focus(); };
  const slow = c.querySelector("#b-slow");
  if(slow) slow.onclick = () => {
    if(hasMod("echo") && S.plays >= 2) return;
    S.plays++; say(S.cur.w.split("").join(", "), .7); inp.focus();
  };
  c.querySelector("#b-def").onclick  = () => showClue("definition");
  c.querySelector("#b-sen").onclick  = () => showClue("sentence");
  c.querySelector("#b-hint").onclick = () => hint();
  c.querySelector("#b-go").onclick   = () => submit();
  inp.addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); submit(); } });
}

function scrambled(w){
  const up = w.toUpperCase(), a = up.split("");
  const rnd = mulberry32(w.length * 7919 + w.charCodeAt(0));
  /* A shuffle is allowed to land back on the original — "KNIFE" and "KNOCK" both
     did, handing the player the answer in order. Reshuffle until it moves. */
  for(let pass = 0; pass < 8; pass++){
    for(let i=a.length-1;i>0;i--){ const j = Math.floor(rnd()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; }
    if(a.join("") !== up) break;
  }
  return a.join(" ");
}

function showClue(kind){
  const box = document.getElementById("clue");
  if(kind === "definition"){
    if(hasMod("blind")) return;
    box.innerHTML = `<span class="lbl">Definition</span>${esc(S.cur.d)}.`;
    say("Definition. " + S.cur.d);
  }else{
    const blank = `<span class="blank">${"—".repeat(Math.max(4, Math.min(12, S.cur.w.length)))}</span>`;
    box.innerHTML = `<span class="lbl">Used in a sentence</span>${esc(S.cur.s).replace("~", blank)}`;
    /* The sentence says the word out loud, so on Echo levels it spends a play —
       otherwise the two-play limit is bypassed by pressing Sentence repeatedly. */
    let spoken = S.cur.s.replace("~", S.cur.w);
    if(hasMod("scramble")) spoken = S.cur.s.replace("~", "blank");
    else if(hasMod("echo")){
      if(S.plays >= 2) spoken = S.cur.s.replace("~", "blank");
      else S.plays++;
    }
    say(spoken);
  }
  const inp = document.getElementById("answer"); if(inp) inp.focus();
}

function hint(){
  if(S.answered || hasMod("scramble")) return;
  const w = S.cur.w, box = document.getElementById("reveal");
  S.hints++; S.hintsTotal++;
  if(S.hints === 1){
    box.textContent = "_".repeat(w.length);
    box.title = w.length + " letters";
  }else{
    S.revealed = Math.min(w.length-1, S.revealed+1);
    box.textContent = (w.slice(0, S.revealed) + "_".repeat(w.length - S.revealed)).toUpperCase();
    if(S.revealed >= w.length-1) document.getElementById("b-hint").disabled = true;
  }
  beep([620], .09, "triangle");
  document.getElementById("answer").focus();
}

function submit(timedOut){
  if(S.answered) return;
  const inp = document.getElementById("answer");
  const given = (inp.value || "").trim().toLowerCase().replace(/\s+/g, "");
  if(!given && !timedOut){ inp.focus(); return; }
  S.answered = true; stopTimer();
  if(synth) synth.cancel();

  const word = S.cur.w.toLowerCase();
  const variant = !timedOut && given !== word && variantsOf(word).has(given);
  const ok = !timedOut && (given === word || variant);
  const v = document.getElementById("verdict");
  inp.classList.add(ok ? "good" : "bad");
  inp.disabled = true;
  ["b-hint","b-go"].forEach(id => { const b = document.getElementById(id); if(b) b.disabled = true; });

  if(ok){
    S.correct++; S.streak++; SAVE.spelled++;
    const secs = (Date.now() - S.t0)/1000;
    const base = 10*(S.spec.ch+1) + 6*word.length;
    const streakMult = Math.min(3, 1 + S.streak*0.12);
    const hintMult = Math.pow(0.5, S.hints);
    const speed = (S.hints === 0 && secs < 9) ? 25 : 0;
    const modBonus = 1 + S.spec.mods.length*0.35 + (S.spec.boss ? 0.5 : 0);
    const pts = Math.round(base * streakMult * hintMult * modBonus) + speed;
    S.score += pts;
    beep([660,880,1180], .16, "sine");
    const praise = ["Correct.","Well spelled.","Exactly right.","Clean.","That's the one.","Flawless."];
    v.innerHTML = `<div class="head" style="color:var(--good)">${praise[S.correct % praise.length]}</div>
      <div class="word">${word.toUpperCase().split("").map(ch => `<span class="c">${ch}</span>`).join("")}</div>
      ${variant ? `<div class="yours">accepted as a spelling variant</div>` : ""}
      <div class="pts">+${pts}${speed ? " (quick +25)" : ""}${S.hints ? ` · ${S.hints} hint${S.hints>1?"s":""}` : ""}${S.streak>=3 ? ` · streak ×${streakMult.toFixed(2)}` : ""}</div>`;
  }else{
    S.streak = 0; S.lives--; SAVE.missed++;
    S.misses.push({w:word, given: given || "—", d:S.cur.d, ref:S.cur});
    beep([300,190], .24, "sawtooth");
    let marked = "";
    for(let i=0;i<word.length;i++) marked += `<span class="${given[i] === word[i] ? "c" : "x"}">${word[i].toUpperCase()}</span>`;
    v.innerHTML = `<div class="head" style="color:var(--bad)">${timedOut ? "Time." : "Not quite."}</div>
      <div class="word">${marked}</div>
      <div class="yours">${given ? "you spelled &ldquo;" + esc(given) + "&rdquo;" : "no answer given"}</div>
      <div class="pts" style="color:var(--dim)">${esc(S.cur.d)}.</div>`;
    say(word + ". " + word.split("").join(", ") + ". " + word, .78);
  }

  const sc = document.getElementById("score"); if(sc) sc.textContent = S.score.toLocaleString();
  /* The counters live in the HUD, which isn't re-rendered until the next word,
     so tick them here rather than waiting for nextWord(). */
  const sp2 = document.getElementById("spelled");    if(sp2) sp2.textContent = S.correct;
  const sa  = document.getElementById("spelledAll"); if(sa)  sa.textContent = SAVE.spelled.toLocaleString();
  const go = document.getElementById("b-go");
  go.disabled = false;
  go.textContent = S.lives <= 0 ? "Level failed →" : (S.idx+1 >= S.spec.words.length ? "Finish level →" : "Next word →");
  go.onclick = advance;
  go.focus();
}

function advance(){
  S.idx++;
  if(S.lives <= 0) return levelDone(false);
  nextWord();
}

/* ══════════════════════════════════════════════════════════════════
   LEVEL RESULTS
   ══════════════════════════════════════════════════════════════════ */
function levelDone(cleared){
  if(synth) synth.cancel(); stopTimer();
  const sp = S.spec;
  /* Three stars is a clean sheet: nothing missed and nothing revealed. */
  let stars = 0;
  if(cleared) stars = (S.misses.length === 0 && S.hintsTotal === 0) ? 3
                    : (S.misses.length <= 1) ? 2 : 1;

  let newBest = false, unlocked = false;
  if(cleared && !S.drill){
    if(stars > (SAVE.stars[sp.n] || 0)){ SAVE.stars[sp.n] = stars; newBest = true; }
    if(sp.n >= SAVE.max && sp.n < LEVELS){ SAVE.max = sp.n + 1; unlocked = true; }
    SAVE.score += S.score;
    persist();
  }else if(!S.drill){ SAVE.score += S.score; persist(); }

  const finale = cleared && !S.drill && sp.n === LEVELS;
  const head = finale ? "Spellbound."
             : cleared ? (S.drill ? "Drill complete." : (sp.boss ? "Boss cleared." : "Level cleared."))
             : "Out of lives.";
  const sub  = finale ? "One thousand levels. Every chapter, every boss. There is nothing left to spell."
             : cleared ? (stars === 3 ? "Perfect — not a miss, not a hint."
                        : stars === 2 ? (S.misses.length ? "One away from perfect." : "Cleared — but the hints cost you a star.")
                        : "Cleared, but the words fought back.")
             : "The level resets — but the words that beat you are listed below.";

  app.innerHTML = "";
  const c = el(`<div class="card">
    <h1 style="font-size:34px">${head}</h1>
    ${S.drill ? "" : `<div class="starline">${[1,2,3].map(i => i <= stars ? "★" : '<span class="off">★</span>').join("")}</div>`}
    <p class="lede">${sub}</p>
    <div class="stats">
      <div class="stat"><b>${S.score.toLocaleString()}</b><span>level score</span></div>
      <div class="stat"><b>${S.correct}/${S.spec.words.length}</b><span>spelled</span></div>
      <div class="stat"><b>${totalStars()}</b><span>total stars</span></div>
      <div class="stat"><b>${SAVE.score.toLocaleString()}</b><span>lifetime</span></div>
    </div>
    ${unlocked && !finale ? `<p class="lede" style="color:var(--gold)">Level ${sp.n+1} unlocked${(sp.n)%PER_CHAPTER === 0 ? " — a new chapter opens." : ""}.</p>` : ""}
    ${S.misses.length ? `<div class="tag" style="margin:16px 0 8px">words that got away</div>
      <div class="misses">${S.misses.map(m => `<div class="miss">
        <span class="w">${esc(m.w)}</span><span class="y">${esc(m.given)}</span><span class="d">${esc(m.d)}</span></div>`).join("")}</div>` : ""}
    <div class="row" style="margin-top:18px">
      ${cleared && !finale && !S.drill && sp.n < LEVELS ? `<button class="btn primary" id="next">Level ${sp.n+1} →</button>` : ""}
      ${!cleared ? `<button class="btn primary" id="retry">${S.drill ? "Run the drill again" : "Try level " + sp.n + " again"}</button>` : ""}
      ${S.misses.length ? `<button class="btn" id="drill">Drill the ${S.misses.length} miss${S.misses.length>1?"es":""}</button>` : ""}
      <button class="btn" id="map">Level map</button>
      <button class="btn" id="menu">Menu</button>
    </div>
  </div>`);
  app.appendChild(c);
  const nx = c.querySelector("#next");
  if(nx){ nx.onclick = () => startLevel(sp.n + 1); nx.focus(); }
  /* A drill has no level number — sp.n is 0, and startLevel(0) would ask specFor()
     for chapter -1 and die on BANDS[-1]. Replay the same words instead. */
  const rt = c.querySelector("#retry"), againWords = S.drill ? sp.words.slice() : null;
  if(rt){ rt.onclick = () => (againWords ? startLevel(0, againWords) : startLevel(sp.n)); rt.focus(); }
  const dr = c.querySelector("#drill");
  if(dr) dr.onclick = () => startLevel(0, S.misses.map(m => m.ref));
  c.querySelector("#map").onclick = () => { S.viewCh = Math.min(BANDS.length-1, sp.ch); map(); };
  c.querySelector("#menu").onclick = title;
}

/* ══════════════════════════════════════════════════════════════════
   HOTKEYS
   ══════════════════════════════════════════════════════════════════ */
document.addEventListener("keydown", e => {
  if(e.key === "Escape"){ if(synth) synth.cancel(); stopTimer(); S.cur = null; title(); return; }
  if(!e.altKey || !S.cur || !document.getElementById("answer")) return;
  const k = e.key.toLowerCase();
  if(k === "r"){ e.preventDefault(); promptWord(false); }
  else if(k === "d"){ e.preventDefault(); showClue("definition"); }
  else if(k === "s"){ e.preventDefault(); showClue("sentence"); }
  else if(k === "h"){ e.preventDefault(); if(!S.answered) hint(); }
});

title();
</script>
</body>
</html>
