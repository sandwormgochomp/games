<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AEGIS — 100 levels</title>

<style>
  :root{
    --ink:      #080C18;
    --ink-2:    #0E1529;
    --ink-3:    #172244;
    --bone:     #DED9CB;
    --dim:      #5A648C;
    --brass:    #E8B45C;
    --brass-hi: #FFE9B8;
    --ice:      #6FD8FF;
    --rose:     #FF5E7A;
    --jade:     #5CE8B0;

    --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Segoe UI Mono", "Roboto Mono", Consolas, monospace;
    --sans: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", sans-serif;
  }

  *{ box-sizing:border-box; }
  html,body{ height:auto; min-height:100%; }
  body{
    margin:0; overflow:auto;
    background:radial-gradient(120% 90% at 50% 0%, var(--ink-2) 0%, var(--ink) 62%), var(--ink);
    color:var(--bone);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
  }

  .cab{
    position:relative;
    display:flex; flex-direction:column;
    height:100vh; height:100dvh; min-height:440px;
  }

  /* telemetry rail */
  .rail{
    display:flex; align-items:center; gap:clamp(12px,2.4vw,34px);
    padding:12px clamp(12px,3vw,30px) 11px;
    border-bottom:1px solid rgba(90,100,140,.3);
    font-family:var(--mono); font-variant-numeric:tabular-nums;
    user-select:none; flex:0 0 auto;
  }
  .brandmark{ display:flex; align-items:baseline; gap:10px; margin-right:auto; min-width:0; }
  .brandmark b{ font-weight:600; font-size:15px; letter-spacing:.42em; color:var(--brass); text-transform:uppercase; }
  .brandmark span{ font-family:var(--sans); font-size:11px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .read{ display:flex; flex-direction:column; gap:3px; }
  .read i{ font-style:normal; font-size:9px; letter-spacing:.24em; text-transform:uppercase; color:var(--dim); }
  .read b{ font-weight:600; font-size:17px; letter-spacing:.04em; line-height:1; }
  .read.level b{ color:var(--ice); }
  .read.level b small{ font-size:11px; color:var(--dim); font-weight:400; }
  .read.combo b{ color:var(--brass); transition:transform .12s ease; }
  .read.combo.pop b{ transform:scale(1.3); }
  .read.best b{ color:var(--dim); }

  .hull{ display:flex; gap:5px; align-items:center; height:17px; }
  .pip{ width:8px; height:17px; background:var(--brass);
        box-shadow:0 0 9px rgba(232,180,92,.6);
        clip-path:polygon(50% 0,100% 26%,100% 100%,0 100%,0 26%);
        transition:background .18s, box-shadow .18s, opacity .18s; }
  .pip.out{ background:var(--ink-3); box-shadow:none; opacity:.65; }

  .pulse-meter{ width:60px; height:4px; background:var(--ink-3); overflow:hidden; }
  .pulse-meter i{ display:block; height:100%; width:100%; background:var(--ice); transform-origin:left; }
  .pulse-meter.ready i{ background:var(--brass-hi); box-shadow:0 0 10px var(--brass); }

  .mute{ appearance:none; border:1px solid rgba(90,100,140,.4); background:transparent; color:var(--dim);
         font-family:var(--mono); font-size:9px; letter-spacing:.2em; text-transform:uppercase;
         padding:7px 10px; cursor:pointer; transition:color .15s, border-color .15s; }
  .mute:hover,.mute:focus-visible{ color:var(--brass); border-color:var(--brass); }

  /* field */
  .field{ position:relative; flex:1 1 auto; min-height:260px; overflow:hidden; }
  .field canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:crosshair; }

  .veil{
    position:absolute; inset:0; display:grid; place-items:center;
    background:radial-gradient(60% 60% at 50% 50%, rgba(8,12,24,.74) 0%, rgba(8,12,24,.94) 100%);
    opacity:0; pointer-events:none; transition:opacity .3s ease; z-index:5;
  }
  .veil.on{ opacity:1; pointer-events:auto; }

  /* 66ch, not 58: overflow-y:auto forces the x axis to clip too, so an eight-letter
     title ("Overhaul", "Breached") has to fit the card or it loses its last glyph */
  .card{ text-align:center; padding:20px 24px; max-width:66ch; max-height:100%; overflow-y:auto; }
  .card h1{
    margin:0; font-family:var(--mono); font-weight:600;
    font-size:clamp(36px,8.5vw,70px); line-height:.94;
    letter-spacing:.2em; text-indent:.2em; color:var(--brass-hi);
    text-shadow:0 0 44px rgba(232,180,92,.55);
  }
  .card .sub{ margin:13px 0 0; font-family:var(--mono); font-size:10px; letter-spacing:.38em;
              text-transform:uppercase; color:var(--dim); }
  .card .lede{ margin:22px auto 0; max-width:42ch; font-size:14px; line-height:1.6;
               color:rgba(222,217,203,.82); text-wrap:balance; }
  .card .lede em{ color:var(--ice); font-style:normal; }
  .card .lede strong{ color:var(--brass); font-weight:600; }

  .keys{ margin:24px auto 0; display:flex; flex-wrap:wrap; justify-content:center; gap:9px 24px;
         font-family:var(--mono); font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--dim); }
  .keys b{ color:var(--bone); font-weight:600; }

  .btns{ margin:26px auto 0; display:flex; flex-wrap:wrap; gap:10px; justify-content:center; }
  .btn{
    appearance:none; cursor:pointer;
    border:1px solid var(--brass); background:transparent; color:var(--brass);
    font-family:var(--mono); font-size:11px; letter-spacing:.24em; text-transform:uppercase;
    padding:13px 22px; transition:background .16s, color .16s;
  }
  .btn:hover,.btn:focus-visible{ background:var(--brass); color:var(--ink); outline:none; }
  .btn.ghost{ border-color:rgba(90,100,140,.55); color:var(--dim); }
  .btn.ghost:hover,.btn.ghost:focus-visible{ background:var(--ink-3); color:var(--bone); }

  /* refit choices */
  .picks{ margin:28px auto 0; display:grid; gap:10px;
          grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); text-align:left; }
  .pick{ appearance:none; cursor:pointer; display:flex; flex-direction:column; gap:8px;
         border:1px solid rgba(90,100,140,.5); background:transparent; color:var(--bone);
         padding:16px 15px; transition:border-color .16s, background .16s, transform .16s; }
  .pick:hover,.pick:focus-visible{ border-color:var(--brass); background:rgba(232,180,92,.08);
                                   transform:translateY(-2px); outline:none; }
  .pick b{ font-family:var(--mono); font-size:11.5px; font-weight:600;
           letter-spacing:.14em; text-transform:uppercase; color:var(--brass); }
  .pick .tier{ font-family:var(--mono); font-size:9px; letter-spacing:.22em;
               text-transform:uppercase; color:var(--ice); }
  .pick .desc{ font-size:12.5px; line-height:1.45; color:rgba(222,217,203,.72); }

  .picks.mega .pick{ border-color:rgba(255,94,122,.55); }
  .picks.mega .pick:hover,.picks.mega .pick:focus-visible{
    border-color:var(--rose); background:rgba(255,94,122,.09); }
  .picks.mega .pick b{ color:var(--rose); }
  .picks.mega .pick .tier{ color:var(--brass-hi); }

  /* auto-fit so a three-stat pause card and a four-stat results card both sit flush */
  .tally{ margin:24px auto 0; display:grid; grid-template-columns:repeat(auto-fit,minmax(94px,1fr));
          gap:1px; background:rgba(90,100,140,.28); border:1px solid rgba(90,100,140,.28);
          font-family:var(--mono); font-variant-numeric:tabular-nums; max-width:440px; }
  .tally div{ background:var(--ink); padding:14px 8px; }
  .tally i{ display:block; font-style:normal; font-size:9px; letter-spacing:.2em;
            text-transform:uppercase; color:var(--dim); margin-bottom:6px; }
  .tally b{ font-size:21px; font-weight:600; }
  .tally .hi b{ color:var(--brass); }

  .record{ margin:15px 0 0; font-family:var(--mono); font-size:10px; letter-spacing:.26em;
           text-transform:uppercase; color:var(--ice); }

  /* threat strip */
  .strip{
    flex:0 0 auto;
    display:flex; align-items:center; gap:8px clamp(12px,2.2vw,26px);
    padding:10px clamp(12px,3vw,30px) 12px;
    border-top:1px solid rgba(90,100,140,.3);
    font-family:var(--mono); font-size:9.5px; letter-spacing:.15em;
    text-transform:uppercase; color:var(--dim); user-select:none;
    overflow-x:auto; white-space:nowrap; scrollbar-width:thin;
  }
  .strip .lab{ color:rgba(90,100,140,.75); flex:0 0 auto; }
  .strip span{ display:inline-flex; align-items:center; gap:6px; flex:0 0 auto; }
  .strip .sw{ width:8px; height:8px; border-radius:50%; flex:0 0 auto; }
  .strip .boss{ color:var(--rose); }
  .strip .fit{ color:var(--brass); }

  /* ── the codex ── */
  .codex{ position:absolute; inset:0; z-index:20; display:none;
          background:rgba(8,12,24,.985); overflow-y:auto; }
  .codex.on{ display:block; }
  .codex-in{ max-width:80ch; margin:0 auto; padding:0 clamp(16px,4vw,34px) 70px; }
  .codex-head{ position:sticky; top:0; z-index:2; background:rgba(8,12,24,.985);
               padding:20px 0 0; border-bottom:1px solid rgba(90,100,140,.3); }
  .codex-title{ display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; }
  .codex-title h2{ margin:0; font-family:var(--mono); font-size:15px; font-weight:600;
                   letter-spacing:.4em; text-transform:uppercase; color:var(--brass); }
  .codex-title em{ font-style:normal; font-family:var(--sans); font-size:11px; color:var(--dim); }
  .codex-title .close{ margin-left:auto; }
  .tabs{ display:flex; flex-wrap:wrap; gap:6px; margin:18px 0 0; padding-bottom:14px; }
  .tab{ appearance:none; cursor:pointer; background:transparent;
        border:1px solid rgba(90,100,140,.45); color:var(--dim);
        font-family:var(--mono); font-size:9.5px; letter-spacing:.2em;
        text-transform:uppercase; padding:9px 13px; transition:.15s; }
  .tab:hover{ color:var(--bone); border-color:rgba(90,100,140,.8); }
  .tab.on{ border-color:var(--brass); color:var(--ink); background:var(--brass); }
  .tab:focus-visible{ outline:2px solid var(--brass); outline-offset:2px; }

  .page{ display:none; padding-top:24px; }
  .page.on{ display:block; }
  .page h3{ font-family:var(--mono); font-size:10.5px; letter-spacing:.26em;
            text-transform:uppercase; color:var(--ice); margin:34px 0 12px; }
  .page h3:first-child{ margin-top:4px; }
  .page p{ font-size:14px; line-height:1.72; color:rgba(222,217,203,.84);
           margin:0 0 15px; max-width:66ch; }
  .page p.q{ border-left:2px solid var(--brass); padding-left:17px;
             color:var(--brass); font-size:14.5px; }
  .entry{ display:grid; grid-template-columns:auto 1fr; gap:15px; align-items:start;
          padding:15px 0; border-bottom:1px solid rgba(90,100,140,.18); }
  .entry .dot{ width:11px; height:11px; border-radius:50%; margin-top:6px; }
  .entry b{ font-family:var(--mono); font-size:11.5px; font-weight:600; letter-spacing:.14em;
            text-transform:uppercase; color:var(--bone); display:block; margin-bottom:4px; }
  .entry .meta{ font-family:var(--mono); font-size:9px; letter-spacing:.16em;
                text-transform:uppercase; color:var(--dim); margin-bottom:8px; }
  .entry p{ margin:0; font-size:13.5px; line-height:1.62; }
  .roll{ display:grid; grid-template-columns:repeat(auto-fill,minmax(158px,1fr));
         gap:4px 16px; margin:14px 0 4px; }
  .roll span{ font-family:var(--mono); font-size:10px; letter-spacing:.06em;
              color:rgba(90,100,140,.75); }
  .roll span.seen{ color:var(--brass); }
  .legendline{ font-family:var(--mono); font-size:9px; letter-spacing:.2em;
               text-transform:uppercase; color:var(--dim); margin-top:14px; }

  @media (max-width:720px){
    .brandmark span,.read.best,.read.score{ display:none; }
    .rail{ gap:14px; }
  }
  @media (prefers-reduced-motion:reduce){ *{ transition-duration:.01ms !important; } }
</style>
</head>
<body>

<div class="cab">
  <header class="rail">
    <div class="brandmark"><b>Aegis</b><span>orbital deflection drill</span></div>
    <div class="read score"><i>Score</i><b id="rScore">0</b></div>
    <div class="read best"><i>Best</i><b id="rBest">0</b></div>
    <div class="read level"><i>Level</i><b id="rLevel">1<small>/100</small></b></div>
    <div class="read combo" id="comboBox"><i>Chain</i><b id="rCombo">&times;1</b></div>
    <div class="read"><i>Hull</i><div class="hull" id="rHull"></div></div>
    <div class="read"><i>Pulse</i><div class="pulse-meter" id="rPulse"><i></i></div></div>
    <button class="mute" id="speed" type="button" aria-pressed="false" aria-label="Drill speed">Speed&nbsp;1&times;</button>
    <button class="mute" id="mute" type="button" aria-pressed="false">Sound&nbsp;On</button>
  </header>

  <div class="field">
    <canvas id="stage"></canvas>
    <div class="veil on" id="veil"><div class="card" id="card"></div></div>
    <div class="codex" id="codex" role="dialog" aria-label="Codex"></div>
  </div>

  <footer class="strip" id="strip"><span class="lab">Threats</span></footer>
</div>

<script>
(() => {
  "use strict";

  const cv    = document.getElementById("stage");
  const ctx   = cv.getContext("2d", { alpha:false });
  const veil  = document.getElementById("veil");
  const card  = document.getElementById("card");
  const strip = document.getElementById("strip");
  const comboBox = document.getElementById("comboBox");
  const el = {
    score:document.getElementById("rScore"), best:document.getElementById("rBest"),
    level:document.getElementById("rLevel"), combo:document.getElementById("rCombo"),
    hull:document.getElementById("rHull"),   pulse:document.getElementById("rPulse"),
  };
  const pulseBar = el.pulse.firstElementChild;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  const C = { ink:"#080C18", bone:"#DED9CB", dim:"#5A648C",
              brass:"#E8B45C", brassHi:"#FFE9B8", ice:"#6FD8FF",
              rose:"#FF5E7A", jade:"#5CE8B0" };

  const TAU = Math.PI*2;
  const rnd   = (a=1,b=0) => b + Math.random()*(a-b);
  const pick  = a => a[(Math.random()*a.length)|0];
  const clamp = (v,a,b) => v<a?a:v>b?b:v;
  const angDiff = (a,b) => { let d=(a-b+Math.PI)%TAU; if(d<0)d+=TAU; return d-Math.PI; };
  const nf = n => n.toLocaleString("en-US");
  const hsl = (h,s,l) => "hsl(" + h + " " + s + "% " + l + "%)";

  const LEVELS = 100;

  /* ── the bestiary: 11 archetypes x 11 strains = 121 monsters ── */
  /* Every archetype carries its own silhouette, its own standoff distance and
     its own orbit speed, so a Sentry does not read as a Mortar wearing a
     different colour. `orb` is orbit rad/s, `stand` scales the standoff ring,
     `bob` scales the in-and-out drift. Rammers ignore all three. */
  const ARCH = [
    { id:"lance",   name:"Lance",    hp:1, r:12, speed:30, fire:3.4, pat:"aimed",   hue:196, shape:"lance",    orb:0.18, stand:1.00, bob:1.0 },
    { id:"crawler", name:"Crawler",  hp:1, r:11, speed:38, fire:0,   pat:"ram",     hue:352, shape:"crawler" },
    { id:"weaver",  name:"Weaver",   hp:2, r:13, speed:40, fire:2.8, pat:"twin",    hue:264, shape:"weaver",   orb:0.54, stand:0.92, bob:1.5 },
    { id:"burst",   name:"Burst",    hp:2, r:15, speed:26, fire:3.0, pat:"spread3", hue:284, shape:"burst",    orb:0.44, stand:1.06, bob:1.2 },
    { id:"splitter",name:"Splitter", hp:3, r:17, speed:20, fire:3.4, pat:"heavy",   hue:158, shape:"splitter", orb:0.12, stand:0.86, bob:0.8 },
    { id:"mortar",  name:"Mortar",   hp:3, r:16, speed:16, fire:4.0, pat:"heavy2",  hue:32,  shape:"mortar",   orb:0.08, stand:1.18, bob:0.3 },
    { id:"lurker",  name:"Lurker",   hp:2, r:12, speed:46, fire:2.6, pat:"aimed",   hue:216, shape:"lurker",   orb:0.64, stand:0.78, bob:2.2, cloak:true },
    { id:"swarm",   name:"Swarm",    hp:1, r:8,  speed:58, fire:0,   pat:"ram",     hue:14,  shape:"swarm",    pack:3 },
    { id:"sentry",  name:"Sentry",   hp:4, r:18, speed:11, fire:3.8, pat:"fan5",    hue:308, shape:"sentry",   orb:0.05, stand:1.12, bob:0.2 },
    { id:"warden",  name:"Warden",   hp:5, r:20, speed:13, fire:4.2, pat:"ring8",   hue:44,  shape:"warden",   orb:0.10, stand:1.00, bob:0.5 },
    // three aimed rounds in quick succession: the first is a warning, the third is the one
    { id:"harrier", name:"Harrier",  hp:3, r:14, speed:52, fire:4.6, pat:"burst3",  hue:172, shape:"harrier",  orb:0.72, stand:0.82, bob:1.8 },
    // a turning pinwheel — the gap moves between volleys, so no arc position stays right
    { id:"rotor",   name:"Rotor",    hp:4, r:17, speed:18, fire:3.6, pat:"spiral",  hue:100, shape:"rotor",    orb:0.30, stand:1.04, bob:0.6 },
    // does not hold a standoff at all: runs at the core, fires close, pulls back out
    { id:"shrike",  name:"Shrike",   hp:2, r:13, speed:60, fire:3.0, pat:"aimed",   hue:340, shape:"shrike",   orb:0.50, stand:1.00, bob:1.0, dive:true },
    // three heavy rounds in a wide fan, from the heaviest frame out there
    { id:"bastion", name:"Bastion",  hp:6, r:22, speed:9,  fire:4.8, pat:"heavy3",  hue:64,  shape:"bastion",  orb:0.04, stand:1.22, bob:0.15 },
    // six rounds walked across the core line, one at a time, over a second and a half
    { id:"carillon",name:"Carillon", hp:3, r:16, speed:22, fire:4.4, pat:"roll6",   hue:250, shape:"carillon", orb:0.22, stand:1.10, bob:0.7 },
    // a rammer that does not stop firing on the way in
    { id:"thresher",name:"Thresher", hp:4, r:15, speed:34, fire:2.4, pat:"ram",     hue:120, shape:"thresher", ramfire:true },
  ];
  /* A strain is not just a colour ramp: `plate` is how the shell is drawn, so
     you can read what you are up against before you have read the name. */
  const STRAIN = [
    { n:"Pale",    mul:0.80, sat:30, lit:70, plate:"bare"  },
    { n:"Chalk",   mul:0.88, sat:18, lit:78, plate:"chalk" },
    { n:"Ashen",   mul:0.95, sat:40, lit:66, plate:"worn"  },
    { n:"Rust",    mul:1.03, sat:64, lit:58, plate:"scale" },
    { n:"Cobalt",  mul:1.10, sat:58, lit:62, plate:"plain" },
    { n:"Bronze",  mul:1.19, sat:52, lit:56, plate:"cast"  },
    { n:"Ember",   mul:1.28, sat:72, lit:60, plate:"hot"   },
    { n:"Frost",   mul:1.46, sat:52, lit:74, plate:"rime"  },
    { n:"Gilded",  mul:1.66, sat:80, lit:64, plate:"leaf"  },
    { n:"Cinnabar",mul:1.78, sat:90, lit:54, plate:"vitreous" },
    { n:"Umbral",  mul:1.90, sat:44, lit:52, plate:"void"  },
    { n:"Nacre",   mul:2.03, sat:70, lit:72, plate:"nacre" },
    { n:"Vermeil", mul:2.16, sat:88, lit:58, plate:"gilt"  },
    { n:"Verdigris",mul:2.34,sat:46, lit:56, plate:"patina"},
    { n:"Onyx",    mul:2.56, sat:34, lit:46, plate:"dense" },
    { n:"Aureate", mul:2.90, sat:96, lit:62, plate:"regal" },
  ];

  // how far apart the strains unlock: sixteen strains at this step puts the last
  // of them on the field at level 91, which still leaves the run its Aureate ending.
  // this constant has to come down as strains are added or the grid outruns the campaign
  const STRAIN_STEP = 5;
  const strainFrom  = t => Math.max(1, t*STRAIN_STEP + 1);

  const BESTIARY = [];
  for(let t=0;t<STRAIN.length;t++){
    for(let a=0;a<ARCH.length;a++){
      const s = STRAIN[t], k = ARCH[a];
      BESTIARY.push({
        idx: t*ARCH.length+a,
        name: s.n + " " + k.name,
        arch: k, tier: t,
        hp: Math.max(1, Math.round(k.hp * s.mul)),
        r:  k.r * (1 + t*0.012),
        speed: k.speed * (0.86 + t*0.038),
        fire:  k.fire  * (1 - t*0.028),
        color: hsl(k.hue + t*3, s.sat, s.lit),
        plate: s.plate,
        unlock: Math.max(1, t*STRAIN_STEP + a + 1),
      });
    }
  }
  const unlockedAt = lv => BESTIARY.filter(m => m.unlock <= lv);

  /* ── marks: a second axis laid over the archetype/strain grid ──
     A marked monster is the same archetype in the same strain, carrying one
     extra rule. They stay out of the first ten levels, never stack, and each
     one is a question about a habit you have already formed. This is the axis
     that grows freely: the grid is a shape, the mark list is only a list. */
  const MARKS = [
    { id:"warded",   name:"Warded",   hue:190, from:12, weight:3 },
    { id:"hasted",   name:"Hasted",   hue:40,  from:15, weight:3 },
    { id:"volatile", name:"Volatile", hue:12,  from:20, weight:2 },
    { id:"tempered", name:"Tempered", hue:224, from:24, weight:2 },
    { id:"anchored", name:"Anchored", hue:150, from:28, weight:2 },
    { id:"errant",   name:"Errant",   hue:330, from:32, weight:2 },
    { id:"echoing",  name:"Echoing",  hue:284, from:36, weight:2 },
    { id:"crowned",  name:"Crowned",  hue:96,  from:44, weight:1 },
    { id:"shrouded", name:"Shrouded", hue:250, from:18, weight:3 },

  /* ── audio ── */
  let AC=null, master=null, muted=false;
  function audioBoot(){
    if(AC||muted) return;
    try{ AC = new (window.AudioContext||window.webkitAudioContext)();
         master = AC.createGain(); master.gain.value=.15; master.connect(AC.destination); }
    catch(e){ AC=null; }
  }
  function blip(f,d,type,v,slide){
    if(!AC||muted) return;
    d = d||.09; type = type||"square"; v = v||1;
    const t=AC.currentTime, o=AC.createOscillator(), g=AC.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,f*slide), t+d);
    g.gain.setValueAtTime(.0001,t);
    g.gain.exponentialRampToValueAtTime(v,t+.006);
    g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g); g.connect(master); o.start(t); o.stop(t+d+.02);
  }
  function noise(d,v){
    if(!AC||muted) return;
    d = d||.22; v = v||.7;
    const n=Math.floor(AC.sampleRate*d), b=AC.createBuffer(1,n,AC.sampleRate), a=b.getChannelData(0);
    for(let i=0;i<n;i++) a[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);
    const s=AC.createBufferSource(); s.buffer=b;
    const f=AC.createBiquadFilter(); f.type="lowpass"; f.frequency.value=900;
    const g=AC.createGain(); g.gain.value=v;
    s.connect(f); f.connect(g); g.connect(master); s.start();
  }

  function paintStrip(plan){
    const seen = new Map();
    for(const m of plan.roster) if(!seen.has(m.name)) seen.set(m.name, m);
