          shutT: rnd(3.2, 1.4), shut:0, seedT: rnd(4.2, 2.4), knitT: 2.5, lastHit:-99,
        };
        made.push(born); G.enemies.push(born);
      }
    }
    if(arcs.length === 2){                     // each body knows its opposite number
      const half = made.length/2;
      for(let i=0;i<half;i++){ made[i].twin = made[i+half].uid; made[i+half].twin = made[i].uid; }
    }
    if(mk){
      blip(150,.16,"sawtooth",.5,1.6);
      // call it out once a level, not once a monster; the boss gets named by its own banner
      if(!G.markShown && !m.boss){
        G.markShown = true;
        G.bannerText = mk.name.toUpperCase(); G.bannerSub = m.name.toUpperCase(); G.banner = 1.5;
      }
    }
  }

  /* ── fx ── */
  function burstParts(x,y,color,n,spd,life){
    spd = spd||170; life = life||.6;
    if(reduce) n=Math.ceil(n/3);
    for(let i=0;i<n;i++){
      const a=rnd(TAU), s=rnd(spd,spd*.25);
      G.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rnd(life,life*.4),max:life,color,size:rnd(2.6,1)});
    }
  }
  function ringFx(x,y,color,r0,r1,dur,w){ G.rings.push({x,y,color,r0,r1,t:0,dur:dur||.45,w:w||2.5}); }

  function addCombo(){
    G.combo = Math.min(9 + lvlOf("tally"), G.combo+1); G.comboT = comboMax();   // Tally raises the cap
    el.combo.innerHTML = "&times;" + G.combo;
    comboBox.classList.add("pop"); setTimeout(()=>comboBox.classList.remove("pop"),130);
  }
  // Paragon: the chain has a floor, so a mistake costs you the top of it, not all of it
  function breakCombo(){
    G.combo = lvlOf("paragon") ? 3 : 1;
    G.comboT = lvlOf("paragon") ? comboMax() : 0;
    el.combo.innerHTML = "&times;" + G.combo;
  }
  function addScore(n){ G.score += Math.round(n*G.combo*scoreMul()); el.score.textContent = nf(G.score); }

  function damageCore(){
    if(G.iframe>0) return;
    if(G.brace > 0){                    // Brace: the level's opening hits glance off the plate
      G.brace--; G.iframe = iframeMax()*0.7;
      ringFx(cx,cy,C.jade,coreR(),S*.34,.5,3); burstParts(cx,cy,C.jade,16,200,.6);
      shake=Math.min(18,shake+10); flash=.28; flashColor=C.jade;
      blip(330,.16,"triangle",.7,1.5);
      G.bannerText="BRACED"; G.bannerSub=""; G.banner=1.1;
      return;
    }
    if(lvlOf("bastion") && G.pulseCd <= 0){   // Bastion: spend the charge, keep the hull
      G.pulseCd = pulseMax(); G.iframe = iframeMax();
      ringFx(cx,cy,C.ice,coreR(),S*.44,.55,4); burstParts(cx,cy,C.ice,22,230,.7);
      shake=Math.min(20,shake+12); flash=.3; flashColor=C.ice;
      noise(.2,.5); blip(262,.24,"triangle",.75,1.7);
      G.bannerText="BASTION"; G.bannerSub=""; G.banner=1.2;
      drawPulseMeter();
      return;
    }
    G.hp--; G.iframe=iframeMax(); breakCombo();
    // Quicksilver: the whole field drops to a crawl while you get your arc back
    if(lvlOf("quicksilver")) G.slowT = Math.max(G.slowT, 2);
    shake=Math.min(26,shake+18); flash=.5; flashColor=C.rose;
    ringFx(cx,cy,C.rose,CORE_R,S*.5,.55,3); burstParts(cx,cy,C.rose,26,240,.8);
    noise(.3,.9); blip(90,.3,"sawtooth",.9,.3);
    if(lvlOf("riposte")){                 // Riposte: the core vents what it just took
      for(let n=0;n<16;n++){
        const a = n/16*TAU + aim;
        G.shots.push({ x:cx+Math.cos(a)*(RING_R+10), y:cy+Math.sin(a)*(RING_R+10),
                       vx:Math.cos(a)*500, vy:Math.sin(a)*500,
                       r:4.6, friendly:true, heavy:false, trail:[], life:3.4, pierce:lvlOf("pierce") });
      }
      ringFx(cx,cy,C.brassHi,coreR(),S*.5,.5,3);
      blip(180,.26,"sawtooth",.6,2.6);
    }
    drawHull();
    if(G.hp<=0){
      if(lvlOf("failsafe") && !G.saved){  // Failsafe: one breach, forgiven, and the field goes with it
        G.saved = 1; G.hp = 1; G.iframe = Math.max(G.iframe, 2.4);
        for(let i=G.enemies.length-1;i>=0;i--){
          const e = G.enemies[i];
          burstParts(e.x,e.y,e.m.color,14,220,.6);
          G.enemies.splice(i,1); G.kills++;
        }
        G.shots.length = 0;
        ringFx(cx,cy,C.ice,coreR(),S*.9,.8,5); burstParts(cx,cy,C.ice,40,320,1.0);
        shake=Math.min(28,shake+22); flash=.6; flashColor=C.ice;
        noise(.6,.9); blip(147,.5,"triangle",.85,4);
        G.bannerText="FAILSAFE"; G.bannerSub="CORE HELD"; G.banner=2.2;
        drawHull();
        return;
      }
      gameOver();
    }
  }

  // full repair every third level, whether or not you took a scratch
  function healFull(){
    const missing = G.maxHp - G.hp;
    G.hp = G.maxHp;
    drawHull();
    G.bannerText = missing ? "HULL RESTORED" : "HULL NOMINAL";
    G.bannerSub = ""; G.banner = 2.0;
    // the level banner overwrites this one, so hand the news to the refit card too
    G.healNote = missing ? ("Hull fully repaired &mdash; " + missing + " restored")
                         : "Hull already at full strength";
    ringFx(cx,cy,C.jade,coreR(),S*0.42,.6,3);
    burstParts(cx,cy,C.jade,missing?24:10,180,.7);
    flash=.2; flashColor=C.jade;
    blip(392,.14,"triangle",.6,1.5); blip(587,.2,"triangle",.5,1.4);
  }

  function killEnemy(e,i){
    burstParts(e.x,e.y,e.m.color, e.boss?46:16, e.boss?300:210, e.boss?1:.65);
    ringFx(e.x,e.y,e.m.color,e.r,e.r*(e.boss?7:4.2),e.boss?.7:.38,e.boss?4:2);
    G.enemies.splice(i,1); G.kills++;
    const laden = !!e.mark && e.mark.id === "laden";
    addCombo();
    addScore((e.boss ? 1400 : 100 + e.m.tier*24) * (e.mark ? (laden ? 4.5 : 2.2) : 1));
    shake=Math.min(24,shake+(e.boss?16:4));
    hitstop=Math.max(hitstop, e.boss?.14:.045);
    blip(e.boss?170:340+G.combo*46, e.boss?.4:.1, "square", .75, e.boss?2.4:1.6);
    if(e.boss) noise(.5,.8);
    // Laden is carrying salvage rather than a weapon, and Harvest rig makes any
    // marked body pay out; everything else is still a roll
    const sure  = laden || (e.mark && lvlOf("harvest")) || e.boss;
    const odds  = dropOdds() * (e.mark?2.4:1) * (lvlOf("wellspring") ? 2 : 1);
    const drops = laden ? 2 : (sure || Math.random() < odds) ? 1 : 0;
    for(let d=0; d<drops; d++){
      // Wellspring puts the hull first whenever the hull needs it
      const mendOdds = lvlOf("wellspring") ? 1 : 0.45;
      const kind = (G.hp<G.maxHp && Math.random()<mendOdds) ? "mend" : pick(["wide","slow","surge"]);
      G.pickups.push({ kind, a:Math.atan2(e.y-cy,e.x-cx) + d*0.5,
                       r:Math.hypot(e.x-cx,e.y-cy), life:14, spin:rnd(TAU) });
    }

    if(lvlOf("nerve") && G.kills % 10 === 0)  // Nerve: a streak buys you a moment of cover
      G.iframe = Math.max(G.iframe, 1.0*lvlOf("nerve"));
    if(lvlOf("conduit") && G.pulseCd > 0){   // Conduit: a kill is a second off the charge
      G.pulseCd = Math.max(0, G.pulseCd - 1);
      drawPulseMeter();
    }
    if(lvlOf("cascade") && G.combo >= 5){     // Cascade: a hot chain detonates what it kills
      const a0 = rnd(TAU);
      for(let q=0;q<8;q++){
        const a = a0 + q/8*TAU;
        G.shots.push({ x:e.x, y:e.y, vx:Math.cos(a)*460, vy:Math.sin(a)*460,
                       r:4.6, friendly:true, heavy:false, trail:[], life:3.2, pierce:lvlOf("pierce") });
      }
      ringFx(e.x,e.y,C.brassHi,e.r,e.r*5.5,.42,3);
      blip(520,.14,"square",.5,2.2);
    }

    if(lvlOf("nova")){                    // Backdraft: a kill scatters your own charge outward
      const n = 2*lvlOf("nova"), a0 = rnd(TAU);
      for(let q=0;q<n;q++){
        const a = a0 + q/n*TAU;
        G.shots.push({ x:e.x, y:e.y, vx:Math.cos(a)*430, vy:Math.sin(a)*430,
                       r:4.2, friendly:true, heavy:false, trail:[], life:2.6, pierce:lvlOf("pierce") });
      }
      ringFx(e.x,e.y,C.brassHi,e.r,e.r*3.2,.3,2);
    }

    if(e.mark && e.mark.id === "volatile"){
      // dies loudly — but every splinter is a bolt, and bolts are yours to catch
      const a0 = rnd(TAU);
      for(let n=0;n<8;n++) fire(e, a0 + n/8*TAU);
      ringFx(e.x,e.y,hsl(12,88,62),e.r,e.r*5,.42,3);
      noise(.22,.55);
    }
    if(e.mark && e.mark.id === "vengeful"){
      // one last round, straight at the core and twice the usual speed. it is
      // still a bolt, so the arc still owns it — if the arc is where it is going
      const a0 = Math.atan2(cy-e.y, cx-e.x);
      fire(e, a0);
      const p = G.shots[G.shots.length-1];
      if(p){ p.vx *= 1.9; p.vy *= 1.9; p.kindle = false; }
      ringFx(e.x,e.y,hsl(0,88,62),e.r,e.r*4.5,.36,3);
      blip(120,.22,"sawtooth",.6,.35);
    }
    if(e.mark && e.mark.id === "echoing" && !e.echo){
      // two lesser copies, unmarked, so an Echoing kill never cascades
      const half = Math.max(1, Math.ceil(e.m.hp/2));
      for(let n=0;n<2;n++){
        const a = rnd(TAU);
        G.enemies.push({
          m:e.m, mark:null, uid:++UID, echo:true,
          x:e.x+Math.cos(a)*e.r*1.7, y:e.y+Math.sin(a)*e.r*1.7,
          hp:half, maxHp:half, r:e.m.r*0.78,
          speed:e.m.speed*1.18, fireMul:1.1, wardA:0,
          cd:rnd(1.8,.9), orbit:Math.random()<.5?1:-1, stun:0, born:1.3,
          phase:rnd(TAU), boss:false,
        });
      }
      ringFx(e.x,e.y,hsl(284,82,66),e.r,e.r*4,.4,2);
      blip(300,.16,"sawtooth",.45,.6);
    }
  }

  function fire(e, ang, heavy){
    // Freighted throws heavy rounds whatever the body underneath it was drawn to fire
    heavy = heavy || !!(e.mark && e.mark.id === "freighted");
    const spd = (heavy?0.68:1) * boltSpeed(G.level)
              * (1 - 0.08*lvlOf("slow")) * (1 - 0.12*lvlOf("dilate"));
    // a Kindled round leaves slow and is still gathering speed when it arrives
    const kindle = !!(e.mark && e.mark.id === "kindled"), k0 = kindle ? 0.6 : 1;
    G.shots.push({ x:e.x, y:e.y, vx:Math.cos(ang)*spd*k0, vy:Math.sin(ang)*spd*k0,
                   r:heavy?7.5:4.4, friendly:false, heavy:!!heavy, trail:[], life:10, color:e.m.color,
                   kindle, spdMax: spd*1.85,
                   cleave: !!(e.mark && e.mark.id === "cleaving") });
    blip(heavy?150:520,.05,"sine",.28,.6);
  }

  function reflect(p){
    const nx=p.x-cx, ny=p.y-cy, l=Math.hypot(nx,ny)||1, ux=nx/l, uy=ny/l;
    const dot = p.vx*ux + p.vy*uy;
    p.vx -= 2*dot*ux; p.vy -= 2*dot*uy;
    const carry = clamp(aimVel,-9,9)*26*(1 + 0.30*lvlOf("curve"));   // Gyro bearing: more bend
    p.vx += -uy*carry; p.vy += ux*carry;
    const keen = 1 + 0.12*lvlOf("carve");                 // Keen edge: hotter returns
    const sp = Math.hypot(p.vx,p.vy), want = Math.max(430, sp*1.35) * keen;
    p.vx = p.vx/sp*want; p.vy = p.vy/sp*want;
    p.friendly=true; p.life=4.5 + 0.8*lvlOf("carve"); p.trail.length=0;
    p.pierce = lvlOf("pierce"); p.hit = null;
    p.x = cx+ux*(RING_R+13); p.y = cy+uy*(RING_R+13);
    const forks = lvlOf("split") + 2*lvlOf("prism");
    for(let i=0;i<forks;i++){                   // Fork / Prism: extra bolts off the same deflect
      const sp2 = Math.hypot(p.vx,p.vy), ang = Math.atan2(p.vy,p.vx) + (i%2 ? -0.2 : 0.2)*(1+(i>>1)*0.9);
      G.shots.push({ x:p.x, y:p.y, vx:Math.cos(ang)*sp2, vy:Math.sin(ang)*sp2,
                     r:p.r, friendly:true, heavy:false, trail:[], life:4.5, pierce:lvlOf("pierce") });
    }
    if(lvlOf("crucible") && (G.deflects+1) % 20 === 0){   // Crucible: one round in twenty comes back heavy
      const sp4 = Math.hypot(p.vx,p.vy);
      G.shots.push({ x:p.x, y:p.y, vx:p.vx/sp4*sp4*0.92, vy:p.vy/sp4*sp4*0.92,
                     r:9, friendly:true, heavy:false, trail:[], life:5, pierce:5 });
      ringFx(p.x,p.y,C.brassHi,6,44,.4,3);
      blip(140,.2,"square",.6,2.2);
    }
    if(lvlOf("chorus")){                        // Chorus: the far side of the ring answers
      const oa = Math.atan2(p.y-cy, p.x-cx) + Math.PI, sp3 = Math.hypot(p.vx,p.vy);
      G.shots.push({ x:cx+Math.cos(oa)*(RING_R+13), y:cy+Math.sin(oa)*(RING_R+13),
                     vx:Math.cos(oa)*sp3, vy:Math.sin(oa)*sp3,
                     r:p.r, friendly:true, heavy:false, trail:[], life:p.life, pierce:lvlOf("pierce") });
    }
    G.deflects++; addScore(15);
    if(lvlOf("flywheel") && G.pulseCd > 0){                          // Flywheel: catching charges the pulse
      G.pulseCd = Math.max(0, G.pulseCd - 0.2*lvlOf("flywheel"));
      drawPulseMeter();
    }
    if(lvlOf("recycler") && G.deflects % 12 === 0){                   // Recycler: the ring pays for itself
      const kind = (G.hp<G.maxHp && Math.random()<.45) ? "mend" : pick(["wide","slow","surge"]);
      G.pickups.push({ kind, a:rnd(TAU), r:RING_R*1.9, life:14, spin:rnd(TAU) });
      blip(700,.07,"sine",.35,1.5);
    }
    if(lvlOf("siphon") && G.deflects % 10 === 0 && G.hp < G.maxHp){   // Siphon
      G.hp++; drawHull();
      ringFx(cx,cy,C.jade,coreR(),S*0.24,.5,3);
      blip(587,.16,"triangle",.6,1.4);
    }
    ringFx(p.x,p.y,C.brassHi,4,34,.3,2); burstParts(p.x,p.y,C.brassHi,5,140,.34);
    blip(660+G.combo*40,.05,"square",.5,1.5);
  }

  // Twin ring adds a mirrored arc on the far side of the orbit; Halo adds the
  // two quarter-turn facings, so holding both is a closed shell with four seams
  function shieldCovers(a){
    // Poise: a banked charge holds the arc a little wider — spend it and it narrows.
    // Sapping pulls the other way, and cannot close the arc entirely
    const hw = Math.max(0.12, G.hw + (G.pulseCd <= 0 ? 0.05*lvlOf("poise") : 0)
                             - (G.sap ? 0.08 : 0));
    if(Math.abs(angDiff(a,aim)) < hw) return true;
    if(lvlOf("twin") > 0 && Math.abs(angDiff(a, aim+Math.PI)) < hw) return true;
    if(lvlOf("halo") > 0 && (Math.abs(angDiff(a, aim+Math.PI/2)) < hw ||
                             Math.abs(angDiff(a, aim-Math.PI/2)) < hw)) return true;
    return false;
  }

  // `force` is the Echo pulse firing itself: no cooldown, no second echo
  function doPulse(force, radMul){
    if(!force && G.pulseCd>0) return;
    let mul = radMul || 1;
    if(!force){
      G.pulseCd = pulseMax();
      G.whet = 1;                                 // Whetstone: the next return runs hot
      if(lvlOf("bellows") && G.hp < G.maxHp){     // Bellows: the wave repairs as it goes
        G.hp++; drawHull();
        ringFx(cx,cy,C.jade,coreR(),S*0.3,.5,3);
      }
      if(G.surge){ mul *= 1 + 0.6*G.surge; G.surge = 0; }   // Pulse surge: one much wider wave
      if(lvlOf("echo")){ G.echoT = 0.5; G.echoMul = mul; }
    }
    const rad = pulseRad() * mul;
    if(lvlOf("singularity")){          // Singularity: pull the field in, then fire
      for(const e of G.enemies){
        if(e.boss) continue;
        e.x = cx + (e.x-cx)*0.75; e.y = cy + (e.y-cy)*0.75;
      }
      ringFx(cx,cy,C.ice,rad*1.15,coreR(),.4,3);
    }
    if(lvlOf("aftershock")) G.slowT = Math.max(G.slowT, 2*lvlOf("aftershock"));
    ringFx(cx,cy,C.brassHi,coreR(),rad*1.22,.5,4);
    shake=Math.min(22,shake+9); noise(.18,.5); blip(force?196:220,.34,"triangle",.8,3.2);
    for(const p of G.shots) if(!p.friendly && Math.hypot(p.x-cx,p.y-cy) < rad*0.78) reflect(p);
    if(lvlOf("overload")){                        // Overload pulse: a full ring of return fire
      for(let n=0;n<12;n++){
        const a = n/12*TAU + aim;
        G.shots.push({ x:cx+Math.cos(a)*(RING_R+10), y:cy+Math.sin(a)*(RING_R+10),
                       vx:Math.cos(a)*470, vy:Math.sin(a)*470,
                       r:4.6, friendly:true, heavy:false, trail:[], life:4, pierce:lvlOf("pierce") });
      }
    }
    // the pulse is lethal: everything caught in the wave dies outright,
    // bosses and Anchored take a heavy hit instead of vanishing
    for(let i=G.enemies.length-1;i>=0;i--){
      const e = G.enemies[i];
      if(Math.hypot(e.x-cx,e.y-cy) >= rad) continue;
      if(e.boss || (e.mark && e.mark.id === "anchored")){
        e.hp -= e.boss ? 6 : 3;
        burstParts(e.x,e.y,e.m.color,18,220,.6);
        if(e.hp<=0) killEnemy(e,i);
      } else {
        killEnemy(e,i);
      }
    }
  }

  // a body on the arc: rammers, and anything Creeping that has come far enough in.
  // returns true if the monster is gone and the caller should stop working on it
  function bodyCollide(e, i, dist){
    const a = Math.atan2(e.y-cy, e.x-cx);
    if(dist < RING_R+e.r && dist > RING_R-e.r-6 && shieldCovers(a)){
      burstParts(e.x,e.y,e.m.color,14,190,.55);
      ringFx(e.x,e.y,C.brassHi,e.r,e.r*3.6,.3,2);
      G.enemies.splice(i,1); G.kills++; addCombo(); addScore(80+e.m.tier*20);
      hitstop=Math.max(hitstop,.04); blip(300,.09,"square",.6,1.7);
      return true;
    }
    if(dist < coreR()+e.r){
      G.enemies.splice(i,1); burstParts(e.x,e.y,e.m.color,20,220,.7); damageCore();
      return true;
    }
    return false;
  }

  /* ── update ── */
  function update(dt){
    G.elapsed += dt;
    G.iframe  = Math.max(0,G.iframe-dt);
    // Smothering sits on the charge and Wailing sits on the chain, so both have
    // to be known before the meters move rather than after
    G.smother = false; G.wail = false; G.sap = false; G.quench = false;
    for(const e of G.enemies){
      if(!e.mark) continue;
      if(e.mark.id === "smothering") G.smother = true;
      if(e.mark.id === "wailing")    G.wail    = true;
      if(e.mark.id === "sapping")    G.sap     = true;   // narrows the arc
      if(e.mark.id === "quenching")  G.quench  = true;   // blunts every return
    }
    G.pulseCd = Math.max(0,G.pulseCd-dt*(G.smother ? 0.5 : 1));
    G.banner  = Math.max(0,G.banner-dt);
    if(G.wideT>0){ G.wideT-=dt; if(G.wideT<=0) G.hw=baseHW(); }
    if(G.slowT>0) G.slowT-=dt;
    if(G.comboT>0){ G.comboT -= dt*(G.wail?2:1); if(G.comboT<=0) breakCombo(); }
    if(G.echoT>0){ G.echoT-=dt; if(G.echoT<=0) doPulse(true, G.echoMul); }
    G.mantleT = Math.max(0, (G.mantleT||0) - dt);
    if(lvlOf("sentinel")){                // Sentinel: the ring catches one for you, unasked
      G.sentT = (G.sentT||0) - dt;
      if(G.sentT <= 0){
        let best = null, bd = 1e9;
        for(const p of G.shots){
          if(p.friendly) continue;
          const d = Math.hypot(p.x-cx, p.y-cy);
          if(d < RING_R*2.4 && d < bd){ bd = d; best = p; }
        }
        if(best){ G.sentT = 8; reflect(best); ringFx(cx,cy,C.ice,RING_R*0.8,RING_R*1.3,.4,2); }
      }
    }
    if(lvlOf("vent")){                    // Vent: the ring pays out on its own timer
      G.ventT = (G.ventT||0) - dt;
      if(G.ventT <= 0){
        G.ventT = 3;
        G.shots.push({ x:cx+Math.cos(aim)*(RING_R+10), y:cy+Math.sin(aim)*(RING_R+10),
                       vx:Math.cos(aim)*470, vy:Math.sin(aim)*470,
                       r:4.6, friendly:true, heavy:false, trail:[], life:3.2, pierce:lvlOf("pierce") });
        blip(600,.06,"square",.32,1.4);
      }
    }

    if(G.queue.length){
      G.spawnT -= dt;
      if(G.spawnT<=0 && G.enemies.length < maxAlive(G.level)){
        spawnMonster(G.queue.shift());
        G.spawnT = Math.max(0.3, 1.5 - G.level*0.012);
      }
    } else if(!G.enemies.length){
      G.gapT -= dt;
      if(G.gapT<=0){
        G.gapT = 2.4;
        const cleared = G.level;
        if(cleared > 0 && cleared % 3 === 0) healFull();
        if(cleared > 0 && cleared < LEVELS && (cleared % 3 === 0 || cleared % 10 === 0)) showRefit();
        else nextLevel();
      }
    }

    // Crowned drives the rest of the field; one pass to find out whether one is alive
    G.crown = false;
    for(const e of G.enemies) if(e.mark && e.mark.id === "crowned"){ G.crown = true; break; }

    for(let i=G.enemies.length-1;i>=0;i--){
      const e = G.enemies[i], k = e.m.arch;
      e.born += dt;
      if(e.mark && e.mark.id === "warded") e.wardA += dt * 1.15 * e.orbit;   // the plate keeps turning
      if(e.mark && e.mark.id === "errant"){
        // mirroring through the core preserves its range, so it can never blink onto the core
        e.jumpT -= dt;
        if(e.jumpT <= 0){
          e.jumpT = rnd(4.2, 2.2);
          const ec = hsl(330,84,66);
          burstParts(e.x,e.y,ec,10,190,.42); ringFx(e.x,e.y,ec,e.r,e.r*3,.32,2);
          e.x = 2*cx - e.x; e.y = 2*cy - e.y;
          ringFx(e.x,e.y,ec,e.r*3,e.r,.32,2);
          e.cd = Math.max(e.cd, 0.55);        // it needs a beat to re-sight after the jump
          blip(430,.07,"sine",.35,1.7);
        }
      }
      // Shuttered: a shell that closes for a beat at a time, on its own rhythm
      if(e.mark && e.mark.id === "shuttered"){
        e.shutT -= dt;
        if(e.shutT <= 0){
          e.shut = e.shut ? 0 : 1;
          e.shutT = e.shut ? 1.0 : rnd(3.4, 1.8);
          if(e.shut) blip(240,.06,"square",.3);
        }
      }
      if(e.mark) switch(e.mark.id){
        case "waking":
          // inert for its first eight seconds, and considerably worse afterwards
          if(e.born < 8) continue;
          if(!e.woke){
            e.woke = 1; e.speed *= 1.5; e.fireMul *= 0.5;
            ringFx(e.x,e.y,hsl(54,84,66),e.r*2.4,e.r,.4,3); blip(180,.14,"sawtooth",.5,2.2);
          }
          break;
        case "seeding":
          // hands the field a fresh body every few seconds until you deal with it
          e.seedT -= dt;
          if(e.seedT <= 0){
            e.seedT = 4.2;
            if(G.enemies.length < maxAlive(G.level) + 4){
              const sw = BESTIARY.find(m => m.arch.id === "swarm" && m.tier === e.m.tier) || e.m;
              const a2 = rnd(TAU);
              G.enemies.push({
                m:sw, mark:null, uid:++UID, echo:true,
                x:e.x+Math.cos(a2)*e.r*1.6, y:e.y+Math.sin(a2)*e.r*1.6,
                hp:1, maxHp:1, r:sw.r*0.82, speed:sw.speed, fireMul:1, wardA:0,
                cd:rnd(2.2,1.1), orbit:Math.random()<.5?1:-1, stun:0, born:1.0,
                phase:rnd(TAU), boss:false, burst:0, spin:0, roll:0,
                shutT:9, shut:0, burn:0, seedT:9, knitT:9,
              });
              ringFx(e.x,e.y,hsl(110,84,66),e.r,e.r*2.6,.34,2);
              blip(360,.08,"sine",.35,1.4);
            }
          }
          break;
        case "knitting":
          // repairs itself unless you have hurt it recently: a rate check, not a wall
          e.knitT -= dt;
          if(e.knitT <= 0){
            e.knitT = 2.5;
            if(e.hp < e.maxHp && G.elapsed - (e.lastHit || -99) > 1.5){
              e.hp++;
              ringFx(e.x,e.y,hsl(158,84,66),e.r*0.6,e.r*1.6,.3,2);
              blip(500,.08,"sine",.3,1.3);
            }
          }
          break;
        case "glutting":
          // goes for the salvage rather than for you, and is fed by every piece
          for(let q=G.pickups.length-1;q>=0;q--){
            const u  = G.pickups[q];
            const ux = cx+Math.cos(u.a)*u.r, uy = cy+Math.sin(u.a)*u.r;
            const d  = Math.hypot(ux-e.x, uy-e.y) || 1;
            if(d < e.r + 14){
              G.pickups.splice(q,1);
              e.hp = Math.min(e.maxHp, e.hp + 1);
              burstParts(e.x,e.y,hsl(36,84,66),12,170,.5);
              blip(140,.14,"sawtooth",.45,.6);
            } else if(d < S*0.55){
              e.x += (ux-e.x)/d * 46*dt; e.y += (uy-e.y)/d * 46*dt;
            }
          }
          break;
      }

      // Sear: a return that landed leaves the plate cooking for a couple of seconds
      if(e.burn > 0){
        e.burn -= dt;
        e.burnT = (e.burnT || 0) + dt;
        if(e.burnT >= 0.5){
          e.burnT = 0; e.hp -= 0.5*lvlOf("sear");
          burstParts(e.x,e.y,"#FF9A4C",3,90,.3);
          if(e.hp <= 0){ killEnemy(e,i); continue; }
        }
      }
      if(e.stun>0){ e.stun-=dt; continue; }

      const crown = G.crown && !(e.mark && e.mark.id === "crowned");   // never buffs itself
      const dx=cx-e.x, dy=cy-e.y, dist=Math.hypot(dx,dy)||1;
      const toCore=Math.atan2(dy,dx);
      // Dilation field slows every hostile; a live Crown drives them all harder;
      // Snare field only bites on the ones that have come inside your orbit
      const esp = e.speed * (1 - 0.12*lvlOf("dilate")) * (crown ? 1.3 : 1)
                * (dist < RING_R*1.25 ? (1 - 0.14*lvlOf("snare")) : 1);

      if(k.pat === "ram"){
        e.x += Math.cos(toCore)*esp*dt;
        e.y += Math.sin(toCore)*esp*dt;
        // a Thresher does not stop shooting on the way in, which is the whole
        // difference between it and every other body that just wants to arrive
        if(k.ramfire && e.born > 1.2){
          e.cd -= dt;
          if(e.cd <= 0){
            e.cd = Math.max(0.55, e.m.fire*fireScale(G.level)) * rnd(1.2,.85)
                 * (e.fireMul||1) * (crown ? 0.72 : 1) * (1 + 0.08*lvlOf("jam"));
            fire(e, Math.atan2(cy-e.y, cx-e.x));
          }
        }
        if(bodyCollide(e,i,dist)) continue;
      } else {
        // each archetype holds its own range and drifts in and out by its own amount
        let want = STAND_R*(k.stand||1) + Math.sin(G.elapsed*0.8+e.phase)*S*0.03*(k.bob||1);
        // Creeping does not hold station: the standoff it is aiming for closes
        // steadily until the ring is the only thing left between it and the core
        if(e.mark && e.mark.id === "creeping")
          want = Math.max(coreR()*0.6, want - e.born*S*0.032);
        // a diver has no standoff to speak of: it swings all the way in to just
        // outside the ring track and then pulls back out again
        if(k.dive) want *= 0.56 + 0.44*(0.5 + 0.5*Math.sin(G.elapsed*0.85 + e.phase));
        const radial = dist - want, ux=dx/dist, uy=dy/dist;
        e.x += ux*clamp(radial,-esp,esp)*dt;
        e.y += uy*clamp(radial,-esp,esp)*dt;
        const orbSpd = (k.orb||0.2)*e.orbit;
        const a = Math.atan2(e.y-cy,e.x-cx) + orbSpd*dt, r2 = Math.hypot(e.x-cx,e.y-cy);
        e.x = cx+Math.cos(a)*r2; e.y = cy+Math.sin(a)*r2;

        // once a Creeping body has come this far in it is a rammer, and the arc
        // stops it exactly the way the arc stops a Crawler
        if(e.mark && e.mark.id === "creeping" && bodyCollide(e,i,r2)) continue;

        if(e.born > 2.0){          // long grace period before a monster's first shot
          e.cd -= dt;
          if(e.cd<=0){
            e.cd = Math.max(0.7, e.m.fire*fireScale(G.level)) * rnd(1.2,.85) * (e.fireMul||1)
                 * (crown ? 0.72 : 1) * (1 + 0.08*lvlOf("jam"));   // Jammer slows the cadence
            const a0 = Math.atan2(cy-e.y, cx-e.x);
            if(k.pat==="aimed")   fire(e,a0);
            if(k.pat==="twin")  { fire(e,a0-0.09); fire(e,a0+0.09); }
            if(k.pat==="spread3") for(const o of [-.24,0,.24]) fire(e,a0+o);
            if(k.pat==="fan5")    for(const o of [-.44,-.22,0,.22,.44]) fire(e,a0+o);
            if(k.pat==="ring8")   for(let n=0;n<8;n++) fire(e, a0 + n/8*TAU);
            if(k.pat==="heavy")   fire(e,a0,true);
            if(k.pat==="heavy2"){ fire(e,a0-0.16,true); fire(e,a0+0.16,true); }
            if(k.pat==="heavy3") for(const o of [-.34,0,.34]) fire(e,a0+o,true);
            // six rounds walked across the core line, one at a time — the fan
            // arrives as a sequence rather than all at once, so the arc has to travel
            if(k.pat==="roll6"){
              const n = (e.roll || 0);
              fire(e, a0 + (n - 2.5)*0.13);
              e.roll = n + 1;
              if(e.roll < 6) e.cd = 0.24*(e.fireMul||1); else e.roll = 0;
            }
            // three rounds down the same line, a sixth of a second apart: the burst
            // re-sights between each one, so a Harrier walks its fire onto you
            // five bolts thrown outward, and the whole wheel turns between volleys,
            // so the gap you found last time is not where the gap is now
            if(k.pat==="spiral"){
              e.spin = (e.spin||0) + 0.42;
              for(let n=0;n<5;n++) fire(e, e.spin + n/5*TAU);
            }
            if(k.pat==="burst3"){
              fire(e,a0);
              if(e.burst > 0){ e.burst--; if(e.burst > 0) e.cd = 0.17*(e.fireMul||1); }
              else { e.burst = 2; e.cd = 0.17*(e.fireMul||1); }
            }
          }
        }
      }
    }

    for(let i=G.shots.length-1;i>=0;i--){
      const p = G.shots[i];
      p.life -= dt;

      if(p.friendly && lvlOf("lodestone") && G.enemies.length){   // Lodestone: returns bend home
        let tgt=null, td=1e9;
        for(const e of G.enemies){ const d=Math.hypot(e.x-p.x,e.y-p.y); if(d<td){ td=d; tgt=e; } }
        if(tgt && td < S*0.8){
          const cur = Math.atan2(p.vy,p.vx);
          const na  = cur + clamp(angDiff(Math.atan2(tgt.y-p.y,tgt.x-p.x), cur), -2.8*dt, 2.8*dt);
          const sp0 = Math.hypot(p.vx,p.vy);
          p.vx = Math.cos(na)*sp0; p.vy = Math.sin(na)*sp0;
        }
      }

      // Averse plate turns your own returns away from it
      if(p.friendly){
        for(const e of G.enemies){
          if(!e.mark || e.mark.id !== "averse") continue;
          const d = Math.hypot(e.x-p.x, e.y-p.y);
          if(d > 150) continue;
          const cur  = Math.atan2(p.vy,p.vx);
          const away = Math.atan2(p.y-e.y, p.x-e.x);
          const na   = cur + clamp(angDiff(away, cur), -2.4*dt, 2.4*dt);
          const sp0  = Math.hypot(p.vx,p.vy);
          p.vx = Math.cos(na)*sp0; p.vy = Math.sin(na)*sp0;
        }
      }

      // Undertow: hostile fire inside the orbit is drawn toward wherever the arc is
      if(!p.friendly && lvlOf("undertow") && Math.hypot(p.x-cx,p.y-cy) < RING_R*2.2){
        const tx = cx+Math.cos(aim)*RING_R, ty = cy+Math.sin(aim)*RING_R;
        const cur = Math.atan2(p.vy,p.vx);
        const na  = cur + clamp(angDiff(Math.atan2(ty-p.y, tx-p.x), cur), -2.0*dt, 2.0*dt);
        const sp1 = Math.hypot(p.vx,p.vy);
        p.vx = Math.cos(na)*sp1; p.vy = Math.sin(na)*sp1;
      }

      // a Kindled round keeps gathering speed the whole way in
      if(p.kindle && !p.friendly){
        const sp0 = Math.hypot(p.vx,p.vy);
        if(sp0 < p.spdMax){
          const f = Math.min(p.spdMax/sp0, 1 + 0.9*dt);
          p.vx *= f; p.vy *= f;
        }
      }

      const spd = Math.hypot(p.vx,p.vy);
      // Pinion drags hostile fire down once it is inside your orbit
      const drag = (!p.friendly && Math.hypot(p.x-cx,p.y-cy) < RING_R*1.6)
                 ? (1 - 0.12*lvlOf("pinion")) : 1;
      const steps = Math.max(1, Math.ceil(spd*dt/7)), sdt = dt/steps*drag;
      let dead = false;

      for(let s=0;s<steps && !dead;s++){
        p.x += p.vx*sdt; p.y += p.vy*sdt;
        const dist = Math.hypot(p.x-cx,p.y-cy);

        if(!p.friendly){
          // Cleaving rounds come apart into two as they cross the orbit
          if(p.cleave && !p.cleft && dist < RING_R*1.75){
            p.cleft = 1;
            const a0 = Math.atan2(p.vy,p.vx), sp = Math.hypot(p.vx,p.vy);
            for(const o of [-0.17, 0.17]){
              G.shots.push({ x:p.x, y:p.y, vx:Math.cos(a0+o)*sp, vy:Math.sin(a0+o)*sp,
                             r:p.r*0.86, friendly:false, heavy:false, trail:[], life:p.life,
                             color:p.color, cleft:1, spdMax:p.spdMax });
            }
            ringFx(p.x,p.y,hsl(196,84,66),4,26,.26,2);
            dead = true; break;
          }
          if(dist < RING_R+7 && dist > RING_R-7 && shieldCovers(Math.atan2(p.y-cy,p.x-cx))){
            if(p.heavy){
              const base = Math.atan2(p.y-cy,p.x-cx);
              const n = 3 + 2*lvlOf("sunder");     // Sunder: the same round comes apart further
              for(let q=0;q<n;q++){
                const o = (q - (n-1)/2) * 0.4;
                G.shots.push({ x:cx+Math.cos(base)*(RING_R+12), y:cy+Math.sin(base)*(RING_R+12),
                               vx:Math.cos(base+o)*520, vy:Math.sin(base+o)*520,
                               r:4.6, friendly:true, heavy:false, trail:[], life:4.5, pierce:lvlOf("pierce") });
              }
              G.deflects++; addScore(40);
              ringFx(p.x,p.y,C.jade,6,52,.38,3); burstParts(p.x,p.y,C.jade,12,190,.5);
              blip(780,.09,"square",.6,1.8);
              dead = true; break;
            }
            reflect(p); continue;
          }
          if(dist < coreR()+p.r){
            if(lvlOf("mantle") && G.mantleT <= 0){   // Mantle: one bolt eaten, then it has to recharge
              G.mantleT = 6;
              ringFx(cx,cy,C.ice,coreR(),coreR()*2.8,.4,3);
              burstParts(p.x,p.y,C.ice,10,180,.5);
              blip(300,.1,"sine",.5,1.6);
            } else damageCore();
            dead=true; break;
          }
        } else {
          for(let j=G.enemies.length-1;j>=0;j--){
            const e = G.enemies[j];
            // Broadhead: a wider return catches what a narrow one used to clip past
            if(Math.hypot(p.x-e.x,p.y-e.y) >= e.r + p.r + 3*lvlOf("broadhead")) continue;
            if(p.hit && p.hit.indexOf(e.uid) >= 0) continue;   // already pierced this one

            // Warded carries a turning plate: come in on its lit facing and nothing happens
            if(e.mark && e.mark.id === "warded" && !lvlOf("awl") &&
               Math.abs(angDiff(Math.atan2(p.y-e.y, p.x-e.x), e.wardA)) < 0.95){
              const wc = hsl(190,84,66);
              burstParts(p.x,p.y,wc,7,170,.4); ringFx(p.x,p.y,wc,3,22,.26,2);
              blip(170,.06,"square",.35);
              dead = true; break;
            }

            // Shuttered: while the shell is closed, nothing lands at all
            if(e.mark && e.mark.id === "shuttered" && e.shut){
              const sc = hsl(186,84,66);
              burstParts(p.x,p.y,sc,7,170,.4); ringFx(p.x,p.y,sc,3,22,.26,2);
              blip(200,.06,"square",.35);
              dead = true; break;
            }

            // bosses are big targets: keep those fights punchy
            let dmg = refDmg() * (e.boss ? 2 : 1);
            if(e.boss) dmg += 2*lvlOf("bore");             // Bore: cut for heavy plate
            if(G.hp <= 2) dmg += 2*lvlOf("desperate");     // Last stand
            G.landed = (G.landed||0) + 1;
            if(lvlOf("grind") && G.landed % 3 === 0) dmg *= 1 + lvlOf("grind");
            if(G.whet && lvlOf("whetstone")){ dmg *= 3; G.whet = 0; }
            if(G.quench) dmg = Math.max(1, dmg - 1);       // Quenching blunts the whole rack
            if(G.combo >= 5) dmg += lvlOf("momentum");     // Momentum: a running chain hits harder
            if(e.mark)       dmg += 2*lvlOf("glint");      // Glint: tuned for marked plate
            // Tempered plate does not care how hot your returns run — one is one,
            // and neither Momentum nor Glint is an exception to that
            e.hp -= (e.mark && e.mark.id === "tempered") ? 1 : dmg;
            e.lastHit = G.elapsed;                        // Knitting reads this
            if(e.mark && e.mark.id === "bristling" && e.hp > 0){
              fire(e, Math.atan2(cy-e.y, cx-e.x));        // one fresh round per hit taken
            }
            if(lvlOf("stun") && !e.boss) e.stun = Math.max(e.stun, 0.3*lvlOf("stun"));
            if(lvlOf("sear")) e.burn = 2;                  // Sear: leave the plate cooking
            if(lvlOf("shove") && !e.boss){                 // Shove: knock it back off the core
              const ux = (e.x-cx)/(Math.hypot(e.x-cx,e.y-cy)||1), uy = (e.y-cy)/(Math.hypot(e.x-cx,e.y-cy)||1);
              e.x += ux*18*lvlOf("shove"); e.y += uy*18*lvlOf("shove");
            }
            burstParts(p.x,p.y,C.brassHi,6,150,.35);
            if(e.hp<=0) killEnemy(e,j);
            else { blip(240,.05,"square",.4); shake=Math.min(14,shake+2); }

            // Refracting: the plate throws your own bolt straight back down its line
            if(e.mark && e.mark.id === "refracting" && !p.refr){
              p.refr = 1; p.friendly = false; p.heavy = false;
              p.vx = -p.vx; p.vy = -p.vy;
              p.color = e.m.color; p.life = 4; p.hit = null; p.pierce = 0;
              const rc = hsl(174,84,66);
              burstParts(p.x,p.y,rc,8,180,.45); ringFx(p.x,p.y,rc,3,26,.3,2);
              blip(210,.08,"square",.4);
              break;
            }

            if(p.pierce > 0){                      // Piercing return: carry on to the next one
              p.pierce--;
              (p.hit || (p.hit = [])).push(e.uid);
              continue;
            }
            dead = true; break;
          }
        }
      }

      // Terminal charge: a return that burns out unspent comes apart instead.
      // the fragments are flagged spent, so a rack of these cannot chain forever
      if(!dead && p.friendly && !p.spent && p.life<=0 && lvlOf("terminal")){
        for(let q=0;q<2*lvlOf("terminal");q++){
          const a = rnd(TAU);
          G.shots.push({ x:p.x, y:p.y, vx:Math.cos(a)*400, vy:Math.sin(a)*400,
                         r:4, friendly:true, heavy:false, trail:[], life:1.6, pierce:0, spent:true });
        }
        ringFx(p.x,p.y,C.brassHi,3,28,.26,2);
      }

      if(!reduce){ p.trail.push(p.x,p.y); if(p.trail.length > (p.friendly?16:12)) p.trail.splice(0,2); }
      if(dead || p.life<=0 || p.x<-90 || p.y<-90 || p.x>cw+90 || p.y>ch+90) G.shots.splice(i,1);
    }

    for(let i=G.pickups.length-1;i>=0;i--){
      const u = G.pickups[i];
      if(!lvlOf("latch")) u.life -= dt;        // Latch: salvage sits on the track until you take it
      u.spin += dt*2.2; u.a += dt*0.28;
      u.r += (RING_R-u.r)*Math.min(1,dt*(1.5 + 0.9*lvlOf("magnet")));
      if(Math.abs(u.r-RING_R) < 16 + 10*lvlOf("magnet") && shieldCovers(u.a)){
        applyPickup(u.kind); G.pickups.splice(i,1); continue;
      }
      if(u.life<=0) G.pickups.splice(i,1);
    }

    for(let i=G.parts.length-1;i>=0;i--){
      const q=G.parts[i]; q.life-=dt; q.x+=q.vx*dt; q.y+=q.vy*dt; q.vx*=.94; q.vy*=.94;
      if(q.life<=0) G.parts.splice(i,1);
    }
    for(let i=G.rings.length-1;i>=0;i--){ G.rings[i].t+=dt; if(G.rings[i].t>=G.rings[i].dur) G.rings.splice(i,1); }
  }

  function applyPickup(kind){
    const d = PICKUP[kind];
    const av = 1 + lvlOf("avarice");        // Avarice: every piece of salvage counts twice
    if(kind==="wide"){ G.hw=baseHW()+0.26*av; G.wideT=12*av; }
    if(kind==="slow"){ G.slowT=6*av; }
    if(kind==="mend"){ G.hp=Math.min(G.maxHp,G.hp+av); drawHull(); }
    if(kind==="surge"){ G.pulseCd=0; G.surge=av; }
    if(lvlOf("scrap")){                     // Scrap charge: salvage is charge, whatever it was
      G.pulseCd = Math.max(0, G.pulseCd - 0.7*lvlOf("scrap"));
    }
    if(lvlOf("dross")) addScore(250*lvlOf("dross"));   // Dross: the bays pay for the scrap too
    drawPulseMeter();
    ringFx(cx+Math.cos(aim)*RING_R, cy+Math.sin(aim)*RING_R, d.color, 6, 60, .45, 3);
    flash=.22; flashColor=d.color;
    blip(520,.1,"triangle",.7,1.9); blip(780,.14,"triangle",.5,1.6);
    G.bannerText = d.label; G.bannerSub=""; G.banner = 1.3;
  }

  /* ── render ── */
  function backdrop(){
    ctx.fillStyle = C.ink; ctx.fillRect(0,0,cw,ch);
    const g = ctx.createRadialGradient(cx,cy,0,cx,cy,S*.72);
    g.addColorStop(0,"rgba(23,34,68,0.85)"); g.addColorStop(1,"rgba(8,12,24,0)");
    ctx.fillStyle=g; ctx.fillRect(0,0,cw,ch);

    ctx.save();
    ctx.strokeStyle="rgba(90,100,140,0.20)"; ctx.lineWidth=1;
    for(const f of [.28,.42,.56,.70]){ ctx.beginPath(); ctx.arc(cx,cy,S*f,0,TAU); ctx.stroke(); }
    ctx.strokeStyle="rgba(90,100,140,0.34)";
    const t = (mode==="play" && G) ? G.elapsed*.06 : performance.now()/16000;
    for(let i=0;i<72;i++){
      const a=t+i/72*TAU, long=i%6===0, r0=S*.70, r1=r0+(long?11:5);
      ctx.globalAlpha = long?.55:.28;
      ctx.beginPath();
      ctx.moveTo(cx+Math.cos(a)*r0, cy+Math.sin(a)*r0);
      ctx.lineTo(cx+Math.cos(a)*r1, cy+Math.sin(a)*r1);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawCore(){
    const puls = 1 + Math.sin(performance.now()/380)*.035;
    const hurt = G && G.iframe>0 && Math.floor(G.iframe*14)%2===0;
    const CR = coreR();               // shrinks as Tight core is stacked
    ctx.save();
    ctx.shadowColor = hurt?C.rose:C.brass; ctx.shadowBlur=30;
    ctx.fillStyle   = hurt?C.rose:C.brass;
    ctx.beginPath(); ctx.arc(cx,cy,CR*puls*.42,0,TAU); ctx.fill();
    ctx.shadowBlur=14; ctx.strokeStyle = hurt?C.rose:C.brassHi; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(cx,cy,CR*puls,0,TAU); ctx.stroke();
    ctx.globalAlpha=.45; ctx.lineWidth=1;
    ctx.beginPath(); ctx.arc(cx,cy,CR*puls*1.5,-.9,1.5); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx,cy,CR*puls*1.5,Math.PI-.9,Math.PI+1.5); ctx.stroke();
    ctx.restore();
  }

  function drawRing(){
    const hw = G?G.hw:0.52;
    ctx.save();
    ctx.strokeStyle="rgba(90,100,140,0.22)"; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(cx,cy,RING_R,0,TAU); ctx.stroke();
    ctx.lineCap="round";
    const arcs = [aim];
    if(lvlOf("twin")) arcs.push(aim+Math.PI);
    if(lvlOf("halo")) arcs.push(aim+Math.PI/2, aim-Math.PI/2);
    for(const a of arcs){
      ctx.globalAlpha=1;
      ctx.shadowColor=C.brass; ctx.shadowBlur=22;
      ctx.strokeStyle=C.brassHi; ctx.lineWidth=8;
      ctx.beginPath(); ctx.arc(cx,cy,RING_R,a-hw,a+hw); ctx.stroke();
      ctx.globalAlpha=.35; ctx.lineWidth=17; ctx.shadowBlur=0; ctx.strokeStyle=C.brass;
      ctx.beginPath(); ctx.arc(cx,cy,RING_R,a-hw,a+hw); ctx.stroke();
    }
    ctx.globalAlpha=.22; ctx.lineWidth=1; ctx.strokeStyle=C.brass;
    ctx.beginPath();
    ctx.moveTo(cx+Math.cos(aim)*CORE_R*1.6, cy+Math.sin(aim)*CORE_R*1.6);
    ctx.lineTo(cx+Math.cos(aim)*(RING_R-8), cy+Math.sin(aim)*(RING_R-8));
    ctx.stroke();
    ctx.restore();
  }

  /* ── silhouettes ──
     One body per archetype, all drawn nose-first along +x (the draw call rotates
     so +x faces the core). BODY builds the filled hull; RIG adds the stroked
     detail that has to sit on top of the fill. */
  const poly = (R, n, squash) => {
    ctx.moveTo(R, 0);
    for(let i=1;i<n;i++){ const t=i/n*TAU; ctx.lineTo(Math.cos(t)*R, Math.sin(t)*R*(squash||1)); }
  };
  const BODY = {
    // long needle with swept fins — reads as "one bolt, straight at you"
    lance:   R => { ctx.moveTo(R*1.3,0); ctx.lineTo(-R*.45,R*.62); ctx.lineTo(-R*.12,0); ctx.lineTo(-R*.45,-R*.62); },
    // blunt wedge, no gun, all front
    crawler: R => { ctx.moveTo(R*1.05,0); ctx.lineTo(-R*.45,R*1.0); ctx.lineTo(-R*.8,0); ctx.lineTo(-R*.45,-R*1.0); },
    // double-swept wings: the two barrels are visible in the outline
    weaver:  R => { ctx.moveTo(R*.95,R*.34); ctx.lineTo(-R*.3,R*.95); ctx.lineTo(-R*.6,R*.28);
                    ctx.lineTo(-R*.15,0);   ctx.lineTo(-R*.6,-R*.28); ctx.lineTo(-R*.3,-R*.95);
                    ctx.lineTo(R*.95,-R*.34); ctx.lineTo(R*.4,0); },
    // spiked star, one point per direction it is about to throw
    burst:   R => { for(let i=0;i<12;i++){ const t=i/12*TAU, rr=R*(i%2?.5:1.05);
                    if(i) ctx.lineTo(Math.cos(t)*rr, Math.sin(t)*rr); else ctx.moveTo(Math.cos(t)*rr, Math.sin(t)*rr); } },
    // fat pod, visibly full of something
    splitter:R => poly(R*1.02, 8),
    // squat hexagon, wider than it is long: a platform, not a flyer
    mortar:  R => poly(R*.95, 6, 1.25),
    // narrow lens, barely there even before it cloaks
    lurker:  R => { ctx.moveTo(R*1.45,0); ctx.lineTo(0,R*.42); ctx.lineTo(-R*1.15,0); ctx.lineTo(0,-R*.42); },
    // a chip: three points and nothing else
    swarm:   R => { ctx.moveTo(R*1.15,0); ctx.lineTo(-R*.65,R*.8); ctx.lineTo(-R*.65,-R*.8); },
    // heavy pentagon with a flat face turned toward you
    sentry:  R => poly(R, 5),
    // a closed ring of plate, no face at all
    warden:  R => poly(R, 10),
    // swept dart with trailing barbs — built to close, not to hold station
    harrier: R => { ctx.moveTo(R*1.25,0); ctx.lineTo(R*.1,R*.5); ctx.lineTo(-R*.85,R*.85);
                    ctx.lineTo(-R*.4,0); ctx.lineTo(-R*.85,-R*.85); ctx.lineTo(R*.1,-R*.5); },
    // five swept vanes: a wheel, and you can see which way it turns
    rotor:   R => { for(let i=0;i<10;i++){ const t=i/10*TAU + (i%2?0.30:0), rr=R*(i%2?.46:1.02);
                    if(i) ctx.lineTo(Math.cos(t)*rr, Math.sin(t)*rr); else ctx.moveTo(Math.cos(t)*rr, Math.sin(t)*rr); } },
    // a blade, all nose and no body — nothing about it is built to hold station
    shrike:  R => { ctx.moveTo(R*1.45,0); ctx.lineTo(-R*.2,R*.52); ctx.lineTo(-R*1.05,R*.28);
                    ctx.lineTo(-R*.6,0);  ctx.lineTo(-R*1.05,-R*.28); ctx.lineTo(-R*.2,-R*.52); },
    // a squat slab with a flat face: all frontage, nothing agile about it
    bastion: R => { ctx.moveTo(R*.9,R*.92); ctx.lineTo(R*1.12,R*.34); ctx.lineTo(R*1.12,-R*.34);
                    ctx.lineTo(R*.9,-R*.92); ctx.lineTo(-R*.9,-R*.78); ctx.lineTo(-R*1.06,0);
                    ctx.lineTo(-R*.9,R*.78); },
    // a hanging bell, wider at the mouth than at the crown
    carillon:R => { ctx.moveTo(R*1.0,R*.86); ctx.lineTo(R*1.0,-R*.86); ctx.lineTo(R*.2,-R*.62);
                    ctx.lineTo(-R*.85,-R*.3); ctx.lineTo(-R*.85,R*.3); ctx.lineTo(R*.2,R*.62); },
    // a wedge with the gun cut straight through the middle of it
    thresher:R => { ctx.moveTo(R*1.15,0); ctx.lineTo(R*.15,R*.55); ctx.lineTo(-R*.5,R*.95);
                    ctx.lineTo(-R*.72,R*.2); ctx.lineTo(-R*.72,-R*.2); ctx.lineTo(-R*.5,-R*.95);
                    ctx.lineTo(R*.15,-R*.55); },
  };
  const RIG = {
    weaver:  R => { ctx.moveTo(R*.4,R*.3); ctx.lineTo(R*.95,R*.3); ctx.moveTo(R*.4,-R*.3); ctx.lineTo(R*.95,-R*.3); },
    // the seams it comes apart along
    splitter:R => { for(const t of [0, 2.1, -2.1]){ ctx.moveTo(0,0); ctx.lineTo(Math.cos(t)*R*.98, Math.sin(t)*R*.98); } },
    // two barrels, pointed where the heavy rounds go
    mortar:  R => { for(const o of [-.34,.34]){ ctx.moveTo(Math.cos(o)*R*.5, Math.sin(o)*R*.5);
                    ctx.lineTo(Math.cos(o)*R*1.3, Math.sin(o)*R*1.3); } },
    // the five lines of the fan, drawn before it fires them
    sentry:  R => { for(const o of [-.44,-.22,0,.22,.44]){ ctx.moveTo(Math.cos(o)*R*.6, Math.sin(o)*R*.6);
                    ctx.lineTo(Math.cos(o)*R*1.15, Math.sin(o)*R*1.15); } },
    // eight ports, every direction at once
    warden:  R => { for(let i=0;i<8;i++){ const t=i/8*TAU;
                    ctx.moveTo(Math.cos(t)*R*.72, Math.sin(t)*R*.72); ctx.lineTo(Math.cos(t)*R*1.16, Math.sin(t)*R*1.16); } },
    lurker:  R => { ctx.moveTo(-R*.5,0); ctx.lineTo(R*.7,0); },
    // three rounds sitting in the chamber, drawn before it walks them onto you
    harrier: R => { for(let i=0;i<3;i++){ const x = R*(.35 + i*.3);
                    ctx.moveTo(x,-R*.22); ctx.lineTo(x,R*.22); } },
    // five ports on the vanes, pointing where the wheel is about to throw
    rotor:   R => { for(let i=0;i<5;i++){ const t=i/5*TAU;
                    ctx.moveTo(Math.cos(t)*R*.5, Math.sin(t)*R*.5);
                    ctx.lineTo(Math.cos(t)*R*1.05, Math.sin(t)*R*1.05); } },
    // one spine down the whole length of it
    shrike:  R => { ctx.moveTo(-R*.55,0); ctx.lineTo(R*1.2,0); },
    // three heavy ports across the face
    bastion: R => { for(const o of [-.42,0,.42]){ ctx.moveTo(Math.cos(o)*R*.55, Math.sin(o)*R*.55);
                    ctx.lineTo(Math.cos(o)*R*1.2, Math.sin(o)*R*1.2); } },
    // the six notches it works through, and the clapper line
    carillon:R => { for(let i=0;i<6;i++){ const y = (i-2.5)*R*.26;
                    ctx.moveTo(R*.55, y); ctx.lineTo(R*.98, y); }
                    ctx.moveTo(-R*.7,0); ctx.lineTo(R*.2,0); },
    // one barrel straight through the wedge
    thresher:R => { ctx.moveTo(-R*.6,0); ctx.lineTo(R*1.1,0);
                    ctx.moveTo(R*.5,-R*.2); ctx.lineTo(R*.5,R*.2); },
  };

  function drawEnemy(e){
    const k = e.m.arch;
    const a = Math.atan2(cy-e.y, cx-e.x);
    let alpha = e.stun>0 ? .45 : 1;
    if(k.cloak) alpha *= .45 + .55*Math.abs(Math.sin(G.elapsed*1.4 + e.phase));
    // Shrouded runs the whole hull cold; only the mark ring is left to aim at
    const shroud = !!e.mark && e.mark.id === "shrouded";
    if(shroud) alpha *= .12 + .16*Math.abs(Math.sin(G.elapsed*0.9 + e.phase));
    const plate = e.m.plate || "plain";
    if(plate === "void") alpha *= .72;              // Umbral is hard to read on purpose
    const R = e.r;
    ctx.save();
    ctx.translate(e.x,e.y); ctx.rotate(a);
    ctx.globalAlpha = alpha;
    ctx.shadowColor = e.m.color;
    ctx.shadowBlur = plate === "void" ? 0            // non-reflective: no glow at all
                   : (e.boss?26:(e.stun>0?4:15)) * (plate === "bare" ? .5 : 1);
    ctx.strokeStyle = e.m.color;
    ctx.lineWidth = (e.boss?3:2) * (plate === "dense" ? 1.7 : plate === "bare" ? .7 : 1);
    ctx.fillStyle = plate === "void" ? "rgba(4,6,12,0.95)" : "rgba(8,12,24,0.85)";
    ctx.beginPath();
    (BODY[k.shape] || BODY.warden)(R);
    ctx.closePath(); ctx.fill(); ctx.stroke();

    // strain plating: the same body, wearing what the Lattice could afford
    if(plate === "worn"){                           // recovered scrap, re-poured
      ctx.save(); ctx.globalAlpha = alpha*.5; ctx.lineWidth = 1; ctx.shadowBlur = 0;
      ctx.setLineDash([3,4]);
      ctx.beginPath(); ctx.arc(0,0,R*1.16,0,TAU); ctx.stroke();
      ctx.restore();
    } else if(plate === "hot"){                     // Ember runs hot enough to glow
      ctx.save(); ctx.shadowBlur = 18; ctx.globalAlpha = alpha*.85;
      ctx.fillStyle = e.m.color;
      ctx.beginPath(); ctx.arc(0,0,R*.3 + Math.sin(G.elapsed*4+e.phase)*R*.06,0,TAU); ctx.fill();
      ctx.restore();
    } else if(plate === "rime"){                    // supercooled: a second shell
      ctx.save(); ctx.globalAlpha = alpha*.55; ctx.lineWidth = 1.2; ctx.shadowBlur = 0;
      ctx.beginPath(); (BODY[k.shape] || BODY.warden)(R*1.22); ctx.closePath(); ctx.stroke();
      ctx.restore();
    } else if(plate === "chalk"){                   // dusty matte, crumbling at the edge
      ctx.save(); ctx.globalAlpha = alpha*.4; ctx.shadowBlur = 0;
      ctx.strokeStyle = "#E8E4DA"; ctx.lineWidth = 3.2;
      ctx.setLineDash([1,5]);
      ctx.beginPath(); ctx.arc(0,0,R*1.08,0,TAU); ctx.stroke();
      ctx.restore();
    } else if(plate === "cast"){                    // poured in a mould, and you can see the seam
      ctx.save(); ctx.globalAlpha = alpha*.6; ctx.shadowBlur = 0;
      ctx.strokeStyle = "#D9A362"; ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(0,-R*1.1); ctx.lineTo(0,R*1.1);
      ctx.moveTo(-R*1.1,0); ctx.lineTo(R*1.1,0);
      ctx.stroke(); ctx.restore();
    } else if(plate === "nacre"){                   // iridescent: the colour moves as it turns
      ctx.save(); ctx.globalAlpha = alpha*.7; ctx.shadowBlur = 0; ctx.lineWidth = 1.8;
      for(let i=0;i<3;i++){
        ctx.strokeStyle = hsl((G.elapsed*40 + e.phase*60 + i*46) % 360, 78, 74);
        ctx.beginPath(); ctx.arc(0,0,R*(0.72 + i*0.2), i*2.1, i*2.1 + 2.0); ctx.stroke();
      }
      ctx.restore();
    } else if(plate === "scale"){                   // oxidised stock, flaking off in plates
      ctx.save(); ctx.globalAlpha = alpha*.55; ctx.shadowBlur = 0;
      ctx.strokeStyle = "#C97A46"; ctx.lineWidth = 1.1;
      ctx.beginPath();
      for(let i=0;i<7;i++){
        const t = i/7*TAU + e.phase*0.5;
        ctx.moveTo(Math.cos(t)*R*.92, Math.sin(t)*R*.92);
        ctx.lineTo(Math.cos(t+0.22)*R*1.24, Math.sin(t+0.22)*R*1.24);
      }
      ctx.stroke(); ctx.restore();
    } else if(plate === "vitreous"){                // lacquered: one hard specular edge
      ctx.save(); ctx.globalAlpha = alpha*.8; ctx.shadowBlur = 0;
      ctx.strokeStyle = "#FFD9D0"; ctx.lineWidth = 2.2;
      const t0 = -0.9 + Math.sin(G.elapsed*0.6 + e.phase)*0.25;
      ctx.beginPath(); ctx.arc(0,0,R*0.78, t0, t0+1.1); ctx.stroke();
      ctx.restore();
    } else if(plate === "patina"){                  // corroded stock, shedding in flecks
      ctx.save(); ctx.globalAlpha = alpha*.6; ctx.shadowBlur = 0;
      ctx.fillStyle = "#7FD6A8";
      for(let i=0;i<10;i++){
        const t = i/10*TAU + e.phase, rr = R*(1.02 + (i%3)*0.11);
        ctx.beginPath(); ctx.arc(Math.cos(t)*rr, Math.sin(t)*rr, 1.5, 0, TAU); ctx.fill();
      }
      ctx.restore();
    } else if(plate === "leaf" || plate === "gilt"){ // ornament, then gilt over steel
      ctx.save(); ctx.globalAlpha = alpha*(plate==="gilt"?.9:.6);
      ctx.strokeStyle = "#E8B45C"; ctx.lineWidth = plate==="gilt"?1.8:1.1; ctx.shadowBlur = 0;
      ctx.beginPath(); ctx.arc(0,0,R*.62,0,TAU); ctx.stroke();
      if(plate === "gilt"){ ctx.beginPath(); ctx.arc(0,0,R*.34,0,TAU); ctx.stroke(); }
      ctx.restore();
    } else if(plate === "regal"){                   // solid gold, and making sure you know
      ctx.save(); ctx.globalAlpha = alpha*.8; ctx.strokeStyle = "#F0C97A"; ctx.lineWidth = 1.6;
      ctx.shadowColor = "#F0C97A"; ctx.shadowBlur = 12;
      ctx.beginPath();
      for(let i=0;i<12;i++){ const t = i/12*TAU + G.elapsed*0.25;
        ctx.moveTo(Math.cos(t)*R*1.1, Math.sin(t)*R*1.1);
        ctx.lineTo(Math.cos(t)*R*1.34, Math.sin(t)*R*1.34); }
      ctx.stroke(); ctx.restore();
    }

    // archetype rigging: barrels, seams, ports — what it does, drawn on the hull
    if(RIG[k.shape]){
      ctx.save();
      ctx.globalAlpha = alpha*.75; ctx.lineWidth = e.boss?2:1.3; ctx.shadowBlur = 0;
      ctx.beginPath(); RIG[k.shape](R); ctx.stroke();
      ctx.restore();
    }
    if(e.boss){
      ctx.shadowBlur=0; ctx.globalAlpha=alpha*.5; ctx.lineWidth=1;
      ctx.beginPath(); ctx.arc(0,0,R*1.35,0,TAU); ctx.stroke();
    }
    if(e.mark){
      ctx.rotate(-a);                              // the mark reads in world space, not facing
      const mc = hsl(e.mark.hue, 84, 66);
      // a Shrouded hull is nearly gone, so its ring has to stay legible or the
      // mark would be a coin toss rather than a question
      const ma = shroud ? Math.max(alpha, .62) : alpha;
      ctx.shadowBlur=0; ctx.globalAlpha=ma*.8;
      ctx.strokeStyle=mc; ctx.lineWidth=1.4;
      ctx.setLineDash([4,5]); ctx.lineDashOffset = -G.elapsed*14;
      ctx.beginPath(); ctx.arc(0,0,R*1.5,0,TAU); ctx.stroke();
      ctx.setLineDash([]);
      if(e.mark.id === "warded"){                  // draw the plate you have to shoot around
        ctx.globalAlpha=alpha; ctx.lineWidth=3.4;
        ctx.shadowColor=mc; ctx.shadowBlur=14;
        ctx.beginPath(); ctx.arc(0,0,R*1.5, e.wardA-0.95, e.wardA+0.95); ctx.stroke();
      }
      if(e.mark.id === "tempered"){                // banded plate: reads as "this will take a while"
        ctx.globalAlpha=alpha*.85; ctx.lineWidth=2.6;
        ctx.shadowColor=mc; ctx.shadowBlur=10;
        ctx.beginPath(); ctx.arc(0,0,R*1.2,0,TAU); ctx.stroke();
      }
      if(e.mark.id === "errant"){                  // show where it is about to be
        const gx = 2*(cx-e.x), gy = 2*(cy-e.y);
        const tell = clamp(1 - e.jumpT/1.1, 0, 1);       // brightens as the jump comes due
        ctx.globalAlpha = alpha*(.14 + .5*tell);
        ctx.lineWidth = 1.4; ctx.setLineDash([3,6]); ctx.lineDashOffset = G.elapsed*22;
        ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(gx,gy); ctx.stroke();
        ctx.beginPath(); ctx.arc(gx,gy,R*(1.5 - .5*tell),0,TAU); ctx.stroke();
        ctx.setLineDash([]);
      }
      if(e.mark.id === "crowned"){                 // spikes, and the pull on everything else
        ctx.globalAlpha=alpha; ctx.lineWidth=2.2;
        ctx.shadowColor=mc; ctx.shadowBlur=12;
        ctx.beginPath();
        for(let n=0;n<7;n++){
          const t = n/7*TAU - G.elapsed*0.5;
          ctx.moveTo(Math.cos(t)*R*1.5, Math.sin(t)*R*1.5);
          ctx.lineTo(Math.cos(t)*R*2.1, Math.sin(t)*R*2.1);
        }
        ctx.stroke();
        ctx.globalAlpha=alpha*.18; ctx.lineWidth=1; ctx.shadowBlur=0;
        ctx.beginPath(); ctx.arc(0,0,R*2.1 + Math.sin(G.elapsed*2)*R*.18,0,TAU); ctx.stroke();
      }
      if(e.mark.id === "creeping"){               // a chevron pointed at the core
        ctx.globalAlpha=alpha*.9; ctx.lineWidth=2;
        ctx.shadowColor=mc; ctx.shadowBlur=10;
        const t = Math.atan2(cy-e.y, cx-e.x);
        ctx.beginPath();
        for(const o of [-0.5, 0.5]){
          ctx.moveTo(Math.cos(t+o)*R*1.55, Math.sin(t+o)*R*1.55);
          ctx.lineTo(Math.cos(t)*R*2.05,   Math.sin(t)*R*2.05);
        }
        ctx.stroke();
      }
      if(e.mark.id === "mirrored"){               // the chord across to its opposite number
        const tw = e.twin && G.enemies.find(o => o.uid === e.twin);
        if(tw){
          ctx.globalAlpha=alpha*.24; ctx.lineWidth=1.2; ctx.shadowBlur=0;
          ctx.setLineDash([5,7]); ctx.lineDashOffset = -G.elapsed*10;
          ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(tw.x-e.x, tw.y-e.y); ctx.stroke();
          ctx.setLineDash([]);
        }
      }
      if(e.mark.id === "laden"){                  // a full second ring: it is carrying something
        ctx.globalAlpha=alpha*.85; ctx.lineWidth=1.6; ctx.shadowColor=mc; ctx.shadowBlur=12;
        ctx.setLineDash([2,4]); ctx.lineDashOffset = G.elapsed*18;
        ctx.beginPath(); ctx.arc(0,0,R*1.85,0,TAU); ctx.stroke();
        ctx.setLineDash([]);
      }
      if(e.mark.id === "legion"){                 // three ticks: it did not come alone
        ctx.globalAlpha=alpha*.9; ctx.lineWidth=2.2; ctx.shadowColor=mc; ctx.shadowBlur=8;
        ctx.beginPath();
        for(let n=0;n<3;n++){
          const t = -0.4 + n*0.4 + G.elapsed*0.4;
          ctx.moveTo(Math.cos(t)*R*1.62, Math.sin(t)*R*1.62);
          ctx.lineTo(Math.cos(t)*R*1.95, Math.sin(t)*R*1.95);
        }
        ctx.stroke();
      }
      if(e.mark.id === "freighted"){              // a loaded bar across the hull
        ctx.globalAlpha=alpha*.9; ctx.lineWidth=3.6; ctx.shadowColor=mc; ctx.shadowBlur=10;
        const t = Math.atan2(cy-e.y, cx-e.x);
        ctx.beginPath();
        ctx.arc(0,0,R*1.34, t-0.42, t+0.42); ctx.stroke();
      }
      if(e.mark.id === "hollow"){                 // an empty shell: nothing inside it
        ctx.globalAlpha=alpha*.7; ctx.lineWidth=1; ctx.shadowBlur=0;
        ctx.beginPath(); ctx.arc(0,0,R*0.5,0,TAU); ctx.stroke();
        ctx.beginPath(); ctx.arc(0,0,R*0.28,0,TAU); ctx.stroke();
      }
      if(e.mark.id === "kindled"){                // a tail, brightening as its rounds gather
        ctx.globalAlpha=alpha*.85; ctx.lineWidth=2; ctx.shadowColor=mc; ctx.shadowBlur=14;
        ctx.beginPath();
        for(let n=0;n<4;n++){
          const t = G.elapsed*1.6 + n*0.5;
          ctx.moveTo(Math.cos(t)*R*1.5, Math.sin(t)*R*1.5);
          ctx.lineTo(Math.cos(t)*R*(1.5 + 0.5*(4-n)/4), Math.sin(t)*R*(1.5 + 0.5*(4-n)/4));
        }
        ctx.stroke();
      }
      if(e.mark.id === "wailing"){                // rings going out: the noise it makes
        ctx.globalAlpha=alpha*.5; ctx.lineWidth=1.3; ctx.shadowBlur=0;
        for(let n=0;n<3;n++){
          const ph = (G.elapsed*0.6 + n/3) % 1;
          ctx.globalAlpha = alpha*.5*(1-ph);
          ctx.beginPath(); ctx.arc(0,0,R*(1.5 + ph*1.4),0,TAU); ctx.stroke();
        }
      }
      if(e.mark.id === "shuttered"){              // shut is a closed ring, open is a broken one
        ctx.globalAlpha=alpha*(e.shut?1:.5); ctx.lineWidth=e.shut?3.4:1.6;
        ctx.shadowColor=mc; ctx.shadowBlur=e.shut?16:0;
        ctx.beginPath();
        if(e.shut) ctx.arc(0,0,R*1.28,0,TAU);
        else for(let n=0;n<4;n++) ctx.arc(0,0,R*1.28, n/4*TAU+0.25, (n+1)/4*TAU-0.25);
        ctx.stroke();
      }
      if(e.mark.id === "vengeful"){               // already aimed at the core
        ctx.globalAlpha=alpha*.9; ctx.lineWidth=1.8; ctx.shadowColor=mc; ctx.shadowBlur=10;
        const t = Math.atan2(cy-e.y, cx-e.x);
        ctx.beginPath();
        ctx.moveTo(Math.cos(t)*R*1.3, Math.sin(t)*R*1.3);
        ctx.lineTo(Math.cos(t)*R*2.2, Math.sin(t)*R*2.2);
        ctx.moveTo(Math.cos(t+1.57)*R*1.7, Math.sin(t+1.57)*R*1.7);
        ctx.lineTo(Math.cos(t-1.57)*R*1.7, Math.sin(t-1.57)*R*1.7);
        ctx.stroke();
      }
      if(e.mark.id === "waking"){                 // a closed eye until it opens
        const woke = e.born >= 8;
        ctx.globalAlpha=alpha*(woke?.9:.55); ctx.lineWidth=woke?2.4:1.4;
        ctx.shadowColor=mc; ctx.shadowBlur=woke?12:0;
        ctx.beginPath();
        if(woke) ctx.arc(0,0,R*1.3,0,TAU);
        else { const f = clamp(e.born/8,0,1);
               ctx.arc(0,0,R*1.3, -1.4 - f*1.6, -1.4 + f*1.6); }
        ctx.stroke();
      }
      if(e.mark.id === "bristling"){              // spines, pointed outward
        ctx.globalAlpha=alpha*.85; ctx.lineWidth=1.6; ctx.shadowColor=mc; ctx.shadowBlur=8;
        ctx.beginPath();
        for(let n=0;n<10;n++){
          const t = n/10*TAU + e.phase;
          ctx.moveTo(Math.cos(t)*R*1.18, Math.sin(t)*R*1.18);
          ctx.lineTo(Math.cos(t)*R*1.52, Math.sin(t)*R*1.52);
        }
        ctx.stroke();
      }
      if(e.mark.id === "seeding"){                // a bud swelling as the next one comes due
        const f = clamp(1 - e.seedT/4.2, 0, 1);
        ctx.globalAlpha=alpha*(.3+.6*f); ctx.lineWidth=1.8; ctx.shadowColor=mc; ctx.shadowBlur=10;
        ctx.beginPath(); ctx.arc(R*1.5, 0, R*(0.16+0.34*f), 0, TAU); ctx.stroke();
        ctx.globalAlpha=alpha*.3; ctx.lineWidth=1;
        ctx.beginPath(); ctx.arc(0,0,R*1.5,0,TAU); ctx.stroke();
      }
      if(e.mark.id === "knitting"){               // a stitch closing over the hull
        ctx.globalAlpha=alpha*.85; ctx.lineWidth=1.8; ctx.shadowColor=mc; ctx.shadowBlur=8;
        ctx.beginPath();
        for(let n=0;n<6;n++){
          const t = n/6*TAU + G.elapsed*0.7;
          ctx.moveTo(Math.cos(t)*R*1.1, Math.sin(t)*R*1.1);
          ctx.lineTo(Math.cos(t+0.5)*R*1.45, Math.sin(t+0.5)*R*1.45);
        }
        ctx.stroke();
      }
      if(e.mark.id === "glutting"){               // an open mouth, turned to whatever it wants
        ctx.globalAlpha=alpha*.9; ctx.lineWidth=3; ctx.shadowColor=mc; ctx.shadowBlur=10;
        const t = G.elapsed*0.8 + e.phase;
        const gape = 0.5 + 0.28*Math.sin(G.elapsed*3);
        ctx.beginPath(); ctx.arc(0,0,R*1.34, t-gape, t+gape); ctx.stroke();
      }
      if(e.mark.id === "cleaving"){               // a split ring: its rounds come apart
        ctx.globalAlpha=alpha*.9; ctx.lineWidth=2; ctx.shadowColor=mc; ctx.shadowBlur=10;
        ctx.beginPath();
        for(const s of [-1,1]){
          ctx.moveTo(Math.cos(0.35*s)*R*1.2, Math.sin(0.35*s)*R*1.2);
          ctx.lineTo(Math.cos(0.9*s)*R*2.0,  Math.sin(0.9*s)*R*2.0);
        }
        ctx.stroke();
      }
      if(e.mark.id === "sapping"){                // it is pulling on the ring, not on you
        ctx.globalAlpha=alpha*.7; ctx.lineWidth=1.4; ctx.shadowBlur=0;
        ctx.setLineDash([2,7]); ctx.lineDashOffset = G.elapsed*26;
        ctx.beginPath();
        ctx.arc(0,0,R*1.5, -0.6, 0.6);
        ctx.arc(0,0,R*1.5, Math.PI-0.6, Math.PI+0.6);
        ctx.stroke(); ctx.setLineDash([]);
      }
      if(e.mark.id === "averse"){                 // a field bowing away from it
        ctx.globalAlpha=alpha*.6; ctx.lineWidth=1.3; ctx.shadowBlur=0;
        for(let n=0;n<3;n++){
          ctx.beginPath();
          ctx.arc(0,0,R*(1.45+n*0.3), 0.5, TAU-0.5);
          ctx.stroke();
        }
      }
      if(e.mark.id === "refracting"){             // a facet: your own bolt, coming back
        ctx.globalAlpha=alpha*.9; ctx.lineWidth=2.2; ctx.shadowColor=mc; ctx.shadowBlur=12;
        ctx.beginPath();
        for(let n=0;n<3;n++){
          const t = n/3*TAU + G.elapsed*0.4;
          ctx.moveTo(Math.cos(t)*R*1.5, Math.sin(t)*R*1.5);
          ctx.lineTo(Math.cos(t+2.09)*R*1.5, Math.sin(t+2.09)*R*1.5);
        }
        ctx.stroke();
      }
      if(e.mark.id === "quenching"){              // a cold band over everything
        ctx.globalAlpha=alpha*.75; ctx.lineWidth=2.6; ctx.shadowColor=mc; ctx.shadowBlur=10;
        ctx.beginPath(); ctx.arc(0,0,R*1.62,0,TAU); ctx.stroke();
        ctx.globalAlpha=alpha*.3; ctx.lineWidth=1;
        ctx.beginPath(); ctx.arc(0,0,R*1.9,0,TAU); ctx.stroke();
      }
      if(e.mark.id === "smothering"){             // hooks, drawing your charge off
        ctx.globalAlpha=alpha*.9; ctx.lineWidth=1.8;
        ctx.shadowColor=mc; ctx.shadowBlur=10;
        ctx.beginPath();
        for(let n=0;n<5;n++){
          const t  = n/5*TAU + G.elapsed*0.9;
          const r0 = R*(1.6 + 0.32*Math.abs(Math.sin(G.elapsed*1.6 + n)));
          ctx.moveTo(Math.cos(t)*r0,      Math.sin(t)*r0);
          ctx.lineTo(Math.cos(t)*R*1.15,  Math.sin(t)*R*1.15);
        }
        ctx.stroke();
      }
    }
    ctx.restore();

    if(e.boss){
      const w = R*2.6, k2 = clamp(e.hp/(e.maxHp||e.m.hp),0,1);
      ctx.save(); ctx.globalAlpha=.9;
      ctx.fillStyle="rgba(90,100,140,.35)"; ctx.fillRect(e.x-w/2, e.y-R-16, w, 4);
      ctx.fillStyle=e.m.color;               ctx.fillRect(e.x-w/2, e.y-R-16, w*k2, 4);
      ctx.restore();
    }
  }

  function drawShots(){
    for(const p of G.shots){
      const col = p.friendly ? C.brassHi : (p.heavy ? C.jade : (p.color||C.ice));
      if(p.trail.length>3){
        ctx.save(); ctx.strokeStyle=col; ctx.lineWidth=p.friendly?3:2;
        ctx.lineCap="round"; ctx.globalAlpha=.28;
        ctx.beginPath(); ctx.moveTo(p.trail[0],p.trail[1]);
        for(let i=2;i<p.trail.length;i+=2) ctx.lineTo(p.trail[i],p.trail[i+1]);
        ctx.stroke(); ctx.restore();
      }
      ctx.save();
      ctx.shadowColor=col; ctx.shadowBlur=p.friendly?18:12; ctx.fillStyle=col;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,TAU); ctx.fill();
      if(p.heavy){ ctx.globalAlpha=.5; ctx.strokeStyle=col; ctx.lineWidth=1.5;
                   ctx.beginPath(); ctx.arc(p.x,p.y,p.r+5,0,TAU); ctx.stroke(); }
      ctx.restore();
    }
  }

  function drawPickups(){
    const mono = getComputedStyle(document.body).getPropertyValue("--mono");
    for(const u of G.pickups){
      const d = PICKUP[u.kind];
      const x = cx+Math.cos(u.a)*u.r, y = cy+Math.sin(u.a)*u.r;
      ctx.save();
      ctx.globalAlpha = u.life<3 ? (Math.floor(u.life*8)%2?.25:1) : 1;
      ctx.translate(x,y);
      ctx.rotate(u.spin); ctx.shadowColor=d.color; ctx.shadowBlur=16;
      ctx.strokeStyle=d.color; ctx.lineWidth=2; ctx.strokeRect(-8,-8,16,16);
      ctx.rotate(-u.spin); ctx.shadowBlur=0; ctx.fillStyle=d.color;
      ctx.font='600 11px ' + mono;
      ctx.textAlign="center"; ctx.textBaseline="middle";
      ctx.fillText(d.glyph,0,.5);
      ctx.restore();
    }
  }

  function drawFx(){
    for(const q of G.parts){
      const k=Math.max(0,q.life/q.max);
      ctx.globalAlpha=k; ctx.fillStyle=q.color;
      ctx.fillRect(q.x-q.size/2, q.y-q.size/2, q.size, q.size*k+.6);
    }
    ctx.globalAlpha=1;
    for(const r of G.rings){
      const k=r.t/r.dur;
      ctx.save(); ctx.globalAlpha=(1-k)*.85;
      ctx.strokeStyle=r.color; ctx.lineWidth=r.w*(1-k)+.4;
      ctx.beginPath(); ctx.arc(r.x,r.y, r.r0+(r.r1-r.r0)*(1-(1-k)*(1-k)), 0, TAU);
      ctx.stroke(); ctx.restore();
    }
  }

  function drawBanner(){
    if(G.banner<=0) return;
    const k = Math.min(1, G.banner/.35);
    const mono = getComputedStyle(document.body).getPropertyValue("--mono");
    ctx.save();
    ctx.globalAlpha=k*.92; ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.shadowColor=C.brass; ctx.shadowBlur=26; ctx.fillStyle=C.brassHi;
    ctx.font = "600 " + Math.round(S*.05) + "px " + mono;
    ctx.fillText(G.bannerText.split("").join("  "), cx, cy - S*.30);
    if(G.bannerSub){
      ctx.shadowColor=C.rose; ctx.fillStyle=C.rose;
      ctx.font = "600 " + Math.round(S*.021) + "px " + mono;
      ctx.fillText(G.bannerSub.split("").join(" "), cx, cy - S*.30 + S*.05);
    }
    ctx.restore();
  }

  function render(){
    ctx.setTransform(dpr,0,0,dpr,0,0);
    let sx=0, sy=0;
    if(shake>0.2 && !reduce){ sx=rnd(shake,-shake)*.5; sy=rnd(shake,-shake)*.5; }
    ctx.save(); ctx.translate(sx,sy);
    backdrop();
    if(G){
      if(G.slowT>0){ ctx.save(); ctx.globalAlpha=.06+Math.sin(performance.now()/200)*.02;
                     ctx.fillStyle=C.ice; ctx.fillRect(0,0,cw,ch); ctx.restore(); }
      drawFx(); drawPickups();
      for(const e of G.enemies) drawEnemy(e);
      drawShots();
    }
    drawCore();
    if(mode!=="title") drawRing();
    if(G) drawBanner();
    ctx.restore();
    if(flash>0){ ctx.save(); ctx.globalAlpha=flash*.5; ctx.fillStyle=flashColor;
                 ctx.fillRect(0,0,cw,ch); ctx.restore(); }
  }

  /* ── HUD ── */
  function drawHull(){
    el.hull.innerHTML="";
    const total = G?G.maxHp:5;
    for(let i=0;i<total;i++){
      const p=document.createElement("i");
      p.className = "pip" + (G && i<G.hp ? "" : " out");
      el.hull.appendChild(p);
    }
  }
  function drawPulseMeter(){
    const k = G ? 1-G.pulseCd/pulseMax() : 1;
    pulseBar.style.transform = "scaleX(" + k.toFixed(3) + ")";
    el.pulse.classList.toggle("ready", k>=1);
  }

  /* ── screens ── */
  /* ── the codex ──────────────────────────────────────────
     Lore, the bestiary, the refit index, and field notes. Monsters you have
     actually met are lit in brass; the rest stay dim until you meet them. */
  const codex = document.getElementById("codex");
  let SEEN = new Set();
  try{ SEEN = new Set(JSON.parse(localStorage.getItem("aegis.seen")||"[]")); }catch(e){}
  function markSeen(name){
    if(SEEN.has(name)) return;
    SEEN.add(name);
    try{ localStorage.setItem("aegis.seen", JSON.stringify(Array.from(SEEN))); }catch(e){}
  }

  let MET = new Set();                          // marks encountered, tracked separately
  try{ MET = new Set(JSON.parse(localStorage.getItem("aegis.marks")||"[]")); }catch(e){}
  function markMet(id){

    MET.add(id);
    try{ localStorage.setItem("aegis.marks", JSON.stringify(Array.from(MET))); }catch(e){}

  /* ── the saved run ──
     The bestiary, the marks met and the furthest level are station records and
     have always persisted on their own. This is the other half: the run you are
     actually in — hull, score and the refit rack — written at the top of every
     level so closing the tab costs you the level you were on and nothing more.
     A dead run is not a saved run: breaching clears it, exactly as the drill
     has always said it does. */
  const RUN_KEY = "aegis.run";
  const ALLFITS = UPGRADES.concat(MEGAS);

  // a save is just text in someone else's browser: never trust the shape of it
  function sanitizeFits(raw){
    const out = {};
    if(raw && typeof raw === "object")
      for(const u of ALLFITS){
        const n = parseInt(raw[u.id], 10);
        if(n > 0) out[u.id] = Math.min(u.max, n);   // also drops ids retired since the save
      }
    return out;
  }
  function saveRun(){
    if(!G || G.level < 1 || G.level > LEVELS) return;
    try{
      localStorage.setItem(RUN_KEY, JSON.stringify({
        v:1, level:G.level, hp:G.hp, maxHp:G.maxHp, score:G.score, up:G.up,
        refits:G.refits||0, kills:G.kills||0, deflects:G.deflects||0,
        marked:G.marked||0, saved:G.saved||0,
      }));
    }catch(e){}
  }
  function loadRun(){
    try{
      const r = JSON.parse(localStorage.getItem(RUN_KEY) || "null");
      if(!r || r.v !== 1) return null;
      const lv = parseInt(r.level,10), mx = parseInt(r.maxHp,10);
      if(!(lv >= 1 && lv <= LEVELS) || !(mx >= 1)) return null;
      return { level:lv, maxHp:mx, hp:clamp(parseInt(r.hp,10)||1, 1, mx),
               score:Math.max(0, parseInt(r.score,10)||0), up:sanitizeFits(r.up),
               refits:Math.max(0, parseInt(r.refits,10)||0),
               kills:Math.max(0, parseInt(r.kills,10)||0),
               deflects:Math.max(0, parseInt(r.deflects,10)||0),
               marked:Math.max(0, parseInt(r.marked,10)||0),
               saved:r.saved ? 1 : 0 };
    }catch(e){ return null; }
  }
  function clearRun(){ try{ localStorage.removeItem(RUN_KEY); }catch(e){} }
  const fitsHeld = up => ALLFITS.filter(u => up[u.id]).map(u => u.name + " " + ROMAN[up[u.id]]);
