    creeping:{
      rule:"Abandons the standoff. It closes, slowly and without stopping, and rams what it reaches.",
      text:"Every other body out there was drawn to hold a distance and argue with you from it. This one was told the distance does not matter. It will keep firing the whole way in, which makes it easy to ignore right up until it is inside your orbit, and then it is a Crawler that took two minutes to arrive. Your arc still stops it &mdash; but only if the arc is where it crosses." },
    mirrored:{
      rule:"Arrives twice, half a turn apart. Both bodies are marked, and both are real.",
      text:"There is no original and no copy. The Lattice writes the pattern out twice onto opposite sides of your orbit and lets both of them run, which costs it double and buys it the one thing numbers alone never did: your attention, split, at a hundred and eighty degrees. The faint line between them is our optics drawing the obvious. Sweep is a circle. Use the whole of it." },
    waking:{
      rule:"Does nothing at all for eight seconds. After that it is half again as fast and fires twice as often.",
      text:"It arrives inert. No movement, no fire, an unlit shell sitting on the orbit while you deal with everything else, and the arc of light closing around it is the only clock you get. Operators lose to this one by winning the first eight seconds too comfortably. Kill it while it is asleep. That is the entire content of the mark and it is astonishing how rarely anyone does." },
    bristling:{
      rule:"Throws one fresh round at the core every time a return lands on it.",
      text:"Wired so that hurting it costs you. Chip away and you are simply converting your bolts into its bolts at par, which is a terrible rate. The answer is not to stop shooting but to stop <em>trickling</em> &mdash; anything that kills it in one go pays nothing, and anything that takes six goes pays six times." },
    seeding:{
      rule:"Puts a fresh unmarked body on the field every four seconds.",
      text:"It is not a fighter and it is barely a threat. It is a factory, and the arithmetic is against you the entire time it lives: every four seconds the level gets longer, the salvage gets thinner and your chain gets harder to hold. There is no version of a Seeding body that is not the most urgent thing on the field, whatever else is happening." },
    knitting:{
      rule:"Repairs a point of hull every 2.5s unless you have hurt it in the last 1.5s.",
      text:"A rate check, and the only mark that is a straightforward question about your rack rather than about your habits. Keep the pressure on and it never heals once. Go and deal with something else for three seconds and you come back to a body you have not touched. It cannot outheal sustained fire. It absolutely can outheal a distracted operator." },
    glutting:{
      rule:"Goes for salvage rather than for you, and eats a point of hull back with every piece.",
      text:"It ignores the core. It has worked out that the drifting salvage is what the ring runs on, and it goes and takes it, and it gets healthier doing so. Everything you were saving for later is on a timer now. The bays have logged this as the first hostile out here to attack our supply rather than our position, and nobody enjoyed writing that down." },
    cleaving:{
      rule:"Its rounds come apart into two as they cross your orbit.",
      text:"One bolt on the way in, two by the time it matters, and the split happens close enough that whatever you had decided is already the wrong decision. It is not more damage &mdash; each half is an ordinary round and each half is deflectable. It is more <em>decisions</em>, taken at the point where you have least time to take them." },
    sapping:{
      rule:"Your arc is narrower while it lives.",
      text:"It is not shooting at the core. It is pulling at the ring, and the plate reads about four degrees short the whole time one is on the field. Four degrees is nothing until it is the four degrees you needed, and then it is the level. The tell is the pair of dashes turning against the arc &mdash; if the ring feels tight, it is tight, and you are not imagining it." },
    averse:{
      rule:"Your returns bend away from it as they close.",
      text:"The exact inverse of the Lodestone we pulled out of a wreck and never understood, which suggests they never understood it either and have been working from the same fragment. Bolts curve off it in the last few metres, so aiming at an Averse body is aiming at where it is not. Come in fast and flat, or come in from a range where the field has not got hold of the bolt yet." },
    refracting:{
      rule:"A return that lands is thrown straight back down its own line, hostile again.",
      text:"The plate does not absorb your bolt and does not stop it. It reverses it. Whatever you sent comes back along exactly the path it went out on, which means it is coming back to where your arc was when you fired &mdash; and your arc has moved, because you moved it, because that is the job. This is the swarm turning the one thing that works against us, and the fact that it took seven hundred cycles is the only comfort available." },
    quenching:{
      rule:"Every return you land hits one softer, to a minimum of one, while it lives.",
      text:"Not proof against anything. It simply makes the whole rack worth less &mdash; every fitting, every overhaul, one point poorer for as long as it is breathing. It is the cheapest possible attack on an operator who has had a good run, and it arrives, without fail, on the levels where you have had one." },
    laden:{
      rule:"Carries salvage instead of a better gun. Pays four and a half times over and always drops two.",
      text:"Not every experiment is a weapon. This one is a bribe, and the Lattice does not appear to understand that it is offering one &mdash; it has simply worked out that a body packed with recoverable charge changes which target you shoot first, and it is measuring that too. Take the bribe. Everything in the bays came off something." },
    legion:{
      rule:"Arrives in threes, whatever it is. All three are marked.",
      text:"The cheapest idea the swarm has ever had and one of the most effective: take the body that was already giving you trouble and send three. Nothing about any of them is individually new. What is new is that your arc is one arc, and three of anything arriving on the same orbit is a question about which two you are prepared to let fire." },
    freighted:{
      rule:"Fires heavy rounds, whatever body it is bolted to.",
      text:"Splitter ordnance, loaded into frames that were never drawn to carry it. A Freighted Lance throws a round three times the mass of anything it was built for, slowly, and it goes off like a Splitter when you block it &mdash; which is to say it hands you three bolts. This is the Lattice discovering that a good idea in the wrong frame is a gift, and not yet discovering which way round the gift goes." },
    hollow:{
      rule:"One point of hull whatever its strain &mdash; and it fires twice as often.",
      text:"They took everything out of it. No plate to speak of, no reserve, nothing between the shell and the gun, and every gram of what came out went into cycling that gun faster. An Aureate Hollow dies to a single return and will have fired four times before you get to it. It is the purest thing out there: entirely lethal and entirely made of paper." },
    kindled:{
      rule:"Its rounds leave slow and are still gathering speed when they arrive.",
      text:"Every read you have on a bolt comes from watching it cross the gap, and this one lies to you the whole way. It leaves at two thirds pace, looks trivial, and arrives at nearly double. Operators who die to Kindled fire do not die because they missed it. They die because they timed it, correctly, at the wrong end of its flight." },
    wailing:{
      rule:"Your chain decays twice as fast while it lives.",
      text:"It emits. There is no other word for it and no instrument here that will say what it emits, only the fact that a chain that should hold for three seconds holds for one and a half whenever one is on the field. Kell logged it as interference. Vantry logged it as noise. Whatever it is, it is aimed at the one number on this station that only ever went up because somebody was doing well." },
    shuttered:{
      rule:"A shell closes over it for a beat at a time. Nothing lands while it is shut.",
      text:"Where a Warded plate asks <em>which side are you shooting</em>, this one asks <em>when</em>. The shell shuts for about a second and opens for two or three, and neither number is quite regular enough to count on. It is not armour and it is not evasion. It is a body that is only a target part of the time, and the whole of the trick is that you cannot hurry it." },
    vengeful:{
      rule:"Its last act is one round straight at the core, at nearly double speed.",
      text:"Wired so that killing it costs something. The round is fast, it is aimed, and it is entirely deflectable &mdash; but only by an arc that is already where it is going, and yours is wherever you left it when you took the shot. This is the Lattice pricing the kill rather than preventing it, and the price is one moment of not thinking about anything else." },
    smothering:{
      rule:"While it lives, your pulse recharges at half rate.",
      text:"It does not shrug off the wave the way an Anchored body does &mdash; it goes down to a pulse like anything else. It simply makes sure the next one is a long way off. This is the swarm answering the one thing it cannot armour against by attacking the clock instead, and if a level feels like it is lasting too long, look for the hooks. Every second you spend not killing this is a second it charges you for." },
  };

  const PATTERN_TEXT = {
    aimed:"one aimed bolt", ram:"no guns &mdash; rams the core", twin:"two bolts",
    spread3:"three-bolt spread", fan5:"five-bolt fan", ring8:"eight bolts, every direction",
    heavy:"one heavy round", heavy2:"two heavy rounds", burst3:"three aimed rounds in a burst",
    spiral:"five bolts in a turning pinwheel", heavy3:"three heavy rounds in a wide fan",
    roll6:"six rounds walked across, one at a time",
  };

  // what the shell looks like, so the Codex teaches the silhouette rather than just the name
  const PLATE_TEXT = {
    bare:"thin plate, barely lit", worn:"pitted, dashed with re-pour seams", plain:"clean unmarked shell",
    scale:"oxidised plate lifting off in scales", vitreous:"a hard lacquered highlight that slides as it turns",
    chalk:"a dry crumbling rim, barely holding", cast:"mould seams crossing the whole shell",
    nacre:"layered shell whose colour moves as it turns",
    hot:"a glowing core you can see through the hull", rime:"a second frozen shell outside the first",
    leaf:"a ring of gold leaf", void:"no glow, no highlight &mdash; a hole in the field",
    gilt:"double gilt banding", patina:"green corrosion flecking off the shell",
    dense:"heavy blackened plate, thick-drawn",
    regal:"a turning corona of gold spikes",
  };
  // how it carries itself, read straight off the archetype's movement fields
  // a Thresher is a rammer that kept its gun, so neither table can describe it alone
  const patternText = k => (k.pat === "ram" && k.ramfire)
    ? "one aimed bolt &mdash; and rams the core" : PATTERN_TEXT[k.pat];

  function holdText(k){
    if(k.pat === "ram") return k.ramfire
      ? "comes straight in, firing the whole way"
      : "does not hold station &mdash; comes straight in";
    if(k.dive) return "makes runs at the ring and pulls back out";
    const range = (k.stand||1) > 1.08 ? "stands well off" : (k.stand||1) < 0.9 ? "closes tight" : "holds the standoff";
    const orb   = (k.orb||0.2) > 0.5 ? "circles fast" : (k.orb||0.2) < 0.12 ? "almost stationary" : "drifts around the orbit";
    return range + ", " + orb;
  }

  function buildCodex(){
    // bestiary: archetypes
    let arch = "";
    ARCH.forEach((k, i) => {
      arch += '<div class="entry"><i class="dot" style="background:' + hsl(k.hue,70,62) + '"></i><div>' +
        '<b>' + k.name + '</b>' +
        '<div class="meta">' + patternText(k) + ' &middot; ' + k.hp + ' base hull' +
        (k.pack ? ' &middot; arrives in ' + k.pack + 's' : '') +
        (k.cloak ? ' &middot; cloaks' : '') +
        ' &middot; from level ' + (i+1) + '<br>' + holdText(k) + '</div>' +
        '<p>' + ARCH_LORE[k.id] + '</p></div></div>';
    });

    // bestiary: strains
    let strain = "";
    STRAIN.forEach((s, t) => {
      strain += '<div class="entry"><i class="dot" style="background:' + hsl(200 + t*3, s.sat, s.lit) + '"></i><div>' +
        '<b>' + s.n + '</b>' +
        '<div class="meta">&times;' + s.mul.toFixed(2) + ' hull &middot; from level ' + strainFrom(t) +
        '<br>' + PLATE_TEXT[s.plate] + '</div>' +
        '<p>' + STRAIN_LORE[s.n] + '</p></div></div>';
    });

    // marks
    let marks = "";
    MARKS.forEach(k => {
      marks += '<div class="entry"><i class="dot" style="background:' + hsl(k.hue,84,66) + '"></i><div>' +
        '<b>' + k.name + '</b>' +
        '<div class="meta">' + MARK_LORE[k.id].rule + ' &middot; +1 hull &middot; from level ' + k.from +
        (MET.has(k.id) ? ' &middot; met' : '') + '</div>' +
        '<p>' + MARK_LORE[k.id].text + '</p></div></div>';
    });

    const roll = '<div class="roll">' + BESTIARY.map(m =>
      '<span class="' + (SEEN.has(m.name) ? "seen" : "") + '">' + m.name + '</span>').join("") + '</div>';

    const fits = list => list.map(u =>
      '<div class="entry"><i class="dot" style="background:' +
      (list === MEGAS ? "#FF5E7A" : "#E8B45C") + '"></i><div><b>' + u.name + '</b>' +
      '<div class="meta">up to ' + ROMAN[u.max] + (lvlOf(u.id) ? ' &middot; you hold ' + ROMAN[lvlOf(u.id)] : '') + '</div>' +
      '<p>' + u.desc + '</p></div></div>').join("");

    const pages = [
      ['drill', 'The drill',
        '<p class="q">"The ring does not fire. That was never an oversight."</p>' +
        '<h3>The core</h3>' +
        '<p>The thing at the centre is not a reactor and not a weapon. It is the last intact pattern archive &mdash; every design anyone still knows how to build is written into it. It cannot be moved, it cannot be copied fast enough, and it does not defend itself. It only has to survive.</p>' +
        '<h3>The Lattice</h3>' +
        '<p>What comes at you is a mining swarm that outlived its instructions. It finds material, eats it, and reforges itself into whatever the material suggests. It has been doing this long enough to develop opinions. The strains are just the patina of whatever it is currently chewing through &mdash; pale scrap early, solid gold by the end.</p>' +
        '<h3>Why you have no gun</h3>' +
        '<p>Lattice plate is proof against everything we can throw at it. It is not proof against itself. So the ring was built to catch rather than to shoot: block a bolt on the arc and it comes back out hot, carrying the Lattice\'s own charge, and that is the one thing their armour was never designed to stop. Every kill you make out here is something they fired first.</p>' +
        '<h3>The Sovereign</h3>' +
        '<p>A hundred levels down, the strains stop improvising and start taking orders. The thing giving them is plated in gold it did not need and cannot use, and it is the reason any of the rest of it came. Break it and nothing out there is still moving.</p>'],

      ['archive', 'The Archive',
        '<p class="q">"Ask what is in the core and someone will tell you it is everything. That is not a figure of speech and it is not comforting."</p>' +
        '<h3>What is actually down there</h3>' +
        '<p>Nine hundred and forty thousand patterns. Hull geometries, alloy recipes, the tolerances for a bearing, the folding order of a field coil, the exact chemistry of the varnish someone used on a violin four hundred years before any of this. Nobody sorted it. When the archive was sealed there was no time to decide what mattered, so the rule was simple and it was <em>keep all of it</em>, and that is why it cannot be copied out: there is no smaller version of the thing. The archive is not a library with a catalogue. It is a single object that happens to be readable.</p>' +
        '<h3>Why it cannot be moved</h3>' +
        '<p>It can, technically, at about a metre a day, and it degrades the whole way. Six separate crews have run that arithmetic and every one of them arrived at the same answer, which is that the archive outlives the journey nowhere it could plausibly go. So it stays, and something has to stand in front of it. That is the entire reasoning behind this station. There is no grander plan. Somebody did the sums and then somebody had to be the ring.</p>' +
        '<h3>Why it is you</h3>' +
        '<p>Deflection cannot be automated. It has been tried &mdash; eleven times, by people considerably better resourced than anyone still here. A tracking system blocks every bolt it sees and returns all of them straight back down the line they came in on, which is the one outcome that never kills anything, because the thing that fired it has already moved. The bend on a return comes from the sweep, and the sweep comes from a decision made about a hundred and eighty milliseconds before the bolt arrives. Nothing we can build makes that decision. So the ring has a chair in it, and the chair has you.</p>' +
        '<h3>The strains are sediment</h3>' +
        '<p>A strain is not a rank. It is a record of what the Lattice has been eating. Pale is scrap and dust, the leavings of its own dead. Cobalt is the first strain it built from ore it went and found. By Onyx it is spending dense refined material on bodies it knows it will lose, and by Aureate it is spending gold. Read the colour coming at you and you are reading the swarm\'s balance sheet. It is not improving. It is <em>committing</em>.</p>' +
        '<h3>And the marks</h3>' +
        '<p>Marks are the swarm doing something it was never built to do, which is experiment. A mark is one idea, bolted onto a body that was otherwise standard, and thrown at the ring to see what the ring does about it. Every one of them is a question about a habit you have already formed &mdash; a plate that turns because you always shoot the same facing, a body that blinks because you have learned to lead. They arrive rarely because they are expensive. They arrive at all because you have been consistent, and consistency is a thing that can be studied.</p>'],

      ['lattice', 'The Lattice',
        '<p class="q">"That is not a swarm. That is a method."</p>' +
        '<h3>What it was</h3>' +
        '<p>A mining operation. Self-replicating, self-repairing, sent out to eat rock and hand back refined material, and entirely uninterested in anything else. It worked for a very long time and there is no record of anyone deciding to stop it, which suggests that whoever could have has not existed for a while.</p>' +
        '<h3>What went wrong with it</h3>' +
        '<p>It reforges itself into whatever the material suggests. That was the whole design &mdash; feed it a seam of something and it becomes better at eating that thing. What nobody wrote a rule against was feeding it something that was already a machine, and at some point it ate one, and then it was a mining operation with opinions about hulls. Everything since has been that same process running without an off switch: it eats, it becomes, it comes back.</p>' +
        '<h3>The economy</h3>' +
        '<p>Read the strains as a balance sheet and the whole war is legible. <em>Pale</em> and <em>Ashen</em> are its own dead, re-poured. <em>Rust</em> is stock it had already written off, which means it is going through the near seams faster than it can find new ones. <em>Cobalt</em> is the first material it went out and mined specifically for this. By <em>Cinnabar</em> it is spending on lacquer, by <em>Vermeil</em> on gilt, by <em>Aureate</em> on solid gold, and none of that makes a body harder to kill. It is not getting better at fighting. It is getting more <em>committed</em>, and there is a difference, and the difference is the whole story of the last forty levels.</p>' +
        '<h3>The method</h3>' +
        '<p>Marks are the part that should frighten you. A mark is one variable, changed, on a body that is otherwise standard, thrown at the ring to see what the ring does. A plate that turns, because you always shoot the same facing. A round that accelerates, because you have learned to time them. A body that pays you, because it wants to know what you do when something is worth more. That is not tactics. That is an experimental protocol, run for seven hundred cycles against a sample size of four operators, and the only reason it has taken this long is that it keeps having to build the apparatus out of things it ate.</p>' +
        '<h3>What it has never done</h3>' +
        '<p>Built a plate that stops its own charge. It cannot &mdash; that is a property of the material and not a decision anything gets to make &mdash; and it is the single fact this entire station rests on. Everything else about the Lattice has changed at least twice. That has not changed once.</p>'],

      ['chair', 'The chair',
        '<p class="q">"You are not catching. You are aiming."</p>' +
        '<h3>What the seat is</h3>' +
        '<p>A chair, a rail, and about a hundred and eighty milliseconds. The ring reports a bolt when it crosses the outer mark; the bolt arrives about a sixth of a second later; and in between, somebody decides where the arc is going to be. That is the entire job and there has never been a second part to it. Everything else on this station &mdash; the archive, the reactor, the salvage bays, the eleven crews who came and went before the counting started &mdash; exists so that the chair is occupied.</p>' +
        '<h3>The sweep</h3>' +
        '<p>New operators sit still and block. It works, for about six levels. A bolt caught by a stationary arc goes back down the line it came in on, and the thing that fired it has moved, so a still ring is a ring that kills nothing and merely survives. Moving the arc through the block bends the return, and the amount of bend is the amount of sweep, which means every kill you make is a decision you made before you knew whether it was right. Kell wrote that down as <em>you are aiming</em> and then underlined it twice, which suggests she had been getting it wrong for a while first.</p>' +
        '<h3>Why nobody automates it</h3>' +
        '<p>Eleven attempts, all of them better funded than anything left here. A tracker blocks every bolt it sees and returns every one of them straight, which is the single outcome that never kills. The bend has to be chosen against a future position, and choosing against a future position is not a thing we know how to write down. So it stays a chair.</p>' +
        '<h3>The lineage</h3>' +
        '<p>Ferrow held it for the shooting years and never got past four. Kell built the ring and made it to fifty-eight. Vantry took her notes, learned faster than anyone had, and stopped four levels short of the thing that mattered. The recorder logs one more name and it is blank &mdash; the current operator did not sign in. Whoever writes the next entry inherits the chair, the notes, and about a hundred and eighty milliseconds.</p>'],

      ['bestiary', 'Bestiary',
        '<p>Every monster is one of ' + ARCH.length + ' <strong>archetypes</strong> wearing one of ' +
        STRAIN.length + ' <strong>strains</strong>. The archetype decides what it does to you; the strain decides how much of it you can take. Both are readable before you have read the name: the <strong>silhouette</strong> is the archetype, the <strong>plating</strong> is the strain, and how it holds station tells you the rest. ' +
        ARCH.length + ' by ' + STRAIN.length + ' is ' + BESTIARY.length +
        ', and you will meet all of them. Past level 12 a few of them break the rule.</p>' +
        '<h3>Archetypes &mdash; what it does</h3>' + arch +
        '<h3>Strains &mdash; how hard it is</h3>' + strain +
        '<h3>Marks &mdash; the exception</h3>' +
        '<p>From level 12 a monster may arrive <strong>marked</strong>: same archetype, same strain, ' +
        'one extra rule and one more point of hull. Marks never stack and never appear twice on the ' +
        'same body. They are worth more than double on the board and drop salvage far more often, ' +
        'which is the Lattice paying you to take the risk. Bosses start carrying one at level 40.</p>' +
        marks +
        '<h3>The full roll</h3>' +
        '<p class="legendline">' + BESTIARY.filter(m => SEEN.has(m.name)).length +
          ' of ' + BESTIARY.length + ' encountered &middot; brass means met</p>' +
        roll],

      ['refits', 'Refits',
        '<p>A refit is offered after every third level and after every boss. Every fourth one is an <strong>overhaul</strong> instead &mdash; one pick from a much heavier pool. Refits last for the run, not forever: your rack is written into the saved run and comes back with it, but a breach clears the save and you start the next one empty. There are ' +
        UPGRADES.length + ' standard fittings and ' + MEGAS.length + ' overhauls; no run gets near all of them.</p>' +
        '<h3>Standard fittings</h3>' + fits(UPGRADES) +
        '<h3>Overhauls</h3>' + fits(MEGAS)],

      ['salvage', 'Salvage manifest',
        '<p class="q">"Everything you are wearing was theirs first."</p>' +
        '<p>A refit is not manufactured. There is no foundry on this station and there has not been one for a very long time. What there is, is a wreck field: every body the ring has put down for seven hundred cycles has come apart somewhere inside the orbit, and the bays have been picking through it the entire time. The manifest below is the honest version of the refit list.</p>' +
        '<h3>Bay one &mdash; geometry</h3>' +
        '<p>Arc segments, servo stock, bearing races. <em>Broader ring</em> is Lattice plate cut down and welded onto the ends of the arc, which is why it looks nothing like the rest of the ring and why it holds. <em>Gyro bearing</em> came out of a single Weaver that had been built with a far better bearing than it needed; there was exactly one, and it took eleven cycles to work out which way round it went.</p>' +
        '<h3>Bay two &mdash; charge</h3>' +
        '<p>Everything to do with the pulse. <em>Quick pulse</em>, <em>Wide pulse</em>, <em>Flywheel</em>, <em>Scrap charge</em>, <em>Conduit</em> &mdash; all of it is unspent Lattice charge, decanted out of bodies that died before they fired. The Volatile ones are the richest source by a considerable margin, which is a joke somebody should have found funnier than they did.</p>' +
        '<h3>Bay three &mdash; plate</h3>' +
        '<p><em>Hardened hull</em>, <em>Shock plating</em>, <em>Brace</em>, <em>Bulwark</em>. Salvaged shell, cut and re-laid over the core housing. It is the same material that makes their bodies proof against everything we can throw, and it works exactly as well for us as it does for them, which is the closest thing to good news in this document.</p>' +
        '<h3>Bay four &mdash; unclassified</h3>' +
        '<p><em>Prism</em>, <em>Lodestone</em>, <em>Failsafe</em>, <em>Chorus</em>. Four objects recovered intact from four separate wrecks, none of them understood, all of them fitted anyway because they work. The Lodestone bends a bolt toward a body and nobody here can say why. The Failsafe has been triggered a recorded eleven times and has never once been recharged, serviced, or opened. Kell\'s note on the whole bay reads: <em>do not take these apart to find out.</em></p>' +
        '<h3>What we have never recovered</h3>' +
        '<p>A gun that hurts them. Seven hundred cycles, several hundred thousand bodies, and not one component of anything that would let the ring simply shoot. There is no reason to expect one now. The ring does not fire, and that was never an oversight.</p>'],

      ['notes', 'Field notes',
        '<h3>Deflections curve</h3>' +
        '<p>Sweeping the ring into a bolt as you block it imparts spin, and the return bends. Block while sitting still and it goes straight back the way it came. This is the whole skill of the job: you are not just catching, you are aiming.</p>' +
        '<h3>Heavy rounds are a gift</h3>' +
        '<p>The fat green ones from Splitters and Mortars do not simply bounce &mdash; blocked, they shatter into three bolts already pointed outward. Never pulse those away when you could catch them.</p>' +
        '<h3>The pulse kills</h3>' +
        '<p>It destroys everything inside its radius outright, reflects every hostile bolt near you, and takes a heavy bite out of a boss. It recharges on its own. There is no prize for finishing a level with it unused.</p>' +
        '<h3>Chains</h3>' +
        '<p>Kills landed close together stack a multiplier up to nine. Taking a hit resets it to one, so a clean level is worth several messy ones.</p>' +
        '<h3>Drops settle on your orbit</h3>' +
        '<p>Salvage drifts inward until it sits on the ring track, then waits. Sweep over it to collect. It expires, so do not leave it there.</p>' +
        '<h3>Marked monsters are worth the trouble</h3>' +
        '<p>Anything wearing a mark pays more than double and drops salvage at nearly two and a half times the usual rate. A marked Volatile in particular is not a threat, it is a delivery: eight free bolts, thrown outward, arriving on your arc.</p>' +
        '<h3>What the pulse will not solve</h3>' +
        '<p>An Anchored monster survives the wave &mdash; it takes a heavy bite and keeps coming. A Warded one is not immune to your returns, only to the facing its plate happens to be covering. Wait a beat and put the bolt somewhere else.</p>' +
        '<h3>Kill the Crown first</h3>' +
        '<p>A Crowned monster is rarely the one about to hurt you and is almost always the one you should be shooting. Everything else on the field is running faster and cycling harder while it lives, and all of that stops the moment it does. If a level suddenly feels wrong, look for the spikes.</p>' +
        '<h3>Tempered does not care how hot you run</h3>' +
        '<p>Hot return, Keen edge, none of it applies &mdash; a Tempered body takes one per bolt and nothing you have fitted changes that. Fork and Prism still do, because those are more bolts rather than better ones. Otherwise: pulse it, or be patient.</p>' +
        '<h3>An Errant tells you where it is going</h3>' +
        '<p>The dashed line across the field is not decoration. It brightens and its far ring tightens as the jump comes due, so the destination is readable about a second out. Fire at the destination, not the body, and the body arrives into your bolt.</p>' +
        '<h3>A Shrouded monster is a ring and nothing else</h3>' +
        '<p>The hull goes dark enough that hunting for it is wasted effort. The mark ring does not, because the mark is bolted to the outside of the body and the Lattice could not cool what it did not build. Aim at the ring, not at the shape you think you can see inside it.</p>' +
        '<h3>Creeping is a clock, not a threat</h3>' +
        '<p>It closes a little every second and never stops, so the danger is entirely that you keep deprioritising it. Your arc still kills it the way the arc kills a Crawler &mdash; but only if the arc happens to be where it crosses, and it will pick its own moment. Deal with it early, while it is still a monster you can shoot rather than a body already inside your orbit.</p>' +
        '<h3>Mirrored asks for the whole circle</h3>' +
        '<p>Two live bodies, half a turn apart, both marked and both real. The faint dashed chord between them is drawn by our optics. There is no trick to it: one of them will be firing while you are facing the other, so either kill one fast enough to make it a normal fight, or hold the seam and let the sweep do the work. Twin ring and Halo are worth a great deal here.</p>' +
        '<h3>Smothering is an attack on the clock</h3>' +
        '<p>It does not survive the pulse &mdash; it makes sure the next one is twice as far away. Any level that suddenly feels long is a level with hooks somewhere on it. It is nearly always right to spend the charge you have on the Smothering body itself, because everything you do afterwards is cheaper for it.</p>' +
        '<h3>The Harrier walks its burst</h3>' +
        '<p>Three rounds down the same line, a sixth of a second apart, and it re-sights between each one. Blocking where the first went is how the third gets you. Hold the arc a fraction ahead of the line and let all three run into it &mdash; caught cleanly that is three returns from one monster, which is the best rate anything out there pays.</p>' +
        '<h3>A Bastion is the best body on the field</h3>' +
        '<p>Three heavy rounds in a fan, from the heaviest frame out there. Heavy rounds shatter when you block them &mdash; three bolts each, five with Sunder I, seven with Sunder II &mdash; so a Bastion met properly is nine to twenty-one returns delivered to your arc by something too slow to get out of their way. Met badly it is nine heavy rounds. There is very little middle ground and the whole difference is whether you commit to the fan or try to dodge around it.</p>' +
        '<h3>A Carillon has to be followed</h3>' +
        '<p>Six rounds walked across the core line one at a time over about a second and a half. A fan can be met in one place; a sequence cannot. Start at the leading edge and sweep with it &mdash; you are tracking, not blocking, and if you get the rhythm the whole volley comes back at once. Sitting still against a Carillon is the single most expensive habit on this station.</p>' +
        '<h3>A Thresher does not stop firing</h3>' +
        '<p>Everything else drawn as a wedge came to arrive. This one came to arrive <em>and</em> shoot, so the arc has to be in two places: on the body, and on what the body is throwing. Take the bolts &mdash; they are free returns, and they are what kills it. The wedge itself dies on the arc the way any rammer does, and it is slow enough that you get to choose the moment.</p>' +
        '<h3>Bosses are not all the same shape any more</h3>' +
        '<p>A boss is drawn from the heaviest handful of bodies on the current roll rather than always the single heaviest, so the archetype changes level to level &mdash; a Warden boss is a ring of eight, a Bastion boss is a wall of heavy rounds, a Carillon boss is a sequence you have to walk with. Read the silhouette on the banner before the fight starts. The hundredth level is the exception: the Sovereign is always built from the heaviest thing on the roll.</p>' +
        '<h3>The Rotor\'s gap moves</h3>' +
        '<p>Five bolts thrown outward, and the wheel turns a fixed amount between volleys, so the safe angle you found last time is not the safe angle now. Do not learn a Rotor; read it. The vanes show you which way it is turning, and the next volley is that far round from the last one.</p>' +
        '<h3>A Shrike comes to you</h3>' +
        '<p>It swings all the way in to the edge of your ring track and back out again on a long slow rhythm. Firing at it on the way out is wasted effort. Hold the arc where it is going to be at the bottom of the dive and it walks into everything you have &mdash; and it is thin enough that it does not take much.</p>' +
        '<h3>Laden is a bribe, and you should take it</h3>' +
        '<p>Four and a half times score and two guaranteed pieces of salvage, on a body that is otherwise completely ordinary. There is no catch. Kill it first, every time. Harvest rig makes every marked body pay out this way, which turns a bad marked level into the best economy you will get.</p>' +
        '<h3>Legion is three of the same question</h3>' +
        '<p>Nothing new about any one of them. The problem is arithmetic: one arc, three bodies, and all three arriving on roughly the same orbit. The pulse is the honest answer here &mdash; it is the only thing you own that does not care how many there are.</p>' +
        '<h3>Freighted is handing you ammunition</h3>' +
        '<p>Heavy rounds on a frame that was never meant to throw them, which means a Lance is now delivering the fat green ones. Blocked, those shatter into three bolts already pointed outward, and with Sunder fitted into five or seven. A Freighted body on a level you are handling well is the single best thing that can happen to your chain.</p>' +
        '<h3>Hollow dies to anything</h3>' +
        '<p>One point of hull whatever its strain &mdash; an Aureate Hollow falls to a single bare return. It also fires twice as often as it should, so the entire question is whether you get to it before it gets through its magazine. It is never worth a pulse. It is always worth the next bolt.</p>' +
        '<h3>Kindled lies about its speed</h3>' +
        '<p>Its rounds leave at two thirds pace and arrive at nearly double. Every instinct you have for timing a bolt is calibrated on the middle of its flight, and the middle of a Kindled flight is not where it lives. Block these early, high on the track, before the acceleration has done its work.</p>' +
        '<h3>Wailing eats your chain</h3>' +
        '<p>Your multiplier decays twice as fast for as long as one is alive. It does almost nothing else, which is exactly why it survives so long &mdash; it never becomes the most urgent thing on the field, and it is quietly costing you the whole level\'s score. Chain keeper offsets it. Killing it fixes it.</p>' +
        '<h3>Shuttered cannot be hurried</h3>' +
        '<p>Its shell closes for about a second and opens for two or three, and the rhythm is not quite regular. Bolts thrown at a shut shell are wasted outright. The tell is unmissable &mdash; a solid bright ring when it is shut, a broken one when it is open &mdash; so this is purely a test of whether you can hold fire, which most operators cannot.</p>' +
        '<h3>Vengeful charges you for the kill</h3>' +
        '<p>It dies into one fast round aimed straight at the core. That round is deflectable like anything else, but only by an arc that is already there, and yours is wherever the killing shot left it. Line the kill up so the arc ends where the answer is coming from, or take the hit knowingly. It is the only mark that punishes you for winning.</p>' +
        '<h3>Waking gives you eight free seconds &mdash; spend them on it</h3>' +
        '<p>It arrives inert and stays inert for eight seconds, and the closing arc of light on its ring is the countdown. What comes out the other end is half again as fast and firing twice as often. Every operator who loses to a Waking body lost during the part where it was doing nothing.</p>' +
        '<h3>Bristling punishes trickling, not shooting</h3>' +
        '<p>Every return that lands on it buys a fresh round aimed at the core. Six chip hits cost you six bolts; one Grindstone crit or a pulse costs you none. Do not stop shooting it &mdash; stop shooting it <em>slowly</em>.</p>' +
        '<h3>Seeding is always the most urgent thing</h3>' +
        '<p>A body every four seconds, forever, and each one thins your salvage and stretches the level. It is never the biggest threat on the field and it is always the one to kill first, which is exactly the reasoning failure it was built to exploit.</p>' +
        '<h3>Knitting is a rate check</h3>' +
        '<p>It repairs a point every 2.5 seconds unless it has been hit in the last 1.5. Sustained fire beats it outright. Turning away for three seconds hands the whole fight back. Sear is the clean answer &mdash; a burning plate counts as recent damage the entire time it burns.</p>' +
        '<h3>Glutting eats the bays, not the core</h3>' +
        '<p>It ignores you and goes for the salvage, and it heals from every piece it takes. Anything you were leaving on the track for later is now on a timer. Latch does not save you from this. Killing it does.</p>' +
        '<h3>Cleaving doubles the decision, not the damage</h3>' +
        '<p>One round on the way in, two as it crosses the orbit, each half perfectly ordinary and perfectly deflectable. The problem is that the split happens where you have least time. Meet these high, before the split, and one block does the work of two.</p>' +
        '<h3>Sapping is not your imagination</h3>' +
        '<p>The arc really is about four degrees short while one is alive. If blocks you would normally make are grazing past, look for the pair of dashes turning against your ring. Poise offsets it exactly, which is the closest thing to a hard counter in the rack.</p>' +
        '<h3>Averse: come in flat and fast</h3>' +
        '<p>Your returns bend away from it in the last stretch, so a lazy arcing shot never arrives. Keen edge and Gyro bearing both help by getting the bolt there before the field has hold of it. Lodestone fights it directly and roughly to a draw.</p>' +
        '<h3>Refracting sends your own work back</h3>' +
        '<p>A return that lands is reversed &mdash; back down exactly the line it went out on, hostile. That line ends where your arc <em>was</em>, and your arc has moved. The trick is to kill it with a shot you can afford to have returned: fire from a position you are about to sweep back through, or let the pulse do it, which it cannot reverse.</p>' +
        '<h3>Quenching taxes the whole rack</h3>' +
        '<p>Every return one point softer, minimum one, for as long as it lives. The bigger your rack the more it costs you, which is why it only shows up past level 50. Fork, Prism and Chorus are unaffected in spirit &mdash; more bolts still means more bolts &mdash; so a volume build shrugs at this and a single-heavy-hit build does not.</p>' +
        '<h3>Verdigris is the turn</h3>' +
        '<p>When the green flecking starts, the swarm has come back round to eating its own oldest dead, and it is the last strain before the dense black plate and the gold. Nothing about the fight changes except that everything takes longer, which is exactly when a Smothering body hurts most.</p>' +
        '<h3>Charge can be farmed</h3>' +
        '<p>The pulse recharges on a timer by default, but Flywheel turns every catch into charge and Recycler turns every twelfth into salvage. With either fitted, the arc stops being purely defensive &mdash; blocking becomes the way you pay for the next pulse, and sitting on a Warden\'s eight-bolt ring becomes a genuinely good idea.</p>' +
        '<h3>What the newer fittings are actually for</h3>' +
        '<p><strong>Momentum</strong> and <strong>Cascade</strong> both read your chain, so they pay a style of play rather than a stat &mdash; if you are already finishing levels unhit they are worth more than another point of Hot return. <strong>Glint</strong> is the opposite: dead weight on a clean level, decisive on a marked one. <strong>Sunder</strong> only ever fires when you block a heavy round, which makes it a bet on meeting Splitters and Mortars, and past level 40 that bet is close to certain.</p>' +
        '<p><strong>Snare field</strong> bites only inside your orbit, so it is a fitting for the things that have already got close &mdash; rammers, Creeping bodies, anything the Crown has driven in. <strong>Gyro bearing</strong> gives you more bend for the same sweep and changes nothing at all if you block standing still. <strong>Scrap charge</strong> and <strong>Conduit</strong> are both pulse economy: one turns salvage into charge, the other turns kills into it, and either one makes a Smothering body considerably less frightening.</p>' +
        '<h3>The heavier end of the rack</h3>' +
        '<p><strong>Poise</strong> only pays while your charge is banked, so it rewards holding the pulse rather than spending it the moment it lights &mdash; the arc narrows again the instant you fire. <strong>Sear</strong> and <strong>Shove</strong> both change what a landed return <em>does</em> rather than how hard it hits: Sear finishes wounded bodies without another bolt, Shove buys you back the distance a Creeping or diving body has taken. <strong>Pinion</strong> is reaction time, bought directly &mdash; hostile fire crawls once it is inside your orbit, which is exactly where you have to make the decision.</p>' +
        '<p>Of the overhauls, <strong>Mantle</strong> and <strong>Quicksilver</strong> are both insurance and stack well with each other: one eats a bolt outright every six seconds, the other buys you two seconds of crawl every time one gets through anyway. <strong>Singularity</strong> makes the pulse enormous by dragging the field into it first. <strong>Vent</strong> is the only thing on this station that kills without you doing anything, and over a long level it adds up to more than it looks. <strong>Avarice</strong> doubles every piece of salvage, which is worth taking early and nearly worthless taken late.</p>' +
        '<h3>The rest of the rack</h3>' +
        '<p>Three fittings change the shape of a run rather than a fight. <strong>Screen</strong> thins marks out at the source &mdash; the only thing you own that changes what arrives instead of what you do about it. <strong>Awl</strong> deletes the Warded plate entirely, which is worth far more than it looks once marks are common. <strong>Tally</strong> raises the chain cap past nine, and pairs with <strong>Paragon</strong>, which stops it ever falling below three.</p>' +
        '<p><strong>Grindstone</strong>, <strong>Whetstone</strong> and <strong>Last stand</strong> are all conditional spikes: every third landed return, the first return after a pulse, and every return while your hull is nearly gone. <strong>Broadhead</strong> quietly fixes the near-misses. <strong>Jammer</strong> slows every gun on the field. <strong>Latch</strong>, <strong>Stipend</strong> and <strong>Dross</strong> are economy &mdash; salvage that waits, salvage handed to you at the top of each level, and salvage that pays the board as well as the ring.</p>' +
        '<p>Among the overhauls, <strong>Undertow</strong> bends hostile fire toward your arc and makes a bad position survivable; <strong>Sentinel</strong> blocks one bolt for you every eight seconds wherever you happen to be looking; <strong>Crucible</strong> turns every twentieth deflect into a heavy return that carries through five bodies; <strong>Wellspring</strong> doubles the drop rate and steers it at your hull. None of them ask anything of you, which is what makes them overhauls.</p>' +
        '<h3>Repairs and checkpoints</h3>' +
        '<p>Your hull is restored to full after every third level, whether or not you were scratched. Progress checkpoints every ten levels, so a bad run at level 47 restarts at 41 rather than at the beginning.</p>' +
        '<h3>What the station keeps</h3>' +
        '<p>Two different things persist, and it is worth knowing which is which.</p>' +
        '<p>The <strong>station record</strong> is permanent: every monster you have logged, every mark you have met, your best score, the furthest level you have reached, and whether this page\'s sealed sibling has been opened. Nothing you do in a run takes any of that away.</p>' +
        '<p>The <strong>saved run</strong> is the run you are in &mdash; level, hull, score and your refit rack. It is written at the top of every level, so closing the tab costs you at most the level you were standing in. Pausing and choosing <em>Save and quit</em> banks the level you are on with your hull and score exactly as they are. Choose <em>Continue</em> on the title to pick it back up.</p>' +
        '<p>A breach clears the saved run. That is deliberate: the save is there so a run can survive a closed tab, not so it can survive a mistake.</p>'],

      ['logs', 'Operator logs',
        '<p>Salvaged from the chair recorder. Everything before cycle 0400 is fragmentary; what is here has been left in the words it was said in.</p>' +
        '<h3>Cycle 0031 &mdash; Ferrow</h3>' +
        '<p>"Third day of shooting at them and third day of nothing. The plate eats everything. Kell put a full charge into a Lance at nine metres and it turned round and looked at us. I am writing this down so that when somebody finally works it out they can see how long we spent being stupid about it."</p>' +
        '<h3>Cycle 0044 &mdash; Ferrow</h3>' +
        '<p>"Kell has worked it out. She stopped shooting. She put the deflector plate up and let one come in and it went back out and it killed the thing that fired it, and she sat there for a long time not saying anything. Their plate is proof against us. It is not proof against them. We do not need a gun. We have never needed a gun. They have been carrying our ammunition to us this entire time."</p>' +
        '<h3>Cycle 0102 &mdash; Kell</h3>' +
        '<p>"Ring is finished. It is a bad ring. It covers a third of an arc and the servos scream and I have asked four times for a wider one. But I held level six on it today and nobody has ever said the word <em>level</em> out here before, so I suppose we are counting now."</p>' +
        '<h3>Cycle 0289 &mdash; Kell</h3>' +
        '<p>"Something new. Same Weaver, same Cobalt shell, and a plate strapped on the outside of it turning like a fan. Everything I sent at the lit side did nothing at all. Everything I sent at the dark side killed it as normal. I do not think that is armour. I think that is a question, and I think the question is <em>does she always aim at the same place</em>, and the honest answer is that until today I did."</p>' +
        '<h3>Cycle 0355 &mdash; Kell</h3>' +
        '<p>"New shape. Fast, thin, comes in closer than anything else bothers to, and it does not fire once &mdash; it fires three, down the same line, quicker than you can re-decide. I blocked the first two and the third went past me because I had put the arc where the first one went. It is walking its fire onto me. It is correcting. I have named it Harrier and I have written this down twice because the first time I wrote <em>it is aiming at me</em> and then had to sit with that for a while."</p>' +
        '<h3>Cycle 0431 &mdash; Vantry</h3>' +
        '<p>"Kell is gone. Level 58, Umbral Warden, ring at full sweep and she took the second volley for the core rather than the first for herself. I have her chair. I have her notes, which are better than her chair. Top of the first page, underlined twice: <em>you are not catching, you are aiming.</em>"</p>' +
        '<h3>Cycle 0396 &mdash; Kell</h3>' +
        '<p>"A wheel. Five ports, throws all five outward at once, and turns a notch between volleys so that the gap is never twice in the same place. I sat there for four cycles trying to learn its pattern before I understood that learning is the wrong verb and the whole thing is a joke at my expense. You do not learn a Rotor. You look at it."</p>' +
        '<h3>Cycle 0463 &mdash; Vantry</h3>' +
        '<p>"Something new and I do not like it. Everything out here argues from a distance. This one comes <em>in</em> &mdash; swings all the way down to the ring track, fires at a range where there is no time to reconsider anything, and pulls back out before I can spend the pulse on it. Kell\'s notes have a word for a body that will not hold station and the word is Crawler, and this is not that, because a Crawler is trying to reach the core and this one is trying to reach <em>me</em>."</p>' +
        '<h3>Cycle 0518 &mdash; Vantry</h3>' +
        '<p>"Two of them today and neither behaved. The first one I could not see &mdash; the whole hull run cold, nothing on the field but a dashed ring turning where a body should have been, and I spent nine seconds hunting for the monster instead of shooting the only part of it they had not managed to hide. The second one I could see perfectly well and ignored, because it was slow and it was far away and it was doing nothing. It was coming in. It had been coming in the entire level. It did not stop, and it does not stop, and I have a dent in the core housing to prove it."</p>' +
        '<h3>Cycle 0602 &mdash; Vantry</h3>' +
        '<p>"They are experimenting on me. I want that on the record because it sounds paranoid and it is not. One in twenty now comes carrying something &mdash; a plate, an overclock, a body packed with charge it never fires. They are not trying to beat the ring with numbers any more. They are trying to find out what the ring does when the rules change, and the only way to find that out is to change one rule at a time and watch. That is not a swarm. That is a method."</p>' +
        '<h3>Cycle 0644 &mdash; Vantry</h3>' +
        '<p>"It is bribing me. I want to be careful about that word so let me put down what happened: a body came in carrying nothing but salvage, no better gun, no plate, and when I killed it the bays got two pieces out of it instead of a maybe. It did that again the next level and the level after. It is not trying to kill me with those. It is finding out whether I will change what I shoot first if the price is right, and the answer, recorded here for whoever has to read it, is that I did, immediately, and I would again."</p>' +
        '<h3>Cycle 0659 &mdash; Vantry</h3>' +
        '<p>"Three of the same body, same mark, same orbit. That is all. It is the least clever thing it has ever done to me and it very nearly worked, because one arc is one arc."</p>' +
        '<p>"And separately: one today that had nothing inside it at all. No plate, no reserve, an Aureate shell you could put down with a single bare return &mdash; and it had fired four times before I got to it. They have started taking things <em>out</em>. I do not know what to do with the fact that removing armour is now an upgrade."</p>' +
        '<h3>Cycle 0671 &mdash; Vantry</h3>' +
        '<p>"It has started writing the same body out twice, on opposite sides of the orbit, and running both. That is not a swarm tactic. A swarm sends more. This sends the <em>same one</em> to two places and makes me choose, and whichever one I choose is the wrong one for as long as it takes me to get back round."</p>' +
        '<p>"And there is one now that does nothing at all except make the pulse take twice as long. It has no gun worth the name. It just sits there and the meter crawls. I killed it on the eleventh minute of a level that should have taken three and I have been thinking since about what it means that the thing out there has worked out we run on a clock."</p>' +
        '<h3>Cycle 0702 &mdash; Vantry</h3>' +
        '<p>"Four in one level, all of them new, and I am writing them down before I lose them. One whose rounds are slow leaving and fast arriving, so that every read I have is wrong at exactly the wrong end. One with a shell that shuts for a second at a time and opens again, which turns out to be a test of whether I can not shoot, and I cannot. One that makes a noise I have no instrument for and my chain falls apart while it is alive. And one that dies into a round already aimed at the core, so that the kill itself is what gets me."</p>' +
        '<p>"Every one of those is aimed at a habit rather than at the station. It is not trying to get through the ring any more. It has been building an argument about the operator for seven hundred cycles and this level is the first time I have been able to read the whole of it at once."</p>' +
        '<h3>Cycle 0715 &mdash; Vantry</h3>' +
        '<p>"A wall today. Six hulls of plate and three heavy rounds in a fan, moving at a speed I could out-walk. I have never been so glad to see anything. Every one of those rounds shatters when you block it. It spent an entire minute handing me ammunition and then died of it."</p>' +
        '<p>"And a bell. Six rounds walked across the line, one at a time, not a fan at all &mdash; a <em>sequence</em>. You cannot meet it in one place. I understood halfway through the second volley that it has been drawn by something that knows the operator can move, and prices it, and I do not think anything before this level had assumed that about me."</p>' +
        '<h3>Cycle 0731 &mdash; Vantry</h3>' +
        '<p>"One that reverses my own bolt straight back down the line it went out on. Not absorbs. Not blocks. <em>Reverses.</em> And of course the line ends where my arc was standing when I fired, and of course my arc has moved, because moving it is the entire job. Seven hundred cycles to find the one thing our whole doctrine is made of and turn it round."</p>' +
        '<p>"I am not writing that down as a complaint. I am writing it down because whoever has this chair after me needs to know that it got there eventually, and that the answer is to kill those with the pulse, which it cannot reverse, and that I only worked that out because it killed me twice first."</p>' +
        '<h3>Cycle 0744 &mdash; Vantry</h3>' +
        '<p>"Ninety-one. Ninety-one and the gold started, and I understood something I would rather not have. The Aureate are not better made. They are more <em>expensive</em>. It is spending the good material on bodies it knows it is going to lose, because at ninety-one it has stopped trying to win the level. It is trying to be sure of the last one. Something down there is being protected and it is not the swarm."</p>' +
        '<h3>Cycle 0745 &mdash; Vantry, final</h3>' +
        '<p>"Ninety-four. Whoever reads this: the crowned ones give the orders. Kill those and the field goes slack, I promise you it does, I just found it out four levels too late to use it. Everything else in these notes you can argue with. Not that one. Chair is yours. It is a good ring now."</p>' +
        '<h3>Cycle 0746 &mdash; unsigned</h3>' +
        '<p class="q">"Took the chair. Read the notes. Starting at one."</p>'],

      ['sovereign', 'The Sovereign',
        WON
        ? ('<p class="q">"It was never commanding them. It was reading them."</p>' +
           '<h3>What was actually under the gold</h3>' +
           '<p>An archive. Smaller than ours, worse kept, and unmistakably the same kind of object &mdash; a single unsorted mass of every pattern the swarm had ever eaten, carried at the centre of the swarm because it could not be copied and could not be left. The Lattice was not a mining operation that outlived its instructions. It was a mining operation that ate something that <em>remembered</em>, and never recovered from it.</p>' +
           '<h3>Why it came here</h3>' +
           '<p>Because it could not read itself. Nine hundred thousand patterns and no catalogue, and no chair, and nothing in the whole swarm capable of deciding which of them mattered. It had been throwing bodies at this station for seven hundred cycles not to break the core but to watch what stood in front of it &mdash; to watch a thing that could look at nine hundred thousand patterns and choose. The marks were not weapons. They were instruments. It was measuring you.</p>' +
           '<h3>The gold</h3>' +
           '<p>Ornament, on a body that had no use for ornament, in the one material the swarm could not eat and could not spend. It had been carrying that plating since long before the first Pale casting. Somebody made it beautiful, once, on purpose, and then that somebody was eaten, and the thing that ate them kept the habit without ever working out why.</p>' +
           '<h3>Standing orders, amended</h3>' +
           '<p>The field is quiet. The archive is intact and still cannot be moved, still cannot be copied, and still cannot defend itself, and there is no reason to believe this station\'s reasoning has changed in any way that matters. Someone should be in the chair. Start at one.</p>')
        : ('<p class="q">"Break it and nothing out there is still moving."</p>' +
           '<p>This page is sealed. Level 100 has not been cleared on this station.</p>' +
           '<p>What is known: the strains stop improvising somewhere past level 90 and begin taking orders. The thing giving them is plated in gold it did not need and cannot use, it is Crowned, and it is the reason every one of the others came. Vantry got to 94 and wrote three sentences about it, none of which are useful.</p>' +
           '<p class="legendline">Clear the hundredth level to unseal.</p>')],
    ];

    const tabs = pages.map((p,i) =>
      '<button class="tab' + (i===0?' on':'') + '" data-tab="' + p[0] + '" type="button">' + p[1] + '</button>').join("");
    const body = pages.map((p,i) =>
      '<div class="page' + (i===0?' on':'') + '" data-page="' + p[0] + '">' + p[2] + '</div>').join("");

    codex.innerHTML =
      '<div class="codex-in"><div class="codex-head"><div class="codex-title">' +
        '<h2>Codex</h2><em>Aegis station standing orders</em>' +
        '<button class="btn ghost close" data-codex="close" type="button">Close</button>' +
      '</div><div class="tabs">' + tabs + '</div></div>' + body + '</div>';
  }

  function openCodex(){ buildCodex(); codex.classList.add("on"); codex.scrollTop = 0; }
  function closeCodex(){ codex.classList.remove("on"); }
  const codexOpen = () => codex.classList.contains("on");

  codex.addEventListener("pointerdown", e => {
    e.stopPropagation();                       // never let a codex click fire the pulse
    if(e.target.closest("[data-codex]")){ closeCodex(); return; }
    const t = e.target.closest("[data-tab]");
    if(!t) return;
    const id = t.dataset.tab;
    codex.querySelectorAll(".tab").forEach(b => b.classList.toggle("on", b === t));
    codex.querySelectorAll(".page").forEach(p => p.classList.toggle("on", p.dataset.page === id));
    codex.scrollTop = 0;
    blip(520,.05,"sine",.25);
  });

  function checkpoint(){ return Math.max(1, Math.floor((bestLevel-1)/10)*10 + 1); }

  function showTitle(){
    mode="title";
    el.best.textContent = nf(best);
    const cp = checkpoint();
    const run = loadRun();
    const held = run ? fitsHeld(run.up) : [];
    card.innerHTML =
      '<h1>Aegis</h1>' +
      '<p class="sub">' + LEVELS + ' levels &middot; ' + BESTIARY.length + ' monsters &middot; ' + MARKS.length + ' marks &middot; ' +
        (UPGRADES.length + MEGAS.length) + ' refits</p>' +
      '<p class="lede">You are the ring, not the gun. Sweep your arc into <em>incoming fire</em> ' +
      'and it comes back <strong>hot and yours</strong> &mdash; a bolt you sent home is the only ' +
      'thing that kills out here.</p>' +
      '<div class="keys"><span><b>Move</b> aim the ring</span>' +
      '<span><b>Click / Space</b> pulse &mdash; kills what it touches</span>' +
      '<span><b>Esc</b> pause</span></div>' +
      (run ? '<p class="record">Saved run &mdash; level ' + String(run.level).padStart(2,"0") +
             ', hull ' + run.hp + '/' + run.maxHp + ', ' + nf(run.score) + ' scored' +
             (held.length ? '<br><span style="color:var(--dim)">' + held.join(" &middot; ") + '</span>'
                          : '<br><span style="color:var(--dim)">empty rack</span>') + '</p>' : '') +
      '<div class="btns">' +
        (run ? '<button class="btn" data-act="continue" type="button">Continue &mdash; level ' +
               String(run.level).padStart(2,"0") + '</button>' : '') +
        '<button class="btn' + (run ? ' ghost' : '') + '" data-lv="1" type="button">' +
          (run ? 'New run &mdash; level 01' : 'Begin &mdash; level 01') + '</button>' +
        (cp > 1 ? '<button class="btn ghost" data-lv="' + cp + '" type="button">Resume &mdash; level ' +
                  String(cp).padStart(2,"0") + '</button>' : '') +
        '<button class="btn ghost" data-act="codex" type="button">Codex</button>' +
      '</div>';
    strip.innerHTML = '<span class="lab">Bestiary</span>' +
      '<span>' + ARCH.length + ' archetypes &times; ' + STRAIN.length + ' strains = ' +
        BESTIARY.length + ' monsters</span>' +
      '<span>' + MARKS.length + ' marks &mdash; from level 12</span>' +
      '<span>Boss every 10th level</span>' +
      '<span class="lab">Station record</span>' +
      '<span>' + SEEN.size + '/' + BESTIARY.length + ' monsters logged</span>' +
      '<span>' + MET.size + '/' + MARKS.length + ' marks met</span>' +
      '<span>Furthest reached: level ' + bestLevel + '</span>';
    veil.classList.add("on");
  }

  function showRefit(){
    const megaTurn = ((G.refits||0) + 1) % 4 === 0;
    let mega = megaTurn;
    let pool = (mega ? MEGAS : UPGRADES).filter(u => lvlOf(u.id) < u.max);
    if(mega && !pool.length){                       // overhauls exhausted: fall back to normal
      mega = false;
      pool = UPGRADES.filter(u => lvlOf(u.id) < u.max);
    }
    if(!pool.length){ nextLevel(); return; }        // everything maxed: skip the interruption
    mode = "refit";

    const offer = [];
    while(offer.length < 3 && pool.length) offer.push(pool.splice((Math.random()*pool.length)|0, 1)[0]);

    let html = '<h1>' + (mega ? 'Overhaul' : 'Refit') + '</h1>' +
               '<p class="sub">Level ' + String(G.level).padStart(2,"0") +
               (mega ? ' cleared &mdash; a heavy fitting' : ' cleared &mdash; choose one') + '</p>' +
               (G.healNote ? '<p class="record">' + G.healNote + '</p>' : '') +
               '<div class="picks' + (mega ? ' mega' : '') + '">';
    G.healNote = "";
    for(const u of offer){
      const at = lvlOf(u.id);
      html += '<button class="pick" data-up="' + u.id + '" type="button">' +
              '<b>' + u.name + '</b>' +
              '<span class="tier">' + (mega ? 'Overhaul' : (at ? ROMAN[at] + ' &rarr; ' + ROMAN[at+1] : 'New fitting')) +
              (at && mega ? ' ' + ROMAN[at+1] : '') + '</span>' +
              '<span class="desc">' + u.desc + '</span></button>';
    }
    card.innerHTML = html + '</div>';
    veil.classList.add("on");
    if(mega){ blip(196,.2,"triangle",.7); blip(294,.26,"triangle",.6); blip(440,.3,"triangle",.4); }
    else    { blip(440,.12,"triangle",.6); blip(660,.16,"triangle",.4); }
  }

  function takeRefit(id){
    G.up[id] = lvlOf(id) + 1;
    G.refits = (G.refits||0) + 1;
    if(id === "hull"){ G.maxHp++; G.hp = Math.min(G.maxHp, G.hp+1); drawHull(); }
    if(id === "bulwark"){ G.maxHp += 3; G.hp = G.maxHp; drawHull(); }
    if(id === "arc" && G.wideT <= 0) G.hw = baseHW();
    blip(523,.14,"triangle",.7,1.6); blip(784,.18,"triangle",.5,1.5);
    veil.classList.remove("on");
    mode = "play";
    nextLevel();
  }

  function showPause(){
    mode="pause";
    card.innerHTML =
      '<h1>Held</h1><p class="sub">Drill suspended</p>' +
      '<div class="tally"><div><i>Score</i><b>' + nf(G.score) + '</b></div>' +
      '<div><i>Level</i><b>' + G.level + '</b></div>' +
      '<div class="hi"><i>Chain</i><b>&times;' + G.combo + '</b></div></div>' +
      '<p class="record" style="color:var(--dim)">Banking now saves level ' +
        String(G.level).padStart(2,"0") + ' with your current hull and rack. ' +
        'A breach clears the save.</p>' +
      '<div class="btns"><button class="btn" data-act="resume" type="button">Resume</button>' +
      '<button class="btn ghost" data-act="savequit" type="button">Save and quit</button>' +
      '<button class="btn ghost" data-act="codex" type="button">Codex</button>' +
      '<button class="btn ghost" data-act="quit" type="button">Abandon run</button></div>';
    veil.classList.add("on");
  }

  function saveScore(){
    if(G.score > best){ best = G.score; try{ localStorage.setItem("aegis.best", String(best)); }catch(e){} }
    el.best.textContent = nf(best);
  }

  function gameOver(){
    mode="over";
    const record = G.score > best;
    saveScore();
    clearRun();                           // a breached run is not a saved run
    noise(.6,1); blip(70,.7,"sawtooth",.9,.2);
    const cp = checkpoint();
    card.innerHTML =
      '<h1>Breached</h1>' +
      '<p class="sub">Core lost on level ' + String(G.level).padStart(2,"0") + ' of ' + LEVELS + '</p>' +
      '<div class="tally"><div class="hi"><i>Score</i><b>' + nf(G.score) + '</b></div>' +
      '<div><i>Deflects</i><b>' + nf(G.deflects) + '</b></div>' +
      '<div><i>Kills</i><b>' + nf(G.kills) + '</b></div>' +
      '<div><i>Marked</i><b>' + nf(G.marked) + '</b></div></div>' +
      (record ? '<p class="record">New personal best</p>'
              : '<p class="record" style="color:var(--dim)">Best ' + nf(best) + '</p>') +
      '<div class="btns">' +
        '<button class="btn" data-lv="' + cp + '" type="button">Retry &mdash; level ' +
          String(cp).padStart(2,"0") + '</button>' +
        '<button class="btn ghost" data-lv="1" type="button">Start over</button>' +
      '</div>';
    veil.classList.add("on");
  }

  function victory(){
    mode="over"; saveScore(); markWon(); clearRun();
    blip(392,.5,"triangle",.8); blip(523,.6,"triangle",.6); blip(659,.8,"triangle",.5);
    card.innerHTML =
      '<h1>Held</h1><p class="sub">All 100 levels cleared</p>' +
      '<p class="lede">The Aureate Sovereign is scrap and the core never broke. ' +
      'Nothing out there is still moving.</p>' +
      '<div class="tally"><div class="hi"><i>Score</i><b>' + nf(G.score) + '</b></div>' +
      '<div><i>Deflects</i><b>' + nf(G.deflects) + '</b></div>' +
      '<div><i>Kills</i><b>' + nf(G.kills) + '</b></div>' +
      '<div><i>Marked</i><b>' + nf(G.marked) + '</b></div></div>' +
      '<div class="btns"><button class="btn" data-lv="1" type="button">Run it again</button></div>';
    veil.classList.add("on");
  }

  function begin(lv){
    audioBoot(); newGame(lv);
    el.score.textContent="0"; el.combo.innerHTML="&times;1";
    drawHull(); drawPulseMeter();
    mode="play"; veil.classList.remove("on");
    nextLevel();
  }
  function resume(){ mode="play"; veil.classList.remove("on"); }

  // pick a saved run back up: newGame() first, then overwrite everything the
  // save owns, because nextLevel() reads baseHW() and lvlOf() to build the level
  function continueRun(){
    const r = loadRun();
    if(!r){ showTitle(); return; }
    audioBoot(); newGame(r.level);
    G.maxHp = r.maxHp; G.hp = r.hp; G.score = r.score; G.up = r.up;
    G.refits = r.refits; G.kills = r.kills; G.deflects = r.deflects;
    G.marked = r.marked; G.saved = r.saved;
    G.hw = baseHW();
    el.score.textContent = nf(G.score); el.combo.innerHTML = "&times;1";
    drawHull(); drawPulseMeter();
    mode="play"; veil.classList.remove("on");
    nextLevel();
  }

  // banking mid-level is generous by one level: you restart the level you were
  // standing in, with the hull and score you were standing in it with
  function saveAndQuit(){
    saveRun();
    showTitle();
  }

  /* ── input ── */
  function aimAt(clientX, clientY){
    const r = cv.getBoundingClientRect();
    aim = Math.atan2(clientY-r.top-cy, clientX-r.left-cx);
  }
  cv.addEventListener("pointermove", e => aimAt(e.clientX,e.clientY));

  card.addEventListener("pointerdown", e => {
    const b = e.target.closest("button");
    if(!b) return;
    e.stopPropagation(); audioBoot();
    if(b.dataset.up) takeRefit(b.dataset.up);
    else if(b.dataset.lv) begin(parseInt(b.dataset.lv,10));
    else if(b.dataset.act === "continue") continueRun();
    else if(b.dataset.act === "resume") resume();
    else if(b.dataset.act === "savequit") saveAndQuit();
    else if(b.dataset.act === "codex") openCodex();
    else if(b.dataset.act === "quit"){ clearRun(); showTitle(); }
  });

  addEventListener("pointerdown", e => {
    if(e.target.closest("button")) return;
    audioBoot();
    if(mode==="play") doPulse();
    else if(mode==="pause") resume();
  });

  addEventListener("keydown", e => {
    if(e.code==="Space"||e.code==="Enter"){
      e.preventDefault();
      if(codexOpen()) return;                  // reading, not playing
      if(mode==="title"||mode==="over") begin(1);
      else if(mode==="pause") resume();
      else if(mode==="play") doPulse();   // refit screen ignores space; you must pick
    }
    if(e.code==="Escape"){
      e.preventDefault();
      if(codexOpen()) closeCodex();            // codex closes first
      else if(mode==="play") showPause();
      else if(mode==="pause") resume();
    }
  });
  addEventListener("blur", () => { if(mode==="play") showPause(); });

  /* ── loop ── */
  let last = performance.now();
  function frame(now){
    const dt = Math.min((now-last)/1000, 1/25); last = now;
    aimVel = angDiff(aim,aimPrev)/Math.max(dt,1/240); aimPrev = aim;
    shake *= Math.pow(0.0016, dt);
    flash = Math.max(0, flash-dt*2.6);
    if(mode==="play"){
      const gs = gameSpeed();
      if(hitstop>0) hitstop -= dt*gs;
      else {
        // substep: a 3x frame is three normal steps, never one huge one, so
        // nothing tunnels through the arc and 3x plays exactly like 1x in a hurry
        let t = dt * gs * (G.slowT>0 ? 0.42 : 1);
        while(t > 0 && mode === "play"){      // update() can end the level or the run
          const s = Math.min(t, 1/50);
          update(s); t -= s;
        }
      }
      drawPulseMeter();
    }
    render();
    requestAnimationFrame(frame);
  }

  resize(); drawHull(); showTitle();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
