<script>
"use strict";
// ============================================================================
//  BEETLEBOUND - momentum racing across a forest floor, outrunning the rain
//  Single file. Canvas 2D. No dependencies.
// ============================================================================

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W = 960, H = 540, DPR = 1;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.max(320, (window.innerWidth  || 960));
  H = Math.max(240, (window.innerHeight || 540));
  canvas.width  = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  if (canvas.style) { canvas.style.width = W + 'px'; canvas.style.height = H + 'px'; }
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resize);

// ---------------------------------------------------------------- utilities
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const lerp  = (a,b,t) => a + (b-a)*t;
const smooth= t => t*t*(3-2*t);

function hash1(i, seed){
  let n = Math.imul((i|0) ^ (seed|0), 2246822519);
  n ^= n >>> 13; n = Math.imul(n, 3266489917); n ^= n >>> 16;
  return (n >>> 0) / 4294967295;
}
function noise1(x, freq, seed){
  const p = x / freq, i = Math.floor(p), t = smooth(p - i);
  return lerp(hash1(i, seed), hash1(i+1, seed), t);
}
function fmt(n){ return n.toLocaleString('en-US'); }

// ------------------------------------------------------------------- biomes
const BIOMES = [
  { at:0,    name:'Leaf Litter',   sky:'#2b3320', sky2:'#4a5730', gnd:'#3a2f1c', gnd2:'#5a4626', acc:'#8a6b2f', amp:1.00, dens:1.00 },
  { at:420,  name:'Moss Hollow',   sky:'#1d2e24', sky2:'#37543c', gnd:'#22331f', gnd2:'#3d5c33', acc:'#7fae52', amp:1.15, dens:1.05 },
  { at:950,  name:'Mushroom Grove',sky:'#2a2033', sky2:'#4d3a5c', gnd:'#332338', gnd2:'#553a5c', acc:'#c86f9a', amp:1.30, dens:1.15 },
  { at:1600, name:'Pine Slope',    sky:'#16242b', sky2:'#2c4650', gnd:'#1e2a26', gnd2:'#35473c', acc:'#6fa39a', amp:1.55, dens:1.10 },
  { at:2400, name:'Flooded Roots', sky:'#101c26', sky2:'#243c4e', gnd:'#182129', gnd2:'#2b3b45', acc:'#4f8fb0', amp:1.70, dens:1.25 },
  { at:3400, name:'The Deep Wood', sky:'#0b0f14', sky2:'#1a2430', gnd:'#10161a', gnd2:'#1f2b30', acc:'#9c6bd4', amp:1.95, dens:1.35 },
];
function biomeAt(m){
  let b = BIOMES[0];
  for (const x of BIOMES) if (m >= x.at) b = x;
  return b;
}
function biomeBlend(m){
  // returns { ...interpolated colors, name of current }
  let i = 0;
  for (let k=0;k<BIOMES.length;k++) if (m >= BIOMES[k].at) i = k;
  const a = BIOMES[i], b = BIOMES[Math.min(i+1, BIOMES.length-1)];
  const span = Math.max(1, b.at - a.at);
  const t = b === a ? 0 : clamp((m - a.at) / span, 0, 1);
  const e = clamp((t - 0.72) / 0.28, 0, 1); // only blend near the border
  return {
    name: a.name, next: b.name, t: e,
    sky: mixHex(a.sky,b.sky,e), sky2: mixHex(a.sky2,b.sky2,e),
    gnd: mixHex(a.gnd,b.gnd,e), gnd2: mixHex(a.gnd2,b.gnd2,e),
    acc: mixHex(a.acc,b.acc,e),
    amp: lerp(a.amp,b.amp,e), dens: lerp(a.dens,b.dens,e),
  };
}
function hex2rgb(h){ const n = parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255]; }
function mixHex(a,b,t){
  if (t <= 0) return a; if (t >= 1) return b;
  const A = hex2rgb(a), B = hex2rgb(b);
  const r = Math.round(lerp(A[0],B[0],t)), g = Math.round(lerp(A[1],B[1],t)), bl = Math.round(lerp(A[2],B[2],t));
  return 'rgb('+r+','+g+','+bl+')';
}

// ------------------------------------------------------------------ terrain
const M_PER_PX = 1/50;      // 50 world px == 1 metre
const PX_PER_M = 50;

function terrainAmp(x){ return biomeBlend(x * M_PER_PX).amp; }

function groundY(x){
  const seed = state.seed;
  const amp = terrainAmp(x);
  let y = 220;
  y += (noise1(x, 1500, seed)      - 0.5) * 720 * amp;
  y += (noise1(x,  560, seed+11)   - 0.5) * 300 * amp;
  y += (noise1(x,  210, seed+29)   - 0.5) *  90 * amp;
  y += (noise1(x,   62, seed+53)   - 0.5) *  16;
  return y;
}
function groundSlope(x){ return (groundY(x+3) - groundY(x-3)) / 6; }

// --------------------------------------------------------------- item cells
const CELL = 96;
const ITEM = { NONE:0, DEW:1, NECTAR:2, SAP:3, ROOT:4, SHROOM:5, ROCKET:6, SLOWMO:7 };

function cellItem(i){
  const m = (i*CELL) * M_PER_PX;
  if (m < 6) return ITEM.NONE;                  // safe launch strip
  const dens = biomeBlend(m).dens;
  const r = hash1(i, state.seed + 991);
  const q = hash1(i, state.seed + 4127);
  if (r < 0.022) return ITEM.ROCKET;                          // rare, loud, run-defining
  if (r < 0.040) return ITEM.SLOWMO;
  if (r < 0.32) return ITEM.DEW;
  if (r < 0.375) return ITEM.NECTAR;
  if (r < 0.435) return q > 0.32 ? ITEM.SHROOM : ITEM.NONE;   // fixed band: shrooms never crowd out
  if (r < 0.435 + 0.085*dens) return ITEM.SAP;
  if (r < 0.52  + 0.095*dens) return ITEM.ROOT;
  return ITEM.NONE;
}
function cellX(i){ return i*CELL + 20 + hash1(i, state.seed+77) * (CELL-40); }
function cellY(i, type){
  const gx = groundY(cellX(i));
  if (type === ITEM.DEW)    return gx + 46 + hash1(i, state.seed+303) * 150;
  if (type === ITEM.NECTAR) return gx + 60 + hash1(i, state.seed+404) * 120;
  if (type === ITEM.ROCKET || type === ITEM.SLOWMO) return gx + 70 + hash1(i, state.seed+505) * 110;
  return gx; // ground-anchored
}

// ------------------------------------------------------------------ upgrades
const UPGRADES = [
  { key:'wax',    name:'Waxed Shell',    desc:'Tree sap drags at you less.',           max:5, base:45 },
  { key:'legs',   name:'Hind Legs',      desc:'Stronger buzz burst and shroom bounce.',max:5, base:60 },
  { key:'elytra', name:'Elytra',         desc:'Spread wings glide flatter and longer.',max:5, base:55 },

  { key:'burrow', name:'Burrow Start',   desc:'Begin the run further ahead of the rain.',max:5, base:70 },
  { key:'chitin', name:'Hardened Chitin',desc:'Roots and stones cost you less speed.', max:5, base:50 },
  { key:'sac',    name:'Nectar Sac',     desc:'Hold more buzz charge.',                max:5, base:65 },

function upCost(u, lvl){ return Math.round(u.base * Math.pow(1.75, lvl)); }
function lvl(key){ return save.up[key] || 0; }

// -------------------------------------------------------------------- trials
const TRIALS = [
  { id:'d200',  name:'Out of the Litter',   desc:'Travel 200 m in one run.',            reward:30,  test:r=>r.dist>=200 },
  { id:'d450',  name:'Into the Moss',       desc:'Reach Moss Hollow (420 m).',          reward:45,  test:r=>r.dist>=420 },
  { id:'d950',  name:'Under the Caps',      desc:'Reach Mushroom Grove (950 m).',       reward:70,  test:r=>r.dist>=950 },
  { id:'d1600', name:'Needle Ground',       desc:'Reach Pine Slope (1600 m).',          reward:110, test:r=>r.dist>=1600 },
  { id:'d2400', name:'Wading',              desc:'Reach Flooded Roots (2400 m).',       reward:160, test:r=>r.dist>=2400 },

  { id:'dew90', name:'Waterlogged',         desc:'Collect 90 dew in one run.',          reward:80,  test:r=>r.dew>=90 },
  { id:'dew160',name:'Reservoir',           desc:'Collect 160 dew in one run.',         reward:150, test:r=>r.dew>=160 },
  { id:'air3',  name:'Brief Flight',        desc:'Stay airborne 1.5 s in one hop.',     reward:35,  test:r=>r.bestAir>=1.5 },
  { id:'air5',  name:'Long Glide',          desc:'Stay airborne 5 s in one hop.',       reward:80,  test:r=>r.bestAir>=5 },
  { id:'air7',  name:'Riding the Draft',    desc:'Stay airborne 7 s in one hop.',       reward:150, test:r=>r.bestAir>=7 },
  { id:'sp700', name:'Scuttling',           desc:'Hit 700 speed.',                      reward:30,  test:r=>r.topSpeed>=700 },
  { id:'sp1000',name:'Hurtling',            desc:'Hit 1000 speed.',                     reward:75,  test:r=>r.topSpeed>=1000 },

  { id:'noroot',name:'Untouched',           desc:'Pass 500 m without striking a root.', reward:90,  test:r=>r.dist>=500 && r.hits===0 },
  { id:'nosap', name:'Dry Shell',           desc:'Pass 700 m without touching sap.',    reward:100, test:r=>r.dist>=700 && r.sapHits===0 },

  { id:'rock3', name:'Serial Offender',      desc:'Grab 3 rockets in one run.',          reward:120, test:r=>r.rockets>=3 },

  { id:'chain', name:'On a Roll',            desc:'Build a 12 chain.',                   reward:60,  test:r=>r.bestCombo>=12 },
  { id:'chain2',name:'Unbroken',             desc:'Build a 30 chain.',                   reward:140, test:r=>r.bestCombo>=30 },
  { id:'close', name:'Close Thing',         desc:'Survive with the rain inside 120 px.',reward:120, test:r=>r.closest<=120 && r.dist>=300 },

// ------------------------------------------------------------------ persist
const SAVE_KEY = 'beetlebound.save.v1';
const defaultSave = () => ({ dew:0, best:0, runs:0, totalDew:0, up:{}, trials:{}, seen:false });
let save = defaultSave();

function loadSave(){
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw){ const o = JSON.parse(raw); if (o && typeof o === 'object'){ save = Object.assign(defaultSave(), o); save.up = save.up||{}; save.trials = save.trials||{}; } }
  } catch(e){ /* private mode, no save */ }
}
function writeSave(){
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch(e){}
}

// -------------------------------------------------------------------- state
const state = {
  mode: 'title',            // title | run | dead | shop | trials
  seed: 1337,
  t: 0,
  beetle: null,
  cam: { x:0, y:0 },
  rainX: 0, rainSpeed: 0,
  rocket: 0, slowmo: 0, combo: 0, comboTimer: 0, banner: null, prevLead: null,
  particles: [], floats: [], drops: [],
  taken: null,              // Set of consumed cell ids
  run: null,
  shake: 0,
  flash: 0,
  shopSel: 0,
  earned: [],               // trials completed this run
  bgSeedOffset: 0,
};

function newRun(){
  state.seed = (Math.random() * 0x7fffffff) | 0;
  const head = 1500 + lvl('burrow') * 300;
  const b = {
    x: 140, y: 0, vx: 300, vy: 0, air:false,
    rot: 0, spin: 0, charge: 40, legPhase: 0, stumble: 0, sap: 0, glow: 0,
  };
  b.y = groundY(b.x);
  b.airHops = 1 + Math.floor(lvl('legs') / 2);
  state.beetle = b;
  state.rocket = 0; state.slowmo = 0;
  state.combo = 0; state.comboTimer = 0; state.banner = null;
  state.cam.x = b.x - W*0.32;
  state.cam.y = b.y;
  state.rainX = b.x - head;
  state.rainSpeed = 320;
  state.prevLead = head;
  state.particles.length = 0;
  state.floats.length = 0;
  state.drops.length = 0;
  state.taken = new Set();
  state.shake = 0; state.flash = 0;
  state.earned = [];
  state.run = {
    dist:0, dew:0, time:0, bestAir:0, airT:0, topSpeed:0, shrooms:0,
    perfect:0, bursts:0, hits:0, sapHits:0, bestLead:0, closest:99999,
    rockets:0, slowmos:0, bestCombo:0,
  };
  state.mode = 'run';
  save.seen = true;
}

function maxCharge(){ return 100 + lvl('sac') * 26; }

// -------------------------------------------------------------------- input
// One button. Tap = jump (instant, always). Hold = keep the wings out and float.
const input = { hold:false, jumpEdge:false, burst:false, burstEdge:false };
const keys = Object.create(null);

function keyDown(e){
  const k = e.key;
  if (keys[k]) { if (k===' ') e.preventDefault(); return; }
  keys[k] = true;
  const low = (k||'').toLowerCase();

  if (k === ' ' || low === 'w' || k === 'ArrowDown' || k === 'ArrowUp'){ e.preventDefault(); }

  if (state.mode === 'title'){
    if (k === ' ' || k === 'Enter') newRun();
    else if (low === 's') { state.mode = 'shop'; state.shopSel = 0; }
    else if (low === 't') state.mode = 'trials';
    return;
  }
  if (state.mode === 'dead'){
    if (k === ' ' || k === 'Enter') newRun();
    else if (low === 's') { state.mode = 'shop'; state.shopSel = 0; }
    else if (low === 't') state.mode = 'trials';
    else if (k === 'Escape') state.mode = 'title';
    return;
  }
  if (state.mode === 'shop'){
    if (k === 'Escape' || low === 's') { state.mode = 'title'; writeSave(); return; }
    if (k === 'ArrowUp')   state.shopSel = (state.shopSel + UPGRADES.length - 1) % UPGRADES.length;
    if (k === 'ArrowDown') state.shopSel = (state.shopSel + 1) % UPGRADES.length;
    if (k === 'Enter' || k === ' ') buy(state.shopSel);
    const n = parseInt(k, 10);
    if (n >= 1 && n <= UPGRADES.length) { state.shopSel = n-1; buy(n-1); }
    return;
  }
  if (state.mode === 'trials'){
    if (k === 'Escape' || low === 't' || k === 'Enter') state.mode = 'title';
    return;
  }
  // running
  if (k === ' ' || low === 'w' || k === 'ArrowUp'){ input.hold = true; input.jumpEdge = true; }
  if (k === 'Escape') endRun();
}
function keyUp(e){
  const k = e.key; keys[k] = false;
  const low = (k||'').toLowerCase();
  if (k === ' ' || low === 'w' || k === 'ArrowUp') input.hold = false;
}
window.addEventListener('keydown', keyDown);
window.addEventListener('keyup', keyUp);

function pointerDown(e){
  if (e.preventDefault) e.preventDefault();
  if (state.mode === 'title' || state.mode === 'dead'){ newRun(); return; }
  if (state.mode === 'shop' || state.mode === 'trials'){ state.mode = 'title'; writeSave(); return; }
  input.hold = true; input.jumpEdge = true;
}
function pointerUp(){ input.hold = false; }
canvas.addEventListener('pointerdown', pointerDown);
window.addEventListener('pointerup', pointerUp);
canvas.addEventListener('contextmenu', e => e.preventDefault());

function buy(i){
  const u = UPGRADES[i]; const l = lvl(u.key);
  if (l >= u.max) return false;
  const c = upCost(u, l);
  if (save.dew < c) return false;
  save.dew -= c;
  save.up[u.key] = l + 1;
  writeSave();
  return true;
}

// ------------------------------------------------------------------ effects
function puff(x, y, n, col, spd, life){
  for (let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, s = Math.random()*(spd||140);
    state.particles.push({ x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s + 40, r:2+Math.random()*4,
                           life:(life||0.6)*(0.6+Math.random()*0.7), max:(life||0.6), col:col||'#cfe6a0' });
  }
}
function float(x, y, text, col){ state.floats.push({ x, y, text, col:col||'#e8f0c8', life:1.1 }); }

// a full-screen announcement — this is what "big moment" means
function bigMoment(text, col){ state.banner = { text, col:col||'#ffd98a', life:1.6 }; }

function comboMult(){ return 1 + Math.floor(state.combo / 6); }
function bumpCombo(){
  state.combo++;
  state.comboTimer = 2.4;
  const m = comboMult();
  if (state.combo > 0 && state.combo % 6 === 0){
    bigMoment('x' + m + '  CHAIN', '#ffe9a0');
    state.shake = Math.max(state.shake, 5);
  }
  if (state.combo > state.run.bestCombo) state.run.bestCombo = state.combo;
}

// ------------------------------------------------------------------ physics
function stepRun(dt){
  const b = state.beetle, r = state.run;
  r.time += dt;

  const wasAir = b.air;
  const hold = input.hold;
  const glideL = lvl('elytra');
  const rocket = state.rocket > 0;

  // ---- THE JUMP. Instant, unconditional, every single press. This is the game.
  if (input.jumpEdge && b.stumble <= 0){
    if (!b.air){
      b.vy = 900 + lvl('legs') * 75;
      b.air = true;
      puff(b.x, b.y, 10, '#cfe6a0', 190, 0.45);
      state.shake = Math.max(state.shake, 3);
    } else if (b.airHops > 0){
      b.airHops--;
      b.vy = Math.max(b.vy, 0) + 620 + lvl('legs') * 55;
      b.vx *= 1.05;
      b.glow = 0.8;
      puff(b.x, b.y - 6, 12, '#bfe8ff', 210, 0.45);
      float(b.x, b.y + 40, 'buzz!', '#bfe8ff');
      state.shake = Math.max(state.shake, 4);
    }
  }
  input.jumpEdge = false;

  // ---- buzz burst. Fires itself the moment it is full, so the game is one button.
  // Shift still triggers it early for anyone who wants the control.
  if (b.charge >= maxCharge() - 0.01 && b.stumble <= 0) input.burstEdge = true;
  if (input.burstEdge && b.charge >= 32 && b.stumble <= 0){
    const ang = b.air ? Math.atan2(b.vy, Math.max(60,b.vx)) : Math.atan2(groundSlope(b.x), 1);
    const power = 300 + lvl('legs') * 62;
    b.vx += Math.cos(ang) * power;
    b.vy += Math.sin(ang) * power + 150;
    b.charge -= 32;
    b.glow = 1;
    r.bursts++;
    puff(b.x, b.y, 16, '#ffd98a', 260, 0.5);
    state.shake = Math.max(state.shake, 5);
  }
  input.burstEdge = false;

  // ---- gravity
  // Holding = wings out = float. Letting go = wings in = drop like a stone.
  let grav;
  if (b.air) grav = hold ? (1500 - 100 * glideL) : 3000;
  else       grav = 2600;
  b.vy -= grav * dt;

  // Lift is hard-capped well below glide gravity, so a glide always decays.
  // The real reward for flying is THRUST: airborne with the wings out is the
  // fastest the beetle ever moves, which is what makes jumping worth doing.
  if (b.air && hold){
    const lift = Math.min(250 + glideL*40, Math.hypot(b.vx, b.vy) * (0.20 + glideL*0.025));
    b.vy += lift * dt;
    b.vx += (500 + glideL*60) * dt;
  }

  b.px = b.x; b.py = b.y;          // previous position, for swept pickup tests
  b.x += b.vx * dt;
  b.y += b.vy * dt;

  const g = groundY(b.x);
  if (b.y <= g){
    const slope = groundSlope(b.x);
    const ang = Math.atan2(slope, 1);
    const tx = Math.cos(ang), ty = Math.sin(ang);
    const vt = b.vx*tx + b.vy*ty;

    if (wasAir){
      const vlen = Math.hypot(b.vx, b.vy);
      const align = vlen > 20 ? clamp(vt / vlen, 0, 1) : 1;
      let keep = 0.78 + 0.30 * align * align;
      if (!hold) keep = Math.min(1.10, keep + 0.12 * align);   // wings in = a committed landing
      if (rocket) keep = Math.max(keep, 1);
      const nv = Math.max(vt, 0) * keep;
      b.airHops = 1 + Math.floor(lvl('legs') / 2);             // hops refill on the ground
      b.vx = tx * nv; b.vy = ty * nv;
      if (align > 0.965 && vlen > 260){
        r.perfect++;
        b.charge = Math.min(maxCharge(), b.charge + 13);
        float(b.x, b.y + 40, 'clean', '#ffe9a0');
        puff(b.x, b.y, 9, '#ffe9a0', 150, 0.45);
      } else {
        puff(b.x, b.y, 6, '#8a7a52', 110, 0.4);
      }
      if (r.airT > r.bestAir) r.bestAir = r.airT;
      state.shake = Math.max(state.shake, clamp(vlen/300, 0, 6) * (1-align));
      r.airT = 0;
    } else {
      b.vx = tx * vt; b.vy = ty * vt;
    }
    b.y = g;
    b.air = false;
  } else {
    b.air = true;
    r.airT += dt;
  }

  // ---- ground handling
  if (!b.air){
    const ang = Math.atan2(groundSlope(b.x), 1);
    const speed = Math.hypot(b.vx, b.vy);
    // six legs drive the beetle to a cruise; tucking lets it run much harder
    const cruise = (rocket ? 1650 : 520) * (b.sap > 0 && !rocket ? 0.5 : 1);
    let push = 0;
    // claws: most of the climb is paid for, so an uphill costs pace, not the run
    if (b.stumble <= 0){
      const up = Math.sin(ang);
      if (up > 0) push += 2600 * up * 0.90;
      if (speed < cruise) push += rocket ? 2600 : 1150;
    }
    if (push > 0){ b.vx += Math.cos(ang) * push * dt; b.vy += Math.sin(ang) * push * dt; }
    let drag = rocket ? 0 : 0.42;
    if (b.sap > 0 && !rocket) drag += 1.9 * (1 - lvl('wax') * 0.15);
    if (b.stumble > 0) drag += 2.4;
    const f = Math.max(0, 1 - drag*dt);
    b.vx *= f; b.vy *= f;
    b.legPhase += speed * dt * 0.035;
    if (speed > 420 && Math.random() < speed*dt*0.004)
      puff(b.x - 8, b.y + 4, 1, '#7a6a44', 60, 0.5);
  } else {
    b.vx *= Math.max(0, 1 - (hold ? 0.05 : 0.30) * dt);
  }

  // clamps
  const sp = Math.hypot(b.vx, b.vy);
  const CAP = rocket ? 2100 : 1900;
  if (sp > CAP){ b.vx *= CAP/sp; b.vy *= CAP/sp; }
  if (b.vx < 30 && b.stumble <= 0) b.vx = 30;

  b.sap = Math.max(0, b.sap - dt);
  b.stumble = Math.max(0, b.stumble - dt);
  b.glow = Math.max(0, b.glow - dt*2);
  b.charge = Math.min(maxCharge(), b.charge + dt * 5.5);

  // rotation follows slope on ground, velocity in air
  const target = b.air ? Math.atan2(b.vy, Math.max(90, b.vx)) * 0.8 : Math.atan2(groundSlope(b.x), 1);
  b.rot += (target - b.rot) * Math.min(1, dt * (b.air ? 6 : 16));

  // ---- items
  collideItems(dt);

  // final clamp: shroom bounces and burst stack on top of everything above
  const sp2 = Math.hypot(b.vx, b.vy);
  if (sp2 > CAP){ b.vx *= CAP/sp2; b.vy *= CAP/sp2; }

  // ---- rain
  const m = b.x * M_PER_PX;
  // The storm's own pace, ramping with how far you have come.
  const stormTarget = 320 + Math.min(600, m * 0.16) + Math.min(100, r.time * 0.7);
  // ...but it may never close on you faster than CLOSE_RATE. Without this the rain
  // falls off-screen while you fly, then crosses the whole screen in a second the
  // moment you land — which reads as the rain teleporting on top of you.
  // Must be measured against FORWARD progress (vx), not total speed: climbing
  // steeply has a big |v| but a small vx, and the gap is purely horizontal.
  const CLOSE_RATE = 240;
  state.rainSpeed = Math.min(stormTarget, Math.max(260, b.vx + CLOSE_RATE));

  // Hard invariant on the GAP, not on the speed: however violently the beetle
  // decelerates, the rain may never eat more than CLOSE_RATE px/s of your lead.
  // Speed-side clamping alone still spiked to 889 px/s when vx collapsed on a
  // bad landing, which is what read as the rain teleporting onto you.
  let nextX = state.rainX + state.rainSpeed * dt;
  const leadNext = b.x - nextX;
  if (state.prevLead !== null && (state.prevLead - leadNext) > CLOSE_RATE * dt){
    nextX = b.x - (state.prevLead - CLOSE_RATE * dt);
  }
  state.rainX = Math.max(state.rainX, nextX);   // the storm never retreats
  state.prevLead = b.x - state.rainX;
  const lead = b.x - state.rainX;
  if (lead > r.bestLead) r.bestLead = lead;
  if (lead < r.closest) r.closest = lead;
  if (lead <= 0){ drown(); return; }

  // ---- stats
  r.dist = Math.max(r.dist, Math.floor(m));
  r.topSpeed = Math.max(r.topSpeed, Math.round(Math.hypot(b.vx, b.vy)));

  // ---- camera
  // smooth pull-back with speed — a hard threshold here jolted the whole world sideways
  const pull = lerp(0.32, 0.24, clamp((Math.hypot(b.vx,b.vy) - 500) / 900, 0, 1));
  const camTX = b.x - W * pull;
  state.cam.x += (camTX - state.cam.x) * Math.min(1, dt*9);
  state.cam.y += (b.y - state.cam.y) * Math.min(1, dt*(b.air?2.4:5));
}

// shortest distance from point (px,py) to the segment (ax,ay)->(bx,by)
function segDist(px, py, ax, ay, bx, by){
  const dx = bx-ax, dy = by-ay;
  const len2 = dx*dx + dy*dy;
  const t = len2 > 0.0001 ? clamp(((px-ax)*dx + (py-ay)*dy) / len2, 0, 1) : 0;
  return Math.hypot(px - (ax + dx*t), py - (ay + dy*t));
}

function collideItems(dt){
  const b = state.beetle, r = state.run;
  const i0 = Math.floor((Math.min(b.x, b.px) - 380) / CELL), i1 = Math.floor((b.x + 380) / CELL);
  const magnet = 44 + lvl('ant') * 32;

  for (let i = i0; i <= i1; i++){
    if (state.taken.has(i)) continue;
    const type = cellItem(i);
    if (type === ITEM.NONE) continue;
    const ix = cellX(i), iy = cellY(i, type);

    if (type === ITEM.ROCKET || type === ITEM.SLOWMO){
      const ds2 = segDist(ix, iy, b.px, b.py, b.x, b.y);
      if (ds2 < 46 + magnet*0.75){
        state.taken.add(i);
        if (type === ITEM.ROCKET){
          state.rocket = 3.4;
          b.vx = Math.max(b.vx, 1500);
          b.airHops = 3;
          r.rockets++;
          bigMoment('ROCKET BEETLE', '#ff9a4a');
          puff(ix, iy, 30, '#ff9a4a', 340, 0.8);
          state.shake = 12; state.flash = 0.5;
        } else {
          state.slowmo = 3.0;
          r.slowmos++;
          bigMoment('SLOW', '#9fd8ff');
          puff(ix, iy, 26, '#9fd8ff', 260, 0.9);
          state.flash = 0.35;
        }
      }
      continue;
    }

    if (type === ITEM.DEW || type === ITEM.NECTAR){
      const rad = type === ITEM.NECTAR ? 30 : 24;
      const d = Math.hypot(ix - b.x, iy - b.y);
      // swept test: at full pace the beetle covers more ground per frame than a dew drop is wide
      const ds = segDist(ix, iy, b.px, b.py, b.x, b.y);
      // the antennae are the collection radius, not a decoration
      const collectR = rad + 20 + magnet * 0.75;
      if (d < collectR + 60){
        if (ds < collectR){
          state.taken.add(i);
          bumpCombo();
          const mult = comboMult();
          if (type === ITEM.DEW){
            const got = 1 * mult;
            r.dew += got; save.dew += got; save.totalDew += got;
            if (mult > 1) float(ix, iy+16, 'x' + mult, '#ffe9a0');
            puff(ix, iy, 5, '#9fd8ff', 110, 0.4);
          } else {
            const got = 4 * mult;
            r.dew += got; save.dew += got; save.totalDew += got;
            b.charge = Math.min(maxCharge(), b.charge + 40);
            float(ix, iy+22, '+' + got, '#ffcf6a');
            puff(ix, iy, 12, '#ffcf6a', 170, 0.55);
          }
        } else {
          // magnet drift is visual only; snap the item toward the beetle
          state.drops.push({ x:ix, y:iy, tx:b.x, ty:b.y, life:0.16, col: type===ITEM.NECTAR?'#ffcf6a':'#9fd8ff' });
        }
      }
      continue;
    }

    // ground hazards / props: only matter when near the floor
    const near = segDist(ix, iy + 6, b.px, b.py, b.x, b.y) < 34 && (b.y - iy) < 44 && (b.y - iy) > -34;
    if (!near) continue;

    if (type === ITEM.SAP){
      if (b.sap <= 0){ r.sapHits++; float(b.x, b.y+40, 'sap', '#d8a13a'); }
      b.sap = 0.34;
      puff(b.x, b.y, 3, '#d8a13a', 60, 0.4);
    } else if (type === ITEM.ROOT){
      const sp = Math.hypot(b.vx, b.vy);
      if (state.rocket > 0){
        // a rocket beetle goes straight through
        state.taken.add(i);
        puff(ix, iy, 16, '#ff9a4a', 300, 0.5);
        float(ix, iy+40, 'SMASH', '#ff9a4a');
        state.shake = Math.max(state.shake, 6);
      } else if (sp > 200){
        state.taken.add(i);
        r.hits++;
        const soften = 1 - lvl('chitin') * 0.12;
        b.vx *= (0.66 + 0.06*lvl('chitin'));
        b.vy = Math.max(b.vy, 210);
        b.stumble = 0.28 * soften;
        b.spin = (Math.random()<0.5?-1:1) * 6;
        state.shake = Math.max(state.shake, 9);
        state.flash = 0.25;
        float(b.x, b.y+44, 'thud', '#e07a5a');
        puff(b.x, b.y+8, 14, '#6b5a38', 220, 0.6);
      }
    } else if (type === ITEM.SHROOM){
      if (b.vy < 60){
        state.taken.add(i);
        r.shrooms++;
        bumpCombo();
        b.airHops = 1 + Math.floor(lvl('legs') / 2);
        const p = 980 + lvl('legs') * 95;
        b.vy = p;
        b.vx = Math.max(b.vx, 200) * 1.12;
        b.air = true;
        b.charge = Math.min(maxCharge(), b.charge + 9);
        state.shake = Math.max(state.shake, 4);
        puff(ix, iy+18, 14, '#e08fb4', 200, 0.6);
        float(ix, iy+60, 'boing', '#f0a8c8');
      }
    }
  }
}

function drown(){
  const b = state.beetle;
  puff(b.x, b.y+10, 30, '#8fc6e8', 300, 0.9);
  state.shake = 14; state.flash = 0.5;
  endRun();
}

function endRun(){
  const r = state.run;
  if (!r) { state.mode = 'title'; return; }
  if (state.mode !== 'run') return;      // a run only ends once
  save.runs++;
  if (r.dist > save.best) save.best = r.dist;
  state.earned = [];
  for (const t of TRIALS){
    if (save.trials[t.id]) continue;
    let ok = false;
    try { ok = !!t.test(r); } catch(e){ ok = false; }
    if (ok){ save.trials[t.id] = true; save.dew += t.reward; state.earned.push(t); }
  }
  writeSave();
  state.mode = 'dead';
}

// ------------------------------------------------------------------- update
function update(dt){
  state.t += dt;

  // power-up clocks tick in REAL time; the world runs slow, the pickup does not
  if (state.rocket > 0) state.rocket = Math.max(0, state.rocket - dt);
  if (state.slowmo > 0) state.slowmo = Math.max(0, state.slowmo - dt);
  if (state.banner){ state.banner.life -= dt; if (state.banner.life <= 0) state.banner = null; }
  if (state.comboTimer > 0){
    state.comboTimer -= dt;
    if (state.comboTimer <= 0) state.combo = 0;
  }

  if (state.mode === 'run') stepRun(state.slowmo > 0 ? dt * 0.42 : dt);

  for (let i = state.particles.length - 1; i >= 0; i--){
    const p = state.particles[i];
    p.life -= dt;
    if (p.life <= 0){ state.particles.splice(i,1); continue; }
    p.x += p.vx*dt; p.y += p.vy*dt; p.vy -= 420*dt; p.vx *= (1-1.6*dt);
  }
  for (let i = state.floats.length - 1; i >= 0; i--){
    const f = state.floats[i]; f.life -= dt; f.y += 46*dt;
    if (f.life <= 0) state.floats.splice(i,1);
  }
  for (let i = state.drops.length - 1; i >= 0; i--){
    const d = state.drops[i]; d.life -= dt;
    if (d.life <= 0) state.drops.splice(i,1);
  }
  state.shake = Math.max(0, state.shake - dt*22);
  state.flash = Math.max(0, state.flash - dt*2);
}

// ------------------------------------------------------------------ drawing
function sx(wx){ return wx - state.cam.x; }
function sy(wy){ return H*0.66 - (wy - state.cam.y); }

function draw(){
  const bm = state.mode === 'run' || state.mode === 'dead'
           ? biomeBlend((state.beetle ? state.beetle.x : 0) * M_PER_PX)
           : biomeBlend(0);

  ctx.save();
  if (state.shake > 0.1){
    ctx.translate((Math.random()-0.5)*state.shake, (Math.random()-0.5)*state.shake);
  }

  drawSky(bm);
  drawBackdrop(bm);
  drawGround(bm);
  if (state.mode === 'run' || state.mode === 'dead') { drawItems(bm); drawBeetle(); }
  drawParticles();
  drawRain(bm);
  ctx.restore();

  if (state.flash > 0){
    ctx.fillStyle = 'rgba(255,240,220,'+(state.flash*0.35)+')';
    ctx.fillRect(0,0,W,H);
  }
  drawVignette();

  if (state.mode === 'run')   drawHUD(bm);
  if (state.mode === 'title') drawTitle();
  if (state.mode === 'dead')  drawDead();
  if (state.mode === 'shop')  drawShop();
  if (state.mode === 'trials')drawTrials();
}

// gradients are rebuilt only when their inputs change, not every frame
let skyCache = { key:'', grad:null };
function drawSky(bm){
  const key = bm.sky + '|' + bm.sky2 + '|' + H;
  if (key !== skyCache.key){
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0, bm.sky);
    g.addColorStop(1, bm.sky2);
    skyCache = { key, grad:g };
  }
  ctx.fillStyle = skyCache.grad; ctx.fillRect(0,0,W,H);
}

function drawBackdrop(bm){
  // far stems / grass silhouettes, parallax
  const layers = [
    { p:0.14, h:0.55, col:'rgba(0,0,0,0.22)', step:180, amp:70 },
    { p:0.30, h:0.42, col:'rgba(0,0,0,0.30)', step:120, amp:52 },
    { p:0.52, h:0.30, col:'rgba(0,0,0,0.38)', step:80,  amp:34 },
  ];
  for (const L of layers){
    const ox = state.cam.x * L.p;
    const baseY = H*(1-L.h*0.35) - state.cam.y*L.p*0.25;
    ctx.fillStyle = L.col;
    const i0 = Math.floor(ox/L.step)-1, i1 = i0 + Math.ceil(W/L.step)+3;
    for (let i=i0;i<=i1;i++){
      const r1 = hash1(i, 9001 + Math.round(L.p*100));
      const r2 = hash1(i, 4002 + Math.round(L.p*100));
      const x = i*L.step - ox + r1*L.step*0.6;
      const hgt = (60 + r2*L.amp*3);
      const w = 4 + r1*8;
      ctx.beginPath();
      ctx.moveTo(x - w, baseY);
      ctx.quadraticCurveTo(x - w*0.4 + (r2-0.5)*40, baseY - hgt*0.6, x + (r2-0.5)*70, baseY - hgt);
      ctx.quadraticCurveTo(x + w*0.6 + (r2-0.5)*40, baseY - hgt*0.5, x + w, baseY);
      ctx.closePath(); ctx.fill();
    }
  }
}

function terrainPath(){
  const step = 8;
  ctx.beginPath();
  const x0 = state.cam.x - step*2;
  ctx.moveTo(sx(x0), sy(groundY(x0)));
  for (let x = x0; x <= state.cam.x + W + step*2; x += step){
    ctx.lineTo(sx(x), sy(groundY(x)));
  }
  ctx.lineTo(W + 40, H + 60);
  ctx.lineTo(-40, H + 60);
  ctx.closePath();
}

function drawGround(bm){
  // soil body
  terrainPath();
  const g = ctx.createLinearGradient(0, H*0.2, 0, H);
  g.addColorStop(0, bm.gnd2);
  g.addColorStop(1, bm.gnd);
  ctx.fillStyle = g; ctx.fill();

  // top crust line
  ctx.save();
  terrainPath();
  ctx.clip();
  ctx.lineWidth = 6;
  ctx.strokeStyle = bm.acc;
  ctx.globalAlpha = 0.75;
  ctx.beginPath();
  const step = 8, x0 = state.cam.x - 16;
  ctx.moveTo(sx(x0), sy(groundY(x0)));
  for (let x = x0; x <= state.cam.x + W + 16; x += step) ctx.lineTo(sx(x), sy(groundY(x)));
  ctx.stroke();
  ctx.globalAlpha = 1;

  // grit
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  const c0 = Math.floor((state.cam.x)/40)-1, c1 = c0 + Math.ceil(W/40)+2;
  for (let i=c0;i<=c1;i++){
    for (let k=0;k<3;k++){
      const rx = i*40 + hash1(i*7+k, 555)*40;
      const depth = 14 + hash1(i*7+k, 777)*120;
      const px = sx(rx), py = sy(groundY(rx) - depth);
      const rr = 1.5 + hash1(i*7+k, 999)*3.5;
      ctx.beginPath(); ctx.arc(px, py, rr, 0, 6.2832); ctx.fill();
    }
  }
  ctx.restore();
}

function drawItems(bm){
  const i0 = Math.floor((state.cam.x - 120)/CELL), i1 = Math.floor((state.cam.x + W + 120)/CELL);
  for (let i=i0;i<=i1;i++){
    const type = cellItem(i);
    if (type === ITEM.NONE) continue;
    const taken = state.taken.has(i);
    const ix = cellX(i), iy = cellY(i, type);
    const px = sx(ix), py = sy(iy);

    if (type === ITEM.DEW){
      if (taken) continue;
      const bobY = py + Math.sin(state.t*3 + i)*3;
      ctx.fillStyle = 'rgba(159,216,255,0.22)';
      ctx.beginPath(); ctx.arc(px, bobY, 14, 0, 6.2832); ctx.fill();
      ctx.fillStyle = '#9fd8ff';
      ctx.beginPath(); ctx.arc(px, bobY, 7, 0, 6.2832); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.beginPath(); ctx.arc(px-2.4, bobY-2.6, 2.2, 0, 6.2832); ctx.fill();
    } else if (type === ITEM.NECTAR){
      if (taken) continue;
      const bobY = py + Math.sin(state.t*2.2 + i)*5;
      ctx.fillStyle = 'rgba(255,207,106,0.22)';
      ctx.beginPath(); ctx.arc(px, bobY, 24, 0, 6.2832); ctx.fill();
      ctx.fillStyle = '#ffcf6a';
      ctx.beginPath(); ctx.arc(px, bobY, 11, 0, 6.2832); ctx.fill();
      ctx.strokeStyle = 'rgba(255,240,200,0.9)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(px, bobY, 15 + Math.sin(state.t*4+i)*2, 0, 6.2832); ctx.stroke();
    } else if (type === ITEM.SAP){
      ctx.fillStyle = 'rgba(216,161,58,0.85)';
      ctx.beginPath();
      ctx.ellipse(px, py-4, 30, 9, Math.atan2(groundSlope(ix),1), 0, 6.2832);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,220,150,0.45)';
      ctx.beginPath(); ctx.ellipse(px-8, py-6, 9, 3, 0, 0, 6.2832); ctx.fill();
    } else if (type === ITEM.ROOT){
      if (taken) continue;
      const a = Math.atan2(groundSlope(ix),1);
      ctx.save(); ctx.translate(px, py); ctx.rotate(a);
      ctx.fillStyle = '#4a3a22';
      ctx.beginPath();
      ctx.moveTo(-26, 2); ctx.quadraticCurveTo(-10, -26, 4, -14);
      ctx.quadraticCurveTo(16, -26, 26, 2); ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.10)';
      ctx.beginPath(); ctx.ellipse(-6, -12, 9, 4, -0.5, 0, 6.2832); ctx.fill();
      ctx.restore();
    } else if (type === ITEM.ROCKET || type === ITEM.SLOWMO){
      if (taken) continue;
      const isR = type === ITEM.ROCKET;
      const col = isR ? '#ff9a4a' : '#9fd8ff';
      const bobY = py + Math.sin(state.t*2.6 + i)*7;
      const pulse = 1 + Math.sin(state.t*7 + i)*0.16;
      ctx.globalAlpha = 0.28;
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.arc(px, bobY, 40*pulse, 0, 6.2832); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.fillStyle = col;
      ctx.save(); ctx.translate(px, bobY); ctx.rotate(Math.sin(state.t*2+i)*0.3);
      if (isR){
        ctx.beginPath();
        ctx.moveTo(20,0); ctx.lineTo(-8,-12); ctx.lineTo(-2,0); ctx.lineTo(-8,12);
        ctx.closePath(); ctx.fill();
      } else {
        ctx.beginPath(); ctx.arc(0,0,13,0,6.2832); ctx.fill();
        ctx.strokeStyle = '#0b1016'; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.moveTo(0,-7); ctx.lineTo(0,0); ctx.lineTo(6,4); ctx.stroke();
      }
      ctx.restore();
      ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.globalAlpha = 0.8;
      ctx.beginPath(); ctx.arc(px, bobY, 24*pulse, 0, 6.2832); ctx.stroke();
      ctx.globalAlpha = 1;
    } else if (type === ITEM.SHROOM){
      if (taken) continue;
      const a = Math.atan2(groundSlope(ix),1);
      ctx.save(); ctx.translate(px, py); ctx.rotate(a);
      ctx.fillStyle = '#d8cfc0';
      ctx.fillRect(-4, -16, 8, 16);
      ctx.fillStyle = '#e08fb4';
      ctx.beginPath(); ctx.ellipse(0, -18, 22, 13, 0, Math.PI, 0); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.beginPath(); ctx.arc(-8, -22, 3, 0, 6.2832); ctx.fill();
      ctx.beginPath(); ctx.arc(6, -25, 2.4, 0, 6.2832); ctx.fill();
      ctx.restore();
    }
  }
  // magnet streaks
  for (const d of state.drops){
    ctx.strokeStyle = d.col; ctx.globalAlpha = d.life*4;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(sx(d.x), sy(d.y)); ctx.lineTo(sx(d.tx), sy(d.ty)); ctx.stroke();
    ctx.globalAlpha = 1;
  }
}

function drawBeetle(){
  const b = state.beetle;
  const px = sx(b.x), py = sy(b.y);
  const gliding = input.hold && b.air && state.mode === 'run';
  ctx.save();
  ctx.translate(px, py - 14);
  ctx.rotate(-b.rot);

  // shadow on ground
  ctx.save();
  ctx.rotate(b.rot);
  const gh = sy(groundY(b.x)) - py;
  ctx.globalAlpha = clamp(1 - Math.abs(gh)/260, 0.05, 0.4);
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.ellipse(0, gh + 14, 22, 6, 0, 0, 6.2832); ctx.fill();
  ctx.restore();

  // legs
  ctx.strokeStyle = '#20180e'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  for (let i=-1;i<=1;i++){
    const ph = b.legPhase + i*1.9;
    const swing = b.air ? Math.sin(state.t*6 + i)*0.5 : Math.sin(ph)*0.9;
    for (const s of [-1, 1]){
      ctx.beginPath();
      ctx.moveTo(i*9, 4);
      ctx.lineTo(i*9 + s*11, 12 + Math.abs(swing)*3);
      ctx.lineTo(i*9 + s*15 + swing*5, 20);
      ctx.stroke();
    }
  }

  // elytra (wing covers) — spread when gliding
  const sAmt = gliding ? 1 : 0;
  if (sAmt){
    ctx.fillStyle = 'rgba(220,240,255,0.35)';
    for (const s of [-1,1]){
      ctx.save(); ctx.translate(0,-2); ctx.rotate(s*0.5);
      ctx.beginPath(); ctx.ellipse(-6, s*10, 22, 8, 0, 0, 6.2832); ctx.fill();
      ctx.restore();
    }
  }

  // body
  const bodyR = gliding ? 17 : 15;
  const hot = state.rocket > 0;
  const grd = ctx.createLinearGradient(-18,-12,14,12);
  grd.addColorStop(0, hot ? '#ff7a2a' : '#6f4a1e');
  grd.addColorStop(0.5, hot ? '#ffd070' : '#a86c25');
  grd.addColorStop(1, hot ? '#a03a08' : '#3a2510');
  ctx.fillStyle = grd;
  ctx.beginPath(); ctx.ellipse(-2, 0, bodyR+5, bodyR-2, 0, 0, 6.2832); ctx.fill();

  // shell split
  ctx.strokeStyle = 'rgba(20,12,6,0.8)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-19, 0); ctx.lineTo(10, 0); ctx.stroke();
  ctx.fillStyle = 'rgba(255,240,200,0.18)';
  ctx.beginPath(); ctx.ellipse(-6,-6, 9, 4, -0.4, 0, 6.2832); ctx.fill();

  // head + horn
  ctx.fillStyle = '#2c1c0d';
  ctx.beginPath(); ctx.ellipse(15, 1, 9, 8, 0, 0, 6.2832); ctx.fill();
  ctx.strokeStyle = '#2c1c0d'; ctx.lineWidth = 4; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(19,-3); ctx.quadraticCurveTo(30,-10, 27,-18); ctx.stroke();
  // antennae
  ctx.lineWidth = 2;
  for (const s of [-1,1]){
    ctx.beginPath(); ctx.moveTo(20, s*4);
    ctx.quadraticCurveTo(31, s*10 + Math.sin(state.t*8+s)*2, 34, s*15);
    ctx.stroke();
  }
  // eye
  ctx.fillStyle = '#ffe9b0';
  ctx.beginPath(); ctx.arc(18,-2, 2.2, 0, 6.2832); ctx.fill();

  // charge glow
  if (b.glow > 0){
    ctx.globalAlpha = b.glow*0.6;
    ctx.fillStyle = '#ffd98a';
    ctx.beginPath(); ctx.arc(-4, 0, 34, 0, 6.2832); ctx.fill();
    ctx.globalAlpha = 1;
  }
  ctx.restore();

  // speed streaks
  const sp = Math.hypot(b.vx,b.vy);
  if (sp > 620){
    ctx.strokeStyle = 'rgba(255,255,255,'+clamp((sp-620)/900,0,0.28)+')';
    ctx.lineWidth = 2;
    for (let i=0;i<5;i++){
      const yy = py - 34 + hash1(i + Math.floor(state.t*22), 31)*44;
      const ln = 30 + hash1(i, 61)*60;
      ctx.beginPath(); ctx.moveTo(px-26-ln, yy); ctx.lineTo(px-26, yy); ctx.stroke();
    }
  }
}

function drawParticles(){
  for (const p of state.particles){
    ctx.globalAlpha = clamp(p.life / p.max, 0, 1) * 0.9;
    ctx.fillStyle = p.col;
    ctx.beginPath(); ctx.arc(sx(p.x), sy(p.y), p.r, 0, 6.2832); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center';
  for (const f of state.floats){
    ctx.globalAlpha = clamp(f.life, 0, 1);
    ctx.fillStyle = f.col;
    ctx.font = '600 14px ui-monospace,Consolas,monospace';
    ctx.fillText(f.text, sx(f.x), sy(f.y));
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'left';
}

function drawRain(bm){
  if (state.mode !== 'run' && state.mode !== 'dead') return;
  const wx = sx(state.rainX);

  // Off the left edge: never let the storm be invisible. Pin a marker to the edge
  // showing how far back it is, so its arrival is always something you saw coming.
  if (wx < 0){
    const back = Math.round((state.beetle.x - state.rainX) * M_PER_PX);
    const g2 = ctx.createLinearGradient(0,0,90,0);
    g2.addColorStop(0, 'rgba(30,52,72,0.55)');
    g2.addColorStop(1, 'rgba(30,52,72,0)');
    ctx.fillStyle = g2; ctx.fillRect(0,0,90,H);
    ctx.save();
    ctx.translate(20, H*0.5);
    ctx.fillStyle = 'rgba(160,215,240,0.85)';
    ctx.beginPath(); ctx.moveTo(-10,0); ctx.lineTo(6,-11); ctx.lineTo(6,11); ctx.closePath(); ctx.fill();
    ctx.font = '700 12px ui-monospace,Consolas,monospace';
    ctx.textAlign = 'left';
    ctx.fillText(back + ' m', 14, 4);
    ctx.restore();
    if (wx < -80) return;
  }

  const g = ctx.createLinearGradient(Math.max(-200, wx-460), 0, wx+30, 0);
  g.addColorStop(0, 'rgba(10,16,24,0.96)');
  g.addColorStop(0.55,'rgba(24,40,58,0.72)');
  g.addColorStop(1, 'rgba(60,96,124,0.12)');
  ctx.fillStyle = g;
  ctx.fillRect(-200, 0, Math.min(W+200, wx+230), H);

  // streaks
  ctx.strokeStyle = 'rgba(190,225,245,0.5)';
  ctx.lineWidth = 1.6;
  const n = 90;
  for (let i=0;i<n;i++){
    const f = hash1(i, 12345);
    const yy = ((f*H*2 + state.t*(900 + f*700)) % (H+120)) - 60;
    const xx = wx - 30 - hash1(i, 6789) * 430 + Math.sin(state.t*2+i)*6;
    if (xx < -30) continue;
    ctx.globalAlpha = 0.25 + f*0.5;
    ctx.beginPath(); ctx.moveTo(xx, yy); ctx.lineTo(xx-9, yy+26); ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // leading edge shimmer
  ctx.strokeStyle = 'rgba(160,215,240,0.55)';
  ctx.lineWidth = 3;
  ctx.beginPath();
  for (let y=0;y<=H;y+=18){
    const jx = wx + Math.sin(y*0.05 + state.t*6)*7;
    if (y===0) ctx.moveTo(jx,y); else ctx.lineTo(jx,y);
  }
  ctx.stroke();
}

let vigCache = { key:'', grad:null };
function drawVignette(){
  const key = W + 'x' + H;
  if (key !== vigCache.key){
    const g = ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.35, W/2,H/2,Math.max(W,H)*0.75);
    g.addColorStop(0,'rgba(0,0,0,0)');
    g.addColorStop(1,'rgba(0,0,0,0.55)');
    vigCache = { key, grad:g };
  }
  ctx.fillStyle = vigCache.grad; ctx.fillRect(0,0,W,H);
}

// ---------------------------------------------------------------------- HUD
function panel(x,y,w,h,a){
  ctx.fillStyle = 'rgba(8,12,10,'+(a===undefined?0.72:a)+')';
  ctx.strokeStyle = 'rgba(150,180,120,0.28)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  const r = 10;
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
  ctx.fill(); ctx.stroke();
}

function drawHUD(bm){
  const r = state.run, b = state.beetle;
  ctx.textAlign = 'left';

  // distance
  ctx.font = '700 40px ui-monospace,Consolas,monospace';
  ctx.fillStyle = '#eef4d8';
  ctx.fillText(fmt(r.dist) + ' m', 22, 52);
  ctx.font = '500 13px ui-monospace,Consolas,monospace';
  ctx.fillStyle = bm.acc;
  ctx.fillText(bm.name.toUpperCase(), 24, 72);
  ctx.fillStyle = '#7f8a68';
  ctx.fillText('best ' + fmt(save.best) + ' m', 24, 90);

  // dew
  ctx.textAlign = 'right';
  ctx.font = '700 22px ui-monospace,Consolas,monospace';
  ctx.fillStyle = '#9fd8ff';
  ctx.fillText('◇ ' + fmt(r.dew), W-22, 44);
  ctx.font = '500 12px ui-monospace,Consolas,monospace';
  ctx.fillStyle = '#6f8394';
  ctx.fillText('speed ' + Math.round(Math.hypot(b.vx,b.vy)), W-22, 64);
  ctx.textAlign = 'left';

  // buzz meter
  const mw = 168, mx = 22, my = H-40;
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(mx, my, mw, 12);
  const f = b.charge / maxCharge();
  ctx.fillStyle = f >= 0.32 ? '#ffcf6a' : '#8a7a4a';
  ctx.fillRect(mx, my, mw*f, 12);
  ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth=1;
  ctx.strokeRect(mx+0.5, my+0.5, mw, 12);
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.fillRect(mx + mw*(32/maxCharge()), my, 1, 12);
  ctx.font = '500 11px ui-monospace,Consolas,monospace';
  ctx.fillStyle = '#8a9470';
  ctx.fillText('BUZZ  (fires itself when full)', mx, my - 6);

  // rain proximity bar
  const lead = clamp((b.x - state.rainX) / 4200, 0, 1);
  const bw = 168, bx = W - bw - 22, by = H-40;
  ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(bx, by, bw, 12);
  const dangerCol = lead < 0.12 ? '#e05a5a' : lead < 0.3 ? '#e0a05a' : '#7fb4d8';
  ctx.fillStyle = dangerCol;
  ctx.fillRect(bx, by, bw*lead, 12);
  ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.strokeRect(bx+0.5, by+0.5, bw, 12);
  ctx.fillStyle = '#8a9470';
  ctx.fillText('LEAD', bx, by - 6);

  // air hops left — the one thing you need to know mid-jump
  for (let i = 0; i < (b.airHops || 0); i++){
    ctx.fillStyle = '#bfe8ff';
    ctx.beginPath(); ctx.arc(mx + 8 + i*18, my - 26, 5, 0, 6.2832); ctx.fill();
  }

  // combo
  if (state.combo > 1){
    ctx.textAlign = 'center';
    const m = comboMult();
    ctx.font = '800 26px ui-monospace,Consolas,monospace';
    ctx.fillStyle = m > 1 ? '#ffe9a0' : '#cfe0b0';
    ctx.fillText('x' + m, W/2, H - 52);
    ctx.font = '500 11px ui-monospace,Consolas,monospace';
    ctx.fillStyle = '#8a9470';
    ctx.fillText(state.combo + ' chain', W/2, H - 36);
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(W/2-40, H-30, 80, 5);
    ctx.fillStyle = '#ffe9a0'; ctx.fillRect(W/2-40, H-30, 80*clamp(state.comboTimer/2.4,0,1), 5);
    ctx.textAlign = 'left';
  }

  // power-up timers
  if (state.rocket > 0 || state.slowmo > 0){
    const isR = state.rocket > 0;
    const t = isR ? state.rocket : state.slowmo, full = isR ? 3.4 : 3.0;
    ctx.textAlign = 'center';
    ctx.font = '700 15px ui-monospace,Consolas,monospace';
    ctx.fillStyle = isR ? '#ff9a4a' : '#9fd8ff';
    ctx.fillText(isR ? 'ROCKET' : 'SLOW', W/2, 96);
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(W/2-60, 104, 120, 6);
    ctx.fillStyle = isR ? '#ff9a4a' : '#9fd8ff'; ctx.fillRect(W/2-60, 104, 120*(t/full), 6);
    ctx.textAlign = 'left';
  }

  // big moment banner
  if (state.banner){
    const b2 = state.banner, a = clamp(b2.life/0.5, 0, 1);
    const scale = 1 + (1 - clamp(b2.life/1.6, 0, 1)) * 0.15;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(W/2, H*0.34);
    ctx.scale(scale, scale);
    ctx.textAlign = 'center';
    ctx.font = '800 ' + Math.min(56, W*0.075) + 'px ui-monospace,Consolas,monospace';
    ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(0,0,0,0.65)';
    ctx.strokeText(b2.text, 0, 0);
    ctx.fillStyle = b2.col;
    ctx.fillText(b2.text, 0, 0);
    ctx.restore();
    ctx.textAlign = 'left';
  }

  if (lead < 0.14){
    ctx.textAlign = 'center';
    ctx.globalAlpha = 0.5 + Math.sin(state.t*12)*0.4;
    ctx.fillStyle = '#ff8a72';
    ctx.font = '700 20px ui-monospace,Consolas,monospace';
    ctx.fillText('THE RAIN', W/2, 44);
    ctx.globalAlpha = 1;
    ctx.textAlign = 'left';
  }
}

function bigTitle(text, y, size, col){
  ctx.textAlign = 'center';
  ctx.font = '800 '+size+'px ui-monospace,Consolas,monospace';
  ctx.fillStyle = col || '#eef4d8';
  ctx.fillText(text, W/2, y);
  ctx.textAlign = 'left';
}
function centerLine(text, y, size, col, weight){
  ctx.textAlign = 'center';
  ctx.font = (weight||'500')+' '+size+'px ui-monospace,Consolas,monospace';
  ctx.fillStyle = col || '#a8b48c';
  ctx.fillText(text, W/2, y);
  ctx.textAlign = 'left';
}

function drawTitle(){
  ctx.fillStyle = 'rgba(6,9,7,0.55)'; ctx.fillRect(0,0,W,H);
  const y = H*0.30;
  ctx.save();
  ctx.translate(0, Math.sin(state.t*1.6)*4);
  bigTitle('BEETLEBOUND', y, Math.min(72, W*0.10), '#e8c86a');
  ctx.restore();
  centerLine('outrun the rain across the forest floor', y+34, 15, '#8fa070');

  panel(W/2-230, y+72, 460, 86);
  centerLine('ONE BUTTON', y+100, 15, '#e8c86a', '700');
  centerLine('TAP to jump.   HOLD to fly.', y+126, 16, '#cfe0b0');
  centerLine('tap again in mid-air for a second buzz', y+147, 12, '#8fa070');

  centerLine('◇ ' + fmt(save.dew) + ' dew     best ' + fmt(save.best) + ' m',
             y+192, 15, '#9fd8ff', '700');

  const pulse = 0.6 + Math.sin(state.t*4)*0.4;
  ctx.globalAlpha = pulse;
  centerLine('press SPACE to run', y+232, 20, '#eef4d8', '700');
  ctx.globalAlpha = 1;
  centerLine('[S] spend dew        [T] trials', y+262, 12, '#6b7458');
}

function drawDead(){
  const r = state.run;
  ctx.fillStyle = 'rgba(6,9,14,0.72)'; ctx.fillRect(0,0,W,H);
  const y = Math.max(60, H*0.16);
  bigTitle('THE RAIN TOOK YOU', y, Math.min(40, W*0.06), '#8fc6e8');

  panel(W/2-250, y+30, 500, 190);
  ctx.textAlign='left';
  const L = W/2-224, R = W/2+224;
  const rows = [
    ['distance',   fmt(r.dist) + ' m'],
    ['dew gathered', '◇ ' + fmt(r.dew)],
    ['top speed',  fmt(r.topSpeed)],
    ['best air',   r.bestAir.toFixed(1) + ' s'],
    ['clean landings', fmt(r.perfect)],
    ['best chain',  'x' + (1 + Math.floor(r.bestCombo/6)) + '  (' + fmt(r.bestCombo) + ')'],
    ['rockets / slow', fmt(r.rockets) + ' / ' + fmt(r.slowmos)],
  ];
  ctx.font = '500 14px ui-monospace,Consolas,monospace';
  rows.forEach((row, i) => {
    const ry = y + 58 + i*27;
    ctx.fillStyle = '#7f8a68'; ctx.fillText(row[0], L, ry);
    ctx.textAlign='right'; ctx.fillStyle = '#e4ecc8'; ctx.fillText(row[1], R, ry);
    ctx.textAlign='left';
  });

  let by = y + 238;
  if (r.dist >= save.best && r.dist > 0){
    centerLine('NEW BEST', by, 18, '#e8c86a', '700'); by += 30;
  }
  if (state.earned.length){
    centerLine('trials completed', by, 13, '#8fa070'); by += 22;
    for (const t of state.earned.slice(0,4)){
      centerLine('✦ ' + t.name + '   +' + t.reward + ' dew', by, 14, '#9fd8ff', '700');
      by += 21;
    }
    if (state.earned.length > 4){ centerLine('+' + (state.earned.length-4) + ' more', by, 12, '#7f8a68'); by += 20; }
  }

  const pulse = 0.6 + Math.sin(state.t*4)*0.4;
  ctx.globalAlpha = pulse;
  centerLine('SPACE to run again', Math.min(H-56, by+18), 17, '#eef4d8', '700');
  ctx.globalAlpha = 1;
  centerLine('[S] store    [T] trials    ◇ ' + fmt(save.dew), Math.min(H-26, by+44), 13, '#7f8a68');
}

function drawShop(){
  ctx.fillStyle = 'rgba(5,8,6,0.90)'; ctx.fillRect(0,0,W,H);
  bigTitle('THE BURROW STORE', 62, Math.min(34, W*0.05), '#e8c86a');
  centerLine('◇ ' + fmt(save.dew) + ' dew', 88, 16, '#9fd8ff', '700');

  const top = 118, rowH = Math.min(56, (H - top - 60) / UPGRADES.length);
  const x = Math.max(20, W/2 - 300), w = Math.min(600, W - 40);
  UPGRADES.forEach((u,i) => {
    const l = lvl(u.key), maxed = l >= u.max, cost = upCost(u, l);
    const y = top + i*rowH;
    const sel = i === state.shopSel;
    ctx.fillStyle = sel ? 'rgba(90,110,60,0.35)' : 'rgba(0,0,0,0.35)';
    ctx.fillRect(x, y, w, rowH-6);
    if (sel){ ctx.strokeStyle = '#c8d89a'; ctx.lineWidth = 1.5; ctx.strokeRect(x+0.5, y+0.5, w, rowH-6); }

    ctx.textAlign='left';
    ctx.font = '700 15px ui-monospace,Consolas,monospace';
    ctx.fillStyle = maxed ? '#7f8a68' : '#eef4d8';
    ctx.fillText((i+1) + '. ' + u.name, x+12, y+21);
    ctx.font = '500 12px ui-monospace,Consolas,monospace';
    ctx.fillStyle = '#8a9470';
    ctx.fillText(u.desc, x+12, y+38);

    // pips
    const pxs = x + w - 190;
    for (let k=0;k<u.max;k++){
      ctx.fillStyle = k < l ? '#c8d89a' : 'rgba(255,255,255,0.15)';
      ctx.fillRect(pxs + k*14, y+16, 10, 10);
    }
    ctx.textAlign='right';
    ctx.font = '700 14px ui-monospace,Consolas,monospace';
    if (maxed){ ctx.fillStyle = '#7f8a68'; ctx.fillText('MAX', x+w-12, y+26); }
    else {
      ctx.fillStyle = save.dew >= cost ? '#9fd8ff' : '#6a5a58';
      ctx.fillText('◇ ' + fmt(cost), x+w-12, y+26);
    }
    ctx.textAlign='left';
  });
  centerLine('↑↓ select   ENTER or number to buy   ESC to leave', H-28, 13, '#7f8a68');
}

function drawTrials(){
  ctx.fillStyle = 'rgba(5,8,6,0.92)'; ctx.fillRect(0,0,W,H);
  const done = TRIALS.filter(t => save.trials[t.id]).length;
  bigTitle('TRIALS', 50, Math.min(32, W*0.05), '#e8c86a');
  centerLine(done + ' / ' + TRIALS.length + ' complete', 74, 14, '#8fa070');

  const cols = W > 760 ? 2 : 1;
  const per = Math.ceil(TRIALS.length / cols);
  const cw = Math.min(430, (W - 60) / cols);
  const top = 100, rowH = Math.min(30, (H - top - 44) / per);
  TRIALS.forEach((t, i) => {
    const c = Math.floor(i / per), rI = i % per;
    const x = (W - cw*cols - (cols-1)*20)/2 + c*(cw+20);
    const y = top + rI*rowH;
    const ok = !!save.trials[t.id];
    ctx.font = '600 12px ui-monospace,Consolas,monospace';
    ctx.fillStyle = ok ? '#c8d89a' : '#5f6a50';
    ctx.fillText(ok ? '✦' : '·', x, y+12);
    ctx.fillStyle = ok ? '#eef4d8' : '#8a9470';
    ctx.fillText(t.name, x+16, y+12);
    ctx.font = '500 11px ui-monospace,Consolas,monospace';
    ctx.fillStyle = ok ? '#7f8a68' : '#5f6a50';
    ctx.fillText(t.desc, x+16, y+24);
    ctx.textAlign='right';
    ctx.fillStyle = ok ? '#7f8a68' : '#9fd8ff';
    ctx.fillText('+' + t.reward, x+cw-4, y+12);
    ctx.textAlign='left';
  });
  centerLine('ESC to go back', H-20, 12, '#7f8a68');
}

// ------------------------------------------------------------------ mainloop
let last = 0, raf = 0, paused = false;

// The loop is deliberately capped at ~60 fps and stops dead when the tab is hidden.
// This is a 2D canvas game; there is no reason to hold the GPU at 240 fps or to keep
// burning frames in a background tab.
function frame(now){
  raf = requestAnimationFrame(frame);
  if (paused) return;
  if (!last) last = now;
  const elapsed = now - last;
  if (elapsed < 15.4) return;
  last = now;
  let dt = elapsed / 1000;
  if (dt > 0.05) dt = 0.05;
  if (dt <= 0) dt = 1/60;
  update(dt);
  draw();
}

function setPaused(p){
  paused = p;
  if (!p) last = 0;                 // don't bank a huge dt while we were away
  else { input.hold = false; input.jumpEdge = false; }
}
if (document.addEventListener){
  document.addEventListener('visibilitychange', () => setPaused(!!document.hidden));
}
window.addEventListener('blur', () => setPaused(true));
window.addEventListener('focus', () => setPaused(false));

function boot(){
  loadSave();
  resize();
  state.beetle = { x:0, y:0, vx:0, vy:0, air:false, rot:0, charge:0, legPhase:0, stumble:0, sap:0, glow:0 };
  state.taken = new Set();
  if (typeof requestAnimationFrame === 'function') raf = requestAnimationFrame(frame);
}

// headless / test hook
window.__BB = {
  state, save, update, draw, newRun, endRun, input, buy, UPGRADES, TRIALS,
  groundY, groundSlope, cellItem, cellX, cellY, ITEM, biomeBlend, maxCharge,
  resize, loadSave, writeSave,
  step(dt){ update(dt); },
  setInput(o){ Object.assign(input, o); },
};

boot();
