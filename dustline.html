<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>DUSTLINE</title>
<style>
  html,body{margin:0;padding:0;background:#0b0908;overflow:hidden;height:100%;
    font-family:"Georgia","Times New Roman",serif;-webkit-user-select:none;user-select:none;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  canvas{image-rendering:auto;box-shadow:0 0 80px rgba(0,0,0,.9);cursor:default;}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv"></canvas></div>
<script>
"use strict";
/* ============================================================================
   DUSTLINE  —  a positional deckbuilding roguelike on a stretch of dead rail.
   Single file. Canvas 2D. No dependencies.
   ========================================================================== */

var W = 1280, H = 760;
var cv = document.getElementById('cv');
var ctx = cv.getContext('2d');
cv.width = W; cv.height = H;

/* ---------------------------------------------------------------- palette */
var P = {
  bg:    '#17120f',
  bg2:   '#0e0b09',
  panel: '#241b16',
  panel2:'#2f241c',
  edge:  '#4a3728',
  ink:   '#f2e6d2',
  dim:   '#a08d76',
  faint: '#6b5947',
  brass: '#d9a441',
  rust:  '#b8563f',
  blood: '#c0483a',
  sky:   '#6f97ab',
  moss:  '#87a45c',
  plum:  '#9b7bb5',
  gold:  '#f0c96b',
  bone:  '#e8dcc4'
};

/* -------------------------------------------------------------- utilities */
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function lerp(a,b,t){ return a+(b-a)*t; }
function sign(n){ return n<0?-1:(n>0?1:0); }
function now(){ return performance.now(); }

/* seeded RNG (mulberry32) */
function mkRng(seed){
  var s = seed>>>0;
  return function(){
    s |= 0; s = s + 0x6D2B79F5 | 0;
    var t = Math.imul(s ^ s>>>15, 1 | s);
    t = t + Math.imul(t ^ t>>>7, 61 | t) ^ t;
    return ((t ^ t>>>14) >>> 0) / 4294967296;
  };
}
var rng = mkRng(Date.now()&0x7fffffff);   // replaced per-run
function rnd(){ return rng(); }
function rint(a,b){ return a + Math.floor(rnd()*(b-a+1)); }        // inclusive
function chance(p){ return rnd() < p; }
function pick(arr){ return arr[Math.floor(rnd()*arr.length)]; }
function shuffle(arr){
  for(var i=arr.length-1;i>0;i--){ var j=Math.floor(rnd()*(i+1)); var t=arr[i]; arr[i]=arr[j]; arr[j]=t; }
  return arr;
}
function pickN(arr,n){ var c = arr.slice(); shuffle(c); return c.slice(0,n); }
function uniq(a){ var s={},o=[]; for(var i=0;i<a.length;i++){ if(!s[a[i]]){s[a[i]]=1;o.push(a[i]);} } return o; }

/* --------------------------------------------------------- draw utilities */
function rr(x,y,w,h,r){
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}
function fillRR(x,y,w,h,r,col){ ctx.fillStyle=col; rr(x,y,w,h,r); ctx.fill(); }
function strokeRR(x,y,w,h,r,col,lw){ ctx.strokeStyle=col; ctx.lineWidth=lw||2; rr(x,y,w,h,r); ctx.stroke(); }
function txt(s,x,y,col,size,align,font,baseline){
  ctx.fillStyle = col||P.ink;
  ctx.font = (size||16)+'px '+(font||'Georgia, serif');
  ctx.textAlign = align||'left';
  ctx.textBaseline = baseline||'alphabetic';
  ctx.fillText(s,x,y);
}
function txtb(s,x,y,col,size,align,font){
  ctx.fillStyle = col||P.ink;
  ctx.font = 'bold '+(size||16)+'px '+(font||'Georgia, serif');
  ctx.textAlign = align||'left';
  ctx.textBaseline = 'alphabetic';
  ctx.fillText(s,x,y);
}
function measure(s,size,bold,font){
  ctx.font = (bold?'bold ':'')+(size||16)+'px '+(font||'Georgia, serif');
  return ctx.measureText(s).width;
}
/* word-wrap into lines that fit maxw */
function wrap(s, maxw, size, bold, font){
  ctx.font = (bold?'bold ':'')+(size||16)+'px '+(font||'Georgia, serif');
  var words = String(s).split(' '), lines = [], cur = '';
  for(var i=0;i<words.length;i++){
    var w = words[i];
    if(w === '\n'){ lines.push(cur); cur=''; continue; }
    var t = cur ? cur+' '+w : w;
    if(ctx.measureText(t).width > maxw && cur){ lines.push(cur); cur = w; }
    else cur = t;
  }
  if(cur) lines.push(cur);
  return lines;
}
function wrapDraw(s,x,y,maxw,size,col,align,lh,bold){
  var lines = wrap(s,maxw,size,bold);
  lh = lh || size*1.25;
  for(var i=0;i<lines.length;i++) (bold?txtb:txt)(lines[i], x, y+i*lh, col, size, align||'left');
  return lines.length*lh;
}
/* one line, centered at x; supports *bold-brass* segments */
function drawRichLine(line,x,y,size,col){
  var parts = line.split('*'), total = 0, i;
  for(i=0;i<parts.length;i++){ total += measure(parts[i], size, i%2===1); }
  var cx = x - total/2;
  for(i=0;i<parts.length;i++){
    var b = i%2===1;
    ctx.fillStyle = b ? P.gold : col;
    ctx.font = (b?'bold ':'')+size+'px Georgia, serif';
    ctx.textAlign = 'left'; ctx.textBaseline='alphabetic';
    ctx.fillText(parts[i], cx, y);
    cx += measure(parts[i], size, b);
  }
}
function shadowOn(blur,col){ ctx.shadowBlur=blur; ctx.shadowColor=col; }
function shadowOff(){ ctx.shadowBlur=0; ctx.shadowColor='transparent'; }

/* linear gradient helper */
function lg(x0,y0,x1,y1,stops){
  var g = ctx.createLinearGradient(x0,y0,x1,y1);
  for(var i=0;i<stops.length;i++) g.addColorStop(stops[i][0], stops[i][1]);
  return g;
}

/* hit-testing helper: register clickable rects each frame */
var HOT = [];
function hot(x,y,w,h,id,data){ HOT.push({x:x,y:y,w:w,h:h,id:id,data:data}); }
function hitAt(mx,my){
  for(var i=HOT.length-1;i>=0;i--){
    var r = HOT[i];
    if(mx>=r.x && mx<=r.x+r.w && my>=r.y && my<=r.y+r.h) return r;
  }
  return null;
}

/* ==========================================================================
   GLOBAL STATE
   ========================================================================== */
var G = null;      // run state
var B = null;      // battle state (null outside combat)
var SCREEN = 'title';
var LANE = 9;      // tiles on the rail

/* status metadata: n=name, c=color, p=permanent(no decay), d=description */
var ST = {
  str:   {n:'Grit',      c:P.rust,  p:1, d:'Attacks deal +1 damage per stack.'},
  dex:   {n:'Footing',   c:P.sky,   p:1, d:'Gain +1 Block from card effects per stack.'},
  vuln:  {n:'Exposed',   c:P.blood, p:0, d:'Takes 50% more attack damage.'},
  weak:  {n:'Shaken',    c:P.plum,  p:0, d:'Deals 25% less attack damage.'},
  frail: {n:'Brittle',   c:P.plum,  p:0, d:'Gains 25% less Block.'},
  root:  {n:'Pinned',    c:P.faint, p:0, d:'Cannot move.'},
  stun:  {n:'Reeling',   c:P.gold,  p:0, d:'Loses its next turn.'},
  poison:{n:'Venom',     c:P.moss,  p:0, d:'Loses HP equal to stacks at turn start, then 1 stack fades.'},
  mark:  {n:'Mark',      c:P.brass, p:1, d:'Takes +1 attack damage per stack. Does not fade.'},
  retal: {n:'Barbs',     c:P.rust,  p:1, d:'Attackers at range 1 take damage equal to stacks.'},
  regen: {n:'Mending',   c:P.moss,  p:0, d:'Heals HP equal to stacks at turn start, then 1 stack fades.'},
  dodge: {n:'Ghost',     c:P.sky,   p:1, d:'The next attacks against you miss. One stack per dodge.'},
  burn:  {n:'Cinders',   c:P.rust,  p:0, d:'Takes damage equal to stacks at end of turn, then 1 stack fades.'}
};

function st(u,k){ return u.st[k]|0; }
function pw(k){ return (B && B.p.pw) ? (B.p.pw[k]|0) : 0; }
function addpw(k,n){ if(!B) return; B.p.pw[k] = (B.p.pw[k]|0) + n; }
function setst(u,k,v){ if(v<=0) delete u.st[k]; else u.st[k]=v; }
function addst(u,k,n){ if(n===0) return; setst(u,k, st(u,k)+n); }

/* ==========================================================================
   FX  —  floating text, flashes, muzzle lines
   ========================================================================== */
var FX = [];
function fxText(x,y,s,col,size,rise){
  FX.push({k:'t',x:x,y:y,s:s,c:col||P.ink,sz:size||24,t:0,life:0.95,vy:rise===undefined?-38:rise});
}
function fxFlash(x,y,r,col,life){ FX.push({k:'f',x:x,y:y,r:r,c:col||P.gold,t:0,life:life||0.3}); }
function fxLine(x0,y0,x1,y1,col,life,lw){ FX.push({k:'l',x:x0,y:y0,x1:x1,y1:y1,c:col||P.gold,t:0,life:life||0.22,lw:lw||3}); }
function fxPuff(x,y,n,col,spd){
  for(var i=0;i<n;i++){
    var a = rnd()*Math.PI*2, s=(spd||90)*(0.3+rnd());
    FX.push({k:'p',x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-20,r:2+rnd()*3,c:col||'#a08d76',t:0,life:0.5+rnd()*0.5});
  }
}
function fxShake(n){ SHAKE = Math.max(SHAKE, n); }
var SHAKE = 0;
function updFX(dt){
  for(var i=FX.length-1;i>=0;i--){
    var f = FX[i]; f.t += dt;
    if(f.k==='t'){ f.y += f.vy*dt; f.vy *= 0.94; }
    if(f.k==='p'){ f.x += f.vx*dt; f.y += f.vy*dt; f.vy += 260*dt; f.vx*=0.97; }
    if(f.t >= f.life) FX.splice(i,1);
  }
  SHAKE = Math.max(0, SHAKE - dt*38);
}
function drawFX(){
  for(var i=0;i<FX.length;i++){
    var f = FX[i], a = 1 - f.t/f.life;
    ctx.globalAlpha = clamp(a,0,1);
    if(f.k==='t'){
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.font='bold '+f.sz+'px Georgia, serif';
      ctx.fillStyle='rgba(0,0,0,.6)'; ctx.fillText(f.s,f.x+2,f.y+2);
      ctx.fillStyle=f.c; ctx.fillText(f.s,f.x,f.y);
    } else if(f.k==='f'){
      var rr2 = f.r*(0.6+1.2*(f.t/f.life));
      ctx.globalAlpha = clamp(a*0.8,0,1);
      ctx.fillStyle=f.c; ctx.beginPath(); ctx.arc(f.x,f.y,rr2,0,7); ctx.fill();
    } else if(f.k==='l'){
      ctx.strokeStyle=f.c; ctx.lineWidth=f.lw*(1-f.t/f.life*0.7);
      ctx.beginPath(); ctx.moveTo(f.x,f.y); ctx.lineTo(f.x1,f.y1); ctx.stroke();
    } else if(f.k==='p'){
      ctx.fillStyle=f.c; ctx.beginPath(); ctx.arc(f.x,f.y,f.r,0,7); ctx.fill();
    }
  }
  ctx.globalAlpha=1;
}

/* ==========================================================================
   ACTION QUEUE  —  paces the enemy turn so it reads
   ========================================================================== */
var Q = [];
function queue(fn, delay){ Q.push({fn:fn, d:delay===undefined?0.32:delay, t:0}); }
function qBusy(){ return Q.length>0; }
function updQ(dt){
  var guard = 0;
  while(Q.length && guard++ < 400){
    var q = Q[0];
    q.t += dt;
    if(q.t >= q.d){ Q.shift(); dt = q.t - q.d; if(q.fn) q.fn(); }
    else break;
  }
}
function clearQ(){ Q.length = 0; }

/* ==========================================================================
   BATTLE ENGINE
   ========================================================================== */
function dist(a,b){ return Math.abs(a.pos-b.pos); }
function inRangeD(d, r){ return d>=r[0] && d<=r[1]; }
function unitAt(pos){
  if(!B) return null;
  if(B.p.pos===pos) return B.p;
  for(var i=0;i<B.es.length;i++) if(!B.es[i].dead && B.es[i].pos===pos) return B.es[i];
  return null;
}
function occupied(pos){ return !!unitAt(pos); }
function alive(){ var o=[]; for(var i=0;i<B.es.length;i++) if(!B.es[i].dead) o.push(B.es[i]); return o; }
function onCover(u){ return B.cover.indexOf(u.pos) >= 0; }

/* --- movement --------------------------------------------------------- */
function handHas(id){
  if(!B) return false;
  for(var i=0;i<B.hand.length;i++) if(B.hand[i].id===id) return true;
  return false;
}
function moveUnit(u, dir, steps, jump){
  if(st(u,'root')>0){ if(u===B.p) fxText(tileX(u.pos), laneY()-70, 'PINNED', P.faint, 20); return 0; }
  if(u===B.p && handHas('leadweight')){ fxText(tileX(u.pos), laneY()-70, 'LEAD WEIGHT', P.faint, 20); return 0; }
  var moved = 0;
  for(var i=0;i<steps;i++){
    var np = u.pos + dir;
    if(np<0 || np>=LANE) break;
    if(occupied(np)){
      if(!jump) break;
      // jump: look for the next free tile beyond
      var k = np, found = -1;
      while(k>=0 && k<LANE){ if(!occupied(k)){ found=k; break; } k+=dir; }
      if(found<0) break;
      moved += Math.abs(found-u.pos); u.pos = found; i = steps; break;
    }
    u.pos = np; moved++;
  }
  if(moved>0 && u===B.p){ B.movedThisTurn += moved; trig('onMove', moved); }
  return moved;
}
function stepToward(e, maxSteps){
  var d = sign(B.p.pos - e.pos);
  if(d===0) return 0;
  return moveUnit(e, d, maxSteps, false);
}
function stepAway(e, maxSteps){
  var d = -sign(B.p.pos - e.pos);
  if(d===0) d = e.pos < LANE/2 ? 1 : -1;
  return moveUnit(e, d, maxSteps, false);
}

/* --- damage ------------------------------------------------------------ */
function atkPower(src, base){
  var d = base + st(src,'str');
  if(st(src,'weak')>0) d = Math.floor(d*0.75);
  return Math.max(0, d);
}
function unitX(u){ return tileX(u.pos); }

/* deal attack damage. src may be null for non-attack sources (poison etc) */
function dealDmg(src, tgt, base, opt){
  opt = opt || {};
  if(tgt.dead || B.over) return 0;
  var d = base;
  if(src && !opt.pure) d = atkPower(src, base);
  if(!opt.pure){
    if(st(tgt,'vuln')>0) d = Math.floor(d*1.5);
    d += st(tgt,'mark');
    if(src === B.p){
      var rg = dist(src,tgt);
      if(st(tgt,'mark')>0) d += pw('brand');
      if(pw('sights') && rg>=4) d += pw('sights');
      if(pw('close') && rg<=1) d += pw('close');
      d += heatBonus();
    }
    if(src) { var m = trigMod('modDamageDealt', d, src, tgt, opt); d = m; }
    var rangeUsed = src ? dist(src,tgt) : 0;
    if(onCover(tgt) && rangeUsed>=2) d = Math.max(0, d-3);
  }
  d = Math.max(0, Math.round(d));

  // dodge
  if(src && !opt.pure && st(tgt,'dodge')>0){
    addst(tgt,'dodge',-1);
    fxText(unitX(tgt), laneY()-96, 'MISS', P.sky, 26);
    return 0;
  }

  var absorbed = Math.min(tgt.block, d);
  tgt.block -= absorbed;
  var hpDmg = d - absorbed;
  if(hpDmg>0){
    tgt.hp -= hpDmg;
    tgt.hitT = 0.28;
    fxText(unitX(tgt), laneY()-100, '-'+hpDmg, tgt===B.p?P.blood:P.gold, tgt===B.p?30:28);
    if(tgt===B.p){ fxShake(9); trig('onPlayerDamaged', hpDmg); }
    else fxPuff(unitX(tgt), laneY()-46, 5, P.blood, 90);
  } else if(d>0){
    fxText(unitX(tgt), laneY()-100, '-'+d, P.sky, 22);
  } else {
    fxText(unitX(tgt), laneY()-100, 'BLOCKED', P.sky, 18);
  }
  B.log.push((src===B.p?'You':(src?src.name:'—'))+' hit '+(tgt===B.p?'you':tgt.name)+' for '+d);

  // retaliation (barbs) — only melee
  if(src && !opt.noRetal && st(tgt,'retal')>0 && dist(src,tgt)<=1 && !src.dead){
    dealDmg(null, src, st(tgt,'retal'), {pure:true, noRetal:true});
  }
  if(tgt===B.p && src && !src.dead && B.counter>0 && !opt.noRetal){
    var cd = B.counter; B.counter = 0;
    fxText(unitX(src), laneY()-140, 'COUNTER', P.brass, 20);
    dealDmg(null, src, cd, {pure:true, noRetal:true});
  }
  if(tgt.hp<=0) killUnit(tgt);
  if(src===B.p && !opt.noHooks) trig('onAttackDealt', tgt, d);
  return d;
}
function loseHp(u, n){
  if(n<=0 || u.dead) return;
  u.hp -= n; u.hitT = 0.28;
  fxText(unitX(u), laneY()-100, '-'+n, P.moss, 24);
  if(u.hp<=0) killUnit(u);
}
function healUnit(u,n){
  if(u.dead || n<=0) return;
  var before = u.hp;
  u.hp = Math.min(u.maxHp, u.hp+n);
  if(u.hp>before) fxText(unitX(u), laneY()-100, '+'+(u.hp-before), P.moss, 24);
}
function gainBlock(u, n){
  if(n<=0) return 0;
  n += st(u,'dex');
  if(st(u,'frail')>0) n = Math.floor(n*0.75);
  n = Math.max(0,n);
  u.block += n;
  if(n>0) fxText(unitX(u), laneY()-124, '+'+n+' blk', P.sky, 20);
  return n;
}
function killUnit(u){
  if(u===B.p){
    if(hasTrink('halo') && !G.haloUsed){
      G.haloUsed = true;
      u.hp = Math.max(1, Math.round(u.maxHp*0.3));
      fxText(unitX(u), laneY()-190, 'THE HALO HOLDS', P.gold, 26);
      fxFlash(unitX(u), laneY()-50, 60, P.gold, 0.6);
      return;
    }
    u.hp = 0; B.over = 'lose'; return;
  }
  u.dead = true; u.hp = 0;
  fxPuff(unitX(u), laneY()-50, 22, P.rust, 150);
  fxText(unitX(u), laneY()-120, 'DOWN', P.rust, 26);
  B.log.push(u.name+' is down.');
  trig('onKill', u);
  if(alive().length===0 && !B.over) B.over = 'win';
}
function applyStatus(u, key, n){
  if(u.dead || n===0) return;
  if(u !== B.p) n = trigMod('modStatus', n, u, key);
  addst(u,key,n);
  if(ST[key]) fxText(unitX(u), laneY()-150, ST[key].n+(n>0?' +'+n:' '+n), ST[key].c, 18);
}

/* --- card piles -------------------------------------------------------- */
function drawCards(n){
  for(var i=0;i<n;i++){
    if(B.hand.length >= 10){ fxText(W/2, H-330, 'HAND FULL', P.rust, 22); break; }
    if(B.draw.length===0){
      if(B.discard.length===0) break;
      B.draw = shuffle(B.discard); B.discard = [];
    }
    var c = B.draw.pop();
    B.hand.push(c);
    c.animT = 0;
    trig('onDraw', c);
  }
}
function discardCard(c){ B.discard.push(c); }
function exhaustCard(c){ B.exhaust.push(c); trig('onExhaust', c); }
function addCardToHand(defId, up){
  if(B.hand.length>=10) return;
  var c = mkCard(defId, up); c.temp = true; B.hand.push(c);
}
function addCardToDraw(defId, up, top){
  var c = mkCard(defId, up); c.temp = true;
  if(top) B.draw.push(c); else B.draw.splice(Math.floor(rnd()*(B.draw.length+1)),0,c);
}
function addCardToDiscard(defId, up){ var c = mkCard(defId, up); c.temp = true; B.discard.push(c); }

/* --- class resources --------------------------------------------------- */
function chambers(){ return B.p.chambers|0; }
function reload(n){
  if(G.cls!=='marshal') return;
  var before = B.p.chambers;
  B.p.chambers = clamp(B.p.chambers + n, 0, B.p.maxChambers);
  if(B.p.chambers>before){ fxText(unitX(B.p), laneY()-170, 'RELOAD', P.brass, 20); trig('onReload', B.p.chambers-before); }
}
function spendChamber(n){
  B.p.chambers = clamp(B.p.chambers-n, 0, B.p.maxChambers);
  if(B.p.chambers===0 && pw('deadman') && !B.deadmanUsed){
    B.deadmanUsed = true;
    B.energy += pw('deadman');
    fxText(unitX(B.p), laneY()-190, 'CLICK. +2', P.gold, 22);
  }
}
function heatCap(){ return 6 + pw('sink'); }
function addHeat(n){
  if(G.cls!=='boiler') return;
  var before = B.p.heat;
  B.p.heat = clamp(B.p.heat+n, 0, 14);
  var gained = B.p.heat - before;
  if(gained>0){
    fxText(unitX(B.p), laneY()-170, 'HEAT +'+gained, P.rust, 18);
    if(pw('molten')){
      var l = alive();
      for(var i=0;i<l.length;i++) if(dist(B.p,l[i])<=2) dealDmg(null, l[i], pw('molten'), {pure:true});
    }
  }
}
function ventHeat(){
  if(G.cls!=='boiler') return;
  var cap = heatCap();
  if(B.p.heat > cap){
    var over = B.p.heat - cap;
    fxText(unitX(B.p), laneY()-200, 'OVERPRESSURE', P.rust, 20);
    dealDmg(null, B.p, over, {pure:true});
    B.p.heat = Math.max(0, B.p.heat - 4);
  }
}
function heatBonus(){ return G.cls==='boiler' ? Math.floor(B.p.heat/3)*(1+pw('vessel')) : 0; }

/* --- trinket hooks ------------------------------------------------------ */
function trig(name){
  if(!G) return;
  var args = Array.prototype.slice.call(arguments,1);
  for(var i=0;i<G.trinkets.length;i++){
    var t = TRINK[G.trinkets[i]];
    if(t && t[name]){
      try { t[name].apply(null, args); } catch(e){ console.error('trinket '+t.id+'.'+name, e); }
    }
  }
}
function trigMod(name, val){
  if(!G) return val;
  var rest = Array.prototype.slice.call(arguments,2);
  for(var i=0;i<G.trinkets.length;i++){
    var t = TRINK[G.trinkets[i]];
    if(t && t[name]){
      try { val = t[name].apply(null, [val].concat(rest)); } catch(e){ console.error(e); }
    }
  }
  return val;
}
function hasTrink(id){ return G && G.trinkets.indexOf(id)>=0; }

/* --- turn flow ---------------------------------------------------------- */
function startBattle(enc){
  var p = {
    isP:true, name:'You', pos: 2, hp:G.hp, maxHp:G.maxHp, block:0, st:{}, dead:false, hitT:0,
    chambers: G.cls==='marshal' ? (G.maxChambers||6) : 0, maxChambers: G.maxChambers||6,
    heat: 0, pw:{}
  };
  B = {
    p:p, es:[], hand:[], draw:[], discard:[], exhaust:[],
    energy:0, maxEnergy:G.maxEnergy||3, turn:0, over:null, log:[],
    cover:[], movedThisTurn:0, cardsPlayed:0, attacksThisTurn:0, drawBonus:0,
    enc: enc, sel:-1, reward:null, firstTurn:true, blockKeep:false, ended:false
  };
  // terrain: 1-2 cover tiles, never on a starting position
  var covers = enc.cover===undefined ? rint(1,2) : enc.cover;
  var tries = 0;
  while(B.cover.length<covers && tries++<40){
    var t = rint(1, LANE-2);
    if(t!==p.pos && B.cover.indexOf(t)<0) B.cover.push(t);
  }
  // spawn enemies right-to-left
  var slots = [];
  for(var i=0;i<enc.foes.length;i++){
    var want = LANE-1-i*1;
    slots.push(want);
  }
  for(var i=0;i<enc.foes.length;i++){
    var def = FOE[enc.foes[i]];
    var e = mkFoe(def, slots[i]);
    B.es.push(e);
  }
  // build draw pile
  var d = [];
  for(var i=0;i<G.deck.length;i++) d.push(cloneCard(G.deck[i]));
  B.draw = shuffle(d);
  // innate cards to the top
  var innates = [];
  for(var i=B.draw.length-1;i>=0;i--){ if(CD(B.draw[i]).innate){ innates.push(B.draw.splice(i,1)[0]); } }
  for(var i=0;i<innates.length;i++) B.draw.push(innates[i]);

  clearQ(); FX.length = 0;
  SCREEN = 'battle';
  B.log.push('— '+(enc.name||'Ambush')+' —');
  trig('onBattleStart');
  for(var i=0;i<B.es.length;i++) chooseIntent(B.es[i]);
  startPlayerTurn();
}
function mkFoe(def, pos){
  var hp = rint(def.hp[0], def.hp[1]);
  if(G.ascension) hp = Math.round(hp*1.15);
  var e = {
    isP:false, def:def, id:def.id, name:def.name, art:def.art, kind:def.kind||'normal',
    pos:pos, hp:hp, maxHp:hp, block:0, st:{}, dead:false, hitT:0,
    mi:0, intent:null, mem:{}, col:def.col||P.rust, scale:def.scale||1
  };
  if(def.init) def.init(e);
  return e;
}
function startPlayerTurn(){
  if(B.over) return;
  B.turn++;
  B.movedThisTurn = 0; B.cardsPlayed = 0; B.attacksThisTurn = 0;
  if(!B.blockKeep) B.p.block = 0;
  B.blockKeep = false;
  B.energy = B.maxEnergy + (B.bonusEnergy||0);
  // start of turn ticks
  if(st(B.p,'poison')>0){ var pz = st(B.p,'poison'); loseHp(B.p, pz); addst(B.p,'poison',-1); }
  if(st(B.p,'regen')>0){ healUnit(B.p, st(B.p,'regen')); addst(B.p,'regen',-1); }
  if(B.over){ finishBattle(); return; }
  // the dust rises: nothing on this line is allowed to stand still forever
  if(B.turn > 45){
    var l = alive();
    for(var i=0;i<l.length;i++) addst(l[i],'str',2);
    if(B.turn===46) fxText(W/2, 150, 'THE DUST RISES', P.rust, 30, -10);
  }
  if(pw('furnace')) addHeat(2*pw('furnace'));
  B.counter = 0; B.deadmanUsed = false;
  trig('onTurnStart', B.turn);
  drawCards(5 + B.drawBonus + pw('bandolier'));
  B.firstTurn = false;
  B.phase = 'player';
}
function endPlayerTurn(){
  if(B.over || B.phase!=='player') return;
  B.phase = 'resolving';
  B.sel = -1;
  trig('onTurnEnd');
  // curses that bite while held
  var gd = 0;
  for(var i=0;i<B.hand.length;i++) if(B.hand[i].id==='gravedust') gd += 2;
  if(gd>0) dealDmg(null,B.p,gd,{pure:true});
  // burn
  if(st(B.p,'burn')>0){ dealDmg(null,B.p, st(B.p,'burn'), {pure:true}); addst(B.p,'burn',-1); }
  ventHeat();
  // discard hand
  for(var i=B.hand.length-1;i>=0;i--){
    var c = B.hand[i];
    var d = CD(c);
    if(d.ethereal){ B.hand.splice(i,1); exhaustCard(c); continue; }
    if(d.retain || c.retain){ continue; }
    B.hand.splice(i,1); discardCard(c);
  }
  decayStatuses(B.p);
  if(B.over){ finishBattle(); return; }
  queue(function(){ enemyTurn(); }, 0.25);
}
function decayStatuses(u){
  for(var k in u.st){
    if(ST[k] && !ST[k].p && k!=='poison' && k!=='regen' && k!=='burn'){
      addst(u,k,-1);
    }
  }
}
function enemyTurn(){
  if(B.over){ finishBattle(); return; }
  var list = alive();
  for(var i=0;i<list.length;i++){
    (function(e){
      queue(function(){
        if(B.over || e.dead) return;
        e.block = 0;
        if(st(e,'poison')>0){ var pz=st(e,'poison'); loseHp(e,pz); addst(e,'poison',-1); }
        if(e.dead || B.over) return;
        if(st(e,'stun')>0){
          addst(e,'stun',-1);
          fxText(unitX(e), laneY()-150, 'REELING', P.gold, 20);
          decayStatuses(e); chooseIntent(e); return;
        }
        e.actT = 0.3;
        resolveIntent(e);
        if(st(e,'burn')>0 && !e.dead){ dealDmg(null,e,st(e,'burn'),{pure:true}); addst(e,'burn',-1); }
        decayStatuses(e);
        if(!e.dead) chooseIntent(e);
      }, 0.5);
    })(list[i]);
  }
  queue(function(){
    if(B.over){ finishBattle(); return; }
    trig('onEnemyTurnEnd');
    startPlayerTurn();
  }, 0.35);
}
function chooseIntent(e){
  var m;
  if(e.def.ai) m = e.def.ai(e);
  else { m = e.def.moves[e.mi % e.def.moves.length]; e.mi++; }
  e.intent = m;
}
function resolveIntent(e){
  var m = e.intent;
  if(!m) return;
  if(m.kind==='attack'){
    var d = dist(e, B.p);
    if(!inRangeD(d, m.rng) && m.step){
      // close the gap (or back up if too close)
      if(d > m.rng[1]) stepToward(e, m.step);
      else if(d < m.rng[0]) stepAway(e, m.step);
      d = dist(e, B.p);
    }
    if(inRangeD(d, m.rng)){
      var hits = m.hits||1;
      for(var i=0;i<hits;i++){
        if(B.over) break;
        fxLine(unitX(e), laneY()-46, unitX(B.p), laneY()-46, m.rng[1]>1?P.gold:P.rust, 0.2, m.rng[1]>1?2:5);
        dealDmg(e, B.p, m.dmg);
      }
      if(m.on) m.on(e);
    } else {
      fxText(unitX(e), laneY()-150, 'OUT OF REACH', P.faint, 20);
      B.log.push(e.name+' cannot reach you.');
      if(pw('standoff')) drawCards(pw('standoff'));
      if(pw('standoff')) gainBlock(B.p, 2*pw('standoff'));
      if(m.miss) m.miss(e);
    }
  } else if(m.kind==='defend'){
    gainBlock(e, m.block||0);
    if(m.on) m.on(e);
  } else if(m.kind==='move'){
    if(m.on) m.on(e); else stepToward(e, m.step||1);
  } else {
    if(m.on) m.on(e);
  }
}
function finishBattle(){
  if(B.ended) return;
  B.ended = true;
  clearQ();
  if(B.over==='win'){
    G.hp = B.p.hp;
    trig('onBattleWin');
    queue(function(){ battleReward(); }, 0.5);
  } else {
    G.hp = 0;
    queue(function(){ SCREEN='gameover'; }, 0.8);
  }
}

/* --- playing cards ------------------------------------------------------ */
function cardCost(c){
  var d = CD(c);
  var cost = c.costOverride!==undefined ? c.costOverride : num(c,'cost');
  cost = trigMod('modCost', cost, c);
  if(d.costFn) cost = d.costFn(c, cost);
  return Math.max(0, cost);
}
function cardAmmo(c){ var d=CD(c); return d.ammo|0; }
function validTargets(c){
  var d = CD(c);
  if(d.targets!=='enemy') return [];
  var r = cardRange(c), o = [], list = alive();
  for(var i=0;i<list.length;i++){ if(inRangeD(dist(B.p,list[i]), r)) o.push(list[i]); }
  return o;
}
function cardRange(c){
  var d = CD(c);
  var r = (c.up && d.u && d.u.range) ? d.u.range : (d.range || [1,99]);
  r = trigMod('modRange', r.slice(), c);
  if(pw('scope') && d.type==='attack' && r[1] < 90) r[1] += pw('scope');
  return r;
}
function canPlay(c){
  var d = CD(c);
  if(d.unplayable) return false;
  if(B.energy < cardCost(c)) return false;
  if(cardAmmo(c) > chambers() && G.cls==='marshal') return false;
  if(d.targets==='enemy' && validTargets(c).length===0) return false;
  if(d.playable && !d.playable(c)) return false;
  return true;
}
function playCard(idx, target){
  if(B.phase!=='player' || B.over) return false;
  var c = B.hand[idx];
  if(!c || !canPlay(c)) return false;
  var d = CD(c);
  if(d.targets==='enemy'){
    var vt = validTargets(c);
    if(!target || target.dead || vt.indexOf(target)<0) target = vt[0];
    if(!target) return false;
  }
  var cost = cardCost(c);
  B.energy -= cost;
  if(cardAmmo(c)) spendChamber(cardAmmo(c));
  B.hand.splice(idx,1);
  B.cardsPlayed++;
  if(d.type==='attack') B.attacksThisTurn++;
  B.playing = c;
  trig('onPlayCard', c);
  try { d.play(c, target); } catch(e){ console.error('card '+d.id, e); }
  B.playing = null;
  if(d.type==='power' || d.exhaust || c.exhaustNow) exhaustCard(c);
  else if(c.temp && d.vanish) exhaustCard(c);
  else discardCard(c);
  if(!B.over && alive().length===0) B.over='win';
  if(B.over) finishBattle();
  return true;
}

/* ==========================================================================
   CARDS
   ========================================================================== */
var CARD = {}, ALL_CARDS = [], UID = 0;
function C(o){
  if(!o.n) o.n = {};
  CARD[o.id] = o; ALL_CARDS.push(o); return o;
}
function mkCard(id, up){ return {id:id, up:!!up, uid:++UID}; }
function cloneCard(c){ return {id:c.id, up:c.up, uid:++UID}; }
function CD(c){ return CARD[c.id]; }
function num(c,k){
  var d = CD(c);
  if(k==='cost') return (c.up && d.u && d.u.cost!==undefined) ? d.u.cost : d.cost;
  if(c.up && d.u && d.u[k]!==undefined) return d.u[k];
  return d.n && d.n[k]!==undefined ? d.n[k] : 0;
}
function cardName(c){ return CD(c).name + (c.up?'+':''); }

/* ---- helpers for card effects ---- */
function nearestEnemy(){
  var l = alive(), best=null, bd=99;
  for(var i=0;i<l.length;i++){ var d=dist(B.p,l[i]); if(d<bd){bd=d;best=l[i];} }
  return best;
}
function towardDir(){ var n=nearestEnemy(); if(!n) return 1; return sign(n.pos-B.p.pos)||1; }
function awayDir(){ return -towardDir(); }
function advance(n, jump){ return moveUnit(B.p, towardDir(), n, jump); }
function fallBack(n, jump){ return moveUnit(B.p, awayDir(), n, jump); }
function foesWithin(r){ var l=alive(), o=[]; for(var i=0;i<l.length;i++) if(dist(B.p,l[i])<=r) o.push(l[i]); return o; }
function foesBeyond(r){ var l=alive(), o=[]; for(var i=0;i<l.length;i++) if(dist(B.p,l[i])>=r) o.push(l[i]); return o; }
function pull(e, n){ // drag a foe toward the player
  var d = sign(B.p.pos - e.pos);
  if(d===0) return 0;
  var moved = 0;
  for(var i=0;i<n;i++){
    var np = e.pos + d;
    if(np===B.p.pos || np<0 || np>=LANE || occupied(np)) break;
    e.pos = np; moved++;
  }
  if(moved) fxText(unitX(e), laneY()-170, 'DRAGGED', P.brass, 18);
  return moved;
}
function push(e, n){
  var d = -sign(B.p.pos - e.pos) || 1;
  var moved = 0;
  for(var i=0;i<n;i++){
    var np = e.pos + d;
    if(np<0 || np>=LANE || occupied(np)) break;
    e.pos = np; moved++;
  }
  return moved;
}
function behind(t){ // the foe on the far side of t from the player
  var d = sign(t.pos - B.p.pos) || 1;
  var l = alive(), best=null, bd=99;
  for(var i=0;i<l.length;i++){
    var e=l[i]; if(e===t) continue;
    if(sign(e.pos-t.pos)===d){ var dd=Math.abs(e.pos-t.pos); if(dd<bd){bd=dd;best=e;} }
  }
  return best;
}
function hitAll(list, dmg){ for(var i=0;i<list.length;i++) dealDmg(B.p, list[i], dmg); }
function shot(t, dmg, times){
  times = times||1;
  for(var i=0;i<times;i++){
    if(t.dead) break;
    fxLine(unitX(B.p), laneY()-52, unitX(t), laneY()-52, P.gold, 0.18, 3);
    dealDmg(B.p, t, dmg);
  }
}

/* card pools by class */
function poolFor(cls, rarity){
  var o = [];
  for(var i=0;i<ALL_CARDS.length;i++){
    var d = ALL_CARDS[i];
    if(d.rarity!==rarity) continue;
    if(d.cls!=='any' && d.cls!==cls) continue;
    o.push(d.id);
  }
  return o;
}
function starterDeck(cls){
  var d = [], i;
  if(cls==='marshal'){
    for(i=0;i<4;i++) d.push(mkCard('sixgun'));
    for(i=0;i<3;i++) d.push(mkCard('brace'));
    d.push(mkCard('reload')); d.push(mkCard('reload'));
    d.push(mkCard('pistolwhip'));   // the answer to a foe in your face
    d.push(mkCard('sidestep'));     // ...or the way out of it
  } else {
    for(i=0;i<4;i++) d.push(mkCard('pistonjab'));
    for(i=0;i<3;i++) d.push(mkCard('plateup'));
    d.push(mkCard('stoke')); d.push(mkCard('stoke'));
    d.push(mkCard('heave'));
    d.push(mkCard('sidestep'));
  }
  return d;
}
/* weighted random card of a run-appropriate rarity */
function rollCard(cls, biasRare){
  var r = rnd() + (biasRare||0);
  var rar = r>0.92 ? 'rare' : (r>0.62 ? 'uncommon' : 'common');
  var p = poolFor(cls, rar);
  if(!p.length) p = poolFor(cls,'common');
  return pick(p);
}
function cardRewardChoices(cls, n, biasRare){
  var out = [], guard = 0;
  while(out.length<n && guard++<200){
    var id = rollCard(cls, biasRare);
    var dup = false;
    for(var i=0;i<out.length;i++) if(out[i].id===id) dup = true;
    if(!dup) out.push(mkCard(id));
  }
  return out;
}

function trinketPool(rar){
  var o = [];
  for(var i=0;i<TRINK_LIST.length;i++){
    var t = TRINK_LIST[i];
    if(t.rar!==rar) continue;
    if(G.trinkets.indexOf(t.id)>=0) continue;
    o.push(t.id);
  }
  return o;
}
function rollTrinket(rar){
  if(!rar){ var r=rnd(); rar = r>0.85?'rare':(r>0.5?'uncommon':'common'); }
  var p = trinketPool(rar);
  if(!p.length) p = trinketPool('common');
  if(!p.length) p = trinketPool('uncommon');
  if(!p.length) p = trinketPool('rare');
  return p.length ? pick(p) : null;
}
function giveTrinket(id){
  if(!id || G.trinkets.indexOf(id)>=0) return;
  G.trinkets.push(id);
  var t = TRINK[id];
  if(t.pickup) t.pickup();
  G.hp = clamp(G.hp, 1, G.maxHp);
}

function useTonic(i){

   BESTIARY
   ========================================================================== */
var FOE = {};
function F(o){ FOE[o.id]=o; return o; }
function atk(name,dmg,rng,step,hits,on){ return {kind:'attack',name:name,dmg:dmg,rng:rng,step:step||0,hits:hits||1,on:on}; }
function def(name,block,on){ return {kind:'defend',name:name,block:block,on:on}; }
function act(name,on,icon){ return {kind:'act',name:name,on:on,icon:icon||'buff'}; }
function mv(name,on){ return {kind:'move',name:name,on:on}; }
function pullPlayer(e,n){
  var d = sign(e.pos - B.p.pos); if(d===0) return;
  for(var i=0;i<n;i++){
    var np = B.p.pos + d;
    if(np<0||np>=LANE||occupied(np)) break;
    B.p.pos = np;
  }
  fxText(unitX(B.p), laneY()-170, 'HAULED IN', P.rust, 18);
}
function pushPlayer(e,n){
  var d = -sign(e.pos - B.p.pos) || 1;
  for(var i=0;i<n;i++){
    var np = B.p.pos + d;
    if(np<0||np>=LANE||occupied(np)) break;
    B.p.pos = np;
  }
}
function spawnFoe(id, near){
  if(alive().length >= 5) return null;
  var order = [];
  for(var i=0;i<LANE;i++) order.push(i);
  order.sort(function(a,b){ return Math.abs(a-near)-Math.abs(b-near); });
  for(var i=0;i<order.length;i++){
    if(!occupied(order[i])){
      var e = mkFoe(FOE[id], order[i]);
      B.es.push(e); chooseIntent(e);
      fxPuff(tileX(e.pos), laneY()-40, 12, P.plum, 110);
      return e;
    }
  }
  return null;
}
function allyHeal(e,n){
  var l = alive();
  for(var i=0;i<l.length;i++) if(l[i]!==e) healUnit(l[i],n);
}
function buffAllies(e,k,n){
  var l = alive();
  for(var i=0;i<l.length;i++) if(l[i]!==e) applyStatus(l[i],k,n);
}

   RUN + MAP
   ========================================================================== */
var ROWS = 15, COLS = 6;
var ACTNAME = {1:'I — THE FLATS', 2:'II — THE BONEYARD', 3:'III — THE TERMINUS'};
var ACTSUB = {1:'Sun-bleached track. Coyotes and men who act like them.',
              2:'Where the line runs through the buried. Nothing here stayed down.',
              3:'Company iron. The Ox is stoked and waiting at the end of the rail.'};

function genMap(act){
  var grid = [], nodes = [], r, c;
  for(r=0;r<ROWS;r++) grid.push(new Array(COLS));
  function ensure(r,c){
    if(!grid[r][c]){ grid[r][c] = {r:r,c:c,type:null,to:[],id:nodes.length,done:false}; nodes.push(grid[r][c]); }
    return grid[r][c];
  }
  function edgeExists(r,a,b){
    var n = grid[r][a];
    return n && n.to.indexOf(grid[r+1][b] ? grid[r+1][b].id : -1) >= 0;
  }
  var paths = 6;
  for(var p=0;p<paths;p++){
    var cc = rint(0,COLS-1);
    var cur = ensure(0,cc);
    for(r=1;r<ROWS;r++){
      var nc;
      if(r===ROWS-1) nc = 2;
      else {
        nc = clamp(cur.c + rint(-1,1), 0, COLS-1);
        // avoid crossing an existing diagonal edge
        if(nc !== cur.c && grid[r-1][nc] && grid[r][cur.c] && edgeExists(r-1, nc, cur.c)) nc = cur.c;
      }
      var nx = ensure(r,nc);
      if(cur.to.indexOf(nx.id)<0) cur.to.push(nx.id);
      cur = nx;
    }
  }
  // assign node types
  for(var i=0;i<nodes.length;i++){
    var n = nodes[i];
    if(n.r===0){ n.type='easy'; continue; }
    if(n.r===ROWS-1){ n.type='boss'; continue; }
    if(n.r===ROWS-2){ n.type='rest'; continue; }
    if(n.r===8){ n.type='chest'; continue; }
    if(n.r<=3){ n.type = chance(0.65) ? 'battle' : 'event'; continue; }
    var roll = rnd();
    if(roll<0.36) n.type='battle';
    else if(roll<0.58) n.type='event';
    else if(roll<0.74) n.type='elite';
    else if(roll<0.82) n.type='shop';
    else n.type='rest';
  }
  return {nodes:nodes, act:act, cur:-1, row:-1};
}
function mapNodes(){ return G.map.nodes; }
function availableNodes(){
  if(G.map.cur<0){
    var o=[];
    for(var i=0;i<G.map.nodes.length;i++) if(G.map.nodes[i].r===0) o.push(G.map.nodes[i]);
    return o;
  }
  var cur = G.map.nodes[G.map.cur], out=[];
  for(var i=0;i<cur.to.length;i++) out.push(G.map.nodes[cur.to[i]]);
  return out;
}

/* ---------------------------------------------------------------- new run */
function newRun(cls, seed){
  seed = seed===undefined ? (Math.floor(Math.random()*0x7fffffff)) : seed;
  rng = mkRng(seed);
  G = {
    seed:seed, cls:cls,
    maxHp: cls==='marshal' ? 72 : 84,
    hp: 0, gold: 99, maxEnergy:3, maxChambers:6,
    deck: starterDeck(cls), trinkets:[], tonics:[], maxTonics:3,
    act:1, map:null, haloUsed:false, kills:0, elites:0,
    removals:0, shopCards:null, hist:[], won:false, turnsTotal:0
  };
  G.hp = G.maxHp;
  giveTrinket(cls==='marshal' ? 'casing' : 'spurs');
  G.map = genMap(1);
  SCREEN = 'map';
  save();
}
function nextAct(){
  G.act++;
  if(G.act>3){ SCREEN='victory'; G.won=true; save(); return; }
  G.map = genMap(G.act);
  SCREEN = 'map';
  save();
}

/* -------------------------------------------------------------- node flow */
function enterNode(n){
  G.map.cur = n.id; G.map.row = n.r;
  n.done = true;
  G.curNode = n;
  save();
  if(n.type==='easy' || n.type==='battle'){
    var pool = ENC[G.act][ n.type==='easy' || n.r<=2 ? 'easy' : 'hard' ];
    var e = pick(pool);
    startBattle({name:e.name, foes:e.foes.slice(), tier: n.r<=2?'easy':'hard'});
  } else if(n.type==='elite'){
    var e2 = pick(ENC[G.act].elite);
    startBattle({name:e2.name, foes:e2.foes.slice(), tier:'elite'});
  } else if(n.type==='boss'){
    var e3 = pick(ENC[G.act].boss);
    startBattle({name:e3.name, foes:e3.foes.slice(), tier:'boss', cover:2});
  } else if(n.type==='shop'){
    openShop();
  } else if(n.type==='rest'){
    SCREEN = 'rest'; REST = {done:false};
  } else if(n.type==='chest'){
    CHEST = {opts:[rollTrinket(chance(0.5)?'uncommon':'common'), rollTrinket('uncommon'), rollTrinket('rare')], taken:false};
    CHEST.opts = uniq(CHEST.opts.filter(function(x){return !!x;}));
    SCREEN = 'chest';
  } else if(n.type==='event'){
    startEvent();
  }
}

var REWARD = null, REST = null, CHEST = null, SHOP = null, EVT = null, PICK = null;
function battleReward(){
  var tier = B.enc.tier || 'easy';
  var gold = tier==='boss' ? rint(95,120) : tier==='elite' ? rint(45,65) : tier==='hard' ? rint(20,30) : rint(12,20);
  if(hasTrink('ledger')) gold += 15;
  G.kills++;
  if(tier==='elite') G.elites++;
  var items = [];
  items.push({k:'gold', v:gold});
  var bias = tier==='elite' ? 0.12 : (tier==='boss' ? 0.2 : 0);
  items.push({k:'cards', v:cardRewardChoices(G.cls, 3, bias)});
  var pchance = tier==='easy'?0.35:(tier==='hard'?0.45:0.7);
  if(chance(pchance) && G.tonics.length < G.maxTonics) items.push({k:'tonic', v:rollTonic()});
  if(tier==='elite'){ var t=rollTrinket(); if(t) items.push({k:'trinket', v:t}); }
  if(tier==='boss'){
    var bt = trinketPool('boss');
    if(bt.length) items.push({k:'trinketChoice', v:pickN(bt, Math.min(3,bt.length))});
  }
  REWARD = {items:items, taken:[], tier:tier};
  SCREEN = 'reward';
  save();
}
function takeReward(i){
  var it = REWARD.items[i];
  if(!it || REWARD.taken.indexOf(i)>=0) return;
  if(it.k==='gold'){ G.gold += it.v; REWARD.taken.push(i); }
  else if(it.k==='tonic'){
    if(G.tonics.length>=G.maxTonics) return;
    G.tonics.push(it.v); REWARD.taken.push(i);
  }
  else if(it.k==='trinket'){ giveTrinket(it.v); REWARD.taken.push(i); }
  else if(it.k==='cards'){ REWARD.pickIdx = i; SCREEN='cardpick'; }
  else if(it.k==='trinketChoice'){ REWARD.pickIdx = i; SCREEN='trinketpick'; }
  save();
}
function leaveReward(){
  REWARD = null;
  var n = G.curNode;
  if(n && n.type==='boss'){ nextAct(); }
  else SCREEN = 'map';
  save();
}

/* ---------------------------------------------------------------- shop */
function openShop(){
  var cards = [];
  for(var i=0;i<5;i++){
    var id = rollCard(G.cls, i===4?0.25:0);
    var dup=false;
    for(var j=0;j<cards.length;j++) if(cards[j].c.id===id) dup=true;
    if(dup){ i--; continue; }
    var cd = CARD[id];
    var price = cd.rarity==='rare'?rint(140,180):cd.rarity==='uncommon'?rint(85,120):rint(45,70);
    cards.push({c:mkCard(id, chance(0.15)), p:price});
  }
  var tr = [];
  for(var i=0;i<2;i++){
    var t = rollTrinket();
    if(t && !tr.some(function(x){return x.t===t;})){
      var tp = TRINK[t].rar==='rare'?rint(230,300):TRINK[t].rar==='uncommon'?rint(160,210):rint(110,150);
      tr.push({t:t,p:tp});
    }
  }
  var tn = [];
  for(var i=0;i<3;i++) tn.push({t:rollTonic(), p:rint(45,75)});
  SHOP = {cards:cards, trink:tr, tonics:tn, removePrice: 75 + G.removals*25, removed:false};
  SCREEN = 'shop';
  save();
}
function buyCard(i){
  var it = SHOP.cards[i];
  if(!it || it.sold || G.gold < it.p) return;
  G.gold -= it.p; it.sold = true;
  G.deck.push(it.c);
  save();
}
function buyTrink(i){
  var it = SHOP.trink[i];
  if(!it || it.sold || G.gold < it.p) return;
  G.gold -= it.p; it.sold = true; giveTrinket(it.t);
  save();
}
function buyTonic(i){
  var it = SHOP.tonics[i];
  if(!it || it.sold || G.gold < it.p || G.tonics.length>=G.maxTonics) return;
  G.gold -= it.p; it.sold = true; G.tonics.push(it.t);
  save();
}
function buyRemoval(){
  if(SHOP.removed || G.gold < SHOP.removePrice || G.deck.length<=4) return;
  openPicker('BURN A CARD', G.deck, function(idx){
    G.gold -= SHOP.removePrice; SHOP.removed = true; G.removals++;
    G.deck.splice(idx,1);
    SCREEN = 'shop'; save();
  }, function(){ SCREEN='shop'; });
}

function doRest(){
  if(REST.done) return;

  var heal = Math.round(G.maxHp*0.32);

function doSharpen(){
  if(REST.done) return;
  var up = [];

  if(!up.length){ REST.msg='Nothing left to sharpen.'; return; }
  openPicker('SHARPEN A CARD', G.deck, function(idx){
    var c = G.deck[idx];
    if(c.up || CD(c).rarity==='curse'){ return false; }
    c.up = true; REST.done = true;
    REST.msg = cardName(c)+' is honed.';
    SCREEN = 'rest'; save();
  }, function(){ SCREEN='rest'; }, function(c){ return !c.up && CD(c).rarity!=='curse'; });
}
function doDigIn(){
  if(REST.done) return;

  if(G.tonics.length < G.maxTonics){ var t = rollTonic(); G.tonics.push(t); REST.msg='You turn out your pack: '+TONIC[t].name+'.'; }
  else { G.gold += 40; REST.msg='No room in the pack. You bury 40 gold worth of nothing, and take it back. +40 gold.'; }
  save();
}

  if(EVT.pickAfter){ resolveEventPick(EVT.pickAfter); return; }
  EVT.result = r || '...';
  G.hp = clamp(G.hp, 1, G.maxHp);
  save();
}
function resolveEventPick(kind){
  if(kind==='remove' || kind==='removePaid'){
    openPicker('BURN A CARD', G.deck, function(idx){
      if(kind==='removePaid') G.gold -= 50;
      G.deck.splice(idx,1);
      EVT.pickAfter=null; EVT.result = 'It goes in the fire. You do not miss it yet.';
      SCREEN='event'; save();
    }, function(){ EVT.pickAfter=null; EVT.result='You change your mind.'; SCREEN='event'; });
  } else if(kind==='upgrade'){
    openPicker('SHARPEN A CARD', G.deck, function(idx){
      var c=G.deck[idx];
      if(c.up || CD(c).rarity==='curse') return false;
      G.gold -= 80; c.up = true;
      EVT.pickAfter=null; EVT.result = cardName(c)+' comes off her stone with a new edge.';
      SCREEN='event'; save();
    }, function(){ EVT.pickAfter=null; EVT.result='She shrugs and goes back to the fire.'; SCREEN='event'; },
      function(c){ return !c.up && CD(c).rarity!=='curse'; });
  } else if(kind==='transform'){
    openPicker('DIP A CARD', G.deck, function(idx){
      var old = G.deck[idx];
      var id = rollCard(G.cls, 0.15), guard=0;
      while(id===old.id && guard++<30) id = rollCard(G.cls, 0.15);
      G.deck.splice(idx,1,mkCard(id));
      EVT.pickAfter=null; EVT.result = CARD[old.id].name+' comes out of the water as '+CARD[id].name+'.';
      SCREEN='event'; save();
    }, function(){ EVT.pickAfter=null; EVT.result='You keep your hands dry.'; SCREEN='event'; });
  }
}
function leaveEvent(){ EVT=null; SCREEN='map'; save(); }

/* ---------------------------------------------------------------- save */
var SAVEKEY = 'dustline_save_v1';
var METAKEY = 'dustline_meta_v1';
var META = {runs:0, wins:0, best:0, seenTitle:false};
function save(){
  try {
    if(G && !G.won && G.hp>0) localStorage.setItem(SAVEKEY, JSON.stringify(G));
    else localStorage.removeItem(SAVEKEY);
  } catch(e){}
}
function loadSave(){
  try {
    var s = localStorage.getItem(SAVEKEY);
    if(!s) return null;
    var g = JSON.parse(s);
    if(!g || !g.deck || !g.map) return null;
    return g;
  } catch(e){ return null; }
}
function loadMeta(){
  try { var m = JSON.parse(localStorage.getItem(METAKEY)); if(m) META = m; } catch(e){}
}
function saveMeta(){ try{ localStorage.setItem(METAKEY, JSON.stringify(META)); }catch(e){} }
function clearSave(){ try{ localStorage.removeItem(SAVEKEY); }catch(e){} }

function drawMesas(actn){
  ctx.fillStyle = actn===1 ? 'rgba(70,42,28,.75)' : actn===2 ? 'rgba(38,42,38,.8)' : 'rgba(48,28,26,.85)';
  var base = laneY()-88;
  var seed = 7;
  ctx.beginPath(); ctx.moveTo(0,base);
  var x = 0;
  var r2 = mkRng(actn*991+13);
  while(x < W){
    var w = 70+r2()*150, h = 30+r2()*90;
    ctx.lineTo(x, base-h); ctx.lineTo(x+w, base-h*0.9); x += w;
  }
  ctx.lineTo(W,base); ctx.lineTo(W,H); ctx.lineTo(0,H); ctx.closePath(); ctx.fill();
  // second, nearer ridge
  ctx.fillStyle = actn===1 ? 'rgba(48,28,18,.85)' : actn===2 ? 'rgba(26,29,26,.9)' : 'rgba(32,18,18,.9)';
  ctx.beginPath(); ctx.moveTo(0,base+34);
  x = -40; var r3 = mkRng(actn*331+5);

    var w2 = 110+r3()*200, h2 = 14+r3()*44;
    ctx.lineTo(x, base+34-h2); ctx.lineTo(x+w2, base+34-h2*0.7); x += w2;
  }
  ctx.lineTo(W,base+40); ctx.lineTo(W,H); ctx.lineTo(0,H); ctx.closePath(); ctx.fill();
}

function drawStatusRow(u, x, y){
  var keys = [];
  for(var k in u.st){ if(st(u,k)>0 && k!=='root' || (k==='root'&&st(u,k)>0&&st(u,k)<90)) keys.push(k); }
  keys.sort();
  var bw = 30, tot = keys.length*bw;
  for(var i=0;i<keys.length;i++){
    var k = keys[i], m = ST[k]; if(!m) continue;
    var bx = x - tot/2 + i*bw;
    fillRR(bx, y, bw-3, 20, 4, 'rgba(12,9,7,.85)');
    strokeRR(bx, y, bw-3, 20, 4, m.c, 1);
    txtb(m.n.substr(0,1)+st(u,k), bx+(bw-3)/2, y+14, m.c, 12, 'center');
    hot(bx, y, bw-3, 20, 'status', {k:k,u:u});

/* threat: paint the tiles the foe's telegraphed attack can hit */
function drawThreat(){
  var y = laneY();
  var live = alive();
  var threat = {}, soft = {};
  for(var i=0;i<live.length;i++){
    var e = live[i], m = e.intent;
    if(!m || m.kind!=='attack') continue;
    if(st(e,'stun')>0) continue;
    var stp = m.step||0;
    for(var t=0;t<LANE;t++){
      var d = Math.abs(t-e.pos);
      if(d>=m.rng[0] && d<=m.rng[1]) threat[t]=1;
      else {
        // could it step into range?
        var reach = false;
        for(var s2=1;s2<=stp;s2++){
          var d2 = Math.abs(t-(e.pos+s2)), d3=Math.abs(t-(e.pos-s2));
          if((d2>=m.rng[0]&&d2<=m.rng[1]) || (d3>=m.rng[0]&&d3<=m.rng[1])) reach=true;
        }
        if(reach) soft[t]=1;
      }
    }
  }
  for(var t=0;t<LANE;t++){
    var x = tileX(t);
    if(threat[t]){
      ctx.fillStyle='rgba(192,72,58,.20)';
      ctx.fillRect(x-LSTEP/2+2, y-108, LSTEP-4, 112);
      ctx.fillStyle='rgba(192,72,58,.55)';
      ctx.fillRect(x-LSTEP/2+2, y+1, LSTEP-4, 4);
    } else if(soft[t]){
      ctx.fillStyle='rgba(192,120,58,.09)';
      ctx.fillRect(x-LSTEP/2+2, y-108, LSTEP-4, 112);
      ctx.fillStyle='rgba(200,140,70,.35)';
      for(var d4=0; d4<LSTEP-8; d4+=10) ctx.fillRect(x-LSTEP/2+4+d4, y+1, 5, 3);
    }
  }
  // safe tiles marker
  for(var t=0;t<LANE;t++){
    if(!threat[t] && !soft[t]){
      ctx.fillStyle='rgba(135,164,92,.35)';
      ctx.fillRect(tileX(t)-LSTEP/2+2, laneY()+1, LSTEP-4, 3);
    }
  }
}
function drawTargetHint(){
  if(B.sel<0) return;
  var c = B.hand[B.sel]; if(!c) return;
  var d = CD(c);
  if(d.targets!=='enemy' && d.targets!=='none') return;
  var y = laneY();
  if(d.targets==='enemy'){
    var vt = validTargets(c);
    for(var i=0;i<vt.length;i++){

      ctx.strokeStyle='rgba(240,201,107,.9)'; ctx.lineWidth=3;
      ctx.setLineDash([7,5]);
      ctx.strokeRect(x-LSTEP/2+4, y-120, LSTEP-8, 126);
      ctx.setLineDash([]);
    }
    var r = cardRange(c);
    for(var t=0;t<LANE;t++){
      var dd = Math.abs(t-B.p.pos);
      if(dd>=r[0] && dd<=r[1] && t!==B.p.pos){
        ctx.fillStyle='rgba(240,201,107,.13)';

var CW = 156, CH = 214;
function typeColor(t){
  return t==='attack'?'#8c3a2e' : t==='skill'?'#2f5566' : t==='power'?'#5a3f6b' : '#3a3128';
}
function typeEdge(t){
  return t==='attack'?'#d4694f' : t==='skill'?'#6fa6c0' : t==='power'?'#b18ccc' : '#6b5947';
}
function drawCard(c, x, y, w, h, opt){
  opt = opt||{};
  var d = CD(c), sc = w/CW;
  var playable = opt.playable!==false;
  ctx.save();
  ctx.translate(x,y);
  if(opt.rot) ctx.rotate(opt.rot);
  ctx.translate(-w/2,-h/2);
  if(opt.glow){ shadowOn(24, typeEdge(d.type)); }
  else shadowOn(12,'rgba(0,0,0,.8)');
  fillRR(0,0,w,h,10*sc, '#1d1611');
  shadowOff();
  // art band
  var g = lg(0,0,0,h,[[0,typeColor(d.type)],[0.42,'#241b15'],[1,'#161009']]);
  fillRR(3*sc,3*sc,w-6*sc,h-6*sc,8*sc,g);
  // header
  ctx.save(); rr(3*sc,3*sc,w-6*sc,h-6*sc,8*sc); ctx.clip();
  ctx.fillStyle='rgba(0,0,0,.35)'; ctx.fillRect(0,h*0.30,w,h*0.06);
  // decorative silhouette
  ctx.globalAlpha=0.30;
  ctx.fillStyle='#000';
  ctx.beginPath(); ctx.arc(w/2, h*0.30, w*0.28, Math.PI, 0); ctx.fill();
  ctx.globalAlpha=1;
  ctx.restore();
  strokeRR(3*sc,3*sc,w-6*sc,h-6*sc,8*sc, playable?typeEdge(d.type):'#4a3f34', 2*sc);

  // name
  var nm = cardName(c);
  var ns = 15*sc;
  while(measure(nm, ns, true) > w-30*sc && ns>9) ns -= 0.5;
  txtb(nm, w/2, 24*sc, c.up?P.gold:P.ink, ns, 'center');
  // type + range line
  var sub = d.type.toUpperCase();
  if(d.range && d.type==='attack'){
    var r = cardRange(c);
    sub += '  ·  RNG '+(r[0]===r[1]? r[0] : r[0]+'-'+(r[1]>8?'∞':r[1]));
  } else if(d.targets==='none'){ sub += '  ·  AREA'; }
  txt(sub, w/2, h*0.315, 'rgba(240,230,210,.55)', 9.5*sc, 'center');

  // text
  var body = d.text(c);
  var ty = h*0.44;
  var lh = 15.5*sc;
  var lines2 = wrapKeepMarks(body, w-24*sc, 11.5*sc);
  for(var i=0;i<lines2.length;i++) drawRichLine(lines2[i], w/2, ty+i*lh, 11.5*sc, playable?'#e6d9c2':'#8f8071');
  // cost orb
  var cost = B ? cardCost(c) : (c.up && d.u && d.u.cost!==undefined ? d.u.cost : d.cost);
  ctx.fillStyle = '#120d0a';
  ctx.beginPath(); ctx.arc(16*sc,16*sc,14*sc,0,7); ctx.fill();
  ctx.strokeStyle = (B && cost < ((c.up&&d.u&&d.u.cost!==undefined)?d.u.cost:d.cost)) ? P.moss : P.brass;
  ctx.lineWidth=2*sc; ctx.stroke();
  txtb(d.unplayable?'—':cost, 16*sc, 21*sc, P.gold, 16*sc, 'center');
  // ammo pips
  if(d.ammo){
    for(var a=0;a<d.ammo;a++){
      var px = w-14*sc - a*9*sc;
      ctx.fillStyle = (B && G.cls==='marshal' && chambers()<d.ammo) ? '#5a4030' : '#e0b060';
      ctx.beginPath(); ctx.arc(px, 16*sc, 3.2*sc, 0, 7); ctx.fill();
    }
  }
  if(d.exhaust) txt('EXHAUST', w/2, h-10*sc, 'rgba(200,120,90,.75)', 9.5*sc, 'center');
  else if(d.innate) txt('INNATE', w/2, h-10*sc, 'rgba(140,190,140,.7)', 9.5*sc, 'center');
  else if(d.retain) txt('RETAIN', w/2, h-10*sc, 'rgba(140,170,200,.7)', 9.5*sc, 'center');
  if(!playable){ ctx.fillStyle='rgba(8,6,5,.5)'; rr(3*sc,3*sc,w-6*sc,h-6*sc,8*sc); ctx.fill(); }
  ctx.restore();
}
/* like wrap() but keeps the * markers attached to their words */
function wrapKeepMarks(s, maxw, size){
  var words = String(s).split(' '), lines=[], cur='';
  ctx.font = size+'px Georgia, serif';
  function vis(t){ return t.replace(/\*/g,''); }
  for(var i=0;i<words.length;i++){
    var t = cur ? cur+' '+words[i] : words[i];
    if(ctx.measureText(vis(t)).width > maxw && cur){ lines.push(cur); cur = words[i]; }
    else cur = t;
  }
  if(cur) lines.push(cur);
  // balance stray markers per line
  for(var i=0;i<lines.length;i++){
    var n = (lines[i].match(/\*/g)||[]).length;
    if(n%2===1) lines[i] += '*';
  }
  return lines;
}

function handLayout(){
  var n = B.hand.length;
  if(n===0) return [];
  var maxW = 980;
  var step = Math.min(CW+8, maxW/n);
  var totalW = step*(n-1);
  var cx = W/2, baseY = H-96;
  var out = [];
  for(var i=0;i<n;i++){
    var t = n===1?0:(i/(n-1)-0.5);
    var x = cx + (i-(n-1)/2)*step;
    var y = baseY + Math.abs(t)*Math.abs(t)*46;
    var rot = t*0.16;
    out.push({x:x,y:y,rot:rot,i:i});
  }
  return out;
}

var MAPSCROLL = 0;
function nodeXY(n){
  var x = W/2 - (COLS-1)*104/2 + n.c*104 + ((n.r%2)?18:-8);
  var y = H - 118 - n.r*76 + MAPSCROLL;
  return {x:x,y:y};
}
function drawNodeIcon(n, x, y, r, active, done){
  var col = n.type==='elite'? P.blood : n.type==='boss'? '#e05a3a' : n.type==='shop'? P.gold :
            n.type==='rest'? '#e08a4a' : n.type==='chest'? P.brass : n.type==='event'? P.plum : P.dim;
  ctx.fillStyle = done? 'rgba(30,24,18,.9)' : 'rgba(18,13,9,.95)';
  ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill();
  ctx.strokeStyle = active? P.gold : (done? 'rgba(120,100,80,.6)': col);
  ctx.lineWidth = active? 3.5 : 2;
  if(active){ shadowOn(16,P.gold); }
  ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.stroke();
  shadowOff();
  var ic = n.type;
  ctx.save(); ctx.translate(x,y);
  var c2 = done? 'rgba(140,120,100,.7)' : col;
  if(ic==='easy'||ic==='battle'||ic==='elite'||ic==='boss'){
    var s = ic==='boss'?1.5:(ic==='elite'?1.25:1);
    ctx.strokeStyle=c2; ctx.lineWidth=2.4*s;
    ctx.beginPath(); ctx.moveTo(-7*s,7*s); ctx.lineTo(7*s,-7*s); ctx.moveTo(7*s,7*s); ctx.lineTo(-7*s,-7*s); ctx.stroke();
    if(ic==='elite'||ic==='boss'){ ctx.fillStyle=c2; ctx.beginPath(); ctx.arc(0,-1,3.4*s,0,7); ctx.fill(); }
  } else if(ic==='shop'){ txtb('$', 0, 7, c2, 22, 'center'); }
  else if(ic==='rest'){
    ctx.fillStyle=c2; ctx.beginPath();
    ctx.moveTo(0,-10); ctx.quadraticCurveTo(7,-2,4,6); ctx.quadraticCurveTo(0,10,-4,6); ctx.quadraticCurveTo(-7,-2,0,-10); ctx.fill();
  }
  else if(ic==='chest'){ ctx.fillStyle=c2; ctx.fillRect(-9,-6,18,13); ctx.fillStyle='rgba(0,0,0,.5)'; ctx.fillRect(-2,-6,4,13); }
  else { txtb('?', 0, 8, c2, 24, 'center'); }
  ctx.restore();
}
function drawMap(){
  dustBg();
  var nodes = mapNodes();
  var avail = availableNodes();
  // edges
  for(var i=0;i<nodes.length;i++){
    var n = nodes[i], a = nodeXY(n);
    for(var j=0;j<n.to.length;j++){
      var m = nodes[n.to[j]], b = nodeXY(m);
      var lit = (G.map.cur===n.id) || (n.done && m.done);
      ctx.strokeStyle = lit? 'rgba(240,201,107,.55)' : 'rgba(150,120,90,.22)';
      ctx.lineWidth = lit?3:2;
      ctx.setLineDash([8,7]);
      ctx.beginPath(); ctx.moveTo(a.x, a.y-22); ctx.lineTo(b.x, b.y+22); ctx.stroke();
      ctx.setLineDash([]);
    }
  }
  for(var i=0;i<nodes.length;i++){
    var n = nodes[i], p = nodeXY(n);
    if(p.y < 60 || p.y > H-40) continue;
    var isAvail = avail.indexOf(n)>=0;
    var r = n.type==='boss'? 32 : (n.type==='elite'?25:21);
    drawNodeIcon(n, p.x, p.y, r, isAvail, n.done && !isAvail);
    if(G.map.cur===n.id){
      ctx.strokeStyle=P.gold; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(p.x,p.y,r+8,0,7); ctx.stroke();
    }
    if(isAvail) hot(p.x-r-6, p.y-r-6, r*2+12, r*2+12, 'node', n);
  }
  // header
  ctx.fillStyle='rgba(10,8,6,.85)'; ctx.fillRect(0,0,W,72);
  ctx.fillStyle='rgba(217,164,65,.3)'; ctx.fillRect(0,72,W,2);
  txtb('ACT '+ACTNAME[G.act], 22, 32, P.brass, 22);
  txt(ACTSUB[G.act], 22, 56, P.dim, 13);
  // hp / gold
  fillRR(W-330,14,200,26,5,'rgba(0,0,0,.6)');
  fillRR(W-328,16,Math.max(0,196*clamp(G.hp/G.maxHp,0,1)),22,4,'#a8402f');
  txtb(G.hp+' / '+G.maxHp, W-230, 33, P.ink, 14, 'center');
  ctx.fillStyle=P.gold; ctx.beginPath(); ctx.arc(W-104,27,8,0,7); ctx.fill();
  txtb(G.gold, W-90, 33, P.gold, 15);
  // trinkets + tonics strip
  ctx.fillStyle='rgba(10,8,6,.8)'; ctx.fillRect(0,H-46,W,46);
  for(var i=0;i<G.trinkets.length;i++){
    var t = TRINK[G.trinkets[i]], bx = 18+i*32;
    fillRR(bx,H-40,28,32,4,'rgba(40,30,22,.95)');
    strokeRR(bx,H-40,28,32,4, t.rar==='boss'?P.plum:t.rar==='rare'?P.gold:t.rar==='uncommon'?P.sky:P.faint,1.5);
    txtb(t.name.substr(0,1), bx+14, H-18, P.ink, 15, 'center');
    hot(bx,H-40,28,32,'trinket',t);
  }
  for(var i=0;i<G.tonics.length;i++){
    var bx2 = W-60-i*38;
    fillRR(bx2,H-40,32,32,5,'rgba(30,40,24,.95)');
    strokeRR(bx2,H-40,32,32,5,P.moss,1.5);
    txtb(TONIC[G.tonics[i]].name.substr(0,1), bx2+16, H-18, P.moss, 14, 'center');
    hot(bx2,H-40,32,32,'tonictip',G.tonics[i]);
  }
  button(W-180, 84, 156, 34, 'VIEW DECK ('+G.deck.length+')', 'viewdeck');
  if(avail.length && G.map.cur<0) txt('Choose where the line takes you.', W/2, H-64, P.dim, 15, 'center');

}
function drawEvent(){
  dustBg(); backdrop(0.55);
  var w=860,x=W/2-w/2;
  panel(x, 60, w, H-160, EVT.e.name.toUpperCase());
  var ty = 130;
  ty += wrapDraw(EVT.e.text, W/2, ty, w-120, 16, P.ink, 'center', 25) + 30;
  if(EVT.result){
    ctx.fillStyle='rgba(150,116,74,.3)'; ctx.fillRect(x+80,ty-14,w-160,1);
    ty += wrapDraw(EVT.result, W/2, ty+16, w-140, 16, P.gold, 'center', 25);
    button(W/2-120, H-170, 240, 52, 'MOVE ON', 'leaveevent');
  } else {
    for(var i=0;i<EVT.e.opts.length;i++){
      var o = EVT.e.opts[i];
      var can = !o.avail || o.avail();
      var bh=64, bx=x+70, by2=ty+i*(bh+16), bw2=w-140;
      var hov = MX>bx&&MX<bx+bw2&&MY>by2&&MY<by2+bh;
      fillRR(bx,by2,bw2,bh,8, can? (hov?'rgba(74,52,32,.98)':'rgba(48,34,22,.95)') : 'rgba(30,26,22,.8)');
      strokeRR(bx,by2,bw2,bh,8, can?(hov?P.gold:'rgba(150,116,74,.6)'):'rgba(90,80,70,.35)',1.8);
      txtb(o.t, bx+22, by2+27, can?P.gold:'rgba(140,124,108,.5)', 17);
      txt(o.d, bx+22, by2+48, can?P.dim:'rgba(120,108,94,.4)', 12.5);
      if(can) hot(bx,by2,bw2,bh,'evtopt',i);
    }
  }
}
/* ==========================================================================
   END SCREENS
   ========================================================================== */
function drawGameOver(){
  bgSky(G?G.act:1); drawMesas(G?G.act:1);
  ctx.fillStyle='rgba(8,5,4,.8)'; ctx.fillRect(0,0,W,H);
  shadowOn(24,'rgba(0,0,0,.9)');
  txtb('THE LINE ENDS HERE', W/2, 200, P.blood, 62, 'center');
  shadowOff();
  txt('Act '+(G?G.act:1)+'  ·  '+(G?G.kills:0)+' fights won  ·  '+(G?G.elites:0)+' elites put down', W/2, 250, P.dim, 18, 'center');
  txt('The dust gets everything eventually. It is not personal.', W/2, 290, P.faint, 15, 'center');
  if(G){
    var y = 350;
    txt('DECK — '+G.deck.length+' cards   ·   TRINKETS — '+G.trinkets.length, W/2, y, P.dim, 14, 'center');
    for(var i=0;i<G.trinkets.length;i++){
      txt(TRINK[G.trinkets[i]].name, W/2, y+28+i*20, P.faint, 13, 'center');
    }
  }
  button(W/2-160, H-160, 320, 60, 'WALK IT AGAIN', 'toTitle');
}
function drawVictory(){
  bgSky(3); drawSun(3); drawMesas(3);
  ctx.fillStyle='rgba(8,5,4,.62)'; ctx.fillRect(0,0,W,H);
  art_marshal(W/2, 560, 2.2, P.gold, 1, TT);
  shadowOn(30,'rgba(240,201,107,.6)');
  txtb('THE OX IS COLD', W/2, 160, P.gold, 66, 'center');
  shadowOff();
  txt('The boiler ticks as it cools. Behind you the whole line is quiet for the first time in eleven years.', W/2, 212, P.ink, 17, 'center');
  txt('Act 3 cleared  ·  '+(G?G.kills:0)+' fights won  ·  '+(G?G.elites:0)+' elites  ·  seed '+(G?G.seed:0), W/2, 250, P.dim, 15, 'center');
  button(W/2-160, H-130, 320, 58, 'WALK IT AGAIN', 'toTitle');
}

/* ==========================================================================
   TOOLTIP
   ========================================================================== */
function drawTooltip(){
  var h2 = hitAt(MX,MY);
  if(!h2) return;
  var title=null, body=null;
  if(h2.id==='trinket'){ title = h2.data.name; body = h2.data.desc; }
  else if(h2.id==='status'){ var m=ST[h2.data.k]; if(m){ title=m.n+' '+st(h2.data.u,h2.data.k); body=m.d; } }
  else if(h2.id==='tonic'){ var t=TONIC[G.tonics[h2.data]]; if(t){ title=t.name; body=t.desc+'   (click to drink)'; } }
  else if(h2.id==='tonictip'){ var t2=TONIC[h2.data]; if(t2){ title=t2.name; body=t2.desc; } }
  else if(h2.id==='intent'){
    var e = h2.data, m2 = e.intent;
    title = e.name+' — '+(m2?m2.name:'?');
    if(m2 && m2.kind==='attack'){
      body = 'Attacks for '+m2.dmg+(m2.hits>1?' ×'+m2.hits:'')+' at range '+m2.rng[0]+'-'+(m2.rng[1]>8?'∞':m2.rng[1])+
             (m2.step? '. Steps up to '+m2.step+' tiles first.' : '. Cannot move to reach you.');
    } else if(m2 && m2.kind==='defend') body = 'Gains '+m2.block+' Block.';
    else body = 'Something other than an attack.';
  }
  else if(h2.id==='node'){
    var n=h2.data;
    title = n.type==='elite'?'ELITE':n.type==='boss'?'BOSS':n.type==='rest'?'CAMPFIRE':
            n.type==='shop'?'WAGON':n.type==='chest'?'CACHE':n.type==='event'?'SOMETHING ON THE LINE':'FIGHT';
    body = n.type==='elite'?'Hard fight. Better spoils, and a trinket.':
           n.type==='boss'?'The end of this act.':
           n.type==='rest'?'Heal, sharpen a card, or turn out your pack.':
           n.type==='shop'?'Buy cards, trinkets, tonics. Burn a card.':
           n.type==='chest'?'One trinket of three.':
           n.type==='event'?'No telling.':'A fight for gold and a card.';
  }
  if(!title) return;
  var tw = 300;
  var lines = wrap(body||'', tw-28, 13);
  var th = 40 + lines.length*18;
  var tx2 = clamp(MX+18, 8, W-tw-8), ty2 = clamp(MY-th-12, 8, H-th-8);
  fillRR(tx2,ty2,tw,th,8,'rgba(14,10,8,.97)');
  strokeRR(tx2,ty2,tw,th,8,P.brass,1.5);
  txtb(title, tx2+14, ty2+24, P.gold, 15);
  for(var i=0;i<lines.length;i++) txt(lines[i], tx2+14, ty2+44+i*18, P.ink, 13);
}

/* ==========================================================================
   INPUT
   ========================================================================== */
var MX = -999, MY = -999, HOVCARD = -1, DECKSCROLL = 0, PREVSCREEN = 'map';
function canvasPos(ev){
  var r = cv.getBoundingClientRect();
  return { x:(ev.clientX-r.left)*(W/r.width), y:(ev.clientY-r.top)*(H/r.height) };
}
function onMove(ev){
  var p = canvasPos(ev); MX = p.x; MY = p.y;
}
function scrollFor(dy){
  if(SCREEN==='map'){ MAPSCROLL = clamp(MAPSCROLL + dy, 0, Math.max(0, ROWS*76 - (H-200))); }
  else if(SCREEN==='deckview'){ DECKSCROLL = clamp(DECKSCROLL + dy, 0, Math.max(0, Math.ceil(G.deck.length/8)*(CH*0.72+12) - (H-220))); }
  else if(SCREEN==='picker'){ PICK.scroll = clamp(PICK.scroll + dy, 0, Math.max(0, Math.ceil(PICK.cards.length/7)*(CH*0.78+14) - (H-220))); }
}
function onClick(ev){
  var p = canvasPos(ev); MX=p.x; MY=p.y;
  var h2 = hitAt(MX,MY);
  var id = h2 ? h2.id : null, d = h2 ? h2.data : null;

  if(SCREEN==='title'){
    if(id==='newrun'){ SCREEN='select'; }
    else if(id==='continue'){
      var g = loadSave();
      if(g){ G=g; rng=mkRng((G.seed+G.kills*77+G.map.cur*13)>>>0); SCREEN='map'; MAPSCROLL=clamp(G.map.row*76-200,0,ROWS*76-(H-200)); }
    }
    return;
  }
  if(SCREEN==='select'){
    if(id==='pickclass'){ META.runs++; saveMeta(); newRun(d); MAPSCROLL=0; }
    else if(id==='toTitle') SCREEN='title';
    return;
  }
  if(SCREEN==='deckview'){ if(id==='closedeck'||!h2) SCREEN=PREVSCREEN; return; }
  if(id==='viewdeck'){ PREVSCREEN=SCREEN; DECKSCROLL=0; SCREEN='deckview'; return; }

  if(SCREEN==='map'){
    if(id==='node'){ MAPSCROLL = clamp(MAPSCROLL, 0, ROWS*76); enterNode(d); }
    return;
  }
  if(SCREEN==='battle'){
    if(B.over || B.phase!=='player') return;
    if(id==='endturn'){ B.sel=-1; endPlayerTurn(); return; }
    if(id==='tonic'){ useTonic(d); return; }
    if(id==='card'){
      var c = B.hand[d];
      if(!c) return;
      if(B.sel===d){ B.sel=-1; return; }
      if(!canPlay(c)){ B.sel=-1; fxText(W/2, H-330, 'CANNOT PLAY', P.rust, 20); return; }
      var cd = CD(c);
      if(cd.targets==='enemy'){
        var vt = validTargets(c);
        if(vt.length===1){ playCard(d, vt[0]); B.sel=-1; }
        else B.sel = d;
      } else { playCard(d, null); B.sel=-1; }
      return;
    }
    if(id==='foe'){
      if(B.sel>=0){
        var c2 = B.hand[B.sel];
        if(c2 && canPlay(c2) && validTargets(c2).indexOf(d)>=0){ playCard(B.sel, d); }
        B.sel=-1;
      }
      return;
    }
    if(!h2) B.sel = -1;
    return;
  }
  if(SCREEN==='reward'){
    if(id==='reward') takeReward(d);
    else if(id==='leavereward') leaveReward();
    return;
  }
  if(SCREEN==='cardpick'){
    if(id==='takecard'){
      var cs = REWARD.items[REWARD.pickIdx].v;
      G.deck.push(cs[d]);
      REWARD.taken.push(REWARD.pickIdx); SCREEN='reward'; save();
    } else if(id==='skipcard'){ REWARD.taken.push(REWARD.pickIdx); SCREEN='reward'; }
    return;
  }
  if(SCREEN==='trinketpick'){
    if(id==='taketrinket'){
      giveTrinket(REWARD.items[REWARD.pickIdx].v[d]);
      REWARD.taken.push(REWARD.pickIdx); SCREEN='reward'; save();
    }
    return;
  }
  if(SCREEN==='shop'){
    if(id==='buycard') buyCard(d);
    else if(id==='buytrink') buyTrink(d);
    else if(id==='buytonic') buyTonic(d);
    else if(id==='removal') buyRemoval();
    else if(id==='leaveshop'){ SHOP=null; SCREEN='map'; save(); }
    return;
  }
  if(SCREEN==='rest'){
    if(id==='rest') doRest();
    else if(id==='sharpen') doSharpen();
    else if(id==='digin') doDigIn();
    else if(id==='leaverest') leaveRest();
    return;
  }
  if(SCREEN==='chest'){
    if(id==='takechest'){ giveTrinket(CHEST.opts[d]); CHEST=null; SCREEN='map'; save(); }
    else if(id==='leavechest'){ CHEST=null; SCREEN='map'; save(); }
    return;
  }
  if(SCREEN==='event'){
    if(id==='evtopt') chooseEventOpt(d);
    else if(id==='leaveevent') leaveEvent();
    return;
  }
  if(SCREEN==='picker'){
    if(id==='pick'){ var r = PICK.cb(d); if(r!==false) PICK=null; }
    else if(id==='pickcancel'){ var cb=PICK.cancel; PICK=null; if(cb) cb(); }
    return;
  }
  if(SCREEN==='gameover' || SCREEN==='victory'){
    if(id==='toTitle'){
      if(SCREEN==='victory'){ META.wins++; saveMeta(); }
      clearSave(); G=null; B=null; SCREEN='title';
    }
    return;
  }
}
function onKey(ev){
  var k = ev.key;
  if(SCREEN==='battle' && B && !B.over && B.phase==='player'){
    if(k>='1' && k<='9'){
      var i = parseInt(k,10)-1;
      var c = B.hand[i];
      if(c && canPlay(c)){
        var cd = CD(c);
        if(cd.targets==='enemy'){
          var vt = validTargets(c);
          if(vt.length) playCard(i, vt[0]);
        } else playCard(i, null);
        B.sel=-1;
      }
      ev.preventDefault(); return;
    }
    if(k==='e'||k==='E'||k===' '){ B.sel=-1; endPlayerTurn(); ev.preventDefault(); return; }
    if(k==='Escape'){ B.sel=-1; return; }
    if(k==='d'||k==='D'){ PREVSCREEN=SCREEN; DECKSCROLL=0; SCREEN='deckview'; return; }
    if(k>='a'&&k<='c' && false) return;
  }
  if(SCREEN==='deckview' && (k==='Escape'||k==='d'||k==='D')) SCREEN=PREVSCREEN;
  else if(SCREEN==='map' && (k==='d'||k==='D')){ PREVSCREEN=SCREEN; DECKSCROLL=0; SCREEN='deckview'; }
  if(k==='ArrowUp') scrollFor(-60);
  if(k==='ArrowDown') scrollFor(60);
}

/* ==========================================================================
   MAIN LOOP
   ========================================================================== */
function drawFrame(dt){
  HOT.length = 0;
  TT += dt; TITLET += dt;
  updFX(dt);
  if(SCREEN==='battle' && B) updQ(dt);

  ctx.save();
  if(SHAKE>0.2){
    ctx.translate((Math.random()-0.5)*SHAKE, (Math.random()-0.5)*SHAKE);
  }
  switch(SCREEN){
    case 'title': drawTitle(); break;
    case 'select': drawSelect(); break;
    case 'map': drawMap(); break;
    case 'battle': if(B) drawBattle(); break;
    case 'reward': drawReward(); break;
    case 'cardpick': drawCardPick(); break;
    case 'trinketpick': drawTrinketPick(); break;
    case 'shop': drawShop(); break;
    case 'rest': drawRest(); break;
    case 'chest': drawChest(); break;
    case 'event': drawEvent(); break;
    case 'picker': drawPicker(); break;
    case 'deckview': drawDeckView(); break;
    case 'gameover': drawGameOver(); break;
    case 'victory': drawVictory(); break;
    default: drawTitle();
  }
  ctx.restore();
  if(SCREEN!=='title' && SCREEN!=='select') vignette();
  drawTooltip();
  var hh = hitAt(MX,MY);
  HOVCARD = (hh && hh.id==='card') ? hh.data : -1;
  cv.style.cursor = hh ? 'pointer' : 'default';
}
var lastT = 0;
function loop(t){
  var dt = lastT ? Math.min(0.05, (t-lastT)/1000) : 0.016;
  lastT = t;
  drawFrame(dt);
  requestAnimationFrame(loop);
}
function resize(){
  var vw = window.innerWidth, vh = window.innerHeight;
  var s = Math.min(vw/W, vh/H);
  cv.style.width = Math.floor(W*s)+'px';
  cv.style.height = Math.floor(H*s)+'px';
}

/* ==========================================================================
   BOOT
   ========================================================================== */
function boot(){
  loadMeta();
  resize();
  window.addEventListener('resize', resize);
  cv.addEventListener('mousemove', onMove);
  cv.addEventListener('mousedown', onClick);
  cv.addEventListener('wheel', function(e){ scrollFor(e.deltaY>0?60:-60); e.preventDefault(); }, {passive:false});
  window.addEventListener('keydown', onKey);
  cv.addEventListener('contextmenu', function(e){ e.preventDefault(); if(B && SCREEN==='battle') B.sel=-1; });
  SCREEN = 'title';
  requestAnimationFrame(loop);
}
if(typeof HEADLESS === 'undefined') boot();

</script>
