function edParse(s) {
  var m = /^GLIDE1:(\d+):(\d+):(.+)$/.exec((s || '').trim());
  if (!m) return null;
  var w = +m[1], h = +m[2], g = m[3];
  if (w < 3 || h < 3 || w > 24 || h > 24 || g.length !== w * h) return null;
  for (var vi = 0; vi < g.length; vi++) {
    var vc = g.charAt(vi);
    if ('#.0~m^>v<t!Ggo+/\\%=YJKLyjklBRbrE@x*'.indexOf(vc) < 0 && !GLIDE.EXTBY[vc]) return null;
  }
  return { w: w, h: h, g: g.split('') };
}
function edAdopt(d, name) {
  ed.w = d.w; ed.h = d.h; ed.g = d.g.slice();
  ed.name = name || ''; ed.hist = []; ed.par = null; ed.reach = null;
  $('eName').textContent = ed.name || 'Untitled deck';
  $('eUndo').disabled = true;
  edSizeLabels(); edResize(); edFit();
}
/* A 40px portrait of a saved deck, painted with the game's own tile art. */
function drawThumb(c2d, dpr, w, h, gstr) {
  edPairs = {};                       // too small for tags; edDraw recomputes
  var cs = Math.max(2, Math.min(40 / w, 40 / h));
  var ox = (40 - cs * w) / 2, oy = (40 - cs * h) / 2;
  withBoard(c2d, cs, { w: w, h: h }, function () {
    c2d.setTransform(dpr, 0, 0, dpr, 0, 0);
    c2d.clearRect(0, 0, 40, 40);
    c2d.save(); c2d.translate(ox, oy);
    for (var i = 0; i < w * h; i++)
      drawTile((i % w) * cs, ((i / w) | 0) * cs, i, gstr.charAt(i), .5);
    c2d.restore();
  });
}
function closeModals() {
  $('mSave').classList.remove('on');
  $('mOpen').classList.remove('on');
  $('mStats').classList.remove('on');
}
/* ---- flight record ---- */
function statsShow() {
  var done = 0, perfect = 0, stars = 0, tiers = {}, order = [];
  LEVELS.forEach(function (lv) {
    if (!tiers[lv.tierName]) { tiers[lv.tierName] = { d: 0, n: 0 }; order.push(lv.tierName); }
    tiers[lv.tierName].n++;
    var b = save.best[lv.id];
    if (b !== undefined) {
      done++; tiers[lv.tierName].d++;
      stars += starsFor(b, lv.par);
      if (b <= lv.par) perfect++;
    }
  });
  var rows = [
    ['Decks cleared', done + ' / ' + LEVELS.length],
    ['Cleared at par', perfect],
    ['Stars earned', stars + ' / ' + (LEVELS.length * 3)],
    ['Best endless run', save.endless],
    ['Daily decks cleared', Object.keys(save.daily).length],
    ['Decks played', save.played]
  ];
  var html = '<div class="stbar"><i style="width:' +
    Math.round(done / LEVELS.length * 100) + '%"></i></div>';
  for (var i = 0; i < rows.length; i++)
    html += '<div class="strow"><div class="k">' + rows[i][0] +
            '</div><div class="v mono">' + rows[i][1] + '</div></div>';
  html += '<div class="mh sub">By tier</div>';
  for (var t = 0; t < order.length; t++)
    html += '<div class="strow"><div class="k">' + order[t] + '</div><div class="v mono">' +
            tiers[order[t]].d + ' / ' + tiers[order[t]].n + '</div></div>';
  $('statBody').innerHTML = html;
  $('mStats').classList.add('on');
}
function buildSlots() {
  var list = $('mList'), all = sboxAll();
  list.innerHTML = '';
  if (!all.length) {
    list.innerHTML = '<div class="empty">Nothing saved yet. Draw a deck and hit Save — it lives in this browser.</div>';
    return;
  }
  all.forEach(function (s, i) {
    var row = document.createElement('div');
    row.className = 'slot';
    var th = document.createElement('canvas');
    th.className = 'thumb';
    var tdpr = Math.min(window.devicePixelRatio || 1, 2);
    th.width = Math.round(40 * tdpr); th.height = Math.round(40 * tdpr);
    drawThumb(th.getContext('2d'), tdpr, s.w, s.h, s.g);
    var n = document.createElement('div'); n.className = 'sn'; n.textContent = s.n;
    var z = document.createElement('div'); z.className = 'sz'; z.textContent = s.w + '×' + s.h;
    var open = document.createElement('button'); open.textContent = 'Open';
    var del = document.createElement('button'); del.className = 'del'; del.textContent = 'Delete';
    open.onclick = function () {
      edAdopt({ w: s.w, h: s.h, g: s.g.split('') }, s.n);
      closeModals(); emsg('Opened “' + s.n + '”.', 'good');
    };
    del.onclick = function () {
      var a = sboxAll(); a.splice(i, 1); sboxSet(a); buildSlots();
    };
    row.appendChild(th); row.appendChild(n); row.appendChild(z);
    row.appendChild(open); row.appendChild(del);
    list.appendChild(row);
  });
}

// ---- wiring --------------------------------------------------------
/* Left button paints. Middle, right or shift-drag pans. Wheel zooms about the
   cursor. On a touchscreen, one finger paints and two fingers pan and pinch. */
ecv.addEventListener('contextmenu', function (e) { e.preventDefault(); });
ecv.addEventListener('mousedown', function (e) {
  e.preventDefault();
  if (e.button === 1 || e.button === 2 || e.shiftKey) {
    ePanning = { x: e.clientX, y: e.clientY, px: ePanX, py: ePanY };
    ecv.style.cursor = 'grabbing';
    return;
  }
  painting = true; edPush(); edPaint(edAt(e));
});
ecv.addEventListener('mousemove', function (e) {
  if (ePanning) {
    ePanX = ePanning.px + (e.clientX - ePanning.x);
    ePanY = ePanning.py + (e.clientY - ePanning.y);
    edClamp();
    return;
  }
  eHover = edAt(e); if (painting) edPaint(eHover);
});
ecv.addEventListener('mouseleave', function () { eHover = -1; });
window.addEventListener('mouseup', function () {
  painting = false; ePanning = null; ecv.style.cursor = 'crosshair';
});
ecv.addEventListener('wheel', function (e) {
  e.preventDefault();
  edZoomAt(e.deltaY < 0 ? 1.12 : 1 / 1.12, e.clientX, e.clientY);
}, { passive: false });

function pinchOf(e) {
  var a = e.touches[0], b = e.touches[1];
  var dx = a.clientX - b.clientX, dy = a.clientY - b.clientY;
  return { x: (a.clientX + b.clientX) / 2, y: (a.clientY + b.clientY) / 2,
           d: Math.max(1, Math.sqrt(dx * dx + dy * dy)) };
}
ecv.addEventListener('touchstart', function (e) {
  e.preventDefault();
  if (e.touches.length === 2) { painting = false; ePinch = pinchOf(e); return; }
  painting = true; edPush(); edPaint(edAt(e));
}, { passive: false });
ecv.addEventListener('touchmove', function (e) {
  e.preventDefault();
  if (e.touches.length === 2) {
    var p = pinchOf(e);
    if (ePinch) {
      ePanX += p.x - ePinch.x; ePanY += p.y - ePinch.y;
      edZoomAt(p.d / ePinch.d, p.x, p.y);
    }
    ePinch = p;
    return;
  }
  if (painting) edPaint(edAt(e));
}, { passive: false });
window.addEventListener('touchend', function (e) {
  painting = false;
  if (!e.touches || e.touches.length < 2) ePinch = null;
});

$('eBack').onclick = function () { show('title'); };
$('eUndo').onclick = edUndo;
$('eNew').onclick = edNew;
$('eWm').onclick = function () { edSize(-1, 0); };
$('eWp').onclick = function () { edSize(1, 0); };
$('eHm').onclick = function () { edSize(0, -1); };
$('eHp').onclick = function () { edSize(0, 1); };
$('eZm').onclick = function () { edZoomAt(1 / 1.25); };
$('eZp').onclick = function () { edZoomAt(1.25); };
$('eZv').onclick = function () { edFit(); emsg('Zoom reset to fit.'); };
$('eRot').onclick = edRotate;
$('eFlip').onclick = edMirror;
$('eCheck').onclick = function () { edVerify(null); };
$('eTest').onclick = edTest;
$('eSave').onclick = function () {
  $('mName').value = ed.name;
  $('mCode').value = edCode();
  $('mLink').value = location.href.split('#')[0] + '#' + edCode();
  $('mSave').classList.add('on');
  $('mName').focus();
};
$('eOpen').onclick = function () {
  $('mPaste').value = '';
  buildSlots();
  $('mOpen').classList.add('on');
};
$('mSaveX').onclick = closeModals;
$('mOpenX').onclick = closeModals;
$('mSaveOk').onclick = function () {
  var n = ($('mName').value || '').trim() || 'Untitled deck';
  var all = sboxAll();
  var rec = { n: n, w: ed.w, h: ed.h, g: ed.g.join('') };
  var at = -1;
  for (var i = 0; i < all.length; i++) if (all[i].n === n) at = i;
  if (at >= 0) all[at] = rec; else all.unshift(rec);
  sboxSet(all.slice(0, 40));
  ed.name = n; $('eName').textContent = n;
  closeModals(); emsg('Saved “' + n + '”.', 'good'); blip(660, .09, 'sine', .05);
};
$('mImport').onclick = function () {
  var d = edParse($('mPaste').value);
  if (!d) { $('mPaste').value = ''; $('mPaste').placeholder = 'That is not a valid GLIDE1 code'; return; }
  edAdopt(d, '');
  closeModals(); emsg('Imported a ' + d.w + '×' + d.h + ' deck.', 'good');
};
[$('mSave'), $('mOpen'), $('mStats')].forEach(function (m) {
  m.addEventListener('mousedown', function (e) { if (e.target === m) closeModals(); });
});

buildGroupSel();
buildPal('Basics');
edNew();

// ------------------------------------------------------------------ screens
function openSelect() {
  buildGrid();
  show('select');
}
/* Where "back" goes from the board — a sandbox test run belongs to the editor,
   not to the campaign. */
function leavePlay() {
  replay = null;
  if (sandPlay) { show('sandbox'); edResize(); }
  else if (playMode === 'campaign') openSelect();
  else { buildGrid(); show('title'); }
}
function buildGrid() {
  var g = $('sGrid');
  g.innerHTML = '';
  var done = 0, perfect = 0;
  var tier = null;
  LEVELS.forEach(function (lv, i) {
    if (lv.tierName !== tier) {
      tier = lv.tierName;
      var hd = document.createElement('div');
      hd.className = 'tierhd'; hd.textContent = tier;
      g.appendChild(hd);
    }
    var best = save.best[lv.id];
    var locked = i + 1 > save.unlocked;
    if (best !== undefined) { done++; if (best <= lv.par) perfect++; }
    var b = document.createElement('button');
    b.className = 'cell' + (locked ? ' locked' : '') +
      (best !== undefined ? (best <= lv.par ? ' perfect' : ' done') : '');
    b.innerHTML = '<div class="n">' + (i + 1) + '</div><div class="m">' +
      (locked ? '—' : (best !== undefined ? best + '/' + lv.par : 'par ' + lv.par)) + '</div>' +
      '<div class="s">' + (best !== undefined ? starStr(starsFor(best, lv.par)) : '') + '</div>';
    if (!locked) b.onclick = function () { load(i); show('play'); };
    g.appendChild(b);
  });
  $('sProg').textContent = done + ' / ' + LEVELS.length + ' cleared · ' + perfect + ' optimal';
  $('cTotal').textContent = done + ' / ' + LEVELS.length + ' decks cleared · ' + BUILD;
  $('eSub').textContent = 'Sandbox · ' + TOOLS.length + ' tiles · ' + BUILD;
}

$('bPlay').onclick = function () {
  var i = 0;
  for (var k = 0; k < LEVELS.length; k++) {
    if (save.best[LEVELS[k].id] === undefined) { i = k; break; }
    i = Math.min(LEVELS.length - 1, k + 1);
  }
  load(i); show('play');
};
$('bSelect').onclick = openSelect;
$('bSand').onclick = function () { show('sandbox'); edResize(); };
$('bSound').onclick = function () {
  save.sound = !save.sound; persist();
  $('bSound').textContent = 'Sound: ' + (save.sound ? 'on' : 'off');
  if (save.sound) blip(660, .09, 'sine', .06);
};
$('sBack').onclick = function () { buildGrid(); show('title'); };
$('pBack').onclick = leavePlay;
$('pUndo').onclick = undo;
$('pReset').onclick = restart;
$('pHint').onclick = nudge;
$('wNext').onclick = function () {
  $('win').classList.remove('on');
  if (playMode === 'endless') { endless.n++; nextEndless(); return; }
  if (playMode !== 'campaign') { leavePlay(); return; }
  if (idx + 1 < LEVELS.length) { load(idx + 1); show('play'); }
  else { buildGrid(); show('select'); }
};
$('wRetry').onclick = function () {
  $('win').classList.remove('on');
  // replay the deck you just cleared, whatever kind of deck it was
  if (playMode !== 'campaign') loadObj(CUR, playMode); else load(idx);
  show('play');
};
$('wReplay').onclick = function () {
  var enc = (playMode === 'campaign' && save.route[CUR.id]) || encRoute(lastRoute);
  startReplay(decRoute(enc));
};
$('wMenu').onclick = function () { $('win').classList.remove('on'); leavePlay(); };
$('bDaily').onclick = startDaily;
$('bEndless').onclick = startEndless;
$('bStats').onclick = statsShow;
$('mStatsX').onclick = closeModals;

$('bSound').textContent = 'Sound: ' + (save.sound ? 'on' : 'off');
$('bPlay').textContent = Object.keys(save.best).length ? 'Continue' : 'Start';
buildGrid();

/* A share link drops you straight into the editor with that deck loaded. */
(function () {
  var h = '';
  try { h = decodeURIComponent((location.hash || '').replace(/^#/, '')); } catch (e) { h = ''; }
  if (!h) return;
  var d = edParse(h);
  if (!d) return;
  edAdopt(d, 'Shared deck');
  show('sandbox');
  emsg('Opened a shared ' + d.w + '×' + d.h + ' deck. Verify it, then test it.', 'good');
})();

requestAnimationFrame(frame);
})();
