<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>GLIDE</title>
<style>
:root{
  --bg:#060a10; --bg2:#0b131d;
  --deck:#16212e; --deck2:#1b2836; --grout:#0d151f;
  --wall:#2b3a4f; --wallTop:#41587a; --wallEdge:#1a2433;
  --cyan:#4fe3d2; --cyanDim:#1f6b66;
  --gold:#ffc65c; --violet:#a97bff; --rust:#c8794a; --red:#ff6b6b;
  --ink:#e8f2f6; --mute:#7d93a8; --mute2:#54687c;
  --ui:#101a26; --uiLine:#22344a;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:radial-gradient(120% 100% at 50% 0%,var(--bg2) 0%,var(--bg) 70%);
  color:var(--ink); overflow:hidden;
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  touch-action:none;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}

/* ---------- screens ---------- */
.screen{position:fixed;inset:0;display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .28s ease}
.screen.on{opacity:1;pointer-events:auto}

/* ---------- title ---------- */
#title{align-items:center;justify-content:center;gap:0}
.logo{font-size:clamp(58px,17vw,140px);font-weight:800;letter-spacing:.22em;text-indent:.22em;
  background:linear-gradient(180deg,#eafffd 0%,var(--cyan) 55%,#1d8d86 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 30px rgba(79,227,210,.35));line-height:1}
.tag{color:var(--mute);letter-spacing:.32em;text-transform:uppercase;font-size:clamp(9px,2.4vw,12px);margin-top:14px;text-align:center;padding:0 20px}
.menu{margin-top:44px;display:flex;flex-direction:column;gap:12px;width:min(300px,74vw)}
.btn{padding:14px 20px;border:1px solid var(--uiLine);border-radius:12px;background:rgba(16,26,38,.75);
  letter-spacing:.14em;text-transform:uppercase;font-size:12px;font-weight:600;text-align:center;
  transition:border-color .18s,background .18s,transform .1s,color .18s}
.btn:hover{border-color:var(--cyanDim);background:rgba(31,107,102,.16);color:#fff}
.btn:active{transform:translateY(1px)}
.btn.primary{border-color:var(--cyanDim);background:rgba(31,107,102,.2);color:var(--cyan)}
.btn.primary:hover{background:rgba(31,107,102,.34)}
.credit{position:absolute;bottom:18px;color:var(--mute2);font-size:10px;letter-spacing:.18em;text-transform:uppercase}

/* ---------- top bar ---------- */
.bar{display:flex;align-items:center;gap:10px;padding:12px 14px;padding-top:max(12px,env(safe-area-inset-top));
  border-bottom:1px solid rgba(34,52,74,.5);flex:0 0 auto;min-height:56px}
.ico{width:36px;height:36px;border-radius:9px;border:1px solid var(--uiLine);display:grid;place-items:center;
  color:var(--mute);transition:color .16s,border-color .16s,background .16s;flex:0 0 auto}
.ico:hover{color:var(--cyan);border-color:var(--cyanDim);background:rgba(31,107,102,.14)}
.ico:disabled{opacity:.3;cursor:default}
.ico:disabled:hover{color:var(--mute);border-color:var(--uiLine);background:none}
.ico svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.barmid{flex:1;min-width:0;text-align:center}
.lvname{font-size:14px;font-weight:600;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvsub{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute2);margin-top:3px}
.counts{display:flex;gap:14px;align-items:baseline;flex:0 0 auto}
.ct{text-align:right}
.ctv{font-size:17px;font-weight:600;line-height:1}
.ctl{font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute2);margin-top:3px}

/* ---------- board ---------- */
#stage{flex:1;position:relative;display:grid;place-items:center;padding:14px;min-height:0}
#cv{display:block;touch-action:none}
.hint{position:absolute;left:50%;transform:translateX(-50%);bottom:14px;max-width:min(560px,92vw);
  background:rgba(11,19,29,.94);border:1px solid var(--uiLine);border-left:2px solid var(--cyan);
  border-radius:10px;padding:11px 14px;font-size:12.5px;line-height:1.5;color:#cfe0e8;
  box-shadow:0 12px 40px rgba(0,0,0,.6);animation:rise .35s ease both}
@keyframes rise{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
.stuck{position:absolute;left:50%;transform:translateX(-50%);top:12px;background:rgba(46,14,14,.94);
  border:1px solid #6d2b2b;border-radius:9px;padding:8px 13px;font-size:11.5px;color:#ffc9c9;
  letter-spacing:.04em;animation:rise .3s ease both;display:flex;gap:9px;align-items:center}
.stuck b{color:#fff;font-weight:600}
.stuck button{color:#ff9b9b;text-decoration:underline;font-size:11.5px}

/* ---------- level select ---------- */
#select{background:var(--bg)}
.grid{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:14px 14px 40px;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:9px;align-content:start;
  max-width:760px;width:100%;margin:0 auto}
.tierhd{grid-column:1/-1;display:flex;align-items:center;gap:11px;margin:20px 2px 4px;
  font-size:9.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--mute2)}
.tierhd:first-child{margin-top:4px}
.tierhd::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--uiLine),transparent)}
.cell{aspect-ratio:1;border:1px solid var(--uiLine);border-radius:11px;background:rgba(16,26,38,.6);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  transition:transform .12s,border-color .16s,background .16s}
.cell:hover{transform:translateY(-2px);border-color:var(--cyanDim);background:rgba(31,107,102,.15)}
.cell .n{font-size:16px;font-weight:600}
.cell .m{font-size:9px;letter-spacing:.1em;color:var(--mute2)}
.cell.done{border-color:rgba(79,227,210,.34)}
.cell.done .n{color:var(--cyan)}
.cell.perfect{border-color:rgba(255,198,92,.5);background:rgba(255,198,92,.07)}
.cell.perfect .n{color:var(--gold)}
.cell.perfect .m{color:rgba(255,198,92,.75)}
.cell.locked{opacity:.3;cursor:default;pointer-events:none}
.cell.locked .n{color:var(--mute2)}

/* ---------- win overlay ---------- */
#win{position:fixed;inset:0;display:grid;place-items:center;background:rgba(4,8,13,.8);
  backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
  opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
#win.on{opacity:1;pointer-events:auto}
.card{width:min(340px,86vw);background:linear-gradient(180deg,#101b27,#0a121b);
  border:1px solid var(--uiLine);border-radius:18px;padding:26px 24px;text-align:center;
  box-shadow:0 30px 90px rgba(0,0,0,.7);transform:translateY(12px) scale(.97);transition:transform .3s cubic-bezier(.2,1.3,.4,1)}
#win.on .card{transform:none}
.wtitle{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--cyan)}
.wname{font-size:23px;font-weight:700;margin-top:7px;letter-spacing:.01em}
.wstat{display:flex;justify-content:center;gap:26px;margin:20px 0 6px}
.ws{text-align:center}
.wsv{font-size:26px;font-weight:700;line-height:1}
.wsl{font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute2);margin-top:5px}
.stars{margin-top:14px;font-size:21px;letter-spacing:.16em;color:var(--gold);min-height:24px;line-height:1}
.badge{margin-top:12px;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);min-height:14px}
.cell .s{font-size:8px;letter-spacing:.06em;color:rgba(255,198,92,.8);line-height:1;min-height:9px}
.strow{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  border-bottom:1px solid rgba(34,52,74,.5);padding:9px 2px}
.strow:last-child{border-bottom:none}
.strow .k{font-size:12px;color:var(--mute)}
.strow .v{font-size:15px;font-weight:600}
.stbar{height:6px;border-radius:3px;background:rgba(34,52,74,.6);overflow:hidden;margin:10px 2px 2px}
.stbar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--gold))}
.wbtns{display:flex;flex-direction:column;gap:9px;margin-top:20px}

/* ---------- sandbox editor ---------- */
#estage{flex:1;position:relative;display:grid;place-items:center;padding:12px;min-height:0}
#ecv{display:block;touch-action:none;cursor:crosshair}
.palbar{display:flex;justify-content:center;padding:8px 12px 0}
.palbar select{width:auto;min-width:190px;font-size:11px;letter-spacing:.08em;padding:6px 10px;cursor:pointer}
.pal{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:6px 12px 0;max-width:830px;margin:0 auto;width:100%;
  max-height:132px;overflow-y:auto;overscroll-behavior:contain}
.tool{width:44px;border:1px solid var(--uiLine);border-radius:10px;background:rgba(16,26,38,.6);padding:4px 0 5px;
  display:flex;flex-direction:column;align-items:center;gap:3px;transition:border-color .15s,background .15s}
.tool canvas{width:26px;height:26px;display:block}
.tool span{font-size:7.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--mute2);line-height:1}
.tool:hover{border-color:var(--cyanDim);background:rgba(31,107,102,.14)}
.tool.sel{border-color:var(--cyan);background:rgba(31,107,102,.24)}
.tool.sel span{color:var(--cyan)}
.emsg{text-align:center;font-size:11.5px;min-height:17px;color:var(--mute);padding:7px 14px 0;line-height:1.4}
.emsg.good{color:var(--cyan)} .emsg.bad{color:#ff9b9b}
.erow{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;align-items:center;padding:9px 12px;
  padding-bottom:max(9px,env(safe-area-inset-bottom))}
.ebtn{padding:9px 14px;border:1px solid var(--uiLine);border-radius:9px;font-size:10.5px;font-weight:600;
  letter-spacing:.13em;text-transform:uppercase;background:rgba(16,26,38,.7);
  transition:border-color .15s,background .15s,color .15s}
.ebtn:hover{border-color:var(--cyanDim);background:rgba(31,107,102,.16);color:#fff}
.ebtn.go{border-color:var(--cyanDim);color:var(--cyan)}
.ebtn.go:hover{background:rgba(31,107,102,.3)}
.step{display:flex;align-items:center;gap:3px;border:1px solid var(--uiLine);border-radius:9px;padding:3px 6px;background:rgba(16,26,38,.7)}
.step button{width:21px;height:21px;border-radius:6px;color:var(--mute);font-size:15px;line-height:1}
.step button:hover{color:var(--cyan)}
.step .sv{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);min-width:42px;text-align:center}
.step button.sv{width:auto;height:auto;padding:2px 5px;border-radius:5px}
.step button.sv:hover{color:var(--cyan);background:rgba(31,107,102,.18)}
/* ---------- modal ---------- */
.modal{position:fixed;inset:0;display:grid;place-items:center;background:rgba(4,8,13,.82);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  opacity:0;pointer-events:none;transition:opacity .22s;z-index:25;padding:18px}
.modal.on{opacity:1;pointer-events:auto}
.mcard{width:min(430px,94vw);max-height:84vh;overflow-y:auto;background:linear-gradient(180deg,#101b27,#0a121b);
  border:1px solid var(--uiLine);border-radius:16px;padding:20px;box-shadow:0 30px 90px rgba(0,0,0,.7)}
.mh{font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--cyan);margin:0 0 11px}
.mh.sub{color:var(--mute2);margin-top:20px}
.slot{display:flex;align-items:center;gap:10px;border:1px solid var(--uiLine);border-radius:9px;padding:9px 11px;margin-bottom:7px}
.slot .sn{flex:1;min-width:0;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot canvas.thumb{width:40px;height:40px;border-radius:6px;background:#0a121b;flex:0 0 auto;
  border:1px solid rgba(34,52,74,.8)}
.slot .sz{font-size:9px;color:var(--mute2);letter-spacing:.12em;flex:0 0 auto}
.slot button{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);flex:0 0 auto}
.slot button:hover{color:var(--cyan)}
.slot button.del:hover{color:var(--red)}
.inp{width:100%;background:rgba(6,11,17,.85);border:1px solid var(--uiLine);border-radius:9px;padding:9px 11px;
  color:var(--ink);font:inherit;font-size:12px}
.inp.mono{font-size:10.5px}
.inp:focus{outline:none;border-color:var(--cyanDim)}
.mrow{display:flex;gap:7px;margin-top:8px}
.mrow .ebtn{flex:1;text-align:center}
.empty{color:var(--mute2);font-size:11.5px;padding:4px 2px 8px;line-height:1.5}

/* ---------- misc ---------- */
.fin{text-align:center;padding:40px 24px}
.fin h2{font-size:26px;letter-spacing:.06em;margin-bottom:12px}
.fin p{color:var(--mute);font-size:13px;line-height:1.7;max-width:400px;margin:0 auto}
@media (max-width:420px){ .counts{gap:10px} .ctv{font-size:15px} }
</style>
</head>
<body>

<!-- ================= TITLE ================= -->
<div class="screen on" id="title">
  <div class="logo">GLIDE</div>
  <div class="tag">Frictionless decks &middot; 260 puzzles &middot; daily, endless &amp; your own</div>
  <div class="menu">
    <button class="btn primary" id="bPlay">Continue</button>
    <button class="btn" id="bSelect">Select deck</button>
    <button class="btn" id="bDaily">Daily deck</button>
    <button class="btn" id="bEndless">Endless</button>
    <button class="btn" id="bSand">Sandbox</button>
    <button class="btn" id="bStats">Stats</button>
    <button class="btn" id="bSound">Sound: on</button>
  </div>
  <div class="credit" id="cTotal"></div>
</div>

<!-- ================= LEVEL SELECT ================= -->
<div class="screen" id="select">
  <div class="bar">
    <button class="ico" id="sBack" title="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="barmid"><div class="lvname">Select deck</div><div class="lvsub" id="sProg"></div></div>
    <div style="width:36px"></div>
  </div>
  <div class="grid" id="sGrid"></div>
</div>

<!-- ================= PLAY ================= -->
<div class="screen" id="play">
  <div class="bar">
    <button class="ico" id="pBack" title="Decks (Esc)"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="ico" id="pUndo" title="Undo (Z)"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 016 6v1"/></svg></button>
    <button class="ico" id="pReset" title="Restart (R)"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 10-2.3 6"/><path d="M20 4v7h-7"/></svg></button>
    <button class="ico" id="pHint" title="Show the best next move (H)"><svg viewBox="0 0 24 24"><path d="M9 18h6"/><path d="M10 21h4"/><path d="M12 3a6 6 0 00-3.6 10.8c.5.4.8 1 .9 1.6l.1.6h5.2l.1-.6c.1-.6.4-1.2.9-1.6A6 6 0 0012 3z"/></svg></button>
    <div class="barmid"><div class="lvname" id="pName"></div><div class="lvsub" id="pSub"></div></div>
    <div class="counts">
      <div class="ct" id="ctKeys" style="display:none"><div class="ctv mono" id="pKeys" style="color:#7ef2a5">0</div><div class="ctl">Keys</div></div>
      <div class="ct"><div class="ctv mono" id="pMoves">0</div><div class="ctl">Moves</div></div>
      <div class="ct"><div class="ctv mono" id="pPar" style="color:var(--mute)">0</div><div class="ctl">Par</div></div>
    </div>
  </div>
  <div id="stage"><canvas id="cv"></canvas></div>
</div>

<!-- ================= WIN ================= -->
<div id="win"><div class="card">
  <div class="wtitle" id="wTitle">Deck cleared</div>
  <div class="wname" id="wName"></div>
  <div class="wstat">
    <div class="ws"><div class="wsv mono" id="wMoves"></div><div class="wsl">Moves</div></div>
    <div class="ws"><div class="wsv mono" id="wPar" style="color:var(--mute)"></div><div class="wsl">Par</div></div>
    <div class="ws"><div class="wsv mono" id="wBest" style="color:var(--gold)"></div><div class="wsl" id="wBestL">Best</div></div>
  </div>
  <div class="stars" id="wStars"></div>
  <div class="badge" id="wBadge"></div>
  <div class="wbtns">
    <button class="btn primary" id="wNext">Next deck</button>
    <button class="btn" id="wReplay">Replay route</button>
    <button class="btn" id="wRetry">Retry</button>
    <button class="btn" id="wMenu">All decks</button>
  </div>
</div></div>

<!-- ================= STATS ================= -->
<div class="modal" id="mStats"><div class="mcard">
  <div class="mh">Flight record</div>
  <div id="statBody"></div>
  <div class="mrow"><button class="ebtn go" id="mStatsX">Close</button></div>
</div></div>

<!-- ================= SANDBOX ================= -->
<div class="screen" id="sandbox">
  <div class="bar">
    <button class="ico" id="eBack" title="Title (Esc)"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="ico" id="eUndo" title="Undo edit (Z)"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 016 6v1"/></svg></button>
    <button class="ico" id="eNew" title="New deck"><svg viewBox="0 0 24 24"><path d="M5 4h9l5 5v11H5z"/><path d="M12 10v6"/><path d="M9 13h6"/></svg></button>
    <div class="barmid"><div class="lvname" id="eName">Untitled deck</div><div class="lvsub" id="eSub">Sandbox &middot; draw a deck</div></div>
    <div style="width:36px"></div>
  </div>
  <div class="palbar"><select id="ePalGroup" class="inp"></select></div>
  <div class="pal" id="ePal"></div>
  <div id="estage"><canvas id="ecv"></canvas></div>
  <div class="emsg" id="eMsg"></div>
  <div class="erow">
    <div class="step"><button id="eWm">&minus;</button><span class="sv mono" id="eWv">9 W</span><button id="eWp">+</button></div>
    <div class="step"><button id="eHm">&minus;</button><span class="sv mono" id="eHv">8 H</span><button id="eHp">+</button></div>
    <div class="step"><button id="eZm">&minus;</button><button class="sv mono" id="eZv" title="Fit the deck to the view">100%</button><button id="eZp">+</button></div>
    <button class="ebtn" id="eRot">Rotate</button>
    <button class="ebtn" id="eFlip">Mirror</button>
    <button class="ebtn" id="eOpen">Open</button>
    <button class="ebtn" id="eSave">Save</button>
    <button class="ebtn" id="eCheck">Verify</button>
    <button class="ebtn go" id="eTest">Test deck</button>
  </div>
</div>

<!-- ================= SANDBOX MODALS ================= -->
<div class="modal" id="mSave"><div class="mcard">
  <div class="mh">Save deck</div>
  <input class="inp" id="mName" placeholder="Deck name" maxlength="28" autocomplete="off">
  <div class="mh sub">Share code</div>
  <input class="inp mono" id="mCode" readonly onclick="this.select()">
  <div class="mh sub">Share link</div>
  <input class="inp mono" id="mLink" readonly onclick="this.select()">
  <div class="mrow">
    <button class="ebtn" id="mSaveX">Cancel</button>
    <button class="ebtn go" id="mSaveOk">Save</button>
  </div>
</div></div>

<div class="modal" id="mOpen"><div class="mcard">
  <div class="mh">Saved decks</div>
  <div id="mList"></div>
  <div class="mh sub">Import a share code</div>
  <input class="inp mono" id="mPaste" placeholder="GLIDE1:9:8:####..." autocomplete="off">
  <div class="mrow">
    <button class="ebtn" id="mOpenX">Close</button>
    <button class="ebtn go" id="mImport">Import</button>
  </div>
</div></div>

<script>
/* ===================================================================
   GLIDE — rule engine (generated: identical text to the file the
   solver used to prove all 260 decks solvable)
   =================================================================== */
/* GLIDE rule engine — single source of truth.
   Embedded verbatim into glide.html AND required by the solver/generator,
   so a level that the solver proves solvable is solvable in the shipped page. */
var GLIDE = (function () {
  'use strict';

  // 0=up 1=right 2=down 3=left
  var DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0];
  var ARROW = { '^': 0, '>': 1, 'v': 2, '<': 3 };

  // --- terrain glyphs -------------------------------------------------
  // '#' wall      '.' floor     '0' void (blocks; a crate can plug it)
  // '~' crack     'm' mud       '^>v<' redirector
  // 't' teleport pad (paired in reading order)
  // '!' button (toggles every gate)   'G' gate closed at rest  'g' gate open at rest
  // 'Y'/'B'/'R' spring, 'y'/'b'/'r' its landing pad. A spring throws you onto a
  //   pad of its own colour and you STOP there:
  //     yellow — always its own one pad (springs pair to pads in reading order)
  //     blue   — a random blue pad
  //     red    — whichever red pad you pick
  // 'o' bumper — you do not enter it, you bounce off and slide back
  // '+' rotor — a vane that turns a quarter clockwise every time you use it
  // '/' '\' mirrors — deflect a quarter turn, which way depends on your heading

// ------------------------------------------------------------------ save
var SAVE_KEY = 'glide.save.v1';
var save = { best: {}, route: {}, unlocked: 1, sound: true,
             daily: {}, endless: 0, played: 0 };
try {
  var raw = localStorage.getItem(SAVE_KEY);
  if (raw) { var p = JSON.parse(raw); if (p && typeof p === 'object') {
    save.best = p.best || {}; save.unlocked = p.unlocked || 1;
    save.sound = p.sound !== false;
    save.route = p.route || {}; save.daily = p.daily || {};
    save.endless = p.endless || 0; save.played = p.played || 0;
  } }
} catch (e) {}
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }

// ------------------------------------------------------------------ audio
var actx = null;
function blip(freq, dur, type, gain, slide) {
  if (!save.sound) return;
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    var o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
    o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, slide), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain || .07, t + .012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur + .02);
  } catch (e) {}
}

function show(v) {

}

// ------------------------------------------------------------------ level control
/* Boot any level definition into the play screen. Campaign decks come from
   LEVELS; sandbox decks are built by the editor and never touch the save. */
var SUBTITLE = {
  sandbox: 'Sandbox · test run',
  daily:   'Daily deck',
  endless: 'Endless'
};
function loadObj(lv, mode) {
  CUR = lv; playMode = mode || 'campaign'; sandPlay = playMode === 'sandbox';
  L = GLIDE.parse(lv);
  st = GLIDE.initial(L);
  hist = []; moves = 0; anim = null; parts = []; trail = []; won = false;
  shake = 0; nudgeDir = -1; nudgePad = -1; awaitPick = null; pickHot = -1;
  route = []; replay = null;
  clearHint(); clearStuck();
  $('pName').textContent = lv.name;
  $('pSub').textContent = playMode === 'endless'
    ? 'Endless · run ' + (endless.n + 1) + (endless.streak ? ' · streak ' + endless.streak : '')
    : (SUBTITLE[playMode] || lv.tierName + ' · Deck ' + (idx + 1));
  $('pBack').title = sandPlay ? 'Editor (Esc)' : playMode === 'campaign' ? 'Decks (Esc)' : 'Title (Esc)';
  $('pPar').textContent = lv.par;
  updHud();
  if (lv.hint) showHint(lv.hint);
  resize();
}
function load(i) { idx = i; loadObj(LEVELS[i], 'campaign'); }
function updHud() {
  $('pMoves').textContent = moves;
  $('ctKeys').style.display = L && L.keys.length ? '' : 'none';
  if (L && L.keys.length) $('pKeys').textContent = st.keys;
  $('pUndo').disabled = !hist.length;
  var m = $('pMoves');
  m.style.color = moves > CUR.par ? 'var(--mute)' : 'var(--cyan)';
}
function showHint(text) {
  clearHint();
  hintEl = document.createElement('div');
  hintEl.className = 'hint'; hintEl.textContent = text;
  $('stage').appendChild(hintEl);

function clearStuck() { if (stuckEl) { stuckEl.remove(); stuckEl = null; } }
function showStuck() {
  if (stuckEl) return;
  stuckEl = document.createElement('div');
  stuckEl.className = 'stuck';
  stuckEl.innerHTML = '<b>Stranded.</b> No route to the exit from here.';
  var b = document.createElement('button');
  b.textContent = 'Undo'; b.onclick = function () { undo(); };
  stuckEl.appendChild(b);
  $('stage').appendChild(stuckEl);
}

// ------------------------------------------------------------------ solving
/* One solver serves the whole game — hints, the stranded warning, the sandbox
   and the generators. It plays for the worst case: you choose your slide and,
   on a red spring, your pad, but a BLUE spring chooses for you, so its value is
   the worst pad it could pick. That is what makes par a guarantee rather than
   an average. Returns the moves you can always finish in from `st`, and the
   first move to make; `big` means the deck was too tangled to judge cheaply.
   Pass `hopeful` to ask the easier question instead — is there ANY route, if
   the blue springs happen to fall your way. */
function solveFrom(L, st, cap, hopeful) {
  var index = {}, states = [st], acts = [], i, a, s, o;
  index[GLIDE.key(st)] = 0;
  for (i = 0; i < states.length; i++) {
    if (states.length > cap) return { big: true };
    var A = GLIDE.actions(L, states[i]), list = [];
    for (a = 0; a < A.length; a++) {
      var outs = [];
      for (s = 0; s < A[a].states.length; s++) {
        var ns = A[a].states[s];
        if (ns.won) { outs.push(-1); continue; }
        var k = GLIDE.key(ns), j = index[k];
        if (j === undefined) { j = states.length; index[k] = j; states.push(ns); }
        outs.push(j);
      }
      list.push({ dir: A[a].dir, kind: A[a].kind, outs: outs, pads: A[a].pads });
    }
    acts.push(list);
  }
  var V = new Array(states.length);
  for (i = 0; i < V.length; i++) V[i] = Infinity;
  for (var pass = 0; pass <= states.length; pass++) {
    var changed = false;
    for (i = 0; i < states.length; i++) {
      var best = Infinity;
      for (a = 0; a < acts[i].length; a++) {
        var v = value(acts[i][a], V, hopeful).v;
        if (v + 1 < best) best = v + 1;
      }
      if (best < V[i]) { V[i] = best; changed = true; }
    }
    if (!changed) break;
  }
  if (V[0] === Infinity) return { par: null };
  for (a = 0; a < acts[0].length; a++) {              // read the first move back out
    var r = value(acts[0][a], V, hopeful);
    if (r.v + 1 === V[0])
      return { par: V[0], dir: acts[0][a].dir,
               pad: acts[0][a].kind === 'red' && acts[0][a].pads ? acts[0][a].pads[r.at] : -1 };
  }
  return { par: V[0], dir: -1, pad: -1 };
}
/* What one action is worth: the worst outcome if the deck picks, the best if
   you do. `at` is which outcome that was, so a red spring can name its pad. */
function value(act, V, hopeful) {
  var worst = act.kind === 'blue' && !hopeful, v = worst ? -Infinity : Infinity, at = 0;
  for (var o = 0; o < act.outs.length; o++) {
    var ov = act.outs[o] < 0 ? 0 : V[act.outs[o]];
    if (worst ? ov > v : ov < v) { v = ov; at = o; }
  }
  return { v: v, at: at };
}

// ------------------------------------------------------------------ moving
function tryMove(d) {
  if (view !== 'play' || anim || won || awaitPick) return;
  var tr = [];
  var ns = GLIDE.move(L, st, d, tr);
  if (!ns) { shake = 7; SFX.bad(); return; }
  clearHint(); clearStuck();
  hist.push({ st: st, moves: moves });
  route.push({ d: d, k: -1 });          // kept so a cleared deck can be replayed
  var from = st;
  st = ns; moves++; nudgeDir = -1; nudgePad = -1;
  updHud();
  // `from` lets the renderer show the world as it was, advancing it step by
  // step as the drone actually reaches each tile
  anim = { ops: tr, i: 0, t: 0, from: from, step: tr.length > 14 ? 34 : 52 };
  SFX.slide();
}

/* The slide ended on a spring that still needs a decision. Yellow springs and
   any spring with only one free pad already resolved inside the engine. */
function beginLaunch() {
  if (st.await.kind === 'red') {
    awaitPick = st.await; pickHot = -1;
    showHint('Red spring — pick where to come down. Click a pad, or press 1–' +
             awaitPick.pads.length + '.');
    blip(520, .1, 'triangle', .05);
    return;
  }
  // Blue really is a coin toss — a fresh roll every launch, including after an
  // undo. A replay is the one exception: it lands where the recorded run did.
  var k = -1;
  if (replay) { var tk = replay.t[replay.i - 1]; if (tk && tk.k >= 0) k = tk.k; }
  if (k < 0 || k >= st.await.pads.length) k = Math.floor(Math.random() * st.await.pads.length);
  land(k);
}
function land(k) {
  if (!st.await || k < 0 || k >= st.await.pads.length) return;
  if (route.length) route[route.length - 1].k = k;   // recorded so a replay matches
  var tr = [], before = st;
  st = GLIDE.resolve(L, st, k, tr);
  awaitPick = null; pickHot = -1; clearHint();
  anim = { ops: tr, i: 0, t: 0, from: before, step: 52 };
}

function undo() {
  if (!hist.length || anim || won || replay) return;
  var h = hist.pop();
  route.pop();
  st = h.st; moves = h.moves; trail = []; nudgeDir = -1; nudgePad = -1;
  awaitPick = null; pickHot = -1; clearHint();
  clearStuck(); updHud(); blip(240, .07, 'sine', .04);
}
function restart() {
  if (won || replay) return;
  st = GLIDE.initial(L); hist = []; moves = 0; trail = []; anim = null; nudgeDir = -1;
  route = [];
  nudgePad = -1; awaitPick = null; pickHot = -1; clearHint();
  clearStuck(); updHud(); blip(200, .08, 'sine', .04);
}

/* After the slide settles, check whether the exit is still reachable — for a
   deck with a blue spring, reachable no matter which pad it picks next time. */
function checkStranded() {
  if (won || awaitPick) return;
  // "Stranded" must mean there is no route at all — not merely that a blue
  // spring could yet betray you, which is a risk, not a dead end.
  var r = solveFrom(L, st, 9000, true);
  if (r.big) return;                     // too large to judge cheaply; stay quiet
  if (r.par === null) { showStuck(); SFX.bad(); }
}

// ------------------------------------------------------------------ replay
/* A route is stored as one character per move — u/r/d/l — with a digit after
   it when a red spring asked you to choose. Blue springs need no digit: they
   are a hash of position and move count, so they land the same way every time
   and a replay retraces your run exactly. */
function encRoute(r) {
  var s = '';
  for (var i = 0; i < r.length; i++) s += 'urdl'.charAt(r[i].d) + (r[i].k >= 0 ? (r[i].k + 1) : '');
  return s;
}
function decRoute(s) {
  var out = [], i = 0;
  while (i < s.length) {
    var d = 'urdl'.indexOf(s.charAt(i++));
    if (d < 0) break;
    var k = -1, c = s.charAt(i);
    if (c >= '1' && c <= '9') { k = +c - 1; i++; }
    out.push({ d: d, k: k });
  }
  return out;
}
var lastRoute = [];
function startReplay(tokens) {
  if (!tokens || !tokens.length) return;
  replay = null;
  st = GLIDE.initial(L); hist = []; moves = 0; route = []; trail = []; anim = null;
  parts = []; won = false; awaitPick = null; pickHot = -1; nudgeDir = -1; nudgePad = -1;
  clearStuck(); clearHint(); updHud();
  $('win').classList.remove('on');
  replay = { t: tokens, i: 0, wait: 460, was: playMode };
  showHint('Replaying your best route…');
}
function replayStep(dt) {
  if (anim) return;
  replay.wait -= dt;
  if (replay.wait > 0) return;
  if (awaitPick) {
    var tk = replay.t[replay.i - 1];
    land(tk && tk.k >= 0 ? tk.k : 0);
  } else if (replay.i < replay.t.length) {
    tryMove(replay.t[replay.i++].d);
  } else { replay = null; clearHint(); return; }
  replay.wait = 280;
}

// ------------------------------------------------------------------ generated decks
/* The page carries the generator the campaign was built with, so a deck handed
   to you here clears the same bar: proved winnable, with an exact par. */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
var GEN_MIX = [
  { n: 'Drift',     feat: {} },
  { n: 'Fracture',  feat: { '~': [3, 6] } },
  { n: 'Sludge',    feat: { 'm': [2, 5] } },
  { n: 'Vector',    feat: { 'A': [2, 5] } },
  { n: 'Ballast',   feat: { '0': [2, 4], 'x': [1, 2] } },
  { n: 'Relay',     feat: { 't': [2, 2] } },
  { n: 'Circuit',   feat: { '!': [1, 2], 'G': [2, 4] } },
  { n: 'Ascent',    feat: { 'S': [1, 1] } },
  { n: 'Rebound',   feat: { 'o': [2, 4] } },
  { n: 'Clockwork', feat: { '+': [1, 3] } },
  { n: 'Refraction', feat: { 'D': [2, 4] } },
  { n: 'Lockdown',  feat: { '%': [1, 2], '=': [1, 3] } },
  { n: 'Deep Deck', feat: { '~': [1, 3], 'm': [1, 2], 'A': [1, 3], 't': [2, 2],
                            '0': [1, 2], 'x': [1, 1], 'S': [1, 1], 'o': [1, 2],
                            '+': [1, 2], 'D': [1, 2] } }
];
var ARROWS4 = ['^', '>', 'v', '<'];
function gri(rnd, a, b) { return a + Math.floor(rnd() * (b - a + 1)); }
function gpick(rnd, a) { return a[Math.floor(rnd() * a.length)]; }

function genBoard(rnd, mix, lo, hi) {
  var w = gri(rnd, lo, hi), h = gri(rnd, lo, hi), i, x, y;
  var g = new Array(w * h);
  for (y = 0; y < h; y++) for (x = 0; x < w; x++)
    g[y * w + x] = (x === 0 || y === 0 || x === w - 1 || y === h - 1) ? '#' : '.';
  var inner = [];
  for (y = 1; y < h - 1; y++) for (x = 1; x < w - 1; x++) inner.push(y * w + x);
  if (inner.length < 12) return null;
  for (i = inner.length - 1; i > 0; i--) {
    var j = Math.floor(rnd() * (i + 1)), tmp = inner[i]; inner[i] = inner[j]; inner[j] = tmp;
  }
  var cur = 0, nw = Math.floor(inner.length * .15 * (.6 + rnd() * .8));
  for (i = 0; i < nw && cur < inner.length; i++) g[inner[cur++]] = '#';

  for (var f in mix.feat) {
    if (f === 'S') {                                   // a spring and its pads
      var col = gpick(rnd, ['y', 'j', 'k', 'b', 'r']);
      var np = GLIDE.KIND[col] === 'fixed' ? 1 : gri(rnd, 2, 3);
      if (inner.length - cur < np + 4) return null;
      g[inner[cur++]] = col.toUpperCase();
      for (var q = 0; q < np; q++) g[inner[cur++]] = col;
      continue;
    }
    var n = gri(rnd, mix.feat[f][0], mix.feat[f][1]);
    for (var k = 0; k < n && cur < inner.length; k++)
      g[inner[cur++]] = f === 'A' ? gpick(rnd, ARROWS4)
                      : f === 'D' ? gpick(rnd, ['/', '\\'])
                      : f === 'G' ? (rnd() < .5 ? 'G' : 'g') : f;
  }
  var free = [];
  for (i = cur; i < inner.length; i++) if (g[inner[i]] === '.') free.push(inner[i]);
  var nc = gri(rnd, 0, 2);
  if (free.length < nc + 2) return null;
  var fi = 0;
  g[free[fi++]] = '@'; g[free[fi++]] = 'E';
  for (var c = 0; c < nc; c++) g[free[fi++]] = '*';
  return { w: w, h: h, grid: g.join('') };
}

/* Hand back a proved deck at roughly the difficulty asked for. The band is
   relaxed on a second pass rather than ever shipping an unproved board. */
function genDeck(seed, hard, name) {
  var rnd = mulberry32(seed);
  var mix = GEN_MIX[Math.max(0, Math.min(GEN_MIX.length - 1, Math.floor(hard)))];
  var lo = 4 + Math.floor(hard * 1.2), hi = lo + 6;
  var sz = hard < 3 ? [6, 8] : [7, 10];
  for (var pass = 0; pass < 2; pass++) {
    for (var tries = 0; tries < 500; tries++) {
      var cand = genBoard(rnd, mix, sz[0], sz[1]);
      if (!cand) continue;
      var P = GLIDE.parse({ w: cand.w, h: cand.h, grid: cand.grid, par: 0 });
      var r = solveFrom(P, GLIDE.initial(P), 20000);
      if (r.big || r.par === null) continue;
      if (pass === 0 ? (r.par < lo || r.par > hi) : r.par < 3) continue;
      return { id: 0, w: cand.w, h: cand.h, grid: cand.grid, par: r.par,
               name: name, tierName: mix.n };
    }
  }
  return null;
}

function dailyKey() {
  var d = new Date();
  return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
}
function dailyName() {
  var d = new Date();
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) + ' deck';
}
function startDaily() {
  var key = dailyKey();
  var lv = genDeck(key, 3 + (key % 5), dailyName());
  if (!lv) { blip(120, .1, 'square', .04); return; }
  lv.hint = 'One deck a day, the same for every run. Cleared in ' + lv.par + ' if you find the line.';
  loadObj(lv, 'daily');
  show('play');
}
function startEndless() {
  endless = { n: 0, seed: (Date.now() ^ 0x9e3779b9) >>> 0, streak: 0 };
  nextEndless();
}
function nextEndless() {
  var hard = Math.min(GEN_MIX.length - 1, endless.n * 0.5);
  var lv = genDeck((endless.seed + endless.n * 7919) >>> 0, hard, 'Run ' + (endless.n + 1));
  if (!lv) { endless.n++; if (endless.n < 60) return nextEndless(); return; }
  loadObj(lv, 'endless');
  show('play');
}

// ------------------------------------------------------------------ finishing
function starsFor(m, par) { return m <= par ? 3 : m <= par + 2 ? 2 : 1; }
function starStr(n) { return '★★★'.slice(0, n) + '☆☆☆'.slice(0, 3 - n); }

function finish() {
  won = true;
  var par = CUR.par;
  SFX.win(); flash = 1;
  for (var i = 0; i < 34; i++) burst(st.p, '#4fe3d2');
  $('wName').textContent = CUR.name;
  $('wMoves').textContent = moves;
  $('wPar').textContent = par;
  $('wStars').textContent = starStr(starsFor(moves, par));
  $('wBestL').textContent = 'Best';
  $('wNext').textContent = 'Next deck';
  var wasReplay = !!replay;
  replay = null;
  if (!wasReplay) lastRoute = route.slice();
  $('wReplay').style.display = lastRoute.length ? '' : 'none';

  if (wasReplay) {
    $('wTitle').textContent = 'Replay finished';
    $('wBest').textContent = playMode === 'campaign' && save.best[CUR.id] !== undefined
      ? save.best[CUR.id] : moves;
    $('wBadge').textContent = '';
    $('wNext').style.display = playMode === 'campaign' && idx + 1 < LEVELS.length ? '' : 'none';
  } else if (playMode === 'sandbox') {
    // a test run: report the route, leave campaign progress untouched
    $('wBest').textContent = '—';
    $('wTitle').textContent = 'Test cleared';
    $('wBadge').textContent = moves <= par ? 'Optimal route' : 'Par is ' + par;
    $('wBadge').style.color = moves <= par ? 'var(--gold)' : 'var(--mute)';
    $('wNext').style.display = 'none';
    $('wMenu').textContent = 'Back to editor';
  } else if (playMode === 'endless') {
    endless.streak++;
    if (endless.streak > save.endless) save.endless = endless.streak;
    save.played++; persist();
    $('wBest').textContent = save.endless;
    $('wBestL').textContent = 'Best run';
    $('wTitle').textContent = 'Deck ' + (endless.n + 1) + ' cleared';
    $('wBadge').textContent = 'Streak ' + endless.streak;
    $('wBadge').style.color = 'var(--cyan)';
    $('wNext').style.display = '';
    $('wMenu').textContent = 'End run';
  } else if (playMode === 'daily') {
    var dk = String(dailyKey()), prevD = save.daily[dk];
    if (prevD === undefined || moves < prevD) save.daily[dk] = moves;
    save.played++; persist();
    $('wBest').textContent = save.daily[dk];
    $('wTitle').textContent = 'Daily cleared';
    $('wBadge').textContent = moves <= par ? 'Optimal route' : 'Par is ' + par;
    $('wBadge').style.color = moves <= par ? 'var(--gold)' : 'var(--mute)';
    $('wNext').style.display = 'none';
    $('wMenu').textContent = 'Title';
  } else {
    var id = CUR.id;
    var prev = save.best[id];
    var isBest = prev === undefined || moves < prev;
    if (isBest) { save.best[id] = moves; save.route[id] = encRoute(route); }
    save.played++;
    if (save.unlocked < idx + 2) save.unlocked = Math.min(LEVELS.length, idx + 2);
    persist();
    $('wBest').textContent = save.best[id];
    $('wTitle').textContent = idx + 1 === LEVELS.length ? 'Final deck cleared' : 'Deck cleared';
    $('wBadge').textContent = moves <= par ? 'Optimal route' : (isBest ? 'New best' : '');
    $('wBadge').style.color = moves <= par ? 'var(--gold)' : 'var(--cyan)';
    $('wNext').style.display = idx + 1 < LEVELS.length ? '' : 'none';
    $('wMenu').textContent = 'All decks';
  }
  setTimeout(function () { $('win').classList.add('on'); }, 480);
}

// ------------------------------------------------------------------ particles
function burst(cell, color) {
  var a = Math.random() * Math.PI * 2, sp = 0.6 + Math.random() * 2.6;
  parts.push({ c: cell, x: (Math.random() - .5) * .3, y: (Math.random() - .5) * .3,
    vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, col: color,
    r: 1.4 + Math.random() * 2.4 });
}

// ------------------------------------------------------------------ layout
var CS = 40, OX = 0, OY = 0, DPR = 1;
function resize() {
  if (!L) return;
  var stage = $('stage');
  var aw = stage.clientWidth - 26, ah = stage.clientHeight - 26;
  if (aw <= 0 || ah <= 0) return;
  CS = Math.max(18, Math.floor(Math.min(aw / L.w, ah / L.h)));
  CS = Math.min(CS, 78);
  var w = CS * L.w, h = CS * L.h;
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  cv.width = Math.round(w * DPR); cv.height = Math.round(h * DPR);
  cv.style.width = w + 'px'; cv.style.height = h + 'px';
  OX = 0; OY = 0;
}
window.addEventListener('resize', function () { resize(); edResize(); });

function cx(i) { return (i % L.w) * CS + CS / 2; }
function cy(i) { return ((i / L.w) | 0) * CS + CS / 2; }

// ------------------------------------------------------------------ drawing helpers
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function glow(color, blur, fn) {
  ctx.save(); ctx.shadowColor = color; ctx.shadowBlur = blur; fn(); ctx.restore();
}

// ------------------------------------------------------------------ render
var last = 0, T = 0;
function frame(now) {
  requestAnimationFrame(frame);
  var dt = Math.min(50, now - last || 16); last = now; T += dt;
  if (view === 'sandbox') { edDraw(); return; }
  if (view !== 'play' || !L) return;
  step(dt);
  draw();
}

function step(dt) {
  if (shake > 0) shake = Math.max(0, shake - dt * .045);
  if (flash > 0) flash = Math.max(0, flash - dt * .0022);
  if (nudgeT > 0) nudgeT = Math.max(0, nudgeT - dt);

  for (var i = parts.length - 1; i >= 0; i--) {
    var p = parts[i];
    p.x += p.vx * dt * .016; p.y += p.vy * dt * .016;
    p.vx *= .94; p.vy *= .94; p.life -= dt * .0022;
    if (p.life <= 0) parts.splice(i, 1);
  }
  for (var t = trail.length - 1; t >= 0; t--) {
    trail[t].life -= dt * .0035;
    if (trail[t].life <= 0) trail.splice(t, 1);
  }

  if (anim) {
    anim.t += dt;
    while (anim.i < anim.ops.length && anim.t >= stepFor(anim.ops[anim.i])) {
      var op = anim.ops[anim.i];
      anim.t -= stepFor(op);
      // fire the step's effects as it completes
      if (op.t === 'm') {
        trail.push({ c: op.from, life: 1 });
        if (op.core) { for (var k = 0; k < 16; k++) burst(op.core, '#ffc65c'); SFX.core(); }
        if (op.gotkey !== undefined) { for (var g2 = 0; g2 < 12; g2++) burst(op.gotkey, KEY_COL); SFX.key(); }
        if (op.unlock !== undefined) {
          for (var u2 = 0; u2 < 14; u2++) burst(op.unlock, KEY_COL);
          SFX.unlock(); shake = Math.max(shake, 4);
        }
        if (op.brk !== undefined) SFX.crack();
        if (op.fill !== undefined) { SFX.fill(); shake = 5; for (var q = 0; q < 12; q++) burst(op.fill, '#c8794a'); }
        else if (op.ct !== undefined) SFX.crate();
        if (op.btn !== undefined) SFX.gate();
      } else if (op.t === 'tp') { SFX.tele(); for (var z = 0; z < 10; z++) burst(op.to, '#a97bff'); }
      else if (op.t === 'bump') {
        SFX.bump();
        shake = Math.max(shake, 3.4);
        for (var y3 = 0; y3 < 6; y3++) burst(op.from, '#cfe0e8');
      }
      else if (op.t === 'sp') {
        SFX.spring();
        var col = SPRING_COL[op.kind === 'blue' ? 'b' : op.kind === 'red' ? 'r' : 'y'];
        for (var y2 = 0; y2 < 14; y2++) burst(op.to, col);
        shake = Math.max(shake, 4);
      }
      anim.i++;
    }
    if (anim.i >= anim.ops.length) {
      anim = null;
      if (st.await) beginLaunch();
      else if (st.won) { if (!won) finish(); }
      else { SFX.stop(); shake = Math.max(shake, 2.2); checkStranded(); }
    }
  }
  if (replay) replayStep(dt);
}

/* A launch gets its own, slower beat than a step of a slide. */
function stepFor(op) {
  if (!op) return anim.step;
  return op.t === 'sp' ? 300 : op.t === 'bump' ? 95 : anim.step;
}

/* Where to draw the drone right now, in pixels. */
function playerXY() {
  if (!anim) return { x: cx(st.p), y: cy(st.p), scale: 1 };
  var op = anim.ops[Math.min(anim.i, anim.ops.length - 1)];
  if (!op) return { x: cx(st.p), y: cy(st.p), scale: 1 };
  if (op.t === 'tp') return { x: cx(op.to), y: cy(op.to), scale: .6 };
  if (op.t === 'bump') {                     // squashed against the bumper
    var b = Math.sin(Math.min(1, anim.t / stepFor(op)) * Math.PI);
    return { x: cx(op.from) + (cx(op.at) - cx(op.from)) * b * .22,
             y: cy(op.from) + (cy(op.at) - cy(op.from)) * b * .22,
             scale: 1 - b * .18 };
  }
  if (op.t === 'sp') {                       // thrown: an arc, not a slide
    var q = Math.min(1, anim.t / stepFor(op));
    var e = q < .5 ? 2 * q * q : 1 - Math.pow(2 - 2 * q, 2) / 2;
    return { x: cx(op.from) + (cx(op.to) - cx(op.from)) * e,
             y: cy(op.from) + (cy(op.to) - cy(op.from)) * e - Math.sin(q * Math.PI) * CS * .6,
             scale: 1 + Math.sin(q * Math.PI) * .4 };
  }
  var f = Math.min(1, anim.t / stepFor(op));
  return { x: cx(op.from) + (cx(op.to) - cx(op.from)) * f,
           y: cy(op.from) + (cy(op.to) - cy(op.from)) * f, scale: 1 };
}
/* Crate positions right now. During a slide, crates sit where they were
   *before* the in-flight step, and the one being shoved tweens forward. */
function crateList() {
  if (!anim) return st.crates.map(function (c) { return { c: c, x: cx(c), y: cy(c) }; });
  var i = Math.min(anim.i, anim.ops.length - 1);
  var op = anim.ops[i];
  var prior = anim.from.crates;
  for (var b = i - 1; b >= 0; b--) if (anim.ops[b].crates) { prior = anim.ops[b].crates; break; }
  var f = Math.min(1, anim.t / anim.step);
  return prior.map(function (c) {
    if (op && op.t === 'm' && op.cf === c) {
      var e = { c: c, x: cx(c) + (cx(op.ct) - cx(c)) * f, y: cy(c) + (cy(op.ct) - cy(c)) * f };
      if (op.fill !== undefined) e.sink = f;    // dropping into the pit it plugs
      return e;
    }
    return { c: c, x: cx(c), y: cy(c) };
  });
}

/* The world as it should look *right now*: mid-slide the board is only as far
   along as the steps the drone has actually completed, so plating collapses
   behind it and cores wink out as it reaches them — not the instant you press. */
function visual() {
  if (!anim) return { cores: st.cores, broken: st.broken, filled: st.filled,
                      gates: st.gates, rot: st.rot, keysGot: st.keysGot,
                      keys: st.keys, opened: st.opened, worn: st.worn,
                      press: st.press, mv: st.mv, ord: st.ord };
  var f = anim.from;
  var cores = f.cores, gates = f.gates, rot = f.rot;
  var keysGot = f.keysGot, held = f.keys, opened = f.opened, worn = f.worn.slice();
  var broken = f.broken.slice(), filled = f.filled.slice();
  for (var i = 0; i < anim.i && i < anim.ops.length; i++) {
    var op = anim.ops[i];
    if (op.t !== 'm') continue;
    if (op.core !== undefined) {
      var ci = L.cores.indexOf(op.core);
      if (ci >= 0) cores |= (1 << ci);
    }
    if (op.brk !== undefined) broken.push(op.brk);
    if (op.fill !== undefined) filled.push(op.fill);
    if (op.btn !== undefined) gates ^= 1;
    if (op.rot !== undefined) {                    // the rotor turns as you leave it
      var rf = ((rot >> (op.rot * 2)) & 3) + 1 & 3;
      rot = (rot & ~(3 << (op.rot * 2))) | (rf << (op.rot * 2));
    }
    if (op.wear !== undefined) {
      var wi2 = L.wearIndex[op.wear];
      if (wi2 !== undefined) worn[wi2]++;
    }
    if (op.unlock !== undefined) { opened |= (1 << L.lockIndex[op.unlock]); held--; }
    if (op.gotkey !== undefined) {
      var ki = L.keys.indexOf(op.gotkey);
      if (ki >= 0) { keysGot |= (1 << ki); held++; }
    }
  }
  return { cores: cores, broken: broken, filled: filled, gates: gates, rot: rot,
           keysGot: keysGot, keys: held, opened: opened, worn: worn,
           press: f.press, mv: f.mv, ord: f.ord };
}
var V = null;   // set once per frame by draw()
function isBroken(i) { return V.broken.indexOf(i) >= 0 && V.filled.indexOf(i) < 0; }
function isFilled(i) { return V.filled.indexOf(i) >= 0; }
function gateOpen(t) { return t === 'G' ? V.gates === 1 : V.gates === 0; }

function draw() {
  var w = cv.width, h = cv.height;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, w, h);
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);

  V = visual();
  if (L.keys.length) $('pKeys').textContent = V.keys;   // count what you hold right now
  var pulse = .5 + .5 * Math.sin(T * .0032);
  var coresLeft = V.cores !== GLIDE.allCores(L);

  // ---- terrain ----
  for (var i = 0; i < L.w * L.h; i++) {
    var t = L.terrain[i], x = (i % L.w) * CS, y = ((i / L.w) | 0) * CS;
    var open = !(t === '#');
    var broken = isBroken(i), filled = isFilled(i);
    var isPit = (t === '0' && !filled) || broken;

    if (t === '#') { drawWall(x, y, i); continue; }
    if (isPit) { drawPit(x, y); continue; }
    drawFloor(x, y, i);

    if (t === '~' && !broken) drawCrack(x, y, i);
    else if (t === 'm') drawMud(x, y);
    else if (t === '^' || t === '>' || t === 'v' || t === '<') drawVane(x, y, GLIDE.ARROW[t]);
    else if (t === 't') drawPad(x, y, pulse);
    else if (t === '!') drawButton(x, y);
    else if (t === 'G' || t === 'g') drawGate(x, y, gateOpen(t), pulse);
    else if (t === 'o') drawBumper(x, y, pulse);
    else if (t === '+') drawRotor(x, y, (V.rot >> (L.rotorIndex[i] * 2)) & 3, pulse);
    else if (GLIDE.EXTBY[t]) drawExtTile(x, y, i, GLIDE.EXTBY[t], pulse,
                                         V.worn[L.wearIndex[i]] || 0);
    else if (GLIDE.MIRROR[t]) drawMirror(x, y, t, pulse);
    else if (t === '%') { if (!(V.keysGot & (1 << L.keys.indexOf(i)))) drawKey(x, y, pulse); }
    else if (t === '=') drawLock(x, y, (V.opened >> L.lockIndex[i]) & 1, pulse);
    else if (GLIDE.SPRING[t]) drawSpring(x, y, GLIDE.SPRING[t], pulse, L.pairNo[i]);
    else if (GLIDE.PAD[t]) drawLandPad(x, y, t, pulse, L.pairNo[i]);
    else if (t === 'E') drawExit(x, y, !coresLeft, pulse);
  }

  // ---- trail ----
  for (var tr = 0; tr < trail.length; tr++) {
    var e = trail[tr];
    ctx.globalAlpha = e.life * .3;
    ctx.fillStyle = '#4fe3d2';
    rr(cx(e.c) - CS * .21, cy(e.c) - CS * .21, CS * .42, CS * .42, CS * .12);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // ---- cores ----
  for (var c = 0; c < L.cores.length; c++) {
    if (V.cores & (1 << c)) continue;
    drawCore(cx(L.cores[c]), cy(L.cores[c]), pulse);
  }

  // ---- crates ----
  var cl = crateList();
  for (var q = 0; q < cl.length; q++) drawCrate(cl[q].x, cl[q].y, cl[q].sink || 0);

  // ---- drone ----
  var pp = playerXY();
  drawDrone(pp.x, pp.y, pp.scale, pulse);

  // ---- red-spring chooser ----
  if (awaitPick) drawChooser(pulse);

  // ---- nudge arrow ----
  if (nudgeT > 0 && nudgeDir >= 0) drawNudge(pp.x, pp.y, nudgeDir);
  if (nudgeT > 0 && nudgePad >= 0) {
    ctx.globalAlpha = Math.min(1, nudgeT / 300) * .85;
    ctx.strokeStyle = '#ffc65c';
    ctx.lineWidth = Math.max(2, CS * .07);
    ctx.beginPath(); ctx.arc(cx(nudgePad), cy(nudgePad), CS * .38, 0, 6.2832); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // ---- particles ----
  for (var p = 0; p < parts.length; p++) {
    var a = parts[p];
    ctx.globalAlpha = Math.max(0, a.life);
    ctx.fillStyle = a.col;
    ctx.beginPath();
    ctx.arc(cx(a.c) + a.x * CS * .5, cy(a.c) + a.y * CS * .5, a.r * (CS / 44) * a.life, 0, 6.2832);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  if (flash > 0) {
    ctx.fillStyle = 'rgba(79,227,210,' + (flash * .3) + ')';
    ctx.fillRect(0, 0, cv.width, cv.height);
  }
}

// ------------------------------------------------------------------ tile art
function drawFloor(x, y, i) {
  var alt = ((i % L.w) + ((i / L.w) | 0)) % 2;
  ctx.fillStyle = alt ? '#16212e' : '#182430';
  ctx.fillRect(x, y, CS, CS);
  ctx.strokeStyle = 'rgba(9,15,22,.85)'; ctx.lineWidth = 1;
  ctx.strokeRect(x + .5, y + .5, CS - 1, CS - 1);
  ctx.fillStyle = 'rgba(255,255,255,.028)';
  ctx.fillRect(x + CS * .12, y + CS * .12, CS * .1, CS * .1);
}
function drawWall(x, y, i) {
  var g = ctx.createLinearGradient(x, y, x, y + CS);
  g.addColorStop(0, '#3a4d68'); g.addColorStop(.4, '#2b3a4f'); g.addColorStop(1, '#222f41');
  ctx.fillStyle = g;
  ctx.fillRect(x, y, CS, CS);
  ctx.fillStyle = 'rgba(255,255,255,.09)';
  ctx.fillRect(x, y, CS, Math.max(1.5, CS * .055));
  ctx.fillStyle = 'rgba(0,0,0,.34)';
  ctx.fillRect(x, y + CS - Math.max(1.5, CS * .06), CS, Math.max(1.5, CS * .06));
  ctx.strokeStyle = 'rgba(8,12,18,.7)'; ctx.lineWidth = 1;
  ctx.strokeRect(x + .5, y + .5, CS - 1, CS - 1);
}
function drawPit(x, y) {
  ctx.fillStyle = '#04070c';
  ctx.fillRect(x, y, CS, CS);
  var g = ctx.createRadialGradient(x + CS / 2, y + CS / 2, CS * .1, x + CS / 2, y + CS / 2, CS * .7);
  g.addColorStop(0, 'rgba(0,0,0,.9)'); g.addColorStop(1, 'rgba(28,40,56,.55)');
  ctx.fillStyle = g; ctx.fillRect(x, y, CS, CS);
  ctx.strokeStyle = 'rgba(60,80,105,.5)'; ctx.lineWidth = 1;
  ctx.strokeRect(x + .5, y + .5, CS - 1, CS - 1);
}
function drawCrack(x, y, i) {
  ctx.strokeStyle = 'rgba(150,175,200,.34)';
  ctx.lineWidth = Math.max(1, CS * .028);
  var s = (i * 2654435761) >>> 0;
  function rnd() { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }
  for (var k = 0; k < 3; k++) {
    ctx.beginPath();
    var px = x + CS * (.15 + rnd() * .2), py = y + CS * (.12 + rnd() * .18);
    ctx.moveTo(px, py);
    for (var seg = 0; seg < 3; seg++) {
      px += CS * (.1 + rnd() * .22); py += CS * (.12 + rnd() * .2);
      ctx.lineTo(px, py);
    }
    ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(200,120,90,.3)';
  ctx.lineWidth = 1;
  ctx.strokeRect(x + CS * .1 + .5, y + CS * .1 + .5, CS * .8, CS * .8);
}
function drawMud(x, y) {
  ctx.fillStyle = '#3a2e1d';
  rr(x + CS * .06, y + CS * .06, CS * .88, CS * .88, CS * .16); ctx.fill();
  ctx.fillStyle = 'rgba(120,95,55,.5)';
  for (var k = 0; k < 3; k++) {
    var ph = Math.sin(T * .0014 + k * 2.1) * .5 + .5;
    ctx.beginPath();
    ctx.ellipse(x + CS * (.3 + k * .2), y + CS * (.38 + k * .14),
      CS * (.09 + ph * .035), CS * .045, 0, 0, 6.2832);
    ctx.fill();
  }
}
function drawVane(x, y, d) {
  ctx.save();
  ctx.translate(x + CS / 2, y + CS / 2);
  ctx.rotate(d * Math.PI / 2);
  var pulse = (T * .0018) % 1;
  for (var k = 0; k < 2; k++) {
    var off = (pulse + k * .5) % 1;
    ctx.globalAlpha = .28 + .5 * (1 - Math.abs(off - .5) * 2);
    ctx.strokeStyle = '#4fe3d2';
    ctx.lineWidth = Math.max(1.6, CS * .07);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    var yy = -CS * .3 + off * CS * .42;
    ctx.beginPath();
    ctx.moveTo(-CS * .19, yy + CS * .12);
    ctx.lineTo(0, yy - CS * .06);
    ctx.lineTo(CS * .19, yy + CS * .12);
    ctx.stroke();
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}
function drawPad(x, y, pulse) {
  var r = CS * .3;
  ctx.strokeStyle = 'rgba(169,123,255,.85)';
  ctx.lineWidth = Math.max(1.4, CS * .045);
  ctx.beginPath(); ctx.arc(x + CS / 2, y + CS / 2, r, 0, 6.2832); ctx.stroke();
  ctx.save();
  ctx.translate(x + CS / 2, y + CS / 2); ctx.rotate(T * .0022);
  ctx.strokeStyle = 'rgba(169,123,255,' + (.35 + pulse * .5) + ')';
  ctx.lineWidth = Math.max(1.2, CS * .05);
  for (var k = 0; k < 3; k++) {
    ctx.beginPath();
    ctx.arc(0, 0, r * .62, k * 2.094, k * 2.094 + .9);
    ctx.stroke();
  }
  ctx.restore();
  glow('#a97bff', CS * .3 * pulse, function () {
    ctx.fillStyle = 'rgba(169,123,255,' + (.18 + pulse * .22) + ')';
    ctx.beginPath(); ctx.arc(x + CS / 2, y + CS / 2, r * .35, 0, 6.2832); ctx.fill();
  });
}
/* ---- springs and their landing pads ----
   Colour says where you land: yellow always its own pad, blue a random one,
   red the one you pick. Shape says which is which — a spring is a coil under
   chevrons, a pad is an open target. */
/* Each fixed channel gets its own hue as well as its own number, so a deck
   with several of them stays readable at a glance. */
var SPRING_COL = { y: '#ffd24a', j: '#ff9f43', k: '#c3e650', l: '#ff7ab8',
                   b: '#58a6ff', r: '#ff6b6b' };

/* ---- bumper and rotor ----
   A bumper is a wall that gives the momentum back. A rotor is a vane that
   moves on a quarter turn every time you ride it, so its state is part of the
   puzzle — the pips around the rim count how far round it has come. */
function drawBumper(x, y, pulse) {
  var mx = x + CS / 2, my = y + CS / 2, r = CS * .33;
  var g = ctx.createRadialGradient(mx - r * .3, my - r * .3, r * .1, mx, my, r);
  g.addColorStop(0, '#f3f7fa'); g.addColorStop(.45, '#9fb6cc'); g.addColorStop(1, '#4a6076');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(mx, my, r, 0, 6.2832); ctx.fill();
  ctx.strokeStyle = 'rgba(12,18,26,.75)'; ctx.lineWidth = Math.max(1, CS * .035);
  ctx.beginPath(); ctx.arc(mx, my, r, 0, 6.2832); ctx.stroke();
  glow('#e8f2f6', CS * (.1 + pulse * .18), function () {
    ctx.strokeStyle = 'rgba(232,242,246,' + (.5 + pulse * .4) + ')';
    ctx.lineWidth = Math.max(1.2, CS * .045);
    ctx.beginPath(); ctx.arc(mx, my, r * (.55 + pulse * .12), 0, 6.2832); ctx.stroke();
  });
}
function drawRotor(x, y, face, pulse) {
  var mx = x + CS / 2, my = y + CS / 2, r = CS * .33;
  ctx.strokeStyle = 'rgba(169,123,255,.4)';
  ctx.lineWidth = Math.max(1, CS * .03);
  ctx.beginPath(); ctx.arc(mx, my, r, 0, 6.2832); ctx.stroke();
  for (var k = 0; k < 4; k++) {                    // a pip per quarter, the live one lit
    var a = k * 1.5708 - 1.5708;
    ctx.fillStyle = k === face ? '#a97bff' : 'rgba(169,123,255,.28)';
    ctx.beginPath();
    ctx.arc(mx + Math.cos(a) * r, my + Math.sin(a) * r, CS * (k === face ? .045 : .028), 0, 6.2832);
    ctx.fill();
  }
  ctx.save();
  ctx.translate(mx, my);
  ctx.rotate(face * Math.PI / 2);
  glow('#a97bff', CS * (.14 + pulse * .18), function () {
    ctx.strokeStyle = '#c4a4ff';
    ctx.lineWidth = Math.max(1.6, CS * .065);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(0, CS * .16);
    ctx.lineTo(0, -CS * .16);
    ctx.moveTo(-CS * .12, -CS * .04);
    ctx.lineTo(0, -CS * .18);
    ctx.lineTo(CS * .12, -CS * .04);
    ctx.stroke();
  });
  ctx.restore();
}

/* ---- mirrors, keys and locks ----
   A mirror deflects a quarter turn, but which way depends on how you arrive,
   so unlike a vane it preserves where you came from. Locks are green like the
   keys that open them, and stay open once spent. */
var KEY_COL = '#7ef2a5';
function drawMirror(x, y, ch, pulse) {
  var back = ch === '/';
  var x1 = x + CS * (back ? .18 : .18), y1 = y + CS * (back ? .82 : .18);
  var x2 = x + CS * .82, y2 = y + CS * (back ? .18 : .82);
  ctx.strokeStyle = 'rgba(200,225,240,.22)';
  ctx.lineWidth = Math.max(3, CS * .17);
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  glow('#dff2ff', CS * (.12 + pulse * .16), function () {
    ctx.strokeStyle = 'rgba(223,242,255,' + (.7 + pulse * .25) + ')';
    ctx.lineWidth = Math.max(1.4, CS * .055);
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  });
  ctx.strokeStyle = 'rgba(120,160,190,.5)';
  ctx.lineWidth = Math.max(1, CS * .025);
  ctx.beginPath();
  ctx.moveTo(x1 + (back ? 0 : 0), y1); ctx.lineTo(x2, y2);
  ctx.stroke();
}
function drawKey(x, y, pulse) {
  var mx = x + CS / 2, my = y + CS / 2;
  glow(KEY_COL, CS * (.2 + pulse * .24), function () {
    ctx.strokeStyle = KEY_COL;
    ctx.lineWidth = Math.max(1.5, CS * .06);
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(mx - CS * .08, my - CS * .06, CS * .11, 0, 6.2832); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(mx + CS * .01, my + CS * .02);
    ctx.lineTo(mx + CS * .18, my + CS * .19);
    ctx.moveTo(mx + CS * .11, my + CS * .12);
    ctx.lineTo(mx + CS * .18, my + CS * .05);
    ctx.stroke();
  });
}
function drawLock(x, y, open, pulse) {
  if (open) {                                  // spent — a doorway, not a door
    ctx.strokeStyle = 'rgba(126,242,165,.28)';
    ctx.lineWidth = 1;
    ctx.setLineDash([CS * .1, CS * .08]);
    ctx.strokeRect(x + CS * .16 + .5, y + CS * .16 + .5, CS * .68, CS * .68);
    ctx.setLineDash([]);
    return;
  }
  var g = ctx.createLinearGradient(x, y, x, y + CS);
  g.addColorStop(0, 'rgba(58,120,84,.85)'); g.addColorStop(1, 'rgba(28,72,50,.85)');
  ctx.fillStyle = g;
  rr(x + CS * .07, y + CS * .07, CS * .86, CS * .86, CS * .1); ctx.fill();
  ctx.strokeStyle = 'rgba(126,242,165,' + (.55 + pulse * .3) + ')';
  ctx.lineWidth = Math.max(1.3, CS * .05);
  rr(x + CS * .07, y + CS * .07, CS * .86, CS * .86, CS * .1); ctx.stroke();
  var mx = x + CS / 2, my = y + CS / 2;
  ctx.strokeStyle = KEY_COL; ctx.lineWidth = Math.max(1.3, CS * .05);
  ctx.beginPath(); ctx.arc(mx, my - CS * .1, CS * .11, Math.PI, 0); ctx.stroke();
  ctx.fillStyle = KEY_COL;
  rr(mx - CS * .15, my - CS * .02, CS * .3, CS * .22, CS * .05); ctx.fill();
  ctx.fillStyle = 'rgba(10,20,14,.9)';
  ctx.beginPath(); ctx.arc(mx, my + CS * .09, CS * .04, 0, 6.2832); ctx.fill();
}

/* ---- the 100 extended tiles ----
   One drawer, driven by each tile's `draw` spec, rather than a hundred bespoke
   painters. A spent tile is drawn as whatever it turned into. */
function drawExtTile(x, y, i, sp, pulse, worn) {
  var dw = sp.draw, col = dw.col || '#9fb6cc', rot = dw.rot || 0;
  if (sp.wear && worn >= sp.wear.max) {          // used up — show what it became
    if (sp.wear.then === 'void') { drawPit(x, y); return; }
    drawFloor(x, y, i);
    if (sp.wear.then === 'wall') drawWall(x, y, i);
    return;
  }
  if (dw.base === 'wall') {
    drawWall(x, y, i);
    ctx.fillStyle = 'rgba(6,11,17,.45)';
    rr(x + CS * .1, y + CS * .1, CS * .8, CS * .8, CS * .12); ctx.fill();
  } else drawFloor(x, y, i);

  ctx.save();
  ctx.translate(x + CS / 2, y + CS / 2);
  ctx.rotate(rot * Math.PI / 2);
  ctx.strokeStyle = col; ctx.fillStyle = col;
  ctx.lineWidth = Math.max(1.3, CS * .055);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  var ic = dw.icon;
  ctx.beginPath();
  if (ic === 'oneway') {                          // a gate you may pass one way
    ctx.moveTo(-CS * .2, CS * .1); ctx.lineTo(0, -CS * .12); ctx.lineTo(CS * .2, CS * .1);
    ctx.moveTo(-CS * .26, CS * .24); ctx.lineTo(CS * .26, CS * .24);
    ctx.stroke();
  } else if (ic === 'belt') {
    for (var b = -1; b <= 1; b++) {
      ctx.moveTo(-CS * .18, b * CS * .15 + CS * .06);
      ctx.lineTo(0, b * CS * .15 - CS * .06);
      ctx.lineTo(CS * .18, b * CS * .15 + CS * .06);
    }
    ctx.stroke();
  } else if (ic === 'corner') {
    ctx.moveTo(-CS * .2, CS * .2); ctx.lineTo(-CS * .2, -CS * .05);
    ctx.lineTo(CS * .18, -CS * .05);

// ------------------------------------------------------------------ input
window.addEventListener('keydown', function (e) {
  var k = e.key;
  if (view === 'play') {
    if ($('win').classList.contains('on')) {
      // a sandbox test run has no "next deck" — Enter goes back to the editor
      if (k === 'Enter' || k === ' ') { e.preventDefault(); $(sandPlay ? 'wMenu' : 'wNext').click(); }
      return;
    }
    if (awaitPick) {                       // a red spring is waiting on you
      if (k >= '1' && k <= '9') { e.preventDefault(); land(+k - 1); return; }
      if (k === 'h' || k === 'H') { e.preventDefault(); nudge(); return; }
      if (k === 'z' || k === 'Z' || k === 'u' || k === 'U') { e.preventDefault(); undo(); return; }
      if (k === 'r' || k === 'R') { e.preventDefault(); restart(); return; }
      if (k === 'Escape') { e.preventDefault(); leavePlay(); return; }
      if (k.indexOf('Arrow') === 0) e.preventDefault();
      return;
    }
    var d = -1;
    if (k === 'ArrowUp' || k === 'w' || k === 'W') d = 0;
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') d = 1;
    else if (k === 'ArrowDown' || k === 's' || k === 'S') d = 2;
    else if (k === 'ArrowLeft' || k === 'a' || k === 'A') d = 3;
    if (d >= 0) { e.preventDefault(); tryMove(d); return; }
    if (k === 'z' || k === 'Z' || k === 'u' || k === 'U') { e.preventDefault(); undo(); }
    else if (k === 'r' || k === 'R') { e.preventDefault(); restart(); }
    else if (k === 'h' || k === 'H') { e.preventDefault(); nudge(); }
    else if (k === 'Escape') { e.preventDefault(); leavePlay(); }
  } else if (view === 'sandbox') {
    // don't steal keys while a modal input has focus
    var modal = $('mSave').classList.contains('on') || $('mOpen').classList.contains('on');
    if (k === 'Escape') { e.preventDefault(); if (modal) closeModals(); else show('title'); }
    else if (!modal && (k === 'z' || k === 'Z')) { e.preventDefault(); edUndo(); }
  } else if (view === 'select' && k === 'Escape') { show('title'); }
  else if (view === 'title') {
    if ($('mStats').classList.contains('on')) {          // a modal owns the keys
      if (k === 'Escape' || k === 'Enter' || k === ' ') { e.preventDefault(); closeModals(); }
      return;
    }
    if (k === 'Enter' || k === ' ') { e.preventDefault(); $('bPlay').click(); }
  }
});

/* swipe / drag */
var pt = null;
function down(e) { var t = e.touches ? e.touches[0] : e; pt = { x: t.clientX, y: t.clientY }; }
function up(e) {
  if (!pt) return;
  var t = e.changedTouches ? e.changedTouches[0] : e;
  var dx = t.clientX - pt.x, dy = t.clientY - pt.y;
  pt = null;
  if (Math.abs(dx) < 22 && Math.abs(dy) < 22) {
    if (awaitPick) padAt(t.clientX, t.clientY);   // a tap picks a landing pad
    return;
  }
  if (awaitPick) return;                          // no sliding until you choose
  tryMove(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0));
}
/* Which numbered pad did that tap land on? */
function padAt(clx, cly) {
  var r = cv.getBoundingClientRect();
  var x = Math.floor((clx - r.left) / CS), y = Math.floor((cly - r.top) / CS);
  if (x < 0 || y < 0 || x >= L.w || y >= L.h) return;
  var i = awaitPick.pads.indexOf(y * L.w + x);
  if (i >= 0) land(i); else SFX.bad();
}
function padHover(e) {
  if (!awaitPick || !L) return;
  var r = cv.getBoundingClientRect();
  var x = Math.floor((e.clientX - r.left) / CS), y = Math.floor((e.clientY - r.top) / CS);
  pickHot = awaitPick.pads.indexOf(y * L.w + x);
}
var stage = $('stage');
stage.addEventListener('touchstart', down, { passive: true });
stage.addEventListener('touchend', up, { passive: true });
stage.addEventListener('mousedown', down);
stage.addEventListener('mousemove', padHover);
window.addEventListener('mouseup', function (e) { if (view === 'play') up(e); });

/* optimal-move nudge, solved live from where you are standing */
function nudge() {
  if (anim || won) return;
  if (awaitPick) {                       // chooser is open — which pad is best?
    var best = -1, bv = Infinity;
    for (var k = 0; k < awaitPick.pads.length; k++) {
      var r2 = solveFrom(L, GLIDE.resolve(L, st, k), 8000);
      var v = (r2.big || r2.par === null) ? Infinity : r2.par;
      if (v < bv) { bv = v; best = k; }
    }
    if (best >= 0 && bv < Infinity) { pickHot = best; blip(700, .1, 'sine', .05); }
    else SFX.bad();
    return;
  }
  var r = solveFrom(L, st, 12000);
  if (r.par === null) r = solveFrom(L, st, 12000, true);   // no safe line? best hope
  // No arrow to give: either the deck is too tangled to search cheaply, or
  // there is genuinely no route left. Say so rather than ignoring the press.
  if (r.big) { SFX.bad(); return; }
  if (r.par === null) { SFX.bad(); showStuck(); return; }
  nudgeDir = r.dir; nudgePad = r.pad; nudgeT = 1400;
  blip(700, .1, 'sine', .05);
}

/* ==================================================================
   SANDBOX — draw your own deck, prove it, play it.
   The editor renders with the very same tile art the game uses: it
   borrows the draw helpers by swapping the module globals they read
   (ctx / CS / L / V) for the duration of one paint.

function edDraw() {

// ---- palette -------------------------------------------------------

// ---- editing -------------------------------------------------------

}

/* Resize keeps the interior and redraws a clean wall frame. */
function edSize(dw, dh) {

// ---- proving -------------------------------------------------------
function edLevel(par) {
  return { id: 0, w: ed.w, h: ed.h, grid: ed.g.join(''), par: par || 0,

}
function edCheck() {
  var g = ed.g.join('');
  var starts = (g.match(/@/g) || []).length;
  if (starts === 0) return { err: 'No start drone — paint one @ tile.' };
  if (starts > 1) return { err: 'More than one start drone.' };
  if (g.indexOf('E') < 0) return { err: 'No exit — every deck needs one.' };
  if ((g.match(/t/g) || []).length % 2) return { err: 'Relay pads work in pairs; one is unpaired.' };
  var cnt = function (ch) { return g.split(ch).length - 1; };
  // Every spring needs somewhere to put you, and every pad needs a spring.
  var pairs = [['Y', 'y', 'Fixed spring 1', 'pad 1'], ['J', 'j', 'Fixed spring 2', 'pad 2'],
               ['K', 'k', 'Fixed spring 3', 'pad 3'], ['L', 'l', 'Fixed spring 4', 'pad 4'],
               ['B', 'b', 'A blue spring', 'a blue pad'], ['R', 'r', 'A red spring', 'a red pad']];
  for (var i = 0; i < pairs.length; i++) {
    var s = cnt(pairs[i][0]), p = cnt(pairs[i][1]);
    if (s && !p) return { err: pairs[i][2] + ' has no ' + pairs[i][3] + ' to throw you to.' };
    if (p && !s) return { err: 'There is ' + pairs[i][3] + ' with no spring that reaches it.' };
  }
  // The kinds must stay distinguishable: one pad turns a blue or red spring
  // into a fixed one, and a spare fixed pad is simply never used.
  if (cnt('B') && cnt('b') < 2)
    return { err: 'A blue spring with one blue pad always lands there — that is just a fixed spring. Add another blue pad.' };
  if (cnt('R') && cnt('r') < 2)
    return { err: 'A red spring with one red pad gives you nothing to choose. Add another red pad.' };
  for (i = 0; i < 4; i++) {
    var ns = cnt(pairs[i][0]), np = cnt(pairs[i][1]);
    if (ns && np > ns)
      return { err: 'Channel ' + (i + 1) + ' is fixed one-to-one, so ' + (np - ns) + ' of its pads ' +
        (np - ns > 1 ? 'are' : 'is') + ' never used. Add another spring on that channel, or use blue or red for a choice.' };
  }

    if (!gsp) continue;
    if (gsp.extSpring !== undefined) chSpr[gsp.extSpring] = (chSpr[gsp.extSpring] || 0) + 1;
    if (gsp.extPad !== undefined) chPad[gsp.extPad] = (chPad[gsp.extPad] || 0) + 1;

  for (var slot in chSpr) {
    var no = 5 + (+slot);

  if (cnt('=') > 15) return { err: 'At most 15 locks on one deck.' };

/* When a deck will not go, work out WHY: every tile a slide can actually end
   on, and how many cores are collectible. Almost always the culprit is that
   nothing brakes you where you assumed it would. */
function edDiagnose(cap) {
  var P = GLIDE.parse(edLevel(0));
  var s0 = GLIDE.initial(P);
  var seen = {}, q = [s0], qi = 0, spots = {}, best = 0, n = 0;
  var need = GLIDE.allCores(P);
  seen[GLIDE.key(s0)] = 1; spots[s0.p] = 1;
  while (qi < q.length) {
    if (++n > cap) break;
    var A = GLIDE.actions(P, q[qi++]);
    for (var a = 0; a < A.length; a++)
      for (var k = 0; k < A[a].states.length; k++) {
        var ns = A[a].states[k];
        if (ns.cores > best) best = ns.cores;
        if (ns.won) continue;
        spots[ns.p] = 1;
        var key = GLIDE.key(ns);
        if (seen[key]) continue;
        seen[key] = 1; q.push(ns);
      }

  var got = 0, all = P.cores.length;
  for (var b = 0; b < all; b++) if (best & (1 << b)) got++;

           exit: P.terrain.indexOf('E') };

/* Exactly the search that vetted the shipped decks: worst-case optimal play,
   so a deck with a blue spring only passes if it works out however it lands. */
/* No search limit here on purpose: the editor always finishes the job and
   gives you a real answer rather than bailing out on a big deck. */

  var lv = edLevel(0), P = GLIDE.parse(lv);
  var r = solveFrom(P, GLIDE.initial(P), Infinity);
  if (r.par !== null) return { par: r.par, luck: lv.grid.indexOf('B') >= 0 };
  // No guaranteed line. Is there one at all, if the blue springs are kind?
  var hope = solveFrom(P, GLIDE.initial(P), Infinity, true);
  if (hope.par !== null) return { par: hope.par, gamble: 1 };
  return { none: 1 };
}
function edVerify(then) {
  var v = edCheck();
  if (v.err) { emsg(v.err, 'bad'); SFX.bad(); return; }
  emsg('Searching every route…');
  setTimeout(function () {                     // let the message paint first
    var r = edSolve();
    if (r.gamble) {
      // A route exists — a blue spring can just also strand you. That is the
      // deck's business, not a reason to refuse it: warn, then let it be played.
      ed.par = r.par;
      emsg('Winnable in ' + r.par + ', but a blue spring can drop you where there ' +
           'is no way out. Give every blue pad an exit to make it safe.', 'bad');
      blip(320, .12, 'triangle', .05);
      if (then) then(r.par);
    } else if (r.par !== undefined) {
      ed.par = r.par;
      emsg((r.luck ? 'Solvable however the blue spring lands · worst case ' : 'Solvable · the optimal route is ') +
           r.par + ' move' + (r.par === 1 ? '' : 's') + '.', 'good');
      blip(700, .1, 'sine', .05);
