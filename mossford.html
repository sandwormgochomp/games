// ============================== FLOWERS =============================
// Two genes, r and y, each 0/1/2 — the count of dominant alleles. A parent
// with 1 is the interesting one: it can hand down either. Nine colours fall
// out of the grid, and the corner at (2,2) only ever arrives by patience.
const HUES=[
  [{id:'white', name:'White',   col:'#f3eddf'},{id:'cream',name:'Cream',  col:'#f0e4b4'},{id:'yellow',name:'Yellow',col:'#ecd257'}],
  [{id:'pink',  name:'Pink',    col:'#e8a7bc'},{id:'apricot',name:'Apricot',col:'#e9ac78'},{id:'gold',name:'Gold',  col:'#dda43c'}],
  [{id:'red',   name:'Red',     col:'#c4443f'},{id:'coral',name:'Coral',  col:'#dd6f57'},{id:'ember',name:'Ember',  col:'#8e3a34'}]
];
const HUEBY={}; HUES.forEach(row=>row.forEach(h=>HUEBY[h.id]=h));
function hue(r,y){ return HUES[r][y]; }

const KINDS=[

];
const KINDBY={}; KINDS.forEach(k=>KINDBY[k.id]=k);
const ALBUM_TOTAL=KINDS.length*9;
function flowerName(k,r,y){ return hue(r,y).name+' '+KINDBY[k].name; }
function flowerKey(k,r,y){ return k+'|'+r+y; }
// one allele from each parent, and now and then the garden does as it likes
function crossGene(a,b){
  const al=g=>g===0?0:g===2?1:(Math.random()<0.5?1:0);
  let v=al(a)+al(b);
  if(Math.random()<0.06)v=clamp(v+(Math.random()<0.5?-1:1),0,2);
  return v;
}

 {x:1000,y:80,w:820,h:340},{x:1380,y:420,w:440,h:420},{x:740,y:80,w:240,h:220}
];
function nearPath(x,y,r){
  for(const p of PATHS)for(let i=0;i<p.length-1;i++){
    const [ax,ay]=p[i],[bx,by]=p[i+1];
    const dx=bx-ax,dy=by-ay,L=dx*dx+dy*dy;
    let t=L?((x-ax)*dx+(y-ay)*dy)/L:0; t=clamp(t,0,1);
    if(dist(x,y,ax+dx*t,ay+dy*t)<r)return true;
  }
  return false;
}
function nearBuilding(x,y,r){
  for(const b of BUILDINGS){
    if(x>b.x-r&&x<b.x+b.w+r&&y>b.y-r&&y<b.y+b.h+r)return true;
    if(dist(x,y,b.door.x,b.door.y)<r+30)return true;
  }
  return false;
}
const TREES=[];
for(const z of FOREST_ZONES){
  for(let y=z.y;y<z.y+z.h;y+=44)for(let x=z.x;x<z.x+z.w;x+=44){
    if(hash(x*0.7,y*0.7)>0.56)continue;
    const px=x+(hash(x,y+9)-0.5)*36, py=y+(hash(x+4,y)-0.5)*36;
    if(px<30||px>MAPW-30||py<40)continue;
    if(py>shoreY(px)-46)continue;
    if(nearPath(px,py,54))continue;
    if(nearBuilding(px,py,46))continue;
    if(px>GARDEN.x0-110&&px<GARDEN.x0+GARDEN.cols*GARDEN.dx+50&&

const SAVEKEY='mossford.3d.v1';

function freshState(){

    // the round

    // the regulars, and the tank in the window
    reg:{}, tank:{fish:[],deco:[]}
  };
}
// old towns predate half of this; give them the missing furniture rather
// than throwing the save away
function migrate(){
  const d=freshState();
  for(const k in d)if(S[k]===undefined)S[k]=d[k];
  if(!Array.isArray(S.beds)||S.beds.length!==BEDS.length)S.beds=BEDS.map(()=>null);
  if(!S.tank||!Array.isArray(S.tank.fish))S.tank={fish:[],deco:[]};
  if(!Array.isArray(S.tank.deco))S.tank.deco=[];
}
function save(){ try{localStorage.setItem(SAVEKEY,JSON.stringify(S));}catch(e){} }
function loadSave(){ try{const r=localStorage.getItem(SAVEKEY); if(r){S=JSON.parse(r);migrate();return true;}}catch(e){} return false; }
function addItem(id,n=1){ S.inv[id]=(S.inv[id]||0)+n; }
function takeItem(id,n=1){ if((S.inv[id]||0)<n)return false; S.inv[id]-=n; if(!S.inv[id])delete S.inv[id]; return true; }
function warmthTotal(){ let t=0; for(const k in S.warmth)t+=S.warmth[k]; return t; }
function phase(){ return PHASES[S.phase]; }
function season(){ return SEASONS[S.season]; }
function isNight(){ return S.phase===3; }
function delivered(id){ return S.delivered.includes(id); }
function forageOpen(i){ return S.foraged[i]!==S.day; }

// ---- letters
function letterInBox(){
  if(!S.boxNext||S.boxTaken)return null;
  const l=LETBY[S.boxNext]; if(!l||l.day>S.day)return null;
  if(l.needsBottle && !S.flags.hasBottle)return null;
  return l;
}
function letterFor(who){ return S.held.find(id=>LETBY[id].to===who)||null; }
function heldForPlayer(){ return S.held.find(id=>LETBY[id].to==='player')||null; }
function deliverLetter(id){
  const l=LETBY[id];
  S.held=S.held.filter(x=>x!==id);
  S.delivered.push(id);
  if(l.gives)for(const k in l.gives)addItem(k,l.gives[k]);
  if(l.warmth)S.warmth[l.warmth[0]]=Math.min(5,S.warmth[l.warmth[0]]+l.warmth[1]);
  if(l.to!=='player'&&l.to!=='tock')S.warmth[l.to]=Math.min(5,S.warmth[l.to]+1);
  if(l.flag)S.flags[l.flag]=true;
  if(l.id==='l13')S.flags.lampsLit=true;
  if(l.next){S.boxNext=l.next;S.boxTaken=false;} else S.boxNext=null;
  save();
}
function npcHere(id){
  if(id==='oswin' && !delivered('l4') && !S.flags.gatheringNow) return false;
  if(id==='fen' && S.phase===0) return false;
  if(id==='pim' && S.phase<2 && !S.flags.gatheringNow) return false;
  return true;
}
function npcPos(id){
  if(S.flags.gatheringNow){
    const i=Object.keys(PEOPLE).indexOf(id);
    const g=GATHER[i];
    return {x:g[0], y:Math.min(g[1], shoreY(g[0])-34)};
  }
  return SPOT[PEOPLE[id].at];
}

// ---- the garden
function seedList(){ return Object.keys(S.seeds).filter(k=>S.seeds[k]>0).sort(); }
function seedParse(key){ const [k,g]=key.split('|'); return {k, r:+g[0], y:+g[1]}; }
function giveSeed(k,r,y,n){ const key=flowerKey(k,r,y); S.seeds[key]=(S.seeds[key]||0)+(n||1); return key; }
function sow(i,key){
  if(S.beds[i]||!S.seeds[key])return false;
  const s=seedParse(key);
  S.seeds[key]--; if(!S.seeds[key])delete S.seeds[key];
  S.beds[i]={k:s.k, r:s.r, y:s.y, st:0, wat:false};
  save(); return true;
}
function water(i){
  const b=S.beds[i]; if(!b||b.wat)return false;
  b.wat=true; save(); return true;
}
function pickBloom(i){
  const b=S.beds[i]; if(!b||b.st<3)return null;
  const rec={k:b.k, r:b.r, y:b.y};
  S.beds[i]=null;
  const key=flowerKey(rec.k,rec.r,rec.y);
  const isNew=!S.album[key];
  S.album[key]=true;
  giveSeed(rec.k,rec.r,rec.y);          // a bloom is a seed packet you waited for
  if(S.blooms.length<6)S.blooms.push(rec);
  save(); return {rec,isNew};
}
// overnight: watered blooms that share a fence pass something on, then
// everything that was watered gets on with growing
function growGarden(){
  const born=[];
  S.beds.forEach((b,i)=>{
    if(b)return;
    const parents=bedNeighbours(i).map(j=>S.beds[j])
      .filter(o=>o&&o.st>=3&&o.wat);
    const byKind={};
    for(const p of parents)(byKind[p.k]=byKind[p.k]||[]).push(p);
    for(const k in byKind)if(byKind[k].length>=2){
      const [a,c]=byKind[k];
      born.push({i, seed:{k, r:crossGene(a.r,c.r), y:crossGene(a.y,c.y), st:0, wat:false}});
      break;
    }
  });
  const inSeason=id=>KINDBY[id].season===S.season;
  const step=[1,2,3][S.growth||0];        // the growth console, on 3
  S.beds.forEach(b=>{
    if(!b)return;
    if(b.wat&&b.st<3)b.st=Math.min(3,b.st+step+(inSeason(b.k)?1:0));
    b.wat=false;
  });
  for(const n of born)S.beds[n.i]=n.seed;
  return born.length;
}
function albumCount(){ return Object.keys(S.album).length; }
// the one they'd like, if you have it; otherwise whatever's nearest the top
function bloomFor(id){
  const want=PEOPLE[id].likes;
  let idx=S.blooms.findIndex(b=>hue(b.r,b.y).id===want);
  if(idx<0)idx=S.blooms.length?0:-1;
  return idx;
}

// ---- the round
function rollRound(){
  const n=2+((Math.random()*3)|0);
  const pool=ROUND.slice();
  const out=[];
  while(out.length<n&&pool.length){
    const j=(Math.random()*pool.length)|0;
    const l=pool.splice(j,1)[0];
    if(l.to==='oswin'&&!delivered('l4'))continue;   // nobody can get up there yet
    out.push(l.id);
  }
  S.roundReady=out; S.roundOut=0;
}
function bagFor(who){ return S.bag.find(id=>ROUNDBY[id].to===who)||null; }
function deliverRound(id){
  S.bag=S.bag.filter(x=>x!==id);
  const l=ROUNDBY[id];
  S.warmth[l.to]=Math.min(5,S.warmth[l.to]+1);
  if(!S.bag.length&&S.roundOut){
    S.roundsDone++;
    const k=pick(KINDS).id, base=pick([[0,0],[2,0],[0,2]]);
    giveSeed(k,base[0],base[1]);
    S.roundOut=0;
    say_toast('Round finished. Tock leaves a packet of '+KINDBY[k].name.toLowerCase()+
              ' seed on the counter.',3400);
  }
  save();
}

// ============================== 2D UI LAYER =========================
// Everything the player reads is drawn on a 960x600 virtual canvas laid
// over the 3D world, so it stays crisp and consistent at any window size.
const VW=960, VH=600;
const uiCv=document.getElementById('ui');
const ctx=uiCv.getContext('2d');
let uiScale=1, uiOX=0, uiOY=0;
const mouse={x:0,y:0,down:false,click:false};
addEventListener('mousemove',e=>{
  mouse.x=(e.clientX-uiOX)/uiScale;
  mouse.y=(e.clientY-uiOY)/uiScale;
});
addEventListener('mousedown',()=>{mouse.down=true;mouse.click=true;});
addEventListener('mouseup',()=>{mouse.down=false;});

function rr(x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function fillRR(x,y,w,h,r,col){ctx.fillStyle=col;rr(x,y,w,h,r);ctx.fill();}
function txt(s,x,y,size,col,align,font){
  ctx.font=(font||'')+size+'px "Georgia",serif';
  ctx.fillStyle=col;ctx.textAlign=align||'left';ctx.textBaseline='alphabetic';
  ctx.fillText(s,x,y);
}
function wrapText(s,maxW,size,font){
  ctx.font=(font||'')+size+'px "Georgia",serif';
  const words=String(s).split(' ');const lines=[];let cur='';
  for(const w of words){
    const t=cur?cur+' '+w:w;
    if(ctx.measureText(t).width>maxW&&cur){lines.push(cur);cur=w;}else cur=t;
  }
  if(cur)lines.push(cur);
  return lines;
}

    ctx.fillStyle=body;ctx.beginPath();ctx.ellipse(0,-14,8,11,0,0,7);ctx.fill();
    ctx.fillStyle=trim;ctx.beginPath();ctx.ellipse(0,-11,6,6,0,0,7);ctx.fill();
    ctx.strokeStyle=body;ctx.lineWidth=4;
    ctx.beginPath();ctx.moveTo(0,-22);ctx.lineTo(2,-31+bob);ctx.stroke();
    ctx.fillStyle=body;ctx.beginPath();ctx.ellipse(3,-35+bob,7,6.5,0,0,7);ctx.fill();

      ctx.moveTo(8,-36+bob);ctx.lineTo(19,-34+bob);ctx.lineTo(8,-33+bob);ctx.closePath();ctx.fill();}
    else{ctx.strokeStyle='#8a7050';ctx.lineWidth=2;
      for(const d of [-4,4]){ctx.beginPath();ctx.moveTo(d,-40+bob);ctx.lineTo(d*1.6,-48+bob);
        ctx.moveTo(d*1.3,-44+bob);ctx.lineTo(d*2.2,-46+bob);ctx.stroke();}}

// ---- ground texture: the town painted from above ------------------
function makeGroundTexture(){
  const S1=1600, S2=Math.round(S1*MAPH/MAPW);
  const c=document.createElement('canvas'); c.width=S1;c.height=S2;
  const g=c.getContext('2d');
  const k=S1/MAPW;
  const se=season();
  const hex=n=>'#'+n.toString(16).padStart(6,'0');
  g.fillStyle=hex(se.grass); g.fillRect(0,0,S1,S2);
  for(let y=0;y<MAPH;y+=70)for(let x=0;x<MAPW;x+=70){
    const h1=hash(x*0.05,y*0.05);
    if(h1<0.4){
      g.fillStyle=h1<0.2?hex(se.grass2):'rgba(255,255,255,0.05)';
      g.beginPath();g.ellipse((x+35)*k,(y+35)*k,(50+h1*44)*k,(34+h1*28)*k,h1*3,0,7);g.fill();
    }
  }
  // paths
  g.lineCap='round';g.lineJoin='round';
  for(const p of PATHS){
    g.strokeStyle='rgba(0,0,0,0.10)';g.lineWidth=34*k;
    g.beginPath();p.forEach((q,i)=>i?g.lineTo(q[0]*k,q[1]*k):g.moveTo(q[0]*k,q[1]*k));g.stroke();
    g.strokeStyle=hex(se.path);g.lineWidth=27*k;
    g.beginPath();p.forEach((q,i)=>i?g.lineTo(q[0]*k,q[1]*k):g.moveTo(q[0]*k,q[1]*k));g.stroke();
  }
  // speckle on the paths
  g.fillStyle='rgba(120,96,60,0.12)';
  for(let i=0;i<2600;i++){
    const x=hash(i,1)*MAPW,y=hash(i,2)*MAPH;
    if(nearPath(x,y,12))g.fillRect(x*k,y*k,2.4,2.4);
  }
  // sand + seabed
  for(let x=0;x<=MAPW;x+=6){
    const sy=shoreY(x);
    g.fillStyle='#e2cea6'; g.fillRect(x*k,(sy-16)*k,7*k,40*k);
    g.fillStyle='#c9b389'; g.fillRect(x*k,(sy+24)*k,7*k,60*k);
    g.fillStyle='#8a8264'; g.fillRect(x*k,(sy+84)*k,7*k,(MAPH-sy)*k);
  }
  const t=new THREE.CanvasTexture(c);
  t.colorSpace=THREE.SRGBColorSpace;
  t.anisotropy=renderer.capabilities.getMaxAnisotropy();
  return t;
}

// ---- ground mesh: flat land that ramps down into the channel -------
function landHeight(mx,my){
  const s=shoreY(mx);
  if(my<s-14)return 0;
  const t=clamp((my-(s-14))/70,0,1);
  return -2.6*t*t*(3-2*t);
}
// what height anything standing at (mx,my) should sit at
function groundY(mx,my){
  if(mx>DOCK.x-8&&mx<DOCK.x+DOCK.w+8&&my>DOCK.y-8&&my<DOCK.y+DOCK.h+8)return 0.27;
  const h=landHeight(mx,my);
  if(h<0)return h;
  return Math.sin(mx*0.011)*0.14+Math.sin(my*0.013+2)*0.12;
}

}

// a gable roof
function gableGeo(w,d,h){
  const g=new THREE.BufferGeometry();
  const hw=w/2,hd=d/2;
  const e=0.08;
  const v=[
    -hw,0,-hd,  hw,0,-hd,  hw,0,hd,  -hw,0,hd,   // eaves
    0,h,-hd,    0,h,hd,                           // ridge
    -hw,-e,-hd, hw,-e,-hd, hw,-e,hd, -hw,-e,hd   // soffit, dropped just under the eaves
  ];
  // wound counter-clockwise seen from outside, or the face is culled and the
  // roof reads as one flat triangle. the soffit sits below the wall top on
  // purpose — level with it, the two planes z-fight into stripes.
  const f=[
    0,4,1,        // gable, back
    3,2,5,        // gable, front
    1,5,2, 1,4,5, // slope, east
    3,5,4, 3,4,0, // slope, west
    6,7,8, 6,8,9  // soffit
  ];
  g.setAttribute('position',new THREE.Float32BufferAttribute(v,3));
  g.setIndex(f);
  const flat=g.toNonIndexed(); flat.computeVertexNormals();
  g.dispose(); return flat;
}

// ============================== TREES ===============================
const treeGroup=new THREE.Group(); scene.add(treeGroup);
let trunkIM,roundIM,pineIM,fruitIM;
function buildTrees(){
  [trunkIM,roundIM,pineIM,fruitIM].forEach(m=>{if(m){treeGroup.remove(m);m.geometry.dispose();}});
  const se=season();
  const rounds=TREES.filter(t=>t.kind!=='pine');
  const pines =TREES.filter(t=>t.kind==='pine');
  const apples=TREES.filter(t=>t.kind==='apple');

  const tg=new THREE.CylinderGeometry(0.14,0.22,1,6);
  trunkIM=new THREE.InstancedMesh(tg,mat(0x6f4f36),TREES.length);
  const rg=new THREE.IcosahedronGeometry(1,0);
  roundIM=new THREE.InstancedMesh(rg,new THREE.MeshLambertMaterial({flatShading:true}),rounds.length);
  const pg=new THREE.ConeGeometry(1,2.3,7);
  pineIM=new THREE.InstancedMesh(pg,new THREE.MeshLambertMaterial({flatShading:true}),pines.length*3);
  const fg=new THREE.SphereGeometry(0.16,6,5);
  fruitIM=new THREE.InstancedMesh(fg,mat(se.fruit),apples.length*5);

  const d=new THREE.Object3D(); const col=new THREE.Color();
  TREES.forEach((t,i)=>{
    const th=(t.kind==='pine'?4.6:3.2)*t.s;
    d.position.set(wx(t.x),th/2,wz(t.y));
    d.scale.set(1,th,1); d.rotation.set(0,hash(t.x,t.y)*6.28,0);
    d.updateMatrix(); trunkIM.setMatrixAt(i,d.matrix);
  });
  rounds.forEach((t,i)=>{
    const r=t.r*SC*2.15*t.s, th=3.4*t.s;
    d.position.set(wx(t.x),th+r*0.5,wz(t.y));
    d.scale.set(r,r*0.88,r);
    d.rotation.set(hash(t.x,1)*3,hash(t.y,2)*6.28,hash(t.x,t.y)*3);
    d.updateMatrix(); roundIM.setMatrixAt(i,d.matrix);
    const shade=0.82+hash(t.y,t.x)*0.32;
    col.setHex(t.kind==='apple'?se.leaf2:se.leaf).multiplyScalar(shade);
    roundIM.setColorAt(i,col);
  });
  pines.forEach((t,i)=>{
    for(let k=0;k<3;k++){
      const r=t.r*SC*(2.0-k*0.45)*t.s, th=3.0*t.s+k*1.15*t.s;
      d.position.set(wx(t.x),th,wz(t.y));
      d.scale.set(r,r*0.85,r); d.rotation.set(0,hash(t.x,k)*6.28,0);
      d.updateMatrix(); pineIM.setMatrixAt(i*3+k,d.matrix);
      col.setHex(se.pine).multiplyScalar(0.85+k*0.09);
      pineIM.setColorAt(i*3+k,col);
    }
  });
  apples.forEach((t,i)=>{
    for(let k=0;k<5;k++){
      const a=hash(t.x+k,t.y)*6.28, rr2=t.r*SC*2.0;
      d.position.set(wx(t.x)+Math.cos(a)*rr2, 3.2+Math.sin(k)*0.4, wz(t.y)+Math.sin(a)*rr2);
      d.scale.set(1,1,1); d.rotation.set(0,0,0);
      d.updateMatrix(); fruitIM.setMatrixAt(i*5+k,d.matrix);
    }
  });
  [trunkIM,roundIM,pineIM,fruitIM].forEach(m=>{
    m.castShadow=true; m.receiveShadow=true;
    m.instanceMatrix.needsUpdate=true;
    if(m.instanceColor)m.instanceColor.needsUpdate=true;
    treeGroup.add(m);
  });
  fruitIM.material=mat(se.fruit);
}

// same idea, but letters cut *into* stone: a bright top edge where the chisel

function makeStoneLabel(text,widthM){

function makeBuilding(b){

      const band=new THREE.Mesh(new THREE.CylinderGeometry(r,r+0.1,1.0,16),mat(0xc9584a));
      band.position.y=H*t; g.add(band);
    }
    cyl(1.75,1.75,0.28,16,0x4a4a52,0,H,0,g);
    const lampG=new THREE.Mesh(new THREE.CylinderGeometry(1.15,1.15,1.5,14),
      new THREE.MeshBasicMaterial({color:0xffe9a8}));
    lampG.position.y=H+1.0; g.add(lampG);
    const cap=new THREE.Mesh(new THREE.ConeGeometry(1.7,1.2,14),mat(0x3a3a42));
    cap.position.y=H+2.4; g.add(cap);
    const pl=new THREE.PointLight(0xffdc9a,3.2,60,1.6);
    pl.position.y=H+1.0; g.add(pl);
    b._lamp=lampG; b._light=pl;
    return g;
  }

  const WH=2.9;
  // own materials, not the shared cache — these have to fade independently
  const wallMat=new THREE.MeshLambertMaterial({color:b.wall});
  const roofMat=new THREE.MeshLambertMaterial({color:b.roof});
  const walls=new THREE.Mesh(new THREE.BoxGeometry(w,WH,d),wallMat);
  walls.position.y=WH/2; walls.castShadow=true; walls.receiveShadow=true; g.add(walls);
  const roof=new THREE.Mesh(gableGeo(w*1.16,d*1.16,2.1),roofMat);
  roof.position.y=WH+0.03; roof.castShadow=true; g.add(roof);
  occluders.push(walls,roof);
  fadeables.push({m:walls,mat:wallMat,o:1},{m:roof,mat:roofMat,o:1});

  // door faces the door-marker
  const dvx=b.door.x-(b.x+b.w/2), dvy=b.door.y-(b.y+b.h/2);
  const front=Math.abs(dvy)>=Math.abs(dvx) ? (dvy>0?'S':'N') : (dvx>0?'E':'W');
  const off=0.02;
  const place=(mesh,u,yy)=>{
    if(front==='S'){mesh.position.set(u,yy,d/2+off);}
    else if(front==='N'){mesh.position.set(u,yy,-d/2-off);mesh.rotation.y=Math.PI;}
    else if(front==='E'){mesh.position.set(w/2+off,yy,-u);mesh.rotation.y=Math.PI/2;}
    else {mesh.position.set(-w/2-off,yy,u);mesh.rotation.y=-Math.PI/2;}
    g.add(mesh);
  };
  const doorM=new THREE.Mesh(new THREE.PlaneGeometry(1.15,1.9),mat(0x6f4f36));
  place(doorM,0,0.95);
  for(const u of [-w*0.28,w*0.28]){
    const wm=new THREE.MeshBasicMaterial({color:0x8fa8ae});
    const win=new THREE.Mesh(new THREE.PlaneGeometry(0.95,0.9),wm);
    place(win,u,2.0);
    windows.push(wm);
    const frame=new THREE.Mesh(new THREE.PlaneGeometry(1.12,1.06),mat(0x8a6444));
    place(frame,u,2.0); frame.position.multiplyScalar(0.999);
  }
  // chimney, and something coming out of it
  box(0.6,1.7,0.6,0x9a7a62,w*0.3,WH+1.4,-d*0.2,g);
  for(let i=0;i<5;i++){
    const puff=new THREE.Mesh(new THREE.SphereGeometry(0.24,7,6),
      new THREE.MeshBasicMaterial({color:0xefe8dc,transparent:true,opacity:0.3,depthWrite:false}));
    g.add(puff);
    smokers.push({m:puff, x:w*0.3, z:-d*0.2, base:WH+2.2, ph:i/5+hash(b.x,i)});
  }
  if(b.id==='shop'||b.id==='cafe'){
    const sign=makeLabel(b.name,w*0.74);
    place(sign,0,2.16);
    if(front==='S')sign.position.z+=0.10; if(front==='N')sign.position.z-=0.10;
    if(front==='E')sign.position.x+=0.10; if(front==='W')sign.position.x-=0.10;
  }
  return g;
}

function makeCritter(sp,bodyHex,trimHex){
  const g=new THREE.Group();
  const B=parseInt(bodyHex.slice(1),16), T=parseInt(trimHex.slice(1),16);
  const parts={};
  const s=v=>v*0.09;   // critters ~1.5m tall
  const legY=s(3.4);
  parts.legL=cyl(s(0.5),s(0.5),legY,6,B,-s(1.4),legY/2,0,g);
  parts.legR=cyl(s(0.5),s(0.5),legY,6,B, s(1.4),legY/2,0,g);
  const bodyY=legY+s(4.2);
  let headY=bodyY+s(5.0), headR=s(4.4);

  if(sp==='heron'||sp==='deer'){
    parts.body=ball(s(4.2),B,0,bodyY,0,g); parts.body.scale.set(0.9,1.25,0.9);
    ball(s(2.8),T,0,bodyY-s(0.6),s(2.2),g).scale.set(0.8,1.1,0.5);
    cyl(s(0.85),s(1.15),s(7.4),7,B,0,bodyY+s(5.6),0,g);
    headY=bodyY+s(10.2); headR=s(3.0);
    parts.head=ball(headR,B,0,headY,0,g);
    if(sp==='heron'){
      const beak=new THREE.Mesh(new THREE.ConeGeometry(s(1.0),s(4.4),7),mat(0xe8b45a));
      beak.rotation.x=Math.PI/2; beak.position.set(0,headY,s(3.6)); parts.head.parent.add(beak);
      parts.beak=beak;
    } else {
      for(const d of [-1,1]){
        const ear=ball(s(1.2),B,d*s(2.6),headY+s(1.0),0,g); ear.scale.set(0.6,1.5,0.5);
        const ant=cyl(s(0.24),s(0.3),s(3.0),5,0x8a7050,d*s(1.6),headY+s(3.2),0,g);
        ant.rotation.z=d*0.4;
      }
    }
  } else if(sp==='bear'){
    parts.body=ball(s(5.6),B,0,bodyY,0,g); parts.body.scale.set(1,1.1,0.95);
    ball(s(3.4),T,0,bodyY-s(0.8),s(3.4),g).scale.set(0.9,1,0.5);
    headY=bodyY+s(6.2); headR=s(4.2);
    parts.head=ball(headR,B,0,headY,0,g);
    for(const d of [-1,1])ball(s(1.5),B,d*s(3.2),headY+s(3.0),0,g);
    ball(s(2.0),0xd9bda0,0,headY-s(0.6),s(3.6),g).scale.set(1,0.75,0.7);
  } else if(sp==='mole'){
    parts.body=ball(s(4.0),B,0,bodyY-s(0.6),0,g); parts.body.scale.set(1,1.05,1);
    ball(s(2.4),T,0,bodyY-s(1.0),s(2.6),g).scale.set(0.9,1,0.5);
    headY=bodyY+s(4.2); headR=s(3.3);
    parts.head=ball(headR,B,0,headY,0,g);
    const nose=new THREE.Mesh(new THREE.ConeGeometry(s(1.0),s(2.4),7),mat(0xe0a0a0));
    nose.rotation.x=Math.PI/2; nose.position.set(0,headY-s(0.4),s(3.2)); g.add(nose);
  } else if(sp==='hog'){
    parts.body=ball(s(4.8),B,0,bodyY,0,g); parts.body.scale.set(1,0.95,1);
    for(let i=0;i<14;i++){
      const a=i/14*6.28, sp2=new THREE.Mesh(new THREE.ConeGeometry(s(0.5),s(2.4),4),mat(0x6a5340));
      sp2.position.set(Math.cos(a)*s(3.4),bodyY+s(3.0),Math.sin(a)*s(3.0)-s(0.6));
      sp2.rotation.set(-0.5+Math.sin(a)*0.3,0,Math.cos(a)*0.4); g.add(sp2);
    }
    headY=bodyY+s(2.6); headR=s(3.2);
    parts.head=ball(headR,T,0,headY,s(2.6),g);
    ball(s(0.7),0x3a2c24,0,headY-s(0.6),s(5.4),g);
  } else if(sp==='otter'){
    parts.body=ball(s(5.2),B,0,bodyY-s(1.2),0,g); parts.body.scale.set(0.85,0.8,1.25);
    ball(s(2.8),T,0,bodyY-s(1.6),s(3.4),g).scale.set(0.9,0.9,0.5);
    const tail=cyl(s(0.5),s(1.4),s(5.0),6,B,0,bodyY-s(1.6),-s(5.2),g);
    tail.rotation.x=Math.PI/2.4; parts.tail=tail;
    headY=bodyY+s(3.4); headR=s(3.4);
    parts.head=ball(headR,B,0,headY,s(0.8),g);
    for(const d of [-1,1])ball(s(1.0),B,d*s(2.4),headY+s(2.4),0,g);
  } else if(sp==='rabbit'){
    parts.body=ball(s(4.4),B,0,bodyY,0,g); parts.body.scale.set(1,1.15,0.95);
    ball(s(2.6),T,0,bodyY-s(0.6),s(2.8),g).scale.set(0.9,1,0.5);
    headY=bodyY+s(5.0); headR=s(3.5);
    parts.head=ball(headR,B,0,headY,0,g);
    for(const d of [-1,1]){
      const ear=ball(s(1.3),B,d*s(1.5),headY+s(4.2),0,g);
      ear.scale.set(0.55,2.6,0.4); ear.rotation.z=d*0.16;
    }
  } else if(sp==='bird'){
    parts.body=ball(s(4.4),B,0,bodyY,0,g); parts.body.scale.set(0.9,1.2,0.9);
    ball(s(2.6),T,0,bodyY,s(2.6),g).scale.set(0.8,1.2,0.5);
    const tail=new THREE.Mesh(new THREE.ConeGeometry(s(2.0),s(5.0),5),mat(B));
    tail.rotation.x=-Math.PI/2.2; tail.position.set(0,bodyY-s(1.6),-s(4.0)); g.add(tail);
    parts.tail=tail;
    headY=bodyY+s(5.0); headR=s(3.2);
    parts.head=ball(headR,B,0,headY,0,g);
    const beak=new THREE.Mesh(new THREE.ConeGeometry(s(0.9),s(2.6),6),mat(0xe0b048));
    beak.rotation.x=Math.PI/2; beak.position.set(0,headY-s(0.3),s(3.2)); g.add(beak);
  } else { // fox
    parts.body=ball(s(4.6),B,0,bodyY,0,g); parts.body.scale.set(0.95,1.15,0.95);
    ball(s(2.6),T,0,bodyY-s(0.6),s(2.8),g).scale.set(0.9,1,0.5);
    const tail=cyl(s(0.6),s(2.0),s(5.4),7,B,0,bodyY-s(1.0),-s(4.6),g);
    tail.rotation.x=Math.PI/2.6; parts.tail=tail;
    const tip=ball(s(1.5),T,0,bodyY+s(0.6),-s(7.0),g); parts.tailTip=tip;
    headY=bodyY+s(5.0); headR=s(3.5);
    parts.head=ball(headR,B,0,headY,0,g);
    for(const d of [-1,1]){
      const ear=new THREE.Mesh(new THREE.ConeGeometry(s(1.3),s(2.8),5),mat(B));
      ear.position.set(d*s(2.0),headY+s(3.0),0); ear.rotation.z=d*0.2; g.add(ear);
    }
    const snout=ball(s(1.6),T,0,headY-s(0.8),s(2.8),g); snout.scale.set(0.8,0.7,1.1);
    ball(s(0.5),0x2e241d,0,headY-s(0.7),s(4.2),g);
  }
  // eyes
  if(sp!=='mole')for(const d of [-1,1])
    ball(s(0.55),0x2e241d,d*s(1.5),headY+s(0.5),headR*0.92,g,8);

  g.userData.parts=parts;
  g.userData.headY=headY;
  g.scale.setScalar(1.28);
  return g;
}
function animateCritter(g,walk,t){
  const p=g.userData.parts;
  if(p.legL){p.legL.rotation.x=Math.sin(walk)*0.7;p.legR.rotation.x=-Math.sin(walk)*0.7;}
  if(p.body){
    if(g.userData._by===undefined)g.userData._by=p.body.position.y;
    p.body.position.y=g.userData._by+Math.abs(Math.sin(walk))*0.045;
  }
  if(p.head)p.head.rotation.z=Math.sin(t*0.0013)*0.07;
  if(p.tail)p.tail.rotation.y=Math.sin(t*0.0022)*0.28;
}

function buildPlant(host,b){
  while(host.children.length)host.remove(host.children[0]);
  if(!b)return;
  const stemH=[0.14,0.34,0.5,0.62][b.st];
  cyl(0.026,0.034,stemH,5,0x5f8a4e,0,stemH/2,0,host);
  if(b.st===0){ ball(0.05,0x6f9a56,0,stemH,0,host,7); return; }
  for(const d of [-1,1]){
    const lf=ball(0.09,0x6f9a56,d*0.07,stemH*0.45,0,host,7);
    lf.scale.set(1.5,0.35,0.8);
  }
  if(b.st===1)return;
  const col=parseInt(hue(b.r,b.y).col.slice(1),16);
  if(b.st===2){ const bud=ball(0.07,0x7fa862,0,stemH+0.04,0,host,8); bud.scale.y=1.5; return; }
  const form=KINDBY[b.k].form;
  if(form==='spire'){
    for(let i=0;i<5;i++){
      const bell=new THREE.Mesh(new THREE.ConeGeometry(0.055,0.11,7),mat(col));
      bell.position.set(Math.sin(i*2.4)*0.05,stemH-i*0.1,Math.cos(i*2.4)*0.05);
      bell.rotation.x=Math.PI; host.add(bell);
    }
  } else if(form==='star'){
    for(let i=0;i<7;i++){
      const a=i/7*6.283;
      const p=new THREE.Mesh(new THREE.ConeGeometry(0.028,0.13,4),mat(col));
      p.position.set(Math.cos(a)*0.07,stemH+0.03,Math.sin(a)*0.07);
      p.rotation.z=Math.cos(a)*1.25; p.rotation.x=-Math.sin(a)*1.25; host.add(p);
    }
    ball(0.045,0xf2d98a,0,stemH+0.05,0,host,8);
  } else if(form==='bell'){
    const bell=new THREE.Mesh(new THREE.ConeGeometry(0.085,0.15,9),mat(col));
    bell.position.y=stemH-0.02; bell.rotation.x=Math.PI; host.add(bell);
  } else {
    const head=ball(0.1,col,0,stemH+0.04,0,host,9); head.scale.y=0.78;
    for(let i=0;i<8;i++){
      const a=i/8*6.283;
      const p=ball(0.05,col,Math.cos(a)*0.1,stemH+0.02,Math.sin(a)*0.1,host,7);
      p.scale.set(1.2,0.4,1.2);
    }
  }
}

// ============================== COLLISION ===========================
function solidAt(x,y){
  if(x<24||x>MAPW-24||y<40)return true;
  if(inSea(x,y)){
    if(x>DOCK.x-6&&x<DOCK.x+DOCK.w+6&&y<DOCK.y+DOCK.h)return false;
    return true;
  }
  for(const b of BLOCKS)if(x>b.x&&x<b.x+b.w&&y>b.y&&y<b.y+b.h)return true;
  for(const t of TREES){
    if(Math.abs(x-t.x)>26||Math.abs(y-t.y)>26)continue;
    if(dist(x,y,t.x,t.y)<t.r*0.55)return true;
  }
  return false;
}

// ============================== CAMERA ==============================
let camYaw=0, camDist=14.5, camHeight=18;
const camPos=new THREE.Vector3(), camLook=new THREE.Vector3();
const camRay=new THREE.Raycaster();
function updateCamera(dt,instant){
  if(keys['q'])camYaw+=dt*0.0016;
  if(keys['r'])camYaw-=dt*0.0016;
  const px=wx(player.x), pz=wz(player.y);
  const tx=px+Math.sin(camYaw)*camDist, tz=pz+Math.cos(camYaw)*camDist;
  const f=instant?1:1-Math.pow(0.002,dt/1000);
  camPos.lerp(new THREE.Vector3(tx,camHeight,tz),f);
  camLook.lerp(new THREE.Vector3(px,1.4,pz),f);
  camera.position.copy(camPos);
  camera.lookAt(camLook);
  // anything standing between the camera and you goes see-through
  const head=new THREE.Vector3(px,1.7,pz);
  const dir=camPos.clone().sub(head);
  const len=dir.length(); dir.normalize();
  camRay.set(head,dir); camRay.far=len;
  const blocking=new Set(camRay.intersectObjects(occluders,false).map(h=>h.object));
  for(const f of fadeables){
    const want=blocking.has(f.m)?0.22:1;
    f.o=lerp(f.o,want,1-Math.pow(0.004,dt/1000));
    f.mat.opacity=f.o;
    f.mat.transparent=f.o<0.985;
    f.mat.depthWrite=!f.mat.transparent;
  }
  sun.target.position.set(px,0,pz);
  sun.position.set(px+Math.cos(1.3)*40, 55, pz+22);
}

// ============================== MOVEMENT ============================
function movePlayer(dt){
  let ix=0,iz=0;
  if(keys['a']||keys['arrowleft'])ix-=1;
  if(keys['d']||keys['arrowright'])ix+=1;
  if(keys['w']||keys['arrowup'])iz-=1;
  if(keys['s']||keys['arrowdown'])iz+=1;
  const m=Math.hypot(ix,iz);
  player.moving=m>0;
  if(m){
    ix/=m; iz/=m;
    const fx=-Math.sin(camYaw), fz=-Math.cos(camYaw);
    const rx=-fz, rz=fx;
    const dx=fx*(-iz)+rx*ix, dy=fz*(-iz)+rz*ix;
    const sp=0.155*dt;
    const nx=player.x+dx*sp, ny=player.y+dy*sp;
    if(!solidAt(nx,player.y))player.x=nx;
    if(!solidAt(player.x,ny))player.y=ny;
    player.face=Math.atan2(dx,dy);
    player.step+=dt*0.011;
  } else player.step+=dt*0.0004;
  player.x=clamp(player.x,20,MAPW-20);
  player.y=clamp(player.y,40,MAPH-20);
}

let clockT=0;
function tickWorld(dt){
  // player object
  playerObj.position.set(wx(player.x),groundY(player.x,player.y),wz(player.y));
  playerObj.rotation.y=player.face;
  animateCritter(playerObj,player.moving?player.step*3:clockT*0.001,clockT);

  // npcs
  for(const id in PEOPLE){
    const o=npcObjs[id], here=npcHere(id);
    o.visible=here;
    if(!here)continue;
    const p=npcPos(id);
    o.position.set(wx(p.x),groundY(p.x,p.y),wz(p.y));
    const dx=wx(player.x)-o.position.x, dz=wz(player.y)-o.position.z;
    const d2=Math.hypot(dx,dz);
    if(d2<9)o.rotation.y=Math.atan2(dx,dz);
    else o.rotation.y=lerp(o.rotation.y,Math.sin(clockT*0.0004+id.length)*0.6,0.02);
    animateCritter(o,clockT*0.0012+id.length,clockT);
    const env=o.userData.env;
    env.visible=!!letterFor(id);
    if(env.visible){
      env.position.y=o.userData.headY+0.9+Math.sin(clockT*0.004)*0.1;
      env.lookAt(camera.position);
    }
  }
  // cafe guests
  GUESTKEYS.forEach((k,i)=>{
    const o=guestObjs[k], on=S.guests.includes(k);
    o.visible=on;
    if(!on)return;
    const gx=300+(i%4)*40, gy=886+Math.floor(i/4)*34;
    o.position.set(wx(gx),groundY(gx,gy),wz(gy));
    o.rotation.y=Math.sin(clockT*0.0005+i)*0.8;
    animateCritter(o,clockT*0.0011+i,clockT);
  });
  // forage
  forageObjs.forEach((o,i)=>{
    const on=forageOpen(i);
    o.visible=on;
    if(on){
      o.userData.glow.position.y=0.78+Math.sin(clockT*0.003+i)*0.07;
      o.userData.glow.material.opacity=0.5+0.4*Math.sin(clockT*0.003+i);
    }
  });
  // tackle only belongs on screen while you're fishing
  if(scene2!=='fish'){bobber.visible=false;lineObj.visible=false;splash.material.opacity=0;}
  // post box flag
  postFlag.visible=!!(letterInBox()||S.roundReady.length);
  if(postFlag.visible)postFlag.position.y=2.5+Math.sin(clockT*0.004)*0.08;

  // the beds — only rebuilt when a bed has actually changed
  bedObjs.forEach((g,i)=>{
    const b=S.beds[i];
    const sig=b?b.k+b.r+b.y+b.st+(b.wat?'w':''):'-';
    if(g.userData.sig!==sig){ g.userData.sig=sig; buildPlant(g.userData.plant,b); }
    if(b)g.userData.plant.rotation.y=Math.sin(clockT*0.0009+i)*0.09;
    g.userData.soil.material.color.setHex(b&&b.wat?0x4e3a2a:0x6a4f3a);
  });
  tinG.userData.label.rotation.y=camYaw;

  // sea
  const pos=sea.geometry.attributes.position;
  for(let i=0;i<pos.count;i++){
    const x=seaBase[i*3], z=seaBase[i*3+2];
    pos.setY(i,Math.sin(x*0.22+clockT*0.0013)*0.16+Math.sin(z*0.31+clockT*0.0009)*0.12);
  }
  pos.needsUpdate=true; sea.geometry.computeVertexNormals();

  // lamps flicker
  if(S.flags.lampsLit)lampObjs.forEach((l,i)=>{
    l.bulb.scale.setScalar(0.9+Math.sin(clockT*0.006+i)*0.12);
  });
  // chimney smoke — the town is awake
  for(const s of smokers){
    const t=(clockT*0.00016+s.ph)%1;
    s.m.position.set(s.x+Math.sin(t*5+s.ph*9)*0.7, s.base+t*4.4, s.z+Math.cos(t*4+s.ph*7)*0.5);
    s.m.scale.setScalar(0.5+t*2.2);
    s.m.material.opacity=0.30*(1-t)*(1-t);
  }

  // weather particles follow the player
  const px=wx(player.x), pz=wz(player.y);
  if(rainP.visible){
    const rp=rainP.geometry.attributes.position;
    for(let i=0;i<rp.count;i++){
      let y=rp.getY(i)-dt*0.05;
      if(y<0){y=30;rp.setX(i,rnd(60,-60));rp.setZ(i,rnd(60,-60));}
      rp.setY(i,y);
    }
    rp.needsUpdate=true; rainP.position.set(px,0,pz);
  }
  if(driftP.visible){
    const dp=driftP.geometry.attributes.position;
    for(let i=0;i<dp.count;i++){
      let y=dp.getY(i)-dt*0.0035;
      let x=dp.getX(i)+Math.sin(clockT*0.0006+i)*0.01;
      if(y<0){y=30;x=rnd(60,-60);dp.setZ(i,rnd(60,-60));}
      dp.setY(i,y); dp.setX(i,x);
    }
    dp.needsUpdate=true; driftP.position.set(px,0,pz);
  }
  stars.position.set(px,0,pz);
  moon.position.set(px+70,90,pz-140);
}

function doFlower(id){
  const idx=bloomFor(id);
  if(idx<0){say_toast('You are not carrying any flowers.',1800);return;}
  if(S.gaveFlower[id]===S.day){say_toast(PEOPLE[id].name+' already has one of yours today.',2000);return;}
  const b=S.blooms.splice(idx,1)[0];
  const h=hue(b.r,b.y);
  const right=h.id===PEOPLE[id].likes;
  S.gaveFlower[id]=S.day;
  if(right)S.warmth[id]=Math.min(5,S.warmth[id]+1);
  save();
  say(id,right
    ?pick(["Oh — that one. That is exactly the one. How did you know it was that one?",
           "They put it straight in water, and then move the water somewhere they'll see it.",
           "\"That colour,\" they say, and then don't finish the sentence, and don't need to."])
    :pick(["\"Very nice,\" they say, and mean it, and put it behind their ear at a bad angle.",
           "It gets a jar of its own on the sill. Not the good sill. But a sill.",
           "They hold it up to the light, nod once, and carry on with what they were doing."]));

  else if(nxt)say_toast('Nothing more today. Rest, and see.',2400);

function afterPlayerLetter(l){

  if(l.id==='l13'){S.flags.lampsLit=true;applyPhase();say_toast('The lamps are up along the sea path.',3000);}
  if(l.id==='l14')writeInit();

function talkSpecial(id){
  if(id==='fen'&&S.flags.bottleHunt&&!S.flags.hasBottle&&!delivered('l10'))
    return ["Deep water, remember. Past where the light stops.",
            "You'll know it when it comes up. It won't fight you."];
  if(id==='fen'&&S.flags.hasBottle&&!delivered('l10'))
    return ["There it is. Don't — no. Don't open it.",
            "That's not ours to open. Take it up the hill to Marla.",
            "She'll know the wax."];
  if(id==='tock'&&S.flags.gathering&&!S.flags.gatheringNow)
    return ["Thursday night. Sea path. Everyone's going.",
            "Let the day run out and come down. I'll be there, being professional about it."];
  if(id==='oswin'&&S.flags.gatheringNow)
    return ["I walked down. It took an hour and I stopped twice and I'm not sorry about either.",
            "She's put the good cups out. The ones with the chip.",
            "Thank you for carrying it all. Somebody had to and it was never going to be us."];
  if(id==='marla'&&S.flags.gatheringNow)
    return ["Don't say anything. If you say anything I shall be very brisk about it.",
            "...He's here. That's all. He's here and the tea's going cold and it doesn't matter."];
  if(id==='pim'&&S.served>=6)
    return ["People keep saying the shop's warm now. Not the fire. The other thing.",
            "I don't know how you did it. I'd like to learn."];
  return null;
}

// ============================== TIME ================================
function advanceTime(){
  S.phase++;
  if(S.phase>3){
    S.phase=0; S.day++;
    S.weather=pick(['clear','clear','clear','rain','mist','wind']);
    if((S.day-1)%7===0){ S.season=(S.season+1)%4; applySeason(); }
    const born=growGarden();      // the beds get on with it while you're asleep
    S.gaveFlower={};
    if(!S.bag.length)rollRound(); // yesterday's undelivered notes stay in the bag
    if(S.weather==='rain')S.beds.forEach(b=>{if(b)b.wat=true;});   // rain does the round for you
    if(born)say_toast(born===1?'Something new in the empty bed.'
                             :born+' new seedlings in the beds.',3000);
    if(S.flags.gatheringNow){S.flags.gatheringNow=false;S.flags.gatheringDone=true;}
    applyPhase(); save();
    say(null,["You sleep above the shop. The building settles around you, one beam at a time.",
      "Day "+S.day+". "+({clear:'Clear, and cold enough to see your breath.',
        rain:'Rain, going sideways.',mist:'Mist off the water. The light is a smudge.',
        wind:'Wind, and the whole wood talking about it.'})[S.weather]+
      "  "+season().name+"."]);
    return;
  }
  if(S.phase===3&&S.flags.gathering&&!S.flags.gatheringDone&&!S.flags.gatheringNow){
    S.flags.gatheringNow=true;
    say_toast('Lights, down on the sea path.',3200);
  }
  applyPhase(); save();
  say_toast(phase().name,1500);
}

const dlg={q:[],i:0,chars:0,done:false,after:null};
function say(who,lines,after){
  dlg.q=(Array.isArray(lines)?lines:[lines]).map(t=>({who,t}));
  dlg.i=0;dlg.chars=0;dlg.done=false;dlg.after=after||null;scene2='dialog';
}
function sayMulti(entries,after){
  dlg.q=entries.slice();dlg.i=0;dlg.chars=0;dlg.done=false;dlg.after=after||null;scene2='dialog';
}
function updateDialog(dt){
  const cur=dlg.q[dlg.i]; if(!cur){endDialog();return;}
  const full=cur.t.length;
  if(dlg.chars<full){
    dlg.chars+=dt*0.055;
    if(keys[' ']||keys['e']||keys['enter'])dlg.chars+=dt*0.22;
    if(dlg.chars>=full){dlg.chars=full;dlg.done=true;}
  } else dlg.done=true;
  if(tap('e',' ','enter')){
    if(!dlg.done){dlg.chars=full;dlg.done=true;}
    else{dlg.i++;dlg.chars=0;dlg.done=false;if(dlg.i>=dlg.q.length)endDialog();}
  }
}
function endDialog(){
  const a=dlg.after; dlg.after=null; dlg.q=[];
  scene2 = room ? room.scene : 'map';
  if(a)a();
}
function drawDialog(){
  const cur=dlg.q[dlg.i]; if(!cur)return;
  const bx=90,by=VH-166,bw=VW-180,bh=136;
  dim('rgba(20,14,10,0.45)');
  fillRR(bx+4,by+6,bw,bh,14,'rgba(20,14,10,0.4)');
  fillRR(bx,by,bw,bh,14,UP.paper);
  ctx.strokeStyle='rgba(140,110,80,0.5)';ctx.lineWidth=2;rr(bx+5,by+5,bw-10,bh-10,10);ctx.stroke();
  let tx=bx+26;
  if(cur.who&&PEOPLE[cur.who]){
    const p=PEOPLE[cur.who];
    fillRR(bx+16,by+16,74,74,10,'#e6d4b0');
    ctx.save();ctx.beginPath();rr(bx+16,by+16,74,74,10);ctx.clip();
    critter2d(bx+53,by+92,p.sp,p.body,p.trim,'right',Math.sin(performance.now()*0.0015)*0.3,1.35);
    ctx.restore();
    ctx.strokeStyle='rgba(140,110,80,0.5)';ctx.lineWidth=2;rr(bx+16,by+16,74,74,10);ctx.stroke();
    txt(p.name,bx+53,by+106,13,UP.ink2,'center');
    tx=bx+108;
  }
  wrapText(cur.t.slice(0,Math.floor(dlg.chars)),bx+bw-tx-26,17)
    .slice(0,5).forEach((l,i)=>txt(l,tx,by+44+i*25,17,UP.ink));
  if(dlg.done){
    const b=Math.sin(performance.now()*0.005)*2;
    ctx.fillStyle=UP.ink2;
    ctx.beginPath();ctx.moveTo(bx+bw-30,by+bh-24+b);ctx.lineTo(bx+bw-20,by+bh-24+b);
    ctx.lineTo(bx+bw-25,by+bh-17+b);ctx.closePath();ctx.fill();
  }
}

function drawLetterView(){
  dim('rgba(18,13,9,0.74)');
  const bw=560,bh=430,bx=(VW-bw)/2,by=(VH-bh)/2;
  ctx.save();ctx.translate(bx,by);ctx.rotate(-0.006);
  fillRR(6,8,bw,bh,3,'rgba(0,0,0,0.35)');

  ctx.strokeStyle='rgba(160,130,96,0.4)';ctx.lineWidth=1.2;
  ctx.beginPath();ctx.moveTo(bx+38,by+62);ctx.lineTo(bx+bw-38,by+62);ctx.stroke();
  let y=by+94;
  ctx.save();ctx.beginPath();ctx.rect(bx+30,by+70,bw-60,bh-118);ctx.clip();
  for(const p of reading.body.split('\n')){
    if(!p.trim()){y+=13;continue;}
    for(const line of wrapText(p,bw-80,16)){txt(line,bx+40,y-readScroll,16,'#40342a');y+=24;}
    y+=6;
  }
  ctx.restore();
  const overflow=Math.max(0,(y-by-70)-(bh-124));
  if(overflow>0){
    txt('scroll with W / S',bx+bw-46,by+bh-40,11,'rgba(120,96,70,0.7)','right');
    if(keys['s']||keys['arrowdown'])readScroll=Math.min(overflow,readScroll+3);
    if(keys['w']||keys['arrowup'])readScroll=Math.max(0,readScroll-3);
  }
  if(reading.from!=='player'&&PEOPLE[reading.from]){
    const f=PEOPLE[reading.from];
    ctx.save();ctx.beginPath();ctx.arc(bx+bw-52,by+bh-30,20,0,7);ctx.clip();
    critter2d(bx+bw-52,by+bh-16,f.sp,f.body,f.trim,'right',0,0.62,0.3);
    ctx.restore();
  }
  txt('E  —  fold it up',VW/2,by+bh+34,14,'rgba(240,226,200,0.7)','center');
  if(tap('e',' ','enter','escape')){
    const a=readAfter;reading=null;readAfter=null;
    scene2 = room ? room.scene : 'map';
    if(a)a();
  }
}

    if(!FISHBY[id])return;
    const m=tankFishMesh(id);
    m.userData={ph:i*1.7, sp:0.5+((i*37)%13)/26, lane:(i%3-1)*0.28, hi:((i%2)?0.1:-0.06)};
    tankFishG.add(m);
  });
  S.tank.deco.slice(0,DECOMAX).forEach((id,i)=>{
    const d=DECO[id]; if(!d)return;
    const x=(i-(Math.min(S.tank.deco.length,DECOMAX)-1)/2)*0.8;
    const y=TANK.y0+0.1, g=new THREE.Group();
    g.position.set(x,y,0); g.scale.setScalar(0.75); tankDecoG.add(g);
    if(id==='pebbles'){ for(let k=0;k<5;k++){
      const p=ball(0.055,d.col,(k-2)*0.075,0.01+(k%2)*0.02,(k%3-1)*0.06,g,7); p.scale.y=0.6; } }
    else if(id==='weed'){ for(let k=-1;k<2;k++){
      const w=cyl(0.02,0.035,0.62,5,d.col,k*0.09,0.31,0,g); w.rotation.z=k*0.22; } }
    else if(id==='oldboot'){ box(0.22,0.2,0.13,d.col,0,0.1,0,g);
      const toe=box(0.16,0.1,0.13,d.col,0.16,0.05,0,g); toe.rotation.z=0.1; }
    else if(id==='kettle'){ const k2=cyl(0.13,0.15,0.2,10,d.col,0,0.1,0,g);
      cyl(0.05,0.02,0.16,6,d.col,0.15,0.14,0,g).rotation.z=-0.9; cyl(0.06,0.06,0.03,8,d.col,0,0.21,0,g); }
    else { for(let k=0;k<5;k++){ const a=k/5*6.283;
      const arm=new THREE.Mesh(new THREE.ConeGeometry(0.035,0.15,4),mat(d.col));
      arm.position.set(Math.cos(a)*0.08,0.03,Math.sin(a)*0.08);
      arm.rotation.z=Math.PI/2-0.2; arm.rotation.y=-a; g.add(arm); } }
  });
}
function updateTankFish(dt){
  const hw=TANK.w/2-0.3, hd=TANK.d/2-0.22;
  tankFishG.children.forEach(m=>{
    const u=m.userData;
    u.ph+=dt*0.00042*u.sp*(1+0.3);
    const t=u.ph;
    const x=Math.sin(t)*hw, z=Math.sin(t*1.7+1.1)*hd*0.8+u.lane*0.3;
    const y=TANK.y0+TANK.h*0.5+u.hi+Math.sin(t*2.3)*0.09;
    const dx=Math.cos(t)*hw;
    m.position.set(x,y,z);
    m.rotation.y=dx>=0?0:Math.PI;
    m.rotation.z=Math.sin(t*2.3)*0.12*(dx>=0?1:-1);
  });
}
function decoAvailable(id){
  const d=DECO[id];
  if(d.always)return true;
  if(d.need.fish)return !!S.fish[d.need.fish];
  if(d.need.item)return (S.inv[d.need.item]||0)>0;
  return false;
}

  if(S.jar){
    const st=cyl(0.016,0.02,0.34,5,0x6f9a56,0,0.32,0,houseJarG);
    const col=parseInt(hue(S.jar.r,S.jar.y).col.slice(1),16);

let K=null;
function openShop(){

function openCafe(){
  if(S.phase<2){say(null,"The Hollow doesn't open till the light goes. That's rather the point of it.");return;}

  setInteriorMood(true); nextCustomer(); enterRoom(iscene,icam,'kitchen');
}
function closeKitchen(){ K=null; leaveRoom(); }
function nextCustomer(){
  K.pot=[];K.res=null;
  if(K.served>=K.max){K.st='closing';setCustomerModel(null);return;}
  if(K.mode==='brew'){
    K.cust=pick(Object.keys(PEOPLE).filter(id=>id!=='oswin'||delivered('l11')));
    const p=PEOPLE[K.cust], rg=regOf(K.cust);
    // once you've made it right for them once, they stop describing it
    K.mood=(rg.known&&Math.random()<0.6)
      ? {t:pick(["The usual, please.","My usual, if you've got the makings.",
                 "Same as ever. You know the one."]), want:p.usual.slice(), usual:true}
      : pick(MOODS);
    setCustomerModel(p.sp,p.body,p.trim,1);
  } else {
    const news=GUESTKEYS.filter(g=>!S.guests.includes(g));
    K.cust=(news.length&&Math.random()<0.6)?pick(news):pick(S.guests.length?S.guests:news);
    K.mood={t:null,want:GUESTS[K.cust].want};
    const g=GUESTS[K.cust]; setCustomerModel(g.sp,g.body,g.trim,0.8);
  }
  K.st='order';
}
function setCustomerModel(sp,body,trim,sc2){
  iscene.remove(customerSlot);
  customerSlot=new THREE.Group();
  if(sp){
    const c=makeCritter(sp,body,trim);
    c.scale.setScalar((sc2||1)*2.0);
    c.position.set(-1.9,0,0.6); c.rotation.y=0;

function potTags(){const t=[];for(const id of K.pot)for(const g of ING[id].tags)if(!t.includes(g))t.push(g);return t;}
function blendName(tags){for(const [need,nm] of BLENDNAMES)if(need.every(t=>tags.includes(t)))return nm;return null;}
function kitchenItems(){
  const want=K.mode==='brew'?['leaf','add']:['food'];
  return Object.keys(ING).filter(id=>want.includes(ING[id].kind)&&(S.inv[id]||0)>0);
}
function addToPot(id){
  if(K.pot.length>=3){say_toast('Three is plenty.',1200);return;}
  if(K.mode==='brew'){
    const leaves=K.pot.filter(x=>ING[x].kind==='leaf').length;
    if(ING[id].kind==='leaf'&&leaves>=1){say_toast('One leaf at a time.',1200);return;}
    if(ING[id].kind==='add'&&!leaves){say_toast('Start with a leaf.',1200);return;}
  }
  if((S.inv[id]||0)<=K.pot.filter(x=>x===id).length){say_toast("You've none left.",1200);return;}
  K.pot.push(id);
}
function serve(){
  const tags=potTags(), want=K.mood.want;
  const hits=want.filter(w=>tags.includes(w)).length;
  const score=K.pot.length===0?-1:hits;
  for(const id of K.pot)takeItem(id);
  const name=blendName(tags);
  if(name&&!S.recipes.includes(name))S.recipes.push(name);
  let line,warm=0;
  if(score<0)line="You hand over a cup of plain hot water. They drink it. They're too polite by half.";
  else if(score===0)line=K.mode==='brew'
    ?pick(["They drink it. It's tea. Tea is never nothing.",
           "\"Lovely,\" they say, in the voice people use for lovely.",
           "It's warm and it's wet and on some days that is the entire job."])
    :pick(["Eaten, but slowly. Politeness, in an animal, looks a lot like chewing.",
           "Half of it goes. The other half is carried off for later, probably out of kindness."]);
  else if(score===1){warm=1;line=K.mode==='brew'
    ?pick(["They stop talking to drink it, which from them is a standing ovation.",
           "\"Oh, that's the one.\" They wrap both hands round the cup.",
           "They go quiet, and stay a bit longer than they meant to."])
    :pick(["Gone in four seconds. A small, serious look of thanks.",
           "They eat the lot and then sit by the fire like they live here."]);}
  else{warm=2;line=K.mode==='brew'
    ?pick(["They put the cup down, look at you, and say: \"How did you know?\"",
           "The first sip stops them mid-sentence. The second one finishes the sentence for them.",
           "\"You've been paying attention,\" they say. It isn't quite an accusation."])
    :pick(["They finish it, wash their face, and settle in the good chair like the matter is closed.",
           "They eat, and then they go and fetch a friend from the dark outside."]);}
  if(name)line+="  ("+name+")";
  if(K.mode==='brew'){
    // their usual, made right, is what gets them talking — a line a day, in order
    const p=PEOPLE[K.cust], rg=regOf(K.cust);
    if(p.usual.every(t=>tags.includes(t))){
      if(!rg.known){
        rg.known=1;
        line+="\nThat is their usual, it turns out. "+
              p.usual.map(w=>TAGNAMES[w]).join(' and ')+", and no fuss about it.";
      } else if(rg.step<p.story.length){
        line+="\n“"+p.story[rg.step]+"”";
        rg.step++;
        if(rg.step>=p.story.length)line+="\nThat is the whole of it. They look lighter for having said it.";
      }
      if(warm<1)warm=1;
    }
    S.warmth[K.cust]=Math.min(5,S.warmth[K.cust]+warm);S.served++;
  }
  else{
    S.fed++;
    if(warm>=1&&!S.guests.includes(K.cust)&&S.guests.length<10){
      S.guests.push(K.cust);
      line+="\n"+GUESTS[K.cust].name.replace(/^a /,'A ')+" lives here now, as far as it is concerned.";
    }
  }
  K.res={line,score};K.st='result';K.served++;save();
}

  // pot contents

// a little flower, drawn flat, for the panels and the album
function flower2d(cx,cy,kind,r,y,s){
  const col=hue(r,y).col, form=KINDBY[kind].form;
  ctx.strokeStyle='#5f8a4e'; ctx.lineWidth=2*s; ctx.beginPath();
  ctx.moveTo(cx,cy+16*s); ctx.lineTo(cx,cy-2*s); ctx.stroke();
  ctx.fillStyle='#6f9a56';
  ctx.beginPath(); ctx.ellipse(cx-6*s,cy+9*s,6*s,2.6*s,-0.4,0,7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx+6*s,cy+11*s,6*s,2.6*s,0.4,0,7); ctx.fill();
  ctx.fillStyle=col;
  if(form==='spire'){
    for(let i=0;i<4;i++){ ctx.beginPath();
      ctx.ellipse(cx+(i%2?3:-3)*s,cy+(2-i*5)*s,4.4*s,3.2*s,0,0,7); ctx.fill(); }
  } else if(form==='bell'){
    ctx.beginPath(); ctx.moveTo(cx-7*s,cy-4*s); ctx.lineTo(cx+7*s,cy-4*s);
    ctx.lineTo(cx,cy+7*s); ctx.closePath(); ctx.fill();
  } else if(form==='star'){
    for(let i=0;i<7;i++){ const a=i/7*6.283;
      ctx.beginPath();
      ctx.ellipse(cx+Math.cos(a)*7*s,cy-2*s+Math.sin(a)*7*s,4.6*s,1.9*s,a,0,7); ctx.fill(); }
    ctx.fillStyle='#f2d98a'; ctx.beginPath(); ctx.arc(cx,cy-2*s,3*s,0,7); ctx.fill();
  } else {
    for(let i=0;i<8;i++){ const a=i/8*6.283;
      ctx.beginPath(); ctx.arc(cx+Math.cos(a)*5.4*s,cy-2*s+Math.sin(a)*5.4*s,3.4*s,0,7); ctx.fill(); }
    ctx.beginPath(); ctx.arc(cx,cy-2*s,4.2*s,0,7); ctx.fill();
  }
}

function rollFish(pow){
  // carry sage down to the water and it comes up. once, and then never again.
  if(!S.flags.sageFish&&(S.inv.sage||0)>0)return FISHBY.sagefish;
  if(S.flags.bottleHunt&&!S.flags.hasBottle&&!delivered('l10')&&pow>0.66&&isNight()&&Math.random()<0.34)
    return FISHBY.bottle;
  let maxRar=pow<0.36?1:pow<0.68?2:3;
  if(pow>0.86&&Math.random()<0.18)maxRar=4;
  const pool=FISH.filter(f=>{
    if(f.special)return false;
    if(f.rar>maxRar)return false;
    if(f.id==='moonperch'||f.id==='lanternfish'||f.id==='glasspike')return isNight();
    return true;
  });
  const weighted=[];
  for(const f of pool){const n=Math.max(1,6-f.rar*2);for(let i=0;i<n;i++)weighted.push(f);}
  return pick(weighted);
}
function bobMap(){ return {x:DOCKEND.x, y:DOCKEND.y+26+F.dst*360}; }
function updateFishing(dt){
  F.t+=dt;
  if(tap('escape')){scene2='map';F=null;bobber.visible=false;lineObj.visible=false;save();return;}
  if(F.st==='idle'){ if(keys[' ']||keys['e']){F.st='charge';F.pow=0;F.dir=1;} }
  else if(F.st==='charge'){
    F.pow+=F.dir*dt*0.0013;
    if(F.pow>=1){F.pow=1;F.dir=-1;} if(F.pow<=0){F.pow=0;F.dir=1;}
    if(!keys[' ']&&!keys['e']){F.dst=F.pow;F.st='cast';F.t=0;}
  }
  else if(F.st==='cast'){ if(F.t>460){F.st='wait';F.t=0;F.wait=rnd(5200,1400);F.ring=1;} }
  else if(F.st==='wait'){
    if(F.t>F.wait){F.st='nibble';F.t=0;F.ring=1;}
    if(tap('e',' ')){F.st='miss';F.t=0;F.line="Too soon. The water forgives you.";}
  }
  else if(F.st==='nibble'){
    if(tap('e',' ')){
      const f=rollFish(F.dst);
      F.fish=f; F.len=Math.round(rnd(f.len[1],f.len[0]));
      F.st='caught';F.t=0;F.caught++;F.ring=1;
      const rec=S.fish[f.id]||{n:0,best:0};
      rec.n++;rec.best=Math.max(rec.best,F.len);S.fish[f.id]=rec;
      if(f.id==='bottle')S.flags.hasBottle=true;
      if(f.id==='sagefish'){S.flags.sageFish=true;
        say_toast('It sits in your hands like it has somewhere to be.',3600);}
      save();
    }
    if(F.t>1050){F.st='miss';F.t=0;F.line="It thought better of it and went back down.";}
  }
  else if((F.st==='caught'||F.st==='miss')&&F.t>500&&tap('e',' ','enter')){
    F.st='idle';F.fish=null;F.t=0;bobber.visible=false;lineObj.visible=false;
  }

  // --- 3d bits
  const showBob=F.st!=='idle'&&F.st!=='charge';
  bobber.visible=showBob; lineObj.visible=showBob;
  const rod=new THREE.Vector3(wx(DOCKEND.x),2.0,wz(DOCKEND.y)+0.6);
  if(showBob){
    const bm=bobMap();
    let bx=wx(bm.x), bz=wz(bm.y), by=-0.75;
    if(F.st==='cast'){
      const t=Math.min(1,F.t/460);
      bx=lerp(rod.x,bx,t); bz=lerp(rod.z,bz,t); by=lerp(2.0,-0.75,t)+Math.sin(t*Math.PI)*3.2;
    }
    if(F.st==='nibble')by-=Math.abs(Math.sin(F.t*0.02))*0.28;
    if(F.st==='caught')by+=Math.min(1.4,F.t*0.0022);
    bobber.position.set(bx,by,bz);
    lineGeo.setFromPoints([rod,new THREE.Vector3(bx,by+0.15,bz)]);
    lineGeo.attributes.position.needsUpdate=true;
    splash.position.set(bx,-0.72,bz);
    if(F.ring>0){F.ring-=dt*0.0012;
      splash.scale.setScalar(1+(1-F.ring)*5);
      splash.material.opacity=Math.max(0,F.ring*0.7);}
    else splash.material.opacity=0;
    if(F.st==='nibble'&&F.t%220<20)F.ring=1;
  } else splash.material.opacity=0;

  // camera looks out over the channel
  const look=showBob?bobber.position:new THREE.Vector3(wx(DOCKEND.x),-0.6,wz(DOCKEND.y+180));
  camPos.lerp(new THREE.Vector3(wx(DOCKEND.x)-1.2,4.6,wz(DOCKEND.y)-6.5),1-Math.pow(0.004,dt/1000));
  camLook.lerp(new THREE.Vector3(look.x,look.y+0.6,look.z),1-Math.pow(0.01,dt/1000));
  camera.position.copy(camPos); camera.lookAt(camLook);
  sun.target.position.set(wx(DOCKEND.x),0,wz(DOCKEND.y));
}

  const X=x=>bx+x*k, Y=y=>by+y*k;
  const hex=n=>'#'+n.toString(16).padStart(6,'0');
  const se=season();

  ctx.save();
  ctx.beginPath(); rr(bx,by,bw,bh,5); ctx.clip();
  ctx.fillStyle=hex(se.grass); ctx.fillRect(bx,by,bw,bh);

  // the channel, off the bottom edge
  ctx.fillStyle=hex(se.water);
  ctx.beginPath(); ctx.moveTo(bx,by+bh);
  for(let x=0;x<=MAPW;x+=16)ctx.lineTo(X(x),Y(shoreY(x)));
  ctx.lineTo(bx+bw,by+bh); ctx.closePath(); ctx.fill();

  // the woods, one blot per tree — they clump on their own
  for(const t of TREES){
    ctx.fillStyle=t.kind==='pine'?hex(se.pine):t.kind==='apple'?hex(se.fruit):hex(se.leaf);
    ctx.beginPath(); ctx.arc(X(t.x),Y(t.y),Math.max(1.6,t.r*k*0.82),0,7); ctx.fill();
  }

  // paths
  ctx.strokeStyle=hex(se.path); ctx.lineWidth=Math.max(2.4,8*k);
  ctx.lineCap='round'; ctx.lineJoin='round';
  for(const p of PATHS){
    ctx.beginPath();
    p.forEach((q,i)=>i?ctx.lineTo(X(q[0]),Y(q[1])):ctx.moveTo(X(q[0]),Y(q[1])));
    ctx.stroke();
  }
  // the dock, out into the water
  ctx.fillStyle='#8a6444';
  ctx.fillRect(X(DOCK.x),Y(DOCK.y),DOCK.w*k,DOCK.h*k);

  // what's still worth picking
  FORAGE_DEF.forEach((f,i)=>{
    if(!forageOpen(i))return;
    ctx.fillStyle=ING[f[2]].col;
    ctx.beginPath(); ctx.arc(X(f[0]),Y(f[1]),2.6,0,7); ctx.fill();
  });

  // the beds
  BEDS.forEach((bed,i)=>{
    const b=S.beds[i], w=GARDEN.dx*k*0.8, h=GARDEN.dy*k*0.78;
    fillRR(X(bed.x)-w/2,Y(bed.y)-h/2,w,h,1.5,b&&b.wat?'#4e3a2a':'#6a4f3a');
    if(b&&b.st>=3){
      ctx.fillStyle=hue(b.r,b.y).col;
      ctx.beginPath(); ctx.arc(X(bed.x),Y(bed.y),2.6,0,7); ctx.fill();
    }
  });
  ctx.fillStyle='#9fb0a4'; ctx.beginPath();
  ctx.arc(X(SEEDTIN.x),Y(SEEDTIN.y),3,0,7); ctx.fill();
  // the door in the bank goes on the map only once it has been opened — before
  // that the whole point of it is that it is not on any map
  if(S.flags.cellarOpen){
    ctx.fillStyle='#7d7a72';
    ctx.beginPath(); ctx.arc(X(HATCH.x),Y(HATCH.y),4.2,0,7); ctx.fill();
    ctx.strokeStyle='#9db08c'; ctx.lineWidth=1.6; ctx.stroke();
  }

  // the buildings, footprint in their own roof colour
  for(const b of BUILDINGS){
    if(b.kind==='light'){
      // the plot is tall; the tower standing on it is not. draw the tower.
      const lx=X(b.x+b.w/2), ly=Y(b.y+b.h*0.72), lr=Math.max(4,30*k);
      ctx.fillStyle=hex(b.roof); ctx.beginPath(); ctx.arc(lx,ly,lr,0,7); ctx.fill();
      ctx.strokeStyle='rgba(255,246,228,0.9)'; ctx.lineWidth=1.4; ctx.stroke();
      ctx.fillStyle=S.phase>=2?'#ffe9a8':'#f0eade';
      ctx.beginPath(); ctx.arc(lx,ly,lr*0.42,0,7); ctx.fill();
      continue;
    }
    fillRR(X(b.x),Y(b.y),b.w*k,b.h*k,2,hex(b.roof));
    ctx.strokeStyle='rgba(60,44,32,0.45)'; ctx.lineWidth=1.2;
    rr(X(b.x),Y(b.y),b.w*k,b.h*k,2); ctx.stroke();
  }

  // the post box, and the well
  const boxHot=!!(letterInBox()||S.roundReady.length);
  ctx.fillStyle=boxHot?'#e0563f':'#a05a48';
  ctx.beginPath(); ctx.arc(X(POSTBOX.x),Y(POSTBOX.y),boxHot?5:3.4,0,7); ctx.fill();
  ctx.strokeStyle='rgba(255,246,228,0.9)'; ctx.lineWidth=1.4; ctx.stroke();
  ctx.fillStyle='#7f7a70';
  ctx.beginPath(); ctx.arc(X(WELL.x),Y(WELL.y),3,0,7); ctx.fill();

  // the two ends of the shop: your stair at one, the tank in the window at the other
  const sx=X(HOMESTAIR.x), sy=Y(HOMESTAIR.y);
  ctx.fillStyle='#8a6444';
  for(let i=0;i<3;i++)ctx.fillRect(sx-4+i*3,sy+2-i*2.4,3,2.2);
  ctx.strokeStyle='rgba(255,246,228,0.75)'; ctx.lineWidth=1;
  ctx.strokeRect(sx-4.5,sy-5,9.5,7.5);
  const tx=X(SHOPWINDOW.x), ty=Y(SHOPWINDOW.y);
  fillRR(tx-5,ty-4,10,8,1.5,'#6aa2b8');
  ctx.strokeStyle='rgba(255,246,228,0.85)'; ctx.lineWidth=1.2; rr(tx-5,ty-4,10,8,1.5); ctx.stroke();
  ctx.fillStyle='#f6ecd6';
  ctx.beginPath(); ctx.ellipse(tx+0.5,ty,2.4,1.3,0,0,7); ctx.fill();
  ctx.beginPath(); ctx.moveTo(tx-1.8,ty); ctx.lineTo(tx-3.6,ty-1.4);
  ctx.lineTo(tx-3.6,ty+1.4); ctx.closePath(); ctx.fill();

  // everybody who is out, and whether you owe them anything
  for(const id in PEOPLE){
    if(!npcHere(id))continue;
    const p=npcPos(id), owed=letterFor(id)||bagFor(id);
    ctx.fillStyle=PEOPLE[id].body;
    ctx.beginPath(); ctx.arc(X(p.x),Y(p.y),4.6,0,7); ctx.fill();
    ctx.strokeStyle='rgba(255,246,228,0.85)'; ctx.lineWidth=1.4; ctx.stroke();
    txt(PEOPLE[id].name,X(p.x),Y(p.y)-8,10,'rgba(38,28,20,0.85)','center');
    if(owed){
      ctx.fillStyle='#f6ecd6';
      ctx.fillRect(X(p.x)+4,Y(p.y)-4,9,7);
      ctx.strokeStyle='rgba(60,44,32,0.7)'; ctx.lineWidth=0.9;
      ctx.strokeRect(X(p.x)+4.5,Y(p.y)-3.5,8,6);
      ctx.beginPath(); ctx.moveTo(X(p.x)+4.5,Y(p.y)-3.5);
      ctx.lineTo(X(p.x)+8.5,Y(p.y)-0.2); ctx.lineTo(X(p.x)+12.5,Y(p.y)-3.5); ctx.stroke();
    }
  }

  // you
  const pulse=0.5+0.5*Math.sin(performance.now()*0.004);
  ctx.fillStyle='rgba(233,140,74,'+(0.16+pulse*0.2)+')';
  ctx.beginPath(); ctx.arc(X(player.x),Y(player.y),9+pulse*4,0,7); ctx.fill();
  ctx.save();
  // player.face is atan2(dx,dy), so face 0 is walking *down* the map; the arrow
  // is drawn pointing up, which puts the correction at pi minus the angle
  ctx.translate(X(player.x),Y(player.y)); ctx.rotate(Math.PI-player.face);
  ctx.fillStyle='#c9764a';
  ctx.beginPath(); ctx.moveTo(0,-7); ctx.lineTo(5,5); ctx.lineTo(0,2.4); ctx.lineTo(-5,5);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle='#fbf0dc'; ctx.lineWidth=1.4; ctx.stroke();
  ctx.restore();
  ctx.restore();

  ctx.strokeStyle='rgba(120,96,70,0.55)'; ctx.lineWidth=1.6; rr(bx,by,bw,bh,5); ctx.stroke();

  // names, over the top so the woods can't swallow them
  for(const b of BUILDINGS)
    txt(b.name,X(b.x+b.w/2),Y(b.kind==='light'?b.y+b.h*0.72:b.y)-Math.max(6,34*k),
        10.5,'rgba(38,28,20,0.9)','center');
  txt('the beds',X(GARDEN.x0+GARDEN.cols*GARDEN.dx/2)-GARDEN.dx*k/2,
      Y(GARDEN.y0)-6,10.5,'rgba(38,28,20,0.9)','center');
  txt('the dock',X(DOCK.x+DOCK.w/2),Y(DOCK.y)-5,10.5,'rgba(38,28,20,0.9)','center');
  txt('your room',X(HOMESTAIR.x)-8,Y(HOMESTAIR.y)+16,10,'rgba(38,28,20,0.9)','right');
  // these two sit within a few paces of each other; stack the labels, don't row them
  txt('the tank',X(SHOPWINDOW.x)+8,Y(SHOPWINDOW.y)+4,10,'rgba(38,28,20,0.9)','left');
  txt('the post',X(POSTBOX.x)+8,Y(POSTBOX.y)+15,10,'rgba(38,28,20,0.85)','left');
  if(S.flags.cellarOpen)
    txt('the door',X(HATCH.x),Y(HATCH.y)-9,10,'rgba(38,28,20,0.9)','center');

  // compass
  const cx=bx+bw-16, cy=by+16;
  ctx.fillStyle='rgba(38,28,20,0.75)';
  ctx.beginPath(); ctx.moveTo(cx,cy-9); ctx.lineTo(cx+4,cy+2); ctx.lineTo(cx,cy);
  ctx.lineTo(cx-4,cy+2); ctx.closePath(); ctx.fill();
  txt('N',cx,cy+14,9,'rgba(38,28,20,0.75)','center');

  txt('you are the arrow  ·  a dot is something worth picking  ·  an envelope is post you owe',
      VW/2,VH-76,12.5,'rgba(110,88,64,0.8)','center');
  txt('M or Esc to put it away',VW/2,VH-54,13,'rgba(110,88,64,0.65)','center');
}

let wr={t:0};
function writeInit(){ wr={t:0}; scene2='write'; }
function updateWrite(dt){
  wr.t+=dt;
  if(keys[' ']||keys['e'])wr.t+=dt*2.2;
  const total=900+DEDICATION.lines.join(' ').length*46;
  if(wr.t>total&&tap('e',' ','enter')){S.finished=true;save();endT=0;scene2='end';}
}
function drawWrite(){
  dim('#120e0a');
  const g=ctx.createRadialGradient(VW/2,VH/2-30,60,VW/2,VH/2-30,420);
  g.addColorStop(0,'rgba(255,214,150,0.16)');g.addColorStop(1,'rgba(255,214,150,0)');
  ctx.fillStyle=g;ctx.fillRect(0,0,VW,VH);
  const bw=520,bh=430,bx=(VW-bw)/2,by=(VH-bh)/2-10;
  ctx.save();ctx.translate(bx,by);ctx.rotate(-0.008);
  fillRR(8,10,bw,bh,3,'rgba(0,0,0,0.5)');
  fillRR(0,0,bw,bh,3,'#f7ecd6');
  ctx.restore();
  const n=Math.max(0,(wr.t-500)/46);
  txt('To '+DEDICATION.to+',',bx+50,by+72,19,'#40342a');
  let y=by+114,used=0;
  for(const line of DEDICATION.lines){
    if(!line){y+=16;continue;}
    const shown=clamp(Math.floor(n-used),0,line.length);
    for(const l of wrapText(line.slice(0,shown),bw-100,16)){txt(l,bx+50,y,16,'#40342a');y+=25;}
    used+=line.length;
    if(n<used)break;
    y+=6;
  }
  const total=DEDICATION.lines.join(' ').length;
  if(n>total+8){
    txt('— '+DEDICATION.sign,bx+bw-70,by+bh-58,17,'#5a4638','right','italic ');
    const b=Math.sin(performance.now()*0.004)*0.5+0.5;
    txt('E  —  put it in the box',VW/2,VH-30,15,'rgba(240,226,200,'+(0.4+b*0.5)+')','center');
  }
}

// ============================== MAP TICK ============================
function updateMap(dt){
  movePlayer(dt);
  hoverInteract=findInteract();
  if(tap('e')&&hoverInteract){hoverInteract.act();return;}
  if(tap('j')){scene2='journal';jSel=0;return;}
  if(tap('m')){scene2='chart';return;}
  if(tap('escape')){scene2='menu';return;}
  if(tap('t')){advanceTime();return;}
  if(tap('g')&&S.blooms.length){
    let who=null,wd=1e9;
    for(const id in PEOPLE){
      if(!npcHere(id))continue;
      const p=npcPos(id),d=dist(player.x,player.y,p.x,p.y);
      if(d<58&&d<wd){wd=d;who=id;}
    }
    if(who){doFlower(who);return;}
    say_toast('Nobody here to give it to.',1600);
  }
  const mine=heldForPlayer();
  if(mine&&tap('f'))openLetter(LETBY[mine],()=>{});
}

// ============================== BOOT / LOOP =========================
applySeason(); applyPhase();
if(!S.roundReady.length&&!S.bag.length)rollRound();   // there is always a round waiting
camPos.set(wx(player.x),camHeight,wz(player.y)+camDist);
camLook.set(wx(player.x),1.4,wz(player.y));
document.getElementById('boot').remove();

function resize(){
  const w=innerWidth,h=innerHeight;
  renderer.setSize(w,h,false);
  camera.aspect=w/h; camera.updateProjectionMatrix();
  icam.aspect=w/h; icam.updateProjectionMatrix();
  tankCam.aspect=w/h; tankCam.updateProjectionMatrix();
  uiCv.width=w; uiCv.height=h;
  uiScale=Math.min(w/VW,h/VH);
  uiOX=(w-VW*uiScale)/2; uiOY=(h-VH*uiScale)/2;
}
addEventListener('resize',resize); resize();

// a small door left open for the test harness (and for anyone curious)
window.__moss={
  get state(){return S;}, get scene(){return scene2;}, set scene(v){scene2=v;},
  player, PEOPLE, LETBY, LETTERS, ING, FISH, KINDS, HUES, ROUND, ROUNDBY, BEDS, DECO,
  openShop, openCafe, openFish, openTank, openGarden, openCellar, openHouse,
  houseSleep, houseJar, HATCH, SEEDTIN, HOMESTAIR,
  advanceTime, applyPhase, applySeason, rollFish,
  goTo(mx,my){player.x=mx;player.y=my;updateCamera(0,true);},
  give(id,n){addItem(id,n||1);},
  giveSeed, sow, water, pickBloom, growGarden, rollRound, deliverRound, doFlower,
  crossGene, flowerKey, flowerName, hue, KINDBY,
  bedPos(i){return BEDS[i];},
  gpeek(){return G?{i:G.i,mode:G.mode,msg:G.msg}:null;},
  tpeek(){return T2?{tab:T2.tab,msg:T2.msg}:null;},
  takeRound(){const r=S.roundReady.slice();S.bag=S.bag.concat(r);S.roundOut=r.length;
    S.roundReady=[];save();return r;},
  catchOne(id,len){const r=S.fish[id]||(S.fish[id]={n:0,best:0});
    r.n++;r.best=Math.max(r.best,len||FISHBY[id].len[1]);save();return r;},
  takePost(){const l=letterInBox();if(!l)return null;S.held.push(l.id);S.boxTaken=true;return l.id;},
  deliver(id){deliverLetter(id);return S.delivered.slice();},
  interact(){const i=findInteract();if(i)i.act();return i&&i.label;},
  peek(){return {day:S.day,phase:phase().name,season:season().name,weather:S.weather,
    held:S.held.slice(),delivered:S.delivered.length,box:S.boxNext,
    warmth:warmthTotal(),fish:Object.keys(S.fish).length,inv:Object.keys(S.inv).length,
    guests:S.guests.length,scene:scene2,
    bag:S.bag.slice(),roundReady:S.roundReady.slice(),rounds:S.roundsDone,
    beds:S.beds.map(b=>b?b.k+':'+b.r+b.y+':'+b.st+(b.wat?'w':''):'-'),
    seeds:seedList().length,album:albumCount(),blooms:S.blooms.length,
    tank:S.tank.fish.slice(),deco:S.tank.deco.slice(),
    regulars:Object.keys(S.reg).filter(k=>S.reg[k].known).length,
    story:Object.keys(S.reg).reduce((n,k)=>n+S.reg[k].step,0)};}
};

let last=performance.now();
function frame(now){
  const dt=Math.min(48,now-last); last=now;
  clockT+=dt;
  if(toast.t>0)toast.t-=dt;

  // Everything this frame is dispatched on the scene as it was when the frame
  // began. Otherwise opening the journal and closing it again both happen on
  // the one keypress, because the tap is still set when the new scene updates.
  const sc0=scene2;
  if(sc0==='map'&&!consoleOpen)updateMap(dt);
  else if(sc0==='dialog')updateDialog(dt);
  else if(sc0==='journal')updateJournal();
  else if(sc0==='chart')updateChart();
  else if(sc0==='kitchen')updateKitchen(dt);
  else if(sc0==='tank')updateTank(dt);
  else if(sc0==='cellar')updateCellar(dt);
  else if(sc0==='house')updateHouse(dt);
  else if(sc0==='garden')updateGarden();
  else if(sc0==='fish')updateFishing(dt);
  else if(sc0==='write')updateWrite(dt);
  if(sc0==='map'&&tap('3'))consoleOpen=!consoleOpen;

  // indoors, `room` says what to draw — and it outlives a dialogue, so being
  // talked to in the tea shop no longer teleports you out into the square
  if(room){
    if(room.sc===iscene)iwindowMat.color.setHex(SKY[phase().id].bg);
    renderer.render(room.sc,room.cam);
  } else {
    tickWorld(dt);
    if(scene2!=='fish')updateCamera(dt);
    renderer.render(scene,camera);
  }

  // ---- 2D overlay
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,uiCv.width,uiCv.height);
  ctx.setTransform(uiScale,0,0,uiScale,uiOX,uiOY);

  // drawn on sc0 too — several of these panels read input as they draw
  if(sc0==='title')drawTitle(dt);
  else if(sc0==='map'){ drawPrompt(); drawHUD(); if(consoleOpen)drawConsole(); }
  else if(sc0==='dialog'){ drawHUD(); drawDialog(); }
  else if(sc0==='letter')drawLetterView();
  else if(sc0==='kitchen'&&K)drawKitchenUI();
  else if(sc0==='tank'&&T2)drawTankUI();
  else if(sc0==='cellar'&&CE)drawCellar();
  else if(sc0==='house'&&HS)drawHouseUI();
  else if(sc0==='garden'&&G)drawGardenUI();
  else if(sc0==='fish'&&F)drawFishingUI();
  else if(sc0==='journal')drawJournal();
  else if(sc0==='chart')drawChart();
  else if(sc0==='menu')drawMenu();
  else if(sc0==='write')drawWrite();
  else if(sc0==='end')drawEnd(dt);

  clearTaps(); mouse.click=false;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
