  ctx.translate(VW / 2, VH / 2 - 6);
  ctx.scale(sc, sc);

  ctx.fillStyle = 'rgba(74,48,12,0.6)';
  roundRect(-INNER.w/2, -INNER.h/2, INNER.w, INNER.h, 44); ctx.fill();
  ctx.strokeStyle = 'rgba(255,200,90,0.28)'; ctx.lineWidth = 3;
  roundRect(-INNER.w/2, -INNER.h/2, INNER.w, INNER.h, 44); ctx.stroke();

  for (const c of G.cells) drawCell(c);

  for (const f of G.innerFx) {
    ctx.globalAlpha = 1 - f.t / f.life;
    ctx.font = '800 15px system-ui, sans-serif'; ctx.textAlign = 'center';
    ctx.fillStyle = f.col; ctx.fillText(f.text, f.x, f.y);
    ctx.globalAlpha = 1;
  }

  const p = G.inner;
  const aur = ctx.createRadialGradient(p.x, p.y, 4, p.x, p.y, 44);
  aur.addColorStop(0, 'rgba(255,225,120,0.22)'); aur.addColorStop(1, 'rgba(255,225,120,0)');
  ctx.fillStyle = aur; ctx.beginPath(); ctx.arc(p.x, p.y, 44, 0, TAU); ctx.fill();
  drawBee(p.x, p.y, p.ang, 14, { phase: 0, flapSpd: 44, pollen: 0,
    base: '#f8c72e', hi: '#fff0a0', lo: '#c08a10', fuzz: '#7b5416' });
  ctx.restore();

  /* ---- overlay ---- */
  const cells = G.cells.length, used = liveBrood();
  ctx.textAlign = 'center';
  ctx.font = '900 26px system-ui, sans-serif'; ctx.fillStyle = '#ffd76a';
  ctx.fillText('THE BROOD COMB', VW / 2, 42);
  ctx.font = '700 15px system-ui, sans-serif'; ctx.fillStyle = '#ffe9a8';
  ctx.fillText('🍯 ' + Math.floor(G.honey) + '   ·   cells ' + used + '/' + cells +
               '   ·   nest tier ' + G.nest.tier, VW / 2, 66);

  // caste chips
  const nC = CASTE_KEYS.length, gap = 10;
  const cw = Math.min(168, (VW - 48 - gap * (nC - 1)) / nC);
  const tot = cw * nC + gap * (nC - 1);
  let cx = (VW - tot) / 2;
  const by = VH - 104;
  for (let i = 0; i < nC; i++) {
    const k = CASTE_KEYS[i], c = CASTE[k], on = G.caste === k;
    const afford = G.honey >= c.cost;
    ctx.fillStyle = on ? 'rgba(96,140,70,0.9)' : 'rgba(40,34,20,0.8)';
    roundRect(cx, by, cw, 60, 10); ctx.fill();
    ctx.strokeStyle = on ? c.col : 'rgba(255,220,140,0.22)'; ctx.lineWidth = on ? 2.4 : 1.2;
    roundRect(cx, by, cw, 60, 10); ctx.stroke();
    ctx.textAlign = 'left';
    ctx.font = '800 15px system-ui, sans-serif';
    ctx.fillStyle = afford ? c.col : '#8c8272';
    ctx.fillText((i + 1) + '  ' + c.name.toUpperCase(), cx + 12, by + 22);
    ctx.font = '600 11px system-ui, sans-serif'; ctx.fillStyle = '#cfc3a8';
    ctx.fillText(c.desc, cx + 12, by + 38);
    ctx.fillStyle = afford ? '#ffe08a' : '#c98d8d';
    ctx.font = '700 12px system-ui, sans-serif';
    ctx.fillText('🍯 ' + c.cost + '   ·   ' + casteCount(k) + ' alive', cx + 12, by + 53);
    cx += cw + gap;
  }

  // nest expansion progress
  const bw = 300, bx = (VW - bw) / 2;
  const need = buildNeed(G.nest.tier), prog = clamp(G.nest.prog / need, 0, 1);
  ctx.textAlign = 'center';
  ctx.font = '700 12px system-ui, sans-serif'; ctx.fillStyle = '#9fe0ff';
  const nb = casteCount('builder');
  ctx.fillText(nb ? 'comb expansion — ' + nb + (nb === 1 ? ' builder at work' : ' builders at work')
                  : 'comb expansion — lay a builder to start', VW / 2, VH - 128);
  bar(bx, VH - 122, bw, 6, prog, '#9fe0ff', 'rgba(0,0,0,0.45)');

  ctx.font = '700 13px system-ui, sans-serif'; ctx.fillStyle = '#e8dcc0';
  ctx.fillText('WASD move   ·   1–' + CASTE_KEYS.length + ' pick caste   ·   HOLD SPACE over an empty cell to lay   ·   E leave',
               VW / 2, VH - 26);
}

function drawHUD() {
  const b = G.bee;
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';

  // ---- top-left panel ----
  ctx.fillStyle = 'rgba(12,24,14,0.55)';
  roundRect(14, 14, 268, 104, 14); ctx.fill();
  ctx.strokeStyle = 'rgba(255,220,120,0.28)'; ctx.lineWidth = 1.5;
  roundRect(14, 14, 268, 104, 14); ctx.stroke();

  ctx.font = '800 22px system-ui, sans-serif'; ctx.fillStyle = '#ffd76a';
  ctx.fillText('🍯 ' + Math.floor(G.honey), 30, 44);

  ctx.font = '600 12px system-ui, sans-serif'; ctx.fillStyle = '#cfe6c8';
  ctx.fillText('NECTAR', 30, 64);
  bar(30, 70, 160, 10, b.nectar / S.cap(), '#ffd23f');
  ctx.fillStyle = '#eee'; ctx.font = '600 11px system-ui, sans-serif';
  ctx.fillText(Math.floor(b.nectar) + '/' + Math.floor(S.cap()), 198, 79);

  ctx.font = '600 12px system-ui, sans-serif'; ctx.fillStyle = '#cfe6c8';
  ctx.fillText('DASH', 30, 96);
  bar(30, 100, 160, 8, b.stam / 100, b.stam >= 26 ? '#7fd7ff' : '#54707d');

  // hearts
  for (let i = 0; i < b.hpMax; i++) {
    const hx = 208 + (i % 3) * 22, hy = 34 + Math.floor(i / 3) * 20;
    ctx.font = '15px system-ui, sans-serif';
    ctx.globalAlpha = i < b.hp ? 1 : 0.25;
    ctx.fillText('❤', hx, hy);
    ctx.globalAlpha = 1;
  }

  // ---- top-center: day / phase ----
  const cxp = VW / 2;
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(12,24,14,0.55)';
  roundRect(cxp - 128, 14, 256, 56, 14); ctx.fill();
  ctx.strokeStyle = G.phase === 'day' ? 'rgba(255,220,120,0.30)' : 'rgba(140,170,255,0.35)';
  roundRect(cxp - 128, 14, 256, 56, 14); ctx.stroke();

  ctx.font = '800 16px system-ui, sans-serif';
  ctx.fillStyle = G.phase === 'day' ? '#ffe08a' : '#a9c0ff';
  const label = G.phase === 'day'
    ? '☀ DAY ' + G.day + ' / ' + FINAL_DAY
    : '🌙 NIGHT ' + G.day + ' — ' + (G.wasps.length + G.spawnQueue.length) + ' left';
  ctx.fillText(label, cxp, 36);

  if (G.phase === 'day') {
    bar(cxp - 108, 46, 216, 10, G.phaseT / DAY_LEN, G.phaseT < 12 ? '#ff9a4a' : '#8ee06a');
  } else {
    const tot = G.wasps.length + G.spawnQueue.length;
    bar(cxp - 108, 46, 216, 10, 1 - tot / Math.max(1, 5 + G.day * 2.1), '#ff5a4a');
  }

  // ---- weather chip, just under the day panel ----
  const W = WX();
  ctx.font = '700 12.5px system-ui, sans-serif';
  const wlabel = W.icon + '  ' + W.name;
  const ww = ctx.measureText(wlabel).width + 26;
  ctx.fillStyle = 'rgba(12,24,14,0.5)';
  roundRect(cxp - ww / 2, 76, ww, 22, 11); ctx.fill();
  ctx.strokeStyle = 'rgba(255,220,120,0.22)'; ctx.lineWidth = 1;
  roundRect(cxp - ww / 2, 76, ww, 22, 11); ctx.stroke();
  ctx.fillStyle = '#dfe9d8'; ctx.textAlign = 'center';
  ctx.fillText(wlabel, cxp, 91);

  // ---- hive HP (top-right) ----
  ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(12,24,14,0.55)';
  roundRect(VW - 214, 14, 200, 56, 14); ctx.fill();
  ctx.strokeStyle = 'rgba(255,220,120,0.28)';
  roundRect(VW - 214, 14, 200, 56, 14); ctx.stroke();
  ctx.font = '700 13px system-ui, sans-serif'; ctx.fillStyle = '#cfe6c8';
  ctx.fillText('HIVE  ' + Math.ceil(G.hiveHP) + '/' + G.hiveMax, VW - 28, 36);
  const hp = G.hiveHP / G.hiveMax;
  bar(VW - 198, 46, 168, 10, hp, hp > 0.5 ? '#ffca3a' : hp > 0.25 ? '#ff9a4a' : '#ff4a4a');

  // ---- minimap ----
  const mw = 176, mh = Math.round(mw * WORLD.h / WORLD.w);
  const mx = VW - mw - 16, my = VH - mh - 16;
  ctx.fillStyle = 'rgba(8,20,10,0.62)';
  roundRect(mx - 6, my - 6, mw + 12, mh + 12, 10); ctx.fill();
  ctx.strokeStyle = 'rgba(255,220,120,0.25)';
  roundRect(mx - 6, my - 6, mw + 12, mh + 12, 10); ctx.stroke();
  const sx = mw / WORLD.w, sy = mh / WORLD.h;
  ctx.fillStyle = 'rgba(60,110,50,0.55)'; ctx.fillRect(mx, my, mw, mh);
  /* fog blinds the map past a radius around the queen — the one condition that
     takes something away instead of trading it */
  const fogR = wx('fog', 0) ? 560 : 1e9;
  const seen = (x, y) => d2(x, y, G.bee.x, G.bee.y) < fogR * fogR;
  for (const s of G.webs) {
    if (s.torn > 0 || !seen(s.x, s.y)) continue;
    ctx.fillStyle = 'rgba(225,240,250,0.5)';
    ctx.fillRect(mx + s.x * sx - 2, my + s.y * sy - 2, 4, 4);
  }
  for (const f of G.flowers) {
    const full = f.nectar / f.cap;
    if (full < 0.25 || !seen(f.x, f.y)) continue;
    ctx.fillStyle = f.golden ? '#ffe066'
                  : f.k.night ? '#bcdcff'
                  : (full > 0.7 ? '#d6ff8a' : 'rgba(200,255,150,0.45)');
    ctx.fillRect(mx + f.x * sx - 1, my + f.y * sy - 1, f.golden ? 3 : 2, f.golden ? 3 : 2);
  }
  ctx.fillStyle = '#ffb43a';
  ctx.fillRect(mx + HIVE.x * sx - 3, my + HIVE.y * sy - 3, 6, 6);
  for (const w of G.workers) { ctx.fillStyle = CASTE[w.caste].col; ctx.globalAlpha = 0.75; ctx.fillRect(mx + w.x * sx - 1, my + w.y * sy - 1, 2, 2); }
  ctx.globalAlpha = 1;
  // raiders always show — you never lose track of the thing eating your comb
  for (const w of G.wasps) { ctx.fillStyle = w.boss ? w.K.col.hi : w.K.col.base; ctx.fillRect(mx + w.x * sx - 2, my + w.y * sy - 2, w.boss ? 5 : 3, w.boss ? 5 : 3); }
  ctx.fillStyle = '#fff'; ctx.fillRect(mx + G.bee.x * sx - 2, my + G.bee.y * sy - 2, 4, 4);
  if (fogR < 1e9) {
    ctx.strokeStyle = 'rgba(255,255,255,0.18)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.ellipse(mx + G.bee.x * sx, my + G.bee.y * sy, fogR * sx, fogR * sy, 0, 0, TAU); ctx.stroke();
  }
  // camera box
  ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = 1;
  ctx.strokeRect(mx + (cam.x - VW / 2) * sx, my + (cam.y - VH / 2) * sy, VW * sx, VH * sy);

  // colony roster, coloured by caste
  ctx.textAlign = 'right'; ctx.font = '700 12px system-ui, sans-serif';
  let rx = VW - 16;
  for (let i = CASTE_KEYS.length - 1; i >= 0; i--) {
    const k = CASTE_KEYS[i], n = casteCount(k);
    if (!n) continue;
    const txt = n + ' ' + k + (i === CASTE_KEYS.length - 1 ? '' : ' ·');
    ctx.fillStyle = CASTE[k].col;
    ctx.fillText(txt, rx, my - 16);
    rx -= ctx.measureText(txt).width + 6;
  }
  if (!G.workers.length) { ctx.fillStyle = '#c98d8d'; ctx.fillText('no sisters left', VW - 16, my - 16); }

  // ---- messages ----
  ctx.textAlign = 'center';
  if (G.msgT > 0) {
    const a = clamp(G.msgT, 0, 1);
    ctx.globalAlpha = a;
    ctx.font = '800 26px system-ui, sans-serif';
    ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(0,0,0,0.6)';
    ctx.strokeText(G.msg, VW / 2, VH * 0.24);
    ctx.fillStyle = '#ffe9a8'; ctx.fillText(G.msg, VW / 2, VH * 0.24);
    ctx.globalAlpha = 1;
  }
  if (G.hintT > 0 && G.day === 1) {
    ctx.globalAlpha = clamp(G.hintT / 3, 0, 1) * 0.9;
    ctx.font = '600 14px system-ui, sans-serif'; ctx.fillStyle = '#dff0d8';
    ctx.fillText('WASD / arrows to fly  ·  hover a bloom to sip  ·  fly home to store honey  ·  SPACE to dash-sting', VW / 2, VH - 26);
    ctx.globalAlpha = 1;
  }

  if (G.bee.down > 0) {
    ctx.globalAlpha = 0.9; ctx.font = '800 30px system-ui, sans-serif'; ctx.fillStyle = '#ffb3b3';
    ctx.fillText('carried home...', VW / 2, VH / 2);
    ctx.globalAlpha = 1;
  }

  if (paused) {
    ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0, 0, VW, VH);
    ctx.font = '800 44px system-ui, sans-serif'; ctx.fillStyle = '#ffe9a8';
    ctx.fillText('PAUSED', VW / 2, VH / 2);
    ctx.font = '600 15px system-ui, sans-serif'; ctx.fillStyle = '#cfe6c8';
    ctx.fillText('P or ESC to resume  ·  M mutes', VW / 2, VH / 2 + 32);
  }
}

/* ------------------------------ screens -------------------------------- */
const titleBees = [];
for (let i = 0; i < 26; i++) titleBees.push({ x: rand(0, 2000), y: rand(0, 1200), sp: rand(40, 120), a: rand(0, TAU), s: rand(5, 13), ph: rand(0, TAU), w: rand(0.4, 1.5) });

function drawTitle() {
  // sky-ish meadow backdrop
  const g = ctx.createLinearGradient(0, 0, 0, VH);
  g.addColorStop(0, '#7fc45c'); g.addColorStop(0.55, '#54973d'); g.addColorStop(1, '#2e6127');
  ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);
  ctx.save();
  ctx.globalAlpha = 0.35; ctx.fillStyle = grassPat; ctx.fillRect(0, 0, VW, VH); ctx.restore();

  // drifting bees
  for (const t of titleBees) {
    t.a += Math.sin(time * t.w + t.ph) * 0.02;
    t.x += Math.cos(t.a) * t.sp * (1 / 60);
    t.y += Math.sin(t.a) * t.sp * (1 / 60);
    if (t.x < -40) t.x = VW + 40; if (t.x > VW + 40) t.x = -40;
    if (t.y < -40) t.y = VH + 40; if (t.y > VH + 40) t.y = -40;
    ctx.globalAlpha = 0.85;
    drawBee(t.x, t.y, t.a, t.s, { phase: t.ph * 6, pollen: 0.4, flapSpd: 46 });
    ctx.globalAlpha = 1;
  }

  ctx.fillStyle = 'rgba(0,0,0,0.28)'; ctx.fillRect(0, 0, VW, VH);

  ctx.textAlign = 'center';
  const bob = Math.sin(time * 1.6) * 6;
  ctx.font = '900 ' + Math.min(112, VW * 0.14) + 'px system-ui, sans-serif';
  ctx.lineWidth = 10; ctx.strokeStyle = '#3a2508';
  ctx.strokeText('NECTAR', VW / 2, VH * 0.34 + bob);
  const tg = ctx.createLinearGradient(0, VH * 0.22, 0, VH * 0.38);
  tg.addColorStop(0, '#fff3b0'); tg.addColorStop(1, '#f0a91c');
  ctx.fillStyle = tg;
  ctx.fillText('NECTAR', VW / 2, VH * 0.34 + bob);

  ctx.font = '700 17px system-ui, sans-serif'; ctx.fillStyle = '#ffe9a8';
  ctx.fillText('forage by day · defend the hive by night · ' + FINAL_DAY + ' days to overwinter', VW / 2, VH * 0.34 + bob + 40);

  ctx.font = '600 15px system-ui, sans-serif'; ctx.fillStyle = '#e7f5df';
  const lines = [
    'WASD / arrow keys — fly (momentum: you drift, so lead your turns)',
    'SPACE or SHIFT — dash. It is also your sting, and it tears spider silk.',
    'Hover a bloom to sip nectar — sipping is faster when you fly slow.',
    'Touch the hive to store honey; press E at the comb to lay eggs.',
    'Four castes: workers earn, soldiers fight, builders grow, nurses heal.',
    'Each dawn brings its own weather. Each night brings a different raid.',
    'Robbers steal · spitters shell you · carapaces shrug off stings.',
    'Survive the MATRIARCH on the last night. P pauses · M mutes.'
  ];
  lines.forEach((l, i) => ctx.fillText(l, VW / 2, VH * 0.54 + i * 23));

  ctx.font = '800 22px system-ui, sans-serif';
  ctx.globalAlpha = 0.65 + Math.sin(time * 4) * 0.35;
  ctx.fillStyle = '#fff3b0';
  ctx.fillText('press ENTER to fly', VW / 2, VH * 0.90);
  ctx.globalAlpha = 1;
}

function drawShop() {
  drawWorld();
  ctx.fillStyle = 'rgba(6,16,8,0.82)'; ctx.fillRect(0, 0, VW, VH);

  const panW = Math.min(1020, VW - 40);
  const panH = Math.min(600, VH - 40);
  const px = (VW - panW) / 2, py = (VH - panH) / 2;

  ctx.fillStyle = 'rgba(24,38,24,0.96)';
  roundRect(px, py, panW, panH, 18); ctx.fill();
  ctx.strokeStyle = 'rgba(255,205,90,0.4)'; ctx.lineWidth = 2;
  roundRect(px, py, panW, panH, 18); ctx.stroke();

  ctx.textAlign = 'center';
  ctx.font = '900 30px system-ui, sans-serif'; ctx.fillStyle = '#ffd76a';
  ctx.fillText('THE COLONY — night ' + G.day + ' survived', VW / 2, py + 44);
  ctx.font = '700 16px system-ui, sans-serif'; ctx.fillStyle = '#ffe9a8';
  ctx.fillText('🍯 ' + Math.floor(G.honey) + ' honey in store   ·   hive ' + Math.ceil(G.hiveHP) + '/' + G.hiveMax + '   ·   🐝 ' + G.workers.length, VW / 2, py + 66);

  /* scouting report: what the next night actually holds, so the spend is an
     informed one rather than a guess */
  if (G.day < FINAL_DAY) {
    ctx.font = '700 12.5px system-ui, sans-serif';
    const lead = 'tomorrow night:  ';
    const items = rosterSpec(G.day + 1).map(([k, n]) => ({ t: n + '× ' + WASP[k].name.toLowerCase(), c: WASP[k].col.hi }));
    let wsum = ctx.measureText(lead).width;
    for (const p of items) wsum += ctx.measureText(p.t).width + 16;
    let lx = VW / 2 - wsum / 2;
    ctx.textAlign = 'left';
    ctx.fillStyle = '#9fb69a'; ctx.fillText(lead, lx, py + 90);
    lx += ctx.measureText(lead).width;
    for (const p of items) { ctx.fillStyle = p.c; ctx.fillText(p.t, lx, py + 90); lx += ctx.measureText(p.t).width + 16; }
    ctx.textAlign = 'center';
  }

  // grid — three columns, because the tree is eleven lines deep now
  shopRects = [];
  const cols = panW > 780 ? 3 : 2, gap = 12;
  const cw = (panW - 48 - gap * (cols - 1)) / cols;
  const rows = Math.ceil(SHOP.length / cols);
  const ch = clamp((panH - 172) / rows - gap, 62, 78);
  const gx = px + 24, gy = py + 106;
  ctx.textAlign = 'left';
  for (let i = 0; i < SHOP.length; i++) {
    const it = SHOP[i];
    const lv = G.up[it.k];
    const maxed = lv >= it.max;
    const cost = it.cost(lv);
    const afford = G.honey >= cost && !maxed;
    const x = gx + (i % cols) * (cw + gap);
    const y = gy + Math.floor(i / cols) * (ch + gap);
    shopRects.push({ x, y, w: cw, h: ch });

    const hov = mouse.x >= x && mouse.x <= x + cw && mouse.y >= y && mouse.y <= y + ch;
    ctx.fillStyle = maxed ? 'rgba(60,70,55,0.55)' : afford ? (hov ? 'rgba(96,140,70,0.85)' : 'rgba(60,96,48,0.8)') : 'rgba(50,58,46,0.7)';
    roundRect(x, y, cw, ch, 12); ctx.fill();
    ctx.strokeStyle = afford ? 'rgba(255,220,120,0.55)' : 'rgba(255,255,255,0.12)'; ctx.lineWidth = 1.5;
    roundRect(x, y, cw, ch, 12); ctx.stroke();

    ctx.font = '800 15px system-ui, sans-serif';
    ctx.fillStyle = maxed ? '#9aa694' : '#fff2c4';
    const key = SHOP_KEY_LABEL[i] ? SHOP_KEY_LABEL[i] + '. ' : '';
    ctx.fillText(key + it.name, x + 12, y + 24);

    ctx.font = '600 11.5px system-ui, sans-serif'; ctx.fillStyle = maxed ? '#7f8a7a' : '#d8ecd0';
    ctx.fillText(it.desc, x + 12, y + 42);

    // level pips
    if (it.k !== 'repair') {
      const pw = Math.min(12, (cw - 90) / Math.max(1, it.max));
      for (let l = 0; l < it.max; l++) {
        ctx.fillStyle = l < lv ? '#ffca3a' : 'rgba(255,255,255,0.16)';
        roundRect(x + 12 + l * (pw + 1), y + ch - 20, pw - 2, 7, 3); ctx.fill();
      }
    }

    ctx.textAlign = 'right';
    ctx.font = '800 15px system-ui, sans-serif';
    ctx.fillStyle = maxed ? '#8b968a' : afford ? '#ffe08a' : '#c98d8d';
    ctx.fillText(maxed ? 'MAX' : '🍯 ' + cost, x + cw - 12, y + ch - 12);
    ctx.textAlign = 'left';
  }

  // continue button
  const bw = 300, bh = 46;
  contRect = { x: VW / 2 - bw / 2, y: py + panH - 62, w: bw, h: bh };
  const hov2 = mouse.x >= contRect.x && mouse.x <= contRect.x + bw && mouse.y >= contRect.y && mouse.y <= contRect.y + bh;
  ctx.fillStyle = hov2 ? '#ffd76a' : '#e0a63a';
  roundRect(contRect.x, contRect.y, bw, bh, 12); ctx.fill();
  ctx.textAlign = 'center'; ctx.font = '800 18px system-ui, sans-serif'; ctx.fillStyle = '#2a1d0b';
  ctx.fillText(G.day >= FINAL_DAY ? 'FINISH  (ENTER)' : 'GREET DAY ' + (G.day + 1) + '   (ENTER)', VW / 2, contRect.y + 30);

  if (G.msgT > 0) {
    ctx.globalAlpha = clamp(G.msgT, 0, 1);
    ctx.font = '700 15px system-ui, sans-serif'; ctx.fillStyle = '#ffb3b3';
    ctx.fillText(G.msg, VW / 2, py + panH - 74);
    ctx.globalAlpha = 1;
  }
}

function drawEnd(win) {
  drawWorld();
  ctx.fillStyle = win ? 'rgba(20,40,16,0.86)' : 'rgba(40,10,10,0.86)';
  ctx.fillRect(0, 0, VW, VH);
  ctx.textAlign = 'center';
  ctx.font = '900 ' + Math.min(74, VW * 0.1) + 'px system-ui, sans-serif';
  ctx.fillStyle = win ? '#ffe08a' : '#ff9a8a';
  ctx.fillText(win ? 'THE HIVE OVERWINTERS' : 'THE HIVE FALLS', VW / 2, VH * 0.32);

  ctx.font = '700 18px system-ui, sans-serif'; ctx.fillStyle = '#e7f5df';
  ctx.fillText(win
    ? 'Twelve days, twelve nights. The comb is full and the colony sleeps warm.'
    : 'The comb is broken. The wasps take what is left.', VW / 2, VH * 0.32 + 44);

  const rows = [
    ['days survived',   String(win ? FINAL_DAY : G.day)],
    ['honey stored',    String(Math.floor(G.lifetimeHoney))],
    ['nectar sipped',   String(Math.floor(G.stats.sipped))],
    ['raiders downed',  String(G.stats.waspsDown)],
    ['hornets & worse', String(G.stats.bosses)],
    ['dash-stings',     String(G.stats.stings)],
    ['webs torn',       String(G.stats.webbed)],
    ['sisters healed',  String(Math.floor(G.stats.healed))],
    ['sisters lost',    String(G.stats.workersLost)],
    ['colony alive',    String(G.workers.length)],
  ];
  ctx.font = '600 16px system-ui, sans-serif';
  rows.forEach((r, i) => {
    const y = VH * 0.46 + i * 24;
    ctx.textAlign = 'right'; ctx.fillStyle = '#a9c39f'; ctx.fillText(r[0], VW / 2 - 14, y);
    ctx.textAlign = 'left';  ctx.fillStyle = '#ffe9a8'; ctx.fillText(r[1], VW / 2 + 14, y);
  });

  ctx.textAlign = 'center';
  ctx.globalAlpha = 0.6 + Math.sin(time * 4) * 0.4;
  ctx.font = '800 20px system-ui, sans-serif'; ctx.fillStyle = '#fff3b0';
  ctx.fillText('press ENTER', VW / 2, VH * 0.90);
  ctx.globalAlpha = 1;
}

/* ------------------------------- loop ---------------------------------- */
let last = performance.now();
function frame(now) {
  let dt = (now - last) / 1000;
  last = now;
  dt = Math.min(dt, 0.05);

  update(dt);

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, VW, VH);

  if (state === 'title') { time += 0; drawTitle(); }
  else if (state === 'play') { drawWorld(); drawHUD(); }
  else if (state === 'shop') { drawShop(); }
  else if (state === 'over') { drawEnd(false); }
  else if (state === 'win')  { drawEnd(true); }

  requestAnimationFrame(frame);
}

// title screen needs a clock even before a game exists
(function tick() {
  if (state === 'title') time += 1 / 60;
  setTimeout(tick, 16);
})();

requestAnimationFrame(frame);
</script>
