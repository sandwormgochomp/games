<script>
"use strict";
/* =========================================================================
   NECTAR — forage by day, defend the hive by night.
   Single-file canvas game. No dependencies.
   ========================================================================= */

/* ----------------------------- tiny utils ----------------------------- */
const TAU = Math.PI * 2;
const rand  = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b));
const pick  = arr => arr[(Math.random() * arr.length) | 0];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp  = (a, b, t) => a + (b - a) * t;
const d2    = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; };
const dist  = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
const approach = (v, t, s) => v < t ? Math.min(t, v + s) : Math.max(t, v - s);

/* ----------------------------- canvas setup ---------------------------- */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let VW = 0, VH = 0, DPR = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  VW = window.innerWidth; VH = window.innerHeight;
  cv.width = Math.floor(VW * DPR); cv.height = Math.floor(VH * DPR);
  cv.style.width = VW + 'px'; cv.style.height = VH + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.imageSmoothingEnabled = true;
}
window.addEventListener('resize', resize);
resize();

/* ------------------------------- world -------------------------------- */
const WORLD = { w: 3000, h: 2100 };
const HIVE_R0 = 62;
const HIVE  = { x: WORLD.w / 2, y: WORLD.h / 2, r: HIVE_R0 };

const DAY_LEN   = 62;    // seconds of foraging
const NIGHT_MAX = 95;    // hard cap on a night
const FINAL_DAY = 12;

/* ---- the brood comb -------------------------------------------------------
   The queen can duck inside the comb during the day and lay into empty cells.
   Eggs hatch at the following dawn. Brood Cells buys the cells; laying is what
   fills them, so growing the colony costs both honey and daylight. */
const EGG_LAY_T = 0.55;  // seconds of hovering to seat one
const CELL_R    = 27;    // hex cell radius, in interior units
const INNER     = { w: 760, h: 520 };

/* Four castes. Workers earn, soldiers defend, builders enlarge the comb, and
   nurses keep the other three alive — a bigger comb is a tougher one, so
   builders are the slow compounding play: they cost you a forager now for more
   cells and more hive HP later. Nurses are the same trade against attrition:
   they never earn a drop, but a healed sister is a sister you do not re-lay. */
const CASTE = {
  worker:  { name:'worker',  cost: 65, hp: 22, col:'#ffd54a', desc:'forages nectar' },
  soldier: { name:'soldier', cost: 90, hp: 40, col:'#ff9d5c', desc:'hunts wasps, never forages' },
  builder: { name:'builder', cost: 80, hp: 26, col:'#9fe0ff', desc:'enlarges the comb' },
  nurse:   { name:'nurse',   cost: 75, hp: 24, col:'#b6ffcf', desc:'heals sisters, mends comb' },
};
const CASTE_KEYS = ['worker', 'soldier', 'builder', 'nurse'];

const BUILD_RATE = 1.0;   // progress per builder per second, daylight only
const NEST_HP    = 60;    // hive max HP gained per completed expansion
const NEST_CELLS = 2;     // extra brood cells per expansion
const buildNeed  = tier => 90 + tier * 55;

/* ---- the bestiary ----------------------------------------------------------
   Every raider is one row here, so a night's difficulty is the mix rather than
   a single scaling number. `armor` divides incoming damage, `robs` makes honey
   the goal instead of the comb, `ranged` keeps its distance and spits, and
   `summons` calls escorts. hp/spd take the day so late nights stay dangerous. */
const WASP = {
  wasp: {
    name:'wasp', s:11, r:14, bounty:4,
    hp:d => 28 + d * 7, spd:d => 2.05 + d * 0.055,
    gnaw:6, steal:3.5, swat:6, sting:1,
    col:{ base:'#f2d02a', hi:'#fff08a', lo:'#a88907' }
  },
  robber: {
    name:'robber', s:10, r:12, bounty:8, robs:true,
    hp:d => 20 + d * 4, spd:d => 2.95 + d * 0.06,
    gnaw:1.5, steal:9, swat:4, sting:1,
    col:{ base:'#c9b0ff', hi:'#efe3ff', lo:'#6b4fb0' }
  },
  carapace: {
    name:'carapace', s:15, r:20, bounty:18, armor:0.6,
    hp:d => 70 + d * 12, spd:d => 1.3 + d * 0.03,
    gnaw:8, steal:1.5, swat:10, sting:2,
    col:{ base:'#8fa274', hi:'#ccdeb0', lo:'#3c4a2d' }
  },
  spitter: {
    name:'spitter', s:12, r:14, bounty:11, ranged:true,
    hp:d => 32 + d * 7, spd:d => 1.85 + d * 0.04,
    gnaw:2, steal:2, swat:5, sting:1,
    col:{ base:'#57d69b', hi:'#b8ffdc', lo:'#1d6b47' }
  },
  hornet: {
    name:'HORNET', s:18, r:26, bounty:45, boss:true,
    hp:d => 190 + d * 30, spd:d => 1.55 + d * 0.055,
    gnaw:16, steal:9, swat:11, sting:2,
    col:{ base:'#e07a1c', hi:'#ffb347', lo:'#8f3d06' }
  },
  matriarch: {
    name:'MATRIARCH', s:25, r:34, bounty:130, boss:true, summons:true, armor:0.72,
    hp:d => 340 + d * 32, spd:d => 1.5 + d * 0.04,
    gnaw:20, steal:12, swat:14, sting:2,
    col:{ base:'#d43f7a', hi:'#ff9ec4', lo:'#701a3c' }
  },
};

/* ---- weather ---------------------------------------------------------------
   One condition per day, rolled at dawn and announced before you fly. It is a
   pure multiplier layer — nothing here gates progress, it just changes which
   line of play is strongest today: rain is a foraging day, drought is a honey
   day, high wind is a day to lay eggs and let the sisters work. */
const WEATHER = {
  clear:   { name:'clear skies', icon:'☀', tint:null, blurb:'a plain, generous day' },
  warm:    { name:'warm spell',  icon:'🌡', regen:1.7, sip:1.10, tint:'rgba(255,190,90,0.10)',
             blurb:'the blooms refill as fast as you drain them' },
  rain:    { name:'rain',        icon:'🌧', regen:2.1, speed:0.82, sip:0.88, waspSpd:0.88,
             tint:'rgba(80,120,190,0.16)', blurb:'heavy air, heavy flying — but the meadow drinks' },
  wind:    { name:'high wind',   icon:'🌬', regen:1.0, push:1, tint:'rgba(190,215,230,0.07)',
             blurb:'a steady shove across the meadow — lead your turns' },
  fog:     { name:'fog',         icon:'🌫', regen:1.2, fog:1, tint:'rgba(200,210,205,0.20)',
             blurb:'you cannot see far, and neither can the minimap' },
  drought: { name:'drought',     icon:'🔥', regen:0.45, honey:1.4, tint:'rgba(255,150,60,0.13)',
             blurb:'few blooms, but what you carry home is rich' },
};
const WEATHER_KEYS = ['clear', 'warm', 'rain', 'wind', 'fog', 'drought'];
/* day 1 is always clear — the tutorial day should not also be a puzzle */
function rollWeather(day) { return day <= 1 ? 'clear' : pick(WEATHER_KEYS); }
function WX() { return WEATHER[G.weather] || WEATHER.clear; }
function wx(k, dflt) { const v = WX()[k]; return v === undefined ? (dflt === undefined ? 1 : dflt) : v; }

/* ------------------------------- audio -------------------------------- */
const Audio_ = {
  ac: null, master: null, buzzGain: null, buzzOsc: [], muted: false, ready: false,
  init() {
    if (this.ready) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ac = new AC();
      this.master = this.ac.createGain();
      this.master.gain.value = 0.55;
      this.master.connect(this.ac.destination);
      // continuous wing buzz
      const filt = this.ac.createBiquadFilter();
      filt.type = 'lowpass'; filt.frequency.value = 900;
      this.buzzGain = this.ac.createGain();
      this.buzzGain.gain.value = 0;
      filt.connect(this.buzzGain); this.buzzGain.connect(this.master);
      for (const f of [86, 131, 174]) {
        const o = this.ac.createOscillator();
        o.type = 'sawtooth'; o.frequency.value = f;
        o.detune.value = rand(-14, 14);
        const g = this.ac.createGain(); g.gain.value = 0.34;
        o.connect(g); g.connect(filt); o.start();
        this.buzzOsc.push(o);
      }
      this.ready = true;
    } catch (e) { /* audio optional */ }
  },
  resume() { if (this.ac && this.ac.state === 'suspended') this.ac.resume(); },
  buzz(speed01, alive) {
    if (!this.ready) return;
    const t = this.muted || !alive ? 0 : 0.006 + speed01 * 0.030;
    this.buzzGain.gain.setTargetAtTime(t, this.ac.currentTime, 0.08);
    const f = 86 + speed01 * 46;
    this.buzzOsc[0].frequency.setTargetAtTime(f,       this.ac.currentTime, 0.1);
    this.buzzOsc[1].frequency.setTargetAtTime(f * 1.52, this.ac.currentTime, 0.1);
    this.buzzOsc[2].frequency.setTargetAtTime(f * 2.03, this.ac.currentTime, 0.1);
  },
  blip(freq, dur, type, vol, slideTo) {
    if (!this.ready || this.muted) return;
    const t = this.ac.currentTime;
    const o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.2, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + 0.02);
  },
  noise(dur, vol, freq) {
    if (!this.ready || this.muted) return;
    const t = this.ac.currentTime;
    const n = Math.floor(this.ac.sampleRate * dur);
    const buf = this.ac.createBuffer(1, n, this.ac.sampleRate);
    const dat = buf.getChannelData(0);
    for (let i = 0; i < n; i++) dat[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = this.ac.createBufferSource(); src.buffer = buf;
    const f = this.ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq || 1200; f.Q.value = 1.2;
    const g = this.ac.createGain(); g.gain.value = vol || 0.25;
    src.connect(f); f.connect(g); g.connect(this.master); src.start(t);
  },
  sip()     { this.blip(rand(620, 760), 0.07, 'sine', 0.09, 1100); },
  deposit() { this.blip(440, 0.14, 'triangle', 0.16, 660); setTimeout(() => this.blip(660, 0.18, 'triangle', 0.13, 880), 70); },
  sting()   { this.noise(0.12, 0.28, 2400); this.blip(180, 0.1, 'square', 0.1, 60); },
  hurt()    { this.blip(200, 0.26, 'sawtooth', 0.22, 70); },
  kill()    { this.noise(0.2, 0.3, 700); },
  buy()     { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => this.blip(f, 0.16, 'triangle', 0.15), i * 65)); },
  night()   { this.blip(70, 1.6, 'sawtooth', 0.13, 46); },
  dawn()    { [392, 523, 659].forEach((f, i) => setTimeout(() => this.blip(f, 0.5, 'sine', 0.13), i * 130)); },
  bad()     { this.blip(120, 0.5, 'square', 0.2, 55); }
};

/* ------------------------------ shop data ------------------------------ */
/* Level caps are deliberately deeper than the honey curve can fully buy.
   Income here is endogenous — jelly, sac, sense and brood all raise earnings,
   so pricing upgrades UP collapses the loop instead of stretching it (a flat
   2x on costs measured out at half the win rate and LESS honey earned).
   Adding runway is what works: at these caps a run affords ~112% of the tree
   spread across all 12 days, instead of 358% of it by day 8. */
const SHOP = [
  { k:'wing',  name:'Wing Power',      desc:'+16% thrust and top speed',        max:8, cost:l => Math.round(45 * Math.pow(1.55, l)) },
  { k:'sac',   name:'Honey Sac',       desc:'+22 nectar capacity',              max:8, cost:l => Math.round(50 * Math.pow(1.52, l)) },
  { k:'sense', name:'Pollen Sense',    desc:'+35% sip speed, rich blooms glow', max:7, cost:l => Math.round(45 * Math.pow(1.5, l)) },
  { k:'jelly', name:'Royal Jelly',     desc:'+30% honey per nectar',            max:7, cost:l => Math.round(70 * Math.pow(1.6, l)) },
  { k:'brood', name:'Brood Cells',     desc:'+2 brood cells — sisters regrow at dawn', max:8, cost:l => Math.round(65 * Math.pow(1.55, l)) },
  { k:'sting', name:'Sharpened Sting', desc:'+40% dash damage',                 max:8, cost:l => Math.round(55 * Math.pow(1.55, l)) },
  { k:'armor', name:'Comb Armor',      desc:'+45 hive HP, full repair',         max:8, cost:l => Math.round(60 * Math.pow(1.5, l)) },
  /* The three colony lines below are pure runway: they buy the sisters' work
     rather than the queen's, so they soak honey late without touching income

  { k:'alarm',  name:'Alarm Pheromone', desc:'sisters hit +20% harder, fly +10% faster', max:6, cost:l => Math.round(60 * Math.pow(1.55, l)) },
  { k:'waggle', name:'Waggle Dance',    desc:'sisters carry +5 and forage faster',       max:6, cost:l => Math.round(52 * Math.pow(1.5, l)) },
  { k:'propolis',name:'Propolis Seal',  desc:'comb mends 1.5 HP/s in daylight',          max:6, cost:l => Math.round(58 * Math.pow(1.52, l)) },
  { k:'repair',name:'Wax Repair',      desc:'Patch 60 hive HP right now',       max:99, cost:() => 28 },
];

/* ------------------------------ game state ----------------------------- */
let G = null;
let state = 'title';   // title | play | shop | over | win
let paused = false;
let time = 0;          // global animation clock
let shake = 0;
const cam = { x: HIVE.x, y: HIVE.y };

function newGame() {
  G = {
    day: 1,
    phase: 'day',            // day | night
    phaseT: DAY_LEN,
    honey: 0,
    lifetimeHoney: 0,
    hiveHP: 140, hiveMax: 140,
    weather: 'clear', wind: { x: 0, y: 0 },
    up: { wing:0, sac:0, sense:0, jelly:0, brood:0, sting:0, armor:0,
          alarm:0, waggle:0, propolis:0, repair:0 },
    flowers: [], workers: [], wasps: [], shots: [], webs: [],
    parts: [], floats: [], motes: [],
    spawnQueue: [], spawnT: 0,
    inHive: false, cells: [], innerFx: [], caste: 'worker',
    nest: { tier: 0, prog: 0 },
    inner: { x: 0, y: 150, vx: 0, vy: 0, ang: -Math.PI / 2, flap: 0,
             layT: 0, layCell: null, nearCell: null },
    stats: { sipped:0, stings:0, waspsDown:0, workersLost:0, eggs:0, hatched:0, nests:0,
             healed:0, webbed:0, bosses:0 },
    bee: {
      x: HIVE.x, y: HIVE.y + 90, vx: 0, vy: 0, ang: -Math.PI / 2,
      nectar: 0, hp: 5, hpMax: 5, stam: 100,
      dashT: 0, iFrame: 0, stun: 0, down: 0, sipping: null, flap: 0
    },
    msg: '', msgT: 0,
    hintT: 14
  };
  HIVE.r = HIVE_R0;              // builders grow this; a new run starts small
  G.weather = rollWeather(1);
  setWind();
  buildMeadow();
  rebuildCells();
  for (let i = 0; i < 3; i++) spawnBee('worker');
  for (let i = 0; i < 90; i++) G.motes.push(newMote());
  cam.x = G.bee.x; cam.y = G.bee.y;
}

/* ------------------------------- meadow -------------------------------- */
/* `night:true` inverts the day/night regen split — a moonflower is dead weight
   in daylight and the richest thing in the meadow while the wasps are out, so
   there is finally a reason to be away from the comb after dark. */
const FLOWER_KINDS = [
  { id:'clover',   petals:6, r:11, cap:18, regen:2.6, col:'#f0a8d8', col2:'#ffd6f0', mid:'#fff2b0' },
  { id:'poppy',    petals:5, r:15, cap:30, regen:2.0, col:'#f2543d', col2:'#ff8a6b', mid:'#3a2018' },
  { id:'corn',     petals:7, r:13, cap:24, regen:2.3, col:'#6aa6ff', col2:'#a8caff', mid:'#f7e07a' },
  { id:'lavender', petals:5, r:10, cap:16, regen:3.2, col:'#a97ce8', col2:'#cfb2ff', mid:'#ffe9a8' },
  { id:'sun',      petals:14,r:22, cap:60, regen:1.2, col:'#ffc21f', col2:'#ffe27a', mid:'#7a4a17' },
  { id:'thistle',  petals:9, r:14, cap:44, regen:1.1, col:'#9b6fd4', col2:'#c9a6ff', mid:'#5a3a86', spiky:true },
  { id:'borage',   petals:5, r:9,  cap:13, regen:4.1, col:'#3f7fe0', col2:'#8fc0ff', mid:'#1a2a5a' },
  { id:'foxglove', petals:6, r:16, cap:38, regen:1.7, col:'#e0518f', col2:'#ffa6cd', mid:'#4a1030' },
  { id:'moon',     petals:8, r:18, cap:52, regen:3.4, col:'#cfe4ff', col2:'#f2f8ff', mid:'#7f9ecf', night:true },
];

function newFlower(x, y, kind) {
  const k = kind || pick(FLOWER_KINDS);
  const golden = Math.random() < 0.035;
  return {
    x, y, k,
    r: k.r * rand(0.85, 1.15),
    cap: k.cap * (golden ? 3.2 : 1) * rand(0.85, 1.15),
    nectar: 0, golden,
    phase: rand(0, TAU), sway: rand(0.7, 1.5),
    bounce: 0
  };
}

function buildMeadow() {
  const F = G.flowers;
  const clusters = 34;
  for (let c = 0; c < clusters; c++) {
    let cx, cy, tries = 0;
    do {
      cx = rand(90, WORLD.w - 90); cy = rand(90, WORLD.h - 90); tries++;
    } while (d2(cx, cy, HIVE.x, HIVE.y) < 240 * 240 && tries < 40);
    const kind = pick(FLOWER_KINDS);
    const n = randi(3, 9);
    for (let i = 0; i < n; i++) {
      const a = rand(0, TAU), rr = rand(0, 105);
      const x = clamp(cx + Math.cos(a) * rr, 50, WORLD.w - 50);
      const y = clamp(cy + Math.sin(a) * rr, 50, WORLD.h - 50);
      if (d2(x, y, HIVE.x, HIVE.y) < 170 * 170) continue;
      F.push(newFlower(x, y, kind));
    }
  }
  // start the meadow partly in bloom — but moonflowers open after dusk, not before
  for (const f of F) f.nectar = f.k.night ? 0 : f.cap * rand(0.45, 1);

  /* ---- spider silk ---------------------------------------------------------
     Static, visible, and never lethal: a web bleeds your speed and your stamina
     while you sit in it, which at dusk is the same thing as bleeding honey. A
     dash tears through and destroys the web, so the hazard is also a use for
     stamina during the day, when nothing else wants it. */
  G.webs = [];
  for (let i = 0; i < 15; i++) {
    let x, y, tries = 0;
    do {
      x = rand(140, WORLD.w - 140); y = rand(140, WORLD.h - 140); tries++;
    } while (d2(x, y, HIVE.x, HIVE.y) < 420 * 420 && tries < 40);
    G.webs.push({ x, y, r: rand(52, 88), phase: rand(0, TAU), torn: 0 });
  }
  // scattered decorative rocks & tufts (drawn only)
  G.decor = [];
  for (let i = 0; i < 130; i++) {
    G.decor.push({
      x: rand(0, WORLD.w), y: rand(0, WORLD.h),
      r: rand(4, 16), t: Math.random() < 0.35 ? 'rock' : 'tuft',
      h: rand(0.6, 1.4), c: randi(0, 3)
    });
  }
}

/* one wind vector per day; only 'wind' days actually push anything */
function setWind() {
  const a = rand(0, TAU), s = wx('push', 0) ? rand(0.9, 1.35) : 0;
  G.wind = { x: Math.cos(a) * s, y: Math.sin(a) * s };
}

function newMote() {
  return { x: rand(0, WORLD.w), y: rand(0, WORLD.h), vx: rand(-8, 8), vy: rand(-12, -3), s: rand(1, 2.6), a: rand(0.15, 0.5), p: rand(0, TAU) };
}

/* ------------------------------ entities ------------------------------- */
function spawnBee(caste) {
  const c = CASTE[caste] || CASTE.worker;
  const a = rand(0, TAU);
  G.workers.push({
    x: HIVE.x + Math.cos(a) * (HIVE.r - 2), y: HIVE.y + Math.sin(a) * (HIVE.r - 2),
    vx: 0, vy: 0, ang: a, caste: c.name, hp: c.hp, hpMax: c.hp,
    load: 0, cap: S.workerCap(), mode: 'seek', target: null, foe: null, atk: 0, care: 0,
    phase: rand(0, TAU), wob: rand(0.8, 1.4), hit: 0
  });
}

/* total cells in the comb: bought with Brood Cells, plus whatever the
   builders have added by enlarging the nest */
function broodCap() { return 3 + 2 * G.up.brood + NEST_CELLS * G.nest.tier; }
function liveBrood() { return G.workers.length + G.cells.filter(c => c.egg).length; }
function casteCount(k) { return G.workers.filter(w => w.caste === k).length; }

/* hex spiral so the comb grows outward in rings, like real comb does */
function hexSpiral(n, size) {
  const out = [{ q: 0, r: 0 }];
  const dir = [[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];
  for (let ring = 1; out.length < n; ring++) {
    let q = -ring, r = ring;                       // start on the SW spoke
    for (let i = 0; i < 6 && out.length < n; i++)
      for (let j = 0; j < ring && out.length < n; j++) {
        out.push({ q, r });
        q += dir[i][0]; r += dir[i][1];
      }
  }
  return out.slice(0, n).map(h => ({
    x: size * Math.sqrt(3) * (h.q + h.r / 2),
    y: size * 1.5 * h.r
  }));
}

/* rebuild the cell layout, preserving whatever is already sitting in a cell */
function rebuildCells() {
  const pts = hexSpiral(broodCap(), CELL_R * 1.16);
  const old = G.cells || [];
  G.cells = pts.map((p, i) => ({
    x: p.x, y: p.y,
    egg:   old[i] ? old[i].egg   : false,
    caste: old[i] ? old[i].caste : 'worker',
    pulse: old[i] ? old[i].pulse : 0,
    born:  old[i] ? old[i].born  : 0
  }));
}

/* builders finishing an expansion: more cells, more comb, more hive to chew */
function growNest() {
  G.nest.tier++; G.nest.prog = 0; G.stats.nests++;
  G.hiveMax += NEST_HP; G.hiveHP += NEST_HP;
  HIVE.r = HIVE_R0 + G.nest.tier * 6;
  rebuildCells();
  say('the comb is enlarged — +' + NEST_HP + ' hive, +' + NEST_CELLS + ' cells', 3.4);
  Audio_.buy(); shake = Math.max(shake, 10);
  for (let i = 0; i < 26; i++)
    part(HIVE.x + rand(-HIVE.r, HIVE.r), HIVE.y + rand(-HIVE.r, HIVE.r),
         '#9fe0ff', { vy: -rand(20, 90), life: 0.9, s: rand(2, 4), glow: true });
}

function spawnWasp(kind, atX, atY) {
  const K = WASP[kind] || WASP.wasp;
  const d = G.day;
  let x, y;
  if (atX !== undefined) { x = atX; y = atY; }
  else {
    const edge = randi(0, 4);
    if (edge === 0) { x = rand(0, WORLD.w); y = -40; }
    else if (edge === 1) { x = WORLD.w + 40; y = rand(0, WORLD.h); }
    else if (edge === 2) { x = rand(0, WORLD.w); y = WORLD.h + 40; }
    else { x = -40; y = rand(0, WORLD.h); }
  }
  const hp = K.hp(d);
  G.wasps.push({
    x, y, vx: 0, vy: 0, ang: 0,
    kind, K, boss: !!K.boss,
    hp, hpMax: hp,
    spd: K.spd(d) * wx('waspSpd'),
    r: K.r,
    atk: 0, shootT: rand(0.6, 1.8), summonT: 6,
    mode: 'raid', target: null, hit: 0, loot: 0,
    phase: rand(0, TAU), wob: rand(0.7, 1.3), flee: 0
  });
  return G.wasps[G.wasps.length - 1];
}

/* The night's roster, as counts. Pure — no RNG — so the shop can show tomorrow
   night's scouting report without burning the seed or flickering. Plain wasps
   are the bulk; the specialists arrive on a schedule, each getting a night of
   its own before it joins the mix. */
function rosterSpec(d) {
  /* The specialists REPLACE plain wasps rather than adding to them, so the
     body count per night is unchanged from a raid of pure wasps — a night gets
     harder because of what shows up, not how much. Measured: adding them on
     top instead cost a balanced build four days of survival. */
  const base = 4 + Math.round(d * 2.1);
  const rob = Math.floor(d / 3);              // from night 3
  const spt = Math.max(0, Math.floor((d - 3) / 3));  // from night 6
  const car = Math.max(0, Math.floor((d - 3) / 4));  // from night 7
  const spec = [['wasp', Math.max(2, base - rob - spt - car)]];
  if (rob) spec.push(['robber', rob]);
  if (spt) spec.push(['spitter', spt]);
  if (car) spec.push(['carapace', car]);
  if (d % 4 === 0)    spec.push(['hornet', 1]);
  if (d >= FINAL_DAY) spec.push(['matriarch', 1]);
  return spec;
}

function nightRoster(d) {
  const q = [];
  for (const [k, n] of rosterSpec(d)) {
    if (k === 'hornet' || k === 'matriarch') continue;   // bosses are placed after the shuffle
    for (let i = 0; i < n; i++) q.push(k);
  }
  // shuffle so the specialists are not all bunched at the tail of the queue
  for (let i = q.length - 1; i > 0; i--) { const j = randi(0, i + 1); const t = q[i]; q[i] = q[j]; q[j] = t; }
  if (d % 4 === 0) q.splice(randi(1, Math.max(2, q.length - 1)), 0, 'hornet');
  if (d >= FINAL_DAY) q.splice(randi(1, Math.max(2, Math.floor(q.length / 2))), 0, 'matriarch');
  return q;
}

/* a spitter's venom glob. Slow, visible, and dodgeable — the point is to make
   standing still near the comb at night cost something. */
function spawnShot(from, tx, ty) {
  const a = Math.atan2(ty - from.y, tx - from.x);
  const sp = 185;
  G.shots.push({
    x: from.x, y: from.y,
    vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
    life: 3.2, t: 0, r: 6, dmg: 1
  });
  Audio_.blip(340, 0.12, 'sawtooth', 0.09, 150);
}

function part(x, y, col, opt) {
  opt = opt || {};
  G.parts.push({
    x, y,
    vx: opt.vx !== undefined ? opt.vx : rand(-60, 60),
    vy: opt.vy !== undefined ? opt.vy : rand(-60, 60),
    life: opt.life || rand(0.35, 0.8), t: 0,
    s: opt.s || rand(1.5, 4), col, grav: opt.grav || 0,
    glow: opt.glow || false
  });
}
function burst(x, y, n, col, spd, opt) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), v = rand(spd * 0.3, spd);
    part(x, y, col, Object.assign({ vx: Math.cos(a) * v, vy: Math.sin(a) * v }, opt || {}));
  }
}
function floatText(x, y, text, col) {
  G.floats.push({ x, y, text, col, t: 0, life: 1.1 });
}
function say(m, t) { G.msg = m; G.msgT = t || 3; }

/* ------------------------------- input --------------------------------- */
const keys = {};
let mouse = { x: 0, y: 0, down: false };

window.addEventListener('keydown', e => {
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
  if (!keys[e.code]) onPress(e.code);
  keys[e.code] = true;
  Audio_.init(); Audio_.resume();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
cv.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
cv.addEventListener('mousedown', e => { mouse.down = true; Audio_.init(); Audio_.resume(); onClick(e.clientX, e.clientY); });
cv.addEventListener('mouseup', () => { mouse.down = false; });

function onPress(code) {
  if (code === 'KeyM') { Audio_.muted = !Audio_.muted; say(Audio_.muted ? 'sound off' : 'sound on', 1.4); return; }
  if (state === 'title') {
    if (code === 'Enter' || code === 'Space') { newGame(); state = 'play'; Audio_.dawn(); }
    return;
  }
  if (state === 'over' || state === 'win') {
    if (code === 'Enter' || code === 'Space') { state = 'title'; }
    return;
  }
  if (state === 'shop') {
    const n = SHOP_KEYS.indexOf(code);
    if (n >= 0 && n < SHOP.length) tryBuy(n);
    if (code === 'Enter' || code === 'Space') leaveShop();
    return;
  }
  if (state === 'play') {
    if (code === 'KeyP' || code === 'Escape') paused = !paused;
    if (code === 'KeyE') toggleHive();
    if (G.inHive) {
      const n = ['Digit1','Digit2','Digit3','Digit4'].indexOf(code);
      if (n >= 0) {
        G.caste = CASTE_KEYS[n];
        Audio_.blip(560 + n * 90, 0.07, 'triangle', 0.1);
      }
    }
  }
}

function onClick(mx, my) {
  if (state === 'title') { newGame(); state = 'play'; Audio_.dawn(); return; }
  if (state === 'over' || state === 'win') { state = 'title'; return; }
  if (state === 'shop') {
    for (let i = 0; i < shopRects.length; i++) {
      const r = shopRects[i];
      if (mx >= r.x && mx <= r.x + r.w && my >= r.y && my <= r.y + r.h) { tryBuy(i); return; }
    }
    if (contRect && mx >= contRect.x && mx <= contRect.x + contRect.w && my >= contRect.y && my <= contRect.y + contRect.h) leaveShop();
  }
}

/* ------------------------------- shop ---------------------------------- */
let shopRects = [], contRect = null;
/* the shop grew past ten rows, so hotkeys run 1-9, then 0, then Q for the
   eleventh — everything past that is mouse-only, and labelled as such */
const SHOP_KEYS = ['Digit1','Digit2','Digit3','Digit4','Digit5','Digit6','Digit7','Digit8','Digit9','Digit0','KeyQ'];
const SHOP_KEY_LABEL = ['1','2','3','4','5','6','7','8','9','0','Q'];

function tryBuy(i) {
  const it = SHOP[i]; if (!it) return;
  const lv = G.up[it.k];
  if (lv >= it.max) { Audio_.bad(); return; }
  const c = it.cost(lv);
  if (G.honey < c) { Audio_.bad(); say('not enough honey', 1.2); return; }
  if (it.k === 'repair' && G.hiveHP >= G.hiveMax) { Audio_.bad(); say('hive is already whole', 1.2); return; }
  G.honey -= c; G.up[it.k]++;
  // Brood Cells buys empty comb, not bees — the queen fills it herself
  if (it.k === 'brood') { rebuildCells(); say('+2 empty cells — lay into them by day', 2.2); }
  if (it.k === 'armor') { G.hiveMax += 45; G.hiveHP = G.hiveMax; }
  if (it.k === 'repair') { G.hiveHP = Math.min(G.hiveMax, G.hiveHP + 60); }
  if (it.k === 'sac' || it.k === 'wing') { /* stat driven */ }
  Audio_.buy();
}

function leaveShop() {
  G.day++;
  if (G.day > FINAL_DAY) { state = 'win'; return; }
  G.phase = 'day'; G.phaseT = DAY_LEN;
  G.bee.hp = G.bee.hpMax; G.bee.nectar = 0;
  G.bee.x = HIVE.x; G.bee.y = HIVE.y + 90; G.bee.vx = G.bee.vy = 0;
  G.shots.length = 0;
  G.weather = rollWeather(G.day);
  setWind();
  /* dawn: everything laid yesterday hatches */
  let hatched = 0;
  for (const c of G.cells) {
    if (!c.egg) continue;
    spawnBee(c.caste); c.egg = false; c.pulse = 1; hatched++;
    G.stats.hatched++;
  }
  /* A skeleton crew always survives, so losing every sister is a bad night
     rather than an unrecoverable one — you can still forage enough to lay. */
  let raised = 0;
  while (G.workers.length < Math.min(3, broodCap())) { spawnBee('worker'); raised++; }

  state = 'play'; Audio_.dawn();
  const W = WX();
  const news = hatched > 0
    ? hatched + (hatched === 1 ? ' egg hatches' : ' eggs hatch')
    : (raised > 0 ? 'the comb raises a skeleton crew' : 'forage, and lay before dusk');
  say('Day ' + G.day + ' — ' + news, 3);
  // the forecast lands a beat later, so it is read rather than skimmed past
  setTimeout(() => { if (state === 'play') say(W.icon + '  ' + W.name + ' — ' + W.blurb, 3.6); }, 2600);
}

/* --------------------------- derived stats ----------------------------- */
const S = {
  maxSpd:  () => 3.5 * (1 + 0.16 * G.up.wing) * wx('speed'),
  thrust:  () => 0.40 * (1 + 0.16 * G.up.wing) * wx('speed'),
  cap:     () => 42 + 22 * G.up.sac,
  sip:     () => 24 * (1 + 0.35 * G.up.sense) * wx('sip'),
  honeyMul:() => (1 + 0.30 * G.up.jelly) * wx('honey'),
  dashDmg: () => 26 * (1 + 0.40 * G.up.sting),
  senseR:  () => 260 + 90 * G.up.sense,
  /* the colony lines — bought once, paid out by every sister every night */
  workerCap:  () => 12 + 5 * G.up.waggle,
  workerGath: () => 9 * (1 + 0.22 * G.up.waggle),
  workerDmg:  () => 1 + 0.20 * G.up.alarm,
  workerSpd:  () => 1 + 0.10 * G.up.alarm,
  mend:       () => 1.5 * G.up.propolis
};

/* ------------------------------ update --------------------------------- */
function update(dt) {
  time += dt;
  shake = Math.max(0, shake - dt * 34);
  if (state !== 'play' || paused) { Audio_.buzz(0, false); return; }

  const b = G.bee;
  if (G.msgT > 0) G.msgT -= dt;
  if (G.hintT > 0) G.hintT -= dt;

  /* ---- phase clock ---- */
  if (G.phase === 'day') {
    G.phaseT -= dt;
    if (G.phaseT <= 0) startNight();
  } else {
    G.phaseT += dt;
    // spawn queued wasps
    G.spawnT -= dt;
    if (G.spawnQueue.length && G.spawnT <= 0) {
      spawnWasp(G.spawnQueue.shift());
      G.spawnT = rand(0.7, 1.9);
    }
    if (G.phaseT > NIGHT_MAX) { for (const w of G.wasps) w.flee = 1; G.spawnQueue.length = 0; }
    if (!G.spawnQueue.length && G.wasps.length === 0) endNight();
  }

  /* ---- player ---- */
  // the colony keeps working while the queen is inside, so time spent laying
  // is time not spent foraging — that is the whole cost of the mechanic
  if (G.inHive) { if (G.phase !== 'day') toggleHive(); else updateInner(dt); }
  else updateBee(b, dt);

  /* ---- flowers ---- */
  const day = G.phase === 'day';
  const wxRegen = wx('regen');
  for (const f of G.flowers) {
    // moonflowers run the clock backwards: shut by day, pouring after dusk
    const phaseMul = f.k.night ? (day ? 0.05 : 1.25) : (day ? 1 : 0.35);
    if (f.nectar < f.cap) f.nectar = Math.min(f.cap, f.nectar + f.k.regen * phaseMul * wxRegen * dt);
    f.bounce = Math.max(0, f.bounce - dt * 3);
  }

  /* ---- propolis: the comb knits itself back together in daylight ---- */
  if (day && G.up.propolis > 0 && G.hiveHP < G.hiveMax)
    G.hiveHP = Math.min(G.hiveMax, G.hiveHP + S.mend() * dt);

  /* ---- torn webs fade out; the rest just shimmer ---- */
  for (let i = G.webs.length - 1; i >= 0; i--) {
    const s = G.webs[i];
    if (s.torn > 0) { s.torn += dt; if (s.torn > 0.7) G.webs.splice(i, 1); }
  }

  /* ---- venom globs ---- */
  for (let i = G.shots.length - 1; i >= 0; i--) {
    const s = G.shots[i];
    s.t += dt;
    s.x += s.vx * dt; s.y += s.vy * dt;
    let gone = s.t >= s.life || s.x < -60 || s.x > WORLD.w + 60 || s.y < -60 || s.y > WORLD.h + 60;
    if (!gone && !G.inHive && G.bee.down <= 0 && d2(s.x, s.y, G.bee.x, G.bee.y) < 20 * 20) {
      hurtBee(s.dmg, s.x, s.y); gone = true;
    }
    if (!gone) {
      for (const k of G.workers) {
        if (d2(s.x, s.y, k.x, k.y) < 14 * 14) {
          k.hp -= 7; k.hit = 0.18; burst(s.x, s.y, 5, '#8ef2c0', 120); gone = true; break;
        }
      }
    }
    if (!gone && d2(s.x, s.y, HIVE.x, HIVE.y) < (HIVE.r + 6) * (HIVE.r + 6)) {
      G.hiveHP = Math.max(0, G.hiveHP - 3);
      burst(s.x, s.y, 7, '#8ef2c0', 140); shake = Math.max(shake, 4); gone = true;
    }
    if (gone) { if (s.t < s.life) burst(s.x, s.y, 4, '#57d69b', 90); G.shots.splice(i, 1); }
    else if (Math.random() < dt * 20)
      part(s.x, s.y, '#8ef2c0', { vx: rand(-14, 14), vy: rand(-14, 14), life: 0.28, s: 2, glow: true });
  }

  /* ---- workers ---- */
  for (let i = G.workers.length - 1; i >= 0; i--) {
    const w = G.workers[i];
    updateWorker(w, dt);
    if (w.hp <= 0) {
      burst(w.x, w.y, 12, '#ffd54a', 130);
      G.workers.splice(i, 1); G.stats.workersLost++;
      Audio_.kill(); floatText(w.x, w.y, 'lost a sister', '#ffb3b3');
    }
  }

  /* ---- wasps ---- */
  for (let i = G.wasps.length - 1; i >= 0; i--) {
    const w = G.wasps[i];
    updateWasp(w, dt);
    if (w.hp <= 0 || (w.flee && (w.x < -80 || w.x > WORLD.w + 80 || w.y < -80 || w.y > WORLD.h + 80))) {
      if (w.hp <= 0) {
        burst(w.x, w.y, w.boss ? 40 : 16, w.K.col.base, w.boss ? 260 : 160);
        burst(w.x, w.y, 8, '#6b4a12', 120);
        G.stats.waspsDown++;
        if (w.boss) G.stats.bosses++;
        // bounty, plus back everything this one had already carried off
        const recovered = Math.round(w.loot);
        const gain = w.K.bounty + recovered;
        G.honey += gain; G.lifetimeHoney += gain;
        floatText(w.x, w.y, '+' + gain + (recovered > 0 ? ' recovered' : ''), '#ffd76a');
        Audio_.kill(); shake = Math.max(shake, w.boss ? 16 : 6);
      }
      G.wasps.splice(i, 1);
    }
  }

  /* ---- particles / floats / motes ---- */
  for (let i = G.parts.length - 1; i >= 0; i--) {
    const p = G.parts[i];
    p.t += dt;
    if (p.t >= p.life) { G.parts.splice(i, 1); continue; }
    p.vy += p.grav * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= 0.97; p.vy *= 0.97;
  }
  for (let i = G.floats.length - 1; i >= 0; i--) {
    const f = G.floats[i]; f.t += dt; f.y -= 26 * dt;
    if (f.t >= f.life) G.floats.splice(i, 1);
  }
  for (const m of G.motes) {
    m.p += dt;
    m.x += (m.vx + Math.sin(m.p * 1.3) * 6) * dt; m.y += m.vy * dt;
    if (m.y < -20) { m.y = WORLD.h + 20; m.x = rand(0, WORLD.w); }
    if (m.x < -20) m.x = WORLD.w + 20; if (m.x > WORLD.w + 20) m.x = -20;
  }

  /* ---- camera ---- */
  const tx = clamp(b.x, VW / 2, WORLD.w - VW / 2);
  const ty = clamp(b.y, VH / 2, WORLD.h - VH / 2);
  cam.x = lerp(cam.x, VW >= WORLD.w ? WORLD.w / 2 : tx, 1 - Math.pow(0.001, dt));
  cam.y = lerp(cam.y, VH >= WORLD.h ? WORLD.h / 2 : ty, 1 - Math.pow(0.001, dt));

  /* ---- hive integrity ---- */
  if (G.hiveHP <= 0) {
    state = 'over'; Audio_.bad();
  }

  /* ---- audio ---- */
  const sp = Math.hypot(b.vx, b.vy) / S.maxSpd();
  Audio_.buzz(clamp(sp, 0, 1.4), b.down <= 0);
}

function startNight() {
  G.phase = 'night'; G.phaseT = 0;
  const d = G.day;
  G.spawnQueue = nightRoster(d);
  G.spawnT = 1.2;
  Audio_.night();
  const headline = d >= FINAL_DAY ? 'NIGHT ' + d + ' — the MATRIARCH comes herself'
                 : d % 4 === 0    ? 'NIGHT ' + d + ' — a HORNET leads the raid'
                 : 'NIGHT ' + d + ' — wasps are coming';
  say(headline, 4);
}

function endNight() {
  if (G.day >= FINAL_DAY) { state = 'win'; Audio_.dawn(); return; }
  state = 'shop';
  Audio_.dawn();
}

/* --------------------------- player update ----------------------------- */
function updateBee(b, dt) {
  b.flap += dt;

  if (b.down > 0) {
    b.down -= dt;
    b.x = lerp(b.x, HIVE.x, 1 - Math.pow(0.02, dt));
    b.y = lerp(b.y, HIVE.y + 70, 1 - Math.pow(0.02, dt));
    b.vx = b.vy = 0;
    if (b.down <= 0) { b.hp = Math.max(2, Math.ceil(b.hpMax * 0.5)); b.iFrame = 2; floatText(b.x, b.y - 30, 'revived', '#9df'); }
    return;
  }

  b.iFrame = Math.max(0, b.iFrame - dt);
  b.stun = Math.max(0, b.stun - dt);
  b.dashT = Math.max(0, b.dashT - dt);
  b.stam = clamp(b.stam + 34 * dt, 0, 100);

  let ix = 0, iy = 0;
  if (!b.stun) {
    if (keys.KeyA || keys.ArrowLeft)  ix -= 1;
    if (keys.KeyD || keys.ArrowRight) ix += 1;
    if (keys.KeyW || keys.ArrowUp)    iy -= 1;
    if (keys.KeyS || keys.ArrowDown)  iy += 1;
  }
  const il = Math.hypot(ix, iy);
  if (il > 0) { ix /= il; iy /= il; b.ang = Math.atan2(iy, ix); }

  // dash
  if ((keys.Space || keys.ShiftLeft) && !b.stun && b.dashT <= 0 && b.stam >= 26) {
    b.stam -= 26; b.dashT = 0.30;
    const a = il > 0 ? Math.atan2(iy, ix) : b.ang;
    b.vx += Math.cos(a) * 9.5; b.vy += Math.sin(a) * 9.5;
    b.ang = a;
    G.stats.stings++;
    Audio_.sting();
    for (let i = 0; i < 10; i++)
      part(b.x, b.y, '#fff3c4', { vx: -Math.cos(a) * rand(40, 140) + rand(-30, 30), vy: -Math.sin(a) * rand(40, 140) + rand(-30, 30), life: rand(0.2, 0.45), s: rand(1.5, 3.4) });
  }

  const th = S.thrust() * (b.dashT > 0 ? 0.4 : 1);
  b.vx += ix * th * 60 * dt; b.vy += iy * th * 60 * dt;
  const drag = Math.pow(b.dashT > 0 ? 0.24 : 0.06, dt);
  b.vx *= drag; b.vy *= drag;

  // high wind pushes after drag, so it is a bias you fly against, not a boost
  if (G.wind.x || G.wind.y) { b.vx += G.wind.x * dt * 1.6; b.vy += G.wind.y * dt * 1.6; }

  /* ---- spider silk ---- */
  b.webbed = 0;
  for (const s of G.webs) {
    if (s.torn > 0) continue;
    if (d2(b.x, b.y, s.x, s.y) > s.r * s.r) continue;
    if (b.dashT > 0) {
      // dashing tears the web open — it is gone for the rest of the run
      s.torn = 0.001; G.stats.webbed++;
      burst(s.x, s.y, 22, '#eaf6ff', 190, { life: 0.6 });
      Audio_.noise(0.18, 0.2, 2600);
      floatText(s.x, s.y - 20, 'torn through', '#eaf6ff');
      continue;
    }
    b.webbed = 1;
    const cling = Math.pow(0.16, dt);
    b.vx *= cling; b.vy *= cling;
    b.stam = clamp(b.stam - 16 * dt, 0, 100);
    if (Math.random() < dt * 8)
      part(b.x + rand(-8, 8), b.y + rand(-8, 8), '#dbe8f0', { vx: rand(-10, 10), vy: rand(-10, 10), life: 0.4, s: 1.6 });
  }
  if (b.webbed && !b._webWarn) { b._webWarn = 1; say('caught in silk — SPACE to tear free', 1.8); }
  if (!b.webbed) b._webWarn = 0;

  const spd = Math.hypot(b.vx, b.vy), mx = S.maxSpd() * (b.dashT > 0 ? 3.1 : 1);
  if (spd > mx) { b.vx = b.vx / spd * mx; b.vy = b.vy / spd * mx; }

  b.x = clamp(b.x + b.vx * 60 * dt, 16, WORLD.w - 16);
  b.y = clamp(b.y + b.vy * 60 * dt, 16, WORLD.h - 16);

  // dash trail
  if (b.dashT > 0 && Math.random() < 0.8)
    part(b.x + rand(-6, 6), b.y + rand(-6, 6), '#ffe9a0', { vx: rand(-20, 20), vy: rand(-20, 20), life: 0.3, s: rand(2, 4), glow: true });

  // ---- sipping nectar ----
  b.sipping = null;
  if (b.nectar < S.cap() && b.dashT <= 0 && !b.stun) {
    let best = null, bd = 1e9;
    for (const f of G.flowers) {
      if (f.nectar <= 0.4) continue;
      const dd = d2(b.x, b.y, f.x, f.y);
      if (dd < (f.r + 20) * (f.r + 20) && dd < bd) { bd = dd; best = f; }
    }
    if (best) {
      const slowBonus = spd < 1.2 ? 1.55 : 1;
      let amt = S.sip() * slowBonus * dt;
      amt = Math.min(amt, best.nectar, S.cap() - b.nectar);
      best.nectar -= amt; b.nectar += amt; b.sipping = best;
      best.bounce = 1;
      G.stats.sipped += amt;
      if (Math.random() < dt * 22) {
        part(best.x, best.y, best.golden ? '#fff0a0' : best.k.mid, { vx: (b.x - best.x) * 2.2, vy: (b.y - best.y) * 2.2, life: 0.35, s: rand(1.5, 3), glow: true });
        Audio_.sip();
      }
    }
  }

  // ---- deposit at hive ----
  if (dist(b.x, b.y, HIVE.x, HIVE.y) < HIVE.r + 14) {
    if (b.nectar > 0.5) {
      const rate = Math.min(b.nectar, 70 * dt);
      b.nectar -= rate;
      const gain = rate * S.honeyMul();
      G.honey += gain; G.lifetimeHoney += gain;
      if (Math.random() < dt * 16) {
        part(HIVE.x + rand(-30, 30), HIVE.y + rand(-20, 20), '#ffca3a', { vy: -rand(20, 70), life: 0.6, s: rand(2, 4), glow: true });
        Audio_.sip();
      }
      if (b.nectar <= 0.5 && b.nectar > 0) { b.nectar = 0; }
      if (b.nectar === 0) { Audio_.deposit(); floatText(HIVE.x, HIVE.y - 70, 'delivered', '#ffe08a'); }
    }
    // heal at home
    if (b.hp < b.hpMax) {
      b._heal = (b._heal || 0) + dt;
      if (b._heal > 1.6) { b._heal = 0; b.hp++; floatText(b.x, b.y - 26, '+1', '#8ef2a0'); }
    }
    b.stam = clamp(b.stam + 40 * dt, 0, 100);
  }
}

function hurtBee(dmg, fromX, fromY) {
  const b = G.bee;
  if (b.iFrame > 0 || b.down > 0) return;
  b.hp -= dmg; b.iFrame = 1.3; b.stun = 0.45;
  const a = Math.atan2(b.y - fromY, b.x - fromX);
  b.vx += Math.cos(a) * 7; b.vy += Math.sin(a) * 7;
  shake = Math.max(shake, 12);
  Audio_.hurt();
  burst(b.x, b.y, 12, '#ff9a6b', 170);
  // drop half the cargo
  if (b.nectar > 1) {
    const lost = b.nectar * 0.5; b.nectar -= lost;
    floatText(b.x, b.y - 30, '-' + Math.round(lost) + ' nectar', '#ffb3b3');
    burst(b.x, b.y, 10, '#ffd76a', 120, { grav: 200 });
  }
  if (b.hp <= 0) {
    b.hp = 0; b.down = 3; b.nectar = 0;
    burst(b.x, b.y, 26, '#ffd54a', 220);
    say('knocked out — drifting home', 3);
  }
}

/* ---------------------------- the comb --------------------------------- */
function innerFx(x, y, text, col) { G.innerFx.push({ x, y, text, col, t: 0, life: 1.2 }); }

function toggleHive() {
  if (!G.inHive) {
    if (G.phase !== 'day') { say('the comb is sealed against the raid', 1.8); Audio_.bad(); return; }
    if (dist(G.bee.x, G.bee.y, HIVE.x, HIVE.y) > HIVE.r + 26) { say('fly to the comb first', 1.4); return; }
    // walking in hands over whatever you were carrying
    if (G.bee.nectar > 0.5) {
      const gain = G.bee.nectar * S.honeyMul();
      G.honey += gain; G.lifetimeHoney += gain; G.bee.nectar = 0;
      Audio_.deposit();
    }
    G.inHive = true;
    G.inner.x = 0; G.inner.y = INNER.h * 0.34; G.inner.vx = G.inner.vy = 0;
    G.inner.layT = 0; G.inner.layCell = null;
    Audio_.blip(300, 0.24, 'sine', 0.12, 540);
  } else {
    G.inHive = false;
    G.bee.x = HIVE.x; G.bee.y = HIVE.y + HIVE.r + 24;
    G.bee.vx = 0; G.bee.vy = 1.6;
    Audio_.blip(540, 0.22, 'sine', 0.12, 300);
  }
}

function updateInner(dt) {
  const p = G.inner;
  p.flap += dt;

  let ix = 0, iy = 0;
  if (keys.KeyA || keys.ArrowLeft)  ix -= 1;
  if (keys.KeyD || keys.ArrowRight) ix += 1;
  if (keys.KeyW || keys.ArrowUp)    iy -= 1;
  if (keys.KeyS || keys.ArrowDown)  iy += 1;
  const il = Math.hypot(ix, iy);
  if (il > 0) { ix /= il; iy /= il; p.ang = Math.atan2(iy, ix); }

  p.vx += ix * 0.34 * 60 * dt; p.vy += iy * 0.34 * 60 * dt;
  const dr = Math.pow(0.05, dt); p.vx *= dr; p.vy *= dr;
  const sp = Math.hypot(p.vx, p.vy), mx = 3.1;
  if (sp > mx) { p.vx = p.vx / sp * mx; p.vy = p.vy / sp * mx; }
  p.x = clamp(p.x + p.vx * 60 * dt, -INNER.w / 2 + 26, INNER.w / 2 - 26);
  p.y = clamp(p.y + p.vy * 60 * dt, -INNER.h / 2 + 26, INNER.h / 2 - 26);

  // nearest empty cell within reach
  let best = null, bd = 1e9;
  for (const c of G.cells) {
    if (c.egg) continue;
    const dd = d2(p.x, p.y, c.x, c.y);
    if (dd < 46 * 46 && dd < bd) { bd = dd; best = c; }
  }
  p.nearCell = best;

  const cst = CASTE[G.caste];
  const room = liveBrood() < broodCap();
  const canLay = best && G.honey >= cst.cost && room;

  if ((keys.Space || keys.ShiftLeft) && canLay) {
    if (p.layCell !== best) { p.layCell = best; p.layT = 0; }
    p.layT += dt;
    if (p.layT >= EGG_LAY_T) {
      best.egg = true; best.caste = G.caste; best.pulse = 1; best.born = time;
      G.honey -= cst.cost; G.stats.eggs++;
      p.layT = 0; p.layCell = null;
      Audio_.deposit();
      innerFx(best.x, best.y - 26, cst.name + ' egg', cst.col);
    }
  } else {
    p.layT = 0; p.layCell = null;
    if ((keys.Space || keys.ShiftLeft) && best && !room && !p._warnRoom) {
      p._warnRoom = 1; say('every cell is spoken for — buy Brood Cells or build', 2);
    }
  }
  if (!(keys.Space || keys.ShiftLeft)) p._warnRoom = 0;

  for (const c of G.cells) c.pulse = Math.max(0, c.pulse - dt * 1.6);
  for (let i = G.innerFx.length - 1; i >= 0; i--) {
    const f = G.innerFx[i]; f.t += dt; f.y -= 22 * dt;
    if (f.t >= f.life) G.innerFx.splice(i, 1);
  }

  // the queen mends while she is home
  const b = G.bee;
  if (b.hp < b.hpMax) {
    b._heal = (b._heal || 0) + dt;
    if (b._heal > 1.6) { b._heal = 0; b.hp++; }
  }
  b.stam = clamp(b.stam + 40 * dt, 0, 100);
}

/* --------------------------- worker update ----------------------------- */
function updateWorker(w, dt) {
  w.hit = Math.max(0, w.hit - dt);
  w.atk = Math.max(0, w.atk - dt);
  w.care = Math.max(0, w.care - dt);
  w.phase += dt;
  w.cap = S.workerCap();          // Waggle Dance applies to sisters already born

  const alarmSpd = S.workerSpd();
  let tx = HIVE.x, ty = HIVE.y, spd = 2.5 * alarmSpd;

  /* ---- nurses tend the wounded, and patch the comb when nobody needs them.
     They never forage and never fight, so every nurse is a forager you gave up
     to stop paying 65 honey a night for the same sister twice. */
  if (w.caste === 'nurse') {
    let hurt = null, worst = 0;
    for (const k of G.workers) {
      if (k === w || k.hp >= k.hpMax) continue;
      const need = 1 - k.hp / k.hpMax;
      const dd = d2(w.x, w.y, k.x, k.y);
      const score = need * 1000 - dd * 0.002;
      if (score > worst) { worst = score; hurt = k; }
    }
    if (hurt) {
      w.mode = 'tend'; tx = hurt.x; ty = hurt.y; spd = 3.0 * alarmSpd;
      if (d2(w.x, w.y, hurt.x, hurt.y) < 26 * 26) {
        const amt = Math.min(3.2 * dt, hurt.hpMax - hurt.hp);
        hurt.hp += amt; G.stats.healed += amt;
        if (Math.random() < dt * 5)
          part(hurt.x, hurt.y, '#b6ffcf', { vx: rand(-16, 16), vy: -rand(8, 34), life: 0.5, s: 2.2, glow: true });
      }
    } else {
      w.mode = 'mend';
      tx = HIVE.x + Math.cos(w.phase * 0.7 + w.wob) * (HIVE.r + 14);
      ty = HIVE.y + Math.sin(w.phase * 0.7 + w.wob) * (HIVE.r + 14);
      spd = 2.0 * alarmSpd;
      if (d2(w.x, w.y, HIVE.x, HIVE.y) < (HIVE.r + 40) * (HIVE.r + 40) && G.hiveHP < G.hiveMax) {
        G.hiveHP = Math.min(G.hiveMax, G.hiveHP + 1.1 * dt);
        if (Math.random() < dt * 2.5)
          part(w.x, w.y, '#b6ffcf', { vx: rand(-14, 14), vy: -rand(10, 30), life: 0.5, s: 2, glow: true });
      }
    }
    moveBee(w, tx, ty, spd, dt);
    return;
  }

  /* ---- builders never forage and never fight. By day they work the comb,
     and a finished expansion buys more hive HP and more cells to lay into. */
  if (w.caste === 'builder') {
    if (d2(w.x, w.y, HIVE.x, HIVE.y) > (HIVE.r + 34) * (HIVE.r + 34)) {
      tx = HIVE.x; ty = HIVE.y; spd = 2.6 * alarmSpd; w.mode = 'home';
    } else {
      w.mode = 'build';
      tx = HIVE.x + Math.cos(w.phase * 0.8 + w.wob) * (HIVE.r + 18);
      ty = HIVE.y + Math.sin(w.phase * 0.8 + w.wob) * (HIVE.r + 18);
      spd = 1.9 * alarmSpd;
      if (G.phase === 'day') {
        G.nest.prog += BUILD_RATE * dt;
        if (Math.random() < dt * 3)
          part(w.x, w.y, '#9fe0ff', { vx: rand(-20, 20), vy: -rand(10, 40), life: 0.5, s: 2.2, glow: true });
        if (G.nest.prog >= buildNeed(G.nest.tier)) growNest();
      }
    }
    moveBee(w, tx, ty, spd, dt);
    return;
  }

  const soldier = w.caste === 'soldier';

  if (G.phase === 'night' || G.wasps.length || soldier) {
    // defend: pick nearest wasp
    let best = null, bd = 1e9;
    for (const e of G.wasps) {
      const dd = d2(w.x, w.y, e.x, e.y);
      if (dd < bd) { bd = dd; best = e; }
    }
    if (best) {
      // NB: the foe goes in its own field. Parking a wasp in w.target used to
      // survive into the next dawn, where the forage branch treated it as a
      // flower — w.target.nectar is undefined on a wasp, so the staleness test
      // never fired, Math.min() went NaN and w.target.k.mid threw.
      w.mode = 'fight'; w.foe = best;
      tx = best.x; ty = best.y; spd = (soldier ? 3.7 : 3.3) * alarmSpd;
      if (bd < (best.r + 12) * (best.r + 12) && w.atk <= 0) {
        // a carapace shrugs off most of what the sisters can do to it
        best.hp -= (soldier ? 15 : 9) * S.workerDmg() * (best.K.armor || 1);
        best.hit = 0.14; w.atk = soldier ? 0.55 : 0.62;
        const a = Math.atan2(best.y - w.y, best.x - w.x);
        best.vx += Math.cos(a) * 1.6; best.vy += Math.sin(a) * 1.6;
        w.vx -= Math.cos(a) * 2.4; w.vy -= Math.sin(a) * 2.4;
        burst(best.x, best.y, 4, '#fff0b0', 110);
        Audio_.blip(rand(700, 950), 0.05, 'square', 0.05);
      }
    } else { w.mode = 'home'; }
  } else {
    // forage
    if (w.load >= w.cap) {
      w.mode = 'home'; tx = HIVE.x; ty = HIVE.y;
      if (d2(w.x, w.y, HIVE.x, HIVE.y) < (HIVE.r + 10) * (HIVE.r + 10)) {
        const gain = w.load * S.honeyMul() * 0.8;
        G.honey += gain; G.lifetimeHoney += gain; w.load = 0;
        part(HIVE.x + rand(-20, 20), HIVE.y, '#ffca3a', { vy: -40, life: 0.5, s: 3, glow: true });
      }
    } else {
      // `!w.target.k` keeps this self-healing: anything that is not a flower is
      // dropped rather than being sipped from
      if (!w.target || !w.target.k || w.target.nectar < 1) {
        let best = null, bd = 1e9;
        for (const f of G.flowers) {
          if (f.nectar < 4) continue;
          const dd = d2(w.x, w.y, f.x, f.y) - f.nectar * 60;
          if (dd < bd) { bd = dd; best = f; }
        }
        w.target = best;
      }
      if (w.target) {
        tx = w.target.x; ty = w.target.y; w.mode = 'seek'; spd = 2.5 * alarmSpd;
        if (d2(w.x, w.y, tx, ty) < (w.target.r + 14) * (w.target.r + 14)) {
          const amt = Math.min(S.workerGath() * dt, w.target.nectar, w.cap - w.load);
          w.target.nectar -= amt; w.load += amt; w.target.bounce = 0.6;
          if (Math.random() < dt * 6) part(w.target.x, w.target.y, w.target.k.mid, { vx: (w.x - w.target.x) * 2, vy: (w.y - w.target.y) * 2, life: 0.3, s: 2 });
        }
      } else {
        // idle orbit around the player
        const b = G.bee;
        tx = b.x + Math.cos(w.phase * 0.9 + w.wob) * 70;
        ty = b.y + Math.sin(w.phase * 0.9 + w.wob) * 70;
      }
    }
  }

  moveBee(w, tx, ty, spd, dt);
}

/* shared steering for every caste — wobbly bee-line toward a point */
function moveBee(w, tx, ty, spd, dt) {
  const a = Math.atan2(ty - w.y, tx - w.x);
  const wob = Math.sin(w.phase * 5 * w.wob) * 0.35;
  w.vx += Math.cos(a + wob) * 0.30 * 60 * dt;
  w.vy += Math.sin(a + wob) * 0.30 * 60 * dt;
  const dr = Math.pow(0.08, dt);
  w.vx *= dr; w.vy *= dr;
  const sp = Math.hypot(w.vx, w.vy);
  if (sp > spd) { w.vx = w.vx / sp * spd; w.vy = w.vy / sp * spd; }
  w.x = clamp(w.x + w.vx * 60 * dt, 10, WORLD.w - 10);
  w.y = clamp(w.y + w.vy * 60 * dt, 10, WORLD.h - 10);
  if (sp > 0.1) w.ang = Math.atan2(w.vy, w.vx);
}

/* ---------------------------- wasp update ------------------------------ */
function updateWasp(w, dt) {
  w.hit = Math.max(0, w.hit - dt);
  w.atk = Math.max(0, w.atk - dt);
  w.phase += dt;

  const b = G.bee;
  const K = w.K;
  let tx, ty, spd = w.spd;

  /* the matriarch keeps calling escorts in until she goes down */
  if (K.summons && !w.flee) {
    w.summonT -= dt;
    if (w.summonT <= 0) {
      w.summonT = 9;
      for (let i = 0; i < 2; i++) {
        const a = rand(0, TAU);
        spawnWasp('wasp', w.x + Math.cos(a) * 46, w.y + Math.sin(a) * 46);
      }
      burst(w.x, w.y, 20, '#ff9ec4', 200, { glow: true });
      say('the matriarch calls in more', 2);
      Audio_.blip(190, 0.5, 'sawtooth', 0.16, 90);
    }
  }

  /* a robber that has filled its crop runs for the edge instead of fighting */
  if (K.robs && w.loot >= 45 && !w.flee) {
    w.flee = 1;
    floatText(w.x, w.y - 20, 'making off with it!', '#c9b0ff');
  }

  if (w.flee) {
    tx = w.x + (w.x - HIVE.x) * 4; ty = w.y + (w.y - HIVE.y) * 4; spd = w.spd * 1.5;
  } else {
    // a queen inside the comb is not a target out here
    const db = (b.down > 0 || G.inHive) ? 1e9 : d2(w.x, w.y, b.x, b.y);
    const dh = d2(w.x, w.y, HIVE.x, HIVE.y);
    // robbers want the stores, not a fight — they ignore the queen entirely
    const hunts = !K.robs && db < 230 * 230;

    if (K.ranged && !hunts) {
      /* spitters hold a lane: they close to range, then stop and shoot at
         whatever is nearest — queen, sister, or the comb itself */
      let aim = { x: HIVE.x, y: HIVE.y }, aimD = dh;
      if (db < 420 * 420) { aim = b; aimD = db; }
      for (const k of G.workers) {
        const kd = d2(w.x, w.y, k.x, k.y);
        if (kd < aimD && kd < 340 * 340) { aim = k; aimD = kd; }
      }
      const want = 190;
      if (aimD > want * want) { tx = aim.x; ty = aim.y; }
      else {
        // strafe at range rather than sit still
        const ang = Math.atan2(w.y - aim.y, w.x - aim.x) + Math.sin(w.phase * 0.9) * 0.5;
        tx = aim.x + Math.cos(ang) * want; ty = aim.y + Math.sin(ang) * want;
      }
      w.shootT -= dt;
      if (w.shootT <= 0 && aimD < 330 * 330) {
        w.shootT = rand(1.5, 2.4);
        spawnShot(w, aim.x, aim.y);
      }
    } else if (hunts) {
      // hunt the queen
      tx = b.x; ty = b.y; spd = w.spd * 1.12;
      if (db < (w.r + 14) * (w.r + 14) && w.atk <= 0) {
        w.atk = 1.1; hurtBee(K.sting, w.x, w.y);
      }
    } else if (dh > (HIVE.r + 10) * (HIVE.r + 10)) {
      tx = HIVE.x; ty = HIVE.y;
    } else {
      // gnawing the hive
      tx = HIVE.x + Math.cos(w.phase * 1.4) * 40;
      ty = HIVE.y + Math.sin(w.phase * 1.4) * 40;
      G.hiveHP = Math.max(0, G.hiveHP - K.gnaw * dt);
      const steal = Math.min(G.honey, K.steal * dt);
      G.honey -= steal; w.loot += steal;
      if (Math.random() < dt * 7) {
        part(w.x, w.y, '#ffb43a', { vx: rand(-50, 50), vy: rand(-70, -10), life: 0.5, s: 2.6, glow: true });
        shake = Math.max(shake, 3);
      }
    }
  }

  /* silk snags raiders too — a web near the comb is a defensive structure */
  for (const s of G.webs) {
    if (s.torn > 0 || w.boss) continue;
    if (d2(w.x, w.y, s.x, s.y) < s.r * s.r) { spd *= 0.42; break; }
  }

  const a = Math.atan2(ty - w.y, tx - w.x);
  const wob = Math.sin(w.phase * 4.2 * w.wob) * 0.28;
  w.vx += Math.cos(a + wob) * 0.34 * 60 * dt;
  w.vy += Math.sin(a + wob) * 0.34 * 60 * dt;
  const dr = Math.pow(0.1, dt);
  w.vx *= dr; w.vy *= dr;
  const sp = Math.hypot(w.vx, w.vy);
  if (sp > spd) { w.vx = w.vx / sp * spd; w.vy = w.vy / sp * spd; }
  w.x += w.vx * 60 * dt; w.y += w.vy * 60 * dt;
  if (sp > 0.1) w.ang = Math.atan2(w.vy, w.vx);

  /* swat the sisters mobbing us. Workers have carried hp, a death burst, a
     "lost a sister" toast and a `workersLost` stat since the start — but
     nothing in the game ever dealt them damage, so a worker was immortal and
     the whole defence ran itself. */
  if (!w.flee && w.atk <= 0) {
    for (const k of G.workers) {
      if (d2(k.x, k.y, w.x, w.y) < (w.r + 13) * (w.r + 13)) {
        k.hp -= K.swat; k.hit = 0.18;
        const ka = Math.atan2(k.y - w.y, k.x - w.x);
        k.vx += Math.cos(ka) * 4.5; k.vy += Math.sin(ka) * 4.5;
        w.atk = w.boss ? 0.75 : 1.05;
        burst(k.x, k.y, 5, '#ffe0a8', 130);
        Audio_.blip(rand(170, 220), 0.06, 'sawtooth', 0.06);
        break;                                   // one sister per swing
      }
    }
  }

  // player dash damage
  if (b.dashT > 0 && b.down <= 0) {
    if (d2(w.x, w.y, b.x, b.y) < (w.r + 20) * (w.r + 20) && w.hit <= 0) {
      const dmg = S.dashDmg() * (K.armor || 1);
      w.hp -= dmg; w.hit = 0.22;
      const ka = Math.atan2(w.y - b.y, w.x - b.x);
      w.vx += Math.cos(ka) * 7; w.vy += Math.sin(ka) * 7;
      burst(w.x, w.y, 10, '#ffffff', 200);
      floatText(w.x, w.y - 18, '-' + Math.round(dmg), '#fff');
      shake = Math.max(shake, 8);
      Audio_.blip(300, 0.07, 'square', 0.12, 120);
    }
  }
}

/* ================================ DRAW ================================= */

/* grass pattern, built once */
let grassPat = null;
function buildGrass() {
  const s = 300, g = document.createElement('canvas');
  g.width = g.height = s;
  const p = g.getContext('2d');
  p.fillStyle = '#4c8a39'; p.fillRect(0, 0, s, s);
  for (let i = 0; i < 260; i++) {
    p.globalAlpha = rand(0.05, 0.16);
    p.fillStyle = Math.random() < 0.5 ? '#63a349' : '#3d7530';
    p.beginPath(); p.ellipse(rand(0, s), rand(0, s), rand(14, 52), rand(10, 34), rand(0, TAU), 0, TAU); p.fill();
  }
  p.globalAlpha = 1;
  for (let i = 0; i < 1500; i++) {
    const x = rand(0, s), y = rand(0, s), h = rand(3, 10), a = rand(-0.5, 0.5);
    p.strokeStyle = `hsl(${randi(84, 112)}, ${randi(32, 58)}%, ${randi(24, 45)}%)`;
    p.lineWidth = rand(0.9, 2.1); p.lineCap = 'round';
    p.beginPath(); p.moveTo(x, y); p.quadraticCurveTo(x + Math.sin(a) * h * 0.5, y - h * 0.6, x + Math.sin(a) * h, y - h); p.stroke();
  }
  grassPat = ctx.createPattern(g, 'repeat');
}
buildGrass();

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/* --- a bee (used for player, workers, and — restyled — wasps) --- */
function drawBee(x, y, ang, s, opt) {
  opt = opt || {};
  const flapSpd = opt.flapSpd || 42;
  const flap = Math.sin(time * flapSpd + (opt.phase || 0));
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(ang);

  // wings (behind body)
  ctx.globalAlpha = 0.42;
  ctx.fillStyle = opt.wing || '#e8f6ff';
  for (const sg of [-1, 1]) {
    ctx.save();
    ctx.translate(-s * 0.12, sg * s * 0.22);
    ctx.rotate(sg * (0.55 + flap * 0.42));
    ctx.beginPath(); ctx.ellipse(s * 0.62, 0, s * 0.86, s * 0.30, 0, 0, TAU); ctx.fill();
    ctx.restore();
  }
  ctx.globalAlpha = 1;

  // body
  const base = opt.base || '#f6c534';
  const stripe = opt.stripe || '#2a1d0b';
  ctx.save();
  ctx.beginPath();
  if (opt.wasp) {
    // slim, wasp-waisted
    ctx.moveTo(s * 1.35, 0);
    ctx.quadraticCurveTo(s * 0.5, s * 0.62, s * 0.15, s * 0.30);
    ctx.quadraticCurveTo(-s * 0.05, s * 0.10, -s * 0.30, s * 0.46);
    ctx.quadraticCurveTo(-s * 1.25, s * 0.20, -s * 1.30, 0);
    ctx.quadraticCurveTo(-s * 1.25, -s * 0.20, -s * 0.30, -s * 0.46);
    ctx.quadraticCurveTo(-s * 0.05, -s * 0.10, s * 0.15, -s * 0.30);
    ctx.quadraticCurveTo(s * 0.5, -s * 0.62, s * 1.35, 0);
  } else {
    ctx.ellipse(0, 0, s * 1.12, s * 0.74, 0, 0, TAU);
  }
  ctx.closePath();
  const grd = ctx.createLinearGradient(0, -s, 0, s);
  grd.addColorStop(0, opt.hi || '#ffe27a');
  grd.addColorStop(0.55, base);
  grd.addColorStop(1, opt.lo || '#c98f18');
  ctx.fillStyle = grd; ctx.fill();

  // stripes clipped to body
  ctx.clip();
  ctx.fillStyle = stripe;
  const n = opt.wasp ? 4 : 3;
  for (let i = 0; i < n; i++) {
    const px = -s * (0.15 + i * 0.42);
    ctx.save(); ctx.translate(px, 0); ctx.rotate(0.12);
    ctx.fillRect(-s * 0.14, -s, s * 0.28, s * 2);
    ctx.restore();
  }
  // fuzzy thorax highlight
  if (!opt.wasp) {
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = opt.fuzz || '#8a5f22';
    ctx.beginPath(); ctx.ellipse(s * 0.52, 0, s * 0.42, s * 0.62, 0, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
  }
  ctx.restore();

  // pollen baskets — fuller as cargo grows
  if (opt.pollen > 0.02) {
    ctx.fillStyle = '#ffd23f';
    const pr = s * 0.30 * Math.min(1, opt.pollen);
    ctx.beginPath(); ctx.ellipse(-s * 0.45,  s * 0.62, pr, pr * 0.8, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(-s * 0.45, -s * 0.62, pr, pr * 0.8, 0, 0, TAU); ctx.fill();
    ctx.globalAlpha = 0.4; ctx.fillStyle = '#fff3ad';
    ctx.beginPath(); ctx.ellipse(-s * 0.5, s * 0.58, pr * 0.4, pr * 0.34, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(-s * 0.5, -s * 0.66, pr * 0.4, pr * 0.34, 0, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
  }

  // head
  ctx.fillStyle = opt.head || '#2a1d0b';
  ctx.beginPath(); ctx.ellipse(s * (opt.wasp ? 1.12 : 0.98), 0, s * 0.42, s * 0.40, 0, 0, TAU); ctx.fill();
  // eyes
  ctx.fillStyle = opt.eye || '#101010';
  for (const sg of [-1, 1]) {
    ctx.beginPath(); ctx.ellipse(s * (opt.wasp ? 1.22 : 1.10), sg * s * 0.22, s * 0.16, s * 0.20, 0, 0, TAU); ctx.fill();
  }
  // antennae
  ctx.strokeStyle = opt.head || '#2a1d0b'; ctx.lineWidth = Math.max(1, s * 0.11); ctx.lineCap = 'round';
  for (const sg of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(s * 1.15, sg * s * 0.18);
    ctx.quadraticCurveTo(s * 1.7, sg * s * (0.45 + flap * 0.08), s * 1.85, sg * s * (0.15 + flap * 0.12));
    ctx.stroke();
  }
  // stinger
  if (opt.wasp) {
    ctx.fillStyle = '#1b1206';
    ctx.beginPath(); ctx.moveTo(-s * 1.28, -s * 0.12); ctx.lineTo(-s * 1.78, 0); ctx.lineTo(-s * 1.28, s * 0.12); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

function drawShadow(x, y, r, a) {
  ctx.globalAlpha = a === undefined ? 0.22 : a;
  ctx.fillStyle = '#0a2a10';
  ctx.beginPath(); ctx.ellipse(x, y + r * 0.9, r, r * 0.42, 0, 0, TAU); ctx.fill();
  ctx.globalAlpha = 1;
}

function drawFlower(f) {
  const full = f.cap > 0 ? f.nectar / f.cap : 0;
  const sway = Math.sin(time * f.sway + f.phase) * 0.10;
  const bob = 1 + f.bounce * 0.12;
  ctx.save();
  ctx.translate(f.x, f.y);
  ctx.rotate(sway);
  ctx.scale(bob, bob);

  const r = f.r * (0.62 + 0.38 * Math.max(0.12, full));

  // glow for rich blooms when Pollen Sense is up
  if (G.up.sense > 0 && full > 0.65) {
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, r * 3.2);
    g.addColorStop(0, f.golden ? 'rgba(255,235,140,0.42)' : 'rgba(255,255,200,0.22)');
    g.addColorStop(1, 'rgba(255,255,200,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, r * 3.2, 0, TAU); ctx.fill();
  }
  // a moonflower lights its own patch of meadow once it opens
  if (f.k.night && full > 0.2) {
    const mg = ctx.createRadialGradient(0, 0, 0, 0, 0, r * 4.2);
    mg.addColorStop(0, 'rgba(190,225,255,' + (0.30 * full + Math.sin(time * 1.8 + f.phase) * 0.05) + ')');
    mg.addColorStop(1, 'rgba(190,225,255,0)');
    ctx.fillStyle = mg; ctx.beginPath(); ctx.arc(0, 0, r * 4.2, 0, TAU); ctx.fill();
  }
  if (f.golden) {
    const g2 = ctx.createRadialGradient(0, 0, 0, 0, 0, r * 2.4);
    g2.addColorStop(0, 'rgba(255,210,60,' + (0.28 + Math.sin(time * 3 + f.phase) * 0.10) + ')');
    g2.addColorStop(1, 'rgba(255,210,60,0)');
    ctx.fillStyle = g2; ctx.beginPath(); ctx.arc(0, 0, r * 2.4, 0, TAU); ctx.fill();
  }

  // petals
  const n = f.k.petals;
  for (let i = 0; i < n; i++) {
    const a = (i / n) * TAU + f.phase * 0.2;
    ctx.save(); ctx.rotate(a);
    const pg = ctx.createLinearGradient(0, 0, r * 1.5, 0);
    pg.addColorStop(0, f.golden ? '#ffe27a' : f.k.col2);
    pg.addColorStop(1, f.golden ? '#ffb01f' : f.k.col);
    ctx.fillStyle = pg;
    ctx.globalAlpha = full < 0.12 ? 0.55 : 1;
    ctx.beginPath();
    if (f.k.spiky) {
      // thistle: a spray of bracts rather than a petal
      ctx.moveTo(r * 0.2, -r * 0.16);
      ctx.lineTo(r * 1.55, 0);
      ctx.lineTo(r * 0.2, r * 0.16);
      ctx.closePath();
    } else {
      ctx.ellipse(r * 0.85, 0, r * 0.72, r * 0.34, 0, 0, TAU);
    }
    ctx.fill();
    ctx.restore();
  }
  ctx.globalAlpha = 1;
  // center
  ctx.fillStyle = f.golden ? '#a86a10' : f.k.mid;
  ctx.beginPath(); ctx.arc(0, 0, r * 0.44, 0, TAU); ctx.fill();
  ctx.globalAlpha = 0.35; ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(0, 0, r * 0.44, 0, TAU); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.fillStyle = f.golden ? '#ffe9a0' : '#fff6c9';
  ctx.beginPath(); ctx.arc(-r * 0.1, -r * 0.1, r * 0.2, 0, TAU); ctx.fill();
  ctx.restore();
}

function drawHive() {
  const x = HIVE.x, y = HIVE.y;
  // stump
  drawShadow(x, y + 18, 76, 0.28);
  ctx.fillStyle = '#5b3d22';
  roundRect(x - 58, y + 20, 116, 34, 12); ctx.fill();
  ctx.fillStyle = '#734e2b';
  roundRect(x - 58, y + 16, 116, 16, 8); ctx.fill();

  // skep body — stacked coils
  const rows = 6;
  for (let i = rows - 1; i >= 0; i--) {
    const t = i / rows;
    const rw = 62 * (1 - t * 0.55) + 6;
    const yy = y + 22 - i * 15;
    const g = ctx.createLinearGradient(x - rw, 0, x + rw, 0);
    g.addColorStop(0, '#a9741f'); g.addColorStop(0.42, '#e0a63a'); g.addColorStop(1, '#8f5f16');
    ctx.fillStyle = g;
    roundRect(x - rw, yy - 13, rw * 2, 22, 11); ctx.fill();
    ctx.strokeStyle = 'rgba(70,42,8,0.35)'; ctx.lineWidth = 1.5;
    roundRect(x - rw, yy - 13, rw * 2, 22, 11); ctx.stroke();
  }
  // cap
  ctx.fillStyle = '#c78a24';
  ctx.beginPath(); ctx.ellipse(x, y - 66, 20, 12, 0, 0, TAU); ctx.fill();

  // entrance
  ctx.fillStyle = '#231405';
  ctx.beginPath(); ctx.ellipse(x, y + 16, 15, 12, 0, 0, TAU); ctx.fill();
  const gl = ctx.createRadialGradient(x, y + 16, 0, x, y + 16, 34);
  gl.addColorStop(0, 'rgba(255,190,60,0.5)'); gl.addColorStop(1, 'rgba(255,190,60,0)');
  ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(x, y + 16, 34, 0, TAU); ctx.fill();

  // damage cracks
  const dmg = 1 - G.hiveHP / G.hiveMax;
  if (dmg > 0.05) {
    ctx.strokeStyle = 'rgba(40,20,4,' + (0.3 + dmg * 0.5) + ')';
    ctx.lineWidth = 2;
    for (let i = 0; i < Math.floor(dmg * 9); i++) {
      const a = (i * 2.4) % TAU;
      ctx.beginPath();
      ctx.moveTo(x + Math.cos(a) * 12, y - 20 + Math.sin(a) * 12);
      ctx.lineTo(x + Math.cos(a) * 46, y - 20 + Math.sin(a) * 34);
      ctx.stroke();
    }
  }
  // honey drip when full of honey
  const glowR = 90 + Math.min(70, G.honey * 0.05);
  const hg = ctx.createRadialGradient(x, y - 10, 10, x, y - 10, glowR);
  hg.addColorStop(0, 'rgba(255,200,60,0.10)'); hg.addColorStop(1, 'rgba(255,200,60,0)');
  ctx.fillStyle = hg; ctx.beginPath(); ctx.arc(x, y - 10, glowR, 0, TAU); ctx.fill();
}

function drawWorld() {
  const b = G.bee;
  const sx = (Math.random() - 0.5) * shake, sy = (Math.random() - 0.5) * shake;
  const ox = Math.round(-cam.x + VW / 2 + sx), oy = Math.round(-cam.y + VH / 2 + sy);

  ctx.save();
  ctx.translate(ox, oy);

  // ground
  ctx.fillStyle = grassPat;
  ctx.fillRect(0, 0, WORLD.w, WORLD.h);

  // decor
  for (const d of G.decor) {
    if (d.x < cam.x - VW / 2 - 40 || d.x > cam.x + VW / 2 + 40 || d.y < cam.y - VH / 2 - 40 || d.y > cam.y + VH / 2 + 40) continue;
    if (d.t === 'rock') {
      ctx.globalAlpha = 0.9;
      ctx.fillStyle = ['#8c9088', '#767a72', '#9aa093'][d.c];
      ctx.beginPath(); ctx.ellipse(d.x, d.y, d.r, d.r * 0.72, d.h, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.16)';
      ctx.beginPath(); ctx.ellipse(d.x - d.r * 0.2, d.y - d.r * 0.24, d.r * 0.42, d.r * 0.26, d.h, 0, TAU); ctx.fill();
      ctx.globalAlpha = 1;
    } else {
      ctx.strokeStyle = ['#3f7a31', '#4f8f3c', '#356b2a'][d.c];
      ctx.lineWidth = 2; ctx.lineCap = 'round';
      const sw = Math.sin(time * 0.9 + d.x * 0.01) * 3;
      for (let i = -2; i <= 2; i++) {
        ctx.beginPath();
        ctx.moveTo(d.x + i * 3, d.y);
        ctx.quadraticCurveTo(d.x + i * 4 + sw * 0.5, d.y - d.r * d.h, d.x + i * 5 + sw, d.y - d.r * 1.6 * d.h);
        ctx.stroke();
      }
    }
  }

  // world edge vignette
  ctx.strokeStyle = 'rgba(20,50,20,0.55)'; ctx.lineWidth = 34;
  ctx.strokeRect(-17, -17, WORLD.w + 34, WORLD.h + 34);

  // motes
  for (const m of G.motes) {
    if (m.x < cam.x - VW / 2 || m.x > cam.x + VW / 2 || m.y < cam.y - VH / 2 || m.y > cam.y + VH / 2) continue;
    ctx.globalAlpha = m.a * (G.phase === 'day' ? 1 : 0.9);
    ctx.fillStyle = G.phase === 'day' ? '#fff6c8' : '#bfe9ff';
    ctx.beginPath(); ctx.arc(m.x, m.y, m.s, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
  }

  // spider silk, under the flowers so blooms still read on top of it
  for (const s of G.webs) {
    if (s.x < cam.x - VW / 2 - 120 || s.x > cam.x + VW / 2 + 120 ||
        s.y < cam.y - VH / 2 - 120 || s.y > cam.y + VH / 2 + 120) continue;
    const fade = s.torn > 0 ? Math.max(0, 1 - s.torn / 0.7) : 1;
    const r = s.r * (s.torn > 0 ? 1 + s.torn * 0.7 : 1);
    ctx.save();
    ctx.translate(s.x, s.y); ctx.rotate(s.phase * 0.2);
    ctx.globalAlpha = 0.30 * fade;
    ctx.fillStyle = '#dbe8f0';
    ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill();
    ctx.globalAlpha = 0.55 * fade;
    ctx.strokeStyle = '#f2f8ff'; ctx.lineWidth = 1.1;
    const spokes = 10;
    for (let i = 0; i < spokes; i++) {
      const a = (i / spokes) * TAU;
      ctx.beginPath(); ctx.moveTo(0, 0);
      ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); ctx.stroke();
    }
    for (let ring = 1; ring <= 4; ring++) {
      const rr = r * (ring / 4) * (0.94 + Math.sin(time * 1.4 + s.phase + ring) * 0.03);
      ctx.beginPath();
      for (let i = 0; i <= spokes; i++) {
        const a = (i / spokes) * TAU;
        const px = Math.cos(a) * rr, py = Math.sin(a) * rr;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.stroke();
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  // flower shadows then flowers
  for (const f of G.flowers) {
    if (f.x < cam.x - VW / 2 - 60 || f.x > cam.x + VW / 2 + 60 || f.y < cam.y - VH / 2 - 60 || f.y > cam.y + VH / 2 + 60) continue;
    drawShadow(f.x, f.y, f.r * 0.8, 0.16);
  }
  for (const f of G.flowers) {
    if (f.x < cam.x - VW / 2 - 60 || f.x > cam.x + VW / 2 + 60 || f.y < cam.y - VH / 2 - 60 || f.y > cam.y + VH / 2 + 60) continue;
    drawFlower(f);
  }

  drawHive();

  // particles behind actors
  for (const p of G.parts) {
    const a = 1 - p.t / p.life;
    ctx.globalAlpha = a;
    if (p.glow) { ctx.shadowBlur = 10; ctx.shadowColor = p.col; }
    ctx.fillStyle = p.col;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.s * a, 0, TAU); ctx.fill();
    ctx.shadowBlur = 0;
  }
  ctx.globalAlpha = 1;

  // venom globs
  for (const s of G.shots) {
    ctx.save();
    ctx.shadowBlur = 12; ctx.shadowColor = '#57d69b';
    const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r + 2);
    g.addColorStop(0, '#e8fff2'); g.addColorStop(0.5, '#57d69b'); g.addColorStop(1, '#1d6b47');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r + Math.sin(time * 20) * 0.6, 0, TAU); ctx.fill();
    ctx.restore();
  }

  // sip beam
  if (b.sipping) {
    ctx.strokeStyle = 'rgba(255,235,140,0.45)';
    ctx.lineWidth = 2 + Math.sin(time * 22) * 1;
    ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.sipping.x, b.sipping.y); ctx.stroke();
  }

  // actors, sorted by y
  const actors = [];
  for (const w of G.workers) actors.push({ y: w.y, t: 'w', o: w });
  for (const w of G.wasps)   actors.push({ y: w.y, t: 'x', o: w });
  if (b.down <= 0) actors.push({ y: b.y, t: 'p', o: b });
  actors.sort((a, c) => a.y - c.y);

  for (const a of actors) {
    const o = a.o;
    if (a.t === 'w') {
      drawShadow(o.x, o.y + 12, 8, 0.18);
      drawBee(o.x, o.y, o.ang, 8.5, { phase: o.phase * 7, pollen: o.load / o.cap, flapSpd: 48 });
      if (o.hp < o.hpMax) {
        ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fillRect(o.x - 10, o.y - 17, 20, 3);
        ctx.fillStyle = '#8ef2a0'; ctx.fillRect(o.x - 10, o.y - 17, 20 * (o.hp / o.hpMax), 3);
      }
    } else if (a.t === 'x') {
      drawShadow(o.x, o.y + 16, o.r * 0.7, 0.2);
      const K = o.K;
      ctx.save();
      if (o.hit > 0) { ctx.globalCompositeOperation = 'lighter'; }
      // a carapace wears a visible plate — the armor should read before it bites
      if (K.armor) {
        ctx.globalAlpha = 0.5;
        ctx.fillStyle = K.col.lo;
        ctx.beginPath(); ctx.ellipse(o.x, o.y, o.r * 1.15, o.r * 0.95, o.ang, 0, TAU); ctx.fill();
        ctx.globalAlpha = 1;
      }
      drawBee(o.x, o.y, o.ang, K.s, {
        wasp: true, phase: o.phase * 8, flapSpd: 55,
        base: K.col.base, hi: K.col.hi, lo: K.col.lo,
        stripe: '#181004', head: '#22160a', eye: '#ff3b2f'
      });
      ctx.restore();
      // a laden robber glitters with what it took
      if (o.loot > 4) {
        ctx.globalAlpha = 0.8; ctx.fillStyle = '#ffca3a';
        const pr = 2 + Math.min(5, o.loot * 0.08);
        ctx.beginPath(); ctx.arc(o.x - Math.cos(o.ang) * o.r, o.y - Math.sin(o.ang) * o.r, pr, 0, TAU); ctx.fill();
        ctx.globalAlpha = 1;
      }
      // hp bar
      ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(o.x - o.r, o.y - o.r - 14, o.r * 2, 4);
      ctx.fillStyle = o.boss ? '#ff6b3d' : '#ff3b2f'; ctx.fillRect(o.x - o.r, o.y - o.r - 14, o.r * 2 * (o.hp / o.hpMax), 4);
      ctx.textAlign = 'center';
      if (o.boss) {
        ctx.fillStyle = K.col.hi; ctx.font = '700 11px system-ui, sans-serif';
        ctx.fillText(K.name, o.x, o.y - o.r - 20);
      } else if (o.kind !== 'wasp') {
        ctx.globalAlpha = 0.75;
        ctx.fillStyle = K.col.hi; ctx.font = '700 9.5px system-ui, sans-serif';
        ctx.fillText(K.name, o.x, o.y - o.r - 19);
        ctx.globalAlpha = 1;
      }
    } else {
      // player queen bee
      drawShadow(o.x, o.y + 18, 14, 0.24);
      const flash = o.iFrame > 0 && Math.floor(time * 18) % 2 === 0;
      ctx.save();
      if (flash) ctx.globalAlpha = 0.45;
      // royal aura
      const aur = ctx.createRadialGradient(o.x, o.y, 4, o.x, o.y, 44);
      aur.addColorStop(0, 'rgba(255,225,120,0.20)'); aur.addColorStop(1, 'rgba(255,225,120,0)');
      ctx.fillStyle = aur; ctx.beginPath(); ctx.arc(o.x, o.y, 44, 0, TAU); ctx.fill();
      drawBee(o.x, o.y, o.ang, 14, {
        phase: 0, flapSpd: 44, pollen: o.nectar / S.cap(),
        base: '#f8c72e', hi: '#fff0a0', lo: '#c08a10', fuzz: '#7b5416'
      });
      // little crown
      ctx.save();
      ctx.translate(o.x + Math.cos(o.ang) * 15, o.y + Math.sin(o.ang) * 15);
      ctx.rotate(o.ang);
      ctx.fillStyle = '#ffe680';
      ctx.beginPath();
      ctx.moveTo(-4, -7); ctx.lineTo(-1, -2); ctx.lineTo(2, -8); ctx.lineTo(5, -2); ctx.lineTo(7, -7);
      ctx.lineTo(7, 1); ctx.lineTo(-4, 1); ctx.closePath(); ctx.fill();
      ctx.restore();
      ctx.restore();
    }
  }

  // floating text
  ctx.textAlign = 'center';
  for (const f of G.floats) {
    const a = 1 - f.t / f.life;
    ctx.globalAlpha = a;
    ctx.font = '700 14px system-ui, sans-serif';
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,0.55)';
    ctx.strokeText(f.text, f.x, f.y); ctx.fillStyle = f.col; ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;

  ctx.restore();

  /* ---- time-of-day tint (screen space) ---- */
  if (G.phase === 'night') {
    const t = clamp(G.phaseT / 3, 0, 1);
    ctx.globalCompositeOperation = 'multiply';
    ctx.fillStyle = 'rgba(74,96,168,' + (0.72 * t) + ')';
    ctx.fillRect(0, 0, VW, VH);
    ctx.globalCompositeOperation = 'source-over';
    // hive lantern glow
    const hx = HIVE.x - cam.x + VW / 2, hy = HIVE.y - cam.y + VH / 2;
    const g = ctx.createRadialGradient(hx, hy, 10, hx, hy, 330);
    g.addColorStop(0, 'rgba(255,190,80,0.30)'); g.addColorStop(1, 'rgba(255,190,80,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(hx, hy, 330, 0, TAU); ctx.fill();
    // queen's own glow
    const bx = G.bee.x - cam.x + VW / 2, by = G.bee.y - cam.y + VH / 2;
    const g2 = ctx.createRadialGradient(bx, by, 4, bx, by, 200);
    g2.addColorStop(0, 'rgba(255,230,150,0.22)'); g2.addColorStop(1, 'rgba(255,230,150,0)');
    ctx.fillStyle = g2; ctx.beginPath(); ctx.arc(bx, by, 200, 0, TAU); ctx.fill();
  } else {
    const dusk = clamp(1 - G.phaseT / 12, 0, 1);
    if (dusk > 0) {
      ctx.fillStyle = 'rgba(255,140,60,' + (0.16 * dusk) + ')';
      ctx.fillRect(0, 0, VW, VH);
    }
    ctx.fillStyle = 'rgba(255,240,180,0.05)';
    ctx.fillRect(0, 0, VW, VH);
  }

  /* ---- weather layer (screen space) ---- */
  const W = WX();
  if (W.tint) { ctx.fillStyle = W.tint; ctx.fillRect(0, 0, VW, VH); }

  if (G.weather === 'rain') {
    ctx.strokeStyle = 'rgba(190,215,255,0.30)'; ctx.lineWidth = 1.2;
    for (let i = 0; i < 130; i++) {
      // deterministic per-index streaks scrolling on the clock — no per-frame RNG
      const sx2 = ((i * 149.3 + time * 260) % (VW + 60)) - 30;
      const sy2 = ((i * 311.7 + time * 900) % (VH + 60)) - 30;
      ctx.beginPath(); ctx.moveTo(sx2, sy2); ctx.lineTo(sx2 - 5, sy2 + 17); ctx.stroke();
    }
  } else if (G.weather === 'wind') {
    const wa = Math.atan2(G.wind.y, G.wind.x);
    ctx.strokeStyle = 'rgba(255,255,255,0.16)'; ctx.lineWidth = 1.4;
    for (let i = 0; i < 46; i++) {
      const t2 = (time * 420 + i * 137) % (VW + VH);
      const sx2 = ((i * 211.5) % VW + Math.cos(wa) * t2) % (VW + 80) - 40;
      const sy2 = ((i * 97.3) % VH + Math.sin(wa) * t2) % (VH + 80) - 40;
      ctx.beginPath(); ctx.moveTo(sx2, sy2);
      ctx.lineTo(sx2 + Math.cos(wa) * 34, sy2 + Math.sin(wa) * 34); ctx.stroke();
    }
  } else if (G.weather === 'fog') {
    // fog is a real handicap, so it is drawn as one: sight falls off with range
    const fx = G.bee.x - cam.x + VW / 2, fy = G.bee.y - cam.y + VH / 2;
    const fg = ctx.createRadialGradient(fx, fy, 40, fx, fy, Math.max(VW, VH) * 0.42);
    fg.addColorStop(0, 'rgba(214,224,220,0)');
    fg.addColorStop(0.55, 'rgba(214,224,220,0.34)');
    fg.addColorStop(1, 'rgba(206,216,212,0.72)');
    ctx.fillStyle = fg; ctx.fillRect(0, 0, VW, VH);
  }

  // caught in silk: a white pull at the edges of the screen
  if (G.bee.webbed) {
    ctx.fillStyle = 'rgba(220,235,245,' + (0.07 + Math.sin(time * 9) * 0.03) + ')';
    ctx.fillRect(0, 0, VW, VH);
  }

  // vignette
  const vg = ctx.createRadialGradient(VW / 2, VH / 2, Math.min(VW, VH) * 0.35, VW / 2, VH / 2, Math.max(VW, VH) * 0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,10,0,0.42)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, VW, VH);

  // low-HP pulse
  if (G.bee.hp <= 1 && G.bee.down <= 0) {
    ctx.fillStyle = 'rgba(200,20,20,' + (0.10 + Math.sin(time * 6) * 0.05) + ')';
    ctx.fillRect(0, 0, VW, VH);
  }
}

/* ------------------------------- HUD ----------------------------------- */
function bar(x, y, w, h, pct, col, bg) {
  ctx.fillStyle = bg || 'rgba(0,0,0,0.45)';
  roundRect(x, y, w, h, h / 2); ctx.fill();
  ctx.fillStyle = col;
  if (pct > 0.001) { roundRect(x, y, Math.max(h, w * clamp(pct, 0, 1)), h, h / 2); ctx.fill(); }
  ctx.strokeStyle = 'rgba(255,255,255,0.22)'; ctx.lineWidth = 1;
  roundRect(x, y, w, h, h / 2); ctx.stroke();
}

/* ------------------------- inside the comb ------------------------------ */
function hexPath(x, y, r) {
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {                    // pointy-top, to match hexSpiral
    const a = -Math.PI / 2 + i * TAU / 6;
    const px = x + Math.cos(a) * r, py = y + Math.sin(a) * r;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
}

function drawCell(c) {
  const p = G.inner;
  const near = p.nearCell === c;
  const laying = p.layCell === c && p.layT > 0;

  hexPath(c.x, c.y, CELL_R);
  ctx.fillStyle = c.egg ? 'rgba(96,66,16,0.95)' : 'rgba(48,32,10,0.85)';
  ctx.fill();
  ctx.lineWidth = near ? 2.6 : 1.6;
  ctx.strokeStyle = c.egg ? 'rgba(255,205,90,0.55)'
                  : near  ? 'rgba(255,240,170,0.9)' : 'rgba(255,190,80,0.28)';
  ctx.stroke();

  if (c.egg) {
    const col = CASTE[c.caste].col;
    const bob = Math.sin(time * 2.2 + c.x * 0.05) * 1.6;
    if (c.pulse > 0) {
      ctx.globalAlpha = c.pulse * 0.5;
      hexPath(c.x, c.y, CELL_R + 5); ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.stroke();
      ctx.globalAlpha = 1;
    }
    const gg = ctx.createRadialGradient(c.x, c.y + bob - 3, 1, c.x, c.y + bob, 15);
    gg.addColorStop(0, '#fffdf2'); gg.addColorStop(1, col);
    ctx.fillStyle = gg;
    ctx.beginPath(); ctx.ellipse(c.x, c.y + bob, 8.5, 12, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.beginPath(); ctx.ellipse(c.x - 2.6, c.y + bob - 4, 2.4, 3.4, -0.4, 0, TAU); ctx.fill();
  } else if (laying) {
    ctx.strokeStyle = CASTE[G.caste].col; ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(c.x, c.y, CELL_R - 6, -Math.PI/2, -Math.PI/2 + TAU * (p.layT / EGG_LAY_T));
    ctx.stroke();
  }
}

function drawInner() {
  const g0 = ctx.createRadialGradient(VW/2, VH/2, 30, VW/2, VH/2, Math.max(VW, VH) * 0.72);
  g0.addColorStop(0, '#3d2a0b'); g0.addColorStop(1, '#100b03');
  ctx.fillStyle = g0; ctx.fillRect(0, 0, VW, VH);

  ctx.save();
  const sc = Math.min(VW / (INNER.w + 90), VH / (INNER.h + 210), 1.2);
