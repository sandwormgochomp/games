/* Magnet. Drags loose metal one cell closer each step - the same shape as the
   black hole's pull, and priced the same way: one per click. */
function updMagnet(x, y, i, m) {
  const R = 16;
  let pulled = 0;
  for (let yy = y - R; yy <= y + R; yy++) {
    if (yy < 0 || yy >= H) continue;
    for (let xx = x - R; xx <= x + R; xx++) {
      if (xx < 0 || xx >= W) continue;
      const j = yy * W + xx, nm = mat[j];
      if (nm !== METAL && nm !== IRON && nm !== COPPER && nm !== INFMETAL) continue;
      const dx = Math.sign(x - xx), dy = Math.sign(y - yy);
      if (dx === 0 && dy === 0) continue;
      const tx = xx + dx, ty = yy + dy;
      if (!inb(tx, ty)) continue;
      const t = ty * W + tx;
      if (mat[t] === EMPTY || MOVE[mat[t]] === 1) { swap(j, t); pulled = 1; }
    }
  }
  if (pulled) touch(i);
}

/* Firework. Climbs while its fuse burns - that is the whole point of it - then
   throws a ring of sparks instead of a crater. */
function updFwork(x, y, i, m) {
  if (life[i] > 0) {
    touch(i);
    life[i]--;
    if (life[i] === 0) {
      mat[i] = EMPTY; life[i] = 0;
      for (let a = 0; a < 44; a++) {             // a ring, not a blast
        const ang = a * 0.1428, r = 3 + rnd(6);
        const nx = x + Math.round(Math.cos(ang) * r), ny = y + Math.round(Math.sin(ang) * r);
        if (!inb(nx, ny)) continue;
        const j = ny * W + nx;
        if (mat[j] === EMPTY) { mat[j] = FIRE; life[j] = 8 + rnd(14); touch(j); }
      }
      return;
    }
    if (y > 0 && mat[i - W] === EMPTY) { swap(i, i - W); return; }   // climbs
    return;
  }
  updPowder(x, y, i, m);                         // unlit, it just sits there
}

/* Infected oil and moth: same behaviour, plus the infection. */
function updInfOil(x, y, i, m)  { if (infectAround(x, y, i, 0.012)) touch(i); updLiquid(x, y, i, m); }
function updInfMoth(x, y, i, m) { infectAround(x, y, i, 0.03); emitSpore(x, y, 0.03); updMoth(x, y, i, m); leaveHusk(i); }

/* Infected animals trail spores as they go - a flying one seeds a whole map. */
function updInfBee(x, y, i, m)   { infectAround(x, y, i, 0.03); emitSpore(x, y, 0.03); updBee(x, y, i, m); leaveHusk(i); }
function updInfBird(x, y, i, m)  { infectAround(x, y, i, 0.03); emitSpore(x, y, 0.03); updBird(x, y, i, m); leaveHusk(i); }
function updInfSpider(x, y, i, m){ infectAround(x, y, i, 0.03); emitSpore(x, y, 0.02); updSpider(x, y, i, m); leaveHusk(i); }
function updInfBug(x, y, i, m)   { infectAround(x, y, i, 0.03); emitSpore(x, y, 0.02); updBug(x, y, i, m); leaveHusk(i); }
function updInfFish(x, y, i, m)  { infectAround(x, y, i, 0.03); updFish(x, y, i, m); leaveHusk(i); }
function updInfWorm(x, y, i, m)  { infectAround(x, y, i, 0.03); updWorm(x, y, i, m); leaveHusk(i); }
function updInfFrog(x, y, i, m)  { infectAround(x, y, i, 0.03); emitSpore(x, y, 0.02); updFrog(x, y, i, m); leaveHusk(i); }
function updInfShark(x, y, i, m) { infectAround(x, y, i, 0.03); updShark(x, y, i, m); leaveHusk(i); }

/* Infected wire still carries current - and the current carries the infection,
   so a single infected cell can take a whole circuit and everything wired to it. */
/* Tendril: crawls toward the nearest animal and infects what it reaches.
   `life` is how much further it can grow, so a nest cannot cover the map. */
function updTendril(x, y, i, m) {
  const live = infectAround(x, y, i, 0.15);
  if (life[i] <= 1) { if (live) touch(i); return; }  // spent - it just sits there
  touch(i);
  if (Math.random() > 0.25) return;              // gate BEFORE the area scan
  const dir = nearestDir(x, y, 34, 2, isCreature);
  if (!dir) return;
  const nx = x + dir[0], ny = y + dir[1];
  if (!inb(nx, ny)) return;
  const j = ny * W + nx, t = mat[j];
  // a tentacle pushes through soft stuff, not just air
  if (t === EMPTY || t === DIRT || t === SAND || t === WATER ||
      t === MOSS  || t === LEAF || t === PLANT || t === WEB || t === SPORE) {
    mat[j] = TENDRIL; life[j] = life[i] - 1; moved[j] = 1; touch(j);
  }
}

/* Mold sac: counts down and hatches an infected bug, over and over. */
function updEgg(x, y, i, m) {
  touch(i);
  if (life[i] > 1) { life[i]--; return; }
  for (let k = 0; k < 4; k++) {
    const nx = x + DX4[k], ny = y + DY4[k];
    if (!inb(nx, ny)) continue;
    const j = ny * W + nx;
    if (mat[j] === EMPTY) {
      mat[j] = INFBUG; life[j] = 120; moved[j] = 1; touch(j);
      life[i] = 140 + rnd(140);                  // clutch again
      return;
    }
  }
  life[i] = 40;                                  // nowhere to hatch: wait
}

function updInfMetal(x, y, i, m) {
  // updMetal already keeps a LIVE wire awake and a dead one costs nothing, so
  // the only reason to touch here is having a neighbour left to take.
  if (infectAround(x, y, i, life[i] > 0 ? 0.06 : 0.01)) touch(i);
  if (life[i] > 0) emitSpore(x, y, 0.05);
  updMetal(x, y, i, m);
}

/* Infected plant needs no water at all - that is the whole point of it. */
function updInfPlant(x, y, i, m) {
  touch(i);
  infectAround(x, y, i, 0.015);
  if (Math.random() > 0.02) return;
  let kin = 0;
  for (let k = 0; k < 4; k++) {
    const nx = x + DX4[k], ny = y + DY4[k];
    if (inb(nx, ny) && mat[ny * W + nx] === m) kin++;
  }
  if (kin >= 3) return;
  const k = rnd(4), nx = x + DX4[k], ny = y + DY4[k];
  if (!inb(nx, ny)) return;
  const j = ny * W + nx;
  if (mat[j] === EMPTY) { mat[j] = m; life[j] = 0; touch(j); }
}

/* What a grazer will eat. Mushrooms and honey count - a bug that finds either
   is fed, which is what makes a beehive worth building next to a meadow. */
const isGreen = t => t === PLANT || t === LEAF || t === MOSS || t === ALGAE ||
                     t === SEED  || t === SAPLING || t === MOLD ||
                     t === SHROOM || t === HONEY;

/* Bug: grazes greenery, walks and climbs, drowns in water, burns in fire, and
   breeds when it has eaten well. `life` is its energy. */
function updBug(x, y, i, m) {
  touch(i);
  let e = life[i];
  for (let k = 0; k < 4; k++) {
    const nx = x + DX4[k], ny = y + DY4[k];
    if (!inb(nx, ny)) continue;
    const j = ny * W + nx, nm = mat[j];
    if (nm === FIRE || nm === LAVA || nm === SPARK) { mat[i] = FIRE; life[i] = 12; touch(i); return; }
    if (WET[nm] === 1 || nm === ACID) { mat[i] = EMPTY; life[i] = 0; touch(i); return; }
    if (isGreen(nm) && Math.random() < 0.25) {   // graze
      mat[j] = EMPTY; life[j] = 0; touch(j);
      e = Math.min(250, e + 40);
    }
  }
  if (e <= 1) { mat[i] = EMPTY; life[i] = 0; return; }   // starved
  if ((frame & 1) === 0) { e--; life[i] = e; }           // burns energy every 2nd step
  if (e > 170 && Math.random() < 0.03) {                 // breed
    const k = rnd(4), nx = x + DX4[k], ny = y + DY4[k];
    if (inb(nx, ny)) {
      const j = ny * W + nx;
      if (mat[j] === EMPTY) {
        mat[j] = m; life[j] = 80; moved[j] = 1; touch(j);   // breeds its own kind
        life[i] = e - 70;
        return;
      }
    }
  }
  if (y + 1 < H && mat[i + W] === EMPTY) { swap(i, i + W); return; }   // falls
  if (webbed(x, y) && Math.random() < 0.995) return;    // caught - it can still eat and starve
  if (Math.random() < 0.55) {
    const d = Math.random() < 0.5 ? -1 : 1, nx = x + d;
    if (nx < 0 || nx >= W) return;
    if (mat[i + d] === EMPTY) { swap(i, i + d); return; }
    if (y > 0 && mat[i - W + d] === EMPTY) swap(i, i - W + d);         // climbs
  }
}

/* Fish: swims in water, suffocates out of it, and eats algae. */
function updFish(x, y, i, m) {
  touch(i);
  let e = life[i];
  let wet = 0;
  for (let k = 0; k < 4; k++) {
    const nx = x + DX4[k], ny = y + DY4[k];
    if (!inb(nx, ny)) continue;
    const j = ny * W + nx, nm = mat[j];
    if (WET[nm] === 1) wet++;
    else if (nm === LAVA || nm === FIRE || nm === SPARK) { mat[i] = EMPTY; life[i] = 0; touch(i); return; }
    else if (nm === ALGAE && Math.random() < 0.3) {
      mat[j] = WATER; life[j] = 0; touch(j);
      e = Math.min(250, e + 50);
    }
  }
  if (wet === 0) e = e > 4 ? e - 4 : 0;                  // drowning in air
  if (e <= 1) { mat[i] = EMPTY; life[i] = 0; return; }
  // a fish burns energy slowly - every 4th step, so it can cross open water
  // looking for algae rather than starving on the way
  life[i] = ((frame & 3) === 0) ? e - 1 : e;
  if (wet === 0) {                                       // flops downward
    if (y + 1 < H && mat[i + W] === EMPTY) swap(i, i + W);
    return;
  }
  const k = rnd(4), nx = x + DX4[k], ny = y + DY4[k];
  if (!inb(nx, ny)) return;
  const j = ny * W + nx;
  if (WET[mat[j]] === 1) swap(i, j);
}

/* ------------------------------------------------------------ animals ---- */
/* One pass over the four neighbours doing hazards first, then food.
   Returns -1 if the creature died, otherwise the energy it gained. */
function creatureScan(x, y, i, drowns, isFood, gain, leave) {
  let got = 0;
  for (let k = 0; k < 4; k++) {
    const nx = x + DX4[k], ny = y + DY4[k];
    if (!inb(nx, ny)) continue;
    const j = ny * W + nx, nm = mat[j];
    if (nm === FIRE || nm === LAVA || nm === SPARK) {
      mat[i] = FIRE; life[i] = 12; touch(i); return -1;
    }
    if (drowns && (WET[nm] === 1 || nm === ACID)) {
      mat[i] = EMPTY; life[i] = 0; touch(i); return -1;
    }
    if (got === 0 && isFood(nm) && Math.random() < 0.4) {
      mat[j] = leave; life[j] = 0; touch(j);
      got = gain;
    }
  }
  return got;
}

/* Drift one cell, favouring level flight. Only enters empty air, so a flier
   never blunders into water. */
function flyStep(x, y, i) {
  const r = Math.random();
  const nx = x + (Math.random() < 0.5 ? -1 : 1);
  const ny = y + (r < 0.3 ? -1 : r < 0.55 ? 1 : 0);
  if (!inb(nx, ny)) return;
  const j = ny * W + nx;
  if (mat[j] === EMPTY) swap(i, j);
}

/* Head one cell toward the nearest food in range. Gated by the caller, because
   this is an area scan. */
function seekStep(x, y, i, r, isFood, passable) {
  let bx = 0, by = 0, best = 1e9;
  for (let yy = y - r; yy <= y + r; yy++) {
    if (yy < 0 || yy >= H) continue;
    for (let xx = x - r; xx <= x + r; xx++) {
      if (xx < 0 || xx >= W) continue;
      if (!isFood(mat[yy * W + xx])) continue;
      const d = (xx - x) * (xx - x) + (yy - y) * (yy - y);
      if (d > 0 && d < best) { best = d; bx = xx; by = yy; }
    }
  }
  if (best === 1e9) return false;
  const nx = x + (bx > x ? 1 : bx < x ? -1 : 0);
  const ny = y + (by > y ? 1 : by < y ? -1 : 0);
  if (!inb(nx, ny)) return false;
  const j = ny * W + nx;
  if (passable(mat[j])) { swap(i, j); return true; }
  return false;
}

const isEmpty = t => t === EMPTY;
const isWetT  = t => WET[t] === 1;
const isCreature = t => t === BUG || t === BEE || t === BIRD || t === SPIDER ||
                        t === FROG || t === FISH || t === WORM || t === SHARK ||
                        t === MOTH;
const isWater = t => WET[t] === 1;
const isBug   = t => t === BUG;

/* Bird: hunts bugs and seeds on the wing, drowns if it touches water. */
function updBird(x, y, i, m) {
  touch(i);
  const got = creatureScan(x, y, i, true, t => t === BUG || t === SEED, 70, EMPTY);
  if (got < 0) return;
  let e = Math.min(250, life[i] + got);
  if (e <= 1) { mat[i] = EMPTY; life[i] = 0; return; }
  if ((frame & 3) === 0) e--;
  life[i] = e;
  if (webbed(x, y) && Math.random() < 0.995) return;
  if (Math.random() < 0.25 && seekStep(x, y, i, 5, t => t === BUG || t === SEED, isEmpty)) return;
  flyStep(x, y, i);
}

/* Bee: feeds on greenery and pollinates it, so a planted patch spreads. */
function updBee(x, y, i, m) {
  touch(i);
  const got = creatureScan(x, y, i, true, () => false, 0, EMPTY);
  if (got < 0) return;
  let e = life[i];
  let onFlower = false;
  for (let k = 0; k < 4; k++) {
    const nx = x + DX4[k], ny = y + DY4[k];
    if (!inb(nx, ny)) continue;
    const nm = mat[ny * W + nx];
    if (nm === PLANT || nm === LEAF) { onFlower = true; break; }
  }
  if (onFlower) {
    e = Math.min(250, e + 6);
    if (Math.random() < 0.04) {                // pollinate into open air
      const k = rnd(4), nx = x + DX4[k], ny = y + DY4[k];
      if (inb(nx, ny)) {
        const j = ny * W + nx;
        if (mat[j] === EMPTY) { mat[j] = LEAF; life[j] = 0; touch(j); }
      }
    }
  }
  if (e <= 1) { mat[i] = EMPTY; life[i] = 0; return; }
  if ((frame & 3) === 0) e--;
  life[i] = e;
  if (Math.random() < 0.2 &&
      seekStep(x, y, i, 5, t => t === PLANT || t === LEAF, isEmpty)) return;
  if (webbed(x, y) && Math.random() < 0.995) return;
  flyStep(x, y, i);
}

/* Worm: tunnels through soil and turns the sand it passes into dirt. */
function updWorm(x, y, i, m) {
  touch(i);
  const got = creatureScan(x, y, i, false, () => false, 0, EMPTY);
  if (got < 0) return;
  let e = life[i];
  if (e <= 1) { mat[i] = EMPTY; life[i] = 0; return; }
  if ((frame & 7) === 0) e--;                  // very slow metabolism
  life[i] = e;
  if (Math.random() > 0.45) return;
  const k = rnd(4), nx = x + DX4[k], ny = y + DY4[k];
  if (!inb(nx, ny)) return;
  const j = ny * W + nx, nm = mat[j];
  if (nm === DIRT || nm === SAND) {
    swap(i, j);
    if (nm === SAND) mat[i] = DIRT;            // aerated into soil behind it
    return;
  }
  if (nm === EMPTY && y + 1 < H && mat[i + W] === EMPTY) swap(i, i + W);
}

/* Spider: climbs anything solid, eats bugs, and trails web behind it. */
function updSpider(x, y, i, m) {
  touch(i);
  const got = creatureScan(x, y, i, true, isBug, 140, EMPTY);
  if (got < 0) return;
  let e = Math.min(250, life[i] + got);
  if (e <= 1) { mat[i] = EMPTY; life[i] = 0; return; }
  /* Every 4th step, not every 2nd. At 1 per 2 steps a spider starved inside ~500
     steps even sitting in a web full of prey, which reads as "spiders just die".
     A bug is worth 140 now as well - a spider that catches something should be
     set up for a while. */
  if ((frame & 3) === 0) e--;
  life[i] = e;
  let anchored = false;
  for (let dy = -1; dy <= 1 && !anchored; dy++) {
    for (let dx = -1; dx <= 1; dx++) {
      if (!dx && !dy) continue;
      const nx = x + dx, ny = y + dy;
      if (!inb(nx, ny)) continue;
      const nm = mat[ny * W + nx];
      if (nm !== EMPTY && MOVE[nm] === 0) { anchored = true; break; }
    }
  }
  if (!anchored) {                             // nothing to hold: it drops
    if (y + 1 < H && mat[i + W] === EMPTY) swap(i, i + W);
    return;
  }
  // a spider walks its own silk - without this its web blocks its route to the
  // prey the web just caught, and it actually took FEWER bugs (1.8 vs 2.3)
  if (Math.random() < 0.25 && seekStep(x, y, i, 5, isBug, t => t === EMPTY || t === WEB || t === INFWEB)) return;
  if (Math.random() > 0.5) return;
  const dx = rnd(3) - 1, dy = rnd(3) - 1;
  if (!dx && !dy) return;
  const nx = x + dx, ny = y + dy;
  if (!inb(nx, ny)) return;
  const j = ny * W + nx;
  if (mat[j] !== EMPTY) return;
  swap(i, j);
  if (Math.random() < 0.18) { mat[i] = WEB; life[i] = 0; touch(i); }
}

/* Frog: hops on land, swims in water, eats bugs. */
function updFrog(x, y, i, m) {
  touch(i);
  const got = creatureScan(x, y, i, false, isBug, 90, EMPTY);
  if (got < 0) return;
  let e = Math.min(250, life[i] + got);
  if (e <= 1) { mat[i] = EMPTY; life[i] = 0; return; }
  if ((frame & 3) === 0) e--;
  life[i] = e;
  let wet = false;
  for (let k = 0; k < 4 && !wet; k++) {
    const nx = x + DX4[k], ny = y + DY4[k];
    if (inb(nx, ny) && WET[mat[ny * W + nx]] === 1) wet = true;
  }
  if (wet) {
    const k = rnd(4), nx = x + DX4[k], ny = y + DY4[k];
    if (!inb(nx, ny)) return;
    const j = ny * W + nx;
    if (WET[mat[j]] === 1) swap(i, j);
    return;
  }
  if (Math.random() < 0.2 && seekStep(x, y, i, 5, isBug, isEmpty)) return;
  if (y + 1 < H && mat[i + W] === EMPTY) { swap(i, i + W); return; }
  if (Math.random() < 0.2) {                   // hop
    const d = Math.random() < 0.5 ? -1 : 1;
    const nx = x + d, ny = y - 1;
    if (inb(nx, ny) && mat[ny * W + nx] === EMPTY) swap(i, ny * W + nx);
  }
}

/* Shark: eats fish, and cannot survive out of water at all. */
function updShark(x, y, i, m) {
  touch(i);
  const got = creatureScan(x, y, i, false, t => t === FISH || t === FROG, 110, WATER);
  if (got < 0) return;
  let e = Math.min(250, life[i] + got);
  let wet = 0;
  for (let k = 0; k < 4; k++) {
    const nx = x + DX4[k], ny = y + DY4[k];
    if (inb(nx, ny) && WET[mat[ny * W + nx]] === 1) wet++;
  }
  if (wet === 0) e = e > 8 ? e - 8 : 0;        // suffocates fast when beached
  if (e <= 1) { mat[i] = EMPTY; life[i] = 0; return; }
  if ((frame & 3) === 0) e--;
  life[i] = e;
  if (wet === 0) {
    if (y + 1 < H && mat[i + W] === EMPTY) swap(i, i + W);
    return;
  }
  if (Math.random() < 0.3 && seekStep(x, y, i, 6, t => t === FISH, isWater)) return;
  const k = rnd(4), nx = x + DX4[k], ny = y + DY4[k];
  if (!inb(nx, ny)) return;
  const j = ny * W + nx;
  if (WET[mat[j]] === 1) swap(i, j);
}

/* -------------------------------------------------------- electricity ---- */
/* How many cells a charge can cross before it fades. This doubles as how long
   a cell stays lit, so it is a trade: too low and you cannot wire anything up
   across the map, too high and a cut wire glows for ages. 120 cells covers most
   useful runs and drains in about four seconds at 30 FPS. */
const CHARGE_MAX = 120;

function updMetal(x, y, i, m) {
  const l = life[i];
  if (l === 0) return;                           // a dead wire costs nothing
  touch(i);
  if (SLOW[m] === 1 && (frame & 1) === 1) return;  // iron idles alternate steps
  life[i] = l - 1;
  const nl = l - 1;
  const hops = HOPS[m];
  for (let k = 0; k < 4; k++) {
    // walk up to `hops` cells along this direction, but only through conductor
    for (let h = 1; h <= hops; h++) {
      const nx = x + DX4[k] * h, ny = y + DY4[k] * h;
      if (!inb(nx, ny)) break;
      const j = ny * W + nx, nm = mat[j];
      if (nm === EMPTY) break;
      if (PWR[nm] === 1) {                       // current walks the wire
        const give = nl - (h - 1);               // one unit lost per cell crossed
        if (give > 0 && life[j] < give) {
          life[j] = give; touch(j);
          // claim it for this step, or it would re-propagate the moment the
          // scan reaches it and the charge would cross the whole wire at once
          moved[j] = 1;
        }
        continue;
      }
      if (h === 1) {                             // only what it directly touches
        if (WET[nm] === 1 || nm === ACID) {      // live wire in a puddle
          mat[j] = SPARK; life[j] = 5; moved[j] = 1; touch(j);
        } else {
          const NM = MATS[nm];
          if (EXPL[nm] === 1) { if (life[j] === 0) { life[j] = FUSE[nm] || (1 + rnd(4)); touch(j); } }
          else if (FLAM[nm] === 1 && Math.random() < 0.12) ignite(j, nm);
          else if (nm === ICE) { mat[j] = WATER; life[j] = 0; touch(j); }
        }
      }
      break;                                     // a non-conductor stops the run
    }
  }
}

/* Fan: shoves loose matter away from itself. */
function updFan(x, y, i, m) {
  if (life[i] === 0) return;
  touch(i);
  life[i]--;
  const R = 15, R2 = R * R;
  for (let yy = y - R; yy <= y + R; yy++) {
    if (yy < 0 || yy >= H) continue;
    const dy = yy - y;
    for (let xx = x - R; xx <= x + R; xx++) {
      if (xx < 0 || xx >= W) continue;
      const dx = xx - x, d2 = dx * dx + dy * dy;
      if (d2 === 0 || d2 > R2) continue;
      const j = yy * W + xx;
      if (MOVE[mat[j]] === 0 || mat[j] === EMPTY || moved[j]) continue;
      const push = 1 - Math.sqrt(d2) / R;
      if (Math.random() > 0.10 + push * 0.65) continue;
      const sx = dx > 0 ? 1 : dx < 0 ? -1 : 0;
      const sy = dy > 0 ? 1 : dy < 0 ? -1 : 0;
      let tx = xx, ty = yy;
      if (Math.abs(dx) > Math.abs(dy)) { tx += sx; if (Math.random() < 0.35) ty += sy; }
      else                             { ty += sy; if (Math.random() < 0.35) tx += sx; }
      if (tx < 0 || tx >= W || ty < 0 || ty >= H) continue;
      const t = ty * W + tx, tm = mat[t];
      if (tm === EMPTY || (MOVE[tm] === 1 && DENS[tm] < DENS[mat[j]])) swap(j, t);
    }
  }
}

/* Cooler: the opposite of the heater, over a much wider radius - freezes water
   to ice, condenses steam, kills fire, and sets lava back to stone. */
function updCooler(x, y, i, m) {
  if (life[i] === 0) return;
  touch(i);
  life[i]--;
  const R = 13, R2 = R * R;
  for (let yy = y - R; yy <= y + R; yy++) {
    if (yy < 0 || yy >= H) continue;
    const dy = yy - y;
    for (let xx = x - R; xx <= x + R; xx++) {
      if (xx < 0 || xx >= W) continue;
      const dx = xx - x, d2 = dx * dx + dy * dy;
      if (d2 === 0 || d2 > R2) continue;
      const j = yy * W + xx, nm = mat[j];
      const chill = 1 - Math.sqrt(d2) / R;
      if      (nm === FIRE)  { mat[j] = SMOKE; life[j] = 30 + rnd(30); touch(j); }
      else if (nm === STEAM) { mat[j] = WATER; life[j] = 0; touch(j); }
      else if (nm === LAVA  && Math.random() < 0.10 * chill) { mat[j] = STONE; life[j] = 0; touch(j); }
      else if (nm === WATER && Math.random() < 0.14 * chill) { mat[j] = ICE;   life[j] = 0; touch(j); }
    }
  }
}

/* Shared by every source: shove full charge into any powered neighbour. */
function energise(x, y) {
  for (let k = 0; k < 4; k++) {
    const nx = x + DX4[k], ny = y + DY4[k];
    if (!inb(nx, ny)) continue;
    const j = ny * W + nx;
    if (PWR[mat[j]] === 1 && life[j] < CHARGE_MAX) { life[j] = CHARGE_MAX; touch(j); }
  }
}

function updBatt(x, y, i, m) {
  touch(i);                                      // a battery never sleeps
  energise(x, y);
}

/* Dynamo: ~16 frames on, ~16 off, so it drives blinkers and repeating circuits. */
function updDynamo(x, y, i, m) {
  touch(i);
  if (((frame >> 4) & 1) === 0) return;
  energise(x, y);
}

/* Sensor: turns heat back into current, which is what makes automatic circuits
   possible - fire alarm wired to a charge, say. */
function updSensor(x, y, i, m) {
  touch(i);
  for (let dy = -1; dy <= 1; dy++) {
    for (let dx = -1; dx <= 1; dx++) {
      if (!dx && !dy) continue;
      const nx = x + dx, ny = y + dy;
      if (!inb(nx, ny)) continue;
      const nm = mat[ny * W + nx];
      if (nm === FIRE || nm === LAVA || nm === SPARK) { energise(x, y); return; }
    }
  }
}

/* Lamp: a terminal - it takes charge and shows it, but does not pass it on. */
function updLamp(x, y, i, m) {
  if (life[i] === 0) return;
  touch(i);
  life[i]--;
}

/* Heater: the other terminal - turns charge back into heat. */
function updHeater(x, y, i, m) {
  if (life[i] === 0) return;
  touch(i);
  life[i]--;
  for (let k = 0; k < 4; k++) {
    const nx = x + DX4[k], ny = y + DY4[k];
    if (!inb(nx, ny)) continue;
    const j = ny * W + nx, nm = mat[j];
    if (nm === EMPTY) continue;
    if      (nm === ICE)                          { mat[j] = WATER; life[j] = 0; touch(j); }
    else if (nm === WATER && Math.random() < 0.2) { mat[j] = STEAM; life[j] = 90 + rnd(60); touch(j); }
    else if (EXPL[nm] === 1) { if (life[j] === 0) { life[j] = FUSE[nm] || (1 + rnd(4)); touch(j); } }
    else if (FLAM[nm] === 1 && Math.random() < 0.35) ignite(j, nm);
    else if (nm === SAND  && Math.random() < 0.02) { mat[j] = GLASS; touch(j); }
  }
  // a hot enough coil sets the air alight on its own
  if (life[i] > 20) {
    const k = rnd(4), nx = x + DX4[k], ny = y + DY4[k];
    if (inb(nx, ny)) {
      const j = ny * W + nx;
      if (mat[j] === EMPTY && Math.random() < 0.12) {
        mat[j] = FIRE; life[j] = 20 + rnd(20); moved[j] = 1; touch(j);
      }
    }
  }
}

/* -------------------------------------------------------------- step ----- */
let frame = 0;

function cell(x, y, i) {
  const m = mat[i];
  if (m === EMPTY || moved[i]) return;
  const f = RULES[m];
  if (f !== null) f(x, y, i, m);
}

/* Weather. 0 = clear, 1 = rain, 2 = snow. Cells are sprinkled along the top row
   and then simply fall - there is no weather system, only more of the sand
   already falling, which is why it costs nothing when it is off. */
let weather = 0;

function stepWeather() {
  if (weather === 0) return;
  const drops = weather === 1 ? 3 : 2;
  for (let d = 0; d < drops; d++) {
    const x = rnd(W);
    if (mat[x] !== EMPTY) continue;            // do not stack up on the ceiling
    mat[x] = weather === 1 ? WATER : SNOW;
    life[x] = 0;
    touch(x);
  }
}

function step() {
  moved.fill(0);
  actNext.fill(0);
  heartsPrev = heartsNow; heartsNow = 0;   // what last step actually found
  if (heartsPrev === 0) heartAge = 0;      // nothing beating - the clock restarts
  stepWeather();
  stepWaves();
  for (let y = H - 1; y >= 0; y--) {
    // alternate scan direction so liquids do not all drift one way
    const dir = ((frame + y) & 1) ? 1 : -1;
    const row = y * W, cbase = ((y / CW) | 0) * CX;
    if (dir === 1) {
      for (let cx = 0; cx < CX; cx++) {
        if (actNow[cbase + cx] === 0) continue;         // whole chunk asleep
        const xs = cx * CW, xe = Math.min(W, xs + CW);
        for (let x = xs; x < xe; x++) cell(x, y, row + x);
      }
    } else {
      for (let cx = CX - 1; cx >= 0; cx--) {
        if (actNow[cbase + cx] === 0) continue;
        const xs = cx * CW, xe = Math.min(W, xs + CW);
        for (let x = xe - 1; x >= xs; x--) cell(x, y, row + x);
      }
    }
  }
  actNow.set(actNext);
  frame++;
}

/* ------------------------------------------------------------ render ----- */
const cv  = document.getElementById("cv");
const ctx = cv.getContext("2d", { alpha: false });
const off = document.createElement("canvas");
off.width = W; off.height = H;
const octx = off.getContext("2d", { alpha: false });
const img  = octx.createImageData(W, H);
const buf  = new Uint32Array(img.data.buffer);

/* ---------------------------------------------------------------- view --- */
/* Powers of two only, so the source rectangle divides both 400 and 240 exactly
   and every cell stays a crisp square block at any zoom. */
const ZOOMS = [1, 2, 4, 8, 16];
let zoomIx = 0, panX = 0, panY = 0;
const viewW = () => W / ZOOMS[zoomIx];
const viewH = () => H / ZOOMS[zoomIx];

function clampPan() {
  panX = Math.max(0, Math.min(W - viewW(), Math.round(panX)));
  panY = Math.max(0, Math.min(H - viewH(), Math.round(panY)));
}
/* Zoom about a point, so whatever is under the cursor stays under it. */
function zoomAt(fx, fy, dir) {
  const nx = Math.max(0, Math.min(ZOOMS.length - 1, zoomIx + dir));
  if (nx === zoomIx) return;
  const wx = panX + fx * viewW(), wy = panY + fy * viewH();
  zoomIx = nx;
  panX = wx - fx * viewW();
  panY = wy - fy * viewH();
  clampPan();
}
function resetView() { zoomIx = 0; panX = 0; panY = 0; }

function render() {
  const flash = (frame >> 1) & 1;          // lit charges blink white
  for (let i = 0; i < N; i++) {
    const m = mat[i];
    if (m === FIRE) buf[i] = fireColor(life[i]);
    else if (GLOWS[m] === 1 && life[i] > 0) buf[i] = glowColor(m, life[i]);
    else if (flash && EXPL[m] === 1 && life[i] > 0) buf[i] = 0xFFFFFFFF;
    else buf[i] = PAL[m][noise[i] & 7];
  }
  octx.putImageData(img, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(off, panX, panY, viewW(), viewH(), 0, 0, cv.width, cv.height);
}

function fit() {
  const st = document.getElementById("stage");
  const s = Math.max(1, Math.floor(Math.min(
    (st.clientWidth  - 24) / W,
    (st.clientHeight - 24) / H)));
  cv.width  = W * s;
  cv.height = H * s;
}
window.addEventListener("resize", fit);

/* --------------------------------------------------------------- ui ------ */
let sel = SAND, brush = 6, paused = false, lowPower = true, erasing = false;

/* Grouped, because a flat list of 45 materials is unusable. Anything not named
   here still shows up, under Other, so a new material is never invisible. */
const GROUPS = [
  ["Earth & liquid", [SAND, DIRT, STONE, GLASS, WALL, WATER, OIL, ACID, SNOW]],
  ["Fire & heat",    [FIRE, LAVA, ICE, STEAM, SMOKE, WOOD, TORCH]],
  ["Explosive",      [POWDR, BOMB, NUKE, MEGA, HOLE, FWORK, BALLOON]],
  ["Plants",         [SEED, SAPLING, LEAF, PLANT, MOSS, MOLD, ALGAE, SHROOM]],
  ["Animals",        [BUG, WORM, BEE, BEEHIVE, HONEY, BIRD, SPIDER, HIVE, WEB, FROG, FISH, SHARK, MOTH]],
  ["Electric",       [SPARK, COPPER, METAL, IRON, RUBBER, SWITCH, BATT, DYNAMO,
                      SENSOR, LAMP, LEDR, LEDG, LEDB, HEATER, COOLER, FAN]],
  ["Unreal",         [HEART, BLOOM, HUSK, PFIRE, EGG, SPORE, TENDRIL, INFDIRT, INFSTONE, INFWATER, INFWOOD,
                      INFMETAL, INFPLANT, INFLEAF, INFBUG, INFWORM, INFBEE,
                      INFBIRD, INFSPIDER, INFFROG, INFFISH, INFSHARK,
                      INFOIL, INFMOTH, INFWEB]],
  ["Tools",          [EMPTY, CLONER, VOID, MAGNET, CURE]],
];

const palEl = document.getElementById("pal");
function addSwatch(m) {
  const b = document.createElement("button");
  b.className = "mb" + (m.id === sel ? " on" : "");
  b.dataset.id = m.id;
  b.innerHTML = `<span class="sw" style="background:${m.col}"></span>` +
                `<span>${m.name}</span><span class="k">${m.key || ""}</span>`;
  b.onclick = () => setSel(m.id);
  palEl.appendChild(b);
}
(function buildPalette() {
  const placed = new Set();
  for (const [title, ids] of GROUPS) {
    const shown = ids.filter(id => !MATS[id].hidden);
    if (!shown.length) continue;
    const h = document.createElement("div");
    h.className = "grp";
    h.textContent = title;
    palEl.appendChild(h);
    for (const id of shown) { addSwatch(MATS[id]); placed.add(id); }
  }
  const rest = MATS.filter(m => !m.hidden && !placed.has(m.id));
  if (rest.length) {
    const h = document.createElement("div");
    h.className = "grp";
    h.textContent = "Other";
    palEl.appendChild(h);
    rest.forEach(addSwatch);
  }
})();
function setSel(id) {
  sel = id;
  [...palEl.children].forEach(b => {
    if (b.dataset.id !== undefined) b.classList.toggle("on", +b.dataset.id === id);
  });
}

const brushEl = document.getElementById("brush"), bszEl = document.getElementById("bsz");
brushEl.oninput = () => { brush = +brushEl.value; bszEl.textContent = brush; };

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove("show"), 1400);
}

/* place one cell, giving timed materials their starting life */
function place(i, m) {
  mat[i] = m;
  life[i] = m === FIRE  ? 40 + rnd(40)
          : m === SMOKE ? 80 + rnd(70)
          : m === STEAM ? 90 + rnd(70)
          : (m === BUG || m === FISH || m === BIRD || m === BEE ||
             m === WORM || m === SPIDER || m === FROG || m === SHARK ||
             m === INFBUG || m === INFFISH || m === INFBIRD ||
             m === INFBEE || m === INFSPIDER || m === INFWORM ||
             m === INFFROG || m === INFSHARK)
              ? 90 + rnd(60)                           // starting energy
          : m === HEART ? 20
          : m === SPORE ? 70 + rnd(70)
          : m === TENDRIL ? 30                       // how far it can still grow
          : m === EGG ? 120 + rnd(120)               // time to hatch
          : m === SAPLING ? 1                          // height grown so far
          : 0;
  touch(i);
  actNow[CHUNK[i]] = 1;      // painting must wake the chunk for THIS step too
}

function paint(cx, cy, m) {
  // one per click regardless of brush - each of these is an area scan, and a
  // brushful of them would crawl
  if (m === HOLE || m === MAGNET) {
    if (cx >= 0 && cx < W && cy >= 0 && cy < H) place(cy * W + cx, m);
    return;
  }
  const r = brush, r2 = r * r;
  // scattering powders/liquids as they are drawn stops solid rectangular blobs
  const scatter = MATS[m].movable && m !== EMPTY ? 0.65 : 1;
  for (let y = cy - r; y <= cy + r; y++) {
    if (y < 0 || y >= H) continue;
    for (let x = cx - r; x <= cx + r; x++) {
      if (x < 0 || x >= W) continue;
      const dx = x - cx, dy = y - cy;
      if (dx * dx + dy * dy > r2) continue;
      if (scatter < 1 && Math.random() > scatter) continue;
      const i = y * W + x;
      if (m !== EMPTY && mat[i] === WALL) continue;   // walls are protected
      place(i, m);
    }
  }
}

let drawing = false, lastX = -1, lastY = -1;
let panning = false, panFromX = 0, panFromY = 0, panOrigX = 0, panOrigY = 0;

/* Fraction across the canvas, 0..1 - the basis for both picking and zooming. */
function canvasFrac(ev) {
  const r = cv.getBoundingClientRect();
  return [(ev.clientX - r.left) / r.width, (ev.clientY - r.top) / r.height];
}
function cellAt(ev) {
  const [fx, fy] = canvasFrac(ev);
  return [Math.floor(panX + fx * viewW()), Math.floor(panY + fy * viewH())];
}
function strokeTo(x, y, m) {
  if (lastX < 0) { paint(x, y, m); }
  else {                                            // interpolate fast drags
    const dx = x - lastX, dy = y - lastY;
    const n = Math.max(1, Math.max(Math.abs(dx), Math.abs(dy)));
    for (let k = 0; k <= n; k++)
      paint(Math.round(lastX + dx * k / n), Math.round(lastY + dy * k / n), m);
  }
  lastX = x; lastY = y;
}

cv.addEventListener("contextmenu", e => e.preventDefault());
/* Clicking an existing switch flips the whole connected run of switch cells, so
   a switch you drew with a fat brush behaves as one switch rather than hundreds. */
function toggleSwitch(start) {
  const want = mat[start] === SWITCH ? SWITCHON : SWITCH;
  const stack = [start], seen = new Set([start]);
  while (stack.length) {
    const i = stack.pop();
    mat[i] = want;
    if (want === SWITCH) life[i] = 0;            // opening it kills the charge
    touch(i); actNow[CHUNK[i]] = 1;
    const x = i % W, y = (i / W) | 0;
    for (let k = 0; k < 4; k++) {
      const nx = x + DX4[k], ny = y + DY4[k];
      if (!inb(nx, ny)) continue;
      const j = ny * W + nx;
      if (seen.has(j)) continue;
      if (mat[j] === SWITCH || mat[j] === SWITCHON) { seen.add(j); stack.push(j); }
    }
  }
  return seen.size;
}

cv.addEventListener("mousedown", e => {
  if (e.button === 1) {                    // middle button drags the view
    e.preventDefault();
    panning = true;
    panFromX = e.clientX; panFromY = e.clientY;
    panOrigX = panX;      panOrigY = panY;
    return;
  }
  erasing = e.button === 2;
  const [x, y] = cellAt(e);
  if (!erasing && sel === SPARK) {   // lightning is one bolt per click, not a brush
    strike(x);
    return;
  }
  if (!erasing && sel === SWITCH && x >= 0 && x < W && y >= 0 && y < H) {
    const i = y * W + x;
    if (mat[i] === SWITCH || mat[i] === SWITCHON) {
      const n = toggleSwitch(i);
      toast((mat[i] === SWITCHON ? "Switch closed" : "Switch open") + " (" + n + " cells)");
      return;
    }
  }
  drawing = true; lastX = lastY = -1;
  strokeTo(x, y, erasing ? EMPTY : sel);
});
window.addEventListener("mousemove", e => {
  if (panning) {
    const r = cv.getBoundingClientRect();
    panX = panOrigX - (e.clientX - panFromX) / r.width  * viewW();
    panY = panOrigY - (e.clientY - panFromY) / r.height * viewH();
    clampPan();
    return;
  }
  if (!drawing) return;
  const [x, y] = cellAt(e);
  strokeTo(x, y, erasing ? EMPTY : sel);
});
window.addEventListener("mouseup", () => {
  drawing = false; panning = false; lastX = lastY = -1;
});
cv.addEventListener("wheel", e => {
  e.preventDefault();
  if (e.shiftKey) {                        // shift+wheel still sizes the brush
    brush = Math.max(1, Math.min(40, brush + (e.deltaY < 0 ? 1 : -1)));
    brushEl.value = brush; bszEl.textContent = brush;
    return;
  }
  const [fx, fy] = canvasFrac(e);
  zoomAt(fx, fy, e.deltaY < 0 ? 1 : -1);
}, { passive: false });

/* ------------------------------------------------------------ actions ---- */
const bPause = document.getElementById("bPause"),
      bLow   = document.getElementById("bLow"),
      bWild  = document.getElementById("bWild"),
      bWeather = document.getElementById("bWeather");

function togglePause() {
  paused = !paused;
  bPause.textContent = paused ? "Resume" : "Pause";
  bPause.classList.toggle("on", paused);
}
function clearWorld() {
  mat.fill(EMPTY); life.fill(0); waves.length = 0;
  heartsPrev = heartsNow = 0;
  wakeAll();
  toast("Cleared");
}
/* Wild hearts: let a heart grow by itself deep inside a big mold mass. Off by
   default, because an uninvited heart wakes every scrap of mold in the world. */
function toggleWild() {
  wildHearts = !wildHearts;
  bWild.classList.toggle("on", wildHearts);
  toast(wildHearts ? "Wild hearts: mold can grow its own" : "Wild hearts off: place hearts yourself");
}
/* Weather cycles clear -> rain -> snow, because three states want one button
   rather than two. */
function cycleWeather() {
  weather = (weather + 1) % 3;
  const name = weather === 0 ? "off" : weather === 1 ? "rain" : "snow";
  bWeather.textContent = "Weather: " + name;
  bWeather.classList.toggle("on", weather !== 0);
  toast(weather === 0 ? "Weather cleared" : weather === 1 ? "It is raining" : "It is snowing");
}
function toggleLow() {
  lowPower = !lowPower;
  bLow.classList.toggle("on", lowPower);
  toast(lowPower ? "Low power: 30 FPS" : "Full speed: 60 FPS");
}

/* Save/load uses run-length encoding, which crushes a mostly-empty world down
   to a few hundred bytes and fits comfortably in localStorage. */
function saveWorld() {
  const parts = [];
  let cur = mat[0], run = 1;
  for (let i = 1; i < N; i++) {
    if (mat[i] === cur && run < 65000) { run++; }
    else { parts.push(cur + ":" + run); cur = mat[i]; run = 1; }
  }
  parts.push(cur + ":" + run);
  try {
    localStorage.setItem("cinder.world", parts.join(","));
    toast("Saved");
  } catch (e) { toast("Save failed: " + e.message); }
}
function loadWorld() {
  const s = localStorage.getItem("cinder.world");
  if (!s) { toast("No save found"); return; }
  let i = 0;
  for (const p of s.split(",")) {
    const c = p.indexOf(":");
    const m = +p.slice(0, c), run = +p.slice(c + 1);
    for (let k = 0; k < run && i < N; k++, i++) { mat[i] = m; life[i] = 0; }
  }
  while (i < N) { mat[i] = EMPTY; life[i++] = 0; }
  waves.length = 0;
  wakeAll();
  toast("Loaded");
}

document.getElementById("bStep").onclick  = () => { if (paused) step(); };
document.getElementById("bClear").onclick = clearWorld;
document.getElementById("bSave").onclick  = saveWorld;
document.getElementById("bLoad").onclick  = loadWorld;
document.getElementById("bFit").onclick   = resetView;
document.getElementById("bZoom").onclick  = () => zoomAt(0.5, 0.5, 1);
bPause.onclick = togglePause;
bLow.onclick   = toggleLow;
bWild.onclick  = toggleWild;
bWeather.onclick = cycleWeather;
bLow.classList.add("on");

const KEYMAP = {};
MATS.forEach(m => { if (!m.hidden && m.key) KEYMAP[m.key.toLowerCase()] = m.id; });
window.addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  if (k === " ")      { e.preventDefault(); togglePause(); return; }
  if (k === ".")      { if (paused) step(); return; }
  if (k === "c")      { clearWorld(); return; }
  if (k === "s")      { saveWorld(); return; }
  if (k === "l")      { loadWorld(); return; }
  if (k === "[")      { brush = Math.max(1, brush - 2);  brushEl.value = brush; bszEl.textContent = brush; return; }
  if (k === "]")      { brush = Math.min(40, brush + 2); brushEl.value = brush; bszEl.textContent = brush; return; }
  if (k === "home")   { resetView(); return; }
  if (k === "+" || k === "=") { zoomAt(0.5, 0.5,  1); return; }
  if (k === "-")              { zoomAt(0.5, 0.5, -1); return; }
  if (k === "arrowleft")  { e.preventDefault(); panX -= viewW() * 0.15; clampPan(); return; }
  if (k === "arrowright") { e.preventDefault(); panX += viewW() * 0.15; clampPan(); return; }
  if (k === "arrowup")    { e.preventDefault(); panY -= viewH() * 0.15; clampPan(); return; }
  if (k === "arrowdown")  { e.preventDefault(); panY += viewH() * 0.15; clampPan(); return; }
  if (k in KEYMAP)    setSel(KEYMAP[k]);
});

/* -------------------------------------------------------------- start ---- */
function seed() {
  // a floor of stone, a basin of water, and something to set on fire
  for (let x = 0; x < W; x++) {
    for (let y = H - 8; y < H; y++) mat[y * W + x] = STONE;
    mat[(H - 1) * W + x] = WALL;
  }
  for (let y = H - 40; y < H - 8; y++) {
    mat[y * W + 0] = WALL; mat[y * W + W - 1] = WALL;
  }
  for (let y = H - 34; y < H - 8; y++)
    for (let x = 40; x < 150; x++) mat[y * W + x] = WATER;
  for (let y = H - 30; y < H - 8; y++)
    for (let x = 250; x < 300; x++) if (Math.random() < 0.9) mat[y * W + x] = WOOD;
  for (let y = H - 48; y < H - 34; y++)
    for (let x = 320; x < 370; x++) if (Math.random() < 0.85) mat[y * W + x] = SAND;
}

const statEl = document.getElementById("stat");
let acc = 0, lastT = performance.now(), fps = 0, fpsT = 0, fpsN = 0;

function loop(t) {
  requestAnimationFrame(loop);
  const dt = t - lastT;
  const target = lowPower ? 1000 / 30 : 1000 / 60;
  acc += dt; lastT = t;
  if (acc < target) return;
  acc = Math.min(acc - target, target);   // never spiral on a slow frame

  if (!paused) step();
  render();

  fpsN++; fpsT += dt;
  if (fpsT >= 500) { fps = Math.round(fpsN * 1000 / fpsT); fpsN = 0; fpsT = 0; }

  let filled = 0;
  for (let i = 0; i < N; i += 7) if (mat[i] !== EMPTY) filled++;
  statEl.innerHTML =
    `grid   ${W} x ${H}<br>` +
    `filled ${Math.round(filled / (N / 7) * 100)}%<br>` +
    `zoom   ${ZOOMS[zoomIx]}x @ ${panX},${panY}<br>` +
    `fps    ${fps}${paused ? " (paused)" : ""}` +
    (heartsPrev > 0
      ? `<br><span style="color:#f5e13a">UNREAL: ${heartsPrev} heart beating</span>`
      : "");
}

fit();
seed();
requestAnimationFrame(loop);
</script>
</body>
</html>
