<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lantern Hollow</title>
<style>
  html,body{margin:0;height:100%;background:#14100f;overflow:hidden;
    font-family:'Georgia','Times New Roman',serif;color:#f0e2cc}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  /* 960x540 is 16:9 -- scale to fit the window so the HUD is never clipped */
  canvas{image-rendering:auto;box-shadow:0 0 60px rgba(0,0,0,.8);border-radius:4px;cursor:pointer;
    width:min(100vw, calc(100vh * 1.77778));
    height:min(100vh, calc(100vw / 1.77778))}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="960" height="540"></canvas></div>
<script>
"use strict";
(function(){

//==============================================================
// DATA
//==============================================================
const W=960, H=540;

const CROPS = {
  mint:      {name:'Mint',       color:'#6fbf73', dark:'#3f8a52', seed:4,  hours:5,  yield:3, tag:'bright'},
  chamomile: {name:'Chamomile',  color:'#f2e6a8', dark:'#c9b45f', seed:5,  hours:6,  yield:3, tag:'soothing'},
  lavender:  {name:'Lavender',   color:'#b3a0e0', dark:'#7a68ad', seed:7,  hours:7,  yield:2, tag:'floral'},
  ginger:    {name:'Ginger',     color:'#e0a066', dark:'#a86f38', seed:9,  hours:8,  yield:2, tag:'warming'},
  rosehip:   {name:'Rosehip',    color:'#e0736b', dark:'#a8443f', seed:11, hours:9,  yield:2, tag:'bright'},
  honeybloom:{name:'Honeybloom', color:'#f0c04a', dark:'#bd8c1e', seed:14, hours:10, yield:2, tag:'sweet'},
};
const CROP_IDS = Object.keys(CROPS);

const TAGS = ['soothing','warming','sweet','deep','floral','bright'];
const TAG_WORD = {
  soothing:'something soothing', warming:'something warming', sweet:'something sweet',
  deep:'something deep and quiet', floral:'something floral', bright:'something bright'
};

const TEAS = {
  'chamomile+chamomile':{name:'Plain Chamomile',  tag:'soothing'},
  'chamomile+ginger':   {name:'Hearthsettle',     tag:'warming'},
  'chamomile+honeybloom':{name:'Milk of Evening', tag:'sweet'},
  'chamomile+lavender': {name:'Dusk Lull',        tag:'deep'},
  'chamomile+mint':     {name:'Calm Dew',         tag:'soothing'},
  'chamomile+rosehip':  {name:'Rose Quiet',       tag:'soothing'},
  'ginger+ginger':      {name:'Bare Ginger',      tag:'warming'},
  'ginger+honeybloom':  {name:'Goldspice',        tag:'sweet'},
  'ginger+lavender':    {name:'Purple Ash',       tag:'deep'},
  'ginger+mint':        {name:'Emberroot',        tag:'warming'},
  'ginger+rosehip':     {name:'Autumn Bite',      tag:'warming'},
  'honeybloom+honeybloom':{name:'Honeybloom Plain',tag:'sweet'},
  'honeybloom+lavender':{name:'Bee Vespers',      tag:'floral'},
  'honeybloom+mint':    {name:'Green Honey',      tag:'sweet'},
  'honeybloom+rosehip': {name:'Sunblush',         tag:'bright'},
  'lavender+lavender':  {name:'Lone Lavender',    tag:'floral'},
  'lavender+mint':      {name:'Cool Fern',        tag:'floral'},
  'lavender+rosehip':   {name:'Violet Hour',      tag:'floral'},
  'mint+mint':          {name:'Simple Mint',      tag:'bright'},
  'mint+rosehip':       {name:'Bright Thicket',   tag:'bright'},
  'rosehip+rosehip':    {name:'Rosehip Plain',    tag:'bright'},
};
function teaKey(a,b){ return [a,b].sort().join('+'); }
function teaFor(a,b){ return TEAS[teaKey(a,b)] || null; }
const TEAS_BY_TAG = {};
for(const t of TAGS) TEAS_BY_TAG[t]=[];
for(const k in TEAS) TEAS_BY_TAG[TEAS[k].tag].push(k);

// The regulars. Everyone who walks in is one of these twelve -- serve someone their
// favourite three times and they start coming back for it by name.
const REGULAR_AT = 3;
const FOLK = [
  {id:'pell',   name:'Pell',    color:'#c98c6a', fav:'chamomile+mint',
   about:'a slow walker with mud on both knees',
   story:['Pell comes in off the hill road and never sits down straight away.',
          'He keeps a list of every bird he has seen this year. It is not a short list.',
          'He says the hollow smells like his grandmother\'s back step.',
          'He has started leaving the door open behind him, the way family does.',
          'Pell says he walks the long way now, just to end up here.']},
  {id:'maren',  name:'Maren',   color:'#8ab0c9', fav:'ginger+rosehip',
   about:'always cold, even in summer',
   story:['Maren orders something sharp and holds the cup with both hands.',
          'She mends nets down at the water and her fingers are always raw.',
          'She asked, carefully, whether you are here every day.',
          'She brought you a coil of good rope. She would not say why.',
          'Maren says this is the only warm hour in her week.']},
  {id:'tobin',  name:'Tobin',   color:'#c9a8d4', fav:'honeybloom+mint',
   about:'talks with his hands',
   story:['Tobin talks the whole time he is drinking and somehow finishes first.',
          'He is building something in his yard. He will not say what.',
          'He drew you a diagram on a napkin. You have kept it.',
          'The thing in his yard has a roof now, apparently.',
          'Tobin wants you to come and see it when it is done.']},
  {id:'wren',   name:'Wren',    color:'#9dc98c', fav:'chamomile+lavender',
   about:'comes in near closing',
   story:['Wren arrives late and sits where the lamp does not quite reach.',
          'She does not sleep well. She says the tea helps more than it should.',
          'She stayed until you started stacking the stools tonight.',
          'She told you about the house she grew up in, and then stopped.',
          'Wren says she sleeps through, most nights now.']},
  {id:'odie',   name:'Odie',    color:'#d4b46a', fav:'lavender+rosehip',
   about:'smells faintly of woodsmoke',
   story:['Odie shakes the rain off in the doorway every single time.',
          'He cuts wood for half the valley and knows everybody\'s business.',
          'He has started saving the good gossip for you specifically.',
          'He fixed the loose board by the counter without mentioning it.',
          'Odie says a place is only a place until someone keeps it.']},
  {id:'sparrow',name:'Sparrow', color:'#c97f9a', fav:'honeybloom+rosehip',
   about:'small, quick, never still',
   story:['Sparrow is in and out before the cup has cooled.',
          'She runs messages between the farms and knows every shortcut.',
          'Today she stayed for a second cup. That is new.',
          'She has started calling this her halfway house.',
          'Sparrow says she plans her whole route around getting here.']},
  {id:'bram',   name:'Bram',    color:'#7fc9be', fav:'ginger+ginger',
   about:'enormous, extremely quiet',
   story:['Bram ducks under the doorframe and says almost nothing.',
          'He drinks it as hot as you can make it, without flinching.',
          'He nodded at you today. From him that is a speech.',
          'He carried the water barrels in before you could ask.',
          'Bram said thank you, out loud, and then looked at the floor.']},
  {id:'juniper',name:'Juniper', color:'#b09be0', fav:'lavender+lavender',
   about:'ink on her fingers',
   story:['Juniper writes in a small book between sips and covers it when you pass.',
          'She is copying something long out of an older book.',
          'She read you one line of it. It was about a garden.',
          'She says the copying is nearly done and she is dreading it.',
          'Juniper asked if she might write here instead of at home.']},
  {id:'fen',    name:'Fen',     color:'#d49b6a', fav:'chamomile+rosehip',
   about:'apologises for everything',
   story:['Fen says sorry when he opens the door, which is not necessary.',
          'He counts his coins twice before handing them over.',
          'He stopped apologising today, once, and seemed surprised.',
          'He asked for his usual instead of reading the whole list.',
          'Fen says it is nice to be somewhere he does not have to explain himself.']},
  {id:'clove',  name:'Clove',   color:'#e0a878', fav:'ginger+honeybloom',
   about:'laughs before the joke lands',
   story:['Clove is laughing when she comes in and you never learn at what.',
          'She keeps bees, badly, and has the marks to prove it.',
          'She brought you a jar of honey with a bit of comb still in it.',
          'She has decided your honeybloom is better than her own flowers.',
          'Clove wants to put a hive at the end of your garden.']},
  {id:'hollis', name:'Hollis',  color:'#9aa8c9', fav:'ginger+lavender',
   about:'watches the window more than the room',
   story:['Hollis takes the seat with the best view of the road.',
          'He is waiting on someone. He has been waiting a while.',
          'He said the letter finally came. He did not say what it said.',
          'He has stopped sitting by the window quite so much.',
          'Hollis says he is done waiting, and orders like he means it.']},
  {id:'mira',   name:'Mira',    color:'#8ec9a0', fav:'mint+rosehip',
   about:'covered in seed husks',
   story:['Mira brushes half a field off her coat before she sits.',
          'She grows things too, but for eating, and thinks you have it easy.',
          'She has started giving you advice about your beds. Some of it is good.',
          'She brought cuttings and would not take a coin for them.',
          'Mira says your hollow is the prettiest bit of ground in the valley.']},
];
const FOLK_BY_ID = {}; for(const f of FOLK) FOLK_BY_ID[f.id]=f;

// Things to spend coins on once the ground is all cleared
const SHOP_ITEMS = [
  {id:'bench', name:'Cushioned Bench',  cost:70,  kind:'use',
   desc:'Guests wait half again as long before giving up.'},
  {id:'rack',  name:'Drying Rack',      cost:85,  kind:'use',
   desc:'Dry herbs overnight into essences. A cup brewed with one pays double.'},
  {id:'stool', name:'A Fourth Stool',   cost:130, kind:'use',
   desc:'One more guest can wait at the counter.'},
  {id:'kettle',name:'Second Kettle',    cost:160, kind:'use',
   desc:'Keep two brewed cups on the counter at once.'},
  {id:'lamp',  name:'Brass Lamp',       cost:35,  kind:'decor', desc:'Warmer light after dark.'},
  {id:'rug',   name:'Worn Red Rug',     cost:45,  kind:'decor', desc:'Softens the floorboards.'},
  {id:'plant', name:'Window Fern',      cost:40,  kind:'decor', desc:'It leans toward the glass.'},
  {id:'cat',   name:'A Cat, Possibly',  cost:90,  kind:'decor', desc:'She decides where she sleeps.'},
];
const SHOP_BY_ID = {}; for(const s of SHOP_ITEMS) SHOP_BY_ID[s.id]=s;

const PLOT_COLS=6, PLOT_ROWS=3, PLOT_COUNT=PLOT_COLS*PLOT_ROWS;
const START_PLOTS=6;
const PLOT_COST = i => 30 + (i-START_PLOTS)*22;

const DAY_START=6, DAY_END=22;
const SECONDS_PER_HOUR=18.75;          // 16h day ≈ 5 real minutes
const WATER_DRAIN=8;                   // per in-game hour
const PATIENCE=100;                    // seconds
const SPAWN_MIN=11, SPAWN_MAX=20;
const MAX_QUEUE=3;

//==============================================================
// STATE
//==============================================================
let G = null;

function newGame(){
  const plots=[];
  for(let i=0;i<PLOT_COUNT;i++){
    plots.push({unlocked:i<START_PLOTS, crop:null, prog:0, water:0, ripe:false});
  }
  const seeds={}, herbs={}, essences={};
  for(const id of CROP_IDS){ seeds[id]=0; herbs[id]=0; essences[id]=0; }
  seeds.mint=3; seeds.chamomile=2;
  const folk={};
  for(const f of FOLK) folk[f.id]={hearts:0, served:0, read:0};
  return {
    coins:20, day:1, hour:DAY_START, t:0,
    plots, seeds, herbs, essences,
    room:'garden',
    slots:[null,null],         // each: {id, strong} or null
    held:[],                   // brewed cups waiting on the counter
    visitors:[], spawnTimer:12,
    discovered:{}, hearts:0, served:0, journal:false,
    folk, owned:{}, rack:[], letters:[],
    shop:false, guestbook:false, nightPanel:false, selCup:0, letterOpen:null,
    selSeed:'mint',
    toast:[], motes:[],
    hint:'Click a plot to plant. Water it. Come back when it is ripe.',
    ended:false
  };
}

const SAVE_KEY='lanternhollow.v2';   // v1 had no regulars, shop or rack
function save(){
  try{
    const s={...G, toast:[], motes:[], visitors:G.visitors.map(v=>({...v}))};
    localStorage.setItem(SAVE_KEY, JSON.stringify(s));
  }catch(e){}
}
function load(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(!raw) return false;
    const s=JSON.parse(raw);
    if(!s||!s.plots||s.plots.length!==PLOT_COUNT) return false;
    G=Object.assign(newGame(), s);
    G.toast=[]; G.motes=[];
    for(const id of CROP_IDS){
      if(typeof G.seeds[id]!=='number') G.seeds[id]=0;
      if(typeof G.herbs[id]!=='number') G.herbs[id]=0;
      if(typeof G.essences[id]!=='number') G.essences[id]=0;
    }
    // never trust a save to carry a full roster -- new folk can appear in updates
    if(!G.folk||typeof G.folk!=='object') G.folk={};
    for(const f of FOLK){
      const r=G.folk[f.id];
      if(!r||typeof r!=='object') G.folk[f.id]={hearts:0,served:0,read:0};
      else { r.hearts=r.hearts|0; r.served=r.served|0; r.read=r.read|0; }
    }
    if(!G.owned||typeof G.owned!=='object') G.owned={};
    if(!Array.isArray(G.rack)) G.rack=[];
    if(!Array.isArray(G.letters)) G.letters=[];
    if(!Array.isArray(G.held)) G.held=[];
    if(!Array.isArray(G.slots)||G.slots.length!==2) G.slots=[null,null];
    return true;
  }catch(e){ return false; }
}

//==============================================================
// HELPERS
//==============================================================
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=arr=>arr[(Math.random()*arr.length)|0];

function toast(msg,color){
  G.toast.push({msg,color:color||'#f0e2cc',life:3.2});
  if(G.toast.length>4) G.toast.shift();
}
function clockText(){
  const h=Math.floor(G.hour), m=Math.floor((G.hour%1)*60);
  const ap=h>=12?'pm':'am'; let hh=h%12; if(hh===0) hh=12;
  return hh+':'+String(m).padStart(2,'0')+ap;
}
function isOpen(){ return G.hour>=8 && G.hour<20; }

//==============================================================
// ACTIONS
//==============================================================
function plant(i, cropId){
  const p=G.plots[i];
  if(!p||!p.unlocked) return false;
  if(p.crop) return false;
  if((G.seeds[cropId]||0)<=0){ toast('No '+CROPS[cropId].name+' seeds.','#e0a0a0'); return false; }
  G.seeds[cropId]--;
  p.crop=cropId; p.prog=0; p.water=40; p.ripe=false;
  return true;
}
function water(i){
  const p=G.plots[i];
  if(!p||!p.crop||p.ripe) return false;
  if(p.water>=95) return false;
  p.water=100;
  return true;
}
function harvest(i){
  const p=G.plots[i];
  if(!p||!p.crop||!p.ripe) return false;
  const c=CROPS[p.crop];
  G.herbs[p.crop]=(G.herbs[p.crop]||0)+c.yield;
  let gotSeed=false;
  if(Math.random()<0.55){ G.seeds[p.crop]=(G.seeds[p.crop]||0)+1; gotSeed=true; }
  toast('+'+c.yield+' '+c.name+(gotSeed?' and a seed':''), c.color);
  p.crop=null; p.prog=0; p.water=0; p.ripe=false;
  return true;
}
function unlockPlot(i){
  const p=G.plots[i];
  if(!p||p.unlocked) return false;
  const unlockedCount=G.plots.filter(x=>x.unlocked).length;
  const cost=PLOT_COST(unlockedCount);
  if(G.coins<cost){ toast('Need '+cost+' coins to clear that ground.','#e0a0a0'); return false; }
  G.coins-=cost; p.unlocked=true;
  toast('Ground cleared.','#9dc98c');
  return true;
}
function buySeed(cropId){
  const c=CROPS[cropId];
  if(G.coins<c.seed){ toast('Not enough coins.','#e0a0a0'); return false; }
  G.coins-=c.seed; G.seeds[cropId]=(G.seeds[cropId]||0)+1;
  return true;
}
function cupCapacity(){ return G.owned.kettle?2:1; }
function patienceMax(){ return G.owned.bench?PATIENCE*1.5:PATIENCE; }
function queueMax(){ return G.owned.stool?4:MAX_QUEUE; }

function addSlot(cropId,strong){
  const pool=strong?G.essences:G.herbs;
  if((pool[cropId]||0)<=0) return false;
  const idx=G.slots.indexOf(null);
  if(idx<0) return false;
  pool[cropId]--; G.slots[idx]={id:cropId,strong:!!strong};
  return true;
}
function clearSlots(){
  for(let i=0;i<2;i++){
    const s=G.slots[i];
    if(s){ (s.strong?G.essences:G.herbs)[s.id]++; G.slots[i]=null; }
  }
}
function brew(){
  if(G.held.length>=cupCapacity()){
    toast('There is no room on the counter for another cup.','#e0a0a0'); return false;
  }
  if(!G.slots[0]||!G.slots[1]){ toast('The kettle needs two herbs.','#e0a0a0'); return false; }
  const a=G.slots[0], b=G.slots[1];
  const tea=teaFor(a.id,b.id), key=teaKey(a.id,b.id);
  const strong=a.strong||b.strong;
  G.slots=[null,null];
  G.held.push({key,name:tea.name,tag:tea.tag,strong});
  if(!G.discovered[key]){
    G.discovered[key]=true;
    toast('New tea discovered: '+tea.name+'!','#f0c04a');
  } else {
    toast('Brewed '+tea.name+(strong?', strong.':'.'),'#f0e2cc');
  }
  return true;
}
function serve(vid,cupIndex){
  if(!G.held.length) return false;
  const ci=clamp(cupIndex==null?0:cupIndex,0,G.held.length-1);
  const v=G.visitors.find(x=>x.id===vid);
  if(!v||v.state!=='waiting') return false;
  const tea=G.held[ci];
  G.held.splice(ci,1);
  const rec=G.folk[v.folk];
  let coins, heart=false, line;
  if(tea.key===v.favKey){
    coins=40; heart=true;
    line=v.name+': "This is the one. Exactly the one."';
  } else if(tea.tag===v.tag){
    coins=22;
    line=v.name+': "That is just right, thank you."';
    if(Math.random()<0.3) heart=true;
  } else {
    coins=8;
    line=v.name+': "Oh — not quite what I meant. It is still warm, though."';
  }
  if(tea.strong) coins*=2;
  if(rec&&rec.hearts>=REGULAR_AT) coins+=10;     // regulars tip
  G.coins+=coins; G.served++;
  if(rec){
    rec.served++;
    if(heart){
      rec.hearts++;
      if(rec.hearts===REGULAR_AT){
        toast(v.name+' is a regular now. They will ask for the usual.','#f0c04a');
        G.letters.push({folk:v.folk, day:G.day, idx:Math.min(rec.hearts,FOLK_BY_ID[v.folk].story.length)-1});
      } else if(rec.hearts<=FOLK_BY_ID[v.folk].story.length){
        G.letters.push({folk:v.folk, day:G.day, idx:rec.hearts-1});
      }
    }
  }
  if(heart) G.hearts++;
  v.state='leaving'; v.leaveT=0; v.happy=coins>=22;
  toast(line, coins>=22?'#9dc98c':'#e0c090');
  toast('+'+coins+' coins'+(tea.strong?' (strong)':'')+(heart?' and a warm feeling':''),'#f0c04a');
  return true;
}

function isRegular(folkId){ return (G.folk[folkId]||{}).hearts>=REGULAR_AT; }

function buyItem(itemId){
  const it=SHOP_BY_ID[itemId];
  if(!it) return false;
  if(G.owned[itemId]){ toast('You already have that.','#e0a0a0'); return false; }
  if(G.coins<it.cost){ toast('Not enough coins for the '+it.name+'.','#e0a0a0'); return false; }
  G.coins-=it.cost; G.owned[itemId]=true;
  toast(it.name+' — it suits the room.','#9dc98c');
  return true;
}

// ---- the drying rack: an evening job that pays off next morning ----
const RACK_SIZE=4;
function rackAdd(cropId){
  if(!G.owned.rack) return false;
  if(G.rack.length>=RACK_SIZE) return false;
  if((G.herbs[cropId]||0)<=0) return false;
  G.herbs[cropId]--; G.rack.push(cropId);
  return true;
}
function rackTakeBack(i){
  if(i<0||i>=G.rack.length) return false;
  G.herbs[G.rack[i]]++; G.rack.splice(i,1);
  return true;
}
function dryRackOvernight(){
  let n=0;
  for(const id of G.rack){ G.essences[id]=(G.essences[id]||0)+1; n++; }
  G.rack=[];
  return n;
}
function readLetter(i){
  const L=G.letters[i];
  if(!L) return null;
  G.letters.splice(i,1);
  const f=FOLK_BY_ID[L.folk];
  const rec=G.folk[L.folk];
  if(rec) rec.read=Math.max(rec.read,L.idx+1);
  // a small gift with the note
  const gift=pick(CROP_IDS);
  G.seeds[gift]=(G.seeds[gift]||0)+1;
  return {folk:f, text:f.story[L.idx], gift:CROPS[gift].name};
}
function sleepNight(){
  if(G.hour<DAY_END && isOpenWindow()) { toast('The day is not done yet.','#e0a0a0'); return false; }
  const dried=dryRackOvernight();
  G.day++; G.hour=DAY_START;
  G.visitors=[]; G.spawnTimer=12;
  clearSlots(); G.held=[];
  G.nightPanel=false;
  toast('Day '+G.day+'. The kettle is cold and the light is new.','#b3a0e0');
  if(dried) toast(dried+' essence'+(dried>1?'s':'')+' came off the drying rack.','#f0c04a');
  mercySeed();
  save();
  return true;
}
function isOpenWindow(){ return G.hour < DAY_END; }

// A cozy game must never dead-end. If you have no seeds, nothing growing, nothing
// in the basket and cannot afford the cheapest packet, someone leaves one for you.
function isDestitute(){
  const cheapest=Math.min(...CROP_IDS.map(id=>CROPS[id].seed));
  if(G.coins>=cheapest) return false;
  if(CROP_IDS.some(id=>(G.seeds[id]||0)>0)) return false;
  if(CROP_IDS.some(id=>(G.herbs[id]||0)>0)) return false;
  if(CROP_IDS.some(id=>(G.essences[id]||0)>0)) return false;
  if(G.rack&&G.rack.length) return false;
  if(G.plots.some(p=>p.crop)) return false;
  return true;
}
function mercySeed(){
  if(!isDestitute()) return false;
  G.seeds.mint=(G.seeds.mint||0)+2;
  toast('Someone left a packet of mint seeds on the step.','#9dc98c');
  return true;
}

//==============================================================
// VISITORS
//==============================================================
let nextVid=1;
function spawnVisitor(){
  const active=G.visitors.filter(v=>v.state!=='leaving');
  if(active.length>=queueMax()) return null;
  // nobody queues twice; regulars are likelier to drop in
  const here=new Set(active.map(v=>v.folk));
  const pool=[];
  for(const f of FOLK){
    if(here.has(f.id)) continue;
    pool.push(f);
    if(isRegular(f.id)) { pool.push(f); pool.push(f); }
  }
  if(!pool.length) return null;
  const f=pick(pool);
  const tea=TEAS[f.fav];
  const v={
    id:nextVid++, folk:f.id, name:f.name, color:f.color,
    tag:tea.tag, favKey:f.fav,
    state:'entering', walk:0, patience:patienceMax(), patienceMax:patienceMax(),
    slot:0, leaveT:0, happy:false, bob:Math.random()*6
  };
  const used=active.map(x=>x.slot);
  for(let s=0;s<queueMax();s++){ if(!used.includes(s)){ v.slot=s; break; } }
  G.visitors.push(v);
  return v;
}

//==============================================================
// UPDATE
//==============================================================
function update(dt){
  dt=Math.min(dt,0.05);
  G.t+=dt;

  // clock
  if(G.hour<DAY_END){
    const before=G.hour;
    G.hour=Math.min(DAY_END, G.hour + dt/SECONDS_PER_HOUR);
    const dh=G.hour-before;
    // plants
    for(const p of G.plots){
      if(!p.crop||p.ripe) continue;
      if(p.water>0){
        p.prog+=dh;
        p.water=Math.max(0,p.water-WATER_DRAIN*dh);
        if(p.prog>=CROPS[p.crop].hours) p.ripe=true;
      }
    }
  }

  // visitors
  if(isOpen() && G.room!==null){
    G.spawnTimer-=dt;
    if(G.spawnTimer<=0){
      G.spawnTimer=rnd(SPAWN_MIN,SPAWN_MAX);
      spawnVisitor();
    }
  }
  for(const v of G.visitors){
    v.bob+=dt;
    if(v.state==='entering'){
      v.walk+=dt/1.1;
      if(v.walk>=1){ v.walk=1; v.state='waiting'; }
    } else if(v.state==='waiting'){
      v.patience-=dt;
      if(v.patience<=0){
        v.state='leaving'; v.leaveT=0; v.happy=false;
        toast(v.name+' waited a long time, then went home.','#e0a0a0');
      }
    } else if(v.state==='leaving'){
      v.leaveT+=dt/1.2;
    }
  }
  G.visitors=G.visitors.filter(v=>!(v.state==='leaving'&&v.leaveT>=1));

  // toasts
  for(const t of G.toast) t.life-=dt;
  G.toast=G.toast.filter(t=>t.life>0);

  // motes
  if(G.motes.length<26 && Math.random()<dt*8){
    G.motes.push({x:rnd(0,W), y:rnd(H*0.2,H), vx:rnd(-6,6), vy:rnd(-14,-4),
      r:rnd(1,2.4), life:rnd(4,9), max:9});
  }
  for(const m of G.motes){
    m.x+=m.vx*dt; m.y+=m.vy*dt; m.life-=dt;
    m.vx+=Math.sin(G.t*0.7+m.y*0.01)*dt*3;
  }
  G.motes=G.motes.filter(m=>m.life>0 && m.y>-10);
}

// RENDER

const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');

let bgCache=null, bgKey='';
function skyColors(){
  const h=G.hour;
  // dawn 6-9, day 9-17, dusk 17-20, night 20-22
  let top,bot;
  if(h<9){ const t=(h-6)/3; top=mix('#3d3a5c','#8fb8d4',t); bot=mix('#c98c6a','#e8d6b0',t); }
  else if(h<17){ const t=(h-9)/8; top=mix('#8fb8d4','#7fa8c9',t); bot=mix('#e8d6b0','#e0d0a8',t); }
  else if(h<20){ const t=(h-17)/3; top=mix('#7fa8c9','#4a3f66',t); bot=mix('#e0d0a8','#d4885f',t); }
  else { const t=(h-20)/2; top=mix('#4a3f66','#1d1b30',t); bot=mix('#d4885f','#3a3050',t); }
  return [top,bot];
}
function mix(a,b,t){
  t=clamp(t,0,1);
  const pa=[parseInt(a.slice(1,3),16),parseInt(a.slice(3,5),16),parseInt(a.slice(5,7),16)];
  const pb=[parseInt(b.slice(1,3),16),parseInt(b.slice(3,5),16),parseInt(b.slice(5,7),16)];
  return 'rgb('+Math.round(lerp(pa[0],pb[0],t))+','+Math.round(lerp(pa[1],pb[1],t))+','+
    Math.round(lerp(pa[2],pb[2],t))+')';
}
function nightAmount(){
  const h=G.hour;
  if(h<7) return clamp((7-h)/1.5,0,1)*0.55;
  if(h>18) return clamp((h-18)/4,0,1)*0.6;
  return 0;
}

function buildBg(){
  const key=G.room+'|'+Math.floor(G.hour*2);
  if(bgKey===key && bgCache) return bgCache;
  bgKey=key;
  const oc=bgCache||document.createElement('canvas');
  oc.width=W; oc.height=H;
  const g=oc.getContext('2d');
  const [top,bot]=skyColors();
  const grad=g.createLinearGradient(0,0,0,H*0.62);
  grad.addColorStop(0,top); grad.addColorStop(1,bot);
  g.fillStyle=grad; g.fillRect(0,0,W,H*0.62);

  // stars
  const n=nightAmount();
  if(n>0.15){
    g.fillStyle='rgba(255,255,240,'+(n*0.8)+')';
    for(let i=0;i<40;i++){
      const x=(i*137.5)%W, y=((i*71.3)%(H*0.45));
      g.fillRect(x,y,1.6,1.6);
    }
  }
  // hills
  g.fillStyle='rgba(60,80,70,'+(0.5+n*0.3)+')';
  g.beginPath(); g.moveTo(0,H*0.6);
  for(let x=0;x<=W;x+=40) g.lineTo(x, H*0.52 + Math.sin(x*0.006)*22);
  g.lineTo(W,H); g.lineTo(0,H); g.fill();

  if(G.room==='garden'){
    g.fillStyle=mix('#4e6b3e','#2a3a26',n);
    g.fillRect(0,H*0.58,W,H*0.42);
    g.fillStyle=mix('#5a7846','#31432b',n);
    for(let i=0;i<70;i++){
      const x=(i*97.3)%W, y=H*0.6+((i*53.7)%(H*0.38));
      g.fillRect(x,y,3,5);
    }
  } else {
    // teahouse floor + wall
    g.fillStyle=mix('#4a3226','#2a1c16',n*0.5);
    g.fillRect(0,0,W,H);
    g.fillStyle=mix('#5c4030','#33241b',n*0.5);
    g.fillRect(0,H*0.55,W,H*0.45);
    g.strokeStyle='rgba(0,0,0,.18)'; g.lineWidth=2;
    for(let y=H*0.55;y<H;y+=26){ g.beginPath(); g.moveTo(0,y); g.lineTo(W,y); g.stroke(); }
    // window
    const [t2,b2]=skyColors();
    const wg=g.createLinearGradient(0,60,0,220);
    wg.addColorStop(0,t2); wg.addColorStop(1,b2);
    g.fillStyle=wg; g.fillRect(660,60,230,160);
    g.strokeStyle='#3a2820'; g.lineWidth=8; g.strokeRect(660,60,230,160);
    g.beginPath(); g.moveTo(775,60); g.lineTo(775,220);
    g.moveTo(660,140); g.lineTo(890,140); g.lineWidth=5; g.stroke();
  }
  bgCache=oc;
  return oc;
}

// ---- small drawing helpers ----
function rrect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function panel(x,y,w,h,alpha){
  ctx.fillStyle='rgba(28,20,16,'+(alpha||0.86)+')';
  rrect(x,y,w,h,10); ctx.fill();
  ctx.strokeStyle='rgba(200,170,120,.35)'; ctx.lineWidth=2; ctx.stroke();
}
// draw a label shrunk to fit maxW -- keeps long crop names off the price chips
function fitText(str,x,y,maxW,size,color,bold){
  let s=size;
  while(s>8){
    ctx.font=(bold?'bold ':'')+s+'px Georgia, serif';
    if(ctx.measureText(str).width<=maxW) break;
    s--;
  }
  ctx.fillStyle=color||'#f0e2cc'; ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.fillText(str,x,y);
}
function text(str,x,y,size,color,align,bold){
  ctx.font=(bold?'bold ':'')+size+'px Georgia, serif';
  ctx.fillStyle=color||'#f0e2cc';
  ctx.textAlign=align||'left'; ctx.textBaseline='middle';
  ctx.fillText(str,x,y);
}

// ---- plot geometry ----
const GX=90, GY=210, GW=124, GH=74;
const SEED_BUY_X=84, SEED_BUY_W=30;   // buy chip, relative to each seed button
function plotRect(i){
  const c=i%PLOT_COLS, r=(i/PLOT_COLS)|0;
  return {x:GX+c*GW, y:GY+r*GH, w:GW-14, h:GH-14};
}

function drawPlant(p,x,y,w,h){
  const c=CROPS[p.crop];
  const frac=clamp(p.prog/c.hours,0,1);
  const cx=x+w/2, base=y+h-8;
  const sway=Math.sin(G.t*1.2+x*0.05)*2*frac;
  ctx.strokeStyle=c.dark; ctx.lineCap='round';
  if(p.ripe){
    for(let i=-1;i<=1;i++){
      ctx.lineWidth=3;
      ctx.beginPath(); ctx.moveTo(cx+i*9,base);
      ctx.quadraticCurveTo(cx+i*11+sway,base-18,cx+i*13+sway,base-30); ctx.stroke();
      ctx.fillStyle=c.color;
      ctx.beginPath(); ctx.arc(cx+i*13+sway,base-33,6,0,7); ctx.fill();
    }
  } else if(frac>0.55){
    ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(cx,base); ctx.lineTo(cx+sway,base-22); ctx.stroke();
    ctx.fillStyle=c.dark;
    ctx.beginPath(); ctx.ellipse(cx-7+sway,base-16,7,4,-0.5,0,7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx+7+sway,base-20,7,4,0.5,0,7); ctx.fill();
  } else if(frac>0.2){
    ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.moveTo(cx,base); ctx.lineTo(cx+sway,base-12); ctx.stroke();
    ctx.fillStyle=c.dark;
    ctx.beginPath(); ctx.ellipse(cx+sway,base-13,5,3.5,0,0,7); ctx.fill();
  } else {
    ctx.fillStyle=c.dark;
    ctx.beginPath(); ctx.arc(cx,base-3,3,0,7); ctx.fill();
  }
}

function drawGarden(mx,my){
  const unlockedCount=G.plots.filter(x=>x.unlocked).length;
  for(let i=0;i<PLOT_COUNT;i++){
    const p=G.plots[i], r=plotRect(i);
    const hov = mx>=r.x&&mx<=r.x+r.w&&my>=r.y&&my<=r.y+r.h;
    if(!p.unlocked){
      ctx.fillStyle='rgba(20,26,18,.55)';
      rrect(r.x,r.y,r.w,r.h,6); ctx.fill();
      ctx.strokeStyle='rgba(140,150,120,.35)'; ctx.lineWidth=2; ctx.setLineDash([5,5]);
      ctx.stroke(); ctx.setLineDash([]);
      if(hov){
        const cost=PLOT_COST(unlockedCount);
        text(cost+'c',r.x+r.w/2,r.y+r.h/2,15,'#f0c04a','center',true);
      } else {
        text('overgrown',r.x+r.w/2,r.y+r.h/2,11,'rgba(200,210,180,.5)','center');
      }
      continue;
    }
    // soil
    const wet=p.crop?clamp(p.water/100,0,1):0;
    ctx.fillStyle=mix('#6b4d33','#3d2a1c',wet*0.8);
    rrect(r.x,r.y,r.w,r.h,6); ctx.fill();
    ctx.strokeStyle=hov?'rgba(240,220,170,.8)':'rgba(0,0,0,.3)';
    ctx.lineWidth=hov?2.5:1.5; ctx.stroke();

    if(p.crop){
      drawPlant(p,r.x,r.y,r.w,r.h);

      if(!p.ripe){
        ctx.fillStyle='rgba(0,0,0,.4)'; ctx.fillRect(r.x+6,r.y+r.h-7,r.w-12,4);

      } else {
        const pulse=0.5+Math.sin(G.t*3)*0.2;

        text('ripe',r.x+r.w/2,r.y+r.h-12,11,'rgba(240,192,74,'+(0.6+pulse*0.4)+')','center',true);
      }
    }
  }

  // seed bar
  panel(90,432,780,74);
  text('Seeds  (click to choose, then click a plot — click the price to buy one)',
    100,446,12,'rgba(240,226,204,.6)');
  let x=104;
  for(const id of CROP_IDS){
    const c=CROPS[id], sel=G.selSeed===id, have=G.seeds[id]||0;
    const bw=118;
    ctx.fillStyle=sel?'rgba(240,192,74,.22)':'rgba(255,255,255,.05)';
    rrect(x,460,bw,36,6); ctx.fill();
    if(sel){ ctx.strokeStyle='#f0c04a'; ctx.lineWidth=2; ctx.stroke(); }
    ctx.fillStyle=c.color;
    ctx.beginPath(); ctx.arc(x+16,478,7,0,7); ctx.fill();
    fitText(c.name,x+28,472,SEED_BUY_X-32,12,sel?'#f0e2cc':'rgba(240,226,204,.75)');
    text('x'+have,x+28,487,11,have>0?'#9dc98c':'rgba(224,160,160,.85)');
    // buy chip -- the only way a player can restock, so it must be visible
    const bx=x+SEED_BUY_X, afford=G.coins>=c.seed;
    ctx.fillStyle=afford?'rgba(240,192,74,.20)':'rgba(255,255,255,.04)';
    rrect(bx,465,SEED_BUY_W,26,5); ctx.fill();
    ctx.strokeStyle=afford?'rgba(240,192,74,.55)':'rgba(255,255,255,.10)';
    ctx.lineWidth=1.5; ctx.stroke();
    text('+',bx+SEED_BUY_W/2,472,11,afford?'#f0c04a':'rgba(240,226,204,.25)','center',true);
    text(c.seed+'c',bx+SEED_BUY_W/2,484,10,afford?'#f0c04a':'rgba(240,226,204,.25)','center');
    x+=bw+10;
  }
}

// ---- teahouse geometry ----
const KETTLE={x:150,y:300,w:120,h:110};
const SLOTS=[{x:300,y:318,s:52},{x:366,y:318,s:52}];
const CUPS=[{x:452,y:326},{x:524,y:326}];   // second cup needs the Second Kettle
// spaced so the 152px request bubbles never overlap each other.
// the fourth is bought in the shop; it sits left of the rest.
const STOOLS=[{x:520},{x:680},{x:840},{x:360}];
const COUNTER_Y=300;

function drawVisitor(v){
  const st=STOOLS[v.slot];
  let x=st.x, alpha=1, yoff=0;
  if(v.state==='entering'){ x=lerp(W+40,st.x,v.walk); }
  else if(v.state==='leaving'){ x=lerp(st.x,W+40,v.leaveT); alpha=1-v.leaveT*0.5; }
  const y=COUNTER_Y-6+Math.sin(v.bob*1.6)*1.5+yoff;
  ctx.globalAlpha=alpha;
  // body
  ctx.fillStyle=v.color;
  rrect(x-18,y-34,36,44,12); ctx.fill();
  // head
  ctx.fillStyle='#e8cfae';
  ctx.beginPath(); ctx.arc(x,y-46,14,0,7); ctx.fill();
  // hair
  ctx.fillStyle='rgba(60,40,30,.85)';
  ctx.beginPath(); ctx.arc(x,y-50,14,Math.PI,0); ctx.fill();
  // eyes
  ctx.fillStyle='#2a1c16';
  const blink=(Math.sin(v.bob*0.9)>0.97)?1:3;
  ctx.fillRect(x-6,y-48,2.5,blink); ctx.fillRect(x+4,y-48,2.5,blink);
  if(v.state==='leaving'&&v.happy){
    ctx.strokeStyle='#2a1c16'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(x,y-42,5,0.2,Math.PI-0.2); ctx.stroke();
  }
  // request bubble
  if(v.state==='waiting'){
    const bw=152, bh=70, bx=x-bw/2, by=y-148;
    ctx.fillStyle='rgba(250,242,226,.95)';
    rrect(bx,by,bw,bh,10); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x-7,by+bh); ctx.lineTo(x+7,by+bh); ctx.lineTo(x,by+bh+12); ctx.fill();
    text(v.name,bx+12,by+16,13,'#7a5a3a','left',true);
    const reg=isRegular(v.folk);
    if(reg){ // a small mark so you can see your regulars at a glance
      ctx.fillStyle='#c96f7a';
      ctx.beginPath(); ctx.arc(bx+bw-18,by+15,4,0,7); ctx.fill();
    }
    const known=G.discovered[v.favKey];
    const want = reg&&known ? ('"My usual — '+TEAS[v.favKey].name+'."')
               : known      ? ('"'+TEAS[v.favKey].name+', please."')
                            : ('"I would like '+TAG_WORD[v.tag]+'."');
    ctx.font='12px Georgia, serif'; ctx.fillStyle='#4a3226'; ctx.textAlign='left';
    wrapText(want,bx+12,by+34,bw-24,14);
    // patience
    const pf=clamp(v.patience/(v.patienceMax||PATIENCE),0,1);
    ctx.fillStyle='rgba(0,0,0,.15)'; ctx.fillRect(bx+12,by+bh-10,bw-24,3);
    ctx.fillStyle=pf>0.3?'#9dc98c':'#d4796f';
    ctx.fillRect(bx+12,by+bh-10,(bw-24)*pf,3);
  }
  ctx.globalAlpha=1;
}
function wrapText(str,x,y,maxW,lh){
  const words=str.split(' '); let line='', yy=y;
  for(const w of words){
    const test=line?line+' '+w:w;
    if(ctx.measureText(test).width>maxW && line){ ctx.fillText(line,x,yy); line=w; yy+=lh; }
    else line=test;
  }
  if(line) ctx.fillText(line,x,yy);
}

function drawTeahouse(mx,my){
  drawDecor();

  ctx.fillStyle='#3d332e';
  ctx.beginPath(); ctx.ellipse(k.x+k.w/2,k.y+18,44,10,0,0,7); ctx.fill();
  ctx.strokeStyle='#6a5a52'; ctx.lineWidth=6; ctx.lineCap='round';
  ctx.beginPath(); ctx.arc(k.x+k.w/2,k.y-52,22,Math.PI*0.15,Math.PI*0.85,true); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(k.x+k.w/2+42,k.y-26); ctx.lineTo(k.x+k.w/2+62,k.y-40); ctx.stroke();
  // steam
  for(let i=0;i<3;i++){

    ctx.strokeStyle='#f5ece0'; ctx.lineWidth=4;

    if(cup.strong){
      ctx.fillStyle='#f0c04a';
      ctx.beginPath(); ctx.arc(c.x-22,c.y-22,4,0,7); ctx.fill();
    }
    fitText(cup.name,c.x-34,c.y+30,68,11,cup.strong?'#f0c04a':'#f0e2cc',true);
  }
  if(G.held.length){
    text(G.held.length>1?'click a cup, then a guest':'click a guest to serve',
      488,CUPS[0].y+48,10,'rgba(240,226,204,.55)','center');

  // herb shelf
  panel(90,432,780,74);

function mixTagColor(tag){
  return {soothing:'#c9d4a8',warming:'#e0a066',sweet:'#f0c04a',
    deep:'#8a7ab0',floral:'#c9a8d4',bright:'#8fc98c'}[tag]||'#c9a86a';

// a gentle nudge toward whatever is actually actionable right now
function contextHint(){
  if(G.letters.length&&!isOpen()) return 'Someone left you a note. Press [N] for the evening.';
  if(G.hour>=DAY_END) return 'The day is done. [N] for the evening, [S] to sleep.';
  const anyHerb=CROP_IDS.some(id=>G.herbs[id]>0);
  const totalHerbs=CROP_IDS.reduce((n,id)=>n+G.herbs[id],0);
  if(G.room==='garden'){
    const ripe=G.plots.some(p=>p.ripe);
    if(ripe) return 'Something is ripe — click it to gather.';
    const dry=G.plots.some(p=>p.crop&&!p.ripe&&p.water<25);
    if(dry) return 'A bed is running dry. Click it to water.';
    const empty=G.plots.some(p=>p.unlocked&&!p.crop);
    const anySeed=CROP_IDS.some(id=>(G.seeds[id]||0)>0);
    if(empty&&!anySeed) return 'Out of seeds — click a price tag below to buy one.';
    if(empty) return 'Pick a seed below, then click an empty bed.';
    if(anyHerb) return 'Herbs in the basket — [Tab] to the teahouse.';
    return 'Everything is planted. Give it time.';
  }
  const waiting=G.visitors.filter(v=>v.state==='waiting');
  if(G.held.length) return G.held.length>1 ? 'Click a cup, then the guest it is for.'
                                           : 'Click a guest to hand them the cup.';
  if(G.slots[0]&&G.slots[1]) return 'Click the kettle to brew.';
  if(waiting.length&&totalHerbs>=2) return 'Someone is waiting — pick two herbs and brew.';
  if(waiting.length) return 'A guest is waiting, but the basket is bare. [Tab] to the garden.';
  if(totalHerbs>=2) return 'Brew a pair of herbs to find a new tea. [J] for the journal.';
  if(!isOpen()) return G.hour<8 ? 'The hollow opens at 8. Tend the garden until then.'
                                : 'The last guest has gone. Press [S] when you are ready to sleep.';
  return 'Grow herbs in the garden, then brew them here.';
}

function render(){
  ctx.drawImage(buildBg(),0,0);

  // motes
  for(const m of G.motes){

function toCanvas(e){
  const r=canvas.getBoundingClientRect();
  return {x:(e.clientX-r.left)*(W/r.width), y:(e.clientY-r.top)*(H/r.height)};
}
canvas.addEventListener('mousemove',e=>{ const p=toCanvas(e); mouse.x=p.x; mouse.y=p.y; });
canvas.addEventListener('mouseleave',()=>{ mouse.x=-1; mouse.y=-1; });

canvas.addEventListener('click',e=>{
  const p=toCanvas(e);
  if(G.journal){ G.journal=false; save(); return; }
  if(G.shop){ clickShop(p.x,p.y); save(); return; }
  if(G.guestbook){ clickGuestbook(p.x,p.y); save(); return; }
  if(G.nightPanel){ clickNight(p.x,p.y); save(); return; }
  if(G.room==='garden') clickGarden(p.x,p.y);
  else clickTeahouse(p.x,p.y);
  save();
});

function clickGarden(x,y){
  // seed bar
  if(y>=460&&y<=496){
    let bx=104;
    for(const id of CROP_IDS){
      if(x>=bx&&x<=bx+118){
        if(x>=bx+SEED_BUY_X){          // the price chip
          if(buySeed(id)) toast('Bought a '+CROPS[id].name+' seed.',CROPS[id].color);
          G.selSeed=id;
        } else {
          G.selSeed=id;
        }
        return;
      }
      bx+=128;
    }
  }
  for(let i=0;i<PLOT_COUNT;i++){
    const r=plotRect(i);
    if(x<r.x||x>r.x+r.w||y<r.y||y>r.y+r.h) continue;
    const pl=G.plots[i];
    if(!pl.unlocked){ unlockPlot(i); return; }
    if(!pl.crop){
      if(plant(i,G.selSeed)) G.hint='Water it, then let it grow. Time moves while you work.';
      return;
    }
    if(pl.ripe){ harvest(i); G.hint='Take herbs to the teahouse and brew a pair of them.'; return; }
    if(water(i)) return;
    toast('Already watered. It just needs time.','rgba(240,226,204,.7)');
    return;
  }
}
function inBox(b,x,y){ return x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h; }

function clickShop(x,y){
  if(!inBox(SHOP_BOX,x,y)){ G.shop=false; return; }
  for(let i=0;i<SHOP_ITEMS.length;i++){
    const r=shopRowRect(i);
    if(x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h){ buyItem(SHOP_ITEMS[i].id); return; }
  }
}
function clickGuestbook(x,y){
  if(!inBox(BOOK_BOX,x,y)) G.guestbook=false;
}
function clickNight(x,y){
  if(G.letterOpen){ G.letterOpen=null; return; }
  if(!inBox(NIGHT_BOX,x,y)){ G.nightPanel=false; return; }
  // a letter?
  for(let i=0;i<Math.min(G.letters.length,3);i++){
    const r=letterRowRect(i);
    if(x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h){
      const opened=readLetter(i);
      if(opened) G.letterOpen=opened;
      return;
    }
  }
  if(!G.owned.rack) return;
  // take something back off the rack
  for(let i=0;i<G.rack.length;i++){
    const s=RACK_SLOTS[i];
    if(x>=s.x&&x<=s.x+s.s&&y>=s.y&&y<=s.y+s.s){ rackTakeBack(i); return; }
  }
  // lay a herb on the rack
  let hx=NIGHT_BOX.x+40;
  for(const id of CROP_IDS){
    if(x>=hx&&x<=hx+88&&y>=NIGHT_BOX.y+312&&y<=NIGHT_BOX.y+342){
      if(!rackAdd(id)){
        toast(G.rack.length>=RACK_SIZE?'The rack is full.':'No '+CROPS[id].name+' to dry.','#e0a0a0');
      }
      return;
    }
    hx+=92;
  }
}

function clickTeahouse(x,y){
  // herb shelf -- left part is the fresh herb, the ✦ chip spends an essence
  if(y>=460&&y<=496){
    let bx=104;
    for(const id of CROP_IDS){
      if(x>=bx&&x<=bx+118){
        const wantEssence = x>=bx+SEED_BUY_X && (G.essences[id]||0)>0;
        if(!addSlot(id,wantEssence)){
          const bare=wantEssence?(G.essences[id]||0)<=0:(G.herbs[id]||0)<=0;
          toast(bare?('No '+CROPS[id].name+' to hand.'):'The kettle is full.','#e0a0a0');
        }
        return;
      }
      bx+=128;
    }
  }
  // slots (click to take back)
  for(let i=0;i<2;i++){
    const s=SLOTS[i];
    if(x>=s.x&&x<=s.x+s.s&&y>=s.y&&y<=s.y+s.s){
      const held=G.slots[i];
      if(held){ (held.strong?G.essences:G.herbs)[held.id]++; G.slots[i]=null; }
      return;
    }
  }
  // kettle
  const k=KETTLE;
  if(x>=k.x&&x<=k.x+k.w&&y>=k.y-70&&y<=k.y+40){ brew(); return; }
  // pick which cup to serve
  for(let i=0;i<G.held.length;i++){
    const c=CUPS[i]; if(!c) continue;
    if(x>=c.x-30&&x<=c.x+30&&y>=c.y-30&&y<=c.y+28){ G.selCup=i; return; }
  }
  // visitors
  for(const v of G.visitors){
    if(v.state!=='waiting') continue;
    const st=STOOLS[v.slot]; if(!st) continue;
    if(x>=st.x-34&&x<=st.x+34&&y>=COUNTER_Y-100&&y<=COUNTER_Y+20){
      if(G.held.length){
        serve(v.id,clamp(G.selCup,0,G.held.length-1));
        G.selCup=0;
      } else toast('Brew a cup first.','#e0a0a0');
      return;
    }
  }
}

window.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(k==='escape'){ G.journal=G.shop=G.guestbook=G.nightPanel=false; G.letterOpen=null; return; }
  if(k==='j'){ G.journal=!G.journal; G.shop=G.guestbook=G.nightPanel=false; return; }
  if(k==='b'){ G.shop=!G.shop; G.journal=G.guestbook=G.nightPanel=false; save(); return; }
  if(k==='g'){ G.guestbook=!G.guestbook; G.journal=G.shop=G.nightPanel=false; return; }
  if(k==='n'){
    if(isOpen()){ toast('The evening comes after the last guest.','#e0a0a0'); return; }
    G.nightPanel=!G.nightPanel; G.letterOpen=null;
    G.journal=G.shop=G.guestbook=false; return;
  }
  if(k==='s'){ sleepNight(); return; }        // works with the evening panel open
  if(anyPanelOpen()) return;
  if(k==='tab'){ e.preventDefault(); G.room=G.room==='garden'?'teahouse':'garden'; bgKey=''; save(); return; }
  if(k>='1'&&k<='6'){ G.selSeed=CROP_IDS[parseInt(k,10)-1]; return; }
});

//==============================================================
// LOOP
//==============================================================
let last=0, acc=0;
function frame(ts){
  if(!last) last=ts;
  let dt=(ts-last)/1000; last=ts;
  if(dt>0.25) dt=0.25;
  update(dt);
  render();
  acc+=dt;
  if(acc>5){ acc=0; save(); }
  requestAnimationFrame(frame);
}

if(!load()) G=newGame();
requestAnimationFrame(frame);

//==============================================================
// TEST HOOK
//==============================================================
globalThis.__LH={
  get G(){return G;}, set G(v){G=v;},
  newGame, update, plant, water, harvest, brew, serve, sleepNight,
  spawnVisitor, addSlot, clearSlots, buySeed, unlockPlot,
  CROPS, CROP_IDS, TEAS, TAGS, teaKey, teaFor, PLOT_COUNT, PLOT_COST,
  DAY_START, DAY_END, SECONDS_PER_HOUR, PATIENCE, render,
  plotRect, clickGarden, clickTeahouse, SPAWN_MIN, SPAWN_MAX, MAX_QUEUE,
  PANEL_Y:432, W, H, STOOLS, BUBBLE_W:152,
  SEED_BUY_X, SEED_BUY_W, isDestitute, mercySeed,
  FOLK, FOLK_BY_ID, REGULAR_AT, isRegular,
  SHOP_ITEMS, SHOP_BY_ID, buyItem, shopRowRect, clickShop, SHOP_BOX,
  clickGuestbook, BOOK_BOX, bookRowRect,
  rackAdd, rackTakeBack, dryRackOvernight, readLetter, RACK_SIZE, RACK_SLOTS,
  clickNight, NIGHT_BOX, letterRowRect,
  cupCapacity, patienceMax, queueMax, CUPS, TAG_WORD
};

})();
